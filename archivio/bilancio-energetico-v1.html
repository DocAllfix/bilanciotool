<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percorso Bilancio Energetico</title>
<style>
:root{
  --teal:#2E7D6B;--teal-dk:#1F5A4C;--teal-lt:#E6F1ED;--teal-mid:#4C9C88;
  --ink:#14201C;--ink-2:#4A5B55;--ink-3:#7D8C87;
  --bg:#FAFAF8;--card:#fff;--line:#E4E2DC;--line-2:#F0EEE9;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--teal);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1200px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:76ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--teal-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.icon{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-tea{background:var(--teal-lt);color:var(--teal-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--teal)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.derived{background:var(--teal-lt);border-radius:8px;padding:12px 14px}
.derived table td{border-bottom:1px solid rgba(31,90,76,.12)}
.derived table tr:last-child td{border-bottom:0}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.step:last-child{border-bottom:0}
.step:hover .stepname{color:var(--teal-dk)}
.stepno{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--line-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600}
.stepno.ok{background:var(--green);color:#fff}.stepno.mid{background:var(--amber);color:#fff}
.stepname{font-weight:600}.stepdesc{font-size:12.5px;color:var(--ink-3)}
.stepbar{width:110px;flex:0 0 110px}

/* ---- guida usi finali ---- */
.gbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--ink-3);font-size:12px;line-height:1;padding:0;flex:0 0 22px}
.gbtn:hover,.gbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.guide{background:var(--teal-lt);border-radius:9px;padding:16px 18px;margin:2px 0 6px}
.guide .def{font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.55}
.guide h5{margin:0 0 7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-dk)}
.guide ul{margin:0 0 12px;padding-left:17px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.guide ul li{margin-bottom:3px}
.guide .flag{background:#fff;border-left:3px solid var(--amber);border-radius:0 7px 7px 0;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.guide .ev{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.stimabox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:4px}
.stimabox .r{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.stimabox .r > div{flex:1;min-width:96px}
.stimabox label.f{margin-bottom:0}

/* ---- matrice di ripartizione ---- */
.mx{font-size:12.5px}
.mx th{padding:7px 6px;font-size:9.5px;line-height:1.25}
.mx td{padding:4px 6px}
.mx input[type=number]{padding:5px 7px;font-size:12.5px;text-align:right;font-family:var(--mono)}
.mx select{padding:5px 7px;font-size:12px}
.mx tr.tot td{background:var(--line-2);font-weight:600;border-bottom:0}
.mx tr.res td{background:var(--teal-lt);border-bottom:0}
.mx .un{font-size:9.5px;color:var(--ink-3);display:block;font-weight:400}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;margin-bottom:5px}
.chk:hover{border-color:var(--teal-mid)}
.chk input{width:auto;margin:0}

/* ---- interventi ---- */
.itv{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
.itv .hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.itv .hd input{font-weight:600}

/* ---- portafoglio ---- */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.pfc:hover{border-color:var(--teal-mid);box-shadow:0 2px 14px rgba(20,32,28,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--teal-lt);color:var(--teal-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden}
.pfc .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .bd{padding:0 16px 12px}
.pfc .stats{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--teal);color:var(--teal-dk);background:var(--teal-lt)}
.pfnew b{font-size:22px;font-weight:400}

/* ---- media ---- */
.media{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.media .thumb{width:130px;flex:0 0 130px;border-radius:7px;overflow:hidden;background:var(--line-2);display:flex;align-items:center;justify-content:center;min-height:86px}
.media .thumb img{width:100%;display:block}
.media .thumb svg{width:100%;height:auto}
.media .body{flex:1;min-width:0}
.mediabar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
figure.fig{margin:16px 0;break-inside:avoid}
figure.fig img{width:100%;display:block;border-radius:8px}
figure.fig svg{width:100%;height:auto}
figure.fig figcaption{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
figure.fig.half{width:52%;float:right;margin:6px 0 14px 22px}
.clear{clear:both}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---- documento ---- */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.doc .cover{background:var(--teal-dk);color:#fff;padding:52px 46px;position:relative}
.doc .cover.img{padding:0}
.doc .cover .hero{width:100%;height:270px;object-fit:cover;display:block;opacity:.9}
.doc .cover .over{padding:34px 46px}
.doc .cover .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.doc .cover h2{font-size:34px;margin:12px 0 6px;letter-spacing:-.8px;color:#fff}
.doc .cover p{margin:0;opacity:.85;font-size:14px}
.doc .cover .lg{position:absolute;top:22px;right:26px;background:#fff;border-radius:8px;padding:8px;max-width:118px}
.doc .cover .lg img{width:100%;display:block}
.doc .inner{padding:34px 46px 46px}
.doc h3{font-size:19px;margin:34px 0 4px;letter-spacing:-.3px;padding-top:18px;border-top:2px solid var(--teal);clear:both}
.doc h3:first-of-type{margin-top:0;border-top:0;padding-top:0}
.doc h4{font-size:14px;margin:20px 0 8px;color:var(--teal-dk)}
.doc p{margin:0 0 11px;line-height:1.65}
.doc table{margin:10px 0 6px}
.doc th{background:var(--line-2)}
.doc .note{font-size:11.5px;color:var(--ink-3);font-style:italic}
.doc .miss{color:var(--red);font-style:italic}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-254px;z-index:60;transition:left .2s}.side.open{left:0}
  .doc .inner,.doc .cover .over{padding:24px}
  figure.fig.half{width:100%;float:none;margin:16px 0}
  .media{flex-direction:column}.media .thumb{width:100%;flex:auto}
  .scrollx{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0}
  .doc h3{page-break-after:avoid}
  table,figure.fig{page-break-inside:avoid}
  body{background:#fff}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand" id="brandHome"><b>Bilancio Energetico</b><span>Percorso guidato · EN 16247 · ISO 50001</span></div>
  <div class="navgrp">Studio</div>
  <button class="nav" data-v="pf"><span class="st">▦</span> Portafoglio</button>
  <div class="navgrp" id="grpPercorso">Percorso</div>
  <button class="nav on" data-v="home"><span class="st">◇</span> Avanzamento</button>
  <button class="nav" data-v="sito"><span class="st" id="s1">1</span> Sito e perimetro</button>
  <button class="nav" data-v="vett"><span class="st" id="s2">2</span> Vettori energetici</button>
  <button class="nav" data-v="usi"><span class="st" id="s3">3</span> Usi finali</button>
  <button class="nav" data-v="enpi"><span class="st" id="s4">4</span> Indicatori</button>
  <button class="nav" data-v="int"><span class="st" id="s5">5</span> Interventi</button>
  <button class="nav" data-v="narr"><span class="st" id="s6">6</span> Racconto</button>
  <button class="nav" data-v="ver"><span class="st" id="s7">7</span> Verifica</button>
  <button class="nav" data-v="doc"><span class="st" id="s8">8</span> Bilancio</button>
  <div class="navgrp">Impostazioni</div>
  <button class="nav" data-v="conf"><span class="st">⚙</span> Fattori e archivio</button>
  <div class="navgrp">Aiuto</div>
  <button class="nav" data-v="guida"><span class="st">?</span> Guida all'uso</button>
  <div class="sidefoot">I dati restano su questo dispositivo. Esportali dal portafoglio per conservarli.</div>
</aside>
<div class="main">
  <div class="top">
    <button class="btn ghost sm" id="menuBtn" style="display:none">Menu</button>
    <select id="coSel" style="width:auto;min-width:210px;font-weight:600"></select>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)">Esercizio
      <select id="annoSel" style="width:auto;font-weight:600"></select></label>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn ghost sm" id="addCo">Nuovo sito</button>
      <button class="btn sm" id="printBtn">Stampa bilancio</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>
</div>
<div id="toast"></div>

<script>
/* ==========================================================
   VETTORI ENERGETICI
   ========================================================== */
const VETTORI=[
 {k:"ele",   n:"Energia elettrica prelevata dalla rete", u:"kWh", c:"E", col:"#1F5F8B"},
 {k:"ele_go",n:"di cui coperta da garanzie d'origine",   u:"kWh", c:"E", sub:true},
 {k:"fv",    n:"Energia elettrica autoprodotta e autoconsumata", u:"kWh", c:"E", rin:true, col:"#2E7D32"},
 {k:"gas",   n:"Gas naturale",                           u:"Smc", c:"T", col:"#B06E00"},
 {k:"gasolio",n:"Gasolio per riscaldamento e generatori",u:"l",   c:"T", col:"#8A7B5C"},
 {k:"gpl",   n:"GPL",                                    u:"kg",  c:"T", col:"#C79A4B"},
 {k:"olio",  n:"Olio combustibile",                      u:"kg",  c:"T", col:"#6E5C3E"},
 {k:"biomassa",n:"Biomassa legnosa (cippato o pellet)",  u:"t",   c:"T", rin:true, col:"#5E8C3A"},
 {k:"tlr",   n:"Calore da teleriscaldamento",            u:"kWh", c:"T", col:"#A05C5C"},
 {k:"vapore",n:"Vapore acquistato",                      u:"t",   c:"T", col:"#7E6FA8"},
 {k:"gasolio_t",n:"Gasolio per autotrazione",            u:"l",   c:"M", col:"#4A5B55"},
 {k:"benzina",n:"Benzina per autotrazione",              u:"l",   c:"M", col:"#96A29D"}
];
const CAT={E:{n:"Energia elettrica",c:"#1F5F8B"},T:{n:"Combustibili e calore",c:"#B06E00"},M:{n:"Autotrazione",c:"#4A5B55"}};
const VATT=VETTORI.filter(v=>!v.sub);

/* fattori: kWh per unità (potere calorifico inferiore), tep per unità (convenzione
   di cui alla circolare MISE/ENEA per le diagnosi), kgCO2e per unità */
const FATTORI_DEF={
 ele:      {kwh:1,    tep:0.000187, fe:0.2565},
 ele_go:   {kwh:1,    tep:0.000187, fe:0},
 fv:       {kwh:1,    tep:0.000187, fe:0},
 gas:      {kwh:9.72, tep:0.000836, fe:1.9755},
 gasolio:  {kwh:9.95, tep:0.000902, fe:2.6870},
 gpl:      {kwh:12.78,tep:0.001099, fe:2.9840},
 olio:     {kwh:11.40,tep:0.000980, fe:3.1500},
 biomassa: {kwh:3500, tep:0.301,    fe:0},
 tlr:      {kwh:1,    tep:0.000086, fe:0.2000},
 vapore:   {kwh:750,  tep:0.0645,   fe:0.2100},
 gasolio_t:{kwh:9.95, tep:0.000902, fe:2.6870},
 benzina:  {kwh:9.03, tep:0.000777, fe:2.3130}
};
const MKT_DEF=0.4570;

/* ==========================================================
   AREE FUNZIONALI E USI FINALI
   ========================================================== */
const AREE={
 P:{n:"Attività principali",c:"#1F5A4C",t:"t-tea",d:"Le lavorazioni che realizzano il prodotto o il servizio"},
 A:{n:"Servizi ausiliari",c:"#4C9C88",t:"t-grn",d:"Impianti che servono il processo senza trasformare il prodotto"},
 G:{n:"Servizi generali",c:"#1F5F8B",t:"t-blu",d:"Utenze dell'edificio e delle funzioni non produttive"},
 T:{n:"Trasporti",c:"#B06E00",t:"t-amb",d:"Movimentazione interna e flotta aziendale"}
};
const USI=[
 {id:"U01",a:"P",n:"Forni fusori e processi termici primari"},
 {id:"U02",a:"P",n:"Forni di mantenimento e trattamento termico"},
 {id:"U03",a:"P",n:"Macchine di formatura e lavorazione"},
 {id:"U04",a:"P",n:"Finitura, sbavatura, granigliatura"},
 {id:"U05",a:"P",n:"Essiccazione, preriscaldo, verniciatura"},
 {id:"U06",a:"P",n:"Altre lavorazioni di processo"},
 {id:"U07",a:"A",n:"Aria compressa"},
 {id:"U08",a:"A",n:"Produzione del freddo e raffreddamento di processo"},
 {id:"U09",a:"A",n:"Pompaggi e circolazione fluidi"},
 {id:"U10",a:"A",n:"Ventilazione e aspirazione fumi"},
 {id:"U11",a:"A",n:"Trattamento acque e reflui"},
 {id:"U12",a:"A",n:"Generazione di vapore e acqua calda di processo"},
 {id:"U13",a:"G",n:"Riscaldamento degli ambienti"},

/* accessori di lettura */
const box=(o,y)=>{o[y]=o[y]||{};return o[y];};
const gq=(a,y,k)=>{const v=box(a.cons,y)[k];const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
const hq=(a,y,k)=>{const v=box(a.cons,y)[k];return v!==undefined&&v!=="";};
const gc=(a,y,k)=>{const v=box(a.costi,y)[k];const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
const hc=(a,y,k)=>{const v=box(a.costi,y)[k];return v!==undefined&&v!=="";};
const gd=(a,y,k)=>{const v=box(a.driver,y)[k];const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
const hd=(a,y,k)=>{const v=box(a.driver,y)[k];return v!==undefined&&v!=="";};
function grip(a,y,u,k){const r=box(a.rip,y);r[u]=r[u]||{};const v=r[u][k];
  const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;}
function srip(a,y,u,k,v){const r=box(a.rip,y);r[u]=r[u]||{};r[u][k]=v;}
function gmens(a,y,k){const m=box(a.mens,y);if(!Array.isArray(m[k]))m[k]=new Array(12).fill("");return m[k];}
const usiAttivi=a=>USI.filter(u=>a.usi.indexOf(u.id)>=0);
function nar(a,id){let v=a.narrativa[id];
  if(typeof v==="string")v={testo:v,media:[]};

  a.narrativa[id]=v;return v;}

function drivers(a,y){const r={};DRIVER.forEach(d=>r[d.k]=gd(a,y,d.k));return r;}

function derive(a,y){
  const f=a.fattori,rr=(x,d=1)=>Math.round(x*Math.pow(10,d))/Math.pow(10,d);
  const vet={};let kwh=0,tep=0,co2=0,cost=0,kwhE=0,kwhT=0,kwhM=0,rin=0,s1=0,s2l=0;
  VATT.forEach(v=>{
    const ff=f[v.k]||{kwh:0,tep:0,fe:0},q=gq(a,y,v.k);
    const e=q*ff.kwh,t=q*ff.tep,c=q*ff.fe/1000,eu=gc(a,y,v.k);
    vet[v.k]={q,kwh:e,tep:t,co2:c,cost:eu,eur_kwh:e>0?eu/e:0};
    kwh+=e;tep+=t;co2+=c;cost+=eu;
    if(v.c==="E")kwhE+=e;else if(v.c==="T")kwhT+=e;else kwhM+=e;
    if(v.rin)rin+=e;
    if(v.k==="ele")s2l+=c;else if(!v.rin||v.k==="biomassa")s1+=c;
  });
  const go=gq(a,y,"ele_go");
  const s2m=Math.max(0,gq(a,y,"ele")-go)*a.mkt/1000;
  rin+=Math.min(go,gq(a,y,"ele"))*(f.ele?f.ele.kwh:1);

  /* ripartizione */
  const alloc={},quad={};let quadOk=0,quadN=0;
  VATT.forEach(v=>{
    let s=0;usiAttivi(a).forEach(u=>s+=grip(a,y,u.id,v.k));
    alloc[v.k]=s;
    const inp=vet[v.k].q,res=inp-s,pct=inp>0?res/inp*100:0;
    const attivo=inp>0||s>0;
    quad[v.k]={inp,al:s,res,pct,ok:inp>0?Math.abs(pct)<=2:s===0,attivo};
    if(attivo){quadN++;if(quad[v.k].ok)quadOk++;}
  });
  const usi={},aree={P:0,A:0,G:0,T:0};let kwhUsi=0;
  usiAttivi(a).forEach(u=>{
    let e=0,t=0,c=0,eu=0;
    VATT.forEach(v=>{const q=grip(a,y,u.id,v.k),ff=f[v.k]||{kwh:0,tep:0,fe:0};
      e+=q*ff.kwh;t+=q*ff.tep;c+=q*ff.fe/1000;eu+=q*ff.kwh*(vet[v.k].eur_kwh||0);});
    usi[u.id]={kwh:e,tep:t,co2:c,cost:eu};kwhUsi+=e;aree[u.a]+=e;
  });
  Object.keys(usi).forEach(k=>usi[k].pct=kwhUsi>0?usi[k].kwh/kwhUsi*100:0);

  /* mensile */
  const mens={E:new Array(12).fill(0),T:new Array(12).fill(0),M:new Array(12).fill(0)};
  let mensTot=0;
  VATT.forEach(v=>{const arr=gmens(a,y,v.k),ff=f[v.k]||{kwh:0};
    arr.forEach((x,i)=>{const e=fnum(x)*ff.kwh;mens[v.c][i]+=e;mensTot+=e;});});

  const r=drivers(a,y);
  const base={kwh,tep,co2,cost,kwhE,kwhT,kwhM};
  const enpi={};ENPI.forEach(e=>enpi[e.k]=e.f(base,r));

  return {vet,kwh:rr(kwh,0),tep:rr(tep,2),co2:rr(co2,2),cost:rr(cost,0),
    kwhE:rr(kwhE,0),kwhT:rr(kwhT,0),kwhM:rr(kwhM,0),
    gj:rr(kwh*0.0036,1),rin:rr(rin,0),pctRin:kwh>0?rr(rin/kwh*100,1):0,

    alloc,quad,quadOk,quadN,quadPct:quadN?rr(quadOk/quadN*100,0):0,
    usi,aree,kwhUsi:rr(kwhUsi,0),copertura:kwh>0?rr(kwhUsi/kwh*100,1):0,
    mens,mensTot:rr(mensTot,0),enpi,dr:r};
}

/* interventi */
function calcInt(a,y,i){
  const f=a.fattori[i.vk]||{kwh:0,tep:0,fe:0},d=derive(a,y);
  const q=fnum(i.qta),inv=fnum(i.inv),inc=fnum(i.inc);
  const kwh=q*f.kwh,tep=q*f.tep,co2=q*f.fe/1000;
  const pu=d.vet[i.vk]?d.vet[i.vk].eur_kwh:0;
  const risp=kwh*pu;
  const netto=Math.max(0,inv-inc);
  return {kwh,tep,co2,risp,inv,inc,netto,pbt:risp>0?netto/risp:0,
    pct:d.kwh>0?kwh/d.kwh*100:0,tee:tep};
}
function totInt(a,y){
  const t={kwh:0,tep:0,co2:0,risp:0,inv:0,netto:0,n:0};
  a.interventi.forEach(i=>{const c=calcInt(a,y,i);
    t.kwh+=c.kwh;t.tep+=c.tep;t.co2+=c.co2;t.risp+=c.risp;t.inv+=c.inv;t.netto+=c.netto;t.n++;});
  t.pbt=t.risp>0?t.netto/t.risp:0;
  return t;
}

function stato(a,y){
  const p=a.profilo,pf=["forma","sede","settore","ateco","sito","attivita","referente"];
  const s1=pf.filter(k=>p[k]).length/pf.length;
  const att=VATT.filter(v=>gq(a,y,v.k)>0);
  const s2=att.length?(0.5+0.5*att.filter(v=>hc(a,y,v.k)).length/att.length):0;
  const d=derive(a,y);
  const ua=usiAttivi(a);
  const qs=d.quadN?d.quadOk/d.quadN:0;
  const ms=ua.length?ua.filter(u=>a.metodo[u.id]).length/ua.length:0;
  const s3=att.length?(0.65*qs+0.35*ms):0;
  const s4=DRIVER.filter(x=>hd(a,y,x.k)).length/DRIVER.length;
  const s5=Math.min(1,a.interventi.filter(i=>fnum(i.qta)>0&&i.n).length/3);
  const s6=NARR.filter(n=>(nar(a,n.id).testo||"").trim().length>80).length/NARR.length;
  const s7=(s1+s2+s3+s4+s5+s6)/6;
  return {s1,s2,s3,s4,s5,s6,s7,tot:Math.round(s7*100)};
}

/* ---- Sankey vettori → aree funzionali ---- */
function chSankey(a,y){
  const d=derive(a,y),f=a.fattori;
  const flows=[];
  const Lm={},Rm={P:0,A:0,G:0,T:0};
  VATT.forEach(v=>{
    const per={P:0,A:0,G:0,T:0};
    usiAttivi(a).forEach(u=>{per[u.a]+=grip(a,y,u.id,v.k)*(f[v.k]?f[v.k].kwh:0);});
    const tot=per.P+per.A+per.G+per.T;
    if(tot<=0)return;
    Lm[v.k]=tot;
    ["P","A","G","T"].forEach(ar=>{if(per[ar]>0){flows.push({l:v.k,r:ar,v:per[ar]});Rm[ar]+=per[ar];}});
  });
  const L=VATT.filter(v=>Lm[v.k]>0).map(v=>({k:v.k,n:v.n,c:v.col||"#4C9C88",v:Lm[v.k]}));
  const R=["P","A","G","T"].filter(k=>Rm[k]>0).map(k=>({k,n:AREE[k].n,c:AREE[k].c,v:Rm[k]}));
  const W=680,H=Math.max(300,60+L.length*46),pad=26,nw=11,xL=232,xR=452;
  if(!L.length)return `<svg viewBox="0 0 ${W} 140" xmlns="http://www.w3.org/2000/svg" ${CFONT}><text x="${W/2}" y="74" font-size="12" fill="#7D8C87" text-anchor="middle">Nessuna ripartizione inserita al passo 3</text></svg>`;
  const tot=L.reduce((s,x)=>s+x.v,0)||1;
  const avL=H-2*pad-8*(L.length-1),avR=H-2*pad-8*(R.length-1);
  const hL=v=>Math.max(3,v/tot*avL),hR=v=>Math.max(3,v/tot*avR);
  let yy=pad;const posL={};L.forEach(n=>{posL[n.k]={y:yy,h:hL(n.v),off:0,c:n.c};yy+=hL(n.v)+8;});
  yy=pad;const posR={};R.forEach(n=>{posR[n.k]={y:yy,h:hR(n.v),off:0,c:n.c};yy+=hR(n.v)+8;});
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" ${CFONT}>`;
  flows.sort((p,q)=>q.v-p.v).forEach(fl=>{
    const l=posL[fl.l],r=posR[fl.r];if(!l||!r)return;
    const h1=fl.v/tot*avL,h2=fl.v/tot*avR;
    const y1=l.y+l.off,y2=r.y+r.off;l.off+=h1;r.off+=h2;
    const x1=xL+nw,x2=xR,mid=(x1+x2)/2;
    s+=`<path d="M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2} L${x2} ${y2+h2} C${mid} ${y2+h2} ${mid} ${y1+h1} ${x1} ${y1+h1} Z" fill="${l.c}" opacity="0.34"/>`;
  });
  L.forEach(n=>{const p=posL[n.k];
    s+=`<rect x="${xL}" y="${p.y}" width="${nw}" height="${p.h}" fill="${n.c}" rx="2"/>
        <text x="${xL-9}" y="${p.y+p.h/2-1}" font-size="11" fill="#14201C" text-anchor="end">${esc(cut(n.n,34))}</text>
        <text x="${xL-9}" y="${p.y+p.h/2+11}" font-size="9.5" fill="#7D8C87" text-anchor="end">${fmt(n.v)} kWh · ${fmt(n.v/tot*100,1)}%</text>`;});
  R.forEach(n=>{const p=posR[n.k];
    s+=`<rect x="${xR-nw}" y="${p.y}" width="${nw}" height="${p.h}" fill="${n.c}" rx="2"/>
        <text x="${xR+8}" y="${p.y+p.h/2-1}" font-size="11.5" fill="#14201C" font-weight="600">${esc(n.n)}</text>
        <text x="${xR+8}" y="${p.y+p.h/2+12}" font-size="9.5" fill="#7D8C87">${fmt(n.v)} kWh · ${fmt(n.v/tot*100,1)}%</text>`;});
  s+=`<text x="${xL+nw/2}" y="14" font-size="9.5" fill="#7D8C87" text-anchor="middle">vettori</text>
      <text x="${xR-nw/2}" y="14" font-size="9.5" fill="#7D8C87" text-anchor="middle">aree funzionali</text>`;
  return s+"</svg>";
}

                <div class="code">= ${fmt(kwhSt)} kWh${fk!==1?` · ${fmt(kwhSt/fk,1)} ${(VETTORI.find(v=>v.k===vk)||{}).u}`:""}</div>
                <button class="btn ghost sm" data-stapply="${u.id}" ${kwhSt>0?"":"disabled"}>Scrivi nella riga come stima</button>
              </div>
            </div>
          </div>
        </div>
        <div class="ev"><b>Dove trovare i dati:</b> ${esc(g.ev)}</div>
      </div></td></tr>`;};
  const rows=[];
  ["P","A","G","T"].forEach(ar=>{
    const list=ua.filter(u=>u.a===ar);if(!list.length)return;
    rows.push(`<tr><td colspan="${nc}" style="background:var(--line-2);padding:6px 10px">
      <b style="font-size:12.5px">${AREE[ar].n}</b> <span class="code">${esc(AREE[ar].d)}</span>
      <span style="float:right" class="code">${fmt(d.aree[ar])} kWh · ${d.kwhUsi>0?fmt(d.aree[ar]/d.kwhUsi*100,1):"0"}%</span></td></tr>`);
    list.forEach(u=>{
      const ap=openGuide===u.id,met=a.metodo[u.id]||"";
      rows.push(`<tr${ap?' style="background:var(--teal-lt)"':""}>
        <td><button class="gbtn ${ap?"on":""}" data-guide="${u.id}" title="Come si determina questo uso finale">?</button></td>
        <td><b style="font-weight:500">${esc(u.n)}</b><div class="code">${u.id}</div></td>
        ${cols.map(v=>`<td><input type="number" step="any" data-r="${u.id}" data-vk="${v.k}" value="${esc((box(a.rip,y)[u.id]||{})[v.k]===undefined?"":(box(a.rip,y)[u.id]||{})[v.k])}"></td>`).join("")}
        <td class="num">${fmt(d.usi[u.id].kwh)}</td>
        <td class="num code">${fmt(d.usi[u.id].pct,1)}%</td>
        <td><select data-met="${u.id}"><option value="">—</option>${METODI.map(m=>`<option value="${m.v}" ${met===m.v?"selected":""}>${m.n}</option>`).join("")}</select></td></tr>`);
      if(ap)rows.push(panel(u));
    });
  });
  return `<h1>3 · Usi finali</h1>
  <p class="sub">È il passaggio che trasforma una raccolta di bollette in un bilancio energetico: attribuire ogni quantità entrata nel sito all'utenza che l'ha consumata. I valori si inseriscono nell'unità di misura del vettore, la stessa del passo 2. Il pulsante <b>?</b> accanto a ogni uso apre la scheda con i criteri di determinazione e un calcolatore di stima.</p>

  <div class="grid g2">
    <div class="card"><p class="eyebrow">Flusso dell'energia</p>${chSankey(a,y)}</div>
    <div class="card"><p class="eyebrow">Quadratura per vettore</p>
      <table><thead><tr><th>Vettore</th><th class="num">Ingresso</th><th class="num">Ripartito</th><th class="num">Residuo</th><th style="width:74px">Esito</th></tr></thead>
      <tbody>${VATT.filter(v=>d.quad[v.k].attivo).map(v=>{const q=d.quad[v.k];
        return `<tr><td>${esc(cut(v.n,30))} <span class="code">${v.u}</span></td>
          <td class="num">${fmt(q.inp,q.inp<100?1:0)}</td><td class="num">${fmt(q.al,q.al<100?1:0)}</td>
          <td class="num">${fmt(q.res,Math.abs(q.res)<100?1:0)}</td>
          <td>${q.ok?'<span class="tag t-grn">chiuso</span>':`<span class="tag ${Math.abs(q.pct)<=10?"t-amb":"t-red"}">${fmt(q.pct,1)}%</span>`}</td></tr>`;}).join("")
        ||'<tr><td colspan="5" class="empty">Nessun vettore valorizzato al passo 2.</td></tr>'}</tbody></table>
      <div class="hint">Il bilancio è chiuso quando il residuo di ogni vettore sta entro il 2%. Un residuo positivo significa che c'è un'utenza non ancora attribuita; uno negativo che hai contato due volte la stessa energia.</div>
      <div class="hr"></div>
      <div class="derived"><table><tbody>
        <tr><td style="border:0;padding:5px 0;font-size:12.5px">Energia ripartita</td><td class="num" style="border:0;padding:5px 0"><b>${fmt(d.kwhUsi)}</b> <span class="code">kWh</span></td></tr>
        <tr><td style="border:0;padding:5px 0;font-size:12.5px">Copertura sul totale in ingresso</td><td class="num" style="border:0;padding:5px 0"><b>${fmt(d.copertura,1)}</b> <span class="code">%</span></td></tr>
      </tbody></table></div>
    </div>
  </div>

  <div class="card" style="padding:6px 0">
    ${cols.length?`<div class="scrollx"><table class="mx"><thead><tr><th style="width:32px"></th><th style="min-width:210px">Uso finale</th>
      ${cols.map(v=>`<th class="num">${esc(cut(v.n,20))}<span class="un">${v.u}</span></th>`).join("")}
      <th class="num" style="width:88px">kWh</th><th class="num" style="width:56px">%</th><th style="width:112px">Metodo</th></tr></thead>
    <tbody>${rows.join("")}
      <tr class="tot"><td></td><td>Totale ripartito</td>
        ${cols.map(v=>`<td class="num">${fmt(d.alloc[v.k],d.alloc[v.k]<100?1:0)}</td>`).join("")}
        <td class="num">${fmt(d.kwhUsi)}</td><td class="num">100%</td><td></td></tr>
      <tr class="res"><td></td><td>Residuo non attribuito</td>
        ${cols.map(v=>`<td class="num" style="color:${d.quad[v.k].ok?"var(--green)":"var(--red)"}">${fmt(d.quad[v.k].res,Math.abs(d.quad[v.k].res)<100?1:0)}</td>`).join("")}
        <td class="num">${fmt(d.kwh-d.kwhUsi)}</td><td></td><td></td></tr>
    </tbody></table></div>`
    :`<div class="empty">Compila prima il passo 2: le colonne compaiono per i vettori con un consumo inserito.</div>`}
  </div>

  <div class="card"><p class="eyebrow">Usi finali attivi</p>
    <div class="hint" style="margin:0 0 12px">Tieni accesi solo gli usi che esistono davvero nel sito: un elenco lungo di righe a zero rende il bilancio illeggibile e non aggiunge nulla.</div>
    <div class="grid g4">${["P","A","G","T"].map(ar=>`<div>
      <p class="eyebrow" style="color:${AREE[ar].c}">${AREE[ar].n}</p>
      ${USI.filter(u=>u.a===ar).map(u=>`<label class="chk"><input type="checkbox" data-uso="${u.id}" ${a.usi.indexOf(u.id)>=0?"checked":""}> ${esc(u.n)}</label>`).join("")}
    </div>`).join("")}</div>

}

/* ---------- 4 indicatori ---------- */
function vEnpi(a,st){
  const y=anno,b=a.baseline,d=derive(a,y),db=derive(a,b);
  const anni=[a.anno+1,a.anno,a.anno-1,a.anno-2,a.anno-3];
  const drow=x=>`<tr><td><b style="font-weight:500">${esc(x.n)}</b>${x.h?`<div class="hint">${esc(x.h)}</div>`:""}</td>
    <td style="width:52px" class="code">${x.u==="unità"?esc(cut(a.profilo.unitaProd||"unità",14)):x.u}</td>
    <td style="width:130px"><input type="number" step="any" data-d="${x.k}" data-y="${y}" value="${esc(box(a.driver,y)[x.k]===undefined?"":box(a.driver,y)[x.k])}"></td>
    <td style="width:130px"><input type="number" step="any" data-d="${x.k}" data-y="${b}" value="${esc(box(a.driver,b)[x.k]===undefined?"":box(a.driver,b)[x.k])}" style="background:var(--bg)"></td></tr>`;
  const mensE=d.mens.E.filter(v=>v>0);
  const baseLoad=mensE.length>=6?Math.min.apply(null,mensE)*12:0;
  const erow=e=>{
    const c=d.enpi[e.k],p=db.enpi[e.k];
    const dl=(c>0&&p>0)?(c-p)/p*100:null;
    const good=dl!==null&&dl*e.verso>0;
    return `<tr><td><b style="font-weight:500">${esc(e.n)}</b>${e.h?`<div class="hint">${esc(e.h)}</div>`:""}</td>
      <td class="code" style="width:120px">${e.u==="kWh/unità"||e.u==="tep/unità"||e.u==="€/unità"||e.u==="kgCO₂e/unità"?esc(e.u.replace("unità",cut(a.profilo.unitaProd||"unità",10))):e.u}</td>
      <td class="num">${c>0?fmt(c,e.d):"—"}</td>
      <td class="num" style="color:var(--ink-3)">${p>0?fmt(p,e.d):"—"}</td>
      <td class="num">${dl===null?"—":`<span class="tag ${good?"t-grn":"t-red"}">${dl>0?"+":""}${fmt(dl,1)}%</span>`}</td></tr>`;};
  return `<h1>4 · Indicatori di prestazione</h1>
  <p class="sub">Un consumo assoluto non dice se il sito lavora bene: dice solo quanto ha prodotto. Gli indicatori rapportano l'energia alle variabili che la determinano — la produzione, la superficie, il clima, le ore — e permettono il confronto con l'anno base.</p>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <div><h2 style="margin:0">Variabili di riferimento</h2><span class="code">i denominatori degli indicatori · ${st.s4>=.99?"complete":"da completare"}</span></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)">Anno base
        <select data-base style="width:auto;font-weight:600">${anni.map(v=>`<option value="${v}" ${v===b?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <table><thead><tr><th>Variabile</th><th>Unità</th><th>${y}</th><th>${b} (base)</th></tr></thead>
    <tbody>${DRIVER.map(drow).join("")}</tbody></table>
    <div class="hint">L'anno base è il termine di paragone di tutto il documento. Sceglilo tra gli anni per cui hai dati completi e non cambiarlo più: se cambia il riferimento, i confronti degli anni precedenti perdono significato.</div>
  </div>
  <div class="card">
    <h2>Indicatori calcolati</h2>
    <table><thead><tr><th>Indicatore</th><th>Unità</th><th class="num">${y}</th><th class="num">${b}</th><th class="num" style="width:96px">Variazione</th></tr></thead>
    <tbody>${ENPI.map(erow).join("")}</tbody></table>
  </div>
  <div class="grid g2">
    <div class="card"><p class="eyebrow">Confronto con l'anno base</p>${chEnpi(a,y)}</div>
    <div class="card"><p class="eyebrow">Consumo di base</p>
      ${baseLoad>0?`<div class="derived"><table><tbody>
        <tr><td style="border:0;padding:5px 0;font-size:12.5px">Mese elettrico più basso, annualizzato</td><td class="num" style="border:0;padding:5px 0"><b>${fmt(baseLoad)}</b> <span class="code">kWh</span></td></tr>
        <tr><td style="border:0;padding:5px 0;font-size:12.5px">Quota sul consumo elettrico dell'anno</td><td class="num" style="border:0;padding:5px 0"><b>${d.kwhE>0?fmt(baseLoad/d.kwhE*100,1):"—"}</b> <span class="code">%</span></td></tr>
      </tbody></table></div>
      <div class="hint">È una stima grossolana dell'energia che il sito consuma comunque, anche a produzione ferma: illuminazione permanente, server, aspirazioni, stand-by, perdite d'aria compressa. Sopra il 30% dei consumi elettrici c'è quasi sempre margine di intervento senza toccare il processo.</div>`
      :`<div class="empty">Compila almeno sei mesi di consumi elettrici al passo 2 per ottenere la stima del consumo di base.</div>`}
      <div class="hr"></div>
      ${chMens(a,y)}
    </div>
  </div>`;
}

/* ---------- 5 interventi ---------- */
const STATI=["Proposto","Valutato","Approvato","In corso","Realizzato","Scartato"];
function vInt(a){
  const y=anno,d=derive(a,y),t=totInt(a,y);
  const card=(i,idx)=>{const c=calcInt(a,y,i),v=VETTORI.find(x=>x.k===i.vk)||VATT[0];
    return `<div class="itv">
      <div class="hd">
        <span class="code" style="flex:0 0 34px">${String(idx+1).padStart(2,"0")}</span>
        <input type="text" data-i="n" data-idx="${idx}" value="${esc(i.n||"")}" placeholder="Descrizione dell'intervento">
        <select data-i="stato" data-idx="${idx}" style="width:130px">${STATI.map(s=>`<option ${i.stato===s?"selected":""}>${s}</option>`).join("")}</select>
        <button class="btn ghost icon" data-idel="${idx}" title="Elimina">✕</button>
      </div>
      <div class="grid g4">
        <label class="f"><span>Vettore risparmiato</span><select data-i="vk" data-idx="${idx}">
          ${VATT.map(x=>`<option value="${x.k}" ${i.vk===x.k?"selected":""}>${esc(cut(x.n,28))}</option>`).join("")}</select></label>
        <label class="f"><span>Risparmio annuo <span class="code">${v.u}</span></span><input type="number" step="any" data-i="qta" data-idx="${idx}" value="${esc(i.qta||"")}"></label>
        <label class="f"><span>Investimento €</span><input type="number" step="any" data-i="inv" data-idx="${idx}" value="${esc(i.inv||"")}"></label>
        <label class="f"><span>Incentivo atteso €</span><input type="number" step="any" data-i="inc" data-idx="${idx}" value="${esc(i.inc||"")}"></label>
      </div>
      <div class="grid g2" style="margin-top:-4px">
        <label class="f"><span>Uso finale interessato</span><select data-i="uso" data-idx="${idx}">
          <option value="">—</option>${USI.map(u=>`<option value="${u.id}" ${i.uso===u.id?"selected":""}>${esc(u.n)}</option>`).join("")}</select></label>
        <label class="f"><span>Anno previsto di realizzazione</span><input type="text" data-i="anno" data-idx="${idx}" value="${esc(i.anno||"")}"></label>
      </div>
      <label class="f"><span>Note tecniche e ipotesi di calcolo</span><textarea data-i="note" data-idx="${idx}" style="min-height:60px" placeholder="Da dove viene il risparmio stimato, quali ipotesi sono state fatte, quali verifiche restano da fare">${esc(i.note||"")}</textarea></label>
      <div class="derived"><table><tbody><tr>
        <td style="border:0;padding:4px 0;font-size:12px">Risparmio <b class="code">${fmt(c.kwh)} kWh</b> · <b class="code">${fmt(c.tep,2)} tep</b> · <b class="code">${fmt(c.co2,2)} tCO₂e</b> · <b class="code">${fmt(c.pct,1)}%</b> del consumo</td>
        <td class="num" style="border:0;padding:4px 0">${fmt(c.risp)} €/anno · <b>${c.pbt>0?fmt(c.pbt,1)+" anni":"—"}</b> <span class="code">di ritorno</span></td>
      </tr></tbody></table></div>
    </div>`;};
  return `<h1>5 · Interventi di miglioramento</h1>
  <p class="sub">Ogni intervento va quantificato nell'unità del vettore che fa risparmiare: il valore economico e il tempo di ritorno si calcolano dal costo unitario dell'energia ricavato al passo 2. Un intervento senza numeri non è una proposta, è un'intenzione.</p>
  <div class="grid g4">
    <div class="card kpi"><div class="l">Risparmio complessivo</div><div class="n">${fmt(t.kwh)}</div><div class="h">kWh/anno · ${d.kwh>0?fmt(t.kwh/d.kwh*100,1):"—"}% del consumo</div></div>
    <div class="card kpi"><div class="l">Beneficio economico</div><div class="n">${fmt(Math.round(t.risp/1000))}</div><div class="h">k€/anno</div></div>
    <div class="card kpi"><div class="l">Investimento</div><div class="n">${fmt(Math.round(t.inv/1000))}</div><div class="h">k€ · netto incentivi ${fmt(Math.round(t.netto/1000))} k€</div></div>
    <div class="card kpi"><div class="l">Ritorno medio</div><div class="n">${t.pbt>0?fmt(t.pbt,1):"—"}</div><div class="h">anni · ${fmt(t.tep,1)} tep risparmiati</div></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn" id="addInt">＋ Nuovo intervento</button>
    ${a.interventi.length?'<button class="btn ghost" id="sortInt">Ordina per tempo di ritorno</button>':""}</div>
  ${a.interventi.length?a.interventi.map(card).join(""):'<div class="card"><div class="empty">Nessun intervento inserito. Parti dagli usi finali che pesano di più al passo 3: è lì che gli interventi rendono.</div></div>'}
  ${a.interventi.length?`<div class="card"><p class="eyebrow">Confronto tra interventi</p>${chInt(a,y)}</div>`:""}`;
}

            <div style="margin-left:auto;display:flex;gap:4px">
              <button class="btn ghost icon" data-mv="up" data-n="${n.id}" data-i="${i}" ${i===0?"disabled":""}>↑</button>

/* ---------- 7 verifica ---------- */
function vVer(a,st){
  const y=anno,d=derive(a,y);
  const mancProf=["forma","sede","settore","ateco","sito","attivita","referente"].filter(k=>!a.profilo[k]);
  const att=VATT.filter(v=>gq(a,y,v.k)>0);
  const mancCosti=att.filter(v=>!hc(a,y,v.k));
  const mancPrev=att.filter(v=>!hq(a,y-1,v.k));
  const mancQuad=att.filter(v=>!d.quad[v.k].ok);
  const mancMet=usiAttivi(a).filter(u=>d.usi[u.id].kwh>0&&!a.metodo[u.id]);
  const mancDr=DRIVER.filter(x=>!hd(a,y,x.k));
  const mancDrB=DRIVER.filter(x=>hd(a,y,x.k)&&!hd(a,a.baseline,x.k));
  const mancInt=a.interventi.filter(i=>!i.n||!fnum(i.qta)||!fnum(i.inv));
  const mancNar=NARR.filter(n=>(nar(a,n.id).testo||"").trim().length<=80);
  const media=NARR.reduce((s,n)=>s+nar(a,n.id).media.length,0);
  const blocco=(t,arr,label,go,nota)=>`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h2 style="margin:0">${t}</h2><span class="code">${arr.length===0?"completo":arr.length+" voci da sistemare"}</span></div>
      ${arr.length?`<button class="btn ghost sm" data-go="${go}">Vai</button>`:'<span class="tag t-grn">ok</span>'}</div>
    ${arr.length?`<div style="margin-top:10px;font-size:12.5px;color:var(--ink-2);line-height:1.7">${arr.slice(0,14).map(label).join(" · ")}${arr.length>14?" · <i>e altre "+(arr.length-14)+"</i>":""}</div>${nota?`<div class="hint">${nota}</div>`:""}`:""}
  </div>`;
  return `<h1>7 · Verifica</h1>
  <p class="sub">Cosa manca prima di consegnare. Nessuna voce è obbligatoria in assoluto, ma ogni assenza va motivata nel capitolo metodologico: un dato mancante dichiarato è un limite, un dato mancante taciuto è un errore.</p>
  <div class="card"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <div class="kpi"><div class="l">Pronto a consegnare</div><div class="n">${st.tot}%</div></div>
    <div style="flex:1;min-width:220px"><div class="track"><i style="width:${st.tot}%"></i></div>
    <div class="hint">${st.tot>=90?"Il documento è consegnabile: rileggi il capitolo metodologico e procedi.":st.tot>=60?"Buon punto di avanzamento. Chiudi le voci qui sotto in ordine di elenco.":"Il bilancio non è ancora rappresentativo: mancano consumi, ripartizioni o variabili di riferimento."}</div></div>
  </div></div>
  ${blocco("Anagrafica del sito",mancProf,k=>esc(k),"sito")}
  ${blocco("Spesa per vettore",mancCosti,v=>esc(v.n),"vett","Senza il costo non si calcolano né il costo medio dell'energia né il tempo di ritorno degli interventi.")}
  ${blocco("Confronto con l'anno precedente",mancPrev,v=>esc(v.n),"vett")}
  ${blocco("Quadratura della ripartizione",mancQuad,v=>esc(v.n)+" ("+fmt(d.quad[v.k].pct,1)+"%)","usi","È la verifica più importante del documento: finché i residui non rientrano, i pesi degli usi finali non sono attendibili.")}
  ${blocco("Metodo di determinazione degli usi",mancMet,u=>esc(u.n),"usi","La norma richiede di dichiarare, per ciascun uso, se il dato è misurato, calcolato o stimato.")}

  </div>`;
}

   ["Biomassa","Bolle di consegna in tonnellate, con indicazione dell'umidità: il potere calorifico del cippato varia quasi del doppio tra materiale fresco e stagionato."],

   ["Carburanti per autotrazione","Estratti mensili delle carte carburante, note spese, contaore o contachilometri dei mezzi."],
   ["Ripartizione per usi finali","Contatori divisionali, campagne di misura con analizzatore di rete, dati del sistema di supervisione, schede tecniche e targhe degli impianti, contaore dei macchinari."],
   ["Variabili di riferimento","Contabilità industriale per la produzione, planimetrie per le superfici, prospetto dell'organico, calendario dei turni. I gradi giorno effettivi si ricavano dalle serie meteo della stazione più vicina."],
   ["Costi","Fatture al netto di IVA, comprensive di oneri di sistema e trasporto: il costo che interessa il calcolo del ritorno è quello effettivamente pagato, non la sola componente energia."]

  const FORMULE=[
   ["Energia finale (kWh)","Σ quantità del vettore × potere calorifico inferiore per unità"],

  <div class="doc"><div class="inner">

  <h3>A cosa serve</h3>
  <p>Questo strumento accompagna dalla raccolta delle bollette fino al bilancio energetico impaginato di uno stabilimento. Il bilancio energetico risponde a tre domande nell'ordine: quanta energia entra nel sito, dove va a finire, quanto costa. Solo dopo aver risposto alle prime due ha senso parlare di interventi, perché altrimenti si finisce per efficientare l'utenza sbagliata.</p>
  <p>Il lavoro è organizzato in otto passi che si affrontano nell'ordine. Ogni passo alimenta il documento finale, e la barra di avanzamento nella colonna di sinistra segnala a colpo d'occhio cosa è concluso e cosa no. Si può tornare indietro in qualsiasi momento: nulla è definitivo finché non si stampa.</p>
  <p><b>Dove finiscono i dati.</b> Restano nel browser del computer che stai usando. Non vengono inviati da nessuna parte, non c'è un server, non serve una connessione. Questo protegge la riservatezza ma comporta una conseguenza importante: se cambi computer, cambi browser o cancelli i dati di navigazione, i dati non ti seguono. Il capitolo sui salvataggi spiega come metterli al sicuro.</p>

  <h3>In dieci minuti</h3>
  <p>Se è la prima volta, questo è il giro minimo per capire come funziona:</p>
  <table><tbody>
    <tr><td style="width:34px" class="code">1</td><td>Dal <b>Portafoglio</b>, apri il sito di esempio già presente e guarda il passo 8: quello è il risultato finale a cui si arriva.</td></tr>
    <tr><td class="code">2</td><td>Vai al passo 3 e osserva il diagramma di flusso: è la rappresentazione che rende immediato il bilancio a chi lo legge.</td></tr>
    <tr><td class="code">3</td><td>Torna al Portafoglio e crea il tuo sito con <b>Nuovo sito</b>.</td></tr>
    <tr><td class="code">4</td><td>Al passo 2 inserisci elettricità e gas dell'ultimo anno: compaiono subito kWh, tep, emissioni e costo medio.</td></tr>
    <tr><td class="code">5</td><td>Al passo 3 attribuisci quei consumi a tre o quattro utenze usando il pulsante <b>?</b> e il calcolatore di stima.</td></tr>
    <tr><td class="code">6</td><td>Vai al passo 8 e osserva come il documento si è già popolato.</td></tr>
  </tbody></table>
  <p>Capito il meccanismo, il lavoro vero consiste nel recuperare le fatture e nel decidere, utenza per utenza, come determinare il consumo.</p>

  <h3>Il portafoglio</h3>
  <p>È la schermata d'ingresso e contiene tutti i siti su cui stai lavorando. Ogni scheda mostra il grado di completamento, i MWh consumati, i tep e la spesa energetica.</p>
  <table><tbody>
    <tr><td style="width:30%"><b>Apri</b></td><td>Entra nel percorso di quel sito. Da quel momento la barra in alto mostra il nome e l'esercizio su cui stai lavorando.</td></tr>
    <tr><td><b>Duplica</b></td><td>Crea una copia completa. Serve per il secondo stabilimento di uno stesso gruppo: duplichi, rinomini e sostituisci i numeri, mantenendo la struttura degli usi finali già impostata.</td></tr>
    <tr><td><b>Elimina</b></td><td>Cancella definitivamente. Non c'è cestino: se non hai un'esportazione recente, il lavoro è perso.</td></tr>
    <tr><td><b>Esporta / Importa</b></td><td>Salva o ricarica l'intero archivio in un file. È anche il modo per spostare il lavoro su un altro computer.</td></tr>
  </tbody></table>

  <h3>Passo 1 · Sito e perimetro</h3>
  <p>Un bilancio energetico si riferisce a un sito, non a una società. Se l'azienda ha tre stabilimenti, si fanno tre bilanci: sommarli produce numeri che non significano nulla, perché gli indicatori specifici di siti diversi non sono confrontabili né sommabili.</p>
  <h4>Il perimetro</h4>
  <p>Va dichiarato con precisione: quali reparti, quali magazzini, quali mezzi. I casi che generano più errori sono tre. Le utenze di terzi ospitate nel sito (una mensa in concessione, un'officina di un fornitore) vanno escluse o dichiarate a parte. I mezzi a noleggio a lungo termine vanno inclusi se il carburante lo paga l'azienda. Le sedi commerciali distaccate, se non sono nel perimetro, non devono comparire nei consumi ma nemmeno negli addetti al denominatore degli indicatori.</p>
  <h4>L'unità di produzione</h4>
  <p>È la scelta più delicata del passo 1 perché diventa il denominatore di quasi tutti gli indicatori. Deve essere una grandezza fisica correlata al consumo e misurata con continuità: tonnellate prodotte, pezzi, metri quadri lavorati, litri imbottigliati. Il fatturato non va bene come unità produttiva perché varia con i prezzi, e infatti compare separatamente solo per l'incidenza della spesa energetica.</p>

  <h3>Passo 2 · Vettori energetici</h3>
  <p>Qui si inserisce quanta energia è entrata nel sito, nell'unità di misura in cui la si acquista: kWh per l'elettricità, standard metri cubi per il gas, litri per il gasolio, chilogrammi per il GPL. Le conversioni in kWh, tep e tonnellate di CO₂ avvengono da sole.</p>
  <h4>Dove trovare i dati</h4>
  <table><thead><tr><th style="width:26%">Voce</th><th>Documenti da recuperare</th></tr></thead>
  <tbody>${FONTI.map(f=>`<tr><td><b>${esc(f[0])}</b></td><td>${esc(f[1])}</td></tr>`).join("")}</tbody></table>
  <h4>Regole di compilazione</h4>
  <p>Usa sempre l'anno solare, coerente per tutte le voci. Per i combustibili stoccati il consumo non è la somma degli acquisti: è acquisti più giacenza iniziale meno giacenza finale, e su un serbatoio da diecimila litri la differenza non è trascurabile. Se un dato non esiste lascia il campo vuoto anziché scrivere zero: lo zero afferma che quel vettore non è usato, il vuoto dichiara che il dato manca.</p>
  <h4>La spesa</h4>
  <p>Inserisci l'importo effettivamente pagato al netto di IVA, comprensivo di trasporto, oneri di sistema e accise. È da questo importo che lo strumento ricava il costo medio del vettore, e da lì il valore economico di ogni intervento: un costo dell'energia elettrica indicato come sola componente materia produce tempi di ritorno più lunghi del reale e fa scartare interventi che invece convengono.</p>
  <h4>L'andamento mensile</h4>
  <p>È facoltativo ma è la parte che rivela di più. Dodici valori di elettricità e dodici di gas raccontano se il riscaldamento è tarato male, se la produzione ferma d'agosto lascia acceso qualcosa, se c'è un'utenza che lavora anche a stabilimento chiuso. Lo scarto tra la somma dei mesi e il dato annuo è indicato sotto la tabella: entro il 2% è fisiologico, oltre significa che manca una bolletta o che un conguaglio non è stato attribuito.</p>

  <h3>Passo 3 · Usi finali</h3>
  <p>È il cuore del bilancio e la parte che distingue un lavoro serio da una raccolta di fatture. Consiste nell'attribuire ogni quantità entrata nel sito all'utenza che l'ha consumata, nella stessa unità di misura del passo 2.</p>
  <h4>Le aree funzionali</h4>
  <p>Gli usi finali sono raggruppati in quattro aree, secondo la struttura usata nelle diagnosi energetiche. Le <b>attività principali</b> sono le lavorazioni che realizzano il prodotto. I <b>servizi ausiliari</b> servono il processo senza trasformare il prodotto: aria compressa, freddo, pompaggi, aspirazioni. I <b>servizi generali</b> riguardano l'edificio e le funzioni non produttive. I <b>trasporti</b> comprendono movimentazione interna e flotta. La distinzione conta perché gli interventi e i margini di miglioramento sono diversi per ciascuna area: nei servizi ausiliari si trovano quasi sempre i risparmi più rapidi.</p>
  <h4>La scheda di ogni uso</h4>
  <p>Il pulsante <b>?</b> accanto a ciascuna riga apre una scheda con la definizione dell'uso, i modi corretti per determinarlo in ordine di affidabilità, la formula di stima di prima approssimazione, l'errore ricorrente da evitare e i documenti dove cercare i dati. Nella stessa scheda c'è un calcolatore: inserisci potenza, ore e fattore di carico, e il pulsante scrive il risultato direttamente nella riga, convertito nell'unità del vettore scelto.</p>
  <h4>Il fattore di carico</h4>
  <p>È l'errore più diffuso in assoluto. Sommare le potenze di targa moltiplicate per le ore di apertura produce valori che spesso superano del doppio l'energia realmente entrata nel sito, e la quadratura salta. Nessun motore assorbe la potenza di targa in continuo: un compressore ben regolato sta intorno a 0,6-0,7, una macchina utensile tra 0,3 e 0,5, un forno di mantenimento anche 0,25. Se non hai misure, parti da questi ordini di grandezza e correggili fino a chiudere il bilancio.</p>
  <h4>La quadratura</h4>
  <p>Il riquadro in alto a destra confronta, per ogni vettore, quanto è entrato e quanto è stato attribuito. Il bilancio è chiuso quando ogni residuo sta entro il 2%. Un residuo positivo significa che esiste un'utenza che non hai ancora considerato — quasi sempre un'aspirazione, un gruppo frigo o una linea di ricarica. Un residuo negativo significa che hai contato due volte la stessa energia, tipicamente quando una centrale di produzione è stata imputata sia come utenza sia come consumo dei reparti serviti.</p>
  <p><b>Non forzare la chiusura.</b> Gonfiare una voce residuale per far tornare i conti è peggio che dichiarare un residuo del 6%: il primo caso è un dato falso, il secondo è un limite dichiarato e verificabile.</p>
  <h4>Il metodo di determinazione</h4>
  <p>Per ogni uso finale va dichiarato se il valore è misurato, calcolato o stimato. Non è una formalità: è la richiesta esplicita della UNI CEI EN 16247 ed è ciò che permette a chi legge di sapere quanto fidarsi di ciascuna riga. Un bilancio in cui l'utenza principale è stimata e le voci marginali sono misurate segnala che la campagna di misura è stata fatta dove era comodo, non dove serviva.</p>
  <h4>Quanti usi tenere</h4>
  <p>Solo quelli che esistono davvero. Un elenco di venti righe di cui dodici a zero rende il documento illeggibile. La regola pratica: apri una riga quando quell'utenza supera il 2-3% del consumo del sito o quando è oggetto di un intervento previsto.</p>

  <h3>Passo 4 · Indicatori di prestazione</h3>
  <p>Un consumo assoluto non dice se il sito lavora bene: dice quanto ha prodotto. Gli indicatori rapportano l'energia alle variabili che la determinano e rendono confrontabili anni diversi.</p>
  <h4>Le variabili di riferimento</h4>
  <p>Vanno inserite sia per l'esercizio sia per l'anno base. La produzione è il denominatore principale. La superficie e il volume servono agli indicatori dell'edificio. I gradi giorno effettivi — non quelli convenzionali della zona climatica — servono a normalizzare il riscaldamento: senza di essi un inverno mite si legge come un miglioramento gestionale, che non è.</p>
  <h4>L'anno base</h4>
  <p>È il termine di paragone di tutto il documento. Va scelto tra gli anni con dati completi e poi non va più cambiato: se il riferimento si sposta, tutti i confronti storici perdono significato. Nei sistemi ISO 50001 il cambio dell'anno base è ammesso solo quando gli indicatori non riflettono più l'attività, ad esempio dopo un ampliamento importante, e va motivato per iscritto.</p>
  <h4>Il consumo di base</h4>
  <p>Lo strumento stima il consumo che il sito ha comunque, annualizzando il mese elettrico più basso. Sopra il 30% dei consumi elettrici c'è quasi sempre margine: illuminazione permanente, ventilazioni mai spente, perdite della rete d'aria compressa, stand-by di macchine ferme. È il primo posto dove cercare risparmi che non richiedono investimenti.</p>
  <h4>Le formule</h4>
  <table><thead><tr><th style="width:34%">Grandezza</th><th>Come si calcola</th></tr></thead>
  <tbody>${FORMULE.map(f=>`<tr><td><b>${esc(f[0])}</b></td><td class="code" style="font-size:11.5px">${esc(f[1])}</td></tr>`).join("")}</tbody></table>

  <h3>Passo 5 · Interventi di miglioramento</h3>
  <p>Ogni intervento si quantifica indicando quale vettore fa risparmiare e quanto, nell'unità di quel vettore. Il valore economico e il tempo di ritorno si calcolano dal costo medio ricavato al passo 2, quindi non vanno inseriti a mano e non possono essere ottimistici per distrazione.</p>
  <table><tbody>
    <tr><td style="width:26%"><b>Descrizione</b></td><td>Concreta e verificabile: «inverter sui due compressori della sala nord», non «efficientamento aria compressa».</td></tr>
    <tr><td><b>Risparmio</b></td><td>Nell'unità del vettore. Va motivato nel campo delle note: da quale misura o quale ipotesi deriva. Un risparmio dichiarato senza ipotesi non è verificabile e in sede di verifica viene scartato.</td></tr>
    <tr><td><b>Investimento</b></td><td>Comprensivo di installazione, opere accessorie e messa in servizio, non il solo prezzo dell'apparecchio.</td></tr>
    <tr><td><b>Incentivo</b></td><td>Il contributo atteso, se ne è previsto uno. Il tempo di ritorno è calcolato sull'investimento netto.</td></tr>
    <tr><td><b>Uso finale</b></td><td>Collega l'intervento alla riga del passo 3: è ciò che rende evidente se stai intervenendo dove l'energia effettivamente si consuma.</td></tr>
  </tbody></table>
  <p>Il tempo di ritorno riportato è quello semplice, senza attualizzazione: è la misura che la direzione capisce e chiede per prima. Per gli interventi rilevanti va affiancata da una valutazione finanziaria vera, con VAN e tasso interno, che questo strumento non calcola.</p>
  <p><b>Certificati bianchi.</b> Il risparmio in tep riportato per ciascun intervento è la base di calcolo dei titoli di efficienza energetica, ma il riconoscimento effettivo dipende dalla scheda tecnica applicabile, dall'addizionalità e dai coefficienti di durabilità: la cifra qui indicata è un ordine di grandezza, non un titolo maturato.</p>

  <h3>Passo 6 · Racconto</h3>
  <p>Sette capitoli discorsivi, ciascuno con le sue immagini. Il contatore di parole accanto al titolo aiuta a tenere il ritmo: sotto le ottanta parole il capitolo risulta incompleto anche alla verifica.</p>
  <h4>Come scrivere</h4>
  <p>Frasi brevi, fatti verificabili, nessun aggettivo enfatico. La sintesi per la direzione va scritta per ultima e letta per prima: deve dire quanto si consuma, dove va l'energia, quanto costa e quali sono le tre cose da fare. Se non sta in mezza pagina, non è una sintesi.</p>
  <h4>Diagrammi</h4>
  <p>Il menù <b>+ Diagramma dai dati</b> offre otto grafici costruiti sui numeri inseriti: il flusso dai vettori alle aree funzionali, la composizione dei vettori, la ripartizione per area, il Pareto degli usi finali, l'andamento mensile, il confronto degli indicatori con l'anno base, il quadro degli interventi e le emissioni. Non sono immagini: se correggi un dato, il grafico si aggiorna da solo.</p>
  <p>I due che nessun bilancio energetico dovrebbe omettere sono il diagramma di flusso, che mostra in un colpo d'occhio dove finisce l'energia, e il Pareto degli usi finali, che dice su quali tre o quattro utenze si gioca tutto.</p>

  <h3>Passo 7 · Verifica</h3>
  <p>Elenca ciò che manca, diviso per area, con il pulsante per saltare al punto da correggere. La percentuale in alto pesa in modo uguale i sei passi di contenuto.</p>
  <p>La voce da chiudere per prima è sempre la quadratura: finché i residui non rientrano, i pesi degli usi finali non sono attendibili e tutto ciò che segue — indicatori, interventi, priorità — poggia su una ripartizione sbagliata. Le altre assenze si possono dichiarare; questa no.</p>

  <h3>Passo 8 · Bilancio e stampa</h3>
  <p>Il documento si assembla da solo. Le parti mancanti compaiono in rosso tra parentesi quadre, così sai cosa correggere prima di stampare.</p>
  <table><tbody>
    <tr><td style="width:34px" class="code">1</td><td>Premi <b>Stampa bilancio</b> nella barra in alto.</td></tr>
    <tr><td class="code">2</td><td>Nella finestra di stampa scegli come destinazione <b>Salva come PDF</b>.</td></tr>
    <tr><td class="code">3</td><td>Apri le opzioni avanzate e attiva <b>Grafica di sfondo</b>. Senza questa spunta la copertina e le intestazioni delle tabelle escono bianche.</td></tr>
    <tr><td class="code">4</td><td>Lascia i margini predefiniti e l'orientamento verticale, poi salva.</td></tr>
  </tbody></table>

  <h3>Fattori di conversione</h3>
  <p>Lo strumento usa due conversioni distinte per ogni vettore e la differenza va compresa, perché è la fonte di equivoci più frequente nei bilanci energetici.</p>
  <p>La conversione in <b>kWh</b> restituisce l'<i>energia finale</i>, cioè quella effettivamente disponibile all'utenza, ed è basata sul potere calorifico inferiore del combustibile. Un kWh elettrico vale un kWh.</p>
  <p>La conversione in <b>tep</b> restituisce l'<i>energia primaria</i> e segue la convenzione usata nelle diagnosi energetiche italiane: per l'energia elettrica il coefficiente di 0,187 × 10⁻³ tep/kWh incorpora il rendimento medio del parco di generazione, per cui un kWh elettrico pesa circa il doppio di un kWh termico. È il motivo per cui in tep l'elettricità domina il bilancio anche in siti dove in kWh sembra minoritaria, ed è la ragione per cui la soglia dei 100 tep va sempre verificata su questa base e non sui kWh.</p>
  <p>I valori precaricati sono riferimenti indicativi e vanno verificati prima di pubblicare: le fonti comunemente usate sono le tabelle ISPRA per i fattori di emissione nazionali, le circolari MISE ed ENEA per i coefficienti in tep, i dati di fornitura per i poteri calorifici effettivi. Se disponi del potere calorifico reale indicato in fattura — capita per gas e biomassa — usalo al posto del valore standard e dichiaralo nel capitolo metodologico. Modificare i fattori dopo aver inserito i dati non richiede di rifare nulla: i calcoli si aggiornano da soli e la tabella nel documento riporta sempre i valori effettivamente applicati.</p>

  <h3>Salvataggi, backup e trasferimenti</h3>
  <p>Il salvataggio è automatico a ogni modifica. Non esiste un pulsante «salva» perché non serve. Esiste però un rischio concreto di perdita, che va gestito.</p>
  <table><tbody>
    <tr><td style="width:32%"><b>Quando i dati si perdono</b></td><td>Cancellazione dei dati di navigazione o della cache; uso di una finestra in incognito; cambio di browser o di computer; disinstallazione del browser.</td></tr>
    <tr><td><b>Come proteggerli</b></td><td>Esporta l'archivio dal Portafoglio a fine di ogni sessione e conserva il file con la data nel nome. È l'unico vero backup.</td></tr>
    <tr><td><b>Spostare il lavoro</b></td><td>Esporta sul primo computer, apri il file dell'applicazione sul secondo, importa.</td></tr>
    <tr><td><b>Consegnare al cliente</b></td><td>Esporta il singolo sito da Fattori e archivio: il file contiene solo quel sito e si importa nel portafoglio di destinazione.</td></tr>
  </tbody></table>

  <h3>Problemi frequenti</h3>
  <table><tbody>
    <tr><td style="width:38%"><b>Il residuo di quadratura è enorme e positivo</b></td><td>Manca un'utenza. Nei siti produttivi le tre dimenticate più spesso sono l'aspirazione fumi, il gruppo frigo di processo e la sala di ricarica dei carrelli.</td></tr>
    <tr><td><b>Il residuo è negativo</b></td><td>Doppio conteggio. Succede quando si imputa il combustibile della centrale termica e insieme il calore consumato dai reparti che quella centrale serve.</td></tr>
    <tr><td><b>Le colonne del passo 3 non compaiono</b></td><td>Le colonne esistono solo per i vettori con un consumo inserito al passo 2.</td></tr>

function pickImage(cb,maxW,quality,keepPng){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/img.width);
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        const x=c.getContext("2d");
        if(!keepPng){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);}
        x.drawImage(img,0,0,c.width,c.height);
        cb(keepPng?c.toDataURL("image/png"):c.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>toast("Immagine non leggibile");
      img.src=r.result;};
    r.readAsDataURL(f);};
  inp.click();
}

    a.narrativa.sintesi={testo:"Nell'esercizio "+y+" lo stabilimento ha consumato 4.531 MWh di energia finale, pari a 642 tep di energia primaria, per una spesa di 553.640 euro e un costo medio di 0,122 euro per kWh. Il consumo specifico è sceso a 2.449 kWh per tonnellata di getti contro i 2.644 dell'anno base, con un miglioramento del 7,4% dovuto all'entrata a regime dell'impianto fotovoltaico e a un maggiore utilizzo della capacità produttiva.\n\nDue terzi dell'energia sono assorbiti dalle attività principali e in particolare dai forni, che tra fusione e mantenimento valgono da soli il 63% del consumo del sito. Seguono i servizi generali con il 14,8%, dove pesa il riscaldamento dei capannoni, e i servizi ausiliari con il 12,9%, dominati da aria compressa e aspirazione fumi. È in queste due ultime aree che si concentrano gli interventi a ritorno più rapido, perché non richiedono di toccare il ciclo produttivo.\n\nIl programma di miglioramento individua 656 MWh di risparmio annuo, pari al 14,5% dei consumi e a 101 tep di energia primaria, a fronte di 419.000 euro di investimento e 93.870 euro di beneficio annuo. Le tre azioni da avviare per prime sono la coibentazione dei forni di mantenimento, il sistema di monitoraggio per reparto e la regolazione della rete di aria compressa: insieme valgono 170 MWh, costano 96.000 euro e rientrano tra i due e i quattro anni.",

    a.narrativa.metodo={testo:"I consumi sono stati ricostruiti per anno solare dalle fatture dei fornitori di energia elettrica e gas naturale, dai documenti di trasporto del GPL e dagli estratti delle carte carburante. L'autoconsumo fotovoltaico è stato ricavato per differenza tra la produzione registrata dall'inverter e l'energia immessa in rete misurata dal contatore di scambio.\n\nLa ripartizione per usi finali si basa su una campagna di misura di tre settimane condotta con analizzatore di rete sui quadri dei forni fusori e della sala compressori, sui contatori divisionali già installati e, per le utenze minori, su stime da potenza installata e ore di funzionamento rilevate in campo. Il metodo adottato è dichiarato riga per riga nella tabella degli usi finali: cinque voci su undici sono misurate o calcolate da grandezze misurate, le restanti sono stimate e riguardano complessivamente meno del 15% del consumo.\n\nLa separazione tra gas di processo e gas per il riscaldamento degli ambienti è stata ottenuta dall'analisi dei consumi mensili, assumendo come base di processo il consumo medio dei mesi da giugno a settembre. Il residuo di quadratura è nullo su tutti e cinque i vettori valorizzati.",

    a.narrativa.analisi={testo:"Il Pareto degli usi finali mostra che quattro utenze su undici spiegano l'80% del consumo: forni di mantenimento e trattamento termico con il 35,2%, forni fusori con il 27,8%, riscaldamento degli ambienti con l'11,8% e aria compressa con il 5,6%. Ogni ora di lavoro dedicata alle utenze rimanenti produce, in termini di risparmio potenziale, una frazione di quanto produce un'ora dedicata a queste quattro.\n\nDue elementi meritano attenzione. Il consumo elettrico di agosto, con lo stabilimento fermo per due settimane, resta pari a poco più della metà di un mese produttivo: il consumo di base annualizzato vale circa 1.344 MWh, il 54% dei consumi elettrici. È un valore alto anche tenendo conto dei forni di mantenimento tenuti in temperatura, e indica utenze che restano in servizio senza necessità durante le fermate.\n\nLa prova di tenuta della rete di aria compressa, eseguita a impianto fermo, ha rilevato perdite pari al 24% dell'aria prodotta contro un valore di buona pratica sotto il 10%. Da sola questa voce vale circa 61 MWh all'anno, recuperabili in larga parte con la sola manutenzione della rete e delle utenze terminali.",
