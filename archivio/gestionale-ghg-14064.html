/* ---------- Guida ---------- */
function vGuida(){
  const passi=[
   ["Definisci i confini","Scegli l'approccio di consolidamento e scrivi quali unità entrano nell'inventario. È la prima cosa che un verificatore legge e quella che, se manca, blocca tutto il resto."],
   ["Esamina le sei categorie","Nel registro delle sorgenti dichiara per ciascuna voce se è inclusa, esclusa o non applicabile. Le esclusioni vanno motivate: «non significativa» senza un criterio dichiarato non regge in audit."],
   ["Inserisci i dati di attività","Una riga per sorgente e per sito. Indica sempre l'evidenza documentale: la fattura, il registro, il DDT. Il calcolo è automatico."],
   ["Allinea i fattori","I valori precaricati servono a partire, non a chiudere. Sostituiscili con l'edizione della fonte che dichiari nel rapporto e annota l'anno."],
   ["Leggi i risultati","Controlla dove si concentrano le emissioni e dove la qualità del dato è più debole: è lì che conviene investire prima della verifica."],
   ["Fissa anno base e obiettivi","Senza anno base non esiste confronto e senza regola di ricalcolo il confronto diventa fragile alla prima acquisizione."],
   ["Chiudi con la verifica interna","La checklist ripercorre i requisiti della norma. Ogni voce annotata diventa un riferimento per il fascicolo di audit."],
   ["Genera il rapporto","Il documento raccoglie i contenuti minimi del punto 9.3.1 e si stampa o si salva in PDF."]
  ];
  return `<h1>Guida all'uso</h1>
  <p class="sub">Lo strumento segue l'ordine logico della norma: prima i confini, poi le sorgenti, poi i numeri. Seguirlo evita di dover rifare i calcoli quando il perimetro cambia.</p>
  <div class="card">${passi.map((p,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${p[0]}</b><p>${p[1]}</p></div></div>`).join("")}</div>
  <div class="grid g2">
    <div class="card"><div class="eyebrow">Categorie ISO e scope del GHG Protocol</div>
      <table><thead><tr><th>ISO 14064-1:2018</th><th>Corrispondenza</th></tr></thead><tbody>
        ${CAT.map(c=>`<tr><td><b>Categoria ${c.id}</b> — ${esc(c.n)}</td><td><span class="tag ${c.t}">${c.s}</span></td></tr>`).join("")}
      </tbody></table>
      <div class="hint">La norma ragiona per categorie, il GHG Protocol per scope. La corrispondenza è quella indicata: le categorie da 3 a 6 compongono insieme quello che il Protocol chiama Scope 3.</div></div>
    <div class="card"><div class="eyebrow">Qualità del dato e incertezza</div>
      <table><thead><tr><th>Livello</th><th>Quando si applica</th><th style="text-align:right">Incertezza</th></tr></thead><tbody>
        ${DQ.map(d=>`<tr><td><b>${d.n}</b></td><td class="hint" style="margin:0">${d.d}</td><td class="num">± ${d.inc}%</td></tr>`).join("")}
      </tbody></table>
      <div class="hint">Le percentuali predefinite sono modificabili voce per voce. L'incertezza complessiva è calcolata combinando in quadratura i contributi assoluti.</div></div>
  </div>
  <div class="card"><div class="eyebrow">Avvertenza</div>
    <p class="hint" style="margin:0">I fattori di emissione precaricati sono valori indicativi tratti da fonti pubbliche e possono non corrispondere all'edizione corrente. Prima di emettere un inventario destinato alla verifica, aggiornali e documenta la fonte esatta di ciascuno.</p></div>`;
}

/* ==========================================================
   INTERAZIONE
   ========================================================== */
function fillSel(){$("#coSel").innerHTML=DB.org.map(o=>`<option value="${o.id}" ${o.id===DB.current?"selected":""}>${esc(o.nome)}</option>`).join("");}
function fillAnni(){const o=org();if(!o){$("#annoSel").innerHTML="";return;}
  const y=anniDi(o), cur=new Date().getFullYear();
  const set=[...new Set([...y,cur,cur-1,cur-2,+o.anno])].filter(x=>isFinite(x)).sort((a,b)=>b-a);
  $("#annoSel").innerHTML=set.map(x=>`<option value="${x}" ${+anno===+x?"selected":""}>${x}</option>`).join("");}
function bind(o){fillSel();fillAnni();}
function dlFile(name,content,type){const b=new Blob([content],{type:type+";charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
function apri(id){DB.current=id;const o=org();anno=+o.anno;view="home";persist();render();}
function creaOrg(){const n=prompt("Denominazione dell'organizzazione");if(n===null)return;
  const o=nuova(n.trim()||"Nuova organizzazione");DB.org.push(o);apri(o.id);toast("Organizzazione creata");}
function csv(o){
  const h=["Periodo","Categoria","Scope","Sorgente","Sito","Descrizione","Quantità","Unità","FE kgCO2e/u","FE market","Quota GO","tCO2e","tCO2e market","CO2 biogenica t","Qualità","Incertezza %","Evidenza","Note"];
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=o.voci.slice().sort((a,b)=>b.anno-a.anno||a.cat.localeCompare(b.cat)).map(v=>{const r=riga(o,v),s=SRC.find(x=>x.id===v.src);
    return [v.anno,"Categoria "+v.cat,"Scope "+scopeOf(v.cat),s?s.n:"",v.sede,v.desc,nz(v.q),v.um,nz(v.fe),v.feM,v.qGO,
      r.t.toFixed(4),r.tM.toFixed(4),r.bio.toFixed(4),dqOf(v.dq).n,r.inc,v.ev,v.note].map(q).join(";");});
  return "\uFEFF"+h.map(q).join(";")+"\n"+rows.join("\n");
}
function importa(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.org&&Array.isArray(d.org)){d.org.forEach(x=>{x.id=uid("O");DB.org.push(x);});toast(d.org.length+" organizzazioni importate");}
      else if(d.nome&&d.voci){d.id=uid("O");DB.org.push(d);toast("Organizzazione importata");}
      else return toast("File non riconosciuto");
      persist();render();}catch(e){toast("File non leggibile");}};
    r.readAsText(f);};
  i.click();
}
function setup(){
  document.addEventListener("click",e=>{
    const t=e.target, o=org();
    const nav=t.closest(".nav");
    if(nav){view=nav.dataset.v;edit=null;$("#side").classList.remove("open");render();return;}
    const go=t.closest("[data-go]"); if(go){view=go.dataset.go;render();return;}
    const open=t.closest("[data-open]"); if(open&&!t.closest("[data-del]")){apri(open.dataset.open);return;}
    const id=t.id;
    if(id==="brandHome"){view="pf";render();return;}
    if(id==="menuBtn"){$("#side").classList.toggle("open");return;}
    if(id==="addCo"||id==="newCo"){creaOrg();return;}
    if(id==="printBtn"||id==="printBtn2"){if(view!=="doc"&&o){view="doc";render();}setTimeout(()=>window.print(),260);return;}
    if(id==="expJson"||id==="expJson2"){dlFile("inventario-ghg-archivio.json",JSON.stringify(DB,null,1),"application/json");toast("Archivio esportato");return;}
    if(id==="impJson"||id==="impJson2"){importa();return;}
    if(t.dataset.del){e.stopPropagation();const x=DB.org.find(a=>a.id===t.dataset.del);
      if(x&&confirm("Eliminare «"+x.nome+"» e tutte le sue voci?")){DB.org=DB.org.filter(a=>a.id!==x.id);if(DB.current===x.id)DB.current=DB.org[0]?DB.org[0].id:null;persist();render();}return;}
    if(!o)return;
    /* voci */
    if(id==="addVoce"){edit=nuovaVoce();render();return;}
    if(id==="cancelVoce"){edit=null;render();return;}
    if(id==="recalcVoce"){leggiForm();render();return;}
    if(id==="saveVoce"){leggiForm();
      const i=o.voci.findIndex(v=>v.id===edit.id);
      if(i>=0)o.voci[i]=edit;else o.voci.push(edit);
      edit=null;persist();render();toast("Voce salvata");return;}
    if(t.dataset.editv){edit=JSON.parse(JSON.stringify(o.voci.find(v=>v.id===t.dataset.editv)));render();return;}
    if(t.dataset.dupv){const v=JSON.parse(JSON.stringify(o.voci.find(x=>x.id===t.dataset.dupv)));v.id=uid("V");o.voci.push(v);persist();render();toast("Voce duplicata");return;}
    if(t.dataset.delv){if(confirm("Eliminare la voce?")){o.voci=o.voci.filter(v=>v.id!==t.dataset.delv);persist();render();}return;}
    if(id==="copyPrev"){const prev=anniDi(o).filter(y=>y<+anno)[0];
      const src=o.voci.filter(v=>+v.anno===+prev);
      src.forEach(v=>{const n=JSON.parse(JSON.stringify(v));n.id=uid("V");n.anno=+anno;n.q="";o.voci.push(n);});
      persist();render();toast(src.length+" voci copiate dal "+prev+" — inserisci le quantità");return;}
    if(id==="expCsv"||id==="expCsv2"){dlFile("voci-ghg-"+slug(o.nome)+".csv",csv(o),"text/csv");toast("CSV esportato");return;}
    if(id==="expOne"){dlFile("inventario-"+slug(o.nome)+".json",JSON.stringify(o,null,1),"application/json");return;}
    if(id==="delOne"){if(confirm("Eliminare «"+o.nome+"»?")){DB.org=DB.org.filter(a=>a.id!==o.id);DB.current=DB.org[0]?DB.org[0].id:null;view="pf";persist();render();}return;}
    if(id==="expHtml"){const b=$("#docBody");
      dlFile("rapporto-ghg-"+slug(o.nome)+"-"+anno+".html",
        `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Rapporto GHG ${esc(o.nome)} ${anno}</title>
        <style>body{font-family:Georgia,serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.6;color:#14201C}
        h1{font-size:26px}h2{font-size:18px;margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:5px}h3{font-size:14px}
        table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}th,td{border-bottom:1px solid #eee;padding:6px 8px;text-align:left}
        th{font-size:11px;text-transform:uppercase;color:#666}.num{text-align:right;font-family:monospace}.meta{color:#777;font-size:12px}</style>
        </head><body>${b?b.innerHTML:""}</body></html>`,"text/html");toast("Rapporto esportato");return;}
    /* segmenti sorgenti e verifica */
    const seg=t.closest("[data-srcseg]");
    if(seg&&t.dataset.st){const k=seg.dataset.srcseg;o.sorgenti[k]=o.sorgenti[k]||{};o.sorgenti[k].st=t.dataset.st;persist();render();return;}
    const vseg=t.closest("[data-verseg]");
    if(vseg&&t.dataset.st){const k=vseg.dataset.verseg;o.verifica[k]=o.verifica[k]||{};o.verifica[k].st=t.dataset.st;persist();render();return;}
    /* fattori */
    if(id==="addFe"){const n=$("#nfName").value.trim();if(!n)return toast("Indica il nome del fattore");
      o.fe.push({id:uid("F").toLowerCase(),n,g:$("#nfGrp").value.trim()||"Personalizzati",um:$("#nfUm").value.trim()||"unità",
        fe:nz($("#nfVal").value),cat:$("#nfCat").value,src:$("#nfSrc").value,f:$("#nfFonte").value.trim()});
      persist();render();toast("Fattore aggiunto");return;}
    if(t.dataset.delfe){o.fe=o.fe.filter(f=>f.id!==t.dataset.delfe);persist();render();return;}
    if(id==="resetFe"){if(confirm("Ripristinare la libreria predefinita?")){o.fe=JSON.parse(JSON.stringify(FE_LIB));persist();render();}return;}
    /* obiettivi */
    if(id==="addObt"){const n=$("#obN").value.trim();
      o.obiettivi.push({id:uid("B"),n:n||"Obiettivo di riduzione",ambito:$("#obA").value,anno:$("#obY").value.trim()||String(+o.annoBase+5),
        rid:$("#obR").value.trim()||"30",note:$("#obNote").value.trim()});
      persist();render();toast("Obiettivo aggiunto");return;}
    if(t.dataset.delobt){o.obiettivi=o.obiettivi.filter(b=>b.id!==t.dataset.delobt);persist();render();return;}
  });

  document.addEventListener("input",e=>{
    const t=e.target,o=org();if(!o)return;
    if(t.dataset.p!==undefined&&t.tagName!=="SELECT"){o.profilo[t.dataset.p]=t.value;persist();return;}
    if(t.dataset.m!==undefined){meta(o,anno)[t.dataset.m]=t.value;persist();return;}
    if(t.dataset.e!==undefined&&edit&&!["cat","feId","dq"].includes(t.dataset.e)){edit[t.dataset.e]=t.value;return;}
    if(t.dataset.fe!==undefined){const f=feDi(o,t.dataset.fe);if(f){f[t.dataset.k]=t.dataset.k==="f"?t.value:nz(t.value);persist();}return;}
    if(t.dataset.srcnote!==undefined){const k=t.dataset.srcnote;o.sorgenti[k]=o.sorgenti[k]||{};o.sorgenti[k].note=t.value;persist();return;}
    if(t.dataset.vernote!==undefined){const k=t.dataset.vernote;o.verifica[k]=o.verifica[k]||{};o.verifica[k].note=t.value;persist();return;}
    if(t.id==="renameCo"){o.nome=t.value;persist();fillSel();return;}
    if(t.id==="annoCo"){o.anno=t.value.replace(/\D/g,"").slice(0,4);persist();return;}
    if(t.id==="fq"){filtro.q=t.value;const s=t.selectionStart;render();const n=$("#fq");if(n){n.focus();n.setSelectionRange(s,s);}return;}
  });

  document.addEventListener("change",e=>{
    const t=e.target,o=org();
    if(t.id==="coSel"){DB.current=t.value;const x=org();anno=+x.anno;persist();render();return;}
    if(t.id==="annoSel"){anno=+t.value;render();return;}
    if(!o)return;
    if(t.dataset.p!==undefined&&t.tagName==="SELECT"){o.profilo[t.dataset.p]=t.value;persist();render();return;}
    if(t.id==="fcat"){filtro.cat=t.value;filtro.src="";render();return;}
    if(t.id==="selBase"){o.annoBase=+t.value;persist();render();return;}
    if(t.dataset.e!==undefined&&edit){
      const k=t.dataset.e;leggiForm();
      if(k==="cat"){edit.cat=t.value;const s=SRC.find(x=>x.c===t.value);edit.src=s?s.id:"";
        const f=o.fe.find(x=>x.cat===t.value);if(f){edit.feId=f.id;edit.um=f.um;edit.fe=f.fe;edit.feM=f.mkt==null?"":f.mkt;}}
      else if(k==="feId"){edit.feId=t.value;const f=feDi(o,t.value);
        if(f){edit.um=f.um;edit.fe=f.fe;edit.feM=f.mkt==null?"":f.mkt;if(f.bio)edit.feB=f.bio;if(f.src)edit.src=f.src;}}
      else edit[k]=t.value;
      render();return;}
  });

  window.addEventListener("resize",resp);
}
function leggiForm(){
  if(!edit)return;
  $$("#formVoce [data-e]").forEach(el=>{edit[el.dataset.e]=el.value;});
}
function resp(){const b=$("#menuBtn");if(b)b.style.display=window.innerWidth<=980?"block":"none";}
