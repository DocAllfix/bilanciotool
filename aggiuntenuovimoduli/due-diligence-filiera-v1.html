<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Due diligence di filiera</title>
<style>
:root{
  --pri:#3F5580;--pri-dk:#2A3A5C;--pri-lt:#EAEDF5;--pri-mid:#6C82AD;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---- ciclo di due diligence ---- */
.fase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.fase:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.fase .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.fase .nm{font-weight:650;letter-spacing:-.2px;font-size:15px}
.fase .ds{font-size:12px;color:var(--ink-3);line-height:1.45;flex:1}
.fase .pc{font-family:var(--mono);font-size:20px;font-weight:650;letter-spacing:-.5px}
/* ---- rischio ---- */
.rk{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.02em}
.rk-b{background:var(--green-lt);color:var(--green)}
.rk-m{background:var(--blue-lt);color:var(--blue)}
.rk-a{background:var(--amber-lt);color:var(--amber)}
.rk-c{background:var(--red-lt);color:var(--red)}
.sev{display:flex;gap:2px;align-items:center}
.sev i{width:11px;height:11px;border-radius:2px;background:var(--line-2);display:block}
.sev i.on{background:var(--pri)}
.sev i.hi{background:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:56px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 4px;cursor:pointer;font-size:11.5px;text-align:center;color:var(--ink-2)}
.scale button:hover{border-color:var(--pri-mid)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.scale button b{display:block;font-family:var(--mono);font-size:14px}
.flagbox{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.flagbox:last-child{border-bottom:0}
.flagbox input{width:16px;height:16px;margin:2px 0 0;flex:0 0 16px}
.flagbox span{font-size:12.5px;line-height:1.45}
.panel{background:var(--pri-lt);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.panel .row{gap:22px}
.panel b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:-.4px}
.panel span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri-dk);border-bottom-color:var(--pri);font-weight:600}

</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top noprint" id="topbar"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script type="application/json" id="corpus">{"pro":{"PDD-01":{"code":"PDD-01","titolo":"POLITICA DI DUE DILIGENCE E CODICE DI CONDOTTA DEI PARTNER COMMERCIALI","fase":"1 · Integrazione","rif":"OECD Due Diligence Guidance §1 · UNGP 15-16 · CSDDD art. 5-7 · ESRS G1-2/S2","blocks":[{"k":"t","r":[["PROCEDURA PDD-01","","",""],["Codice:","PDD-01","Revisione:","[Rev.]"],["Titolo:","POLITICA DI DUE DILIGENCE E CODICE DI CONDOTTA DEI PARTNER COMMERCIALI","",""],["Fase del ciclo:","1 · Integrazione","",""],["Riferimenti:","OECD Due Diligence Guidance §1 · UNGP 15-16 · CSDDD art. 5-7 · ESRS G1-2/S2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità con cui [Nome Organizzazione] formalizza il proprio impegno in materia di condotta d'impresa responsabile lungo la catena di fornitura e lo traduce in aspettative esplicite verso i partner commerciali."},{"k":"p","t":"Il campo di applicazione comprende tutti i partner commerciali a monte: fornitori di materiali e componenti, fornitori di servizi, appaltatori e subappaltatori, agenzie di somministrazione e di reclutamento, intermediari e agenti, trasportatori e operatori logistici."},{"k":"p","t":"La politica si applica indipendentemente dal valore dell'ordine e dalla durata del rapporto. L'intensità delle attività di verifica è invece graduata secondo il rischio, con i criteri definiti nella PDD-04."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance for Responsible Business Conduct, fase 1"},{"k":"p","t":"Principi Guida ONU su imprese e diritti umani, principi 15-16"},{"k":"p","t":"Direttiva (UE) 2024/1760 (CSDDD), articoli 5-7"},{"k":"p","t":"ESRS S2 e G1-2 per l'informativa di sostenibilità"},{"k":"p","t":"Convenzioni fondamentali OIL e Dichiarazione universale dei diritti umani"},{"k":"p","t":"D.Lgs. 231/2001 per i reati presupposto connessi alla filiera"},{"k":"p","t":"PDD-02 Governance, PDD-05 Qualifica, PDD-09 Clausole contrattuali"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Partner commerciale","Soggetto con cui l'Organizzazione intrattiene un rapporto commerciale nella propria catena del valore, diretto o indiretto, a monte o a valle."],["Impatto negativo","Effetto pregiudizievole su persone o ambiente che l'Organizzazione causa, a cui contribuisce o a cui è direttamente collegata attraverso i propri rapporti commerciali."],["Condotta d'impresa responsabile","Insieme delle aspettative in materia di diritti umani, lavoro, ambiente, integrità e legalità che l'Organizzazione assume e trasferisce alla propria filiera."],["Codice di condotta dei partner","Documento che formalizza le aspettative minime richieste ai partner commerciali, accettato formalmente all'atto della qualifica."],["Leva","Capacità dell'Organizzazione di ottenere un cambiamento nelle pratiche del partner commerciale."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Alta Dir.","Resp. DD","Acquisti","Legale","Qualità/HSE"],["Approvazione della politica","A/R","R","C","C","I"],["Redazione del codice di condotta","A","R","C","R","C"],["Diffusione ai partner commerciali","I","A","R","I","I"],["Aggiornamento periodico","A","R","C","C","C"],["Verifica dell'accettazione","I","A","R","I","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Contenuto della politica"},{"k":"p","t":"La politica di due diligence è approvata dall'organo decisionale di più alto livello e resa pubblica. Dichiara come minimo:"},{"k":"p","t":"l'impegno a rispettare i diritti umani riconosciuti a livello internazionale e le convenzioni fondamentali OIL lungo tutta la catena di fornitura;"},{"k":"p","t":"l'impegno a identificare, prevenire, attenuare e rimediare gli impatti negativi connessi alle proprie attività e ai propri rapporti commerciali;"},{"k":"p","t":"l'approccio basato sul rischio, con priorità agli impatti più gravi anziché a quelli più facili da gestire;"},{"k":"p","t":"l'impegno a non trasferire ai partner oneri e condizioni commerciali che ne compromettano la capacità di rispettare le aspettative;"},{"k":"p","t":"l'impegno a rendere accessibili canali di segnalazione ai lavoratori della filiera e a garantire il rimedio;"},{"k":"p","t":"il divieto di ritorsione verso chiunque segnali un impatto o collabori a una verifica."},{"k":"p","t":"4.2 Codice di condotta dei partner commerciali"},{"k":"p","t":"Il codice traduce la politica in requisiti verificabili, articolati in cinque aree: diritti dei lavoratori, salute e sicurezza, ambiente, integrità e legalità, gestione della subfornitura."},{"k":"p","t":"Per ciascun requisito il codice indica se si tratta di un requisito inderogabile, la cui violazione comporta l'attivazione immediata della PDD-08, oppure di un requisito soggetto a piano di miglioramento."},{"k":"p","t":"Costituiscono in ogni caso requisiti inderogabili: assenza di lavoro minorile, assenza di lavoro forzato e di servitù per debito, assenza di trattenute su documenti di identità, libertà di associazione, assenza di condizioni che espongano a pericolo grave e immediato, assenza di scarichi o smaltimenti illeciti."},{"k":"p","t":"4.3 Aspettative reciproche"},{"k":"p","t":"La politica riconosce che la capacità del partner di conformarsi dipende anche dalle condizioni commerciali applicate. L'Organizzazione si impegna quindi a:"},{"k":"p","t":"non imporre tempi di consegna o revisioni di prezzo incompatibili con il rispetto dei limiti di orario e delle retribuzioni dovute;"},{"k":"p","t":"riconoscere nei tempi contrattuali i pagamenti dovuti, evitando di trasferire tensione finanziaria a valle;"},{"k":"p","t":"comunicare con congruo anticipo variazioni significative di volume;"},{"k":"p","t":"sostenere i partner con attività di formazione e affiancamento nei casi previsti dalla PDD-08."},{"k":"p","t":"4.4 Diffusione e accettazione"},{"k":"p","t":"Il codice è trasmesso a tutti i partner in fase di qualifica e in occasione di ogni revisione sostanziale. L'accettazione è formalizzata mediante sottoscrizione del MOD-01.02 o mediante clausola contrattuale equivalente (PDD-09)."},{"k":"p","t":"L'elenco dei partner che non hanno restituito l'accettazione è riesaminato trimestralmente ed è condizione ostativa all'emissione di nuovi ordini oltre la soglia definita dalla direzione."},{"k":"p","t":"4.5 Aggiornamento"},{"k":"p","t":"La politica e il codice sono riesaminati almeno ogni due anni, e comunque a fronte di: modifiche normative rilevanti, ingresso in nuovi mercati o categorie merceologiche, impatti gravi accertati, esiti del riesame di cui alla PDD-14."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Quota di partner attivi che hanno accettato il codice","MOD-01.03","Trimestrale","100%"],["Quota della spesa coperta da accettazione formale","MOD-01.03","Trimestrale","≥ 95%"],["Tempo medio tra invio del codice e accettazione","MOD-01.03","Semestrale","≤ 30 giorni"],["Revisioni della politica nei termini previsti","MOD-01.04","Annuale","Nei termini"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-01.01","Politica di due diligence di filiera","Modello di dichiarazione approvata dall'organo decisionale e resa pubblica"],["MOD-01.02","Codice di condotta dei partner commerciali","Requisiti per area, distinzione tra inderogabili e migliorabili, modulo di accettazione"],["MOD-01.03","Registro delle accettazioni","Stato di accettazione per partner, data, versione del codice, copertura sulla spesa"],["MOD-01.04","Verbale di riesame della politica","Esiti del riesame, modifiche introdotte, approvazione"]]}]},"PDD-02":{"code":"PDD-02","titolo":"GOVERNANCE DELLA DUE DILIGENCE E INTEGRAZIONE NEI PROCESSI DI ACQUISTO","fase":"1 · Integrazione","rif":"OECD Guidance §1.2-1.4 · UNGP 16-19 · CSDDD art. 5","blocks":[{"k":"t","r":[["PROCEDURA PDD-02","","",""],["Codice:","PDD-02","Revisione:","[Rev.]"],["Titolo:","GOVERNANCE DELLA DUE DILIGENCE E INTEGRAZIONE NEI PROCESSI DI ACQUISTO","",""],["Fase del ciclo:","1 · Integrazione","",""],["Riferimenti:","OECD Guidance §1.2-1.4 · UNGP 16-19 · CSDDD art. 5","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce ruoli, responsabilità e risorse della due diligence di filiera e le modalità con cui essa è incorporata nei processi decisionali di acquisto, così che le valutazioni sui partner incidano effettivamente sulle scelte commerciali."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 1, sezioni 1.2-1.4"},{"k":"p","t":"Principi Guida ONU, principi 16-19"},{"k":"p","t":"CSDDD, articolo 5 (integrazione nelle politiche e nei sistemi di gestione)"},{"k":"p","t":"PDD-01 Politica, PDD-05 Qualifica, PDD-14 Riesame"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Responsabile due diligence","Funzione cui è assegnato il presidio operativo del processo, con accesso diretto all'alta direzione."],["Comitato di filiera","Organismo interfunzionale che delibera sulle posizioni critiche e sui casi di disengagement."],["Categoria merceologica","Raggruppamento omogeneo di beni o servizi acquistati, unità elementare di analisi del rischio."],["Soglia di rilevanza","Valore di spesa o livello di rischio oltre il quale si attivano obblighi di verifica rafforzati."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Alta Dir.","Resp. DD","Acquisti","Legale","Comitato"],["Nomina del responsabile due diligence","A/R","I","I","C","I"],["Definizione delle soglie di rilevanza","A","R","C","C","C"],["Valutazione dei partner in fase di scelta","I","C","R","I","I"],["Decisione su partner ad alto rischio","A","R","C","C","R"],["Assegnazione di risorse e budget","A/R","R","C","I","C"],["Formazione delle funzioni acquisti","I","R","R","I","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Assegnazione delle responsabilità"},{"k":"p","t":"L'alta direzione nomina formalmente il responsabile della due diligence (MOD-02.01), attribuendogli autonomia di accesso alle informazioni sui partner, ai contratti e ai dati di spesa, e potere di sospendere l'onboarding di un partner in presenza di indicatori di rischio inderogabile."},{"k":"p","t":"La responsabilità ultima resta in capo all'alta direzione e non è delegabile."},{"k":"p","t":"4.2 Comitato di filiera"},{"k":"p","t":"Il comitato è composto da direzione, responsabile due diligence, acquisti, qualità o HSE e legale. Si riunisce almeno trimestralmente e in via straordinaria in caso di impatto grave accertato. Delibera su:"},{"k":"p","t":"partner classificati ad alto rischio residuo;"},{"k":"p","t":"proposte di disengagement e relativa valutazione degli effetti (PDD-12);"},{"k":"p","t":"piani d'azione che richiedono investimenti o modifiche delle condizioni commerciali;"},{"k":"p","t":"casi segnalati attraverso il meccanismo di reclamo di filiera."},{"k":"p","t":"Le sedute sono verbalizzate nel MOD-02.02."},{"k":"p","t":"4.3 Integrazione nel processo di acquisto"},{"k":"p","t":"La due diligence è incorporata nel ciclo passivo attraverso i seguenti punti di controllo obbligatori:"},{"k":"p","t":"in fase di scouting: nessun partner può essere inserito nell'albo senza valutazione del rischio inerente (PDD-04);"},{"k":"p","t":"in fase di qualifica: l'esito dell'assessment condiziona l'abilitazione (PDD-05, PDD-06);"},{"k":"p","t":"in fase di negoziazione: le clausole di condotta responsabile sono parte integrante delle condizioni (PDD-09);"},{"k":"p","t":"in fase di emissione dell'ordine: il sistema gestionale blocca gli ordini verso partner sospesi o non qualificati;"},{"k":"p","t":"in fase di valutazione periodica: gli esiti della due diligence concorrono al punteggio complessivo del fornitore."},{"k":"p","t":"4.4 Coerenza degli incentivi"},{"k":"p","t":"Gli obiettivi assegnati alla funzione acquisti non possono essere costruiti sul solo risparmio di costo. Almeno un obiettivo annuale è riferito alla qualità della due diligence: copertura degli assessment, chiusura dei piani d'azione, riduzione della quota di spesa ad alto rischio non presidiata."},{"k":"p","t":"4.5 Competenze e formazione"},{"k":"p","t":"Il personale coinvolto riceve formazione documentata su: contenuto della politica e del codice, riconoscimento degli indicatori di lavoro forzato e minorile, conduzione delle verifiche, gestione delle segnalazioni. La formazione è ripetuta almeno ogni due anni e registrata nel MOD-02.03."},{"k":"p","t":"4.6 Risorse"},{"k":"p","t":"L'alta direzione assegna annualmente le risorse necessarie: giornate uomo interne, budget per verifiche di terza parte, strumenti informativi, attività di supporto ai partner. L'adeguatezza delle risorse è oggetto di valutazione nel riesame (PDD-14)."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Sedute del comitato tenute rispetto a quelle previste","MOD-02.02","Annuale","100%"],["Personale acquisti formato negli ultimi 24 mesi","MOD-02.03","Semestrale","100%"],["Ordini emessi verso partner non qualificati","Gestionale","Mensile","0"],["Obiettivi acquisti con componente di due diligence","Piano obiettivi","Annuale","≥ 1 per funzione"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-02.01","Nomina del responsabile due diligence","Atto di nomina con poteri, autonomia e risorse assegnate"],["MOD-02.02","Verbale del comitato di filiera","Ordine del giorno, decisioni, azioni assegnate e termini"],["MOD-02.03","Registro della formazione","Destinatari, contenuti, durata, verifica dell'apprendimento"],["MOD-02.04","Matrice dei punti di controllo nel ciclo passivo","Punti di verifica obbligatori, funzione responsabile, evidenza prodotta"]]}]},"PDD-03":{"code":"PDD-03","titolo":"MAPPATURA DELLA CATENA DI FORNITURA","fase":"2 · Identificazione","rif":"OECD Guidance §2.1 · UNGP 17-18 · CSDDD art. 8 · ESRS S2 SBM-3","blocks":[{"k":"t","r":[["PROCEDURA PDD-03","","",""],["Codice:","PDD-03","Revisione:","[Rev.]"],["Titolo:","MAPPATURA DELLA CATENA DI FORNITURA","",""],["Fase del ciclo:","2 · Identificazione","",""],["Riferimenti:","OECD Guidance §2.1 · UNGP 17-18 · CSDDD art. 8 · ESRS S2 SBM-3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità di ricostruzione e aggiornamento della mappa della catena di fornitura, condizione preliminare per qualsiasi valutazione del rischio: non è possibile identificare impatti in una filiera che non si conosce."},{"k":"p","t":"La mappatura copre i partner diretti e, per le categorie prioritarie, i livelli successivi fino al punto in cui l'Organizzazione perde visibilità, che va documentato anziché ignorato."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 2, sezione 2.1"},{"k":"p","t":"Principi Guida ONU, principi 17-18"},{"k":"p","t":"CSDDD, articolo 8 (individuazione degli impatti negativi)"},{"k":"p","t":"ESRS S2 e SBM-3 per la descrizione della catena del valore"},{"k":"p","t":"PDD-04 Rischio inerente, PDD-07 Prioritizzazione"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Livello 1","Partner con cui esiste un rapporto contrattuale diretto."],["Livello 2 e successivi","Partner dei propri partner, senza rapporto contrattuale diretto con l'Organizzazione."],["Punto di opacità","Nodo della filiera oltre il quale l'Organizzazione non dispone di informazioni verificabili."],["Categoria prioritaria","Categoria merceologica per la quale la mappatura è estesa oltre il primo livello in ragione del rischio."],["Sito produttivo","Unità fisica in cui la lavorazione avviene, distinta dalla sede legale del partner."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Qualità","Partner"],["Raccolta dei dati anagrafici","A","R","C","R"],["Identificazione dei siti produttivi","R","C","C","R"],["Ricostruzione dei livelli successivi","R","C","I","R"],["Aggiornamento periodico","A/R","R","I","R"],["Documentazione dei punti di opacità","R","I","I","C"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Perimetro e granularità"},{"k":"p","t":"La mappatura è organizzata per categoria merceologica. Per ogni categoria si registrano: numero di partner, spesa annua, paesi di produzione, presenza di lavorazioni affidate a terzi, ricorso a manodopera somministrata o intermediata."},{"k":"p","t":"L'unità di analisi non è il partner ma il sito: un partner con più stabilimenti in paesi diversi genera profili di rischio distinti."},{"k":"p","t":"4.2 Dati raccolti per ogni nodo"},{"k":"p","t":"ragione sociale, paese e indirizzo del sito operativo;"},{"k":"p","t":"attività svolta e fase del processo;"},{"k":"p","t":"numero di addetti, con distinzione tra diretti, somministrati e stagionali;"},{"k":"p","t":"presenza di lavoratori migranti e di agenzie di reclutamento;"},{"k":"p","t":"ricorso a subappalto o a lavoro a domicilio;"},{"k":"p","t":"certificazioni possedute e audit subiti negli ultimi 24 mesi."},{"k":"p","t":"4.3 Estensione oltre il primo livello"},{"k":"p","t":"La mappatura è estesa ai livelli successivi per le categorie che presentano almeno una delle seguenti condizioni: materie prime provenienti da aree a rischio elevato, lavorazioni ad alta intensità di manodopera, filiere note per il ricorso al lavoro intermediato, obblighi normativi specifici di tracciabilità."},{"k":"p","t":"L'estensione avviene mediante richiesta documentata ai partner di primo livello, clausole di trasparenza (PDD-09) e, dove disponibili, sistemi di tracciabilità di filiera."},{"k":"p","t":"4.4 Punti di opacità"},{"k":"p","t":"Dove la ricostruzione si interrompe, il punto di opacità è registrato con l'indicazione del motivo (rifiuto del partner, filiera frammentata, intermediazione commerciale, materia prima fungibile) e delle azioni previste per ridurlo."},{"k":"p","t":"La presenza di un punto di opacità in una categoria ad alto rischio inerente costituisce essa stessa un fattore di rischio ai fini della PDD-07."},{"k":"p","t":"4.5 Aggiornamento"},{"k":"p","t":"La mappa è aggiornata almeno annualmente e comunque in occasione di: ingresso di un nuovo partner, apertura o trasferimento di un sito, variazione significativa dei volumi, notizie pubbliche rilevanti su un nodo della filiera."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Quota della spesa mappata a livello di sito","MOD-03.01","Semestrale","≥ 90%"],["Categorie prioritarie mappate oltre il primo livello","MOD-03.02","Annuale","100%"],["Punti di opacità aperti su categorie ad alto rischio","MOD-03.03","Semestrale","In riduzione"],["Aggiornamento della mappa nei termini","MOD-03.01","Annuale","Nei termini"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-03.01","Mappa della catena di fornitura","Nodi per livello, sito, paese, attività, addetti, spesa"],["MOD-03.02","Scheda di categoria merceologica","Profilo della categoria, filiera tipica, criticità note"],["MOD-03.03","Registro dei punti di opacità","Nodo, motivo, rischio associato, azioni di riduzione"],["MOD-03.04","Richiesta di trasparenza al partner","Modulo di richiesta dati sui livelli successivi e sui siti"]]}]},"PDD-04":{"code":"PDD-04","titolo":"VALUTAZIONE DEL RISCHIO INERENTE DI FILIERA","fase":"2 · Identificazione","rif":"OECD Guidance §2.1 · CSDDD art. 8 · ESRS S2-1","blocks":[{"k":"t","r":[["PROCEDURA PDD-04","","",""],["Codice:","PDD-04","Revisione:","[Rev.]"],["Titolo:","VALUTAZIONE DEL RISCHIO INERENTE DI FILIERA","",""],["Fase del ciclo:","2 · Identificazione","",""],["Riferimenti:","OECD Guidance §2.1 · CSDDD art. 8 · ESRS S2-1","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce il metodo con cui l'Organizzazione stima il rischio inerente di ciascun nodo della filiera, cioè il rischio associato al contesto in cui il partner opera, prima e indipendentemente dalle misure che il partner stesso adotta."},{"k":"p","t":"Il rischio inerente serve a graduare l'intensità della due diligence: determina chi viene valutato, con quale profondità e con quale frequenza."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 2, valutazione basata sul rischio"},{"k":"p","t":"CSDDD, articolo 8, paragrafo 2 (mappatura generale e valutazione approfondita)"},{"k":"p","t":"ESRS S2-1 per la descrizione dell'approccio"},{"k":"p","t":"PDD-03 Mappatura, PDD-06 Assessment, PDD-07 Prioritizzazione"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Rischio inerente","Rischio derivante da paese, settore, prodotto e modello di approvvigionamento, indipendente dalle misure adottate dal singolo partner."],["Rischio residuo","Rischio che permane dopo aver considerato le misure documentate e verificate presso il partner."],["Fattore di rischio","Elemento oggettivo che aumenta la probabilità o la gravità di un impatto negativo."],["Categoria di attenzione","Classe assegnata al nodo in esito alla valutazione: bassa, media, alta, critica."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Comitato","Alta Dir."],["Definizione dei fattori e dei pesi","R","C","A","I"],["Aggiornamento delle fonti informative","R","I","I","I"],["Applicazione ai nodi mappati","R","C","I","I"],["Approvazione della classificazione critica","C","I","R","A"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Dimensioni della valutazione"},{"k":"p","t":"Il rischio inerente è stimato combinando quattro dimensioni:"},{"k":"p","t":"rischio paese: contesto normativo e sua effettiva applicazione, libertà sindacale, presenza di lavoro forzato o minorile, corruzione, conflitti;"},{"k":"p","t":"rischio settoriale: intensità di manodopera, stagionalità, pericolosità intrinseca delle lavorazioni, impatti ambientali tipici;"},{"k":"p","t":"rischio di prodotto o materia prima: origine, tracciabilità, presenza di lavorazioni notoriamente critiche;"},{"k":"p","t":"rischio del modello di approvvigionamento: ricorso a intermediari, subappalto, manodopera somministrata o migrante, pressione su tempi e prezzi."},{"k":"p","t":"4.2 Fonti informative"},{"k":"p","t":"La valutazione si fonda su fonti pubbliche e verificabili, aggiornate almeno annualmente: indici e rapporti di organizzazioni internazionali e sindacali, rapporti di organizzazioni della società civile, provvedimenti di autorità, notizie di stampa qualificata, segnalazioni ricevute, esiti di audit precedenti."},{"k":"p","t":"Le fonti utilizzate e la data di consultazione sono registrate nel MOD-04.02, così che la valutazione sia ricostruibile a distanza di tempo."},{"k":"p","t":"4.3 Scala e ponderazione"},{"k":"p","t":"Ogni dimensione è valutata su scala da 1 a 4. I pesi sono definiti dal comitato di filiera e riesaminati annualmente; in assenza di determinazione diversa si applicano pesi uguali."},{"k":"p","t":"Il punteggio complessivo determina la categoria di attenzione:"},{"k":"t","r":[["Punteggio","Categoria","Intensità della due diligence"],["1,0 - 1,7","Bassa","Autovalutazione semplificata alla qualifica, rinnovo triennale"],["1,8 - 2,5","Media","Autovalutazione completa, rinnovo biennale, verifica documentale a campione"],["2,6 - 3,3","Alta","Assessment completo, verifica documentale, audit almeno triennale"],["3,4 - 4,0","Critica","Assessment completo, audit in loco prima dell'abilitazione e con cadenza annuale"]]},{"k":"p","t":"4.4 Fattori di elevazione automatica"},{"k":"p","t":"Indipendentemente dal punteggio, il nodo è classificato almeno in categoria alta in presenza di: ricorso ad agenzie di reclutamento per lavoratori migranti, lavorazioni affidate a domicilio, sito non dichiarato emerso in verifica, segnalazione fondata pervenuta dal meccanismo di reclamo, provvedimento di autorità negli ultimi 36 mesi."},{"k":"p","t":"4.5 Riesame"},{"k":"p","t":"La classificazione è riesaminata annualmente, e comunque a fronte di variazioni di contesto, di nuovi impatti accertati o dell'esito di un audit. Le variazioni sono tracciate con data e motivazione."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Nodi mappati con rischio inerente valutato","MOD-04.01","Trimestrale","100%"],["Quota della spesa in categoria alta o critica","MOD-04.01","Semestrale","Monitoraggio"],["Valutazioni aggiornate negli ultimi 12 mesi","MOD-04.01","Annuale","≥ 95%"],["Fonti informative aggiornate","MOD-04.02","Annuale","Nei termini"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-04.01","Registro del rischio inerente","Punteggio per dimensione, categoria di attenzione, data di valutazione"],["MOD-04.02","Registro delle fonti informative","Fonte, ambito coperto, data di consultazione, esito rilevante"],["MOD-04.03","Scheda paese e settore","Sintesi dei fattori di rischio ricorrenti per contesto"],["MOD-04.04","Verbale di riesame della metodologia","Revisione di fattori, pesi e soglie con motivazione"]]}]},"PDD-05":{"code":"PDD-05","titolo":"QUALIFICA E ONBOARDING DEL PARTNER COMMERCIALE","fase":"1 · Integrazione","rif":"OECD Guidance §1.3 · CSDDD art. 10 · ESRS G1-2","blocks":[{"k":"t","r":[["PROCEDURA PDD-05","","",""],["Codice:","PDD-05","Revisione:","[Rev.]"],["Titolo:","QUALIFICA E ONBOARDING DEL PARTNER COMMERCIALE","",""],["Fase del ciclo:","1 · Integrazione","",""],["Riferimenti:","OECD Guidance §1.3 · CSDDD art. 10 · ESRS G1-2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce il processo di ammissione di un nuovo partner commerciale, dalla raccolta della documentazione all'abilitazione all'emissione degli ordini, e le condizioni di sospensione e revoca della qualifica."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 1, sezione 1.3"},{"k":"p","t":"CSDDD, articolo 10 (prevenzione degli impatti negativi potenziali)"},{"k":"p","t":"D.Lgs. 231/2001 e normativa su appalti e responsabilità solidale"},{"k":"p","t":"PDD-04 Rischio inerente, PDD-06 Assessment, PDD-09 Clausole"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Qualifica","Esito positivo del processo di valutazione che abilita il partner a ricevere ordini."],["Qualifica condizionata","Abilitazione limitata nel tempo o nei volumi, subordinata al completamento di azioni definite."],["Sospensione","Blocco temporaneo dell'emissione di nuovi ordini, senza risoluzione del contratto."],["Albo dei partner","Elenco strutturato dei partner qualificati per categoria merceologica."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Legale","Comitato","Alta Dir."],["Raccolta documentale","C","R","I","I","I"],["Valutazione del rischio inerente","R","C","I","I","I"],["Decisione di qualifica ordinaria","A","R","C","I","I"],["Decisione su partner in categoria critica","R","C","C","A","I"],["Sospensione e revoca","R","C","C","A","A"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Documentazione minima"},{"k":"p","t":"All'avvio del processo il partner trasmette: visura camerale o equivalente, documento di regolarità contributiva, elenco dei siti produttivi, dichiarazione sull'organico e sul ricorso a subappalto e somministrazione, certificazioni possedute, accettazione del codice di condotta (MOD-01.02)."},{"k":"p","t":"Per i partner esteri la documentazione equivalente è individuata caso per caso e registrata."},{"k":"p","t":"4.2 Percorso graduato"},{"k":"p","t":"L'intensità del percorso dipende dalla categoria di attenzione assegnata secondo la PDD-04:"},{"k":"t","r":[["Categoria","Documentazione","Assessment","Verifica prima dell'abilitazione"],["Bassa","Minima","Autovalutazione semplificata","Controllo formale della completezza"],["Media","Minima ed estesa","Autovalutazione completa","Verifica documentale a campione"],["Alta","Estesa","Assessment completo","Verifica documentale integrale"],["Critica","Estesa","Assessment completo","Audit in loco con esito positivo"]]},{"k":"p","t":"4.3 Esito"},{"k":"p","t":"L'esito può essere: qualifica piena, qualifica condizionata con piano d'azione e termine, oppure diniego motivato."},{"k":"p","t":"La qualifica condizionata prevede limiti espliciti (durata, volume massimo, esclusione di determinate lavorazioni) e verifica di chiusura entro il termine assegnato. Il mancato completamento comporta la sospensione automatica."},{"k":"p","t":"4.4 Cause di diniego immediato"},{"k":"p","t":"Costituiscono causa di diniego, senza possibilità di piano d'azione: evidenza di lavoro minorile o forzato, trattenuta di documenti di identità dei lavoratori, ostacolo all'accesso dei rappresentanti dei lavoratori, rifiuto di consentire la verifica, dichiarazioni deliberatamente non veritiere."},{"k":"p","t":"4.5 Sospensione e revoca"},{"k":"p","t":"La qualifica è sospesa in presenza di: impatto grave accertato non seguito da rimedio, mancata attuazione del piano d'azione nei termini, ostacolo alle verifiche, decadenza dei requisiti di regolarità. La revoca è deliberata dal comitato e segue la PDD-12 per la valutazione degli effetti della cessazione."},{"k":"p","t":"4.6 Mantenimento"},{"k":"p","t":"La qualifica ha validità coerente con la categoria di attenzione (triennale, biennale o annuale). Il rinnovo richiede l'aggiornamento della documentazione e dell'assessment."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Partner attivi con qualifica valida","MOD-05.01","Mensile","100%"],["Qualifiche condizionate chiuse entro il termine","MOD-05.02","Semestrale","≥ 90%"],["Tempo medio del processo di qualifica","MOD-05.01","Semestrale","≤ 45 giorni"],["Ordini verso partner sospesi","Gestionale","Mensile","0"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-05.01","Albo dei partner commerciali","Anagrafica, categoria, stato di qualifica, validità, siti collegati"],["MOD-05.02","Scheda di qualifica","Documentazione acquisita, esito, condizioni, termini e verifica di chiusura"],["MOD-05.03","Checklist documentale di onboarding","Elenco dei documenti richiesti per tipologia di partner e paese"],["MOD-05.04","Provvedimento di sospensione o revoca","Motivazione, effetti, comunicazione al partner, azioni conseguenti"]]}]},"PDD-06":{"code":"PDD-06","titolo":"ASSESSMENT DEL PARTNER COMMERCIALE","fase":"2 · Identificazione","rif":"OECD Guidance §2.2 · CSDDD art. 8 · ESRS S2-2","blocks":[{"k":"t","r":[["PROCEDURA PDD-06","","",""],["Codice:","PDD-06","Revisione:","[Rev.]"],["Titolo:","ASSESSMENT DEL PARTNER COMMERCIALE","",""],["Fase del ciclo:","2 · Identificazione","",""],["Riferimenti:","OECD Guidance §2.2 · CSDDD art. 8 · ESRS S2-2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità di valutazione delle misure effettivamente adottate dal partner commerciale, attraverso autovalutazione strutturata e verifica documentale, e la determinazione del rischio residuo."},{"k":"p","t":"L'assessment misura ciò che il partner fa; il rischio inerente misura il contesto in cui opera. La combinazione dei due determina la priorità di intervento."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 2, sezione 2.2"},{"k":"p","t":"CSDDD, articolo 8 (valutazione approfondita)"},{"k":"p","t":"ESRS S2-2 sui processi di coinvolgimento"},{"k":"p","t":"PDD-04 Rischio inerente, PDD-07 Prioritizzazione, PDD-10 Verifiche"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Autovalutazione","Questionario compilato dal partner sotto la propria responsabilità, con evidenze allegate."],["Verifica documentale","Controllo della coerenza tra risposte fornite ed evidenze prodotte, svolto dall'Organizzazione."],["Punteggio di maturità","Valore sintetico che esprime il grado di presidio del partner per area tematica."],["Segnale di allerta","Risposta o evidenza che, indipendentemente dal punteggio, impone approfondimento immediato."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Qualità/HSE","Partner"],["Invio del questionario","A","R","I","I"],["Compilazione ed evidenze","I","I","I","R"],["Verifica documentale","R","C","C","C"],["Attribuzione del punteggio","R","I","C","I"],["Comunicazione dell'esito","R","R","I","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Aree del questionario"},{"k":"p","t":"Il questionario è articolato in sette aree: governance e politiche; lavoro minorile e giovani lavoratori; lavoro forzato e reclutamento; orario, retribuzioni e contratti; libertà di associazione e rappresentanza; salute e sicurezza; ambiente e legalità."},{"k":"p","t":"Ogni area contiene domande a risposta chiusa con richiesta di evidenza documentale. Le domande sono formulate in modo da rendere l'assenza di presidio riconoscibile: non «rispettate i limiti di orario» ma «quale strumento registra le ore effettivamente lavorate e chi lo controlla»."},{"k":"p","t":"4.2 Estensione secondo la categoria"},{"k":"p","t":"La versione semplificata copre le aree governance, lavoro forzato e minorile, salute e sicurezza. La versione completa copre tutte le aree e richiede evidenze per ogni risposta positiva."},{"k":"p","t":"Per i partner che ricorrono ad agenzie di reclutamento o a subappalto è obbligatoria la sezione integrativa sulla catena a valle del partner."},{"k":"p","t":"4.3 Punteggio e rischio residuo"},{"k":"p","t":"Ogni area produce un punteggio di maturità da 1 a 4. Il rischio residuo del nodo si ottiene modulando il rischio inerente con il punteggio di maturità, secondo la matrice seguente:"},{"k":"t","r":[["Maturità →","1 assente","2 iniziale","3 strutturata","4 consolidata"],["Inerente critica","Critico","Critico","Alto","Alto"],["Inerente alta","Critico","Alto","Alto","Medio"],["Inerente media","Alto","Medio","Medio","Basso"],["Inerente bassa","Medio","Medio","Basso","Basso"]]},{"k":"p","t":"Il rischio residuo determina la priorità di intervento nella PDD-07 e la frequenza delle verifiche nella PDD-10."},{"k":"p","t":"4.4 Segnali di allerta"},{"k":"p","t":"Impongono approfondimento immediato, a prescindere dal punteggio complessivo:"},{"k":"p","t":"assenza di registrazione delle ore lavorate o registrazioni palesemente uniformi;"},{"k":"p","t":"retribuzioni dichiarate inferiori al minimo legale o settoriale del paese;"},{"k":"p","t":"presenza di lavoratori privi di contratto scritto;"},{"k":"p","t":"costi di reclutamento posti a carico dei lavoratori;"},{"k":"p","t":"custodia di documenti di identità da parte del datore di lavoro;"},{"k":"p","t":"alloggi forniti dal datore di lavoro non oggetto di verifica;"},{"k":"p","t":"assenza di rappresentanza dei lavoratori in contesti dove è consentita;"},{"k":"p","t":"rifiuto di fornire evidenze su una specifica area."},{"k":"p","t":"4.5 Verifica documentale"},{"k":"p","t":"L'Organizzazione verifica la coerenza tra risposte ed evidenze su un campione non inferiore al 20% delle domande, e integralmente per i partner in categoria alta e critica."},{"k":"p","t":"Le incoerenze rilevate sono contestate al partner e, se non chiarite entro il termine assegnato, comportano la classificazione dell'area al livello di maturità 1."},{"k":"p","t":"4.6 Validità e rinnovo"},{"k":"p","t":"L'assessment ha validità di dodici mesi per la categoria critica, ventiquattro per la categoria alta, trentasei per le restanti. È ripetuto anticipatamente in caso di impatto accertato, segnalazione fondata o variazione sostanziale dell'attività del partner."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Partner in categoria alta e critica con assessment valido","MOD-06.02","Trimestrale","100%"],["Quota della spesa coperta da assessment valido","MOD-06.02","Semestrale","≥ 90%"],["Segnali di allerta aperti oltre 60 giorni","MOD-06.03","Trimestrale","0"],["Incoerenze documentali rilevate e chiarite","MOD-06.03","Semestrale","≥ 90%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-06.01","Questionario di autovalutazione del partner","Sette aree tematiche con richiesta di evidenza per ciascuna risposta"],["MOD-06.02","Registro degli assessment","Esito per area, punteggio di maturità, rischio residuo, validità"],["MOD-06.03","Registro dei segnali di allerta","Segnale rilevato, approfondimento svolto, esito, azioni attivate"],["MOD-06.04","Verbale di verifica documentale","Campione esaminato, coerenze e incoerenze, contestazioni, chiusura"]]}]},"PDD-07":{"code":"PDD-07","titolo":"IDENTIFICAZIONE E PRIORITIZZAZIONE DEGLI IMPATTI NEGATIVI","fase":"2 · Identificazione","rif":"OECD Guidance §2.3 · UNGP 24 · CSDDD art. 9","blocks":[{"k":"t","r":[["PROCEDURA PDD-07","","",""],["Codice:","PDD-07","Revisione:","[Rev.]"],["Titolo:","IDENTIFICAZIONE E PRIORITIZZAZIONE DEGLI IMPATTI NEGATIVI","",""],["Fase del ciclo:","2 · Identificazione","",""],["Riferimenti:","OECD Guidance §2.3 · UNGP 24 · CSDDD art. 9","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità di identificazione degli impatti negativi connessi alla catena di fornitura e i criteri con cui l'Organizzazione stabilisce l'ordine di intervento quando non è possibile affrontarli tutti simultaneamente."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 2, sezione 2.3"},{"k":"p","t":"Principi Guida ONU, principio 24 (priorità in base alla gravità)"},{"k":"p","t":"CSDDD, articolo 9 (definizione delle priorità)"},{"k":"p","t":"PDD-06 Assessment, PDD-08 Prevenzione, PDD-11 Rimedio"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Impatto attuale","Impatto negativo già in essere sulle persone o sull'ambiente."],["Impatto potenziale","Impatto che potrebbe verificarsi ma non si è ancora manifestato."],["Gravità","Combinazione di scala, portata e irrimediabilità dell'impatto sulle persone coinvolte."],["Scala","Intensità del pregiudizio subito dalla singola persona."],["Portata","Numero di persone coinvolte o estensione del danno ambientale."],["Irrimediabilità","Difficoltà o impossibilità di ripristinare la situazione precedente all'impatto."],["Relazione con l'impatto","Modalità con cui l'Organizzazione è coinvolta: lo causa, vi contribuisce, oppure vi è direttamente collegata attraverso un rapporto commerciale."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Comitato","Alta Dir."],["Raccolta delle informazioni sugli impatti","R","C","I","I"],["Valutazione di gravità","R","C","C","I"],["Determinazione della relazione","R","I","C","I"],["Approvazione dell'ordine di priorità","C","I","R","A"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Fonti di identificazione"},{"k":"p","t":"Gli impatti sono identificati attraverso: esiti degli assessment e delle verifiche, segnalazioni pervenute al meccanismo di reclamo, informazioni da rappresentanze dei lavoratori e organizzazioni della società civile, fonti pubbliche e stampa, esiti di audit di terza parte, informazioni ricevute dai clienti a valle."},{"k":"p","t":"Nessuna fonte è di per sé sufficiente: l'assenza di segnalazioni in un contesto ad alto rischio inerente non è evidenza di assenza di impatti, ma indicatore di possibile inaccessibilità dei canali."},{"k":"p","t":"4.2 Valutazione della gravità"},{"k":"p","t":"La gravità è determinata combinando le tre componenti, ciascuna su scala da 1 a 4:"},{"k":"t","r":[["Componente","1","2","3","4"],["Scala","Disagio limitato","Pregiudizio apprezzabile","Pregiudizio grave","Lesione di diritti fondamentali"],["Portata","Singoli casi","Gruppo circoscritto","Parte rilevante degli addetti","Comunità o intera forza lavoro"],["Irrimediabilità","Ripristino immediato","Ripristino con costo","Ripristino parziale","Danno irreversibile"]]},{"k":"p","t":"La gravità complessiva è pari al valore più alto tra le tre componenti, non alla loro media: un impatto irreversibile su poche persone resta un impatto grave."},{"k":"p","t":"4.3 Ruolo della probabilità"},{"k":"p","t":"La probabilità è considerata soltanto per gli impatti potenziali. Per gli impatti attuali non è un fattore di attenuazione: un impatto già in essere è certo per definizione e la sua priorità dipende unicamente dalla gravità."},{"k":"p","t":"Questa distinzione è vincolante e non può essere superata da valutazioni di convenienza economica."},{"k":"p","t":"4.4 Ordine di priorità"},{"k":"p","t":"L'ordine di intervento segue la gravità. A parità di gravità si considerano, nell'ordine: irreversibilità del danno, vulnerabilità delle persone coinvolte, relazione dell'Organizzazione con l'impatto, capacità di incidere."},{"k":"p","t":"La prioritizzazione riguarda la sequenza temporale degli interventi, non l'esclusione permanente: gli impatti non prioritari restano nel registro e sono ripresi nei cicli successivi."},{"k":"p","t":"4.5 Determinazione della relazione"},{"k":"p","t":"Per ciascun impatto si documenta se l'Organizzazione:"},{"k":"p","t":"lo causa, quando l'impatto deriva direttamente da una propria attività o decisione;"},{"k":"p","t":"vi contribuisce, quando le proprie pratiche commerciali lo agevolano o lo aggravano, per esempio attraverso termini di consegna incompatibili con i limiti di orario;"},{"k":"p","t":"vi è direttamente collegata, quando l'impatto è riconducibile a un partner senza che l'Organizzazione vi abbia concorso."},{"k":"p","t":"La relazione determina la risposta attesa secondo la PDD-08: cessazione e rimedio nei primi due casi, uso della leva nel terzo."},{"k":"p","t":"4.6 Registrazione e riesame"},{"k":"p","t":"Ogni impatto è registrato nel MOD-07.01 con: descrizione, nodo interessato, persone coinvolte, gravità per componente, relazione, fonte, stato. Il registro è riesaminato almeno semestralmente e in ogni seduta del comitato."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Impatti attuali gravi con azione avviata entro 30 giorni","MOD-07.01","Trimestrale","100%"],["Impatti registrati per fonte di identificazione","MOD-07.01","Semestrale","Monitoraggio"],["Impatti chiusi con verifica di efficacia","MOD-07.02","Semestrale","≥ 80%"],["Riesame del registro nei termini","MOD-07.01","Semestrale","Nei termini"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-07.01","Registro degli impatti negativi","Descrizione, nodo, gravità per componente, relazione, priorità, stato"],["MOD-07.02","Scheda di valutazione della gravità","Motivazione analitica di scala, portata e irrimediabilità"],["MOD-07.03","Registro delle fonti di segnalazione","Origine dell'informazione, attendibilità, riscontri effettuati"],["MOD-07.04","Verbale di prioritizzazione","Ordine di intervento deliberato dal comitato con motivazione"]]}]},"PDD-08":{"code":"PDD-08","titolo":"PREVENZIONE, MITIGAZIONE E USO DELLA LEVA","fase":"3 · Risposta","rif":"OECD Guidance §3 · UNGP 19 · CSDDD art. 10-11","blocks":[{"k":"t","r":[["PROCEDURA PDD-08","","",""],["Codice:","PDD-08","Revisione:","[Rev.]"],["Titolo:","PREVENZIONE, MITIGAZIONE E USO DELLA LEVA","",""],["Fase del ciclo:","3 · Risposta","",""],["Riferimenti:","OECD Guidance §3 · UNGP 19 · CSDDD art. 10-11","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le azioni che l'Organizzazione adotta per far cessare, prevenire e attenuare gli impatti negativi identificati, e le modalità con cui esercita e accresce la propria capacità di incidere sulle pratiche dei partner commerciali."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 3"},{"k":"p","t":"Principi Guida ONU, principio 19 (integrazione e azione appropriata)"},{"k":"p","t":"CSDDD, articoli 10 e 11 (prevenzione degli impatti potenziali e cessazione di quelli effettivi)"},{"k":"p","t":"PDD-07 Prioritizzazione, PDD-12 Disengagement, PDD-11 Rimedio"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Piano d'azione correttivo","Insieme strutturato di azioni concordate con il partner, con responsabili, termini e verifiche."],["Leva","Capacità di ottenere un cambiamento nelle pratiche del partner, derivante da rapporto commerciale, competenza tecnica, reputazione o azione collettiva."],["Correzione","Intervento immediato che rimuove la situazione di pericolo o la violazione in atto."],["Azione preventiva","Intervento sulle cause, volto a impedire il ripetersi dell'impatto."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Comitato","Partner","Alta Dir."],["Definizione del piano d'azione","R","C","C","R","I"],["Correzione immediata","A","I","I","R","I"],["Modifica delle condizioni commerciali","C","R","A","C","A"],["Attività di supporto e formazione","R","C","C","R","I"],["Verifica di chiusura","R","C","I","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Risposta secondo la relazione con l'impatto"},{"k":"t","r":[["Relazione","Risposta attesa"],["L'Organizzazione causa l'impatto","Cessazione immediata dell'attività che lo genera e rimedio alle persone coinvolte"],["L'Organizzazione contribuisce all'impatto","Cessazione del proprio contributo, uso della leva sul partner e concorso al rimedio"],["L'Organizzazione è direttamente collegata","Uso della leva per ottenere che il partner faccia cessare l'impatto e provveda al rimedio"]]},{"k":"p","t":"Nei casi di contributo, l'analisi comprende obbligatoriamente le pratiche di acquisto dell'Organizzazione: tempi di consegna, revisioni di prezzo, variazioni di volume, termini di pagamento."},{"k":"p","t":"4.2 Contenuto del piano d'azione correttivo"},{"k":"p","t":"Il piano distingue sempre la correzione dall'azione preventiva. Per ciascuna azione indica: descrizione, responsabile presso il partner, termine, evidenza attesa a chiusura, eventuale supporto fornito dall'Organizzazione."},{"k":"p","t":"I termini sono graduati: rimozione del pericolo immediato entro 24-72 ore, correzione entro 30 giorni, azione preventiva entro 90 giorni salvo interventi strutturali motivati."},{"k":"p","t":"4.3 Uso della leva"},{"k":"p","t":"La leva è esercitata in ordine crescente di intensità:"},{"k":"p","t":"dialogo tecnico e affiancamento operativo;"},{"k":"p","t":"richiesta formale con termine e verifica;"},{"k":"p","t":"condizionamento dei volumi o dell'ampliamento delle forniture;"},{"k":"p","t":"coinvolgimento del cliente finale o di altri acquirenti del medesimo partner;"},{"k":"p","t":"azione collettiva con altri acquirenti, associazioni di categoria o iniziative settoriali;"},{"k":"p","t":"sospensione della qualifica secondo la PDD-05."},{"k":"p","t":"La cessazione del rapporto è l'ultima opzione e segue la PDD-12: interrompere la fornitura non fa cessare l'impatto sui lavoratori e spesso lo aggrava."},{"k":"p","t":"4.4 Accrescimento della leva"},{"k":"p","t":"Dove la leva è insufficiente, l'Organizzazione adotta misure per accrescerla: aggregazione degli acquisti, contratti pluriennali in cambio di impegni verificabili, adesione a iniziative settoriali, coinvolgimento dei propri clienti, collaborazione con organizzazioni locali e rappresentanze dei lavoratori."},{"k":"p","t":"L'insufficienza della leva è documentata, non presunta: va dimostrato quali misure sono state tentate."},{"k":"p","t":"4.5 Supporto al partner"},{"k":"p","t":"Per i partner che manifestano volontà di adeguamento ma capacità limitata, l'Organizzazione può fornire: materiale informativo tradotto, formazione, affiancamento tecnico, revisione condivisa delle condizioni commerciali, tempi di adeguamento più estesi a fronte di tappe intermedie verificabili."},{"k":"p","t":"4.6 Verifica di efficacia"},{"k":"p","t":"La chiusura del piano richiede evidenza oggettiva, non dichiarazione. Per gli impatti gravi la verifica comprende il riscontro presso i lavoratori interessati, con modalità che ne tutelino la riservatezza."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Piani d'azione chiusi entro i termini","MOD-08.01","Trimestrale","≥ 85%"],["Impatti gravi con correzione entro 72 ore","MOD-08.01","Trimestrale","100%"],["Piani con verifica di efficacia documentata","MOD-08.03","Semestrale","100%"],["Casi in cui sono state modificate le condizioni commerciali proprie","MOD-08.02","Annuale","Monitoraggio"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-08.01","Piano d'azione correttivo","Azioni distinte tra correzione e prevenzione, responsabili, termini, evidenze"],["MOD-08.02","Registro dell'esercizio della leva","Misure adottate per livello, esito, eventuale accrescimento della leva"],["MOD-08.03","Verbale di verifica di efficacia","Evidenze raccolte, riscontro presso i lavoratori, esito e chiusura"],["MOD-08.04","Scheda di supporto al partner","Attività di formazione e affiancamento erogate, tappe intermedie"]]}]},"PDD-09":{"code":"PDD-09","titolo":"CLAUSOLE CONTRATTUALI E TRASFERIMENTO DEGLI OBBLIGHI LUNGO LA FILIERA","fase":"3 · Risposta","rif":"OECD Guidance §3.2 · CSDDD art. 10(2)(b) · D.Lgs. 231/2001","blocks":[{"k":"t","r":[["PROCEDURA PDD-09","","",""],["Codice:","PDD-09","Revisione:","[Rev.]"],["Titolo:","CLAUSOLE CONTRATTUALI E TRASFERIMENTO DEGLI OBBLIGHI LUNGO LA FILIERA","",""],["Fase del ciclo:","3 · Risposta","",""],["Riferimenti:","OECD Guidance §3.2 · CSDDD art. 10(2)(b) · D.Lgs. 231/2001","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le clausole che l'Organizzazione inserisce nei contratti con i partner commerciali e le modalità con cui gli obblighi sono trasferiti ai livelli successivi della filiera."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 3, sezione 3.2"},{"k":"p","t":"CSDDD, articolo 10, paragrafo 2, lettera b (garanzie contrattuali e verifica)"},{"k":"p","t":"D.Lgs. 231/2001; normativa su appalti, subappalto e responsabilità solidale"},{"k":"p","t":"PDD-01 Codice di condotta, PDD-05 Qualifica, PDD-12 Disengagement"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Clausola di condotta responsabile","Pattuizione che vincola il partner al rispetto del codice di condotta e alle verifiche."],["Cascading","Trasferimento degli obblighi dal partner diretto ai propri fornitori e subappaltatori."],["Diritto di audit","Facoltà contrattuale di accedere a siti, documenti e persone ai fini della verifica."],["Clausola di collaborazione","Pattuizione che impegna entrambe le parti a condizioni commerciali compatibili con gli obblighi assunti."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Legale","Resp. DD","Acquisti","Alta Dir."],["Redazione del testo delle clausole","R","R","C","A"],["Inserimento nei contratti","C","C","R","I"],["Negoziazione delle deroghe","R","A","R","C"],["Monitoraggio della copertura contrattuale","I","R","R","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Clausole minime"},{"k":"p","t":"Ogni contratto o condizione generale d'acquisto contiene:"},{"k":"p","t":"obbligo di rispetto del codice di condotta dei partner, richiamato come parte integrante;"},{"k":"p","t":"obbligo di informativa tempestiva su impatti gravi, provvedimenti di autorità e variazioni dei siti produttivi;"},{"k":"p","t":"diritto di audit presso il partner e i suoi subfornitori, con o senza preavviso nei casi motivati;"},{"k":"p","t":"obbligo di dichiarare il ricorso a subappalto, somministrazione e agenzie di reclutamento, con autorizzazione preventiva per le lavorazioni critiche;"},{"k":"p","t":"divieto di trasferire ai lavoratori i costi di reclutamento;"},{"k":"p","t":"obbligo di rendere accessibile ai propri lavoratori il meccanismo di reclamo di cui alla PDD-11;"},{"k":"p","t":"divieto di ritorsione verso chi segnala o collabora a una verifica;"},{"k":"p","t":"obbligo di collaborare al piano d'azione correttivo e al rimedio;"},{"k":"p","t":"facoltà di sospensione e risoluzione secondo la gradualità prevista dalla PDD-12."},{"k":"p","t":"4.2 Clausole di collaborazione"},{"k":"p","t":"Accanto agli obblighi posti al partner, il contratto riconosce impegni dell'Organizzazione: termini di pagamento certi, preavviso per variazioni di volume, revisione concordata dei tempi in caso di adeguamenti richiesti."},{"k":"p","t":"Una clausola che imponga standard senza riconoscere condizioni compatibili è inefficace e, in sede di verifica, viene letta come contributo dell'acquirente all'impatto."},{"k":"p","t":"4.3 Cascading"},{"k":"p","t":"Il partner si obbliga a trasferire ai propri fornitori e subappaltatori, per le categorie indicate dall'Organizzazione, gli obblighi sostanziali del codice e il diritto di audit."},{"k":"p","t":"L'Organizzazione verifica il cascading attraverso: dichiarazione del partner, campionamento dei contratti a valle, riscontro in sede di audit."},{"k":"p","t":"4.4 Deroghe"},{"k":"p","t":"Le deroghe sono ammesse solo in forma scritta, motivata e a termine, approvate dal responsabile della due diligence. Non sono in nessun caso derogabili le clausole relative ai requisiti inderogabili del codice, al diritto di audit e al divieto di ritorsione."},{"k":"p","t":"4.5 Contratti in essere"},{"k":"p","t":"Per i rapporti già in corso privi delle clausole, l'adeguamento avviene al primo rinnovo utile e comunque entro dodici mesi, con priorità ai partner in categoria alta e critica."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Contratti attivi con clausole di condotta responsabile","MOD-09.01","Trimestrale","100%"],["Quota della spesa coperta da clausole","MOD-09.01","Trimestrale","≥ 95%"],["Partner in categoria alta con cascading verificato","MOD-09.02","Semestrale","≥ 80%"],["Deroghe attive oltre il termine concesso","MOD-09.03","Semestrale","0"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-09.01","Registro della copertura contrattuale","Partner, contratto, clausole presenti, data, scadenza"],["MOD-09.02","Verifica del cascading","Evidenze del trasferimento degli obblighi ai livelli successivi"],["MOD-09.03","Registro delle deroghe","Clausola derogata, motivazione, termine, approvazione"],["MOD-09.04","Testo standard delle clausole","Articolato tipo da inserire nei contratti e nelle condizioni generali"]]}]},"PDD-10":{"code":"PDD-10","titolo":"MONITORAGGIO, VERIFICHE E AUDIT SUI PARTNER","fase":"4 · Monitoraggio","rif":"OECD Guidance §4 · UNGP 20 · CSDDD art. 15","blocks":[{"k":"t","r":[["PROCEDURA PDD-10","","",""],["Codice:","PDD-10","Revisione:","[Rev.]"],["Titolo:","MONITORAGGIO, VERIFICHE E AUDIT SUI PARTNER","",""],["Fase del ciclo:","4 · Monitoraggio","",""],["Riferimenti:","OECD Guidance §4 · UNGP 20 · CSDDD art. 15","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità con cui l'Organizzazione verifica l'attuazione delle misure concordate e l'efficacia della propria due diligence, attraverso monitoraggio continuo, verifiche documentali e audit presso i siti dei partner."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 4"},{"k":"p","t":"Principi Guida ONU, principio 20 (monitoraggio dell'efficacia)"},{"k":"p","t":"CSDDD, articolo 15 (monitoraggio periodico)"},{"k":"p","t":"PDD-06 Assessment, PDD-08 Piani d'azione, PDD-11 Reclami"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Monitoraggio","Osservazione continuativa di indicatori e segnali provenienti da fonti diverse."],["Audit di seconda parte","Verifica in loco condotta dall'Organizzazione o da un incaricato per suo conto."],["Audit di terza parte","Verifica condotta da organismo indipendente, riconosciuta se conforme a schemi accettati."],["Verifica non annunciata","Audit svolto senza preavviso, ammesso dalle clausole contrattuali."],["Intervista ai lavoratori","Colloquio riservato con i lavoratori del partner, condotto fuori dalla presenza del management."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Acquisti","Qualità/HSE","Auditor","Comitato"],["Piano annuale delle verifiche","R","C","C","I","A"],["Conduzione dell'audit","A","I","C","R","I"],["Interviste ai lavoratori","A","I","I","R","I"],["Rilievo delle non conformità","R","I","C","R","I"],["Riesame degli esiti aggregati","R","C","C","I","A"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Piano annuale"},{"k":"p","t":"Il piano è costruito sul rischio residuo determinato dalla PDD-06 e definisce, per ciascun nodo, tipo di verifica, periodo e responsabile. Frequenze minime:"},{"k":"t","r":[["Rischio residuo","Frequenza minima","Tipo di verifica"],["Critico","Annuale","Audit in loco, con almeno una verifica non annunciata ogni due cicli"],["Alto","Ogni 24 mesi","Audit in loco o audit di terza parte riconosciuto"],["Medio","Ogni 36 mesi","Verifica documentale con approfondimento a campione"],["Basso","Al rinnovo della qualifica","Verifica documentale semplificata"]]},{"k":"p","t":"4.2 Conduzione dell'audit"},{"k":"p","t":"L'audit comprende: esame documentale (registrazioni di orario, buste paga, contratti, registri infortuni, autorizzazioni ambientali), ispezione dei luoghi di lavoro e degli eventuali alloggi, interviste ai lavoratori."},{"k":"p","t":"Le interviste riguardano un campione rappresentativo per reparto, genere, tipologia contrattuale e provenienza, con particolare attenzione a somministrati e migranti. Si svolgono in luogo riservato, in lingua comprensibile e senza presenza del management. Ai lavoratori è comunicato il canale di segnalazione di cui alla PDD-11."},{"k":"p","t":"4.3 Limiti degli audit"},{"k":"p","t":"L'audit fotografa un momento e può essere eluso. Gli esiti sono quindi letti insieme alle altre fonti: segnalazioni, dati di produttività incompatibili con gli orari dichiarati, turnover anomalo, informazioni da rappresentanze e organizzazioni locali."},{"k":"p","t":"Un audit senza rilievi in un contesto ad alto rischio inerente non chiude la valutazione: impone di verificare l'accessibilità dei canali di ascolto."},{"k":"p","t":"4.4 Classificazione dei rilievi"},{"k":"t","r":[["Classe","Definizione","Termine di risposta"],["Critico","Violazione di requisito inderogabile o pericolo grave e immediato","Correzione entro 72 ore, piano entro 15 giorni"],["Maggiore","Assenza di presidio su requisito rilevante","Piano entro 30 giorni"],["Minore","Presidio presente ma non pienamente efficace","Piano entro 60 giorni"],["Osservazione","Elemento migliorabile senza impatto attuale","Al successivo riesame"]]},{"k":"p","t":"4.5 Monitoraggio continuo"},{"k":"p","t":"Indipendentemente dalle verifiche programmate, sono monitorati con continuità: segnalazioni ricevute, notizie pubbliche sui partner e sui contesti, provvedimenti di autorità, variazioni anomale di prezzo o di tempi di consegna, indicatori di turnover e di infortuni dove disponibili."},{"k":"p","t":"4.6 Riesame aggregato"},{"k":"p","t":"Almeno semestralmente il responsabile della due diligence presenta al comitato un'analisi aggregata: rilievi ricorrenti per area e per paese, efficacia dei piani d'azione, categorie in peggioramento, adeguatezza del piano di verifica."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Verifiche eseguite rispetto al piano","MOD-10.01","Trimestrale","≥ 90%"],["Audit con interviste ai lavoratori","MOD-10.02","Semestrale","100% degli audit in loco"],["Rilievi critici con correzione entro 72 ore","MOD-10.03","Trimestrale","100%"],["Verifiche non annunciate sui nodi critici","MOD-10.01","Annuale","Secondo piano"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-10.01","Piano annuale delle verifiche","Nodo, rischio residuo, tipo di verifica, periodo, responsabile, stato"],["MOD-10.02","Rapporto di audit sul partner","Ambito, documenti esaminati, interviste svolte, rilievi per classe"],["MOD-10.03","Registro dei rilievi","Rilievo, classe, termine, piano collegato, stato di chiusura"],["MOD-10.04","Traccia per le interviste ai lavoratori","Aree di indagine, campionamento, garanzie di riservatezza"]]}]},"PDD-11":{"code":"PDD-11","titolo":"MECCANISMO DI RECLAMO DI FILIERA E RIMEDIO","fase":"6 · Rimedio","rif":"OECD Guidance §6 · UNGP 29-31 · CSDDD art. 14 e 12","blocks":[{"k":"t","r":[["PROCEDURA PDD-11","","",""],["Codice:","PDD-11","Revisione:","[Rev.]"],["Titolo:","MECCANISMO DI RECLAMO DI FILIERA E RIMEDIO","",""],["Fase del ciclo:","6 · Rimedio","",""],["Riferimenti:","OECD Guidance §6 · UNGP 29-31 · CSDDD art. 14 e 12","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce il meccanismo attraverso cui lavoratori della filiera, comunità e altri soggetti interessati possono segnalare impatti negativi, e le modalità con cui l'Organizzazione assicura o concorre al rimedio."},{"k":"p","t":"Il meccanismo è accessibile ai lavoratori dei partner commerciali, compresi somministrati, stagionali e migranti, e non sostituisce i canali interni dei partner né le tutele giurisdizionali."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 6"},{"k":"p","t":"Principi Guida ONU, principi 29-31 (criteri di efficacia dei meccanismi non giudiziari)"},{"k":"p","t":"CSDDD, articoli 14 (meccanismo di notifica e reclamo) e 12 (rimedio)"},{"k":"p","t":"D.Lgs. 24/2023 sul whistleblowing, per quanto applicabile"},{"k":"p","t":"PDD-07 Impatti, PDD-08 Risposta, PDD-12 Disengagement"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Segnalazione","Comunicazione relativa a un impatto negativo attuale o potenziale connesso alla filiera."],["Rimedio","Misura che ripristina, per quanto possibile, la situazione delle persone lese: restituzione, compensazione, riabilitazione, garanzia di non ripetizione."],["Ritorsione","Qualsiasi conseguenza pregiudizievole subita per aver segnalato o collaborato a una verifica."],["Riservatezza","Protezione dell'identità del segnalante e delle informazioni che consentono di risalirvi."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Comitato","Acquisti","Legale","Partner"],["Progettazione e accessibilità del canale","R","A","C","C","C"],["Ricezione e registrazione","R","I","I","I","I"],["Istruttoria","R","C","C","C","R"],["Determinazione del rimedio","R","A","C","C","R"],["Protezione da ritorsione","R","A","I","C","R"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Requisiti di efficacia"},{"k":"p","t":"Il meccanismo è progettato per essere legittimo, accessibile, prevedibile, equo, trasparente, compatibile con i diritti e fondato sul dialogo, e per costituire fonte di apprendimento continuo."},{"k":"p","t":"L'accessibilità è verificata in concreto: canale disponibile nelle lingue effettivamente parlate
