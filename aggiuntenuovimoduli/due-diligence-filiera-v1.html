dai lavoratori della filiera, utilizzabile da telefono senza credenziali aziendali, gratuito, aperto anche in forma anonima, non mediato dal management del partner."},{"k":"p","t":"4.2 Canali"},{"k":"p","t":"modulo online raggiungibile da dispositivo mobile, in più lingue;"},{"k":"p","t":"indirizzo di posta elettronica dedicato, presidiato dal responsabile della due diligence;"},{"k":"p","t":"recapito telefonico con messaggeria;"},{"k":"p","t":"segnalazione tramite rappresentanze dei lavoratori o organizzazioni locali;"},{"k":"p","t":"segnalazione raccolta durante le interviste di audit."},{"k":"p","t":"L'esistenza dei canali è comunicata ai lavoratori della filiera attraverso obbligo contrattuale di affissione presso il partner, materiale tradotto e comunicazione diretta in sede di audit."},{"k":"p","t":"4.3 Ricezione e istruttoria"},{"k":"p","t":"Ogni segnalazione è registrata entro tre giorni lavorativi nel MOD-11.01 con: data, canale, nodo interessato, oggetto, gravità preliminare, presenza di rischio di ritorsione."},{"k":"p","t":"Al segnalante non anonimo è data conferma entro cinque giorni lavorativi, con indicazione dei tempi previsti."},{"k":"p","t":"L'istruttoria è avviata entro dieci giorni. Se la segnalazione riguarda un partner, questi è coinvolto salvo che il coinvolgimento esponga il segnalante a rischio: in tal caso si procede con verifica indipendente."},{"k":"p","t":"Termini di conclusione: quindici giorni per le segnalazioni di gravità alta, sessanta per le altre, con proroghe motivate e comunicate."},{"k":"p","t":"4.4 Determinazione del rimedio"},{"k":"p","t":"Il rimedio è proporzionato al pregiudizio subito e definito, ove possibile, con la partecipazione delle persone lese. Può comprendere: restituzione di somme indebitamente trattenute, rimborso dei costi di reclutamento, regolarizzazione contrattuale, reintegro, cure e riabilitazione, scuse formali, misure di non ripetizione."},{"k":"p","t":"Quando l'Organizzazione ha causato l'impatto o vi ha contribuito, essa provvede o concorre direttamente al rimedio. Quando vi è direttamente collegata, usa la propria leva perché il partner vi provveda, monitorando l'effettiva erogazione."},{"k":"p","t":"L'accettazione del rimedio non è condizionata a rinunce che pregiudichino l'accesso alle tutele giurisdizionali."},{"k":"p","t":"4.5 Protezione da ritorsione"},{"k":"p","t":"È vietata ogni ritorsione verso segnalanti, testimoni e lavoratori intervistati in sede di audit. La condizione dei soggetti coinvolti è monitorata per dodici mesi. Ogni ritorsione accertata costituisce violazione di requisito inderogabile del codice di condotta."},{"k":"p","t":"4.6 Apprendimento"},{"k":"p","t":"Semestralmente le segnalazioni sono analizzate in forma aggregata per tipologia, nodo, paese e categoria merceologica. Gli esiti alimentano la revisione del rischio inerente (PDD-04), del piano di verifica (PDD-10) e delle pratiche di acquisto (PDD-02)."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Segnalazioni ricevute per canale e nodo","MOD-11.01","Semestrale","Monitoraggio"],["Conferme di ricezione entro 5 giorni","MOD-11.01","Trimestrale","100%"],["Segnalazioni chiuse entro i termini","MOD-11.01","Trimestrale","≥ 90%"],["Casi con rimedio erogato e verificato","MOD-11.02","Semestrale","100% dei casi fondati"],["Casi di ritorsione accertati","MOD-11.03","Annuale","0"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-11.01","Registro delle segnalazioni di filiera","Data, canale, nodo, oggetto, gravità, istruttoria, esito, chiusura"],["MOD-11.02","Scheda di rimedio","Persone lese, misura adottata, erogazione, verifica, non ripetizione"],["MOD-11.03","Registro del monitoraggio anti-ritorsione","Soggetti tutelati, periodo di monitoraggio, riscontri"],["MOD-11.04","Materiale informativo per i lavoratori della filiera","Avviso multilingue con canali, garanzie e tempi di risposta"]]}]},"PDD-12":{"code":"PDD-12","titolo":"DISENGAGEMENT RESPONSABILE","fase":"3 · Risposta","rif":"OECD Guidance §3.2 · UNGP 19 · CSDDD art. 10(6) e 11(7)","blocks":[{"k":"t","r":[["PROCEDURA PDD-12","","",""],["Codice:","PDD-12","Revisione:","[Rev.]"],["Titolo:","DISENGAGEMENT RESPONSABILE","",""],["Fase del ciclo:","3 · Risposta","",""],["Riferimenti:","OECD Guidance §3.2 · UNGP 19 · CSDDD art. 10(6) e 11(7)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le condizioni e le modalità con cui l'Organizzazione sospende o cessa un rapporto commerciale per ragioni connesse alla due diligence, assicurando che la decisione non produca sui lavoratori un pregiudizio maggiore dell'impatto che intende affrontare."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 3, sezione sul disengagement"},{"k":"p","t":"Principi Guida ONU, principio 19 e relativo commento"},{"k":"p","t":"CSDDD, articoli 10, paragrafo 6, e 11, paragrafo 7"},{"k":"p","t":"PDD-08 Uso della leva, PDD-05 Sospensione della qualifica"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Disengagement","Cessazione, totale o parziale, del rapporto commerciale con un partner."],["Sospensione","Interruzione temporanea degli ordini, reversibile al verificarsi di condizioni definite."],["Valutazione degli effetti","Analisi delle conseguenze della cessazione sui lavoratori del partner e sul contesto locale."],["Uscita graduale","Riduzione progressiva dei volumi con preavviso, alternativa alla cessazione immediata."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Comitato","Acquisti","Legale","Alta Dir."],["Proposta di disengagement","R","C","C","C","I"],["Valutazione degli effetti","R","A","C","I","I"],["Decisione","C","R","C","C","A"],["Attuazione e comunicazione","C","I","R","R","I"],["Monitoraggio successivo","R","C","I","I","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Presupposti"},{"k":"p","t":"Il disengagement è considerato quando ricorre almeno una delle condizioni:"},{"k":"p","t":"violazione di requisito inderogabile non seguita da correzione entro i termini;"},{"k":"p","t":"rifiuto reiterato di consentire le verifiche o di fornire evidenze;"},{"k":"p","t":"mancata attuazione del piano d'azione senza giustificato motivo, dopo che la leva è stata esercitata ai livelli previsti;"},{"k":"p","t":"ritorsione accertata verso segnalanti o lavoratori intervistati;"},{"k":"p","t":"impatto grave irreversibile che il partner non intende affrontare."},{"k":"p","t":"La sola presenza di un impatto grave non è di per sé presupposto di cessazione: lo è la mancanza di volontà del partner di affrontarlo."},{"k":"p","t":"4.2 Valutazione preventiva degli effetti"},{"k":"p","t":"Prima della decisione è redatta la valutazione degli effetti (MOD-12.01), che considera:"},{"k":"p","t":"numero di lavoratori la cui occupazione dipende dalla commessa;"},{"k":"p","t":"peso dell'Organizzazione sul fatturato del partner;"},{"k":"p","t":"probabilità che la cessazione produca licenziamenti, mancato pagamento di retribuzioni o trasferimento della lavorazione a soggetti meno controllabili;"},{"k":"p","t":"esistenza di alternative meno pregiudizievoli, in primo luogo l'uscita graduale;"},{"k":"p","t":"effetti sul contesto locale, specie in aree monoindustriali;"},{"k":"p","t":"obblighi contrattuali e preavvisi dovuti."},{"k":"p","t":"Se la valutazione conclude che la cessazione produrrebbe un pregiudizio maggiore, si adotta l'uscita graduale accompagnata da misure di mitigazione."},{"k":"p","t":"4.3 Modalità di attuazione"},{"k":"p","t":"La decisione è comunicata per iscritto con motivazione, termini e indicazione delle condizioni di eventuale riammissione. Ove possibile:"},{"k":"p","t":"si concede un preavviso proporzionato alla dipendenza economica del partner;"},{"k":"p","t":"si onorano gli ordini già emessi e i pagamenti maturati;"},{"k":"p","t":"si riduce gradualmente il volume anziché interromperlo;"},{"k":"p","t":"si informano, ove utile e senza esporre a rischio, le rappresentanze dei lavoratori del partner."},{"k":"p","t":"4.4 Casi di cessazione immediata"},{"k":"p","t":"La cessazione è immediata, senza gradualità, in caso di lavoro minorile o forzato accertato e non rimosso, ritorsione grave, o rischio di pregiudizio per l'incolumità delle persone. Anche in questi casi resta dovuta la valutazione degli effetti sui lavoratori e, se l'Organizzazione ha contribuito all'impatto, il concorso al rimedio."},{"k":"p","t":"Nel caso di lavoro minorile, la rimozione del minore dal luogo di lavoro non può tradursi nella perdita di sostentamento per il nucleo familiare: il piano di rimedio prevede la presa in carico secondo la PDD-11."},{"k":"p","t":"4.5 Monitoraggio successivo"},{"k":"p","t":"Per dodici mesi successivi alla cessazione l'Organizzazione monitora, con mezzi proporzionati, gli effetti prodotti e l'eventuale evoluzione della situazione del partner, anche ai fini di una possibile riammissione."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Disengagement preceduti da valutazione degli effetti","MOD-12.01","Annuale","100%"],["Casi risolti con uscita graduale anziché cessazione","MOD-12.02","Annuale","Monitoraggio"],["Preavvisi rispettati","MOD-12.02","Annuale","100%"],["Monitoraggio post-cessazione effettuato","MOD-12.03","Annuale","100%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-12.01","Valutazione degli effetti della cessazione","Dipendenza economica, effetti sui lavoratori, alternative considerate"],["MOD-12.02","Provvedimento di disengagement","Motivazione, modalità, preavviso, condizioni di riammissione"],["MOD-12.03","Registro del monitoraggio post-cessazione","Effetti rilevati nei dodici mesi successivi"],["MOD-12.04","Piano di uscita graduale","Riduzione dei volumi nel tempo, misure di mitigazione concordate"]]}]},"PDD-13":{"code":"PDD-13","titolo":"COMUNICAZIONE, REPORTING E RISPOSTA ALLE RICHIESTE DEI CLIENTI","fase":"5 · Comunicazione","rif":"OECD Guidance §5 · UNGP 21 · CSDDD art. 16 · ESRS S2-4","blocks":[{"k":"t","r":[["PROCEDURA PDD-13","","",""],["Codice:","PDD-13","Revisione:","[Rev.]"],["Titolo:","COMUNICAZIONE, REPORTING E RISPOSTA ALLE RICHIESTE DEI CLIENTI","",""],["Fase del ciclo:","5 · Comunicazione","",""],["Riferimenti:","OECD Guidance §5 · UNGP 21 · CSDDD art. 16 · ESRS S2-4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità con cui l'Organizzazione rende conto pubblicamente della propria due diligence di filiera e gestisce le richieste informative provenienti da clienti, istituti finanziari, enti di certificazione e altri soggetti interessati."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 5"},{"k":"p","t":"Principi Guida ONU, principio 21 (comunicazione)"},{"k":"p","t":"CSDDD, articolo 16 (comunicazione annuale)"},{"k":"p","t":"ESRS S2-4 e G1 per l'informativa di sostenibilità"},{"k":"p","t":"PDD-07 Impatti, PDD-10 Monitoraggio, PDD-14 Riesame"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Dichiarazione annuale","Documento pubblico che descrive processo, esiti e misure della due diligence nel periodo."],["Richiesta informativa","Domanda di dati o evidenze proveniente da un cliente o da altro soggetto qualificato."],["Informazione commercialmente sensibile","Dato la cui divulgazione pregiudicherebbe legittimi interessi, da bilanciare con l'interesse informativo."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Resp. DD","Alta Dir.","Commerciale","Legale"],["Redazione della dichiarazione annuale","R","A","C","C"],["Approvazione e pubblicazione","C","R","I","C"],["Risposta alle richieste dei clienti","R","I","R","C"],["Verifica della veridicità delle affermazioni","R","A","C","R"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Contenuto della dichiarazione annuale"},{"k":"p","t":"La dichiarazione descrive: politica e codice di condotta; struttura della catena di fornitura e criteri di mappatura; metodo di valutazione del rischio; numero di assessment e verifiche svolte; principali tipologie di impatto identificate e misure adottate; funzionamento del meccanismo di reclamo, numero di segnalazioni e rimedi erogati; indicatori e andamento rispetto all'anno precedente; limiti riconosciuti e obiettivi per l'esercizio successivo."},{"k":"p","t":"4.2 Criteri di redazione"},{"k":"p","t":"La comunicazione è veritiera, comprensibile e verificabile. In particolare:"},{"k":"p","t":"non si dichiara «assenza di lavoro forzato nella filiera» ma si descrive che cosa è stato verificato, come e con quali limiti;"},{"k":"p","t":"i dati sono presentati in valore assoluto e in rapporto alla copertura, evitando percentuali calcolate su basi non dichiarate;"},{"k":"p","t":"le criticità riscontrate sono riportate, perché una dichiarazione priva di rilievi è indice di verifica inefficace, non di filiera esente da rischi;"},{"k":"p","t":"i nomi dei partner e le informazioni che possano esporre a rischio i segnalanti non sono divulgati."},{"k":"p","t":"4.3 Divieto di affermazioni ingannevoli"},{"k":"p","t":"Non sono ammesse affermazioni che attribuiscano al possesso di una certificazione o all'esecuzione di audit un valore di garanzia assoluta. Ogni affermazione pubblica è tracciabile a un'evidenza registrata nel sistema."},{"k":"p","t":"4.4 Richieste dei clienti"},{"k":"p","t":"Le richieste sono registrate nel MOD-13.02 e gestite con risposta entro venti giorni lavorativi. Le informazioni fornite sono coerenti con la dichiarazione annuale e con i dati del sistema; le difformità riscontrate tra quanto richiesto e quanto disponibile sono dichiarate anziché colmate con stime."},{"k":"p","t":"Alle richieste che comportino accesso a dati di terzi si risponde nei limiti degli obblighi di riservatezza contrattuali e della protezione dei dati personali."},{"k":"p","t":"4.5 Comunicazione verso la filiera"},{"k":"p","t":"Gli esiti aggregati sono comunicati anche ai partner commerciali, con indicazione delle criticità ricorrenti e delle aspettative per l'esercizio successivo. Dove esistono rappresentanze dei lavoratori nei siti dei partner, è favorita la loro informazione."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Pubblicazione della dichiarazione nei termini","MOD-13.01","Annuale","Nei termini"],["Richieste dei clienti evase entro 20 giorni","MOD-13.02","Trimestrale","≥ 95%"],["Affermazioni pubbliche tracciate a evidenza","MOD-13.03","Annuale","100%"],["Partner destinatari del ritorno informativo","MOD-13.04","Annuale","≥ 80% della spesa"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-13.01","Dichiarazione annuale di due diligence","Struttura del documento pubblico con i contenuti minimi"],["MOD-13.02","Registro delle richieste informative","Richiedente, oggetto, dati forniti, data di risposta"],["MOD-13.03","Checklist di verifica delle affermazioni","Affermazione pubblica, evidenza a supporto, funzione che la certifica"],["MOD-13.04","Comunicazione di ritorno ai partner","Esiti aggregati, criticità ricorrenti, aspettative per l'esercizio"]]}]},"PDD-14":{"code":"PDD-14","titolo":"RIESAME, INDICATORI E MIGLIORAMENTO CONTINUO","fase":"4 · Monitoraggio","rif":"OECD Guidance §4.3 · UNGP 20 · CSDDD art. 15","blocks":[{"k":"t","r":[["PROCEDURA PDD-14","","",""],["Codice:","PDD-14","Revisione:","[Rev.]"],["Titolo:","RIESAME, INDICATORI E MIGLIORAMENTO CONTINUO","",""],["Fase del ciclo:","4 · Monitoraggio","",""],["Riferimenti:","OECD Guidance §4.3 · UNGP 20 · CSDDD art. 15","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità di riesame periodico dell'intero processo di due diligence, la misurazione della sua efficacia e l'individuazione delle azioni di miglioramento."},{"k":"p","t":"Il riesame non verifica se le attività sono state svolte, ma se hanno prodotto un cambiamento nelle condizioni delle persone lungo la filiera."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"OECD Due Diligence Guidance, fase 4, sezione 4.3"},{"k":"p","t":"Principi Guida ONU, principio 20"},{"k":"p","t":"CSDDD, articolo 15 (monitoraggio dell'adeguatezza ed efficacia)"},{"k":"p","t":"Tutte le procedure PDD-01 ÷ PDD-13"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Riesame di direzione","Valutazione periodica dell'adeguatezza e dell'efficacia del processo da parte dell'alta direzione."],["Indicatore di processo","Misura di ciò che l'Organizzazione ha svolto (copertura, tempestività)."],["Indicatore di esito","Misura del cambiamento prodotto sulle condizioni delle persone."],["Efficacia","Capacità del processo di prevenire, far cessare o attenuare gli impatti negativi."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","Alta Dir.","Resp. DD","Comitato","Acquisti"],["Convocazione del riesame","R","R","C","I"],["Predisposizione dei dati","I","R","C","C"],["Valutazione dell'efficacia","A","R","R","C"],["Definizione degli obiettivi","A/R","R","C","C"],["Assegnazione delle risorse","A/R","C","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Frequenza"},{"k":"p","t":"Il riesame è almeno annuale. È convocato in via straordinaria in caso di: impatto grave accertato, modifica sostanziale della filiera o del modello di approvvigionamento, entrata in vigore di obblighi normativi rilevanti, esito negativo di una verifica esterna."},{"k":"p","t":"4.2 Elementi in ingresso"},{"k":"p","t":"stato di attuazione delle azioni deliberate nel riesame precedente;"},{"k":"p","t":"copertura della mappatura, degli assessment e delle verifiche rispetto alla spesa;"},{"k":"p","t":"registro degli impatti: nuovi, chiusi, riaperti, ripartizione per gravità;"},{"k":"p","t":"esiti dei piani d'azione e verifiche di efficacia;"},{"k":"p","t":"segnalazioni ricevute, rimedi erogati, casi di ritorsione;"},{"k":"p","t":"esiti aggregati degli audit, rilievi ricorrenti per paese e categoria;"},{"k":"p","t":"riscontri da rappresentanze dei lavoratori e organizzazioni locali;"},{"k":"p","t":"richieste dei clienti e obblighi normativi in evoluzione;"},{"k":"p","t":"adeguatezza di risorse, competenze e strumenti;"},{"k":"p","t":"effetti delle proprie pratiche di acquisto sugli impatti rilevati."},{"k":"p","t":"4.3 Valutazione dell'efficacia"},{"k":"p","t":"La valutazione distingue indicatori di processo e indicatori di esito. Il sistema è efficace non quando le verifiche sono state eseguite, ma quando gli impatti si riducono, i rimedi sono effettivamente erogati e i lavoratori della filiera utilizzano i canali di segnalazione."},{"k":"p","t":"Un aumento delle segnalazioni ricevute è letto, di regola, come indice di accessibilità crescente del meccanismo e non come peggioramento della filiera."},{"k":"p","t":"4.4 Elementi in uscita"},{"k":"p","t":"Il riesame produce decisioni documentate su: revisione della politica e del codice; aggiornamento della metodologia di rischio; modifica del piano di verifica; obiettivi dell'esercizio successivo con indicatori e responsabili; risorse assegnate; eventuali modifiche alle pratiche di acquisto; casi da portare a disengagement."},{"k":"p","t":"4.5 Cruscotto degli indicatori"},{"k":"t","r":[["Ambito","Indicatore","Target"],["Copertura","Quota della spesa con partner qualificati e assessment valido","≥ 90%"],["Copertura","Nodi in categoria critica con verifica nei termini","100%"],["Tempestività","Piani d'azione chiusi entro i termini","≥ 85%"],["Esito","Impatti gravi chiusi con verifica di efficacia","100%"],["Esito","Rimedi erogati sui casi fondati","100%"],["Accessibilità","Nodi in cui il canale di reclamo è comunicato ai lavoratori","100%"],["Integrità","Casi di ritorsione accertati","0"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Riesame svolto nei termini","MOD-14.01","Annuale","Nei termini"],["Azioni del riesame precedente completate","MOD-14.02","Annuale","≥ 85%"],["Obiettivi dell'esercizio raggiunti","MOD-14.02","Annuale","≥ 80%"],["Indicatori di esito in miglioramento","MOD-14.03","Annuale","Monitoraggio"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-14.01","Verbale di riesame della due diligence","Elementi in ingresso, valutazione di efficacia, decisioni assunte"],["MOD-14.02","Piano degli obiettivi e delle azioni","Obiettivo, indicatore, responsabile, termine, risorse, stato"],["MOD-14.03","Cruscotto degli indicatori","Indicatori di processo ed esito con andamento pluriennale"],["MOD-14.04","Registro delle opportunità di miglioramento","Proposta, origine, valutazione, esito"]]}]}},"mod":{"MOD-01.01":{"code":"MOD-01.01","pro":"PDD-01","titolo":"Politica di due diligence di filiera","blocks":[{"k":"t","r":[["MODULO MOD-01.01","",""],["Codice:","MOD-01.01","Revisione: [Rev.]"],["Titolo:","POLITICA DI DUE DILIGENCE DI FILIERA",""],["Procedura:","PDD-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Modello di dichiarazione da adattare e approvare da parte dell'organo decisionale di più alto livello."},{"k":"h","t":"IMPEGNI ASSUNTI"},{"k":"p","t":"[Nome Organizzazione] riconosce che le proprie attività di approvvigionamento possono essere connesse a impatti negativi su persone e ambiente, e assume i seguenti impegni verso i lavoratori della propria catena di fornitura e le comunità interessate."},{"k":"p","t":"Rispettare i diritti umani riconosciuti a livello internazionale e le convenzioni fondamentali dell'Organizzazione internazionale del lavoro in tutti i rapporti commerciali, indipendentemente dal paese in cui il partner opera."},{"k":"p","t":"Identificare, prevenire, attenuare gli impatti negativi e rendere conto del modo in cui sono affrontati, dando priorità a quelli più gravi per le persone anziché a quelli più agevoli da gestire."},{"k":"p","t":"Non trasferire ai partner commerciali condizioni di prezzo, tempo o volume che ne compromettano la capacità di rispettare le aspettative assunte."},{"k":"p","t":"Rendere accessibile ai lavoratori della filiera un canale di segnalazione gratuito, riservato e privo di ritorsioni, e assicurare o concorrere al rimedio degli impatti accertati."},{"k":"p","t":"Considerare la cessazione di un rapporto commerciale come ultima opzione, valutandone preventivamente gli effetti sui lavoratori coinvolti."},{"k":"t","r":[["Voce","Compilazione"],["Ambito di applicazione",""],["Data di approvazione",""],["Organo che ha approvato",""],["Modalità di pubblicazione",""],["Data del prossimo riesame",""]]},{"k":"sig"}]},"MOD-01.02":{"code":"MOD-01.02","pro":"PDD-01","titolo":"Codice di condotta dei partner commerciali","blocks":[{"k":"t","r":[["MODULO MOD-01.02","",""],["Codice:","MOD-01.02","Revisione: [Rev.]"],["Titolo:","CODICE DI CONDOTTA DEI PARTNER COMMERCIALI",""],["Procedura:","PDD-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Requisiti minimi richiesti ai partner. I requisiti contrassegnati come inderogabili non ammettono piano di miglioramento: la loro violazione comporta l'attivazione immediata delle misure previste dalla PDD-08."},{"k":"h","t":"A. DIRITTI DEI LAVORATORI"},{"k":"t","r":[["#","Requisito","Natura","Evidenza attesa"]],"b":0},{"k":"t","r":[["A1","Assenza di lavoro minorile e tutela dei giovani lavoratori","Inderogabile","Registro età, documenti di verifica"]],"b":0},{"k":"t","r":[["A2","Assenza di lavoro forzato, servitù per debito e trattenuta di documenti","Inderogabile","Contratti, dichiarazioni dei lavoratori"]],"b":0},{"k":"t","r":[["A3","Costi di reclutamento non a carico dei lavoratori","Inderogabile","Contratti con le agenzie, ricevute"]],"b":0},{"k":"t","r":[["A4","Libertà di associazione e contrattazione collettiva","Inderogabile","Accordi, verbali di rappresentanza"]],"b":0},{"k":"t","r":[["A5","Contratto scritto in lingua comprensibile per ogni lavoratore","Migliorabile","Modelli contrattuali"]],"b":0},{"k":"t","r":[["A6","Orario nei limiti legali e contrattuali, straordinario volontario e maggiorato","Migliorabile","Registrazioni di orario"]],"b":0},{"k":"t","r":[["A7","Retribuzione non inferiore al minimo legale o settoriale, pagata puntualmente","Migliorabile","Buste paga, evidenze di pagamento"]],"b":0},{"k":"t","r":[["A8","Assenza di discriminazione, molestie e sanzioni disciplinari illegittime","Migliorabile","Procedura disciplinare, registro casi"]],"b":0},{"k":"h","t":"B. SALUTE E SICUREZZA"},{"k":"t","r":[["#","Requisito","Natura","Evidenza attesa"]],"b":0},{"k":"t","r":[["B1","Assenza di pericoli gravi e immediati non presidiati","Inderogabile","Valutazione dei rischi, sopralluogo"]],"b":0},{"k":"t","r":[["B2","Dispositivi di protezione forniti a carico del datore di lavoro","Migliorabile","Registro consegna DPI"]],"b":0},{"k":"t","r":[["B3","Formazione, emergenze e primo soccorso","Migliorabile","Attestati, piano di emergenza"]],"b":0},{"k":"t","r":[["B4","Servizi igienici, acqua potabile e, se forniti, alloggi conformi","Migliorabile","Sopralluogo, autorizzazioni"]],"b":0},{"k":"h","t":"C. AMBIENTE"},{"k":"t","r":[["#","Requisito","Natura","Evidenza attesa"]],"b":0},{"k":"t","r":[["C1","Assenza di scarichi e smaltimenti illeciti","Inderogabile","Autorizzazioni, registri rifiuti"]],"b":0},{"k":"t","r":[["C2","Autorizzazioni ambientali valide per le attività svolte","Migliorabile","Titoli autorizzativi"]],"b":0},{"k":"t","r":[["C3","Gestione delle sostanze pericolose","Migliorabile","Schede di sicurezza, stoccaggi"]],"b":0},{"k":"h","t":"D. INTEGRITÀ E LEGALITÀ"},{"k": tardo, e comunque entro cinque giorni lavorativi, ogni impatto grave sui diritti dei lavoratori o sull'ambiente, ogni provvedimento di autorità e ogni variazione dei siti produttivi impiegati."},{"k":"p","t":"Art. 3 — Il Fornitore consente a [Nome Organizzazione] o a soggetti da essa incaricati l'accesso ai siti, alla documentazione e ai lavoratori ai fini della verifica, anche senza preavviso nei casi motivati, garantendo lo svolgimento di colloqui riservati fuori dalla presenza del management."},{"k":"p","t":"Art. 4 — Il Fornitore dichiara preventivamente il ricorso a subappalto, somministrazione e agenzie di reclutamento; per le lavorazioni indicate come critiche il ricorso è subordinato ad autorizzazione scritta."},{"k":"p","t":"Art. 5 — Il Fornitore non pone a carico dei lavoratori, in nessuna forma, i costi di reclutamento, e non trattiene documenti di identità né depositi cauzionali."},{"k":"p","t":"Art. 6 — Il Fornitore rende noto ai propri lavoratori il meccanismo di reclamo di [Nome Organizzazione], mediante affissione nelle lingue da essi parlate, e si astiene da qualsiasi ritorsione verso chi vi ricorra o collabori a una verifica."},{"k":"p","t":"Art. 7 — Il Fornitore trasferisce gli obblighi di cui agli articoli precedenti ai propri fornitori e subappaltatori per le categorie indicate da [Nome Organizzazione]."},{"k":"p","t":"Art. 8 — In caso di inadempimento, [Nome Organizzazione] concorda con il Fornitore un piano d'azione correttivo. La sospensione degli ordini e la risoluzione del contratto sono adottate secondo gradualità, previa valutazione degli effetti sui lavoratori, salvo i casi di violazione dei requisiti inderogabili."},{"k":"h","t":"OBBLIGHI DI [Nome Organizzazione]"},{"k":"p","t":"Art. 9 — [Nome Organizzazione] si obbliga a rispettare i termini di pagamento pattuiti, a comunicare con congruo preavviso variazioni significative dei volumi e a concordare la revisione dei tempi di consegna quando gli adeguamenti richiesti li rendano incompatibili con il rispetto dei limiti di orario."},{"k":"sig"}]},"MOD-10.01":{"code":"MOD-10.01","pro":"PDD-10","titolo":"Piano annuale delle verifiche","blocks":[{"k":"t","r":[["MODULO MOD-10.01","",""],["Codice:","MOD-10.01","Revisione: [Rev.]"],["Titolo:","PIANO ANNUALE DELLE VERIFICHE",""],["Procedura:","PDD-10","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Anno di riferimento",""],["Approvato da",""],["Data di approvazione",""]]},{"k":"t","r":[["#","Nodo","Rischio residuo","Tipo di verifica","Annunciata","Periodo previsto","Responsabile","Data eseguita","Esito","Stato"]],"b":12},{"k":"sig"}]},"MOD-10.02":{"code":"MOD-10.02","pro":"PDD-10","titolo":"Rapporto di audit sul partner","blocks":[{"k":"t","r":[["MODULO MOD-10.02","",""],["Codice:","MOD-10.02","Revisione: [Rev.]"],["Titolo:","RAPPORTO DI AUDIT SUL PARTNER",""],["Procedura:","PDD-10","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Partner commerciale",""],["Codice partner",""],["Paese e sito",""],["Categoria merceologica",""],["Data",""],["Tipo di audit",""],["Annunciato",""],["Gruppo di audit",""],["Durata",""]]},{"k":"h","t":"DOCUMENTI ESAMINATI"},{"k":"t","r":[["Documento","Periodo","Campione","Osservazioni"]],"b":6},{"k":"h","t":"ISPEZIONE DEI LUOGHI"},{"k":"t","r":[["Area","Verifica svolta","Esito"]],"b":6},{"k":"h","t":"INTERVISTE AI LAVORATORI"},{"k":"t","r":[["Voce","Compilazione"],["Numero di lavoratori intervistati",""],["Composizione del campione",""],["Lingue utilizzate",""],["Luogo dei colloqui",""],["Presenza del management (deve essere: no)",""]]},{"k":"t","r":[["Area di indagine","Elementi emersi","Coerenza con la documentazione"]],"b":6},{"k":"h","t":"RILIEVI"},{"k":"t","r":[["#","Rilievo","Classe","Requisito violato","Evidenza","Termine"]],"b":8},{"k":"h","t":"CONCLUSIONI"},{"k":"t","r":[["Voce","Compilazione"],["Valutazione complessiva",""],["Limiti dell'audit",""],["Piano d'azione richiesto",""],["Data di riverifica",""] /* punteggio inerente medio delle quattro dimensioni */
function punteggioInerente(p){
  const v = DIM.map(d => Number(p[d.k]) || 0).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
}
function categoriaInerente(p){
  const s = punteggioInerente(p);
  if (!s) return "";
  let c = s < 1.8 ? "Bassa" : s < 2.6 ? "Media" : s < 3.4 ? "Alta" : "Critica";
  if (FLAGS.some(f => p[f.k]) && (c === "Bassa" || c === "Media")) c = "Alta";
  return c;
}
/* maturità: media delle aree valutate, arrotondata per difetto sulle aree critiche */
function maturita(p){
  const v = AREE.map(a => Number(p["a_" + a.k]) || 0).filter(x => x > 0);
  if (!v.length) return 0;
  const media = v.reduce((a, b) => a + b, 0) / v.length;
  const critiche = ["min", "forz", "hs"].map(k => Number(p["a_" + k]) || 0).filter(x => x > 0);
  const minCritica = critiche.length ? Math.min.apply(null, critiche) : 4;
  return Math.min(media, minCritica + 0.9);
}
/* matrice inerente × maturità → rischio residuo (PDD-06 §4.3) */
const MATRICE = {
  "Critica": ["Critico", "Critico", "Alto", "Alto"],
  "Alta":    ["Critico", "Alto", "Alto", "Medio"],
  "Media":   ["Alto", "Medio", "Medio", "Basso"],
  "Bassa":   ["Medio", "Medio", "Basso", "Basso"]
};
function rischioResiduo(p){
  const ci = categoriaInerente(p); if (!ci) return "";
  const m = maturita(p);
  if (!m) return MATRICE[ci][0];
  return MATRICE[ci][Math.max(0, Math.min(3, Math.round(m) - 1))];
}
/* frequenza minima di verifica in mesi (PDD-10 §4.1) */
const FREQ = { "Critico":12, "Alto":24, "Medio":36, "Basso":48 };
function prossimaVerifica(p){
  const r = rischioResiduo(p); if (!r) return null;
  const ult = ultimaVerifica(p.id);
  if (!ult) return { scaduta: true, testo: "mai verificato" };
  const d = new Date(ult); d.setMonth(d.getMonth() + FREQ[r]);
  const gg = Math.round((d - new Date()) / 86400000);
  return { scaduta: gg < 0, data: d.toISOString().slice(0, 10), gg,
           testo: gg < 0 ? "verifica scaduta da " + (-gg) + " gg" : "entro " + itDate(d.toISOString().slice(0, 10)) };
}
function ultimaVerifica(pid){
  const v = (org().reg.verifiche || []).filter(x => x.partner === pid && x.datae).map(x => x.datae).sort();
  return v.length ? v[v.length - 1] : null;
}
/* estrae il valore numerico iniziale da voci del tipo "3 · pregiudizio grave" */
function lvl(v){ const m = /^\s*(\d)/.exec(String(v == null ? "" : v)); return m ? Number(m[1]) : 0; }
/* gravità impatto: valore più alto tra scala, portata, irrimediabilità (PDD-07 §4.2) */
function gravita(i){
  return Math.max(lvl(i.scala), lvl(i.portata), lvl(i.irrim));
}
const GRAVLAB = ["", "Lieve", "Apprezzabile", "Grave", "Molto grave"];
function assessmentValido(p){
  if (!p.a_data) return false;
  const r = rischioResiduo(p), mesi = r === "Critico" ? 12 : r === "Alto" ? 24 : 36;
  const d = new Date(p.a_data); d.setMonth(d.getMonth() + mesi);
  return d >= new Date();
}

function spesaTot(){ return (org().partner || []).reduce((a, p) => a + n(p.spesa), 0); }
function spesaCon(f){ return (org().partner || []).filter(f).reduce((a, p) => a + n(p.spesa), 0); }
function pcSpesa(f){ const t = spesaTot(); return t ? Math.round(spesaCon(f) / t * 100) : 0; }
function pc(a, b){ return b ? Math.round(a / b * 100) : 0; }

function faseStato(id){
  const o = org(), P = o.partner || [], R = o.reg;
  const attivi = P.filter(p => p.stato !== "Cessato");
  const altiCrit = attivi.filter(p => ["Alta", "Critica"].includes(categoriaInerente(p)));
  let v = [];
  if (id === "1"){
    v = [ statoPro("PDD-01") === "Approvata" ? 100 : 0,
          o.ana.respDD ? 100 : 0,
          pcSpesa(p => p.codice === "Sì"),
          pcSpesa(p => p.clausole === "Sì") ];
  } else if (id === "2"){
    v = [ pc(attivi.filter(p => categoriaInerente(p)).length, attivi.length),
          pc(altiCrit.filter(p => assessmentValido(p)).length, altiCrit.length || 1),
          (R.impatti || []).length ? 100 : 0,
          pc(attivi.filter(p => p.paese && p.sito).length, attivi.length) ];
  } else if (id === "3"){
    const imp = (R.impatti || []).filter(x => gravita(x) >= 3);
    const cap = R.piani || [];
    v = [ pc(imp.filter(x => cap.some(c => c.impatto === x.rif)).length, imp.length || 1),
          pc(cap.filter(c => c.stato === "Chiuso").length, cap.length || 1),
          pcSpesa(p => p.clausole === "Sì") ];
  } else if (id === "4"){
    const ver = R.verifiche || [];
    const dovute = attivi.filter(p => { const pv = prossimaVerifica(p); return pv && pv.scaduta; });
    v = [ pc(ver.filter(x => x.datae).length, ver.length || 1),
          pc(attivi.length - dovute.length, attivi.length || 1),
          (o.riesame && o.riesame.data) ? 100 : 0 ];
  } else if (id === "5"){
    const ric = R.richieste || [];
    v = [ o.ana.dichData ? 100 : 0,
          pc(ric.filter(x => x.stato === "Evasa").length, ric.length || 1) ];
  } else if (id === "6"){
    const seg = R.segnalazioni || [], fond = seg.filter(x => x.fondata === "Sì");
    v = [ (o.ana.canaleEmail || o.ana.canaleUrl || o.ana.canaleTel) ? 100 : 0,
          pc(attivi.filter(p => p.affissione === "Sì").length, attivi.length || 1),
          pc(fond.filter(x => x.rimedio).length, fond.length || 1) ];
  }
  return Math.round(v.reduce((a, b) => a + b, 0) / (v.length || 1));
}
function completamento(){
  const v = FASI.map(f => faseStato(f.id));
  return Math.round(v.reduce((a, b) => a + b, 0) / v.length);
}

function fmtEur(v){ return v ? new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0 }).format(v) + " €" : "—"; }
function urgenze(){
  const o = org(), out = [];
  const add = (t, n, cls, act, id) => { if (n) out.push({ t, n, cls, act, id }); };
  const P = (o.partner || []).filter(p => p.stato !== "Cessato");
  add("Partner senza valutazione del rischio", P.filter(p => !categoriaInerente(p)).length, "t-amb", "gov", "fil");
  add("Partner ad alto rischio senza assessment valido", P.filter(p => ["Alta","Critica"].includes(categoriaInerente(p)) && !assessmentValido(p)).length, "t-red", "gov", "fil");
  add("Verifiche scadute", P.filter(p => { const v = prossimaVerifica(p); return v && v.scaduta; }).length, "t-red", "gov", "fil");

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";

    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}
function docHTML(blocks, ovr, edit){ return blocks.map((b, i) => blockHTML(b, i, ovr, edit)).join(""); }
function txtOf(b){ return b.k === "t" ? b.r.map(r => r.join(" ")).join(" ") : (b.t || ""); }

  const fond = seg.filter(x => x.fondata === "Sì");
  const conf5 = seg.filter(x => x.data && x.conf && (new Date(x.conf) - new Date(x.data)) / 86400000 <= 5);
  const ric = R.richieste || [], ric20 = ric.filter(x => x.data && x.risp && (new Date(x.risp) - new Date(x.data)) / 86400000 <= 20);
  const scadute = P.filter(p => { const v = prossimaVerifica(p); return v && v.scaduta; });

  return "<h1>4 · Indicatori</h1>" +
    '<p class="sub">Gli indicatori di processo misurano ciò che è stato svolto; quelli di esito misurano il cambiamento prodotto. Il sistema è efficace quando migliorano i secondi (PDD-14 §4.3).</p>' +
    '<h2 style="margin:18px 0 10px">Indicatori di processo</h2><div class="grid g4">' +
      B("Spesa con partner qualificati", pcS(pcSpesa(p => p.qualifica === "Piena")), "target ≥ 90%") +
      B("Spesa con assessment valido", pcS(pcSpesa(p => assessmentValido(p))), "target ≥ 90%") +
      B("Copertura contrattuale", pcS(pcSpesa(p => p.clausole === "Sì")), "target 100% della spesa") +

    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      B("Verifiche eseguite", ver.filter(x => x.datae).length + "/" + ver.length, "sul piano annuale · target ≥ 90%") +
      B("Audit non annunciati", ver.filter(x => x.ann === "No" && x.datae).length, "sui nodi a rischio critico") +
      B("Lavoratori intervistati", ver.reduce((a, x) => a + n(x.lav), 0), "nel complesso degli audit svolti") +
      B("Piani chiusi entro i termini", pcS(pc(capInTempo.length, capChiusi.length || 1)), "target ≥ 85%") +
    "</div>" +
    '<h2 style="margin:22px 0 10px">Indicatori di esito</h2><div class="grid g4">' +

function distribGrav(imp){
  if (!imp.length) return '<div class="empty">Nessun impatto registrato.</div>';
  const m = [0,0,0,0,0];
  imp.forEach(x => m[gravita(x)]++);
  const max = Math.max.apply(null, m.slice(1)) || 1;
  return [4,3,2,1].map(g => '<div class="row" style="margin-bottom:7px"><span style="width:110px;font-size:12px">' + g + " · " + GRAVLAB[g] +
    '</span><div class="track" style="flex:1"><i class="' + (g >= 3 ? "no" : g === 2 ? "mid" : "ok") + '" style="width:' + Math.round(m[g] / max * 100) + '%"></i></div>' +
    '<b class="num" style="width:30px">' + m[g] + "</b></div>").join("");
}
function distribRel(imp){
  if (!imp.length) return '<div class="empty">Nessun impatto registrato.</div>';
  const rel = ["Causato", "Contribuito", "Direttamente collegato"];
  const risp = { "Causato":"Cessazione e rimedio diretto", "Contribuito":"Cessazione del contributo e concorso al rimedio", "Direttamente collegato":"Uso della leva sul partner" };
  return "<table><tbody>" + rel.map(r => {
    const nn = imp.filter(x => x.rel === r).length;
    return "<tr><td><b>" + r + '</b><div class="code">' + risp[r] + '</div></td><td class="num"><b>' + nn + "</b></td></tr>";
  }).join("") + "</tbody></table>";
}
function perPaese(P){
  if (!P.length) return '<div class="empty">Nessun partner registrato.</div>';
  const m = {};
  P.forEach(p => { const k = p.paese || "non indicato";
    m[k] = m[k] || { n:0, spesa:0, crit:0 };
    m[k].n++; m[k].spesa += n(p.spesa);
    if (["Critico","Alto"].includes(rischioResiduo(p))) m[k].crit++; });
  const ks = Object.keys(m).sort((a, b) => m[b].spesa - m[a].spesa);
  return '<div class="scroll"><table><thead><tr><th>Paese</th><th style="text-align:right">Nodi</th><th style="text-align:right">Spesa</th><th style="text-align:right">A rischio alto o critico</th></tr></thead><tbody>' +
    ks.map(k => '<tr><td>' + esc(k) + '</td><td class="num">' + m[k].n + '</td><td class="num">' + fmtEur(m[k].spesa) +
      '</td><td class="num">' + (m[k].crit ? '<span class="tag t-red">' + m[k].crit + "</span>" : "0") + "</td></tr>").join("") +
    "</tbody></table></div>";
}

    "table{border-collapse:collapse;width:100%;margin:6pt 0 10pt;font-size:9.5pt}th{background:#EAEDF5;text-align:left}" +
    "th,td{border:1px solid #BCC4D6;padding:4pt 6pt;vertical-align:top}" +
    ".sec{background:#EAEDF5;color:#2A3A5C;font-weight:bold;padding:5pt 8pt;margin:12pt 0 6pt}" +
    ".dhead{border-bottom:2px solid #3F5580;padding-bottom:8pt;margin-bottom:14pt}.k{font-size:8.5pt;color:#7C8992;letter-spacing:1px}" +
    ".code{font-size:8.5pt;color:#7C8992}.miss{color:#B3261E;font-style:italic}.fill{display:block;min-height:14pt;border-bottom:1px solid #BCC4D6}" +
    ".sig{margin-top:22pt}.sig div{display:inline-block;width:45%;margin-right:4%}.sig b{display:block;font-size:8.5pt;color:#7C8992;margin-bottom:24pt}" +
    ".noprint,.edbar{display:none}</style></head><body>" + corpo + "</body></html>";
}
function esportaWord(tipo, id){
  const o = org(), rag = o.ana.ragione || o.nome;
  let titolo = "", corpo = "";
  if (tipo === "pro"){
    const st = proState(id); titolo = id + " " + PRO[id].titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · fase " + esc(PRO[id].fase) + '</div><h2>' + esc(PRO[id].titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[id].blocks, st.ovr, false) +
      (st.add ? '<div class="sec">Integrazioni</div><p>' + nl2br(st.add) + "</p>" : "");
  } else if (tipo === "mod"){
    const d = MOD[id], reg = REGDEF.find(r => r.mod === id); titolo = id + " " + d.titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + d.pro + '</div><h2>' + esc(d.titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + "</div></div>" + (reg ? regStampa(reg) : "") + docHTML(d.blocks, null, false);
  } else if (tipo === "out"){
    titolo = id === "dich" ? "Dichiarazione annuale" : id === "part" ? "Registro della filiera" : "Elenco documenti";
    corpo = id === "dich" ? dichiarazione() : id === "part" ? registroPartner() : elencoDoc();
  } else if (tipo === "part"){
    const p = partnerById(id); titolo = "Scheda partner " + (p ? p.nome : "");
    corpo = schedaPartner(p);
  } else if (tipo === "corpus"){
    titolo = "Sistema di due diligence " + rag;
    corpo = PROLIST.map(c => { const st = proState(c);
      return '<div style="page-break-before:always"></div><div class="dhead"><div class="k">' + c + '</div><h2>' + esc(PRO[c].titolo) + "</h2>" +
        '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[c].blocks, st.ovr, false); }).join("");
  }
  scarica(fileSlug(rag) + "_" + fileSlug(titolo) + ".doc", wordWrap(titolo, corpo), "application/msword");
  toast("Documento pronto per Word");
}
function schedaPartner(p){
  if (!p) return "";
  const riga = (k, v) => "<tr><th>" + esc(k) + "</th><td>" + esc(v == null || v === "" ? "—" : String(v)) + "</td></tr>";
  const o = org();
  return '<div class="dhead"><div class="k">Scheda del partner commerciale</div><h2>' + esc(p.nome) + "</h2>" +
    '<div class="code">' + esc(o.ana.ragione || "") + " · " + itDate(oggi()) + "</div></div>" +
    "<h4>Identificazione</h4><table><tbody>" + riga("Paese", p.paese) + riga("Sito", p.sito) + riga("Livello", p.liv) +
      riga("Categoria merceologica", p.cat) + riga("Attività", p.attivita) + riga("Addetti", p.addetti) +
      riga("di cui somministrati", p.somm) + riga("Subappalto", p.subapp) + "</tbody></table>" +
    "<h4>Rischio</h4><table><tbody>" +
      DIM.map(d => riga(d.l, p[d.k] ? p[d.k] + " · " + d.s[n(p[d.k]) - 1] : "")).join("") +
      riga("Fattori di elevazione", FLAGS.filter(f => p[f.k]).map(f => f.l).join("; ") || "nessuno") +
      riga("Categoria inerente", categoriaInerente(p)) + riga("Maturità", maturita(p) ? maturita(p).toFixed(1) : "") +
      riga("Rischio residuo", rischioResiduo(p)) + "</tbody></table>" +
    "<h4>Assessment</h4><table><thead><tr><th>Area</th><th>Punteggio</th><th>Livello</th></tr></thead><tbody>" +
      AREE.map(a => "<tr><td>" + esc(a.l) + "</td><td>" + (p["a_" + a.k] || "—") + "</td><td>" + (MATLAB[n(p["a_" + a.k])] || "—") + "</td></tr>").join("") +
      "</tbody></table>" + (p.a_allerta ? "<p><b>Segnali di allerta:</b> " + nl2br(p.a_allerta) + "</p>" : "") +
    "<h4>Qualifica e contratto</h4><table><tbody>" + riga("Stato di qualifica", p.qualifica) + riga("Validità", itDate(p.qual_val)) +
      riga("Codice di condotta accettato", p.codice) + riga("Clausole contrattuali", p.clausole) +
      riga("Cascading verificato", p.cascading) + riga("Canale di reclamo comunicato", p.affissione) +
      riga("Spesa annua", fmtEur(n(p.spesa))) + riga("Peso sul fatturato del partner", p.quota ? p.quota + "%" : "") +
      riga("Sostituibilità", p.sostit) + "</tbody></table>" +
    '<div class="sig"><div><b>Responsabile della due diligence</b><span class="fill"></span></div><div><b>Data</b><span class="fill"></span></div></div>';
}
function csvReg(id){
  const d = REGBYID[id], rows = org().reg[id] || [];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  return [d.cols.map(c => q(c.l)).join(";")].concat(rows.map(r =>
    d.cols.map(c => q(c.t === "partner" ? nomePartner(r[c.k]) : r[c.k])).join(";"))).join("\r\n");
}
function csvPartner(){
  const cols = PARTF.filter(f => !f.g);
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = cols.map(c => q(c.l)).concat([q("Categoria inerente"), q("Maturità"), q("Rischio residuo"), q("Ultima verifica")]).join(";");
  return [head].concat((org().partner || []).map(p =>
    cols.map(c => q(p[c.k])).concat([q(categoriaInerente(p)), q(maturita(p) ? maturita(p).toFixed(1) : ""), q(rischioResiduo(p)), q(ultimaVerifica(p.id))]).join(";")
  )).join("\r\n");
}

const ACT = {
  home(){ view = org() ? "home" : "pf"; render(); },
  gov(el){ view = el.dataset.id; sel.part = null; sel.reg = null; render(); },
  fase(el){ view = "sgs"; sel.ffase = el.dataset.id; sel.pro = null; render(); },
  ffase(el){ sel.ffase = el.dataset.id; render(); },
  frisk(el){ sel.frisk = el.dataset.id; render(); },
  newOrg(){ const nn = prompt("Nome dell'organizzazione"); if (!nn) return;
    const o = nuovaOrg(nn.trim()); DB.orgs.push(o); DB.current = o.id; view = "ana"; touch(); render(); toast("Scheda creata con il corpus completo"); },
  openOrg(el){ DB.current = el.dataset.id; view = "home"; sel = { tab:"dati" }; queueSave(); render(); },
  dupOrg(el){ const s = DB.orgs.find(a => a.id === el.dataset.id); if (!s) return;
    const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.nome = s.nome + " (copia)"; DB.orgs.push(c); touch(); render(); toast("Scheda duplicata"); },
  delOrg(el){ const a = DB.orgs.find(x => x.id === el.dataset.id); if (!a) return;
    if (!confirm("Eliminare «" + a.nome + "» con la sua filiera e tutte le registrazioni?")) return;
    DB.orgs = DB.orgs.filter(x => x.id !== a.id); if (DB.current === a.id) DB.current = null; dirty = true; queueSave(); render(); },
  addPart(){ const o = org(); const p = { id: uid(), nome: "Nuovo partner", stato:"Attivo", liv:"Livello 1" };
    o.partner.push(p); sel.part = p.id; sel.tab = "dati"; touch(); render(); },
  openPart(el){ sel.part = el.dataset.id; sel.tab = "dati"; view = "fil"; render(); },
  backPart(){ sel.part = null; render(); },
  ptab(el){ sel.tab = el.dataset.id; render(); },
  delPart(el){ if (!confirm("Eliminare il partner e i suoi riferimenti nei registri?")) return;
    const o = org(); o.partner = o.partner.filter(p => p.id !== el.dataset.id);
    REGDEF.forEach(d => (o.reg[d.id] || []).forEach(r => { if (r.partner === el.dataset.id) r.partner = ""; }));
    sel.part = null; touch(); render(); },
  setDim(el){ const p = partnerById(sel.part); p[el.dataset.k] = n(p[el.dataset.k]) === n(el.dataset.v) ? "" : n(el.dataset.v); touch(); render(); },
  setArea(el){ const p = partnerById(sel.part), k = "a_" + el.dataset.k;
    p[k] = n(p[k]) === n(el.dataset.v) ? "" : n(el.dataset.v); if (!p.a_data) p.a_data = oggi(); touch(); render(); },
  schedaPart(el){ esportaWord("part", el.dataset.id); },
  expPart(){ scarica("filiera-" + oggi() + ".csv", "\ufeff" + csvPartner(), "text/csv;charset=utf-8"); },
  goreg(el){ view = "reg"; sel.reg = el.dataset.id; sel.part = null; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  addRecFor(el){ openModal(recForm(el.dataset.id, null, el.dataset.p)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){ const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const arr = org().reg[id]; if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata"); },
  delRec(el){ if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render(); },
  closeModal(){ closeModal(); },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){ const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value, st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato"); },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  openOut(el){ sel.out = el.dataset.id; render(); },
  backOut(){ sel.out = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){ scarica("archivio-due-diligence-" + oggi() + ".json",
    JSON.stringify({ orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() }, null, 1), "application/json"); },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){ if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); } },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){ if (!confirm("Svuotare l'archivio locale?")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){} view = "pf"; queueSave(); render(); }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.part = null; sel.out = null; sel.q = "";
    document.getElementById("side").classList.remove("open"); render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
  if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.part != null){ const p = partnerById(sel.part); if (p){ p[t.dataset.part] = t.value; touch(); } return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "filq", "sgsq", "modq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.flag != null){ const p = partnerById(sel.part); if (p){ p[t.dataset.flag] = t.checked; touch(); render(); } return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.part != null || t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
</html>
