<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema di gestione integrato — Qualità, Ambiente, Salute e Sicurezza</title>
<style>
:root{
  --pri:#1B6E76;--pri-dk:#134A50;--pri-lt:#E5F1F2;--pri-mid:#5FA0A7;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---- ciclo di due diligence ---- */
.fase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.fase:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.fase .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.fase .nm{font-weight:650;letter-spacing:-.2px;font-size:15px}
.fase .ds{font-size:12px;color:var(--ink-3);line-height:1.45;flex:1}
.fase .pc{font-family:var(--mono);font-size:20px;font-weight:650;letter-spacing:-.5px}
/* ---- rischio ---- */
.rk{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.02em}
.rk-b{background:var(--green-lt);color:var(--green)}
.rk-m{background:var(--blue-lt);color:var(--blue)}
.rk-a{background:var(--amber-lt);color:var(--amber)}
.rk-c{background:var(--red-lt);color:var(--red)}
.sev{display:flex;gap:2px;align-items:center}
.sev i{width:11px;height:11px;border-radius:2px;background:var(--line-2);display:block}
.sev i.on{background:var(--pri)}
.sev i.hi{background:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:56px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 4px;cursor:pointer;font-size:11.5px;text-align:center;color:var(--ink-2)}
.scale button:hover{border-color:var(--pri-mid)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.scale button b{display:block;font-family:var(--mono);font-size:14px}
.flagbox{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.flagbox:last-child{border-bottom:0}
.flagbox input{width:16px;height:16px;margin:2px 0 0;flex:0 0 16px}
.flagbox span{font-size:12.5px;line-height:1.45}
.panel{background:var(--pri-lt);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.panel .row{gap:22px}
.panel b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:-.4px}
.panel span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri-dk);border-bottom-color:var(--pri);font-weight:600}

select.no{border-color:var(--red);color:var(--red);font-weight:600}

/* ---- cruscotto ---- */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font:10px var(--mono);fill:var(--muted)}
.chart .bar{fill:var(--pri-mid)}
.chart .b-ok{fill:var(--green)}
.chart .b-no{fill:var(--red)}
.chart .tg{stroke:var(--pri-dk);stroke-width:1.6}
.chart .sg{stroke:var(--amber);stroke-width:1.4;stroke-dasharray:5 4}
.chart .tgx{fill:var(--pri-dk)}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.spark{width:92px;height:26px;display:block}
.spark polyline{fill:none;stroke-width:1.8;stroke:var(--muted);stroke-linejoin:round;stroke-linecap:round}
.spark.ok polyline{stroke:var(--green)}
.spark.mid polyline{stroke:var(--amber)}
.spark.no polyline{stroke:var(--red)}
.spark.nd polyline{stroke:var(--line-2)}
table.ind td{vertical-align:middle}
.up{color:var(--green);font-weight:600}
.dn{color:var(--red);font-weight:600}
.nrm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font:600 10px/1 var(--mono);margin-right:3px;color:#fff}
.n-q{background:#2F6FA8}.n-a{background:#3E8B58}.n-s{background:#C2762B}
.norma{text-align:left;cursor:pointer;border:1px solid var(--line);transition:border-color .12s,transform .12s}
.norma:hover{border-color:var(--pri);transform:translateY(-1px)}

</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top noprint" id="topbar"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script type="application/json" id="corpus">{"pro":{"PSI-01":{"code":"PSI-01","titolo":"CONTESTO DELL'ORGANIZZAZIONE, PARTI INTERESSATE E CAMPO DI APPLICAZIONE","fase":"4 · Contesto","rif":"ISO 9001 4.1÷4.4 · ISO 14001 4.1÷4.4 · ISO 45001 4.1÷4.4","blocks":[{"k":"t","r":[["PROCEDURA PSI-01","","",""],["Codice:","PSI-01","Revisione:","[Rev.]"],["Titolo:","CONTESTO DELL'ORGANIZZAZIONE, PARTI INTERESSATE E CAMPO DI APPLICAZIONE","",""],["Punti norma:","4 · Contesto","",""],["Riferimenti:","ISO 9001 4.1÷4.4 · ISO 14001 4.1÷4.4 · ISO 45001 4.1÷4.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità con cui [Nome Organizzazione] determina il contesto in cui opera, individua le parti interessate rilevanti e i loro requisiti, stabilisce il campo di applicazione del sistema di gestione integrato e ne identifica i processi."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"ISO 9001, punti 4.1, 4.2, 4.3, 4.4"},{"k":"p","t":"ISO 14001, punti 4.1, 4.2, 4.3, 4.4"},{"k":"p","t":"ISO 45001, punti 4.1, 4.2, 4.3, 4.4"},{"k":"p","t":"PSI-03 Rischi e opportunità, PSI-06 Obblighi di conformità"},{"k":"p","t":"2. ANALISI DEL CONTESTO"},{"k":"p","t":"L'analisi è condotta con metodo strutturato e riesaminata almeno annualmente (MOD-01.01). Sono considerati:"},{"k":"t","r":[["Ambito","Elementi esaminati"],["Esterno · mercato","Domanda, concorrenza, andamento del settore, tecnologie, catena di fornitura"],["Esterno · normativo","Evoluzione della normativa cogente in materia di qualità, ambiente e sicurezza"],["Esterno · ambientale","Condizioni ambientali del sito e del territorio, disponibilità di risorse, condizioni climatiche"],["Esterno · sociale","Aspettative della comunità locale, disponibilità di manodopera, relazioni sindacali"],["Interno · organizzativo","Struttura, ruoli, cultura, conoscenza organizzativa, prestazioni pregresse"],["Interno · tecnico","Impianti, attrezzature, infrastrutture, stato manutentivo, sistemi informativi"],["Interno · economico","Risorse disponibili, capacità di investimento"]]},{"k":"p","t":"2.1 Cambiamento climatico"},{"k":"p","t":"È determinato e motivato se il cambiamento climatico costituisca un fattore rilevante per il sistema, considerando sia gli effetti dell'organizzazione sul clima sia gli effetti del clima sull'organizzazione, tra cui eventi meteorologici estremi che incidano su continuità operativa, sicurezza dei lavoratori e integrità dei presidi ambientali."},{"k":"p","t":"3. PARTI INTERESSATE"},{"k":"p","t":"Sono individuate le parti interessate rilevanti, i loro requisiti e la determinazione di quali tra questi divengano obblighi di conformità (MOD-01.02)."},{"k":"t","r":[["Parte interessata","Esempi di requisiti"],["Clienti","Requisiti di prodotto e servizio, tempi, garanzie, requisiti cogenti applicabili"],["Lavoratori e loro rappresentanti","Condizioni di lavoro sicure e salubri, informazione, consultazione, formazione"],["Autorità di controllo","Adempimenti autorizzativi, obblighi di comunicazione, esiti di verifiche"],["Fornitori e appaltatori","Chiarezza dei requisiti, condizioni contrattuali, coordinamento in materia di sicurezza"],["Comunità locale e residenti","Contenimento di emissioni, rumore, odori, traffico, impatti visivi"],["Proprietà e soci","Continuità, redditività, tutela reputazionale"],["Enti assicurativi e istituti","Adempimenti contributivi e assicurativi, denunce"]]},{"k":"p","t":"3.1 Attenzione ai lavoratori"},{"k":"p","t":"La determinazione delle esigenze e delle aspettative dei lavoratori non è un adempimento formale: costituisce il presupposto della consultazione e della partecipazione disciplinate dalla PSI-02 ed è il canale attraverso cui emergono pericoli che l'analisi tecnica non intercetta."},{"k":"p","t":"4. CAMPO DI APPLICAZIONE"},{"k":"p","t":"Il campo di applicazione (MOD-01.03) è determinato considerando contesto, requisiti delle parti interessate, prodotti e servizi, unità organizzative e sedi, ed è disponibile come informazione documentata."},{"k":"p","t":"Le esclusioni sono ammesse per la sola ISO 9001, limitatamente ai requisiti che non incidono sulla capacità di fornire prodotti e servizi conformi, e sono motivate. Non sono ammesse esclusioni per le attività, i prodotti e i servizi che possono avere impatti ambientali significativi, né per i luoghi di lavoro e le attività sotto il controllo dell'organizzazione ai fini della sicurezza."},{"k":"p","t":"5. PROCESSI DEL SISTEMA"},{"k":"p","t":"I processi necessari al sistema e le loro interazioni sono determinati e rappresentati nella mappa dei processi (MOD-01.04), che per ciascun processo indica: input, output, responsabile, risorse, indicatori di prestazione, rischi e opportunità associati, documentazione applicabile."},{"k":"p","t":"Gli indicatori così individuati alimentano il cruscotto di monitoraggio delle prestazioni di cui alla PSI-15."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Riesame dell'analisi del contesto","MOD-01.01","Annuale","Nei termini"],["Processi con indicatore associato","MOD-01.04","Annuale","100%"],["Requisiti delle parti interessate riesaminati","MOD-01.02","Annuale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-01.01","Analisi del contesto","Fattori interni ed esterni, rilevanza, effetti sul sistema"],["MOD-01.02","Registro delle parti interessate","Parte, requisiti, rilevanza, obbligo di conformità"],["MOD-01.03","Campo di applicazione del sistema integrato","Confini, sedi, attività, esclusioni motivate"],["MOD-01.04","Mappa dei processi","Input, output, responsabile, indicatori, rischi, documenti"]]}]},"PSI-02":{"code":"PSI-02","titolo":"LEADERSHIP, POLITICA, RUOLI E PARTECIPAZIONE DEI LAVORATORI","fase":"5 · Leadership","rif":"ISO 9001 5.1÷5.3 · ISO 14001 5.1÷5.3 · ISO 45001 5.1÷5.4","blocks":[{"k":"t","r":[["PROCEDURA PSI-02","","",""],["Codice:","PSI-02","Revisione:","[Rev.]"],["Titolo:","LEADERSHIP, POLITICA, RUOLI E PARTECIPAZIONE DEI LAVORATORI","",""],["Punti norma:","5 · Leadership","",""],["Riferimenti:","ISO 9001 5.1÷5.3 · ISO 14001 5.1÷5.3 · ISO 45001 5.1÷5.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce gli impegni della direzione, il contenuto e la diffusione della politica integrata, l'attribuzione dei ruoli e le modalità di consultazione e partecipazione dei lavoratori."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"ISO 9001, punti 5.1.1, 5.1.2, 5.2, 5.3"},{"k":"p","t":"ISO 14001, punti 5.1, 5.2, 5.3"},{"k":"p","t":"ISO 45001, punti 5.1, 5.2, 5.3, 5.4"},{"k":"p","t":"2. IMPEGNO DELLA DIREZIONE"},{"k":"p","t":"La direzione si assume la responsabilità dell'efficacia del sistema, assicura che politica e obiettivi siano stabiliti e compatibili con gli indirizzi strategici, integra i requisiti del sistema nei processi di business, rende disponibili le risorse, comunica l'importanza della conformità ai requisiti, promuove il miglioramento e sostiene i ruoli pertinenti."},{"k":"p","t":"Per la sicurezza, la direzione assume la responsabilità complessiva della prevenzione di lesioni e malattie e della predisposizione di luoghi di lavoro sicuri e salubri, sviluppa una cultura che sostenga i risultati attesi, protegge i lavoratori da ritorsioni quando segnalano incidenti, pericoli e opportunità, e assicura l'istituzione e il funzionamento dei processi di consultazione e partecipazione."},{"k":"p","t":"Per la qualità, la direzione assicura l'attenzione al cliente: requisiti del cliente e cogenti determinati e soddisfatti, rischi e opportunità che incidono sulla conformità affrontati, obiettivo dell'accrescimento della soddisfazione mantenuto."},{"k":"p","t":"3. POLITICA INTEGRATA"},{"k":"p","t":"La politica (MOD-02.01) è appropriata alle finalità e al contesto, comprende l'impegno a soddisfare i requisiti applicabili e al miglioramento continuo, e fornisce il quadro per gli obiettivi. Comprende inoltre gli impegni specifici:"},{"k":"t","r":[["Ambito","Impegni"],["Qualità","Soddisfazione dei requisiti del cliente e cogenti, accrescimento della soddisfazione del cliente"],["Ambiente","Protezione dell'ambiente, prevenzione dell'inquinamento, e ulteriori impegni coerenti con il contesto quali uso sostenibile delle risorse, mitigazione e adattamento al cambiamento climatico, protezione della biodiversità"],["Sicurezza","Condizioni di lavoro sicure e salubri per la prevenzione di lesioni e malattie, eliminazione dei pericoli e riduzione dei rischi, consultazione e partecipazione dei lavoratori e dei loro rappresentanti"]]},{"k":"p","t":"La politica è disponibile come informazione documentata, comunicata all'interno, compresa e applicata, e disponibile alle parti interessate. È riesaminata almeno annualmente."},{"k":"p","t":"4. RUOLI E RESPONSABILITÀ"},{"k":"p","t":"Le responsabilità e le autorità sono assegnate, comunicate e comprese a tutti i livelli (MOD-02.02). I lavoratori a ciascun livello si assumono la responsabilità degli aspetti del sistema su cui hanno controllo."},{"k":"t","r":[["Ruolo","Responsabilità principali"],["Direzione","Politica, obiettivi, risorse, riesame, responsabilità complessiva della sicurezza"],["Responsabile del sistema integrato","Conformità del sistema ai requisiti, riferire sulle prestazioni, promuovere l'attenzione al cliente"],["Responsabili di processo","Prestazioni del processo, controllo operativo, indicatori"],["Datore di lavoro e figure della prevenzione","Adempimenti previsti dalla normativa in materia di salute e sicurezza"],["Lavoratori","Osservanza delle disposizioni, segnalazione di pericoli, incidenti e mancati infortuni"]]},{"k":"p","t":"5. CONSULTAZIONE E PARTECIPAZIONE DEI LAVORATORI"},{"k":"p","t":"5.1 Principio"},{"k":"p","t":"La consultazione riguarda la raccolta di opinioni prima di decidere; la partecipazione riguarda il coinvolgimento nel decidere. Sono processi distinti e vanno documentati come tali. L'organizzazione rimuove gli ostacoli che ne limitano l'efficacia: barriere linguistiche, orari, forme contrattuali, timore di ritorsione."},{"k":"p","t":"5.2 Ambiti"},{"k":"t","r":[["Ambito","Modalità"],["Consultazione dei lavoratori non aventi ruoli direttivi","Determinazione delle parti interessate, politica, ruoli e responsabilità, obiettivi, controlli su approvvigionamento e appalti, oggetto del monitoraggio, programma di audit, miglioramento continuo"],["Partecipazione dei lavoratori non aventi ruoli direttivi","Modalità di consultazione e partecipazione, identificazione dei pericoli e valutazione dei rischi, azioni per eliminare i pericoli e ridurre i rischi, requisiti di competenza e formazione, oggetto della comunicazione, misure di controllo e loro attuazione, indagine su incidenti e non conformità e azioni correttive"]]},{"k":"p","t":"5.3 Registrazione"},{"k":"p","t":"Ogni occasione di consultazione o partecipazione è registrata nel MOD-02.04 con oggetto, soggetti coinvolti, contributi raccolti ed esito, indicando se e come i contributi abbiano inciso sulla decisione. Un registro che riporti solo riunioni informative non documenta consultazione."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Occasioni di consultazione e partecipazione svolte","MOD-02.04","Semestrale","Secondo programma"],["Contributi dei lavoratori che hanno prodotto un'azione","MOD-02.04","Annuale","Monitoraggio"],["Riesame della politica svolto","MOD-02.01","Annuale","Nei termini"],["Personale che dichiara di conoscere la politica","MOD-08.03","Annuale","≥ 90%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-02.01","Politica del sistema integrato","Impegni per qualità, ambiente e sicurezza, approvazione e riesame"],["MOD-02.02","Matrice delle responsabilità","Attività del sistema e funzioni responsabili"],["MOD-02.03","Nomina del responsabile del sistema integrato","Compiti, autorità, riporto"],["MOD-02.04","Registro di consultazione e partecipazione","Ambito, soggetti, contributi, esito, effetti sulla decisione"]]}]},"PSI-03":{"code":"PSI-03","titolo":"RISCHI E OPPORTUNITÀ DEL SISTEMA","fase":"6 · Pianificazione","rif":"ISO 9001 6.1 · ISO 14001 6.1.1 e 6.1.4 · ISO 45001 6.1.1 e 6.1.4","blocks":[{"k":"t","r":[["PROCEDURA PSI-03","","",""],["Codice:","PSI-03","Revisione:","[Rev.]"],["Titolo:","RISCHI E OPPORTUNITÀ DEL SISTEMA","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","ISO 9001 6.1 · ISO 14001 6.1.1 e 6.1.4 · ISO 45001 6.1.1 e 6.1.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di determinazione e trattamento dei rischi e delle opportunità che il sistema deve affrontare per conseguire i risultati attesi, prevenire o ridurre gli effetti indesiderati e realizzare il miglioramento."},{"k":"p","t":"1.2 Ambito"},{"k":"p","t":"La presente procedura tratta i rischi e le opportunità di sistema. Gli aspetti ambientali sono valutati secondo la PSI-04, i pericoli e i rischi per la salute e sicurezza secondo la PSI-05, gli obblighi di conformità secondo la PSI-06: gli esiti di tali valutazioni costituiscono ingresso del presente processo."},{"k":"p","t":"2. FONTI DI INDIVIDUAZIONE"},{"k":"p","t":"Analisi del contesto e requisiti delle parti interessate; mappa dei processi e loro prestazioni; aspetti ambientali significativi; rischi per la salute e sicurezza non accettabili; obblighi di conformità; esiti di audit, riesami, non conformità e reclami; incidenti e mancati infortuni; modifiche organizzative, tecniche e normative; conoscenza organizzativa e prestazioni pregresse."},{"k":"p","t":"3. VALUTAZIONE"},{"k":"p","t":"3.1 Rischi"},{"k":"t","r":[["Livello di probabilità","Descrizione"],["1 · improbabile","Nessun precedente, condizioni sfavorevoli al verificarsi"],["2 · possibile","Evento verificabile in circostanze particolari"],["3 · probabile","Precedenti nel settore o condizioni favorevoli"],["4 · molto probabile","Precedenti interni o evento in corso"]]},{"k":"t","r":[["Livello di gravità","Descrizione"],["1 · lieve","Effetti trascurabili sul processo e sulle parti interessate"],["2 · moderata","Disservizio contenuto, costi recuperabili"],["3 · grave","Mancato soddisfacimento di requisiti, perdita di cliente, non conformità a obbligo"],["4 · molto grave","Interruzione dell'attività, danno rilevante, sanzione, danno reputazionale"]]},{"k":"p","t":"Il livello di rischio è dato dal prodotto: 1÷3 basso, 4÷7 medio, 8÷11 alto, 12÷16 critico."},{"k":"p","t":"3.2 Trattamento"},{"k":"t","r":[["Livello","Trattamento"],["Basso","Accettazione con monitoraggio ordinario"],["Medio","Azione pianificata entro il periodo, con verifica dell'efficacia"],["Alto","Azione prioritaria con responsabile, risorse e termine; verifica dell'efficacia obbligatoria"],["Critico","Azione immediata; valutazione della sospensione dell'attività fino all'attuazione delle misure"]]},{"k":"p","t":"3.3 Opportunità"},{"k":"p","t":"Le opportunità sono valutate per beneficio atteso e fattibilità e sono trattate con le medesime modalità delle azioni sui rischi. Rientrano tra le opportunità: il miglioramento delle prestazioni ambientali attraverso interventi tecnici o gestionali; l'adattamento del lavoro ai lavoratori e il miglioramento dell'ergonomia; l'eliminazione di pericoli alla fonte in occasione di rinnovi impiantistici; l'accesso a nuovi mercati o requisiti contrattuali che valorizzano le certificazioni."},{"k":"p","t":"4. INTEGRAZIONE E VERIFICA"},{"k":"p","t":"Le azioni sono integrate nei processi del sistema e non gestite come piano separato. L'efficacia è valutata alla scadenza, con evidenza del criterio adottato: la chiusura di un'azione senza valutazione di efficacia non chiude il rischio."},{"k":"p","t":"5. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Rischi alti e critici con azione attuata nei termini","MOD-03.01","Trimestrale","100%"],["Azioni con efficacia valutata","MOD-03.01","Semestrale","100%"],["Rischi riesaminati nel periodo","MOD-03.01","Annuale","100%"],["Opportunità colte rispetto a quelle individuate","MOD-03.02","Annuale","Monitoraggio"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-03.01","Registro dei rischi e delle opportunità","Processo, evento, probabilità, gravità, livello, azione, efficacia"],["MOD-03.02","Scheda di opportunità","Descrizione, beneficio atteso, fattibilità, azione, esito"]]}]},"PSI-04":{"code":"PSI-04","titolo":"ASPETTI AMBIENTALI E VALUTAZIONE DELLA SIGNIFICATIVITÀ","fase":"6 · Pianificazione","rif":"ISO 14001 6.1.2","blocks":[{"k":"t","r":[["PROCEDURA PSI-04","","",""],["Codice:","PSI-04","Revisione:","[Rev.]"],["Titolo:","ASPETTI AMBIENTALI E VALUTAZIONE DELLA SIGNIFICATIVITÀ","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","ISO 14001 6.1.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di identificazione degli aspetti ambientali delle attività, dei prodotti e dei servizi che l'organizzazione può controllare o influenzare, e di determinazione di quelli che hanno o possono avere impatti ambientali significativi."},{"k":"p","t":"2. AMBITO"},{"k":"p","t":"L'identificazione considera la prospettiva del ciclo di vita, comprendendo per quanto controllabile o influenzabile: approvvigionamento di materie prime e servizi, progettazione, trasporto e logistica, produzione ed erogazione, utilizzo del prodotto, trattamento a fine vita e smaltimento."},{"k":"p","t":"Sono considerate le condizioni operative normali, quelle anomale e le situazioni di emergenza ragionevolmente prevedibili, nonché le attività in avviamento e arresto e quelle di manutenzione."},{"k":"p","t":"3. ASPETTI TIPICI"},{"k":"t","r":[["Aspetto","Impatto potenziale"],["Emissioni in atmosfera","Alterazione della qualità dell'aria, contributo alle emissioni climalteranti"],["Scarichi idrici","Alterazione della qualità delle acque superficiali e sotterranee"],["Produzione di rifiuti","Consumo di volumi di smaltimento, rischio di contaminazione"],["Contaminazione del suolo","Alterazione della matrice suolo e delle acque sotterranee"],["Consumo di risorse","Depauperamento di risorse idriche, energetiche e materiali"],["Consumo energetico ed emissioni di gas serra","Contributo al cambiamento climatico"],["Rumore e vibrazioni","Disturbo alla comunità e agli ecosistemi"],["Odori e polveri","Disturbo alla comunità"],["Uso del suolo e impatto visivo","Alterazione del paesaggio e degli habitat"],["Sostanze pericolose","Rischio di rilascio, effetti su ecosistemi e salute"]]},{"k":"p","t":"4. CRITERI DI SIGNIFICATIVITÀ"},{"k":"t","r":[["Criterio","Scala"],["Gravità dell'impatto","1 trascurabile · 2 contenuto · 3 rilevante · 4 grave o irreversibile"],["Frequenza o probabilità","1 rara · 2 occasionale · 3 frequente · 4 continua"],["Sensibilità del contesto","1 bassa · 2 media · 3 alta · 4 area protetta o vulnerabile"]]},{"k":"p","t":"Il punteggio è dato dal prodotto dei tre criteri. L'aspetto è significativo quando il punteggio è pari o superiore alla soglia stabilita nel MOD-04.02, oppure in presenza di uno dei seguenti elementi:"},{"k":"p","t":"esistenza di una prescrizione legale applicabile non pienamente presidiata;"},{"k":"p","t":"esposto, reclamo o rilievo di autorità o di parti interessate;"},{"k":"p","t":"condizione di emergenza con potenziale rilascio significativo;"},{"k":"p","t":"superamento anche parziale di limiti autorizzativi negli ultimi ventiquattro mesi."},{"k":"p","t":"5. TRATTAMENTO"},{"k":"p","t":"Gli aspetti significativi sono comunicati ai livelli e alle funzioni pertinenti e costituiscono ingresso obbligatorio per: la determinazione dei rischi e delle opportunità (PSI-03), la definizione degli obiettivi (PSI-07), il controllo operativo (PSI-10 e PSI-13), il monitoraggio (PSI-15) e il riesame di direzione (PSI-17)."},{"k":"p","t":"Un aspetto valutato significativo che non trovi corrispondenza in almeno un controllo operativo o in un obiettivo è una lacuna del sistema."},{"k":"p","t":"6. AGGIORNAMENTO"},{"k":"p","t":"L'analisi è riesaminata almeno annualmente e comunque a fronte di: modifiche di attività, prodotti, processi o impianti; nuove sedi o linee; modifiche normative o autorizzative; incidenti ambientali; esiti di monitoraggi che evidenzino variazioni."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Aspetti significativi con controllo operativo associato","MOD-04.01","Semestrale","100%"],["Aspetti significativi coperti da obiettivo o programma","MOD-04.01","Annuale","Monitoraggio"],["Riesame dell'analisi svolto","MOD-04.01","Annuale","Nei termini"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-04.01","Registro degli aspetti ambientali","Attività, aspetto, impatto, condizione, criteri, significatività, controllo"],["MOD-04.02","Criteri di valutazione della significatività","Scale, soglia, elementi di significatività automatica"],["MOD-04.03","Analisi del ciclo di vita","Fasi considerate, aspetti per fase, grado di controllo o influenza"]]}]},"PSI-05":{"code":"PSI-05","titolo":"IDENTIFICAZIONE DEI PERICOLI E VALUTAZIONE DEI RISCHI PER LA SALUTE E SICUREZZA","fase":"6 · Pianificazione","rif":"ISO 45001 6.1.2 · D.Lgs. 81/2008","blocks":[{"k":"t","r":[["PROCEDURA PSI-05","","",""],["Codice:","PSI-05","Revisione:","[Rev.]"],["Titolo:","IDENTIFICAZIONE DEI PERICOLI E VALUTAZIONE DEI RISCHI PER LA SALUTE E SICUREZZA","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","ISO 45001 6.1.2 · D.Lgs. 81/2008","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di identificazione dei pericoli, di valutazione dei rischi per la salute e sicurezza e delle altre opportunità e rischi per il sistema, e di determinazione delle misure di controllo secondo la gerarchia prevista."},{"k":"p","t":"1.2 Rapporto con la valutazione dei rischi di legge"},{"k":"p","t":"La presente procedura si integra con la valutazione dei rischi prevista dalla normativa nazionale e non la sostituisce. Il documento di valutazione dei rischi costituisce informazione documentata del sistema."},{"k":"p","t":"2. IDENTIFICAZIONE DEI PERICOLI"},{"k":"p","t":"L'identificazione è proattiva e continuativa e considera:"},{"k":"p","t":"organizzazione del lavoro, fattori sociali, carichi di lavoro, orari, molestie e violenza, leadership e cultura;"},{"k":"p","t":"attività e situazioni ordinarie e straordinarie, comprese emergenze, manutenzioni, avviamenti e arresti;"},{"k":"p","t":"incidenti pregressi, interni ed esterni, e loro cause;"},{"k":"p","t":"situazioni potenziali di emergenza;"},{"k":"p","t":"persone: lavoratori, appaltatori, visitatori, lavoratori in luoghi non sotto il controllo diretto dell'organizzazione, popolazione limitrofa;"},{"k":"p","t":"modifiche di processi, impianti, sostanze, organizzazione e conoscenze;"},{"k":"p","t":"cambiamenti effettivi o proposti di attività e attrezzature;"},{"k":"p","t":"fattori esterni, comprese le condizioni climatiche e gli eventi meteorologici estremi."},{"k":"p","t":"I lavoratori partecipano all'identificazione secondo la PSI-02."},{"k":"p","t":"3. VALUTAZIONE DEI RISCHI"},{"k":"t","r":[["Probabilità","Descrizione"],["1 · improbabile","Il danno può verificarsi solo per la concomitanza di eventi indipendenti e poco probabili"],["2 · possibile","Il danno può verificarsi, ma solo in circostanze sfortunate"],["3 · probabile","Il danno può verificarsi in modo diretto, sono noti episodi analoghi"],["4 · molto probabile","Il danno si è già verificato o si verificherebbe con elevata frequenza"]]},{"k":"t","r":[["Gravità","Descrizione"],["1 · lieve","Infortunio o disturbo rapidamente reversibile"],["2 · media","Infortunio o malattia con inabilità reversibile"],["3 · grave","Infortunio o malattia con inabilità parziale permanente"],["4 · gravissima","Infortunio o malattia con inabilità totale permanente o esito letale"]]},{"k":"p","t":"Il livello di rischio è dato dal prodotto: 1÷3 basso, 4÷7 medio, 8÷11 alto, 12÷16 critico."},{"k":"p","t":"4. GERARCHIA DEI CONTROLLI"},{"k":"p","t":"Le misure sono definite seguendo l'ordine, e il ricorso a un livello inferiore è motivato quando quelli superiori non siano tecnicamente attuabili:"},{"k":"t","r":[["Ordine","Misura","Esempio"],["1","Eliminazione del pericolo","Soppressione della lavorazione, rimozione dell'agente, modifica del processo"],["2","Sostituzione","Sostituzione di sostanze, materiali o processi con altri meno pericolosi"],["3","Controlli tecnici e riorganizzazione del lavoro","Segregazione, aspirazione localizzata, dispositivi di sicurezza, automazione"],["4","Controlli amministrativi, compresa la formazione","Procedure, permessi di lavoro, segnaletica, rotazione, addestramento"],["5","Dispositivi di protezione individuale","DPI adeguati, con consegna registrata e vigilanza sull'uso"]]},{"k":"p","t":"La sola adozione di dispositivi di protezione individuale a fronte di un rischio alto o critico, in assenza di motivazione sull'impraticabilità delle misure superiori, costituisce carenza del sistema."},{"k":"p","t":"5. RISCHIO RESIDUO"},{"k":"p","t":"Attuate le misure, il rischio è rivalutato. Il rischio residuo alto o critico non è accettabile e comporta azione immediata secondo la PSI-03, fino alla sospensione dell'attività."},{"k":"p","t":"6. AGGIORNAMENTO"},{"k":"p","t":"La valutazione è aggiornata a fronte di: modifiche di processi, impianti, sostanze, organizzazione del lavoro; infortuni, malattie professionali e mancati infortuni; esiti della sorveglianza sanitaria; prescrizioni di organi di vigilanza; segnalazioni dei lavoratori; evoluzione della normativa e della tecnica."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Rischi alti e critici con misure attuate","MOD-05.01","Trimestrale","100%"],["Misure ricorrenti al solo livello DPI su rischi alti","MOD-05.01","Semestrale","0 non motivate"],["Rischi rivalutati dopo attuazione delle misure","MOD-05.01","Semestrale","100%"],["Pericoli segnalati dai lavoratori e trattati","MOD-05.03","Trimestrale","100%"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-05.01","Registro dei pericoli e valutazione dei rischi","Area, attività, pericolo, esposti, probabilità, gravità, misure, rischio residuo"],["MOD-05.02","Scheda di applicazione della gerarchia dei controlli","Misure per livello, motivazione dell'impraticabilità, esito"],["MOD-05.03","Segnalazione di pericolo o mancato infortunio","Modulo per i lavoratori, presa in carico, esito"]]}]},"PSI-06":{"code":"PSI-06","titolo":"OBBLIGHI DI CONFORMITÀ E PRESCRIZIONI LEGALI APPLICABILI","fase":"6 · Pianificazione","rif":"ISO 14001 6.1.3 · ISO 45001 6.1.3 · ISO 9001 8.2.2","blocks":[{"k":"t","r":[["PROCEDURA PSI-06","","",""],["Codice:","PSI-06","Revisione:","[Rev.]"],["Titolo:","OBBLIGHI DI CONFORMITÀ E PRESCRIZIONI LEGALI APPLICABILI","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","ISO 14001 6.1.3 · ISO 45001 6.1.3 · ISO 9001 8.2.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di identificazione, accesso, aggiornamento e valutazione periodica della conformità agli obblighi applicabili in materia di qualità, ambiente e salute e sicurezza."},{"k":"p","t":"2. IDENTIFICAZIONE"},{"k":"p","t":"Gli obblighi comprendono: prescrizioni legali cogenti, nazionali, regionali e locali; titoli autorizzativi e loro prescrizioni; obblighi contrattuali assunti verso clienti e parti interessate; requisiti di associazioni e schemi volontari cui l'organizzazione aderisce; requisiti di prodotto cogenti."},{"k":"p","t":"Le fonti di aggiornamento e la periodicità di consultazione sono indicate nel MOD-06.01. L'aggiornamento è almeno semestrale e comunque tempestivo per le novità che incidano su autorizzazioni in essere."},{"k":"p","t":"3. REGISTRO"},{"k":"p","t":"Il registro degli obblighi (MOD-06.01) riporta per ciascuna voce: riferimento normativo o contrattuale, ambito, contenuto dell'obbligo in termini operativi, funzione responsabile, adempimento previsto, periodicità, evidenza prodotta, stato."},{"k":"p","t":"La formulazione in termini operativi è essenziale: un registro che riporti soltanto gli estremi delle norme non consente di valutare la conformità."},{"k":"p","t":"4. TITOLI AUTORIZZATIVI"},{"k":"p","t":"Le autorizzazioni, i titoli abilitativi, le verifiche periodiche obbligatorie e le scadenze sono gestiti nello scadenzario MOD-06.02, che ne presidia il rinnovo con anticipo pari ai termini di legge maggiorati di un margine adeguato all'istruttoria dell'ente."},{"k":"p","t":"5. VALUTAZIONE PERIODICA DELLA CONFORMITÀ"},{"k":"t","r":[["Ambito","Frequenza minima","Modalità"],["Ambiente","Semestrale","Verifica documentale, esiti degli autocontrolli, riscontro con le prescrizioni autorizzative"],["Salute e sicurezza","Semestrale","Verifica documentale, sopralluoghi, verifica delle scadenze di formazione e sorveglianza sanitaria"],["Requisiti di prodotto e contrattuali","A ogni commessa o fornitura","Verifica in sede di riesame dei requisiti secondo la PSI-11"]]},{"k":"p","t":"La valutazione produce un giudizio esplicito per ciascun obbligo — conforme, parzialmente conforme, non conforme — con evidenza a supporto. Le non conformità rilevate sono trattate secondo la PSI-18."},{"k":"p","t":"L'organizzazione mantiene la conoscenza e la comprensione del proprio stato di conformità: l'esito della valutazione è ingresso obbligatorio del riesame di direzione."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Obblighi valutati nel periodo","MOD-06.03","Semestrale","100%"],["Obblighi valutati non conformi","MOD-06.03","Semestrale","0"],["Titoli autorizzativi rinnovati nei termini","MOD-06.02","Trimestrale","100%"],["Aggiornamento normativo svolto","MOD-06.01","Semestrale","Nei termini"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-06.01","Registro degli obblighi di conformità","Riferimento, ambito, obbligo operativo, responsabile, periodicità, evidenza"],["MOD-06.02","Scadenzario di autorizzazioni e verifiche periodiche","Titolo, ente, estremi, scadenza, termine di rinnovo, stato"],["MOD-06.03","Valutazione periodica della conformità","Obbligo, verifica svolta, evidenza, giudizio, azioni"]]}]},"PSI-07":{"code":"PSI-07","titolo":"OBIETTIVI, PROGRAMMI DI MIGLIORAMENTO E GESTIONE DELLE MODIFICHE","fase":"6 · Pianificazione","rif":"ISO 9001 6.2÷6.3 · ISO 14001 6.2 · ISO 45001 6.2 · 8.1.3","blocks":[{"k":"t","r":[["PROCEDURA PSI-07","","",""],["Codice:","PSI-07","Revisione:","[Rev.]"],["Titolo:","OBIETTIVI, PROGRAMMI DI MIGLIORAMENTO E GESTIONE DELLE MODIFICHE","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","ISO 9001 6.2÷6.3 · ISO 14001 6.2 · ISO 45001 6.2 · 8.1.3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di definizione degli obiettivi per qualità, ambiente e sicurezza, di pianificazione dei programmi per il loro conseguimento e di gestione delle modifiche."},{"k":"p","t":"2. OBIETTIVI"},{"k":"p","t":"Gli obiettivi sono stabiliti alle funzioni e ai livelli pertinenti e sono: coerenti con la politica; misurabili o valutabili; conformi ai requisiti applicabili; monitorati; comunicati; aggiornati; disponibili come informazione documentata."},{"k":"p","t":"Nella definizione sono considerati: aspetti ambientali significativi e obblighi di conformità associati; rischi per la salute e sicurezza e opportunità individuate; esiti della consultazione dei lavoratori; requisiti del cliente e prestazioni dei processi; esiti di audit e riesami."},{"k":"p","t":"2.1 Formulazione"},{"k":"p","t":"Ogni obiettivo è formulato in termini di risultato verificabile, associato a un indicatore del cruscotto e non a un'attività. «Migliorare la gestione dei rifiuti» non è un obiettivo; «ridurre del 15% la quantità di rifiuti a smaltimento per tonnellata prodotta entro il 31 dicembre» lo è."},{"k":"p","t":"Per ciascun obiettivo il programma (MOD-07.01) indica: cosa sarà fatto, quali risorse, chi è responsabile, quando sarà conseguito, come saranno valutati i risultati e con quale indicatore, come sarà integrato nei processi."},{"k":"p","t":"2.2 Avanzamento"},{"k":"p","t":"L'avanzamento è rilevato con la periodicità stabilita e confluisce nel cruscotto di monitoraggio (PSI-15). Un obiettivo non raggiunto è analizzato quanto alle cause in sede di riesame: la sola riproposizione per l'anno successivo non costituisce trattamento."},{"k":"p","t":"3. GESTIONE DELLE MODIFICHE"},{"k":"p","t":"3.1 Ambito"},{"k":"p","t":"Sono soggette a valutazione preventiva le modifiche a: prodotti, servizi e processi; impianti, attrezzature e layout; sostanze e materiali impiegati; organizzazione, ruoli e organici; sedi e luoghi di lavoro; obblighi di conformità; conoscenze e tecnologie."},{"k":"p","t":"3.2 Valutazione"},{"k":"p","t":"La scheda MOD-07.02 documenta: scopo della modifica e conseguenze potenziali; effetti su aspetti ambientali e pericoli, con eventuale introduzione di nuovi; integrità del sistema; disponibilità di risorse; attribuzione o ridistribuzione di responsabilità; requisiti cogenti e autorizzativi coinvolti; necessità di formazione; tempi di attuazione."},{"k":"p","t":"Le modifiche che introducono nuovi pericoli o aspetti significativi non sono attuate prima dell'aggiornamento delle valutazioni di cui alle PSI-04 e PSI-05 e della definizione delle misure."},{"k":"p","t":"3.3 Modifiche temporanee"},{"k":"p","t":"Anche le modifiche temporanee sono soggette a valutazione. Le condizioni provvisorie protratte oltre il termine previsto sono la causa ricorrente di incidenti e di superamenti autorizzativi."},{"k":"p","t":"4. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Obiettivi raggiunti nell'esercizio","MOD-07.01","Annuale","≥ 80%"],["Obiettivi con indicatore associato","MOD-07.01","Annuale","100%"],["Modifiche attuate con valutazione preventiva","MOD-07.02","Trimestrale","100%"],["Modifiche temporanee oltre il termine","MOD-07.02","Trimestrale","0"]]},{"k":"p","t":"5. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-07.01","Programma degli obiettivi","Obiettivo, ambito, indicatore, baseline, target, risorse, responsabile, termine"],["MOD-07.02","Scheda di gestione della modifica","Descrizione, effetti su qualità ambiente e sicurezza, misure, autorizzazione"]]}]},"PSI-08":{"code":"PSI-08","titolo":"RISORSE, COMPETENZA, CONSAPEVOLEZZA E COMUNICAZIONE","fase":"7 · Supporto","rif":"ISO 9001 7.1÷7.4 · ISO 14001 7.1÷7.4 · ISO 45001 7.1÷7.4","blocks":[{"k":"t","r":[["PROCEDURA PSI-08","","",""],["Codice:","PSI-08","Revisione:","[Rev.]"],["Titolo:","RISORSE, COMPETENZA, CONSAPEVOLEZZA E COMUNICAZIONE","",""],["Punti norma:","7 · Supporto","",""],["Riferimenti:","ISO 9001 7.1÷7.4 · ISO 14001 7.1÷7.4 · ISO 45001 7.1÷7.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di determinazione e messa a disposizione delle risorse, di gestione delle competenze e della consapevolezza, e di comunicazione interna ed esterna."},{"k":"p","t":"2. RISORSE"},{"k":"t","r":[["Ambito","Contenuto e presidio"],["Persone","Determinazione degli organici necessari ai processi e al sistema"],["Infrastrutture","Edifici, impianti, attrezzature, hardware e software; manutenzione programmata registrata"],["Ambiente per il funzionamento dei processi","Fattori fisici, sociali e psicologici: temperatura, illuminazione, rumore, ergonomia, clima organizzativo, prevenzione dello stress"],["Risorse per il monitoraggio e la misurazione","Idoneità allo scopo, taratura o verifica riferibile a campioni, stato identificato, protezione da tarature invalidanti"],["Conoscenza organizzativa","Determinazione, mantenimento e messa a disposizione delle conoscenze necessarie; presidio dei saperi detenuti da singole persone"]]},{"k":"p","t":"2.1 Strumenti di misura"},{"k":"p","t":"Gli strumenti impiegati per verificare la conformità sono registrati nel MOD-08.04 con identificazione, campo di misura, incertezza, periodicità e stato di taratura. Quando si accerta che uno strumento non era idoneo, è valutata la validità dei risultati precedenti e sono adottate le azioni conseguenti."},{"k":"p","t":"3. COMPETENZA"},{"k":"p","t":"Le competenze necessarie sono determinate per ruolo (MOD-08.01), con particolare attenzione a chi svolge attività che incidono sulle prestazioni ambientali, sulla conformità agli obblighi e sulla salute e sicurezza."},{"k":"p","t":"Il fabbisogno formativo deriva dal confronto tra competenza richiesta e posseduta. La formazione in materia di sicurezza è erogata senza costi per i lavoratori e in orario di lavoro."},{"k":"p","t":"L'efficacia delle azioni formative è valutata con metodo dichiarato: verifica di apprendimento, osservazione sul campo, indicatori di processo."},{"k":"p","t":"4. CONSAPEVOLEZZA"},{"k":"p","t":"I lavoratori sono resi consapevoli di: politica e obiettivi; aspetti ambientali significativi e impatti associati alle proprie attività; pericoli e rischi determinati e misure adottate; proprio contributo all'efficacia del sistema e benefici del miglioramento; implicazioni del mancato rispetto dei requisiti; incidenti e relativi esiti; capacità di allontanarsi da situazioni di pericolo grave e imminente e tutela da indebite conseguenze per averlo fatto."},{"k":"p","t":"Quest'ultimo punto è oggetto di verifica specifica: la sua conoscenza effettiva da parte dei lavoratori è rilevata nel MOD-08.03."},{"k":"p","t":"5. COMUNICAZIONE"},{"k":"p","t":"5.1 Piano"},{"k":"p","t":"Il piano (MOD-08.05) determina su cosa comunicare, quando, con chi, come e chi comunica, considerando gli obblighi di conformità e assicurando che le informazioni comunicate siano coerenti con quanto generato dal sistema e attendibili."},{"k":"p","t":"5.2 Comunicazione interna"},{"k":"p","t":"Le informazioni pertinenti sono comunicate ai vari livelli e funzioni, comprese le modifiche del sistema. Sono resi disponibili canali che consentano ai lavoratori di contribuire al miglioramento, di segnalare pericoli e mancati infortuni senza timore di ritorsione, e di ricevere riscontro."},{"k":"p","t":"5.3 Comunicazione esterna"},{"k":"p","t":"Le comunicazioni esterne rilevanti sono registrate nel MOD-08.06: richieste e reclami di parti interessate, comunicazioni con le autorità, esposti della comunità, comunicazioni ambientali volontarie. A ciascuna è associato l'esito e il riscontro fornito."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Personale formato secondo il piano","MOD-08.02","Trimestrale","100%"],["Scadenze formative in materia di sicurezza rispettate","MOD-08.02","Trimestrale","100%"],["Azioni formative con efficacia valutata","MOD-08.02","Semestrale","100%"],["Strumenti in stato di taratura valido","MOD-08.04","Trimestrale","100%"],["Comunicazioni esterne con riscontro entro i termini","MOD-08.06","Semestrale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-08.01","Matrice delle competenze","Ruolo, competenze richieste, possedute, scostamento, azione"],["MOD-08.02","Registro della formazione","Sessione, destinatari, durata, docente, verifica, scadenza"],["MOD-08.03","Rilevazione della consapevolezza","Questionario su politica, rischi, diritto di allontanamento, esiti"],["MOD-08.04","Registro degli strumenti di misura","Strumento, campo, incertezza, taratura, scadenza, stato"],["MOD-08.05","Piano di comunicazione","Oggetto, tempi, destinatari, mezzi, responsabili"],["MOD-08.06","Registro delle comunicazioni esterne","Data, controparte, oggetto, riscontro, esito"]]}]},"PSI-09":{"code":"PSI-09","titolo":"INFORMAZIONI DOCUMENTATE","fase":"7 · Supporto","rif":"ISO 9001 7.5 · ISO 14001 7.5 · ISO 45001 7.5","blocks":[{"k":"t","r":[["PROCEDURA PSI-09","","",""],["Codice:","PSI-09","Revisione:","[Rev.]"],["Titolo:","INFORMAZIONI DOCUMENTATE","",""],["Punti norma:","7 · Supporto","",""],["Riferimenti:","ISO 9001 7.5 · ISO 14001 7.5 · ISO 45001 7.5","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di creazione, aggiornamento e controllo delle informazioni documentate del sistema integrato."},{"k":"p","t":"2. STRUTTURA DOCUMENTALE"},{"k":"t","r":[["Livello","Documenti","Approvazione"],["1","Politica, campo di applicazione, manuale ove adottato","Direzione"],["2","Procedure del sistema integrato","Responsabile del sistema, approvazione della direzione"],["3","Istruzioni operative, protocolli di lavorazione, piani","Responsabile di processo"],["4","Moduli e registrazioni","Compilazione a cura della funzione competente"],["Esterni","Norme, leggi, autorizzazioni, schede di sicurezza, documentazione di fornitura","Identificazione e controllo della validità"]]},{"k":"p","t":"3. CREAZIONE E AGGIORNAMENTO"},{"k":"p","t":"È assicurata l'appropriatezza di: identificazione e descrizione — titolo, codice, data, autore, revisione; formato e supporto; riesame e approvazione in merito a idoneità e adeguatezza."},{"k":"p","t":"La codifica adottata è indicata nel MOD-09.01. Le revisioni sono numerate progressivamente e il documento riporta la sintesi della modifica."},{"k":"p","t":"4. CONTROLLO"},{"k":"p","t":"Le informazioni documentate sono controllate per assicurare che siano disponibili e idonee all'uso dove e quando necessario e adeguatamente protette da perdita di riservatezza, uso improprio e perdita di integrità."},{"k":"p","t":"Sono presidiate: distribuzione, accesso, reperimento e utilizzo; archiviazione e conservazione, compresa la leggibilità; controllo delle modifiche; conservazione ed eliminazione."},{"k":"p","t":"4.1 Documenti superati"},{"k":"p","t":"I documenti superati che si conservino per ragioni di legge o di conoscenza sono identificati come tali e resi non utilizzabili operativamente. La circolazione di revisioni superate è, nella pratica, una delle cause più frequenti di non conformità di processo."},{"k":"p","t":"5. CONSERVAZIONE"},{"k":"p","t":"I tempi di conservazione sono stabiliti nel MOD-09.01 tenendo conto degli obblighi di legge, con attenzione particolare a: registrazioni sanitarie e di esposizione ad agenti, registri ambientali e documentazione di trasporto dei rifiuti, documentazione di qualifica dei fornitori e di prodotto."},{"k":"p","t":"Le registrazioni contenenti dati relativi alla salute dei lavoratori sono trattate con accesso limitato ai soggetti autorizzati."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Documenti in revisione corrente ai punti di utilizzo","MOD-09.02","Semestrale","100%"],["Documenti riesaminati nei termini previsti","MOD-09.02","Annuale","100%"],["Documenti esterni identificati e in versione valida","MOD-09.02","Semestrale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-09.01","Criteri di codifica e conservazione","Codifica, livelli, tempi di conservazione, riservatezza"],["MOD-09.02","Elenco delle informazioni documentate","Documento, codice, revisione, data, distribuzione, conservazione"]]}]},"PSI-10":{"code":"PSI-10","titolo":"PIANIFICAZIONE E CONTROLLO OPERATIVI","fase":"8 · Attività operative","rif":"ISO 9001 8.1 · ISO 14001 8.1 · ISO 45001 8.1.1÷8.1.2","blocks":[{"k":"t","r":[["PROCEDURA PSI-10","","",""],["Codice:","PSI-10","Revisione:","[Rev.]"],["Titolo:","PIANIFICAZIONE E CONTROLLO OPERATIVI","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","ISO 9001 8.1 · ISO 14001 8.1 · ISO 45001 8.1.1÷8.1.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di pianificazione, attuazione e controllo dei processi necessari a soddisfare i requisiti e ad attuare le azioni determinate in fase di pianificazione."},{"k":"p","t":"2. CRITERI DI CONTROLLO"},{"k":"p","t":"Per ciascun processo sono stabiliti: criteri di accettazione; controlli in ingresso, in linea e finali; risorse necessarie; documentazione applicabile; registrazioni da conservare; punti di fermata e autorizzazioni."},{"k":"p","t":"I criteri sono definiti nella scheda di processo (MOD-10.01) e i controlli nel piano dei controlli (MOD-10.02)."},{"k":"p","t":"3. CONTROLLO OPERATIVO AMBIENTALE"},{"k":"p","t":"I controlli sono stabiliti coerentemente con gli aspetti significativi, gli obblighi di conformità e la prospettiva del ciclo di vita:"},{"k":"p","t":"requisiti ambientali definiti in fase di progettazione e sviluppo di prodotti e servizi, considerando le fasi del ciclo di vita;"},{"k":"p","t":"requisiti ambientali comunicati ai fornitori e agli appaltatori, compresi quelli relativi ai processi affidati all'esterno;"},{"k":"p","t":"informazioni sui potenziali impatti significativi connessi a trasporto, consegna, uso, trattamento a fine vita e smaltimento, fornite ove pertinente;"},{"k":"p","t":"controlli di processo su emissioni, scarichi, rifiuti, sostanze pericolose e consumi."},{"k":"p","t":"4. CONTROLLO OPERATIVO PER LA SICUREZZA"},{"k":"p","t":"4.1 Eliminazione dei pericoli e riduzione dei rischi"},{"k":"p","t":"I processi di controllo operativo attuano la gerarchia di cui alla PSI-05. Le misure sono verificate quanto ad attuazione effettiva e non alla sola previsione documentale."},{"k":"p","t":"4.2 Attività a rischio elevato"},{"k":"p","t":"Le attività che richiedono autorizzazione preventiva sono elencate nel MOD-10.03 e soggette a permesso di lavoro: lavori in quota, spazi confinati, lavori a caldo, lavori elettrici, scavi, movimentazione di carichi eccezionali, interventi su impianti in pressione, lavori in prossimità di linee elettriche."},{"k":"p","t":"Il permesso è rilasciato da soggetto individuato, previa verifica delle condizioni, ha validità temporale definita e si chiude con la verifica di ripristino delle condizioni di sicurezza."},{"k":"p","t":"4.3 Coordinamento"},{"k":"p","t":"Le attività svolte contemporaneamente da più imprese sono soggette a cooperazione e coordinamento secondo la PSI-12."},{"k":"p","t":"5. PROCESSI ESTERNALIZZATI"},{"k":"p","t":"I processi affidati all'esterno restano nel campo di applicazione del sistema. Il tipo e l'estensione del controllo sono definiti in ragione dell'incidenza sulla conformità del prodotto, sugli aspetti ambientali significativi e sui rischi per la sicurezza, e sono documentati nel MOD-12.01."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Processi con criteri di accettazione definiti","MOD-10.01","Annuale","100%"],["Controlli eseguiti rispetto ai pianificati","MOD-10.02","Mensile","≥ 95%"],["Permessi di lavoro emessi e chiusi correttamente","MOD-10.03","Trimestrale","100%"],["Attività a rischio elevato svolte senza permesso","MOD-10.03","Trimestrale","0"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-10.01","Scheda di processo","Input, output, criteri, controlli, indicatori, documenti"],["MOD-10.02","Piano dei controlli","Fase, caratteristica, criterio, metodo, frequenza, responsabile, registrazione"],["MOD-10.03","Permesso di lavoro","Attività, condizioni verificate, validità, sospensione, chiusura"]]}]},"PSI-11":{"code":"PSI-11","titolo":"REQUISITI RELATIVI A PRODOTTI E SERVIZI, PROGETTAZIONE E SVILUPPO","fase":"8 · Attività operative","rif":"ISO 9001 8.2÷8.3","blocks":[{"k":"t","r":[["PROCEDURA PSI-11","","",""],["Codice:","PSI-11","Revisione:","[Rev.]"],["Titolo:","REQUISITI RELATIVI A PRODOTTI E SERVIZI, PROGETTAZIONE E SVILUPPO","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","ISO 9001 8.2÷8.3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di comunicazione con il cliente, di determinazione e riesame dei requisiti relativi a prodotti e servizi e di gestione della progettazione e sviluppo."},{"k":"p","t":"2. COMUNICAZIONE CON IL CLIENTE"},{"k":"p","t":"Comprende: informazioni relative a prodotti e servizi; gestione di richieste, contratti e ordini, comprese le modifiche; acquisizione di riscontri dal cliente, compresi i reclami; gestione o trattamento della proprietà del cliente; definizione dei requisiti specifici per le azioni di emergenza, ove pertinente."},{"k":"p","t":"3. DETERMINAZIONE E RIESAME DEI REQUISITI"},{"k":"p","t":"Prima di impegnarsi a fornire, sono determinati e riesaminati: requisiti specificati dal cliente, compresi quelli per la consegna e le attività post-consegna; requisiti non dichiarati ma necessari per l'uso previsto; requisiti cogenti applicabili; requisiti aggiuntivi determinati dall'organizzazione."},{"k":"p","t":"Il riesame (MOD-11.01) accerta che i requisiti siano definiti, che le divergenze rispetto a quanto espresso in precedenza siano risolte e che l'organizzazione abbia la capacità di soddisfarli. Ove il cliente non fornisca una dichiarazione documentata dei requisiti, questi sono confermati prima dell'accettazione."},{"k":"p","t":"3.1 Modifiche"},{"k":"p","t":"Quando i requisiti sono modificati, le informazioni documentate pertinenti sono aggiornate e le funzioni interessate sono rese consapevoli. Le modifiche accettate verbalmente sono formalizzate prima dell'esecuzione."},{"k":"p","t":"4. PROGETTAZIONE E SVILUPPO"},{"k":"p","t":"4.1 Pianificazione"},{"k":"p","t":"Il piano di progettazione (MOD-11.02) definisce: natura, durata e complessità delle attività; fasi e relativi riesami, verifiche e validazioni; responsabilità e autorità; risorse interne ed esterne; interfacce tra le persone coinvolte; coinvolgimento di clienti e utilizzatori; requisiti per la successiva fornitura; livello di controllo atteso dai clienti e dalle parti interessate; informazioni documentate necessarie a dimostrare il soddisfacimento dei requisiti."},{"k":"p","t":"4.2 Input"},{"k":"p","t":"Sono determinati: requisiti funzionali e prestazionali; informazioni derivate da progettazioni analoghe precedenti; requisiti cogenti; norme e codici di pratica adottati; potenziali conseguenze di guasto in ragione della natura del prodotto."},{"k":"p","t":"Sono inoltre considerati i requisiti ambientali coerenti con la prospettiva del ciclo di vita di cui alla PSI-04 e i requisiti di sicurezza relativi all'uso, alla manutenzione e allo smaltimento."},{"k":"p","t":"4.3 Controlli"},{"k":"p","t":"Sono condotti riesami per valutare la capacità dei risultati di soddisfare i requisiti, verifiche per accertare che gli output soddisfino gli input, e validazioni per assicurare che il prodotto risultante sia in grado di soddisfare i requisiti per l'applicazione prevista. Le azioni conseguenti sono registrate."},{"k":"p","t":"4.4 Output"},{"k":"p","t":"Gli output soddisfano i requisiti in ingresso, sono adeguati per i successivi processi di fornitura, comprendono o richiamano requisiti di monitoraggio e misurazione e criteri di accettazione, e specificano le caratteristiche essenziali per l'uso previsto e per la fornitura sicura e appropriata."},{"k":"p","t":"4.5 Modifiche di progettazione"},{"k":"p","t":"Le modifiche sono identificate, riesaminate e controllate per evitare effetti negativi sulla conformità, con registrazione delle modifiche, degli esiti dei riesami, delle autorizzazioni e delle azioni per prevenire effetti negativi."},{"k":"p","t":"5. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Offerte e ordini con riesame dei requisiti documentato","MOD-11.01","Mensile","100%"],["Progetti con fasi di riesame, verifica e validazione svolte","MOD-11.02","Trimestrale","100%"],["Modifiche di progetto tracciate e autorizzate","MOD-11.03","Trimestrale","100%"],["Non conformità imputabili a requisiti mal definiti","MOD-18.01","Trimestrale","In riduzione"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-11.01","Riesame dei requisiti di offerta e ordine","Requisiti, capacità, divergenze risolte, esito, approvazione"],["MOD-11.02","Piano di progettazione e sviluppo","Fasi, riesami, verifiche, validazioni, responsabilità, risorse"],["MOD-11.03","Registro delle modifiche di progetto","Modifica, motivazione, riesame, autorizzazione, effetti"]]}]},"PSI-12":{"code":"PSI-12","titolo":"APPROVVIGIONAMENTO, FORNITORI, APPALTATORI E COORDINAMENTO","fase":"8 · Attività operative","rif":"ISO 9001 8.4 · ISO 14001 8.1 · ISO 45001 8.1.4","blocks":[{"k":"t","r":[["PROCEDURA PSI-12","","",""],["Codice:","PSI-12","Revisione:","[Rev.]"],["Titolo:","APPROVVIGIONAMENTO, FORNITORI, APPALTATORI E COORDINAMENTO","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","ISO 9001 8.4 · ISO 14001 8.1 · ISO 45001 8.1.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di qualifica, controllo e valutazione dei fornitori e degli appaltatori e di coordinamento delle attività svolte presso i luoghi di lavoro dell'organizzazione."},{"k":"p","t":"2. QUALIFICA"},{"k":"p","t":"I fornitori sono qualificati prima dell'affidamento, con estensione proporzionata all'incidenza della fornitura sulla conformità del prodotto, sugli aspetti ambientali significativi e sui rischi per la sicurezza."},{"k":"t","r":[["Classe","Criterio","Verifiche minime"],["A · critica","Incide su conformità di prodotto, aspetti significativi o rischi alti","Requisiti tecnici, certificazioni, regolarità contributiva, referenze, verifica documentale o audit"],["B · rilevante","Incidenza indiretta o contenuta","Requisiti tecnici, certificazioni, regolarità contributiva"],["C · ordinaria","Beni e servizi standardizzati","Verifica documentale essenziale"]]},{"k":"p","t":"3. REQUISITI COMUNICATI AL FORNITORE"},{"k":"p","t":"Sono comunicati: processi, prodotti e servizi da fornire; criteri di approvazione e rilascio; requisiti di competenza e qualifica del personale; interazioni con il sistema dell'organizzazione; controlli che l'organizzazione intende applicare presso il fornitore; requisiti ambientali applicabili, compresi quelli relativi al ciclo di vita; requisiti di salute e sicurezza applicabili alle attività svolte presso i luoghi di lavoro dell'organizzazione."},{"k":"p","t":"4. APPALTATORI E COORDINAMENTO"},{"k":"p","t":"4.1 Verifica preliminare"},{"k":"p","t":"Prima dell'accesso è verificata l'idoneità tecnico-professionale dell'impresa e dei lavoratori autonomi, secondo la normativa applicabile, con documentazione conservata (MOD-12.02)."},{"k":"p","t":"4.2 Cooperazione e coordinamento"},{"k":"p","t":"Sono attuate le misure di cooperazione e coordinamento previste, con redazione e sottoscrizione dei documenti richiesti prima dell'inizio delle attività. Sono definiti i rischi da interferenza e le misure conseguenti, e sono designati i referenti delle parti."},{"k":"p","t":"4.3 Vigilanza durante l'esecuzione"},{"k":"p","t":"L'attuazione delle misure concordate è verificata durante l'esecuzione, con registrazione dei sopralluoghi e delle prescrizioni impartite (MOD-12.03). L'esistenza del documento di coordinamento non esaurisce l'obbligo: ciò che rileva è che le misure siano applicate."},{"k":"p","t":"4.4 Lavoratori di altre imprese"},{"k":"p","t":"Ai lavoratori delle imprese appaltatrici sono resi noti i pericoli presenti, le misure di emergenza, i punti di raccolta e le modalità di segnalazione dei pericoli."},{"k":"p","t":"5. VALUTAZIONE PERIODICA"},{"k":"p","t":"I fornitori sono valutati periodicamente su: conformità della fornitura, rispetto dei tempi, non conformità rilevate, comportamento in materia di sicurezza e ambiente presso i nostri luoghi, gestione dei reclami. L'esito determina il mantenimento, la messa in osservazione o la sospensione dall'albo (MOD-12.01)."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Fornitori di classe A qualificati e in corso di validità","MOD-12.01","Trimestrale","100%"],["Appaltatori con idoneità verificata prima dell'accesso","MOD-12.02","Mensile","100%"],["Sopralluoghi di coordinamento eseguiti","MOD-12.03","Mensile","Secondo programma"],["Non conformità imputabili a fornitori","MOD-18.01","Trimestrale","In riduzione"],["Fornitori valutati nel periodo","MOD-12.01","Annuale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-12.01","Albo fornitori e valutazione periodica","Fornitore, classe, qualifica, valutazione, esito, stato"],["MOD-12.02","Verifica dell'idoneità tecnico-professionale","Documentazione richiesta, esito, validità"],["MOD-12.03","Verbale di coordinamento e sopralluogo","Attività, rischi da interferenza, misure, prescrizioni, esito"]]}]},"PSI-13":{"code":"PSI-13","titolo":"EROGAZIONE, IDENTIFICAZIONE E RINTRACCIABILITÀ, CONSERVAZIONE E RILASCIO","fase":"8 · Attività operative","rif":"ISO 9001 8.5÷8.6","blocks":[{"k":"t","r":[["PROCEDURA PSI-13","","",""],["Codice:","PSI-13","Revisione:","[Rev.]"],["Titolo:","EROGAZIONE, IDENTIFICAZIONE E RINTRACCIABILITÀ, CONSERVAZIONE E RILASCIO","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","ISO 9001 8.5÷8.6","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di controllo della produzione e dell'erogazione dei servizi, di identificazione e rintracciabilità, di gestione della proprietà di clienti e fornitori, di conservazione, di gestione delle attività post-consegna e di rilascio."},{"k":"p","t":"2. CONDIZIONI CONTROLLATE"},{"k":"p","t":"La produzione e l'erogazione avvengono in condizioni controllate che comprendono: disponibilità di informazioni documentate su caratteristiche e attività da svolgere e sui risultati da conseguire; disponibilità e utilizzo di risorse di monitoraggio e misurazione idonee; attuazione dei monitoraggi nelle fasi appropriate per verificare il soddisfacimento dei criteri; utilizzo di infrastrutture e ambiente adeguati; designazione di persone competenti; validazione dei processi i cui risultati non possano essere verificati da successivi monitoraggi; azioni per prevenire l'errore umano; attuazione delle attività di rilascio, consegna e post-consegna."},{"k":"p","t":"2.1 Processi speciali"},{"k":"p","t":"I processi il cui risultato non è verificabile con controlli successivi — saldatura, trattamenti termici, verniciatura, sigillature, servizi erogati direttamente al cliente — sono validati preventivamente e riqualificati con la periodicità stabilita nel MOD-13.01."},{"k":"p","t":"3. IDENTIFICAZIONE E RINTRACCIABILITÀ"},{"k":"p","t":"I prodotti e i servizi sono identificati lungo tutto il processo, con evidenza dello stato rispetto ai requisiti di monitoraggio e misurazione. Dove la rintracciabilità è un requisito, l'identificazione univoca è controllata e registrata (MOD-13.02)."},{"k":"p","t":"Lo stato di controllo non è opzionale: un prodotto in attesa di collaudo che non sia distinguibile da uno collaudato è un prodotto che prima o poi viene spedito."},{"k":"p","t":"4. PROPRIETÀ DI CLIENTI E FORNITORI"},{"k":"p","t":"La proprietà appartenente a clienti o fornitori è identificata, verificata, protetta e salvaguardata finché è sotto il controllo dell'organizzazione o è da essa utilizzata. Ciò comprende materiali, componenti, attrezzature, locali, proprietà intellettuale e dati personali."},{"k":"p","t":"Ogni perdita, danneggiamento o inidoneità è comunicata al proprietario e registrata (MOD-13.03)."},{"k":"p","t":"5. CONSERVAZIONE"},{"k":"p","t":"La conservazione è assicurata durante la produzione e l'erogazione, nella misura necessaria a mantenere la conformità, e comprende identificazione, movimentazione, controllo della contaminazione, imballaggio, immagazzinamento, trasmissione e protezione."},{"k":"p","t":"Sono considerati i requisiti di conservazione delle sostanze pericolose e le condizioni di stoccaggio previste dalle schede di sicurezza, con presidio delle incompatibilità e dei bacini di contenimento."},{"k":"p","t":"6. ATTIVITÀ POST-CONSEGNA"},{"k":"p","t":"L'estensione delle attività post-consegna è determinata considerando: requisiti cogenti; conseguenze indesiderate potenziali associate al prodotto; natura, utilizzo e vita prevista; requisiti del cliente; riscontri dal cliente."},{"k":"p","t":"Sono comprese: garanzie, assistenza, manutenzione, ritiro e smaltimento a fine vita, e le informazioni all'utilizzatore sull'uso sicuro e sul corretto trattamento a fine vita."},{"k":"p","t":"7. CONTROLLO DELLE MODIFICHE"},{"k":"p","t":"Le modifiche di produzione ed erogazione sono riesaminate e controllate nella misura necessaria a mantenere la conformità. Sono conservate le informazioni sull'esito del riesame, sulle persone che autorizzano la modifica e sulle azioni conseguenti."},{"k":"p","t":"8. RILASCIO"},{"k":"p","t":"Il rilascio avviene solo dopo il completamento soddisfacente delle disposizioni pianificate, salvo diversa approvazione di autorità competente e, ove applicabile, del cliente. È conservata evidenza della conformità ai criteri di accettazione e dell'identificazione di chi autorizza il rilascio (MOD-13.04)."},{"k":"p","t":"9. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["
