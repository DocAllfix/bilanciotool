Lotti o commesse rilasciati con evidenza completa","MOD-13.04","Mensile","100%"],["Rilasci in deroga autorizzati","MOD-13.04","Trimestrale","Monitoraggio"],["Processi speciali con validazione in corso di validità","MOD-13.01","Semestrale","100%"],["Segnalazioni su proprietà di terzi","MOD-13.03","Trimestrale","0"]]},{"k":"p","t":"10. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-13.01","Registro dei processi speciali e delle validazioni","Processo, metodo di validazione, personale qualificato, scadenza"],["MOD-13.02","Scheda di identificazione e rintracciabilità","Lotto, commessa, stato di controllo, movimentazioni"],["MOD-13.03","Registro della proprietà di clienti e fornitori","Bene, proprietario, verifica, stato, comunicazioni"],["MOD-13.04","Verbale di rilascio","Controlli eseguiti, esiti, criteri di accettazione, autorizzazione"]]}]},"PSI-14":{"code":"PSI-14","titolo":"PREPARAZIONE E RISPOSTA ALLE EMERGENZE","fase":"8 · Attività operative","rif":"ISO 14001 8.2 · ISO 45001 8.2","blocks":[{"k":"t","r":[["PROCEDURA PSI-14","","",""],["Codice:","PSI-14","Revisione:","[Rev.]"],["Titolo:","PREPARAZIONE E RISPOSTA ALLE EMERGENZE","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","ISO 14001 8.2 · ISO 45001 8.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di identificazione delle potenziali situazioni di emergenza, di pianificazione della risposta e di verifica periodica della capacità di risposta."},{"k":"p","t":"2. IDENTIFICAZIONE"},{"k":"p","t":"Le potenziali situazioni di emergenza sono identificate a partire dalla valutazione degli aspetti ambientali (PSI-04) e dei rischi per la sicurezza (PSI-05), e comprendono tipicamente: incendio ed esplosione; sversamento di sostanze pericolose; emissione incontrollata in atmosfera; allagamento e rottura di reti; infortunio grave e malore; blackout e interruzione di servizi essenziali; eventi meteorologici estremi; atti dolosi e minacce; emergenze sanitarie."},{"k":"p","t":"Sono considerate anche le emergenze che possono avere origine all'esterno e propagarsi al sito."},{"k":"p","t":"3. PIANIFICAZIONE DELLA RISPOSTA"},{"k":"p","t":"Il piano di emergenza (MOD-14.01) definisce per ciascuno scenario: modalità di rilevazione e allarme; azioni immediate; squadre e incarichi, con nominativi e reperibilità; presidi e attrezzature disponibili e loro ubicazione; vie di esodo e punti di raccolta; modalità di evacuazione, comprese le persone che necessitano di assistenza; comunicazioni interne ed esterne, compresi i soggetti da allertare; azioni per prevenire o mitigare le conseguenze ambientali; modalità di ripristino e di gestione del post-emergenza."},{"k":"p","t":"3.1 Parti interessate esterne"},{"k":"p","t":"Le informazioni pertinenti sono fornite a lavoratori a tutti i livelli, appaltatori e visitatori, e sono comunicate ai servizi di emergenza, alle autorità e, quando appropriato, alla comunità locale."},{"k":"p","t":"4. PROVE E SIMULAZIONI"},{"k":"p","t":"Le prove sono svolte con la periodicità stabilita e comunque almeno annualmente, e comprendono almeno uno scenario ambientale oltre alla prova di evacuazione. Ogni prova è verbalizzata (MOD-14.02) con: scenario, data, durata, partecipanti, tempi rilevati, criticità emerse, azioni conseguenti."},{"k":"p","t":"Le criticità emerse in prova generano azioni con responsabile e termine: una prova che si conclude con «esito positivo» e nessun rilievo va guardata con attenzione, non con soddisfazione."},{"k":"p","t":"5. VERIFICA DEI PRESIDI"},{"k":"p","t":"I presidi antincendio, i dispositivi di allarme, i kit antisversamento, i presidi sanitari e le vie di esodo sono soggetti a verifica periodica registrata (MOD-14.03), con presidio delle scadenze."},{"k":"p","t":"6. RIESAME E AGGIORNAMENTO"},{"k":"p","t":"Il piano è riesaminato e aggiornato dopo ogni emergenza reale, dopo ogni prova che abbia evidenziato criticità significative, a fronte di modifiche di layout, processi, sostanze o organici, e comunque periodicamente."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Prove di emergenza svolte rispetto alle programmate","MOD-14.02","Annuale","100%"],["Scenari coperti da prova negli ultimi 24 mesi","MOD-14.02","Annuale","100%"],["Criticità emerse in prova con azione chiusa","MOD-14.02","Semestrale","100%"],["Verifiche dei presidi eseguite nei termini","MOD-14.03","Trimestrale","100%"],["Tempo di evacuazione rilevato","MOD-14.02","Annuale","Entro il valore di riferimento"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-14.01","Piano di emergenza","Scenari, azioni, squadre, presidi, evacuazione, comunicazioni"],["MOD-14.02","Verbale di prova di emergenza","Scenario, tempi, partecipanti, criticità, azioni"],["MOD-14.03","Registro delle verifiche dei presidi","Presidio, ubicazione, verifica, esito, scadenza"]]}]},"PSI-15":{"code":"PSI-15","titolo":"MONITORAGGIO, MISURAZIONE, ANALISI E VALUTAZIONE DELLE PRESTAZIONI","fase":"9 · Valutazione","rif":"ISO 9001 9.1 · ISO 14001 9.1 · ISO 45001 9.1","blocks":[{"k":"t","r":[["PROCEDURA PSI-15","","",""],["Codice:","PSI-15","Revisione:","[Rev.]"],["Titolo:","MONITORAGGIO, MISURAZIONE, ANALISI E VALUTAZIONE DELLE PRESTAZIONI","",""],["Punti norma:","9 · Valutazione","",""],["Riferimenti:","ISO 9001 9.1 · ISO 14001 9.1 · ISO 45001 9.1","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il sistema di monitoraggio delle prestazioni del sistema integrato, gli indicatori, le modalità di rilevazione e di analisi, e le regole di funzionamento del cruscotto di monitoraggio."},{"k":"p","t":"2. OGGETTO DEL MONITORAGGIO"},{"k":"p","t":"Sono determinati: cosa è necessario monitorare e misurare; i metodi per assicurare risultati validi; i criteri con cui valutare le prestazioni; quando eseguire il monitoraggio; quando analizzare e valutare i risultati."},{"k":"t","r":[["Ambito","Oggetto tipico"],["Qualità","Conformità di prodotto e servizio, prestazioni dei processi, puntualità, resa, soddisfazione del cliente, reclami, prestazioni dei fornitori"],["Ambiente","Consumi di energia, acqua e materiali, rifiuti prodotti e destinazione, emissioni, scarichi, emissioni di gas serra, avanzamento dei programmi"],["Sicurezza","Infortuni e indici, mancati infortuni, esiti di sopralluoghi, formazione erogata, attuazione delle misure, esiti della sorveglianza sanitaria"],["Sistema","Non conformità e azioni, esiti di audit, valutazione della conformità agli obblighi, conseguimento degli obiettivi"]]},{"k":"p","t":"2.1 Indicatori proattivi e reattivi"},{"k":"p","t":"Il sistema di misura comprende sia indicatori reattivi — che misurano ciò che è già accaduto, come gli infortuni o i reclami — sia indicatori proattivi, che misurano l'attività di prevenzione: sopralluoghi eseguiti, segnalazioni di pericolo trattate, misure attuate nei termini, ore di formazione, controlli operativi eseguiti."},{"k":"p","t":"Un cruscotto composto di soli indicatori reattivi non consente di governare: registra gli esiti quando è tardi per intervenire."},{"k":"p","t":"3. STRUTTURA DEL CRUSCOTTO"},{"k":"p","t":"Ciascun indicatore è definito nel MOD-15.01 con: codice, denominazione, ambito, processo, formula di calcolo, unità di misura, fonte del dato, frequenza di rilevazione, responsabile, valore di riferimento iniziale, target, verso di miglioramento, soglia di attenzione."},{"k":"p","t":"Le rilevazioni sono registrate per periodo e alimentano l'andamento. Il confronto significativo è quello con la serie storica e con il target, non con il periodo precedente isolato."},{"k":"p","t":"4. VALIDITÀ DEI DATI"},{"k":"p","t":"I metodi devono assicurare risultati validi: strumenti tarati o verificati secondo la PSI-08, metodi di campionamento dichiarati, criteri di calcolo stabili nel tempo. Ogni modifica del criterio di calcolo è annotata e la serie storica è ricostruita o interrotta esplicitamente."},{"k":"p","t":"5. VALUTAZIONE DELLA CONFORMITÀ"},{"k":"p","t":"La valutazione periodica della conformità agli obblighi è svolta secondo la PSI-06 e i suoi esiti confluiscono nel cruscotto e nel riesame."},{"k":"p","t":"6. SODDISFAZIONE DEL CLIENTE"},{"k":"p","t":"La percezione del cliente sul grado di soddisfacimento delle sue esigenze è monitorata attraverso: indagini, riscontri sui prodotti e servizi consegnati, incontri con i clienti, analisi delle quote di mercato, elogi, richieste in garanzia, rapporti dei rivenditori, reclami."},{"k":"p","t":"I reclami sono registrati nel MOD-15.03 e trattati secondo la PSI-18. Il numero di reclami, da solo, non misura la soddisfazione: va letto insieme al volume di fornitura e alla facilità di reclamare."},{"k":"p","t":"7. ANALISI E VALUTAZIONE"},{"k":"p","t":"I dati sono analizzati per valutare: conformità di prodotti e servizi; grado di soddisfazione del cliente; prestazioni ed efficacia del sistema; efficacia della pianificazione; efficacia delle azioni sui rischi e sulle opportunità; prestazioni dei fornitori; necessità di miglioramento. Gli esiti sono ingresso del riesame."},{"k":"p","t":"8. INDICATORI DEL PROCESSO"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Rilevazioni eseguite nei termini","MOD-15.02","Mensile","100%"],["Indicatori a target","MOD-15.02","Trimestrale","≥ 80%"],["Indicatori proattivi sul totale","MOD-15.01","Annuale","≥ 40%"],["Indicatori sotto soglia di attenzione con azione aperta","MOD-15.02","Trimestrale","100%"]]},{"k":"p","t":"9. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-15.01","Scheda indicatore","Formula, fonte, frequenza, responsabile, target, soglia, verso"],["MOD-15.02","Registro delle rilevazioni","Indicatore, periodo, valore, scostamento, nota"],["MOD-15.03","Registro dei reclami e della soddisfazione del cliente","Cliente, oggetto, gravità, trattamento, riscontro, esito"]]}]},"PSI-16":{"code":"PSI-16","titolo":"AUDIT INTERNI","fase":"9 · Valutazione","rif":"ISO 9001 9.2 · ISO 14001 9.2 · ISO 45001 9.2 · UNI EN ISO 19011","blocks":[{"k":"t","r":[["PROCEDURA PSI-16","","",""],["Codice:","PSI-16","Revisione:","[Rev.]"],["Titolo:","AUDIT INTERNI","",""],["Punti norma:","9 · Valutazione","",""],["Riferimenti:","ISO 9001 9.2 · ISO 14001 9.2 · ISO 45001 9.2 · UNI EN ISO 19011","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di pianificazione, conduzione e rendicontazione degli audit interni del sistema integrato."},{"k":"p","t":"2. PROGRAMMA"},{"k":"p","t":"Il programma (MOD-16.01) è pianificato tenendo conto dell'importanza dei processi, delle modifiche che incidono sull'organizzazione, dei risultati degli audit precedenti, degli aspetti ambientali significativi, dei rischi per la sicurezza e degli esiti del monitoraggio."},{"k":"p","t":"La frequenza non è uniforme: i processi con rischio elevato, con non conformità ricorrenti o oggetto di modifiche recenti sono auditati più frequentemente. Tutti i processi e tutti i punti applicabili delle tre norme sono coperti nell'arco del ciclo di certificazione."},{"k":"p","t":"3. COMPETENZA E IMPARZIALITÀ"},{"k":"p","t":"Gli auditor possiedono competenza sulle norme applicabili, sui processi auditati e sulle tecniche di audit. Nessun auditor verifica il proprio lavoro. Per gli audit su ambiente e sicurezza è richiesta competenza specifica sugli obblighi di conformità applicabili."},{"k":"p","t":"La consultazione dei lavoratori sul programma di audit è svolta secondo la PSI-02."},{"k":"p","t":"4. CONDUZIONE"},{"k":"t","r":[["Fase","Contenuto"],["Preparazione","Definizione di obiettivi, criteri e campo; esame della documentazione; predisposizione della lista di riscontro"],["Riunione di apertura","Conferma del piano, metodi, riservatezza, criteri di classificazione dei rilievi"],["Esecuzione","Raccolta di evidenze mediante esame documentale, osservazione diretta e colloqui; verifica sul campo"],["Riunione di chiusura","Presentazione dei rilievi, conferma della comprensione, termini per le azioni"],["Rapporto","Emissione entro il termine stabilito, con evidenze, rilievi classificati e conclusioni"]]},{"k":"p","t":"4.1 Evidenze sul campo"},{"k":"p","t":"L'audit non si esaurisce nell'esame dei documenti. Per ambiente e sicurezza l'osservazione diretta dei luoghi, delle lavorazioni e dei comportamenti è la fonte di evidenza principale, e i colloqui con i lavoratori operativi valgono più della conferma del responsabile."},{"k":"p","t":"5. CLASSIFICAZIONE DEI RILIEVI"},{"k":"t","r":[["Classe","Definizione"],["Non conformità maggiore","Assenza o mancata attuazione di un requisito, o insieme di carenze che compromettono la capacità del sistema; violazione di obbligo di conformità"],["Non conformità minore","Carenza isolata che non compromette la capacità complessiva del sistema"],["Osservazione","Situazione che, se non presidiata, può evolvere in non conformità"],["Opportunità di miglioramento","Suggerimento privo di carattere prescrittivo"]]},{"k":"p","t":"6. TRATTAMENTO"},{"k":"p","t":"I risultati sono riferiti ai responsabili pertinenti e alla direzione. Le non conformità sono trattate secondo la PSI-18. Il rispetto dei termini per le azioni è monitorato e i ritardi sono portati al riesame."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Audit eseguiti rispetto al programma","MOD-16.01","Semestrale","100%"],["Copertura dei processi nel ciclo","MOD-16.01","Annuale","100%"],["Rapporti emessi entro il termine","MOD-16.02","Semestrale","≥ 90%"],["Azioni da audit chiuse nei termini","MOD-18.01","Trimestrale","≥ 85%"],["Non conformità ricorrenti sullo stesso processo","MOD-16.02","Annuale","In riduzione"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-16.01","Programma di audit interno","Processo, norme, criteri di priorità, auditor, periodo, esito"],["MOD-16.02","Rapporto di audit","Campo, criteri, evidenze, rilievi classificati, conclusioni"],["MOD-16.03","Lista di riscontro integrata","Punti norma, domande di verifica, evidenze, esito"]]}]},"PSI-17":{"code":"PSI-17","titolo":"RIESAME DI DIREZIONE","fase":"9 · Valutazione","rif":"ISO 9001 9.3 · ISO 14001 9.3 · ISO 45001 9.3","blocks":[{"k":"t","r":[["PROCEDURA PSI-17","","",""],["Codice:","PSI-17","Revisione:","[Rev.]"],["Titolo:","RIESAME DI DIREZIONE","",""],["Punti norma:","9 · Valutazione","",""],["Riferimenti:","ISO 9001 9.3 · ISO 14001 9.3 · ISO 45001 9.3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di riesame del sistema integrato da parte della direzione, per assicurarne la continua idoneità, adeguatezza, efficacia e allineamento agli indirizzi strategici."},{"k":"p","t":"2. PERIODICITÀ"},{"k":"p","t":"Il riesame è svolto almeno annualmente. Sono convocati riesami straordinari a fronte di: modifiche organizzative rilevanti, infortuni gravi, incidenti ambientali, esiti sfavorevoli di audit di terza parte, provvedimenti di autorità."},{"k":"p","t":"3. ELEMENTI IN INGRESSO"},{"k":"t","r":[["#","Elemento"],["1","Stato delle azioni derivanti dai riesami precedenti"],["2","Modifiche di fattori esterni e interni rilevanti, comprese quelle relative agli obblighi di conformità"],["3","Modifiche delle esigenze e aspettative delle parti interessate, compresi i requisiti dei lavoratori"],["4","Soddisfazione del cliente e riscontri dalle parti interessate rilevanti"],["5","Grado di conseguimento degli obiettivi e stato dei programmi"],["6","Prestazioni dei processi e conformità di prodotti e servizi"],["7","Non conformità e azioni correttive; incidenti, infortuni e mancati infortuni"],["8","Risultati del monitoraggio e della misurazione, con l'andamento degli indicatori del cruscotto"],["9","Esiti della valutazione periodica della conformità agli obblighi"],["10","Risultati degli audit interni e di parte terza"],["11","Prestazioni dei fornitori esterni"],["12","Adeguatezza delle risorse"],["13","Efficacia delle azioni intraprese per affrontare rischi e opportunità"],["14","Esiti della consultazione e partecipazione dei lavoratori"],["15","Opportunità di miglioramento"]]},{"k":"p","t":"4. ELEMENTI IN USCITA"},{"k":"p","t":"Il riesame produce decisioni e azioni relative a: opportunità di miglioramento; continua idoneità, adeguatezza ed efficacia del sistema; necessità di modifiche del sistema; risorse necessarie; azioni ove gli obiettivi non siano stati conseguiti; opportunità di migliorare l'integrazione del sistema con i processi di business; implicazioni per gli indirizzi strategici."},{"k":"p","t":"Ogni decisione è associata a responsabile, risorse e termine, ed è ripresa nel riesame successivo come stato di avanzamento."},{"k":"p","t":"4.1 Comunicazione"},{"k":"p","t":"I risultati pertinenti del riesame sono comunicati ai lavoratori e, ove esistenti, ai loro rappresentanti. Il riesame che resti confinato alla direzione non produce l'effetto di consapevolezza richiesto dal sistema."},{"k":"p","t":"5. VERBALIZZAZIONE"},{"k":"p","t":"Il verbale (MOD-17.01) riporta per ciascun elemento in ingresso il dato, la valutazione della direzione e le eventuali decisioni. Un verbale che elenchi i dati senza esprimere valutazioni non documenta un riesame."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Riesame svolto nei termini","MOD-17.01","Annuale","Nei termini"],["Elementi in ingresso trattati","MOD-17.01","Annuale","100%"],["Decisioni del riesame attuate entro il termine","MOD-17.02","Semestrale","≥ 85%"],["Comunicazione degli esiti ai lavoratori","MOD-17.01","Annuale","Effettuata"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-17.01","Verbale di riesame di direzione","Elementi in ingresso, dati, valutazioni, decisioni"],["MOD-17.02","Registro delle decisioni del riesame","Decisione, responsabile, risorse, termine, stato, verifica"]]}]},"PSI-18":{"code":"PSI-18","titolo":"NON CONFORMITÀ, INCIDENTI, AZIONI CORRETTIVE E MIGLIORAMENTO","fase":"10 · Miglioramento","rif":"ISO 9001 8.7 e 10 · ISO 14001 10 · ISO 45001 10","blocks":[{"k":"t","r":[["PROCEDURA PSI-18","","",""],["Codice:","PSI-18","Revisione:","[Rev.]"],["Titolo:","NON CONFORMITÀ, INCIDENTI, AZIONI CORRETTIVE E MIGLIORAMENTO","",""],["Punti norma:","10 · Miglioramento","",""],["Riferimenti:","ISO 9001 8.7 e 10 · ISO 14001 10 · ISO 45001 10","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di gestione degli output non conformi, delle non conformità di sistema, degli incidenti e degli infortuni, delle azioni correttive e del miglioramento continuo."},{"k":"p","t":"2. OUTPUT NON CONFORMI"},{"k":"p","t":"Gli output che non soddisfano i requisiti sono identificati e controllati per prevenirne l'utilizzo o la consegna non intenzionali. Il trattamento è scelto tra: correzione; segregazione, contenimento, restituzione o sospensione della fornitura; informazione al cliente; ottenimento di autorizzazione all'accettazione in concessione."},{"k":"p","t":"La conformità è verificata nuovamente dopo la correzione. Sono registrate: descrizione della non conformità, azioni intraprese, concessioni ottenute, autorità che ha deciso il trattamento (MOD-18.01)."},{"k":"p","t":"3. INCIDENTI E NON CONFORMITÀ"},{"k":"p","t":"3.1 Definizioni operative"},{"k":"t","r":[["Termine","Uso"],["Non conformità","Mancato soddisfacimento di un requisito, del sistema, di prodotto o di un obbligo di conformità"],["Incidente","Evento derivante da o durante il lavoro che ha causato o poteva causare lesioni e malattie"],["Mancato infortunio","Incidente che non ha causato lesioni: va registrato e analizzato con lo stesso rigore, perché ha lo stesso potenziale"],["Incidente ambientale","Evento che ha causato o poteva causare un impatto ambientale non previsto"]]},{"k":"p","t":"3.2 Reazione tempestiva"},{"k":"p","t":"A fronte di un incidente o di una non conformità l'organizzazione reagisce tempestivamente: adotta azioni per il controllo e la correzione, affronta le conseguenze, e per la sicurezza mette in sicurezza l'area e presta assistenza. La partecipazione dei lavoratori e il coinvolgimento delle altre parti interessate pertinenti sono assicurati."},{"k":"p","t":"4. INDAGINE E ANALISI DELLE CAUSE"},{"k":"p","t":"È valutata la necessità di azioni per eliminare le cause affinché non si ripetano e non si verifichino altrove: riesame e analisi dell'evento; determinazione delle cause; determinazione dell'esistenza di eventi simili o della loro possibilità."},{"k":"p","t":"L'analisi è condotta con metodo dichiarato e non si arresta all'errore dell'operatore. Va accertato se all'origine vi siano: progettazione del compito, adeguatezza delle attrezzature, chiarezza delle procedure, competenza e addestramento, carichi e ritmi di lavoro, manutenzione, vigilanza, scelte di approvvigionamento."},{"k":"p","t":"5. AZIONI CORRETTIVE"},{"k":"p","t":"Le azioni sono appropriate agli effetti degli incidenti e delle non conformità riscontrate. Nella determinazione sono privilegiate le misure che eliminano il pericolo o riducono il rischio alla fonte, secondo la gerarchia della PSI-05."},{"k":"p","t":"Sono valutati gli effetti dell'azione su rischi, aspetti ambientali e obblighi di conformità, e sono aggiornate le valutazioni di cui alle PSI-03, PSI-04 e PSI-05 quando l'evento evidenzi elementi non considerati."},{"k":"p","t":"5.1 Verifica di efficacia"},{"k":"p","t":"L'efficacia è verificata a distanza congrua dall'attuazione, con criterio dichiarato e dato a supporto. Una non conformità chiusa senza verifica di efficacia non è chiusa: è archiviata."},{"k":"p","t":"6. COMUNICAZIONE E CONSERVAZIONE"},{"k":"p","t":"Le informazioni documentate sono conservate quali evidenza della natura degli incidenti e delle non conformità, delle azioni intraprese e dei risultati, compresa l'efficacia. I risultati sono comunicati ai lavoratori pertinenti e ai loro rappresentanti e alle altre parti interessate."},{"k":"p","t":"7. MIGLIORAMENTO CONTINUO"},{"k":"p","t":"L'organizzazione migliora con continuità idoneità, adeguatezza ed efficacia del sistema, considerando: risultati di analisi e valutazione, esiti di audit, riesami e valutazione della conformità."},{"k":"p","t":"Per la sicurezza il miglioramento è orientato a: accrescere le prestazioni, promuovere una cultura di sostegno al sistema, promuovere la partecipazione dei lavoratori nell'attuazione delle azioni, comunicare i risultati."},{"k":"p","t":"8. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Non conformità chiuse nei termini","MOD-18.01","Mensile","≥ 85%"],["Azioni con efficacia verificata","MOD-18.02","Trimestrale","100%"],["Non conformità ricorrenti per causa","MOD-18.01","Semestrale","In riduzione"],["Mancati infortuni segnalati","MOD-18.03","Trimestrale","In crescita"],["Incidenti analizzati con metodo di analisi delle cause","MOD-18.03","Trimestrale","100%"],["Indice di frequenza e indice di gravità","MOD-18.03","Trimestrale","In riduzione"]]},{"k":"p","t":"9. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-18.01","Registro delle non conformità","Rilievo, origine, trattamento, cause, azione, verifica di efficacia"],["MOD-18.02","Scheda di azione correttiva","Analisi delle cause, azione, effetti su rischi e aspetti, efficacia"],["MOD-18.03","Registro di incidenti, infortuni e mancati infortuni","Evento, dinamica, cause, misure, indici, comunicazioni"]]}]}},"mod":{"MOD-01.01":{"code":"MOD-01.01","pro":"PSI-01","titolo":"Analisi del contesto","blocks":[{"k":"t","r":[["MODULO MOD-01.01","",""],["Codice:","MOD-01.01","Revisione: [Rev.]"],["Titolo:","ANALISI DEL CONTESTO",""],["Procedura:","PSI-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Periodo di riferimento",""],["Redatta da",""],["Data",""],["Approvata da",""]]},{"k":"h","t":"FATTORI ESTERNI"},{"k":"t","r":[["Ambito","Fattore","Effetto sul sistema (Q/A/S)","Rilevanza","Rischio o opportunità"],["Mercato","","","",""],["Normativo","","","",""],["Ambientale e climatico","","","",""],["Sociale e territoriale","","","",""],["Tecnologico","","","",""],["Catena di fornitura","","","",""]],"b":0},{"k":"h","t":"FATTORI INTERNI"},{"k":"t","r":[["Ambito","Fattore","Effetto sul sistema (Q/A/S)","Rilevanza","Rischio o opportunità"],["Organizzativo","","","",""],["Tecnico e impiantistico","","","",""],["Competenze e conoscenza organizzativa","","","",""],["Economico","","","",""],["Prestazioni pregresse","","","",""]],"b":0},{"k":"h","t":"CAMBIAMENTO CLIMATICO"},{"k":"t","r":[["Valutazione","Contenuto"],["Il cambiamento climatico è un fattore rilevante (sì/no)",""],["Effetti dell'organizzazione sul clima",""],["Effetti del clima sull'organizzazione",""],["Motivazione della determinazione",""]],"b":0},{"k":"sig"}]},"MOD-01.02":{"code":"MOD-01.02","pro":"PSI-01","titolo":"Registro delle parti interessate","blocks":[{"k":"t","r":[["MODULO MOD-01.02","",""],["Codice:","MOD-01.02","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLE PARTI INTERESSATE",""],["Procedura:","PSI-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Parte interessata","Interna/esterna","Esigenze e aspettative","Ambito (Q/A/S)","Rilevanza","Diviene obbligo di conformità","Modalità di gestione","Riesame"]],"b":12},{"k":"sig"}]},"MOD-01.03":{"code":"MOD-01.03","pro":"PSI-01","titolo":"Campo di applicazione del sistema integrato","blocks":[{"k":"t","r":[["MODULO MOD-01.03","",""],["Codice:","MOD-01.03","Revisione: [Rev.]"],["Titolo:","CAMPO DI APPLICAZIONE DEL SISTEMA INTEGRATO",""],["Procedura:","PSI-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Denominazione",""],["Sedi e unità incluse",""],["Attività, prodotti e servizi",""],["Norme applicate",""],["Sedi o attività escluse e motivazione",""],["Esclusioni ISO 9001 e motivazione",""],["Data di approvazione",""],["Approvato da",""]]},{"k":"p","t":"Non sono ammesse esclusioni per le attività, i prodotti e i servizi che possono avere impatti ambientali significativi, né per i luoghi di lavoro e le attività sotto il controllo dell'organizzazione ai fini della salute e sicurezza."},{"k":"sig"}]},"MOD-01.04":{"code":"MOD-01.04","pro":"PSI-01","titolo":"Mappa dei processi","blocks":[{"k":"t","r":[["MODULO MOD-01.04","",""],["Codice:","MOD-01.04","Revisione: [Rev.]"],["Titolo:","MAPPA DEI PROCESSI",""],["Procedura:","PSI-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Processo","Tipo (direzione / realizzazione / supporto)","Responsabile","Input","Output","Processi a monte","Processi a valle","Indicatori","Rischi e opportunità","Documenti applicabili"]],"b":10},{"k":"sig"}]},"MOD-02.01":{"code":"MOD-02.01","pro":"PSI-02","titolo":"Politica del sistema integrato","blocks":[{"k":"t","r":[["MODULO MOD-02.01","",""],["Codice:","MOD-02.01","Revisione: [Rev.]"],["Titolo:","POLITICA DEL SISTEMA INTEGRATO",""],["Procedura:","PSI-02","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Modello da adattare e approvare da parte della direzione."},{"k":"h","t":"IMPEGNI GENERALI"},{"k":"p","t":"[Nome Organizzazione] adotta un sistema di gestione integrato per la qualità, l'ambiente e la salute e sicurezza sul lavoro, e si impegna a soddisfare i requisiti applicabili, compresi quelli cogenti, e a migliorare con continuità le proprie prestazioni."},{"k":"p","t":"La presente politica è appropriata alle finalità e al contesto dell'organizzazione, ne sostiene gli indirizzi strategici e costituisce il quadro di riferimento per la definizione degli obiettivi."},{"k":"h","t":"QUALITÀ"},{"k":"p","t":"L'organizzazione si impegna a determinare e soddisfare i requisiti dei clienti e quelli cogenti applicabili, ad accrescere la soddisfazione del cliente e a presidiare i rischi e le opportunità che possono incidere sulla conformità dei prodotti e dei servizi."},{"k":"h","t":"AMBIENTE"},{"k":"p","t":"L'organizzazione si impegna alla protezione dell'ambiente e alla prevenzione dell'inquinamento, all'uso sostenibile delle risorse, alla riduzione dei consumi energetici e delle emissioni climalteranti, alla corretta gestione dei rifiuti e alla mitigazione degli impatti connessi al ciclo di vita dei propri prodotti e servizi."},{"k":"h","t":"SALUTE E SICUREZZA"},{"k":"p","t":"L'organizzazione si impegna a fornire condizioni di lavoro sicure e salubri per la prevenzione di lesioni e malattie correlate al lavoro, a eliminare i pericoli e ridurre i rischi secondo la gerarchia dei controlli, e ad assicurare la consultazione e la partecipazione dei lavoratori e dei loro rappresentanti."},{"k":"p","t":"Nessun obiettivo di produzione, di costo o di tempo può essere perseguito a scapito della sicurezza delle persone. Ogni lavoratore ha il diritto di allontanarsi da situazioni di pericolo grave e imminente senza subirne conseguenze."},{"k":"t","r":[["Voce","Compilazione"],["Data di approvazione",""],["Approvata da",""],["Modalità di comunicazione interna",""],["Disponibilità alle parti interessate",""],["Prossimo riesame",""]]},{"k":"sig"}]},"MOD-02.02":{"code":"MOD-02.02","pro":"PSI-02","titolo":"Matrice delle responsabilità","blocks":[{"k":"t","r":[["MODULO MOD-02.02","",""],["Codice:","MOD-02.02","Revisione: [Rev.]"],["Titolo:","MATRICE DELLE RESPONSABILITÀ",""],["Procedura:","PSI-02","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Attività del sistema","Direzione","RSI","Resp. processo","Figure prevenzione","Lavoratori"],["Definizione e riesame della politica","R","C","I","C","I"],["Analisi del contesto e parti interessate","A","R","C","C","I"],["Valutazione degli aspetti ambientali","A","R","C","C","C"],["Identificazione dei pericoli e valutazione dei rischi","A","C","C","R","C"],["Obblighi di conformità e valutazione periodica","A","R","C","C","I"],["Definizione degli obiettivi","R","R","C","C","C"],["Controllo operativo","I","C","R","C","R"],["Monitoraggio e cruscotto","A","R","R","C","I"],["Audit interni","A","R","C","C","I"],["Riesame di direzione","R","R","C","C","I"],["Gestione di non conformità e incidenti","A","R","R","R","R"]],"b":0},{"k":"t","r":[["Legenda","R = esegue · A = approva · C = consultato · I = informato"]],"b":0},{"k":"sig"}]},"MOD-02.03":{"code":"MOD-02.03","pro":"PSI-02","titolo":"Nomina del responsabile del sistema integrato","blocks":[{"k":"t","r":[["MODULO MOD-02.03","",""],["Codice:","MOD-02.03","Revisione: [Rev.]"],["Titolo:","NOMINA DEL RESPONSABILE DEL SISTEMA INTEGRATO",""],["Procedura:","PSI-02","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"[Nome Organizzazione], nella persona di [Direzione], nomina [Responsabile SGI] responsabile del sistema di gestione integrato per la qualità, l'ambiente e la salute e sicurezza."},{"k":"t","r":[["Voce","Compilazione"],["Nominativo",""],["Funzione aziendale",""],["Data di decorrenza",""],["Riporto",""]]},{"k":"h","t":"COMPITI E AUTORITÀ"},{"k":"t","r":[["#","Compito"],["1","Assicurare che il sistema sia conforme ai requisiti delle norme applicate"],["2","Riferire alla direzione sulle prestazioni del sistema e sulle opportunità di miglioramento"],["3","Promuovere l'attenzione al cliente in tutta l'organizzazione"],["4","Assicurare che l'integrità del sistema sia mantenuta a fronte delle modifiche"],["5","Coordinare le attività di audit interno e la gestione delle non conformità"],["6","Curare il cruscotto di monitoraggio e la predisposizione del riesame"],["7","Accedere a documenti, dati, sedi e persone per le finalità del sistema"]],"b":0},{"k":"sig"}]},"MOD-02.04":{"code":"MOD-02.04","pro":"PSI-02","titolo":"Registro di consultazione e partecipazio 3","nrm":"S","pro":"PSI-01","t":"Il campo di applicazione comprende tutte le attività e i luoghi di lavoro sotto il controllo o l'influenza dell'organizzazione?"},{"id":"4.10","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.4","nrm":"QAS","pro":"PSI-01","t":"I processi necessari al sistema e le loro interazioni sono determinati, con input, output, criteri, risorse, responsabilità e indicatori?"},{"id":"5.01","cap":"5","capn":"Leadership","rif":"5.1","nrm":"QAS","pro":"PSI-02","t":"La direzione dimostra leadership assumendosi la responsabilità dell'efficacia del sistema e integrandone i requisiti nei processi di business?"},{"id":"5.02","cap":"5","capn":"Leadership","rif":"5.1","nrm":"Q","pro":"PSI-02","t":"La direzione assicura l'attenzione al cliente, con requisiti determinati e soddisfatti e obiettivo di accrescerne la soddisfazione?"},{"id":"5.03","cap":"5","capn":"Leadership","rif":"5.1","nrm":"S","pro":"PSI-02","t":"La direzione si assume la responsabilità complessiva della prevenzione di lesioni e malattie e della predisposizione di luoghi di lavoro sicuri e salubri?"},{"id":"5.04","cap":"5","capn":"Leadership","rif":"5.1","nrm":"S","pro":"PSI-02","t":"La direzione protegge i lavoratori da ritorsioni quando segnalano incidenti, pericoli, rischi e opportunità?"},{"id":"5.05","cap":"5","capn":"Leadership","rif":"5.1","nrm":"S","pro":"PSI-02","t":"La direzione sviluppa e promuove una cultura che sostenga i risultati attesi del sistema di gestione della sicurezza?"},{"id":"5.06","cap":"5","capn":"Leadership","rif":"5.2","nrm":"QAS","pro":"PSI-02","t":"La politica è appropriata al contesto, comprende l'impegno a soddisfare i requisiti applicabili e al miglioramento continuo e fornisce il quadro per gli obiettivi?"},{"id":"5.07","cap":"5","capn":"Leadership","rif":"5.2","nrm":"A","pro":"PSI-02","t":"La politica comprende l'impegno alla protezione dell'ambiente e alla prevenzione dell'inquinamento, con impegni specifici coerenti con il contesto?"},{"id":"5.08","cap":"5","capn":"Leadership","rif":"5.2","nrm":"S","pro":"PSI-02","t":"La politica comprende l'impegno a condizioni di lavoro sicure e salubri, all'eliminazione dei pericoli e alla consultazione e partecipazione dei lavoratori?"},{"id":"5.09","cap":"5","capn":"Leadership","rif":"5.2","nrm":"QAS","pro":"PSI-02","t":"La politica è documentata, comunicata, compresa e applicata internamente, e disponibile alle parti interessate?"},{"id":"5.10","cap":"5","capn":"Leadership","rif":"5.3","nrm":"QAS","pro":"PSI-02","t":"Le responsabilità e le autorità per i ruoli pertinenti sono assegnate, comunicate e comprese?"},{"id":"5.11","cap":"5","capn":"Leadership","rif":"5.4","nrm":"S","pro":"PSI-02","t":"Sono attuati processi di consultazione dei lavoratori non aventi ruoli direttivi sugli ambiti previsti dalla norma?"},{"id":"5.12","cap":"5","capn":"Leadership","rif":"5.4","nrm":"S","pro":"PSI-02","t":"Sono attuati processi di partecipazione dei lavoratori non aventi ruoli direttivi sugli ambiti previsti, con evidenza dell'effetto sui contributi raccolti?"},{"id":"5.13","cap":"5","capn":"Leadership","rif":"5.4","nrm":"S","pro":"PSI-02","t":"Sono rimossi gli ostacoli alla partecipazione — barriere linguistiche, orari, forme contrattuali, timore di ritorsione?"},{"id":"6.01","cap":"6","capn":"Pianificazione","rif":"6.1.1","nrm":"QAS","pro":"PSI-03","t":"Sono determinati i rischi e le opportunità che il sistema deve affrontare, considerando contesto e parti interessate?"},{"id":"6.02","cap":"6","capn":"Pianificazione","rif":"6.1.1","nrm":"QAS","pro":"PSI-03","t":"Sono pianificate le azioni per affrontarli, la loro integrazione nei processi e la valutazione della loro efficacia?"},{"id":"6.03","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"A","pro":"PSI-04","t":"Sono identificati gli aspetti ambientali delle attività, dei prodotti e dei servizi che l'organizzazione può controllare o influenzare, nella prospettiva del ciclo di vita?"},{"id":"6.04","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"A","pro":"PSI-04","t":"Sono considerate le condizioni normali, anomale e le situazioni di emergenza ragionevolmente prevedibili?"},{"id":"6.05","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"A","pro":"PSI-04","t":"Sono stabiliti e applicati criteri documentati per determinare gli aspetti ambientali significativi?"},{"id":"6.06","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"A","pro":"PSI-04","t":"Gli aspetti significativi sono comunicati ai livelli e alle funzioni pertinenti?"},{"id":"6.07","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"S","pro":"PSI-05","t":"L'identificazione dei pericoli è proattiva e continuativa e considera organizzazione del lavoro, fattori sociali, incidenti pregressi e situazioni di emergenza?"},{"id":"6.08","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"S","pro":"PSI-05","t":"L'identificazione considera le persone diverse dai lavoratori — appaltatori, visitatori, popolazione limitrofa — e i lavoratori in luoghi non sotto il controllo diretto?"},{"id":"6.09","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"S","pro":"PSI-05","t":"I lavoratori partecipano all'identificazione dei pericoli e alla valutazione dei rischi?"},{"id":"6.10","cap":"6","capn":"Pianificazione","rif":"6.1.2","nrm":"S","pro":"PSI-05","t":"Sono definiti criteri documentati per la valutazione dei rischi e sono valutate anche le opportunità per la sicurezza?"},{"id":"6.11","cap":"6","capn":"Pianificazione","rif":"6.1.3","nrm":"AS","pro":"PSI-06","t":"Sono determinati e accessibili gli obblighi di conformità applicabili, con la comprensione di come si applichino all'organizzazione?"},{"id":"6.12","cap":"6","capn":"Pianificazione","rif":"6.1.3","nrm":"AS","pro":"PSI-06","t":"Gli obblighi di conformità sono presi in considerazione nella pianificazione e nel mantenimento del sistema?"},{"id":"6.13","cap":"6","capn":"Pianificazione","rif":"6.1.4","nrm":"AS","pro":"PSI-03","t":"Sono pianificate le azioni per affront ","nrm":"Q","pro":"PSI-08","t":"La conoscenza organizzativa necessaria è determinata, mantenuta e resa disponibile?"},{"id":"7.05","cap":"7","capn":"Supporto","rif":"7.2","nrm":"QAS","pro":"PSI-08","t":"Sono determinate le competenze necessarie, assicurata la loro sussistenza e valutata l'efficacia delle azioni intraprese?"},{"id":"7.06","cap":"7","capn":"Supporto","rif":"7.2","nrm":"S","pro":"PSI-08","t":"La formazione in materia di sicurezza è erogata senza costi per i lavoratori e in orario di lavoro?"},{"id":"7.07","cap":"7","capn":"Supporto","rif":"7.3","nrm":"QAS","pro":"PSI-08","t":"I lavoratori sono consapevoli della politica, degli obiettivi, del proprio contributo e delle implicazioni del mancato rispetto dei requisiti?"},{"id":"7.08","cap":"7","capn":"Supporto","rif":"7.3","nrm":"A","pro":"PSI-08","t":"I lavoratori sono consapevoli degli aspetti ambientali significativi e degli impatti connessi alla propria attività?"},{"id":"7.09","cap":"7","capn":"Supporto","rif":"7.3","nrm":"S","pro":"PSI-08","t":"I lavoratori sono consapevoli dei pericoli, dei rischi e delle misure, degli incidenti e dei relativi esiti?"},{"id":"7.10","cap":"7","capn":"Supporto","rif":"7.3","nrm":"S","pro":"PSI-08","t":"I lavoratori sono consapevoli di potersi allontanare da situazioni di pericolo grave e imminente e di essere tutelati da indebite conseguenze?"},{"id":"7.11","cap":"7","capn":"Supporto","rif":"7.4","nrm":"QAS","pro":"PSI-08","t":"È determinato su cosa, quando, con chi, come e chi comunica, con informazioni coerenti e attendibili?"},{"id":"7.12","cap":"7","capn":"Supporto","rif":"7.4","nrm":"S","pro":"PSI-08","t":"La comunicazione interna consente ai lavoratori di contribuire al miglioramento e di ricevere riscontro?"},{"id":"7.13","cap":"7","capn":"Supporto","rif":"7.4","nrm":"AS","pro":"PSI-08","t":"La comunicazione esterna avviene secondo quanto stabilito e in conformità agli obblighi, con registrazione delle comunicazioni rilevanti?"},{"id":"7.14","cap":"7","capn":"Supporto","rif":"7.5","nrm":"QAS","pro":"PSI-09","t":"Le informazioni documentate richieste dalle norme e quelle necessarie all'efficacia del sistema sono presenti, identificate e approvate?"},{"id":"7.15","cap":"7","capn":"Supporto","rif":"7.5","nrm":"QAS","pro":"PSI-09","t":"Le informazioni documentate sono controllate quanto a disponibilità, protezione, distribuzione, versioni, conservazione ed eliminazione?"},{"id":"7.16","cap":"7","capn":"Supporto","rif":"7.5","nrm":"QAS","pro":"PSI-09","t":"I documenti di origine esterna necessari sono identificati e controllati quanto a validità?"},{"id":"8.01","cap":"8","capn":"Attività operative","rif":"8.1","nrm":"QAS","pro":"PSI-10","t":"I processi sono pianificati, attuati e controllati con criteri stabiliti, e le informazioni documentate ne attestano l'esecuzione come pianificato?"},{"id":"8.02","cap":"8","capn":"Attività operative","rif":"8.1","nrm":"QAS","pro":"PSI-10","t":"I processi affidati all'esterno sono controllati e il tipo ed estensione del controllo sono definiti?"},{"id":"8.03","cap":"8","capn":"Attività operative","rif":"8.1","nrm":"A","pro":"PSI-10","t":"I controlli operativi sono coerenti con gli aspetti significativi, gli obblighi di conformità e la prospettiva del ciclo di vita?"},{"id":"8.04","cap":"8","capn":"Attività operative","rif":"8.1","nrm":"A","pro":"PSI-10","t":"Sono determinati i requisiti ambientali per l'approvvigionamento e comunicati ai fornitori e agli appaltatori?"},{"id":"8.05","cap":"8","capn":"Attività operative","rif":"8.1","nrm":"A","pro":"PSI-10","t":"Sono fornite, ove pertinente, informazioni sui potenziali impatti connessi a trasporto, consegna, uso e trattamento a fine vita?"},{"id":"8.06","cap":"8","capn":"Attività operative","rif":"8.1.2","nrm":"S","pro":"PSI-10","t":"I processi per l'eliminazione dei pericoli e la riduzione dei rischi attuano la gerarchia dei controlli, con motivazione del ricorso ai livelli inferiori?"},{"id":"8.07","cap":"8","capn":"Attività operative","r "capn":"Attività operative","rif":"8.2","nrm":"AS","pro":"PSI-14","t":"La risposta è provata e verificata periodicamente e il piano è riesaminato dopo prove ed emergenze reali?"},{"id":"8.27","cap":"8","capn":"Attività operative","rif":"8.2","nrm":"S","pro":"PSI-14","t":"Le informazioni pertinenti sono fornite ai lavoratori, agli appaltatori, ai visitatori, ai servizi di emergenza e alle autorità?"},{"id":"9.01","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"QAS","pro":"PSI-15","t":"Sono determinati cosa monitorare e misurare, i metodi per assicurare risultati validi, i criteri di valutazione e i tempi di rilevazione e analisi?"},{"id":"9.02","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"AS","pro":"PSI-15","t":"Il monitoraggio comprende indicatori sia reattivi sia proattivi, adeguati a valutare le prestazioni ambientali e di sicurezza?"},{"id":"9.03","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"QAS","pro":"PSI-15","t":"Le apparecchiature impiegate per il monitoraggio sono tarate o verificate e mantenute?"},{"id":"9.04","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"Q","pro":"PSI-15","t":"È monitorata la percezione del cliente sul grado di soddisfacimento delle sue esigenze, con metodi definiti?"},{"id":"9.05","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"AS","pro":"PSI-15","t":"È valutata periodicamente la conformità agli obblighi, con determinazione della frequenza, azioni conseguenti e mantenimento della conoscenza dello stato di conformità?"},{"id":"9.06","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.1","nrm":"QAS","pro":"PSI-15","t":"I dati sono analizzati e valutati per determinare prestazioni, efficacia del sistema e necessità di miglioramento?"},{"id":"9.07","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.2","nrm":"QAS","pro":"PSI-16","t":"Gli audit interni sono condotti a intervalli pianificati secondo un programma che considera importanza dei processi, modifiche ed esiti precedenti?"},{"id":"9.08","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.2","nrm":"QAS","pro":"PSI-16","t":"Sono definiti criteri e campo per ciascun audit e sono selezionati auditor che assicurino obiettività e imparzialità?"},{"id":"9.09","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.2","nrm":"S","pro":"PSI-16","t":"I lavoratori sono consultati sul programma di audit e i risultati sono comunicati ai lavoratori e ai loro rappresentanti?"},{"id":"9.10","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.2","nrm":"QAS","pro":"PSI-16","t":"I risultati sono riferiti alla direzione pertinente e le non conformità sono trattate con azioni appropriate senza indebito ritardo?"},{"id":"9.11","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.3","nrm":"QAS","pro":"PSI-17","t":"Il riesame di direzione è condotto a intervalli pianificati e considera tutti gli elementi in ingresso previsti dalle norme applicate?"},{"id":"9.12","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.3","nrm":"QAS","pro":"PSI-17","t":"Gli elementi in uscita comprendono decisioni su miglioramento, modifiche al sistema e risorse necessarie, con responsabili e termini?"},{"id":"9.13","cap":"9","capn":"Valutazione delle prestazioni","rif":"9.3","nrm":"S","pro":"PSI-17","t":"I risultati pertinenti del riesame sono comunicati ai lavoratori e ai loro rappresentanti?"},{"id":"10.01","cap":"10","capn":"Miglioramento","rif":"8.7","nrm":"Q","pro":"PSI-18","t":"Gli output non conformi sono identificati e controllati per prevenirne l'utilizzo o la consegna non intenzionali, con trattamento e riverifica?"},{"id":"10.02","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"QAS","pro":"PSI-18","t":"A fronte di non conformità e incidenti è adottata reazione tempestiva per il controllo, la correzione e la gestione delle conseguenze?"},{"id":"10.03","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"S","pro":"PSI-18","t":"Gli incidenti e le non conformità sono indagati con la partecipazione dei lavoratori e il coinvolgimento delle parti interessate pertinenti?"},{"id":"10.04","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"QAS","pro":"PSI-18","t":"È valutata la necessità di eliminare le cause, con analisi che determini le cause profonde e verifichi l'esistenza di eventi simili altrove?"},{"id":"10.05","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"S","pro":"PSI-18","t":"Nella determinazione delle azioni correttive sono privilegiate le misure che eliminano il pericolo o riducono il rischio alla fonte?"},{"id":"10.06","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"AS","pro":"PSI-18","t":"Sono aggiornati, ove necessario, i rischi, gli aspetti ambientali e le valutazioni a seguito dell'evento?"},{"id":"10.07","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"QAS","pro":"PSI-18","t":"L'efficacia delle azioni correttive è verificata con criterio dichiarato e sono conservate le relative evidenze?"},{"id":"10.08","cap":"10","capn":"Miglioramento","rif":"10.2","nrm":"S","pro":"PSI-18","t":"I risultati delle azioni sono comunicati ai lavoratori pertinenti e ai loro rappresentanti?"},{"id":"10.09","cap":"10","capn":"Miglioramento","rif":"10.3","nrm":"QAS","pro":"PSI-18","t":"Il miglioramento continuo è perseguito considerando esiti di analisi, valutazione, audit e riesame?"},{"id":"10.10","cap":"10","capn":"Miglioramento","rif":"10.3","nrm":"S","pro":"PSI-18","t":"Il miglioramento è orientato anche a promuovere la cultura di sostegno al sistema e la partecipazione dei lavoratori?"}],"norme":[["Q","ISO 9001","Qualità"],["A","ISO 14001","Ambiente"],["S","ISO 45001","Salute e sicurezza"]]}</script>
<script>
/* =========================================================================
   SISTEMA DI GESTIONE INTEGRATO — QUALITÀ, AMBIENTE, SALUTE E SICUREZZA
   ISO 9001 · ISO 14001 · ISO 45001
   ========================================================================= */
const CORPUS = JSON.parse(document.getElementById("corpus").textContent);
const PRO = CORPUS.pro, MOD = CORPUS.mod, CAPI = CORPUS.capi, REQ = CORPUS.req, NORME = CORPUS.norme;
const PROLIST = CORPUS.ordPro, MODLIST = CORPUS.ordMod;
const APPVER = "1.0";
const MODOF = {}; PROLIST.forEach(c => MODOF[c] = MODLIST.filter(m => MOD[m].pro === c));
const REQOF = {}; CAPI.forEach(k => REQOF[k.id] = REQ.filter(r => r.cap === k.id));
const REQPRO = {}; PROLIST.forEach(c => REQPRO[c] = REQ.filter(r => r.pro === c));
const NRMN = { Q:"ISO 9001", A:"ISO 14001", S:"ISO 45001" };
const NRMC = { Q:"n-q", A:"n-a", S:"n-s" };

/* =========================================================================
   MOTORE DEL CRUSCOTTO
   ========================================================================= */
function ril(i){ return (i.ril || []).slice().sort((a, b) => String(a.per).localeCompare(String(b.per))); }
function ultimo(i){ const r = ril(i).filter(x => x.val !== "" && x.val != null); return r.length ? r[r.length - 1] : null; }
function penultimo(i){ const r = ril(i).filter(x => x.val !== "" && x.val != null); return r.length > 1 ? r[r.length - 2] : null; }
function verso(i){ return i.verso === "Decrescente" ? -1 : 1; }
/* scostamento percentuale rispetto al target, con segno positivo quando migliora */
function scost(i){
  const u = ultimo(i); if (!u || i.target === "" || i.target == null) return null;
  const t = Number(i.target), v = Number(u.val);
  if (!isFinite(t) || !isFinite(v) || t === 0) return null;
  return Math.round(((v - t) / Math.abs(t)) * 100) * verso(i);
}
function statoInd(i){
  const u = ultimo(i); if (!u) return "nd";
  const v = Number(u.val), t = Number(i.target), s = Number(i.soglia);
  if (!isFinite(v)) return "nd";
  if (isFinite(t)){
    if (verso(i) > 0 ? v >= t : v <= t) return "ok";
    if (isFinite(s) && (verso(i) > 0 ? v < s : v > s)) return "no";
    return "mid";
  }
  if (isFinite(s)) return (verso(i) > 0 ? v >= s : v <= s) ? "ok" : "no";
  return "nd";
}
function trend(i){
  const u = ultimo(i), p = penultimo(i); if (!u || !p) return 0;
  const d = Number(u.val) - Number(p.val); if (!isFinite(d) || d === 0) return 0;
  return (d > 0 ? 1 : -1) * verso(i);
}
const STCLS = { ok:"t-grn", mid:"t-amb", no:"t-red", nd:"t-gry" };
const STNOM = { ok:"a target", mid:"in attenzione", no:"fuori target", nd:"non rilevato" };
function periodoOggi(f){
  const d = new Date(), a = d.getFullYear(), m = d.getMonth();
  if (f === "Annuale") return String(a);
  if (f === "Semestrale") return a + "-S" + (m < 6 ? 1 : 2);
  if (f === "Trimestrale") return a + "-T" + (Math.floor(m / 3) + 1);
  return a + "-" + String(m + 1).padStart(2, "0");
}
/* grafico ad andamento: barre con linea di target */
function chart(i, w, h){
  const R = ril(i).filter(x => x.val !== "" && x.val != null && isFinite(Number(x.val)));
  if (R.length < 1) return '<div class="empty">Nessuna rilevazione registrata.</div>';
  w = w || 640; h = h || 200;
  const pad = { l:46, r:12, t:12, b:34 };
  const vals = R.map(x => Number(x.val));
  const t = Number(i.target), s = Number(i.soglia);
  let max = Math.max.apply(null, vals.concat(isFinite(t) ? [t] : []).concat(isFinite(s) ? [s] : []));
  let min = Math.min.apply(null, vals.concat(isFinite(t) ? [t] : []).concat(isFinite(s) ? [s] : []), 0);
  if (max === min) max = min + 1;
  const span = max - min;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const y = v => pad.t + ih - ((v - min) / span) * ih;
  const bw = Math.max(6, Math.min(46, iw / R.length - 8));
  const x = k => pad.l + (iw / R.length) * (k + 0.5);
  let g = '<svg viewBox="0 0 ' + w + " " + h + '" class="chart" preserveAspectRatio="xMidYMid meet">';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const v = min + span * f;
    g += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/>' +
      '<text x="' + (pad.l - 6) + '" y="' + (y(v) + 3.5) + '" class="ax" text-anchor="end">' +
      (Math.abs(v) >= 1000 ? Math.round(v / 100) / 10 + "k" : Math.round(v * 100) / 100) + "</text>";
  });
  R.forEach((r, k) => {
    const v = Number(r.val), yy = y(v), y0 = y(Math.max(min, 0));
    const ok = isFinite(t) ? (verso(i) > 0 ? v >= t : v <= t) : null;
    g += '<rect x="' + (x(k) - bw / 2) + '" y="' + Math.min(yy, y0) + '" width="' + bw +
      '" height="' + Math.max(2, Math.abs(y0 - yy)) + '" class="bar ' + (ok === null ? "" : ok ? "b-ok" : "b-no") + '"><title>' +
      esc(r.per) + ": " + esc(String(r.val)) + "</title></rect>";
    if (R.length <= 18)
      g += '<text x="' + x(k) + '" y="' + (h - 12) + '" class="ax" text-anchor="middle">' + esc(String(r.per).replace(/^\d{4}-?/, "")) + "</text>";
  });
  if (isFinite(t)) g += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" class="tg"/>' +
    '<text x="' + (w - pad.r) + '" y="' + (y(t) - 5) + '" class="ax tgx" text-anchor="end">target ' + esc(String(i.target)) + "</text>";
  if (isFinite(s)) g += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y(s) + '" y2="' + y(s) + '" class="sg"/>';
  return g + "</svg>";
}
function spark(i, w, h){
  const R = ril(i).filter(x => x.val !== "" && x.val != null && isFinite(Number(x.val)));
  if (R.length < 2) return '<span class="code">—</span>';
  w = w || 92; h = h || 26;
  const v = R.map(x => Number(x.val));
  let max = Math.max.apply(null, v), min = Math.min.apply(null, v);
  if (max === min) { max += 1; min -= 1; }
  const pts = v.map((x, k) => (k / (v.length - 1)) * (w - 2) + 1 + "," + (h - 2 - ((x - min) / (max - min)) * (h - 4))).join(" ");
  const st = statoInd(i);
  return '<svg viewBox="0 0 ' + w + " " + h + '" class="spark ' + st + '"><polyline points="' + pts + '"/></svg>';
}

/* =========================================================================
   MOTORI DI VALUTAZIONE
   ========================================================================= */
function lvl(v){ const m = /^\s*(\d)/.exec(String(v == null ? "" : v)); return m ? Number(m[1]) : 0; }
const SOGLIA_ASP = 24;
function puntAsp(r){ return lvl(r.g) * lvl(r.f) * lvl(r.s); }
function aspSign(r){
  if (!puntAsp(r)) return "";
  if (r.legale === "Sì" || r.esposto === "Sì" || r.superamento === "Sì") return "Significativo";
  if (r.cond === "Emergenza" && lvl(r.g) >= 3) return "Significativo";
  return puntAsp(r) >= SOGLIA_ASP ? "Significativo" : "Non significativo";
}
const LIV = ["Basso", "Medio", "Alto", "Critico"];
const LIVCLS = { "Basso":"rk-b", "Medio":"rk-m", "Alto":"rk-a", "Critico":"rk-c" };
function livRischio(p, g){
  const v = lvl(p) * lvl(g); if (!v) return "";
  return v <= 3 ? "Basso" : v <= 7 ? "Medio" : v <= 11 ? "Alto" : "Critico";
}

const KEY = "sgi_qas_v1";
const STORE = {
  mode(){
    if (window.SGI_STORE && typeof window.SGI_STORE.load === "function") return "host";
    if (DB.cfg && DB.cfg.url) return "rest";
    return "local";
  },
  async load(){
    if (window.SGI_STORE && typeof window.SGI_STORE.load === "function"){
      try { const o = await window.SGI_STORE.load(); if (o) return o; } catch(e){ console.warn("host load", e); }
    }
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(KEY + "_cfg") || "null"); } catch(e){}
    if (cfg && cfg.url){
      try { const r = await fetch(cfg.url, { headers: authHdr(cfg) });
        if (r.ok){ const o = await r.json(); if (o && o.orgs){ o.cfg = cfg; return o; } } } catch(e){ console.warn("rest load", e); }
    }
    try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (cfg) o.cfg = cfg; return o; } } catch(e){}
    return cfg ? { orgs: [], current: null, cfg } : null;
  },
  async save(){
    const payload = { orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() };
    if (DB.cfg) { try { localStorage.setItem(KEY + "_cfg", JSON.stringify(DB.cfg)); } catch(e){} }
    if (window.SGI_STORE && typeof window.SGI_STORE.save === "function"){
      try { await window.SGI_STORE.save(payload); return true; } catch(e){ toast("Salvataggio sulla piattaforma non riuscito"); }
    }
    if (DB.cfg && DB.cfg.url){
      try { const r = await fetch(DB.cfg.url, { method: DB.cfg.metodo || "PUT",
        headers: Object.assign({ "Content-Type":"application/json" }, authHdr(DB.cfg)), body: JSON.stringify(payload) });
        if (!r.ok) toast("Endpoint: risposta " + r.status);
      } catch(e){ toast("Endpoint non raggiungibile — copia locale mantenuta"); }
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); return true; }
    catch(e){ toast("Spazio locale esaurito — esporta l'archivio"); return false; }
  }
};
function authHdr(cfg){ return cfg && cfg.token ? { "Authorization": "Bearer " + cfg.token } : {}; }

const PESO = { "Conforme":100, "Parzialmente conforme":50, "Non conforme":0 };

function medStato(lista){
  const o = org(), v = lista.map(r => (o.req[r.id] || {}).s).filter(s => s && s !== "Non applicabile");
  if (!v.length) return 0;
  return Math.round(v.reduce((a, s) => a + (PESO[s] || 0), 0) / v.length);
}
function capStato(cap, nrm){ return medStato(REQOF[cap].filter(r => !nrm || r.nrm.includes(nrm))); }
function capCoperti(cap, nrm){ const o = org(); return REQOF[cap].filter(r => (!nrm || r.nrm.includes(nrm)) && (o.req[r.id] || {}).s).length; }

function urgenze(){
  const o = org(), out = [], R = o.reg, I = o.ind || [];
  const add = (t, nn, cls, act, id) => { if (nn) out.push({ t, n:nn, cls, act, id }); };
  const oggi30 = new Date(Date.now() + 30 * 86400000);
  add("Indicatori fuori target", I.filter(i => statoInd(i) === "no").length, "t-red", "gov", "ind");
  add("Indicatori senza rilevazioni", I.filter(i => !ultimo(i)).length, "t-amb", "gov", "ind");
  add("Indicatori senza target definito", I.filter(i => i.target === "" || i.target == null).length, "t-amb", "gov", "ind");
  add("Aspetti significativi senza controllo operativo", (R.aspetti || []).filter(a => aspSign(a) === "Significativo" && !a.ctrl).length, "t-red", "goreg", "aspetti");
  add("Rischi alti o critici con sole misure di livello DPI non motivate",
    (R.pericoli || []).filter(p => ["Alto", "Critico"].includes(livRischio(p.p, p.g)) && p.ger === "5 · DPI" && !p.mot).length, "t-red", "goreg", "pericoli");
  add("Misure sui rischi oltre il termine", (R.pericoli || []).filter(p => p.scad && p.da && new Date(p.scad) < new Date()).length, "t-red", "goreg", "pericoli");
  add("Obblighi valutati non conformi", (R.obblighi || []).filter(x => x.giud === "Non conforme").length, "t-red", "goreg", "obblighi");

function notaPericoli(){
  return '<div class="card"><h2>Gerarchia dei controlli</h2><p class="sub" style="margin:0">Il rischio è il prodotto di probabilità e gravità. ' +

    "Il ricorso ai soli dispositivi individuali su un rischio alto o critico richiede la motivazione documentata dell'impraticabilità delle misure superiori.</p></div>";

function cellHTML(r, c){
  const v = fmtVal(r[c.k], c);
  if (c.k === "stato" || c.k === "esito" && /Applicato|Conforme/.test(v)) return '<span class="tag ' + statoTag(v) + '">' + esc(v || "—") + "</span>";
  if (["legale", "esposto", "superamento", "ea", "es", "obbl"].includes(c.k)) return v === "Sì" ? '<span class="tag t-amb">Sì</span>' : esc(v || "—");
  if (["indip", "risc", "com"].includes(c.k)) return v === "No" ? '<span class="tag t-red">No</span>' : esc(v || "—");
  if (c.k === "res") return v ? '<span class="rk ' + (LIVCLS[v] || "t-gry") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "amb") return ambTag(v);
  if (c.k === "giud") return '<span class="tag ' + (v === "Conforme" ? "t-grn" : v === "Non conforme" ? "t-red" : v ? "t-amb" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "classe" && /Maggiore|Minore/.test(v)) return '<span class="tag ' + (v === "Maggiore" ? "t-red" : "t-amb") + '">' + esc(v) + "</span>";
  if (["conf", "punt", "hse"].includes(c.k)) return '<span class="tag ' + (/Buon/.test(v) ? "t-grn" : /Insufficiente/.test(v) ? "t-red" : v ? "t-amb" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "ger") return v === "5 · DPI" ? '<span class="tag t-amb">' + esc(v) + "</span>" : esc(v || "—");
  if (c.k === "aut") return '<span class="tag ' + (v === "Richiesta e ottenuta" ? "t-grn" : v === "Non richiesta ma dovuta" ? "t-red" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "fond") return '<span class="tag ' + (v === "Sì" ? "t-red" : v === "No" ? "t-gry" : "t-amb") + '">' + esc(v || "—") + "</span>";
  return esc(v).slice(0, 150).replace(/\n/g, " ");
}
function fmtVal(v, c){ if (v == null || v === "") return ""; return c && c.t === "date" ? itDate(v) : String(v); }
function statoTag(s){
  if (!s) return "t-gry";
  if (/chius|verificata|attuat|eseguit|vigente|raggiunto|confermato|ripristinata|svolta|superata/i.test(s)) return "t-grn";
  if (/apert|scaduto|sospeso|non raggiunto|insufficiente|non conforme|non superata|azioni aperte/i.test(s)) return "t-red";
  return "t-amb";
}

function autoRec(d){
  const r = {}, rows = org().reg[d.id] || [];
  d.cols.forEach(c => {
    if (c.auto) r[c.k] = c.auto + String(rows.length + 1).padStart(3, "0");
    if (c.t === "date" && /^(data|datap)$/.test(c.k)) r[c.k] = oggi();
    if (c.k === "stato" && c.o) r[c.k] = c.o[0];
  });
  return r;
}

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";
  if (!edit) return inner;
  return '<div class="blk' + (modif ? " ovr" : "") + '" data-blk="' + i + '">' + inner +
    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}
function docHTML(blocks, ovr, edit){ return blocks.map((b, i) => blockHTML(b, i, ovr, edit)).join(""); }
function txtOf(b){ return b.k === "t" ? b.r.map(r => r.join(" ")).join(" ") : (b.t || ""); }

function esportaWord(tipo, id){
  const o = org(), rag = o.ana.ragione || o.nome;

  if (tipo === "pro"){
    const st = proState(id); titolo = id + " " + PRO[id].titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + esc(PRO[id].fase) + '</div><h2>' + esc(PRO[id].titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[id].blocks, st.ovr, false) +
      (st.add ? '<div class="sec">Integrazioni</div><p>' + nl2br(st.add) + "</p>" : "");
  } else if (tipo === "mod"){
    const d = MOD[id], reg = REGDEF.find(r => r.mod === id); titolo = id + " " + d.titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + d.pro + '</div><h2>' + esc(d.titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + "</div></div>" + (reg ? regStampa(reg) : "") + docHTML(d.blocks, null, false);
  } else if (tipo === "out"){
    titolo = { riesame:"Riesame di direzione", cruscotto:"Cruscotto delle prestazioni", conf:"Mappa di conformita",
               amb:"Analisi ambientale", ssl:"Valutazione dei rischi", elenco:"Elenco documenti" }[id] || "Documento";
    corpo = id === "riesame" ? riesame() : id === "cruscotto" ? stampaCruscotto() : id === "conf" ? mappaConf()
      : id === "amb" ? analisiAmb() : id === "ssl" ? valutazioneSsl() : elencoDoc();
  } else if (tipo === "ind"){
    const i = indById(id); titolo = "Scheda indicatore " + (i ? i.nome : "");

  } else if (tipo === "corpus"){
    titolo = "Sistema di gestione integrato " + rag;
    corpo = PROLIST.map(c => { const st = proState(c);
      return '<div style="page-break-before:always"></div><div class="dhead"><div class="k">' + c + " · " + esc(PRO[c].fase) + '</div><h2>' + esc(PRO[c].titolo) + "</h2>" +

  }
  scarica(fileSlug(rag) + "_" + fileSlug(titolo) + ".doc", wordWrap(titolo, corpo), "application/msword");
  toast("Documento pronto per Word");
}
function schedaInd(i){

      riga("Fonte del dato", i.fonte) + riga("Frequenza", i.freq) + riga("Responsabile", i.resp) +

const qs = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
function csvReg(id){
  const d = REGBYID[id], rows = org().reg[id] || [];
  const extra = d.calc === "asp" ? [qs("Punteggio"), qs("Significatività")] : d.calc === "per" ? [qs("Rischio")] : [];
  const head = d.cols.map(c => qs(c.l)).concat(extra).join(";");
  return [head].concat(rows.map(r => d.cols.map(c => qs(r[c.k])).concat(
    d.calc === "asp" ? [qs(puntAsp(r)), qs(aspSign(r))] : d.calc === "per" ? [qs(livRischio(r.p, r.g))] : []).join(";"))).join("\r\n");
}
function csvInd(){
  const head = ["Codice", "Indicatore", "Ambito", "Tipo", "Processo", "Formula", "UM", "Frequenza",
    "Target", "Verso", "Soglia", "Periodo", "Valore", "Nota"].map(qs).join(";");
  const rows = [];
  (org().ind || []).forEach(i => {
    const R = ril(i);
    if (!R.length) rows.push([i.cod, i.nome, i.amb, i.tipo, i.processo, i.formula, i.um, i.freq, i.target, i.verso, i.soglia, "", "", ""].map(qs).join(";"));
    R.forEach(r => rows.push([i.cod, i.nome, i.amb, i.tipo, i.processo, i.formula, i.um, i.freq, i.target, i.verso, i.soglia, r.per, r.val, r.nota].map(qs).join(";")));
  });
  return [head].concat(rows).join("\r\n");
}
function csvConf(){
  const o = org();
  return [["Punto", "Capitolo", "Norme", "Domanda", "Procedura", "Stato", "Evidenza", "Note"].map(qs).join(";")]
    .concat(REQ.map(r => { const st = o.req[r.id] || {};
      return [r.rif, r.capn, r.nrm, r.t, r.pro, st.s || "", st.e || "", st.n || ""].map(qs).join(";"); })).join("\r\n");
}

  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.ind != null){ const i = indById(sel.ind); if (i){ i[t.dataset.ind] = t.value; touch(); } return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "indq", "sgsq", "modq", "confq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "s"){ t.className = t.value === "Non conforme" ? "no" : ""; refreshConf(); } return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.ind != null || t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && e.target.id && ["rilPer", "rilVal", "rilNota"].includes(e.target.id)) ACT.addRil();
});
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
</html>
