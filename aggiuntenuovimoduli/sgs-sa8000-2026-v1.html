":"L’Organizzazione interagisca in modo trasparente e aperto con le terze parti autorizzate, fornendo accesso a documentazione, registrazioni, materiali, persone e ambienti di lavoro (M8.3)."},{"k":"p","t":"1.2 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M8.1–8.3"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M8"},{"k":"p","t":"PRO-04 – Gestione della Politica (impegni di politica per il report pubblico)"},{"k":"p","t":"PRO-05 – Contesto, Impatti e Rischi (rischi da comunicare)"},{"k":"p","t":"PRO-07 – Consapevolezza, Attuazione e Informazione Documentata"},{"k":"p","t":"PRO-12/13 – Meccanismi di Reclamo (dati per M8.2f)"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"D.Lgs. 24/2023 (Whistleblowing) e normativa applicabile"},{"k":"p","t":"D.Lgs. 231/2001 (Responsabilità amministrativa degli enti)"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Integrità","Operare e comunicare in modo onesto, accurato e coerente con gli impegni assunti. Include la prevenzione di falsificazione, manipolazione, occultamento di dati, frode e interferenza negli audit (M8.1)."],["Trasparenza","Rendere disponibili informazioni accurate, tempestive e accessibili su processi, risultati, rischi e sfide a stakeholder, terze parti autorizzate e al pubblico (M8.2, M8.3)."],["Whistleblowing","Segnalazione in buona fede di violazioni, irregolarità, comportamenti non etici, con protezione del segnalante dalla ritorsione."],["Report pubblico","Pubblicazione periodica dei processi e dei risultati relativi allo Standard, rispondente ai requisiti M8.2 a–h."],["Terza parte autorizzata","Auditor, organismi di certificazione, regolatori, ispettorati del lavoro, rappresentanti dei lavoratori, SAI e altre entità con diritto di accesso ai sensi di M8.3."],["Interferenza nell’audit","Qualsiasi azione volta a limitare l’accesso degli auditor, condizionare i lavoratori (coaching), nascondere documentazione o alterare le condizioni durante le visite ispettive."],["AD / Resp. SA / SPT","Alta Direzione / Responsabile SA8000 / Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR/Legale","Funzioni","Lav./OO.SS."],["Politica e cultura dell’integrità (M8.1)","A","R","C","R","C","I"],["Formazione integrità","I","R","C","R","C","I"],["Gestione whistleblowing e segnalazioni","A","R","C","R","I"],["Controlli anti-falsificazione registrazioni","I","R","I","C","R","I"],["Report pubblico (M8.2)","A","R","C","I"],["Interazione con terze parti (M8.3)","A","R","C","I"],["Indagine violazioni integrità","A","R","I","R","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Integrità operativa e comunicativa (M8.1)"},{"k":"p","t":"4.1.1 Cultura dell’integrità"},{"k":"p","t":"L’Organizzazione promuove una cultura dell’integrità attraverso:"},{"k":"p","t":"Inclusione degli elementi di integrità nella documentazione operativa (es. requisito di considerare oggettivamente tutti i candidati nelle procedure di assunzione, nella gestione fornitori, ecc.)."},{"k":"p","t":"Formazione iniziale e periodica sulla consapevolezza dell’integrità per tutto il personale."},{"k":"p","t":"Meccanismo di decisione etica ed escalation per i conflitti tra pressioni aziendali e diritti dei lavoratori."},{"k":"p","t":"Misure disciplinari per il mancato rispetto dei requisiti di integrità, proporzionate e documentate."},{"k":"p","t":"4.1.2 Prevenzione della falsificazione e manipolazione"},{"k":"p","t":"L’Organizzazione implementa controlli per prevenire la falsificazione, manipolazione o occultamento di registrazioni:"},{"k":"p","t":"Processo anti-frode e anti-rappresentazione fuorviante per i dati relativi al lavoro e alla compliance."},{"k":"p","t":"Verifiche interne di accuratezza delle registrazioni critiche (buste paga, presenze, straordinari, infortuni, reclami)."},{"k":"p","t":"Tracciabilità delle registrazioni critiche: proprietario, versione, approvazione documentata."},{"k":"p","t":"Audit a campione sulle registrazioni per verificare coerenza con i documenti originali."},{"k":"p","t":"Correzione e ri-emissione tempestiva di informazioni inaccurate o fuorvianti."},{"k":"p","t":"4.1.3 Whistleblowing e segnalazione"},{"k":"p","t":"L’Organizzazione mantiene un meccanismo di segnalazione (whistleblowing) conforme al D.Lgs. 24/2023 e allo Standard:"},{"k":"p","t":"Canali di segnalazione confidenziali e accessibili (piattaforma digitale, cassetta fisica, email dedicata, hotline)."},{"k":"p","t":"Protezione del segnalante dalla ritorsione, documentata e comunicata a tutto il personale."},{"k":"p","t":"Processo di indagine per le violazioni di integrità: ricezione, valutazione preliminare, indagine, esito, azione correttiva, feedback al segnalante."},{"k":"p","t":"Registro delle segnalazioni (MOD-08.01) con tracciamento dall’apertura alla chiusura."},{"k":"p","t":"Report periodico interno ed escalation per segnalazioni gravi all’AD entro 24 ore."},{"k":"p","t":"4.1.4 Integrità nelle comunicazioni"},{"k":"p","t":"L’Organizzazione garantisce l’integrità delle comunicazioni attraverso:"},{"k":"p","t":"Processo di revisione etica per tutte le dichiarazioni interne ed esterne relative alle pratiche di lavoro e alla compliance (marketing, comunicazioni ai clienti, claim di certificazione)."},{"k":"p","t":"Verifica che le affermazioni di conformità (certificazioni, dichiarazioni di marketing, comunicazioni ai clienti) siano accurate e supportate da evidenze."},{"k":"p","t":"Divieto di coaching dei lavoratori prima degli audit e di qualsiasi interferenza nei processi di audit."},{"k":"p","t":"Formazione dei manager e del personale sulla libertà di parlare durante gli audit."},{"k":"p","t":"4.2 Report pubblico (M8.2)"},{"k":"p","t":"4.2.1 Ciclo di reporting"},{"k":"p","t":"L’Organizzazione pubblica un report pubblico con cadenza almeno annuale sui propri processi e risultati relativi allo Standard. Il ciclo comprende:"},{"k":"p","t":"Pianificazione: definizione dell’ambito, contenuto e accessibilità con consultazione degli stakeholder chiave."},{"k":"p","t":"Raccolta dati: contributi interfunzionali (compliance, HR, H&S, finanza, rappresentanti lavoratori, SPT)."},{"k":"p","t":"Redazione: linguaggio non tecnico, con note esplicative, infografiche, FAQ ove necessario."},{"k":"p","t":"Revisione: cross-verifica dei dati con i documenti originali; inclusione di risultati positivi e sfide."},{"k":"p","t":"Approvazione: sign-off dell’AD per confermare accuratezza, completezza e allineamento con gli impegni."},{"k":"p","t":"Pubblicazione e diffusione: online, in lingue rilevanti, in formato cartaceo/on-site accessibile a lavoratori e comunità."},{"k":"p","t":"Coinvolgimento di valutatori indipendenti (auditor, osservatori della società civile) ove opportuno."},{"k":"p","t":"4.2.2 Contenuto minimo del report (M8.2 a–h)"},{"k":"t","r":[["Rif.","Requisito M8.2","Contenuto operativo"],["a)","Trasparente, veritiero e chiaro","Linguaggio non tecnico; inclusione di sfide e azioni correttive (non solo risultati positivi); note esplicative; infografiche e FAQ."],["b)","Rispondente alle esigenze degli stakeholder","Consultazione stakeholder su ambito e contenuto; confronto con pari e best practice SA8000; adattamento per diversi livelli di comprensione."],["c)","Impegno di politica dell’Organizzazione","Riproduzione o riformulazione della Dichiarazione di Politica SA8000; evidenza del collegamento tra politica e risultati."],["d)","Operazioni aziendali","Panoramica di sedi, forza lavoro, settori, paesi di operazione e catene di fornitura."],["e)","Gestione dei rischi","Sintesi dei rischi identificati, metodi di prioritizzazione, azioni di mitigazione e riparazione, tendenze delle performance."],["f)","Meccanismi di reclamo (su richiesta)","Informazioni sull’utilizzo dei meccanismi di reclamo e sui risultati dei processi di reclamo, su richiesta degli stakeholder."],["g)","Requisiti legali e regolamentari","Conformità con tutti gli obblighi di reporting legali, regolamentari e di altro tipo applicabili."],["h)","Accessibilità e disponibilità","PDF, pagine web, brochure sintetiche, formati visivi; pubblicazione online in lingue rilevanti; diffusione ai lavoratori tramite bacheche, piattaforme digitali, riunioni."]]},{"k":"p","t":"4.3 Interazione con le terze parti autorizzate (M8.3)"},{"k":"p","t":"4.3.1 Politica di cooperazione trasparente"},{"k":"p","t":"L’Organizzazione adotta una politica di cooperazione trasparente con le terze parti autorizzate (auditor, organismi di certificazione, regolatori, ispettorati, rappresentanti dei lavoratori, SAI):"},{"k":"p","t":"Procedure chiare per concedere accesso a impianti, personale, registrazioni e documenti quando le richieste sono legittime e nell’ambito dello Standard."},{"k":"p","t":"Repository aggiornato (digitale/fisico) delle politiche, procedure, registri dei rischi, log formativi, registrazioni dei reclami, cedolini paga e piani di azione correttiva."},{"k":"p","t":"Checklist dei documenti comunemente richiesti dagli auditor e dai regolatori (MOD-08.03)."},{"k":"p","t":"Tempistiche di risposta definite per le richieste (max 48 ore per documenti standard, 5 gg per documenti complessi)."},{"k":"p","t":"4.3.2 Accesso e condotta durante gli audit"},{"k":"p","t":"Regole per l’ingresso in stabilimento: nessuna restrizione di accesso per le terze parti autorizzate."},{"k":"p","t":"Accesso a spazi confidenziali separati dal management per le interviste ai lavoratori."},{"k":"p","t":"Tempo per il personale di incontrare le terze parti durante l’orario di lavoro senza perdita di retribuzione o rischio di ritorsione."},{"k":"p","t":"Formazione dei manager e del personale sulla condotta attesa durante gli audit/ispezioni e sulla garanzia di non-ritorsione."},{"k":"p","t":"Formazione del personale sul diritto di parlare liberamente durante le interviste con le terze parti."},{"k":"p","t":"4.3.3 Gestione delle divergenze e degli audit non annunciati"},{"k":"p","t":"Definizione di come le divergenze su ambito, accesso o riservatezza saranno risolte con le terze parti."},{"k":"p","t":"Accoglienza degli audit non annunciati senza interruzione delle attività né ritardi."},{"k":"p","t":"Designazione di un rappresentante della direzione per coordinare e facilitare le interazioni."},{"k":"p","t":"Documentazione e indagine di qualsiasi caso in cui l’accesso sia stato ritardato, limitato o incompleto (MOD-08.04)."},{"k":"p","t":"4.4 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Cultura integrità","Definizione/aggiornamento elementi di integrità nella documentazione operativa; formazione iniziale e periodica.","Resp. SA / HR","Annuale"],["2","Controlli anti-falsificazione","Implementazione verifiche accuratezza registrazioni; audit a campione; tracciabilità registrazioni critiche.","Resp. SA / Funzioni","Continuo"],["3","Gestione whistleblowing","Manutenzione canali; ricezione segnalazioni; indagine; azioni correttive; protezione segnalante; registro MOD-08.01.","Resp. SA / HR/Legale","Continuo"],["4","Revisione comunicazioni","Processo di revisione etica per dichiarazioni interne/esterne; verifica claim di conformità.","Resp. SA","Continuo"],["5","Pianificazione report pubblico","Definizione ambito, contenuto, accessibilità; consultazione stakeholder; calendario.","Resp. SA / AD","Annuale"],["6","Raccolta dati e redazione","Contributi interfunzionali; cross-verifica dati; redazione in linguaggio accessibile; inclusione sfide e azioni.","Resp. SA / Funzioni","+30 gg"],["7","Revisione e approvazione","Revisione accuratezza; sign-off AD; eventuale valutazione indipendente; MOD-08.02.","AD","+15 gg"],["8","Pubblicazione e diffusione","Online, cartaceo, on-site; lingue rilevanti; diffusione a lavoratori e stakeholder; sintesi accessibile.","Resp. SA / SPT","+15 gg"],["9","Preparazione audit M8.3","Aggiornamento repository documentale; checklist documenti MOD-08.03; formazione condotta audit.","Resp. SA","Continuo"],["10","Interazione terze parti","Accoglienza audit/ispezioni; accesso documentazione; interviste confidenziali; gestione divergenze.","Resp. SA / AD","Per evento"],["11","Monitoraggio e miglioramento","Tracciamento KPI M8.1–8.3; indagine violazioni; correzioni; input al RdD.","Resp. SA","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Integrità (M8.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale che ha ricevuto formazione sull’integrità nel periodo","N. formati / N. totale × 100","≥ 95%","Annuale"],["% personale campione consapevole delle politiche di integrità","Survey / test","≥ 85%","Annuale"],["N. incidenti di interferenza nell’audit segnalati","Conteggio","0","Per audit"],["% audit condotti senza restrizioni di accesso o coaching","N. senza interf. / N. tot. × 100","100%","Per audit"],["% dipendenti che confermano libertà di parlare durante gli audit","Survey/interviste","≥ 95%","Annuale"],["N. incidenti di falsificazione o manipolazione registrazioni","Conteggio","0","Annuale"],["% registrazioni critiche con tracciabilità completa (proprietario, versione, approvazione)","N. tracciabili / N. critiche × 100","100%","Annuale"],["% registrazioni che superano le verifiche interne di accuratezza","N. accurate / N. campione × 100","≥ 98%","Annuale"],["N. correzioni di documenti emesse per problemi di integrità","Conteggio","Monitoraggio","Annuale"]]},{"k":"p","t":"5.2 Indicatori Report Pubblico (M8.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% report che riproducono/riformulano l’impegno di politica","Verifica contenuto","100%","Per report"],["% rischi prioritari su cui si rende conto nel report","N. reportati / N. prioritari × 100","≥ 90%","Per report"],["% report rivisti e approvati dall’AD prima della pubblicazione","N. approvati / N. tot. × 100","100%","Per report"],["% report che hanno incorporato feedback di lavoratori/sindacati/stakeholder","Verifica processo","100%","Per report"],["% dati verificati rispetto ai documenti originali","N. verificati / N. tot. × 100","≥ 90%","Per report"],["N. correzioni fattuali emesse dopo la pubblicazione","Conteggio","0","Per ciclo"],["% report tradotti in tutte le lingue rilevanti","N. lingue / N. necessarie × 100","100%","Per report"],["% lavoratori che dichiarano di aver visto/ricevuto informazioni sul report","Survey","≥ 70%","Annuale"],["% stakeholder che trovano il report chiaro, rilevante e utile","Survey","≥ 70%","Annuale"]]},{"k":"p","t":"5.3 Indicatori Terze Parti (M8.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% documenti richiesti forniti alle terze parti entro i tempi concordati","N. in tempo / N. richiesti × 100","100%","Per audit"],["Tempo medio tra richiesta e fornitura documentazione (gg)","Media giorni","≤ 2 gg","Per audit"],["% audit/ispezioni non annunciati accolti senza ritardo o restrizione","N. accolti / N. tot. × 100","100%","Per evento"],["% interviste richieste condotte confidenzialmente senza interferenza del management","N. confidenziali / N. tot. × 100","100%","Per audit"],["% manager/personale formati sulla condotta trasparente durante gli audit","N. formati / N. tot. × 100","≥ 95%","Annuale"],["% lavoratori che confermano consapevolezza del diritto di parlare liberamente","Survey/interviste","≥ 95%","Annuale"],["N. casi documentati di accesso negato, limitato o ritardato","Conteggio","0","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-08.01","Registro Segnalazioni Integrità e Whistleblowing","Log segnalazioni: data, canale, tipologia, stato indagine, esito, azioni correttive, protezione segnalante."],["MOD-08.02","Checklist Report Pubblico (M8.2 a–h)","Verifica che il report pubblico soddisfi tutti i requisiti M8.2 a–h prima della pubblicazione."],["MOD-08.03","Checklist Documenti per Audit e Ispezioni (M8.3)","Elenco dei documenti comunemente richiesti da auditor/regolatori con stato di disponibilità."],["MOD-08.04","Registro Interazioni con Terze Parti","Log di ogni interazione: data, terza parte, tipo, documenti forniti, esito, divergenze, follow-up."],["MOD-08.05","Report Annuale Integrità e Trasparenza","Valutazione annuale: KPI M8.1–8.3, segnalazioni, report pubblico, audit, gap, raccomandazioni."]]},{"k":"p","t":"Conservazione: tutte le registrazioni per almeno 5 anni; registro segnalazioni per durata della certificazione."},{"k":"p","t":"Riservatezza: le segnalazioni whistleblowing sono gestite con massima riservatezza; accesso limitato a Resp. SA, HR/Legale e AD."},{"k":"p","t":"Accesso garantito ad AD, Resp. SA, SPT e terze parti autorizzate (auditor, SAI) ai sensi di M8.3."}]},"PRO-09":{"code":"PRO-09","blocks":[{"k":"t","r":[["PROCEDURA PRO-09"],["Codice:","PRO-09","Revisione:","01"],["Titolo:","GESTIONE DOCUMENTALE"],["Criteri SA8000:","M7.5","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per la gestione delle informazioni documentate del Sistema di Gestione SA8000:2026, in conformità al criterio M7.5 dello Standard."},{"k":"p","t":"La procedura assicura che le informazioni documentate siano:"},{"k":"p","t":"Disponibili e adeguate all’uso, dove e quando necessarie (M7.5a)."},{"k":"p","t":"Accurate e chiare, così da supportare decisioni e prestazioni corrette (M7.5b)."},{"k":"p","t":"Efficacemente controllate: protette da perdita di riservatezza, uso improprio e perdita di integrità (M7.5c)."},{"k":"p","t":"Identificabili: attraverso codifica univoca, titolo, formato, revisione e approvazione (M7.5d)."},{"k":"p","t":"1.1 Criteri coperti"},{"k":"t","r":[["Criterio","Requisito"],["M7.5a","Informazioni documentate disponibili e adeguate all’uso"],["M7.5b","Informazioni documentate accurate e chiare"],["M7.5c","Informazioni documentate efficacemente controllate"],["M7.5d","Informazioni documentate identificabili"]]},{"k":"p","t":"1.2 Riferimenti normativi e documentali"},{"k":"p","t":"SA8000:2026 Standard for Decent Work – M7.5 Informazioni documentate"},{"k":"p","t":"SA8000:2026 Indicator Library V1.0 – Sezione M7"},{"k":"p","t":"UNI EN ISO 9001:2015 – Clausola 7.5 Informazioni documentate (riferimento di buona pratica)"},{"k":"p","t":"D.Lgs. 81/2008 – Obblighi documentali in materia di salute e sicurezza"},{"k":"p","t":"Reg. UE 2016/679 (GDPR) – Protezione dati personali nei documenti"},{"k":"p","t":"PRO-04 Gestione della Politica – Documenti di politica"},{"k":"p","t":"PRO-05 Valutazione dei Rischi – Registro rischi e valutazioni"},{"k":"p","t":"PRO-10 Reporting e Comunicazione Pubblica – Report pubblici"},{"k":"p","t":"PRO-22 Privacy e Dati Personali – Trattamento dati nei documenti"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Informazione documentata","Informazione che deve essere controllata e mantenuta dall’Organizzazione e il supporto su cui è contenuta. Include politiche, procedure, istruzioni operative, moduli, registrazioni, report, verbali e qualsiasi altro documento del sistema di gestione."],["Documento controllato","Informazione documentata soggetta a codifica, revisione, approvazione, distribuzione controllata e conservazione secondo la presente procedura."],["Registrazione","Informazione documentata che fornisce evidenza oggettiva di attività svolte o risultati ottenuti. Le registrazioni non sono soggette a revisione ma a conservazione e protezione."],["Documento obsoleto","Versione precedente di un documento controllato, superata dalla revisione corrente. Deve essere ritirata dalla distribuzione attiva e identificata come obsoleta."],["Documento di origine esterna","Normativa, standard, linea guida, contratto collettivo o altro documento prodotto da enti esterni che l’Organizzazione deve mantenere aggiornato e accessibile."]]},{"k":"p","t":"3. RESPONSABILITÀ (MATRICE RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","HR","Funzioni","IT"],["Definizione struttura documentale","A","R","C","I","C"],["Redazione documenti","I","R/C","C","R","I"],["Verifica e approvazione","A","R","C","I"],["Distribuzione e accessibilità","I","R","I","C","I","R"],["Conservazione e protezione","I","R","I","C","I","R"],["Gestione documenti obsoleti","I","R","I","C"],["Gestione documenti di origine esterna","I","R","C","I"],["Audit documentale periodico","I","R","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Struttura documentale del sistema di gestione"},{"k":"p","t":"L’architettura documentale del Sistema di Gestione SA8000:2026 si articola su quattro livelli gerarchici:"},{"k":"t","r":[["Livello","Tipologia","Contenuto","Esempi"],["1","Manuale del Sistema di Gestione","Politica, struttura, responsabilità, processi chiave, mappatura criteri F/M/D","Manuale SA8000:2026"],["2","Procedure operative","Modalità operative dettagliate per ciascun criterio M1–M10, D1–D7","PRO-01 – PRO-22"],["3","Istruzioni, moduli, checklist","Istruzioni operative specifiche, moduli di registrazione, checklist di verifica","MOD-xx.yy, IST-xx"],["4","Registrazioni ed evidenze","Verbali, report, registri compilati, evidenze di audit, piani d’azione compilati","Verbali RdD, Report audit, Registro reclami"]]},{"k":"p","t":"4.2 Identificazione e codifica (M7.5d)"},{"k":"p","t":"Ogni documento controllato è identificato univocamente attraverso:"},{"k":"p","t":"Codice alfanumerico: tipologia + numero progressivo (es. PRO-09, MOD-09.01, IST-09.01)."},{"k":"p","t":"Titolo descrittivo del contenuto."},{"k":"p","t":"Numero di revisione (formato: Rev. 01, 02, 03…)."},{"k":"p","t":"Data di emissione/revisione."},{"k":"p","t":"Identità del redattore, del verificatore e dell’approvatore."},{"k":"p","t":"Numero di pagina e totale pagine (intestazione o piè di pagina)."},{"k":"p","t":"Schema di codifica"},{"k":"t","r":[["Prefisso","Descrizione","Esempio"],["MAN","Manuale del Sistema di Gestione","MAN-SA8000"],["PRO","Procedura operativa","PRO-09 Gestione Documentale"],["MOD","Modulo / Checklist / Registro","MOD-09.01 Elenco Generale Documenti"],["IST","Istruzione operativa","IST-09.01 Compilazione modulo reclamo"],["REG","Registrazione compilata","REG-09.01-2026 Registro distribuzione"],["DOC-EST","Documento di origine esterna","DOC-EST-001 SA8000:2026 Standard"]]},{"k":"p","t":"4.3 Redazione, verifica e approvazione"},{"k":"p","t":"Il ciclo di vita di ogni documento controllato segue le seguenti fasi:"},{"k":"p","t":"a) Redazione"},{"k":"p","t":"La funzione competente per materia redige il documento utilizzando i modelli standard (template) forniti dal Resp. SA."},{"k":"p","t":"Il documento deve essere redatto in modo accurato e chiaro (M7.5b), utilizzando un linguaggio comprensibile al personale destinatario."},{"k":"p","t":"Per documenti che coinvolgono diritti dei lavoratori, la redazione include la consultazione dell’SPT e, ove pertinente, delle OO.SS."},{"k":"p","t":"b) Verifica"},{"k":"p","t":"Il Resp. SA verifica la coerenza del documento con lo Standard SA8000:2026, la legislazione applicabile e gli altri documenti del sistema."},{"k":"p","t":"La verifica assicura che il documento non contenga informazioni in conflitto con altri documenti approvati."},{"k":"p","t":"c) Approvazione"},{"k":"p","t":"L’approvazione è formalizzata con firma (fisica o elettronica) dell’autorità competente secondo la seguente matrice:"},{"k":"t","r":[["Tipologia documento","Approvatore","Note"],["Manuale, Politica","Alta Direzione","Previa consultazione SPT"],["Procedure (PRO)","Alta Direzione / Resp. SA","Previa verifica Resp. SA"],["Moduli, Checklist, Istruzioni","Resp. SA / Responsabile funzione",""],["Report pubblici","Alta Direzione","Coordinamento PRO-10"]]},{"k":"p","t":"4.4 Distribuzione e accessibilità (M7.5a)"},{"k":"p","t":"Le informazioni documentate devono essere disponibili e adeguate all’uso, dove e quando necessarie:"},{"k":"p","t":"Distribuzione controllata: ogni documento approvato è distribuito alle funzioni destinatarie tramite il sistema documentale (cartella condivisa, intranet, sistema di gestione documentale). Il MOD-09.02 Registro Distribuzione traccia destinatari, data e revisione."},{"k":"p","t":"Accessibilità linguistica: i documenti che riguardano diritti e doveri del personale sono disponibili nella lingua madre dei lavoratori o in lingua da questi comprensibile, in coordinamento con PRO-07 Formazione e PRO-18 Reclutamento."},{"k":"p","t":"Accessibilità fisica e digitale: copie cartacee sono disponibili nei punti di utilizzo (bacheche, postazioni, aree comuni); copie digitali sono accessibili da qualsiasi postazione autorizzata."},{"k":"p","t":"Personale esterno e BP: i documenti rilevanti per i partner commerciali (es. Politica Aspettative Reciproche, checklist BP) sono trasmessi in formato controllato, con evidenza di ricevimento."},{"k":"p","t":"Riservatezza: l’accesso ai documenti contenenti dati personali, segnalazioni di reclamo o informazioni riservate è limitato alle funzioni autorizzate, in coordinamento con PRO-22 Privacy."},{"k":"p","t":"4.5 Controllo delle modifiche e revisione (M7.5c)"},{"k":"p","t":"Le modifiche ai documenti controllati seguono lo stesso iter di redazione-verifica-approvazione del documento originale:"},{"k":"p","t":"Richiesta di modifica: qualsiasi funzione può proporre una modifica compilando il MOD-09.03 Richiesta Modifica Documento, indicando motivo, sezioni coinvolte e urgenza."},{"k":"p","t":"Valutazione: il Resp. SA valuta l’impatto della modifica sugli altri documenti del sistema e sulla conformità allo Standard."},{"k":"p","t":"Revisione: il documento è aggiornato con incremento del numero di revisione; le modifiche sono sintetizzate nel Registro delle Revisioni in calce al documento."},{"k":"p","t":"Distribuzione della nuova versione: la versione aggiornata è distribuita a tutti i destinatari; la versione precedente è ritirata e identificata come “OBSOLETO”."},{"k":"p","t":"Conservazione degli obsoleti: almeno una copia di ogni versione obsoleta è conservata nell’archivio storico, identificata con watermark “OBSOLETO – NON UTILIZZARE”, per un periodo minimo pari alla conservazione del documento attivo."},{"k":"p","t":"4.6 Conservazione, protezione e disposizione (M7.5c)"},{"k":"p","t":"Le registrazioni e i documenti del sistema sono conservati secondo i seguenti criteri:"},{"k":"t","r":[["Tipologia","Periodo minimo","Supporto","Responsabile custodia"],["Contratti e fascicoli personale","10 anni dalla cessazione","Cartaceo + digitale","HR"],["Registri assunzioni/cessazioni","10 anni","Cartaceo + digitale","HR"],["Verbali RdD, SPT, audit","5 anni","Digitale (backup)","Resp. SA"],["Registri reclami e AC","5 anni dalla chiusura","Digitale (backup)","Resp. SA"],["Valutazioni rischi","Durata validità + 3 anni","Digitale (backup)","Resp. SA"],["Report pubblici SA8000","5 anni","Digitale + sito web","Resp. SA"],["Documenti H&S (DVR, ecc.)","Come da D.Lgs. 81/2008","Cartaceo + digitale","RSPP / Resp. SA"],["Procedure e manuali obsoleti","3 anni dalla sostituzione","Archivio storico","Resp. SA"]]},{"k":"p","t":"Misure di protezione:"},{"k":"p","t":"Backup digitale: backup incrementale giornaliero e backup completo settimanale su supporto separato (cloud, NAS, ecc.). Test di ripristino semestrale."},{"k":"p","t":"Protezione accesso: autenticazione per documenti digitali; archivio fisico chiuso a chiave con accesso riservato alle funzioni autorizzate."},{"k":"p","t":"Protezione dati personali: i documenti contenenti dati sensibili sono trattati in conformità al GDPR e alla PRO-22 Privacy (minimizzazione, pseudonimizzazione ove possibile, accesso limitato)."},{"k":"p","t":"Disposizione: alla scadenza del periodo di conservazione, i documenti sono distrutti in modo sicuro (triturazione per cartacei, cancellazione certificata per digitali) con evidenza nel MOD-09.04 Registro Disposizione Documenti."},{"k":"p","t":"4.7 Documenti di origine esterna"},{"k":"p","t":"I documenti di origine esterna rilevanti per il sistema di gestione includono:"},{"k":"p","t":"Standard SA8000:2026 e Indicator Library."},{"k":"p","t":"Legislazione nazionale e regionale applicabile (lavoro, H&S, privacy, immigrazione, ecc.)."},{"k":"p","t":"Contratti collettivi nazionali e aziendali (CCNL)."},{"k":"p","t":"Convenzioni OIL e strumenti internazionali di riferimento."},{"k":"p","t":"Linee guida di settore, benchmark retributivi (living wage), pubblicazioni SAI."},{"k":"p","t":"Il Resp. SA mantiene un elenco aggiornato dei documenti di origine esterna (MOD-09.01, sezione dedicata), ne verifica la vigenza almeno annualmente e comunica alle funzioni interessate ogni aggiornamento rilevante."},{"k":"p","t":"4.8 Accuratezza e chiarezza (M7.5b)"},{"k":"p","t":"Per garantire che le informazioni documentate siano accurate e chiare:"},{"k":"p","t":"Linguaggio: i documenti sono redatti in linguaggio semplice, evitando tecnicismi non necessari. Per documenti destinati al personale operativo, il livello linguistico è adeguato alla comprensione del target."},{"k":"p","t":"Coerenza terminologica: la terminologia è allineata alle definizioni dello Standard SA8000:2026 (Appendice A) e del presente sistema documentale."},{"k":"p","t":"Verifica incrociata: prima dell’approvazione, il Resp. SA verifica che il documento non contenga informazioni in contraddizione con altri documenti approvati."},{"k":"p","t":"Aggiornamento tempestivo: ogni cambiamento normativo, organizzativo o procedurale che rende un documento inaccurato attiva il processo di revisione entro 30 giorni."},{"k":"p","t":"4.9 Flusso operativo"},{"k":"t","r":[["#","Fase","Attività chiave","Responsabile","Output"],["1","Necessità documentale","Identificazione esigenza: nuovo documento, revisione, documento esterno","Qualsiasi funzione","Richiesta (MOD-09.03 o verbale)"],["2","Redazione / aggiornamento","Stesura su template; consultazione SPT/OO.SS. se diritti lavoratori","Funzione competente","Bozza documento"],["3","Verifica","Coerenza con Standard, legge, altri documenti; accuratezza e chiarezza","Resp. SA","Documento verificato"],["4","Approvazione","Firma autorità competente; registrazione in MOD-09.01","AD / Resp. SA","Documento approvato"],["5","Distribuzione","Caricamento su sistema documentale; distribuzione controllata; ritiro obsoleti","Resp. SA / IT","MOD-09.02 aggiornato"],["6","Utilizzo","Applicazione operativa; formazione se necessaria","Funzioni destinatarie","Registrazioni operative"],["7","Conservazione","Archiviazione secondo tabella 4.6; protezione e backup","Resp. SA / IT","Archivio protetto"],["8","Disposizione","Distruzione sicura alla scadenza; registrazione in MOD-09.04","Resp. SA","MOD-09.04 aggiornato"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte dati","Frequenza","Target"],["% documenti del sistema con codifica, revisione e approvazione conformi","MOD-09.01 / audit","Annuale","100%"],["% documenti disponibili nella lingua comprensibile al personale destinatario","Audit / survey","Annuale","100%"],["Tempo medio di approvazione nuovi documenti / revisioni (giorni)","MOD-09.03","Annuale","≤ 30 giorni"],["% documenti obsoleti ritirati entro 7 giorni dall’approvazione nuova revisione","MOD-09.02","Annuale","100%"],["N. NC documentali rilevate in audit interni/esterni","Report audit","Annuale","Monitoraggio (trend ↓)"],["% test di ripristino backup superati con successo","Log IT","Semestrale","100%"],["% documenti di origine esterna verificati per vigenza nell’anno","MOD-09.01","Annuale","100%"],["% personale che conferma accessibilità ai documenti rilevanti","Survey / interviste","Annuale","≥ 90%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"p","t":"6.1 Moduli e allegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-09.01","Elenco Generale Documenti","Registro master di tutti i documenti del sistema: codice, titolo, revisione corrente, data, approvatore, destinatari, collocazione, documenti di origine esterna"],["MOD-09.02","Registro Distribuzione","Tracciamento distribuzione documenti controllati: documento, revisione, destinatario, data consegna, firma/conferma ricezione"],["MOD-09.03","Richiesta Modifica Documento","Modulo per richiedere la creazione, modifica o ritiro di un documento: richiedente, documento, motivo, sezioni coinvolte, urgenza, esito valutazione"],["MOD-09.04","Registro Disposizione Documenti","Registrazione distruzione documenti a fine conservazione: documento, revisione, data distruzione, modalità, responsabile"]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"MOD-09.01 e MOD-09.02: aggiornati continuativamente; conservati per l’intera durata del sistema di gestione."},{"k":"p","t":"MOD-09.03: conservato per 3 anni dalla chiusura della richiesta."},{"k":"p","t":"MOD-09.04: conservato per 5 anni dall’ultima registrazione."},{"k":"p","t":"6.3 Coordinamento con altre procedure"},{"k":"p","t":"PRO-04 Gestione della Politica: controllo documenti di politica SA8000."},{"k":"p","t":"PRO-05 Valutazione dei Rischi: conservazione registro rischi e valutazioni."},{"k":"p","t":"PRO-07 Formazione: distribuzione documenti formativi e registri presenze."},{"k":"p","t":"PRO-08 Gestione Partner Commerciali: trasmissione documenti controllati a BP."},{"k":"p","t":"PRO-10 Reporting e Comunicazione: gestione report pubblici."},{"k":"p","t":"PRO-11 Monitoraggio e Audit: gestione report e registrazioni audit."},{"k":"p","t":"PRO-12/13 Reclami: protezione registri reclami e segnalazioni."},{"k":"p","t":"PRO-22 Privacy: protezione dati personali nei documenti."}]},"PRO-10":{"code":"PRO-10","blocks":[{"k":"t","r":[["PROCEDURA PRO-10"],["Codice:","PRO-10","Revisione:","01"],["Titolo:","REPORTING E COMUNICAZIONE PUBBLICA"],["Criteri SA8000:","M8.1–8.3","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire l’integrità, la trasparenza e il reporting pubblico dell’Organizzazione in merito alle prestazioni di lavoro dignitoso, in conformità ai criteri M8.1–8.3 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione operi e comunichi con integrità nel rispetto dello Standard (M8.1)."},{"k":"p","t":"L’Organizzazione pubblichi periodicamente un report trasparente, veritiero, chiaro, rispondente alle esigenze degli stakeholder, inclusivo della politica, descrittivo delle operazioni, informativo sui rischi, disponibile e accessibile (M8.2 a–f)."},{"k":"p","t":"L’Organizzazione interagisca in modo trasparente con le terze parti autorizzate (auditor, SAI), fornendo accesso completo a documentazione, registri, materiali, persone e ambienti di lavoro (M8.3)."},{"k":"p","t":"1.1 Criteri coperti"},{"k":"t","r":[["Criterio","Requisito"],["M8.1","L’Organizzazione opera e comunica con integrità nel rispetto dei requisiti dello Standard"],["M8.2a","Report trasparente, veritiero e chiaro"],["M8.2b","Rispondente alle esigenze degli stakeholder"],["M8.2c","Inclusivo dell’impegno di politica"],["M8.2d","Descrittivo delle operazioni aziendali"],["M8.2e","Informativo sui rischi identificati e sulle azioni intraprese"],["M8.2f","Disponibile e accessibile"],["M8.3","Trasparenza con terze parti autorizzate: accesso a documentazione, registri, persone, ambienti"]]},{"k":"p","t":"1.2 Riferimenti normativi e documentali"},{"k":"p","t":"SA8000:2026 Standard for Decent Work – M8.1–8.3"},{"k":"p","t":"SA8000:2026 Indicator Library V1.0 – Sezione M8"},{"k":"p","t":"UNGPs – Principio 21 (Comunicazione)"},{"k":"p","t":"Linee Guida OCSE per le Imprese Multinazionali – Cap. III Divulgazione"},{"k":"p","t":"GRI Standards (riferimento volontario per struttura reporting)"},{"k":"p","t":"D.Lgs. 254/2016 – Dichiarazione non finanziaria (se applicabile)"},{"k":"p","t":"Reg. UE 2016/679 (GDPR) – Protezione dati nel reporting"},{"k":"p","t":"PRO-04 Gestione della Politica, PRO-05 Valutazione Rischi, PRO-09 Gestione Documentale"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Report pubblico SA8000","Pubblicazione periodica che descrive i processi e i risultati dell’Organizzazione pertinenti allo Standard, destinata a lavoratori, stakeholder e pubblico."],["Integrità","Coerenza tra impegni dichiarati, comunicazioni e comportamenti effettivi dell’Organizzazione nel rispetto dello Standard SA8000:2026."],["Terza parte autorizzata","Ente di certificazione accreditato, auditor SA8000, Social Accountability International (SAI) o loro rappresentanti."],["Comunicazione pubblica","Qualsiasi comunicazione dell’Organizzazione accessibile al pubblico esterno: report, sito web, social media, comunicati stampa, risposte a stakeholder."]]},{"k":"p","t":"3. RESPONSABILITÀ (MATRICE RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","HR","Comunic.","Legale"],["Integrità comunicazioni M8.1","A","R","C","R","C"],["Pianificazione report M8.2","A","R","C","R","I"],["Redazione report pubblico","I","R","C","R","C"],["Consultazione stakeholder","I","R","I","C","I"],["Approvazione e pubblicazione","A","R","C","I","R","C"],["Gestione terze parti M8.3","A","R","C","I","C"],["Monitoraggio coerenza M8.1","I","R","I","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Integrità (M8.1)"},{"k":"p","t":"L’Organizzazione garantisce l’integrità delle proprie comunicazioni attraverso:"},{"k":"p","t":"Coerenza: ogni comunicazione pubblica (sito web, social media, comunicati, brochure, materiale di marketing) è coerente con gli impegni di politica SA8000 e con le prestazioni effettive."},{"k":"p","t":"Veridicità: nessuna affermazione fuorviante, esagerata o non supportata da evidenze è utilizzata nelle comunicazioni relative alle prestazioni di lavoro dignitoso."},{"k":"p","t":"Verifica periodica: il Resp. SA, in coordinamento con la funzione Comunicazione, effettua una verifica annuale di tutte le comunicazioni pubbliche per assicurare la coerenza con le prestazioni effettive e la politica SA8000. Le eventuali incoerenze sono corrette tempestivamente."},{"k":"p","t":"Monitoraggio SPT: l’SPT può segnalare al Resp. SA qualsiasi comunicazione che ritenga incoerente con le condizioni reali di lavoro."},{"k":"p","t":"Anti-greenwashing: l’Organizzazione non utilizza la certificazione SA8000 o il reporting sociale come strumento di marketing ingannevole. Le comunicazioni riflettono sia i progressi sia le aree di miglioramento."},{"k":"p","t":"4.2 Report pubblico (M8.2)"},{"k":"p","t":"a) Pianificazione"},{"k":"p","t":"Frequenza: il report pubblico SA8000 è pubblicato almeno annualmente, entro 6 mesi dalla chiusura del periodo di riferimento."},{"k":"p","t":"Contenuto: il report copre tutte le operazioni dell’Organizzazione e le relazioni commerciali significative."},{"k":"p","t":"Consultazione: prima della finalizzazione, il report è sottoposto a consultazione di lavoratori (tramite SPT), OO.SS. e stakeholder prioritari per assicurare che risponda alle loro esigenze (M8.2b)."},{"k":"p","t":"b) Contenuto minimo obbligatorio"},{"k":"p","t":"Il report pubblico include almeno:"},{"k":"t","r":[["M8.2","Requisito","Contenuto specifico"],["a","Trasparente, veritiero e chiaro","Linguaggio accessibile; dati verificabili; presentazione equilibrata di progressi e sfide; nessuna omissione significativa"],["b","Rispondente alle esigenze degli stakeholder","Temi prioritari identificati con stakeholder; feedback ricevuto e come è stato considerato; canali di coinvolgimento descritti"],["c","Inclusivo dell’impegno di politica","Testo integrale della politica SA8000; politica aspettative reciproche per BP"],["d","Descrittivo delle operazioni","Descrizione attività, settore, sedi, dimensioni, forza lavoro, struttura catena del valore, BP principali"],["e","Informativo sui rischi","Rischi prioritari identificati per D1–D7; azioni intraprese per prevenire, mitigare, rimediare; risultati ottenuti; indicatori chiave"],["f","Disponibile e accessibile","Pubblicazione su sito web; copie su richiesta; versioni in lingue rilevanti per il personale; formato accessibile"]]},{"k":"p","t":"c) Redazione e approvazione"},{"k":"p","t":"Il Resp. SA coordina la raccolta dati da tutte le funzioni e la redazione del report, avvalendosi della funzione Comunicazione."},{"k":"p","t":"L’SPT e le OO.SS. sono consultati sulla bozza e possono proporre integrazioni o correzioni."},{"k":"p","t":"Il report è approvato dall’Alta Direzione prima della pubblicazione."},{"k":"p","t":"La versione approvata è registrata nel sistema documentale (PRO-09) e conservata per almeno 5 anni."},{"k":"p","t":"d) Pubblicazione e diffusione"},{"k":"p","t":"Il report è pubblicato sul sito web dell’Organizzazione in area accessibile senza restrizioni."},{"k":"p","t":"Copie cartacee o digitali sono messe a disposizione del personale in aree comuni e su richiesta."},{"k":"p","t":"Gli stakeholder prioritari ricevono comunicazione della pubblicazione."},{"k":"p","t":"Il report è trasmesso all’ente di certificazione e a SAI se richiesto."},{"k":"p","t":"4.3 Trasparenza con terze parti autorizzate (M8.3)"},{"k":"p","t":"L’Organizzazione garantisce piena trasparenza e collaborazione con le terze parti autorizzate:"},{"k":"p","t":"Accesso alla documentazione: tutti i documenti e le registrazioni del sistema di gestione sono messi a disposizione degli auditor e di SAI su richiesta, senza ritardi o restrizioni ingiustificate."},{"k":"p","t":"Accesso alle persone: gli auditor possono condurre interviste riservate con qualsiasi membro del personale, inclusi lavoratori, rappresentanti sindacali, membri dell’SPT, management. L’Organizzazione facilita tali interviste garantendo assenza di ritorsioni."},{"k":"p","t":"Accesso agli ambienti: gli auditor possono visitare tutti gli ambienti di lavoro, inclusi alloggi, mense, aree produttive, magazzini, uffici, senza preavviso durante l’orario lavorativo."},{"k":"p","t":"Collaborazione attiva: l’Organizzazione fornisce informazioni aggiuntive richieste, facilita i contatti con BP ove necessario e non ostacola in alcun modo le attività di audit."},{"k":"p","t":"Non interferenza: il personale non è istruito, minacciato o incentivato a fornire risposte predeterminate durante le interviste di audit."},{"k":"p","t":"Risposta alle osservazioni: le osservazioni e le NC dell’audit ricevono risposta documentata con piano d’azione e tempistiche, in coordinamento con PRO-14 Azioni Correttive."},{"k":"p","t":"4.4 Flusso operativo"},{"k":"t","r":[["#","Fase","Attività chiave","Responsabile","Tempistica"],["1","Pianificazione annuale","Definizione perimetro, calendario, responsabilità raccolta dati","Resp. SA","Gennaio"],["2","Raccolta dati","Richiesta KPI a tutte le funzioni; raccolta indicatori D1–D7, M1–M10","Resp. SA / Funzioni","Gen–Mar"],["3","Redazione bozza","Stesura report secondo template; inclusione politica, rischi, azioni, risultati","Resp. SA / Comunic.","Mar–Apr"],["4","Consultazione","Presentazione bozza a SPT, OO.SS., stakeholder; raccolta feedback","Resp. SA / SPT","Apr–Mag"],["5","Finalizzazione","Integrazione feedback; verifica coerenza e completezza; revisione legale","Resp. SA / Legale","Maggio"],["6","Approvazione","Approvazione AD; registrazione in sistema documentale","AD","Giugno"],["7","Pubblicazione","Pubblicazione su sito web; distribuzione a personale e stakeholder","Comunic. / IT","Entro 30/06"],["8","Verifica integrità","Audit annuale comunicazioni pubbliche vs. prestazioni effettive","Resp. SA / SPT","Continuo"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Report pubblico SA8000 pubblicato entro la scadenza prevista","Sito web","Annuale","Sì (entro 30/06)"],["% requisiti M8.2 (a–f) coperti nel report","Report / audit","Annuale","100%"],["N. stakeholder consultati prima della pubblicazione","Verbale consult.","Annuale","≥ 3 categorie"],["N. incoerenze riscontrate nelle comunicazioni pubbliche","Audit M8.1","Annuale","0"],["Tempo medio di risposta a richieste informative di terze parti autorizzate (giorni)","Log richieste","Per evento","≤ 5 giorni lav."],["% osservazioni/NC di audit con piano d’azione entro 30 giorni","Report audit","Per audit","100%"],["Report disponibile sul sito web e in lingue rilevanti per il personale","Sito web","Annuale","Sì"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"p","t":"6.1 Moduli e allegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-10.01","Template Report Pubblico SA8000","Modello strutturato per la redazione del report annuale: sezioni obbligatorie M8.2 a–f, tabelle KPI, spazio consultazione stakeholder"],["MOD-10.02","Checklist Integrità Comunicazioni","Checklist annuale per la verifica di coerenza tra comunicazioni pubbliche e prestazioni effettive M8.1"],["MOD-10.03","Registro Interazioni Terze Parti","Registro richieste e interazioni con auditor, SAI, enti di certificazione: data, richiedente, oggetto, documentazione fornita, esito M8.3"],["MOD-10.04","Verbale Consultazione Stakeholder per Report","Registrazione delle consultazioni con SPT, OO.SS. e stakeholder sulla bozza del report: partecipanti, feedback, integrazioni"]]},{"k":"p","t":"6.2 Coordinamento"},{"k":"p","t":"PRO-01 Riesame della Direzione: il report pubblico è input al riesame."},{"k":"p","t":"PRO-03 Engagement Stakeholder: consultazione stakeholder per il report."},{"k":"p","t":"PRO-04 Gestione della Politica: inclusione della politica nel report."},{"k":"p","t":"PRO-05 Valutazione Rischi: i rischi prioritari sono descritti nel report."},{"k":"p","t":"PRO-09 Gestione Documentale: archiviazione del report e dei materiali di consultazione."},{"k":"p","t":"PRO-11 Monitoraggio e Audit: dati di monitoraggio alimentano il report; gestione audit M8.3."},{"k":"p","t":"PRO-14 Azioni Correttive: risposta a osservazioni/NC di audit terze parti."}]},"PRO-11":{"code":"PRO-11","blocks":[{"k":"t","r":[["PROCEDURA PRO-11"],["Codice:","PRO-11","Revisione:","01"],["Titolo:","MONITORAGGIO E AUDIT INTERNO"],["Criteri SA8000:","M9.1–9.2","Data:","[GG/MM/AAAA]"],["Redatto da:","[Resp. SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità per il monitoraggio continuo delle prestazioni e l’esecuzione degli audit interni SA8000:2026, assicurando la valutazione dell’attuazione delle azioni pianificate (M9.1a), l’aderenza allo Standard (M9.1b), le prestazioni dei BP (M9.1c) e la documentazione adeguata (M9.1d)."},{"k":"p","t":"1.1 Criteri coperti"},{"k":"t","r":[["Criterio","Requisito"],["M9.1a","Monitoraggio dell’attuazione delle azioni pianificate"],["M9.1b","Monitoraggio dell’aderenza allo Standard"],["M9.1c","Monitoraggio delle prestazioni dei BP"],["M9.1d","Monitoraggio adeguatamente documentato"],["M9.2","Fonti informative multiple: valutazione rischi, indicatori, reclami, comunicazione lavoratori/stakeholder, dialogo sociale, fonti pubbliche, audit, esperti"]]},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"SA8000:2026 – M9.1–9.2; Indicator Library M9"},{"k":"p","t":"UNI EN ISO 19011:2018 – Linee guida per gli audit (riferimento)"},{"k":"p","t":"PRO-05 Valutazione Rischi, PRO-06 Obiettivi, PRO-08 Gestione BP, PRO-09 Gestione Documentale, PRO-12/13 Reclami, PRO-14 Azioni Correttive"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Monitoraggio","Attività sistematica e continuativa di raccolta, analisi e valutazione di dati e informazioni per verificare l’attuazione delle azioni e l’aderenza allo Standard."],["Audit interno","Processo sistematico, indipendente e documentato per ottenere evidenze e valutare in modo oggettivo la conformità del sistema di gestione ai criteri SA8000:2026."],["Fonti informative","Insieme di canali e strumenti da cui l’Organizzazione raccoglie informazioni: indicatori, reclami, survey, dialogo sociale, audit, fonti pubbliche, esperti (M9.2)."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","HR","Funz.","Auditor"],["Piano monitoraggio annuale","A","R","C","I"],["Raccolta indicatori e dati","I","R","I"],["Pianificazione ed esecuzione audit","I","A","C","R"],["Analisi risultati e reporting","I","R","C","I","R"],["Attivazione AC da monitoraggio","A","R","C","R","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Piano di monitoraggio annuale"},{"k":"p","t":"Il Resp. SA predispone entro gennaio il piano annuale di monitoraggio che include: indicatori da monitorare per ogni criterio D1–D7 e M1–M10, frequenza di raccolta, fonti dati, responsabili, criteri di allarme."},{"k":"p","t":"Il piano integra le fonti informative multiple previste dal M9.2: dati dalla valutazione rischi (PRO-05), indicatori e metriche, meccanismi di reclamo (PRO-12/13), comunicazioni lavoratori e stakeholder, dialogo sociale, fonti pubbliche, audit interni ed esterni, esperti."},{"k":"p","t":"Il piano copre anche il monitoraggio delle prestazioni dei BP (M9.1c), in coordinamento con PRO-08 Gestione BP."},{"k":"p","t":"4.2 Monitoraggio continuo"},{"k":"p","t":"Raccolta dati periodica secondo il piano: KPI trimestrali, survey semestrali, monitoraggio continuo reclami e segnalazioni."},{"k":"p","t":"Dashboard di monitoraggio aggiornata dal Resp. SA con indicatori semaforo (verde/giallo/rosso) per tutti i criteri."},{"k":"p","t":"Analisi trimestrale dei trend con confronto obiettivi (PRO-06) e valori target."},{"k":"p","t":"Segnalazione tempestiva al management e all’SPT di scostamenti significativi o segnali di allarme."},{"k":"p","t":"4.3 Audit interni"},{"k":"p","t":"Programma audit: almeno un ciclo completo annuale che copra tutti i criteri SA8000:2026 (M1–M10, D1–D7). Audit supplementari per aree ad alto rischio o a seguito di NC significative."},{"k":"p","t":"Competenza auditor: auditor interni qualificati, indipendenti dall’area auditata, con formazione specifica SA8000:2026. Registro competenze nel MOD-11.01."},{"k":"p","t":"Esecuzione: apertura con incontro introduttivo; raccolta evidenze (documenti, interviste, osservazioni); chiusura con presentazione risultati; report audit con NC, osservazioni, buone pratiche."},{"k":"p","t":"Interviste riservate: gli auditor possono condurre interviste private con qualsiasi lavoratore, senza presenza del management, garantendo riservatezza e assenza di ritorsioni."},{"k":"p","t":"Report: ogni audit genera un report strutturato (MOD-11.02) con NC classificate (maggiori/minori), osservazioni, opportunità di miglioramento, buone pratiche. Il report è trasmesso al management, all’SPT e alimenta PRO-14 Azioni Correttive."},{"k":"p","t":"4.4 Monitoraggio BP (M9.1c)"},{"k":"p","t":"Integrazione nel piano di monitoraggio dei risultati delle valutazioni BP (PRO-08): checklist compilate, risultati audit BP, NC rilevate, piani d’azione in corso."},{"k":"p","t":"Verifica semestrale dello stato di avanzamento delle AC richieste ai BP."},{"k":"p","t":"Aggiornamento del profilo di rischio BP a seguito dei risultati del monitoraggio."},{"k":"p","t":"4.5 Documentazione (M9.1d)"},{"k":"p","t":"Tutti i risultati del monitoraggio sono documentati: dashboard, report trimestrali, report audit, verbali di analisi. Archiviazione secondo PRO-09 Gestione Documentale."},{"k":"p","t":"I risultati alimentano: PRO-01 Riesame Direzione, PRO-05 aggiornamento rischi, PRO-06 obiettivi, PRO-14 azioni correttive, PRO-15 miglioramento continuo."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["% criteri SA8000 coperti dal ciclo audit annuale","Piano audit","Annuale","100%"],["N. audit interni eseguiti vs. pianificati","Piano/report","Annuale","100%"],["N. NC rilevate per gravità (maggiori/minori)","Report audit","Annuale","Monitoraggio"],["% NC chiuse entro le tempistiche previste","Registro AC","Annuale","≥ 90%"],["N. fonti informative integrate nel monitoraggio (M9.2)","Piano monit.","Annuale","≥ 6 su 8 tipologie"],["% BP monitorati nell’anno","Registro BP","Annuale","≥ 90%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-11.01","Piano e Registro Audit Interni","Programma audit annuale, registro auditor qualificati, calendario, stato esecuzione, copertura criteri"],["MOD-11.02","Report Audit Interno","Report strutturato: ambito, evidenze, NC (maggiori/minori), osservazioni, buone pratiche, raccomandazioni"],["MOD-11.03","Dashboard Monitoraggio SA8000","Cruscotto indicatori con semaforo, trend, confronto target, alert per tutti i criteri M e D"],["MOD-11.04","Report Trimestrale Monitoraggio","Sintesi trimestrale dei dati di monitoraggio: indicatori, trend, scostamenti, azioni attivate"]]}]},"PRO-12":{"code":"PRO-12","blocks":[{"k":"t","r":[["PROCEDURA PRO-12"],["Codice:","PRO-12","Revisione:","01"],["Titolo:","MECCANISMO DI RECLAMO INTERNO"],["Criteri SA8000:","M9.3","Data:","[GG/MM/AAAA]"],["Redatto da:","[Resp. SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità per l’istituzione e la gestione del meccanismo di reclamo a disposizione del personale interno, in conformità al criterio M9.3 dello Standard SA8000:2026."},{"k":"p","t":"Il meccanismo garantisce le caratteristiche previste dallo Standard:"},{"k":"p","t":"Legittimo: basato su governance chiara e strutture trasparenti (M9.3a)."},{"k":"p","t":"Accessibile: noto a tutti, senza barriere linguistiche, tecnologiche o fisiche (M9.3b)."},{"k":"p","t":"Prevedibile: tempistiche chiare per ogni fase, procedure note (M9.3c)."},{"k":"p","t":"Equo: accesso ragionevole a fonti informative, consulenza e competenze (M9.3d)."},{"k":"p","t":"Trasparente: informazione sullo stato della segnalazione (M9.3e)."},{"k":"p","t":"Basato sul dialogo: ricerca del rimedio attraverso il dialogo (M9.3f)."},{"k":"p","t":"Compatibile con i diritti: esiti e rimedi conformi ai diritti umani (M9.3g)."},{"k":"p","t":"Fonte di miglioramento continuo: lezioni apprese integrabili nel sistema (M9.3h)."},{"k":"p","t":"Il meccanismo garantisce riservatezza, assenza di ritorsioni e nessuna perdita di retribuzione per la partecipazione."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"SA8000:2026 – M9.3; Indicator Library M9"},{"k":"p","t":"UNGPs – Principi 29–31 (Meccanismi di reclamo non giudiziari)"},{"k":"p","t":"ILO C190 – Violenza e molestie nel mondo del lavoro"},{"k":"p","t":"D.Lgs. 24/2023 – Whistleblowing"},{"k":"p","t":"L. 300/1970 – Statuto dei Lavoratori"},{"k":"p","t":"PRO-11 Monitoraggio, PRO-13 Reclamo Esterno, PRO-14 Azioni Correttive, PRO-18 Reclutamento (D3.7 molestie), PRO-20 Non Discriminazione"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Reclamo","Comunicazione formale o informale da parte del personale che segnala una violazione reale o percepita dei diritti previsti dallo Standard SA8000:2026, dalla legge o dal CCNL."],["Segnalazione anonima","Reclamo in cui l’identità del segnalante non è nota al ricevente. L’Organizzazione accetta e indaga le segnalazioni anonime."],["Ritorsione","Qualsiasi azione negativa (disciplinare, demansionamento, trasferimento, mancata promozione, mobbing, ecc.) motivata dalla presentazione di un reclamo o dalla partecipazione a un’indagine."],["Rimedio","Azione intrapresa per riparare l’impatto negativo subito dal segnalante o da altri soggetti coinvolti, proporzionata alla gravità della violazione."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","HR","OO.SS."],["Progettazione meccanismo","A","R","C"],["Ricezione e registrazione reclami","I","R","C","I"],["Indagine","I","R","C","R","C"],["Determinazione rimedio","A","R","C","R","C"],["Protezione anti-ritorsione","A","R","C"],["Monitoraggio e miglioramento","I","R","I","C"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Canali di segnalazione"},{"k":"p","t":"Cassetta fisica: posizionata in area accessibile e riservata, svuotata settimanalmente dal Resp. SA o membro SPT."},{"k":"p","t":"Email dedicata: indirizzo specifico (es. reclami.sa8000@[org].it), gestito dal Resp. SA con accesso limitato."},{"k":"p","t":"Piattaforma digitale: modulo online (anche da smartphone) con opzione di anonimato."},{"k":"p","t":"Segnalazione verbale: a qualsiasi membro dell’SPT, al Resp. SA, al rappresentante sindacale o al management diretto. Il ricevente formalizza la segnalazione nel registro."},{"k":"p","t":"Linea telefonica: numero dedicato con segreteria, accessibile 24h."},{"k":"p","t":"I canali sono comunicati a tutto il personale durante l’onboarding e affissi in lingue comprensibili nelle aree comuni."},{"k":"p","t":"4.2 Ricezione, registrazione e classificazione"},{"k":"p","t":"Ogni reclamo è registrato nel MOD-12.01 Registro Reclami Interni entro 3 giorni lavorativi dalla ricezione: data, canale, oggetto, criterio SA8000 coinvolto, gravità preliminare."},{"k":"p","t":"Classificazione: gravità alta (rischio imminente per salute, sicurezza o libertà della persona), media (violazione non imminente ma significativa), bassa (osservazione, disagio, proposta di miglioramento)."},{"k":"p","t":"Comunicazione al segnalante (se non anonimo): entro 5 giorni lavorativi conferma di ricezione e tempistiche previste (M9.3c)."},{"k":"p","t":"4.3 Indagine"},{"k":"p","t":"L’indagine è condotta dal Resp. SA (o HR se il reclamo coinvolge il Resp. SA), con il supporto dell’SPT."},{"k":"p","t":"Tempistiche: avvio entro 7 giorni; conclusione entro 30 giorni (gravità media/bassa) o 15 giorni (gravità alta). Proroghe motivate e comunicate."},{"k":"p","t":"Metodologia: raccolta documenti, interviste riservate, osservazioni, consultazione esperti se necessario."},{"k":"p","t":"Garanzie: riservatezza delle identità; accesso equo a informazioni e consulenza (M9.3d); separazione tra funzione indagante e oggetto dell’indagine."},{"k":"p","t":"4.4 Determinazione del rimedio"},{"k":"p","t":"Sulla base delle evidenze, il Resp. SA propone il rimedio in consultazione con SPT e OO.SS."},{"k":"p","t":"Il rimedio è compatibile con i diritti umani (M9.3g): può includere scuse, compensazione, modifica delle condizioni, azione disciplinare verso il responsabile, prevenzione della ricorrenza."},{"k":"p","t":"Il segnalante è informato dell’esito e del rimedio proposto (M9.3e). Se non soddisfatto, può richiedere la revisione o ricorrere al meccanismo esterno (PRO-13)."},{"k":"p","t":"Se il reclamo rivela una NC di sistema, si attiva PRO-14 Azioni Correttive per l’analisi delle cause radice e la prevenzione."},{"k":"p","t":"4.5 Protezione anti-ritorsione"},{"k":"p","t":"Divieto assoluto di ritorsione verso chiunque presenti un reclamo, fornisca informazioni o partecipi a un’indagine."},{"k":"p","t":"Monitoraggio attivo delle condizioni del segnalante per 12 mesi dopo la segnalazione: eventuali cambiamenti negativi sono indagati."},{"k":"p","t":"Sanzioni disciplinari per chiunque attui ritorsioni, in coordinamento con PRO-18 D3.7–3.8."},{"k":"p","t":"Nessuna perdita di retribuzione per il tempo dedicato alla partecipazione al processo di reclamo."},{"k":"p","t":"4.6 Miglioramento continuo (M9.3h)"},{"k":"p","t":"Analisi aggregata semestrale dei reclami: tipologia, area, gravità, tempi di chiusura, efficacia dei rimedi."},{"k":"p","t":"Lezioni apprese integrate nella valutazione rischi (PRO-05), negli obiettivi (PRO-06) e nel riesame della direzione (PRO-01)."},{"k":"p","t":"L’SPT valuta periodicamente l’efficacia del meccanismo tramite survey di fiducia del personale."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["N. reclami interni ricevuti per tipologia e gravità","MOD-12.01","Semestrale","Monitoraggio"],["% reclami con conferma ricezione entro 5 giorni","MOD-12.01","Semestrale","100%"],["% reclami chiusi entro le tempistiche previste","MOD-12.01","Semestrale","≥ 90%"],["% personale che dichiara di conoscere il meccanismo","Survey","Annuale","≥ 90%"],["% personale che dichiara fiducia nel meccanismo","Survey","Annuale","≥ 80%"],["N. casi di ritorsione accertati","Indagini","Annuale","0"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-12.01","Registro Reclami Interni","Registro di tutte le segnalazioni: data, canale, oggetto, criterio, gravità, stato indagine, rimedio, chiusura, feedback segnalante"],["MOD-12.02","Modulo Segnalazione Interna","Modulo compilabile dal personale (anche anonimo): descrizione, data, area, richiesta, consenso trattamento dati"],["MOD-12.03","Report Indagine Reclamo","Report strutturato dell’indagine: evidenze, conclusioni, rimedio proposto, AC attivate, comunicazione al segnalante"],["MOD-12.04","Report Semestrale Reclami","Analisi aggregata: distribuzione per tipologia/area/gravità, tempi medi, efficacia rimedi, lezioni apprese, input RdD"]]}]},"PRO-13":{"code":"PRO-13","blocks":[{"k":"t","r":[["PROCEDURA PRO-13"],["Codice:","PRO-13","Revisione:","01"],["Titolo:","MECCANISMO DI RECLAMO ESTERNO"],["Criteri SA8000:","M9.4–9.5","Data:","[GG/MM/AAAA]"],["Redatto da:","[Resp. SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità per l’istituzione e la gestione del meccanismo di reclamo per stakeholder esterni e per l’interazione con processi di reclamo e rimedio esterni, in conformità ai criteri M9.4–9.5 dello Standard SA8000:2026."},{"k":"p","t":"Il meccanismo esterno possiede le medesime caratteristiche del meccanismo interno (legittimo, accessibile, prevedibile, equo, trasparente, basato sul dialogo, compatibile con i diritti, fonte di miglioramento). Garantisce riservatezza e assenza di ritorsioni."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"SA8000:2026 – M9.4–9.5; Indicator Library M9"},{"k":"p","t":"UNGPs – Principi 25–31"},{"k":"p","t":"D.Lgs. 24/2023 Whistleblowing, PRO-12 Reclamo Interno, PRO-14 Azioni Correttive, PRO-03 Engagement Stakeholder"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Reclamo esterno","Segnalazione da parte di stakeholder esterni (comunità, ONG, fornitori, clienti, ex-lavoratori, familiari) relativa a impatti negativi causati, a cui contribuisce o a cui è collegata l’Organizzazione."],["Processo esterno","Meccanismo di reclamo e rimedio gestito da terze parti (ente certificazione, SAI, autorità giudiziaria, mediatore, organismo paritetico, National Contact Point OCSE) a cui l’Organizzazione è chiamata a partecipare (M9.5)."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","Legale","Comunic."],["Progettazione meccanismo esterno","A","R","C"],["Ricezione e gestione reclami esterni","I","R","C","I"],["Partecipazione processi esterni M9.5","A","R","C","R","C"],["Comunicazione pubblica sugli esiti","A","R","C","R"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Canali per stakeholder esterni"},{"k":"p","t":"Pagina dedicata sul sito web con modulo di segnalazione e informativa sulla procedura."},{"k":"p","t":"Email dedicata pubblicata e accessibile."},{"k":"p","t":"Indirizzo postale per segnalazioni scritte."},{"k":"p","t":"I canali sono comunicati anche ai BP nella Politica Aspettative Reciproche (PRO-04)."},{"k":"p","t":"4.2 Gestione reclami esterni"},{"k":"p","t":"Registrazione nel MOD-13.01 Registro Reclami Esterni entro 3 giorni lavorativi."},{"k":"p","t":"Conferma ricezione al segnalante entro 7 giorni lavorativi."},{"k":"p","t":"Indagine condotta con le stesse garanzie del meccanismo interno: riservatezza, imparzialità, tempistiche (max 45 giorni)."},{"k":"p","t":"Comunicazione esito al segnalante; se insoddisfatto, informazione sulle opzioni di ricorso (SAI, autorità giudiziaria, NCP OCSE)."},{"k":"p","t":"4.3 Interazione con processi esterni (M9.5)"},{"k":"p","t":"L’Organizzazione si impegna in buona fede con qualsiasi processo esterno di reclamo e rimedio relativo a impatti a cui è coinvolta."},{"k":"p","t":"Piena collaborazione con auditor SA8000, SAI, autorità giudiziarie, organismi di mediazione, NCP OCSE."},{"k":"p","t":"Nomina di un referente (Resp. SA o Legale) per ogni processo esterno attivo; documentazione di tutte le interazioni nel MOD-13.02."},{"k":"p","t":"Le decisioni o raccomandazioni dei processi esterni sono valutate e implementate in buona fede, attivando PRO-14 Azioni Correttive ove necessario."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["N. reclami esterni ricevuti per tipologia","MOD-13.01","Annuale","Monitoraggio"],["% reclami esterni con conferma ricezione entro 7 gg","MOD-13.01","Annuale","100%"],["% reclami esterni chiusi entro 45 giorni","MOD-13.01","Annuale","≥ 85%"],["N. processi esterni attivi e stato (M9.5)","MOD-13.02","Annuale","Monitoraggio"],["Meccanismo esterno accessibile su sito web","Sito web","Annuale","Sì"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-13.01","Registro Reclami Esterni","Registro segnalazioni esterne: data, stakeholder, oggetto, criterio, gravità, stato, rimedio, chiusura"],["MOD-13.02","Registro Processi Esterni","Registro interazioni con processi esterni M9.5: organismo, oggetto, referente, stato, azioni, esito"],["MOD-13.03","Modulo Reclamo Esterno","Modulo compilabile da stakeholder esterni (anche online): descrizione, evidenze, richiesta, consenso trattamento dati"]]}]},"PRO-14":{"code":"PRO-14","blocks":[{"k":"t","r":[["PROCEDURA PRO-14"],["Codice:","PRO-14","Revisione:","01"],["Titolo:","AZIONI CORRETTIVE E RIMEDIO"],["Criteri SA8000:","M9.6, M6.2","Data:","[GG/MM/AAAA]"],["Redatto da:","[Resp. SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità per la gestione delle azioni correttive, preventive e di rimedio derivanti dal monitoraggio, dagli audit e dai meccanismi di reclamo, in conformità ai criteri M9.6 e M6.2–6.3 dello Standard SA8000:2026."},{"k":"p","t":"Le azioni sono finalizzate a: porre fine agli impatti negativi; prevenire impatti futuri; mitigare i rischi; garantire il rimedio ai soggetti impattati. Per i rischi a cui l’Organizzazione è collegata (M6.3), collabora con stakeholder e usa la propria leva per influenzare i BP."},{"k":"p","t":"1.2 Criteri coperti"},{"k":"t","r":[["Criterio","Requisito"],["M9.6","I risultati del monitoraggio e dei reclami portano ad azioni per: cessare, prevenire, mitigare, rimediare"],["M6.2","Pianificazione azioni per rischi causati o a cui contribuisce l’Organizzazione"],["M6.3","Pianificazione azioni per rischi collegati: collaborazione con stakeholder, uso della leva"]]},{"k":"p","t":"1.3 Riferimenti"},{"k":"p","t":"SA8000:2026 – M9.6, M6.2–6.3; Indicator Library M6, M9"},{"k":"p","t":"UNGPs – Principi 22, 29–31 (Rimedio)"},{"k":"p","t":"PRO-05 Rischi, PRO-06 Obiettivi, PRO-08 BP, PRO-11 Monitoraggio, PRO-12/13 Reclami, PRO-15 MC"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Azione correttiva (AC)","Azione intrapresa per eliminare la causa di una NC rilevata o altra situazione indesiderabile, al fine di prevenirne la ricorrenza."],["Azione preventiva (AP)","Azione intrapresa per eliminare la causa di una NC potenziale o altra situazione potenzialmente indesiderabile, al fine di prevenirne l’occorrenza."],["Rimedio","Processo e risultato che ripara l’impatto negativo subito dalle persone coinvolte. Può includere: scuse, restituzione, riabilitazione, compensazione finanziaria e non finanziaria, sanzioni, garanzie di non ripetizione."],["NC (Non conformità)","Mancato soddisfacimento di un requisito dello Standard SA8000:2026, della legislazione applicabile o del sistema di gestione dell’Organizzazione."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","Funz. resp.","OO.SS."],["Identificazione NC/impatto","I","R","C"],["Analisi cause radice","I","R","C","R","C"],["Definizione AC/AP/rimedio","A","R","C","R","C"],["Attuazione","I","R/C","I","R","I"],["Verifica efficacia","I","R","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Fonti di attivazione"},{"k":"p","t":"Risultati del monitoraggio e degli audit interni/esterni (PRO-11)."},{"k":"p","t":"Reclami interni ed esterni (PRO-12, PRO-13)."},{"k":"p","t":"Valutazione dei rischi e aggiornamenti (PRO-05)."},{"k":"p","t":"Segnalazioni del personale, dell’SPT, delle OO.SS. o degli stakeholder."},{"k":"p","t":"Osservazioni dell’ente di certificazione o di SAI."},{"k":"p","t":"Cambiamenti normativi, organizzativi o di contesto."},{"k":"p","t":"4.2 Gestione delle azioni"},{"k":"p","t":"Registrazione: ogni NC/impatto è registrato nel MOD-14.01 Registro AC/AP/Rimedi con: descrizione, criterio SA8000, fonte, gravità, data."},{"k":"p","t":"Contenimento immediato: per NC gravi o impatti in corso, azioni immediate per arrestare l’impatto (es. sospensione attività, protezione della persona, misure cautelari)."},{"k":"p","t":"Analisi cause radice: metodologia strutturata (5 Perché, Ishikawa, albero delle cause) considerando cause di sistema, operative e esterne (allineamento M5.4)."},{"k":"p","t":"Definizione AC/AP: per ogni causa radice, definizione dell’azione con responsabile, risorse, tempistiche, indicatore di efficacia."},{"k":"p","t":"Rimedio: determinazione del rimedio appropriato per i soggetti impattati, in consultazione con SPT, OO.SS. e, ove possibile, con i soggetti stessi."},{"k":"p","t":"Attuazione e monitoraggio: la funzione responsabile attua l’azione; il Resp. SA monitora l’avanzamento secondo le tempistiche previste."},{"k":"p","t":"Verifica efficacia: a chiusura dell’azione, il Resp. SA verifica che la causa radice sia stata eliminata e che l’impatto non si sia ripetuto. Periodo di osservazione: almeno 3 mesi."},{"k":"p","t":"4.3 Azioni per rischi nella catena (M6.3)"},{"k":"p","t":"Per i rischi a cui l’Organizzazione è collegata tramite BP: utilizzo della leva commerciale per influenzare il BP (richiesta piano AC, supporto tecnico, condizioni commerciali incentivanti)."},{"k":"p","t":"Collaborazione con stakeholder: partecipazione a iniziative settoriali, accordi vincolanti, dialogo sociale per affrontare cause sistemiche."},{"k":"p","t":"Disimpegno responsabile: solo come ultima risorsa, dopo che supporto e engagement hanno fallito e dopo aver valutato i rischi della cessazione del rapporto (PRO-08)."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["N. AC/AP aperte e chiuse nel periodo","MOD-14.01","Semestrale","Monitoraggio"],["% AC chiuse entro le tempistiche previste","MOD-14.01","Semestrale","≥ 90%"],["% AC con verifica efficacia positiva","MOD-14.01","Annuale","≥ 85%"],["N. rimedi determinati e attuati","MOD-14.01","Annuale","Monitoraggio"],["% NC ricorrenti (stessa causa radice)","Analisi trend","Annuale","≤ 10%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-14.01","Registro AC/AP e Rimedi","Registro master: NC/impatto, criterio, fonte, gravità, causa radice, azione, responsabile, scadenza, stato, verifica efficacia, rimedio"],["MOD-14.02","Scheda Azione Correttiva","Scheda individuale per NC significative: descrizione, contenimento, analisi cause (5 Perché/Ishikawa), azioni, risorse, tempistica, verifica"],["MOD-14.03","Report Semestrale AC","Sintesi periodica: NC per criterio/area, tempi chiusura, efficacia, trend, rimedi, input al riesame"]]}]},"PRO-15":{"code":"PRO-15","blocks":[{"k":"t","r":[["PROCEDURA PRO-15"],["Codice:","PRO-15","Revisione:","01"],["Titolo:","MIGLIORAMENTO CONTINUO"],["Criteri SA8000:","M10.4, F1","Data:","[GG/MM/AAAA]"],["Redatto da:","[Resp. SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"Definisce le modalità per il perseguimento del miglioramento continuo delle prestazioni di lavoro dignitoso e del sistema di gestione, in conformità ai criteri M10.4 e F1 dello Standard SA8000:2026."},{"k":"p","t":"Il miglioramento continuo si realizza attraverso:"},{"k":"p","t":"L’affrontare continuamente i rischi a tutti i livelli di priorità (M10.4a)."},{"k":"p","t":"L’identificazione di opportunità per migliorare le condizioni di lavoro oltre i requisiti dello Standard (M10.4b)."},{"k":"p","t":"L’aumento del coinvolgimento di lavoratori e stakeholder (M10.4c)."},{"k":"p","t":"Il rispetto dei principi dello Standard e il perseguimento del miglioramento continuo (F1)."},{"k":"p","t":"1.2 Criteri coperti"},{"k":"t","r":[["Criterio","Requisito"],["M10.4a","Affrontare continuamente i rischi a tutti i livelli di priorità"],["M10.4b","Identificare opportunità per migliorare le condizioni di lavoro oltre i requisiti dello Standard"],["M10.4c","Aumentare il coinvolgimento di lavoratori e stakeholder"],["F1","Rispettare i principi dello Standard e perseguire il miglioramento continuo"]]},{"k":"p","t":"1.3 Riferimenti"},{"k":"p","t":"SA8000:2026 – M10.4, F1; Indicator Library M10"},{"k":"p","t":"Ciclo PDCA e metodologie Lean/Kaizen (riferimento di buona pratica)"},{"k":"p","t":"PRO-01 Riesame, PRO-05 Rischi, PRO-06 Obiettivi, PRO-11 Monitoraggio, PRO-14 Azioni Correttive"},{"k":"p","t":"2. DEFINIZIONI"},{"k":"t","r":[["Termine","Definizione"],["Miglioramento continuo","Processo ricorrente di potenziamento del sistema di gestione e delle prestazioni di lavoro dignitoso per ottenere risultati progressivamente migliori, anche oltre i requisiti minimi dello Standard."],["Opportunità di miglioramento","Situazione, pratica o iniziativa che, se implementata, potrebbe migliorare le condizioni di lavoro, il coinvolgimento o le prestazioni oltre i requisiti dello Standard SA8000:2026."],["Buona pratica","Approccio, metodo o iniziativa che ha prodotto risultati positivi dimostrabili e che può essere replicata o estesa ad altre aree dell’Organizzazione o della catena del valore."]]},{"k":"p","t":"3. RESPONSABILITÀ (RACI)"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","Funz.","OO.SS."],["Identificazione opportunità","I","R","C"],["Valutazione e prioritizzazione","A","R","C"],["Pianificazione e attuazione","A","R","C","R","I"],["Monitoraggio risultati","I","R","C","I"],["Diffusione buone pratiche","I","R","C","I"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Fonti del miglioramento"},{"k":"p","t":"Output del riesame della direzione (PRO-01): opportunità identificate, decisioni strategiche."},{"k":"p","t":"Risultati del monitoraggio e degli audit (PRO-11): buone pratiche, aree eccellenti, trend positivi."},{"k":"p","t":"Analisi dei reclami (PRO-12/13): lezioni apprese, cause sistemiche risolte."},{"k":"p","t":"Azioni correttive (PRO-14): AC efficaci che possono essere estese."},{"k":"p","t":"Suggerimenti del personale: raccolti tramite SPT, cassetta suggerimenti, survey, gruppi di lavoro."},{"k":"p","t":"Proposte degli stakeholder e delle OO.SS."},{"k":"p","t":"Benchmark settoriali e buone pratiche di altre organizzazioni."},{"k":"p","t":"Aggiornamenti dello Standard, Indicator Library e linee guida SAI."},{"k":"p","t":"4.2 Gestione delle opportunità di miglioramento"},{"k":"p","t":"Identificazione: chiunque nell’Organizzazione può proporre un’opportunità compilando il MOD-15.01 Registro Opportunità di Miglioramento o comunicandola all’SPT."},{"k":"p","t":"Valutazione: il Resp. SA, in consultazione con SPT, valuta la fattibilità, l’impatto atteso e le risorse necessarie."},{"k":"p","t":"Prioritizzazione: le opportunità sono prioritizzate in base a: impatto sulle condizioni di lavoro, allineamento con i rischi prioritari, risorse disponibili, contributo al coinvolgimento di lavoratori e stakeholder."},{"k":"p","t":"Integrazione negli obiettivi: le opportunità selezionate sono integrate nel piano degli obiettivi (PRO-06) con responsabile, tempistiche, indicatori di risultato."},{"k":"p","t":"Attuazione e monitoraggio: secondo le modalità di PRO-06 e PRO-11."},{"k":"p","t":"Verifica risultati e diffusione: i risultati positivi sono documentati come buone pratiche e diffusi nell’Organizzazione e, ove rilevante, condivisi con BP e stakeholder."},{"k":"p","t":"4.3 Miglioramento oltre lo Standard (M10.4b)"},{"k":"p","t":"L’Organizzazione non si limita alla conformità minima ma identifica attivamente opportunità per migliorare le condizioni di lavoro oltre i requisiti dello Standard. Esempi: benefit aggiuntivi, flessibilità oraria superiore al CCNL, programmi di benessere, formazione volontaria, supporto alla genitorialità, iniziative di comunità."},{"k":"p","t":"Le iniziative “oltre lo Standard” sono documentate nel report pubblico (PRO-10) e valorizzate nel riesame della direzione."},{"k":"p","t":"4.4 Coinvolgimento progressivo (M10.4c)"},{"k":"p","t":"L’Organizzazione aumenta progressivamente il coinvolgimento di lavoratori e stakeholder attraverso: ampliamento dei canali di comunicazione, aumento della frequenza delle consultazioni, inclusione di nuove categorie di personale nell’SPT, estensione dell’engagement a nuovi stakeholder."},{"k":"p","t":"Il livello di coinvolgimento è misurato annualmente e confrontato con l’anno precedente."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["N. opportunità di miglioramento identificate","MOD-15.01","Annuale","Trend ↑"],["N. opportunità implementate con risultato positivo","MOD-15.01","Annuale","Trend ↑"],["N. iniziative “oltre lo Standard” attive","Report","Annuale","≥ 2 nuove/anno"],["% lavoratori che percepiscono miglioramento condizioni vs. anno precedente","Survey","Annuale","≥ 70%"],["Livello di coinvolgimento lavoratori e stakeholder (indice)","Survey/dati","Annuale","Trend ↑ vs. anno prec."],["N. buone pratiche documentate e diffuse","MOD-15.02","Annuale","≥ 3/anno"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-15.01","Registro Opportunità di Miglioramento","Registro proposte: proponente, descrizione, valutazione fattibilità/impatto, priorità, stato, risultato, buona pratica Sì/No"],["MOD-15.02","Scheda Buona Pratica","Documentazione buone pratiche replicabili: contesto, descrizione, risultati, condizioni di successo, applicabilità ad altre aree/BP"],["MOD-15.03","Report Annuale Miglioramento Continuo","Sintesi annuale: opportunità, iniziative “oltr
