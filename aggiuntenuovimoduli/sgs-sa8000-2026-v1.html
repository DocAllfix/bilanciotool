contribuisce o a cui è direttamente collegata, con misure commisurate","Riferimento al registro rischi; proporzionalità delle misure alla gravità e probabilità"],["c)","Dare priorità a soluzioni preventive a breve e lungo termine","Approccio preventivo; gerarchia prevenzione > mitigazione > rimedio"],["d)","Comportarsi eticamente e con integrità","Codice etico; anti-corruzione; conflitti di interesse; trasparenza"],["e)","Mantenere sistemi di gestione integrati per la coerenza","Integrazione con sistemi H&S, qualità, ambiente, HR; coerenza tra politiche"],["f)","Consultare e rispondere alle aspettative di lavoratori e stakeholder, incluso il dialogo sociale","Impegno al coinvolgimento; SPT; libertà sindacale; contrattazione collettiva"],["g)","Considerare i rischi per il personale nella pianificazione aziendale e impegnarsi a mitigarne gli impatti","Valutazione d’impatto nelle decisioni; checkpoint nei piani aziendali"],["h)","Migliorare continuamente le prestazioni e i sistemi di gestione","Impegno al miglioramento continuo; obiettivi misurabili; riesame periodico"]]},{"k":"p","t":"4.1.2 Processo di redazione e aggiornamento"},{"k":"p","t":"Avvio della revisione: il Resp. SA avvia il processo di revisione almeno una volta all’anno o in occasione di: modifiche allo Standard, cambiamenti normativi, aggiornamento del registro rischi, risultati di audit, feedback significativi da lavoratori/stakeholder."},{"k":"p","t":"Bozza: il Resp. SA predispone la bozza aggiornata, verificando la copertura di tutti gli impegni M4.1 a–h tramite la Matrice di conformità (MOD-04.01)."},{"k":"p","t":"Consultazione: la bozza è sottoposta a consultazione dei lavoratori (tramite SPT, focus group, commenti), dei sindacati e degli stakeholder prioritari. I feedback e la loro considerazione sono documentati (MOD-04.02)."},{"k":"p","t":"Revisione interfunzionale: le funzioni chiave (HR, Legale, H&S, Produzione, Acquisti) riesaminano la bozza per garantire coerenza con i rispettivi sistemi e politiche (M4.3)."},{"k":"p","t":"Approvazione: l’AD approva formalmente la versione definitiva. Il sign-off multifunzionale è documentato."},{"k":"p","t":"Pubblicazione e comunicazione: la politica aggiornata è comunicata a tutto il personale in linguaggio chiaro, tradotta nelle lingue del personale, e condivisa con i business partner. Lo storico delle versioni è mantenuto (MOD-04.03)."},{"k":"p","t":"Formazione: il personale riceve formazione sul contenuto aggiornato della politica; il completamento è documentato."},{"k":"p","t":"4.2 Politica di Aspettative Reciproche per i Business Partner (M4.2)"},{"k":"p","t":"L’Organizzazione predispone e aggiorna periodicamente una politica specifica per i business partner che includa i seguenti impegni minimi:"},{"k":"t","r":[["Rif.","Requisito (M4.2)","Contenuto operativo nella politica"],["a)","Richiedere ai BP di rispettare i principi SA8000, i requisiti legali e altri requisiti","Clausole contrattuali; codice di condotta per fornitori; acknowledgement richiesto"],["b)","Condurre due diligence dei BP","Questionari di pre-qualifica; audit; monitoraggio continuo; criteri di rischio"],["c)","Affrontare le modalità con cui l’Organizzazione causa, contribuisce o è collegata all’incapacità dei BP di soddisfare le aspettative","Analisi della responsabilità; piani di miglioramento; supporto tecnico; azioni graduali"],["d)","Stabilire aspettative chiare per la cessazione delle relazioni, con engagement e considerazione dei rischi per il personale","Criteri di exit; engagement pre-cessazione; valutazione impatto su lavoratori del BP; disengagement responsabile"]]},{"k":"p","t":"Il processo di redazione, consultazione, approvazione e comunicazione segue le stesse fasi della Dichiarazione di Politica (par. 4.1.2). La politica è integrata nei contratti, negli ordini di acquisto e nei materiali di onboarding dei BP. Il template è documentato nel MOD-04.04."},{"k":"p","t":"4.3 Verifica di coerenza interna (M4.3)"},{"k":"p","t":"L’Organizzazione verifica sistematicamente che le proprie politiche, pratiche, obiettivi e sistemi di incentivazione non contraddicano gli impegni assunti verso i principi dello Standard e gli obiettivi SA8000."},{"k":"p","t":"4.3.1 Processo di verifica"},{"k":"p","t":"Censimento delle politiche: il Resp. SA mantiene un registro di tutte le politiche organizzative (HR, qualità, ambiente, H&S, acquisti, codice etico, whistleblowing, incentivi, ecc.) con data di ultima revisione e responsabile."},{"k":"p","t":"Revisione annuale: tutte le politiche sono riesaminate per coerenza con i principi SA8000 almeno una volta all’anno. La revisione è documentata nella Checklist di Coerenza (MOD-04.05)."},{"k":"p","t":"Verifica obiettivi e incentivi: ogni obiettivo dipartimentale e ogni schema di incentivazione è accompagnato da una dichiarazione di allineamento che conferma la non contraddizione con gli impegni SA8000. Gli schemi di incentivazione sono sottoposti a valutazione del rischio di impatti sociali negativi non intenzionali."},{"k":"p","t":"Approvazione nuove politiche: nessuna nuova politica, pratica o schema di incentivazione è adottata senza la revisione e il sign-off del Resp. SA e dell’AD per confermare la coerenza con gli impegni SA8000."},{"k":"p","t":"Coinvolgimento: la revisione include la consultazione dei rappresentanti dei lavoratori, dei sindacati e, ove rilevante, dei business partner (M4.3)."},{"k":"p","t":"Correzione: le contraddizioni identificate sono corrette attraverso la revisione delle politiche/pratiche/obiettivi/incentivi interessati, con tracciamento delle azioni correttive."},{"k":"p","t":"4.4 Coerenza delle interazioni esterne e del lobbying (M4.4)"},{"k":"p","t":"L’Organizzazione assicura che le proprie attività di lobbying, le affiliazioni, le comunicazioni esterne e le altre interazioni non contraddicano gli impegni assunti."},{"k":"p","t":"4.4.1 Registro delle affiliazioni e attività esterne"},{"k":"p","t":"L’Organizzazione mantiene un registro di tutte le affiliazioni ad associazioni, camere di commercio, gruppi industriali, iniziative di advocacy e altre organizzazioni esterne (MOD-04.06)."},{"k":"p","t":"Ogni affiliazione è mappata contro i principi SA8000 e gli obiettivi dell’Organizzazione per verificarne l’allineamento."},{"k":"p","t":"L’adesione a nuove associazioni o iniziative richiede una verifica di allineamento preliminare e l’approvazione dell’AD."},{"k":"p","t":"4.4.2 Processo di pre-approvazione"},{"k":"p","t":"Tutte le attività di lobbying, le posizioni politiche esterne e le dichiarazioni pubbliche che possano influenzare questioni relative ai diritti dei lavoratori richiedono un processo di pre-approvazione."},{"k":"p","t":"Le attività ad alto rischio o sensibili sono escalate alla revisione congiunta Compliance/Legale e al sign-off dell’AD."},{"k":"p","t":"La motivazione per l’approvazione o il rifiuto di ogni interazione esterna è documentata."},{"k":"p","t":"4.4.3 Revisione delle comunicazioni esterne"},{"k":"p","t":"Le comunicazioni esterne (newsletter, report, email, social media) che trattano questioni di lavoro e diritti umani sono riesaminate dal Resp. SA per coerenza con la Politica prima della pubblicazione."},{"k":"p","t":"La politica di gestione dei conflitti di interesse copre le interazioni esterne rilevanti."},{"k":"p","t":"Il reporting pubblico sulle attività di lobbying e advocacy è garantito con frequenza almeno annuale."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Avvio revisione","Trigger: scadenza annuale, modifica standard/leggi, nuovi rischi, feedback, risultati audit.","Resp. SA","Annuale / trigger"],["2","Matrice di conformità","Aggiornamento mappatura SA8000 + leggi + altri standard; identificazione gap.","Resp. SA / Legale","+10 gg"],["3","Bozza politica","Redazione/aggiornamento bozza con copertura M4.1 a–h e M4.2 a–d.","Resp. SA","+10 gg"],["4","Consultazione","SPT, sindacati, stakeholder: raccolta feedback, documentazione considerazione.","Resp. SA / SPT","+15 gg"],["5","Revisione interfunzionale","Sign-off delle funzioni (HR, Legale, H&S, Produz., Acquisti) per coerenza M4.3.","Funzioni","+10 gg"],["6","Approvazione AD","Firma dell’AD; registrazione nello storico versioni.","AD","+5 gg"],["7","Comunicazione e diffusione","Traduzione; distribuzione personale e BP; pubblicazione intranet/bacheca.","Resp. SA / HR","+15 gg"],["8","Formazione","Sessioni informative per tutto il personale e per i business partner chiave.","Resp. SA / HR","+30 gg"],["9","Verifica coerenza M4.3","Revisione annuale di tutte le politiche, obiettivi e incentivi; checklist MOD-04.05.","Resp. SA / Funzioni","Annuale"],["10","Verifica coerenza M4.4","Revisione registro affiliazioni e lobbying; pre-approvazione interazioni; reporting.","Resp. SA / Legale","Annuale / continuo"],["11","Monitoraggio e KPI","Misurazione indicatori; report al Riesame della Direzione.","Resp. SA","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Dichiarazione di Politica (M4.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["N. revisioni/aggiornamenti della politica negli ultimi 12 mesi","Conteggio","≥ 1","Annuale"],["% criteri SA8000, requisiti legali e altri standard coperti nella politica","Matrice conformità MOD-04.01","100%","Ad ogni revisione"],["% personale e BP che conferma ricezione/comprensione della politica","Survey / registro acknowledgement","≥ 95%","Annuale"],["% personale formato annualmente sugli impegni della politica","N. formati / N. totale × 100","≥ 90%","Annuale"],["% aggiornamenti politica firmati da tutte le funzioni rilevanti","N. sign-off completi / N. revisioni × 100","100%","Ad ogni revisione"],["% lavoratori e stakeholder che hanno fornito input nell’ultimo aggiornamento","N. consultati / N. identificati × 100","≥ 70%","Ad ogni revisione"],["% proposte lavoratori/stakeholder incorporate nella politica aggiornata","N. incorporate / N. ricevute × 100","≥ 50%","Ad ogni revisione"],["Giorni medi tra identificazione rischio critico e aggiornamento politica","Media giorni","≤ 30 gg","Annuale"]]},{"k":"p","t":"5.2 Indicatori Politica Business Partner (M4.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% contratti che includono clausole di aspettative reciproche SA8000","N. con clausole / N. totali × 100","≥ 95%","Annuale"],["% BP a cui le aspettative sono state comunicate","N. comunicati / N. totali BP × 100","100%","Annuale"],["% lingue dei BP in cui la politica è stata tradotta","N. lingue coperte / N. necessarie × 100","100%","Annuale"],["% revisioni programmate completate entro la scadenza","N. completate / N. programmate × 100","100%","Annuale"]]},{"k":"p","t":"5.3 Indicatori Coerenza (M4.3, M4.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% politiche organizzative riesaminate per coerenza con SA8000 negli ultimi 12 mesi","N. riesaminate / N. totali × 100","100%","Annuale"],["N. contraddizioni identificate tra politiche/pratiche e impegni SA8000","Conteggio","0 (target ideale)","Annuale"],["% contraddizioni identificate corrette nel ciclo di revisione","N. corrette / N. identificate × 100","100%","Annuale"],["% obiettivi dipartimentali con dichiarazione di allineamento SA8000","N. con dichiarazione / N. totali × 100","100%","Annuale"],["% schemi incentivazione valutati per allineamento prima dell’implementazione","N. valutati / N. nuovi/modificati × 100","100%","Annuale"],["% affiliazioni esterne registrate nel registro","N. registrate / N. note × 100","100%","Annuale"],["% nuove affiliazioni/lobbying verificate per allineamento prima dell’approvazione","N. verificate / N. nuove × 100","100%","Annuale"],["N. casi in cui interazioni esterne sono risultate in conflitto con principi SA8000","Conteggio","0","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-04.01","Matrice di Conformità (SA8000 + Legge + Altri Standard)","Mappatura dei requisiti SA8000, legislativi e di altri standard verso il contenuto della politica."],["MOD-04.02","Registro Consultazione Politica","Documentazione del feedback di lavoratori, sindacati e stakeholder e della sua considerazione."],["MOD-04.03","Storico Versioni Politiche","Registro cronologico delle versioni: data, descrizione modifiche, approvante, distribuzione."],["MOD-04.04","Template Politica Business Partner","Struttura tipo della politica di aspettative reciproche: clausole M4.2 a–d, acknowledgement."],["MOD-04.05","Checklist di Coerenza (M4.3)","Griglia per la verifica annuale di coerenza tra politiche, obiettivi, incentivi e impegni SA8000."],["MOD-04.06","Registro Affiliazioni e Lobbying (M4.4)","Registro delle affiliazioni esterne con mappatura di allineamento e processo di pre-approvazione."],["MOD-04.07","Report Annuale sulla Politica","Valutazione annuale: copertura, consultazione, coerenza, KPI, azioni di miglioramento."]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"Le versioni firmate delle politiche e lo storico delle revisioni sono conservati per tutta la durata della certificazione e per almeno 5 anni dopo l’ultimo aggiornamento."},{"k":"p","t":"I registri di consultazione, le checklist di coerenza e i registri di lobbying sono conservati per almeno 5 anni."},{"k":"p","t":"L’accesso è garantito all’AD, al Resp. SA, allo SPT e alle terze parti autorizzate (auditor, SAI) ai sensi di M8.3."}]},"PRO-05":{"code":"PRO-05","blocks":[{"k":"t","r":[["PROCEDURA PRO-05"],["Codice:","PRO-05","Revisione:","01"],["Titolo:","CONTESTO, IMPATTI E RISCHI"],["Criteri SA8000:","M5.1–5.4","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per l’analisi del contesto organizzativo, l’identificazione degli impatti negativi reali e potenziali, la valutazione e prioritizzazione dei rischi e l’analisi delle cause radice, in conformità ai criteri M5.1–5.4 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione identifichi e comprenda periodicamente il proprio contesto: operazioni, relazioni commerciali, esigenze degli stakeholder, contesto normativo, culturale, sociale, economico (M5.1)."},{"k":"p","t":"Siano identificati gli impatti negativi reali e potenziali che l’Organizzazione causa, a cui contribuisce o a cui è direttamente collegata, inclusi quelli specifici per le popolazioni vulnerabili, i fattori di rischio, il grado di contribuzione dei business partner e gli impatti legati all’etica aziendale (M5.2)."},{"k":"p","t":"I rischi siano valutati, prioritizzati e documentati sulla base della gravità degli impatti negativi e della probabilità degli impatti potenziali (M5.3)."},{"k":"p","t":"Per i rischi prioritizzati siano identificate le cause radice, distinguendo cause gestionali, operative ed esterne (M5.4)."},{"k":"p","t":"1.2 Campo di applicazione"},{"k":"p","t":"La procedura si applica a tutte le operazioni dell’Organizzazione, a tutte le relazioni commerciali dirette e indirette, e a tutti i temi coperti dallo Standard SA8000:2026 (lavoro minorile, lavoro forzato, salute e sicurezza, libertà di associazione, discriminazione, pratiche disciplinari, orario di lavoro, retribuzione, sistema di gestione). L’analisi tiene conto delle circostanze normali e eccezionali (pandemie, emergenze, conflitti)."},{"k":"p","t":"1.3 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M5.1–5.4"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M5"},{"k":"p","t":"Manuale del Sistema di Gestione SA8000:2026 dell’Organizzazione"},{"k":"p","t":"PRO-01 – Riesame della Direzione"},{"k":"p","t":"PRO-02 – Coinvolgimento dei Lavoratori e SPT"},{"k":"p","t":"PRO-03 – Engagement degli Stakeholder"},{"k":"p","t":"PRO-04 – Gestione della Politica"},{"k":"p","t":"PRO-06 – Obiettivi, Pianificazione e Risorse"},{"k":"p","t":"PRO-08 – Gestione dei Business Partner"},{"k":"p","t":"PRO-12/13 – Meccanismi di Reclamo"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"Principi Guida ONU su Imprese e Diritti Umani (UNGPs)"},{"k":"p","t":"Convenzioni ILO fondamentali applicabili"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Contesto organizzativo","Insieme delle condizioni interne (operazioni, struttura, forza lavoro) ed esterne (normative, mercato, cultura, economia) che influenzano le attività e i rischi dell’Organizzazione (M5.1)."],["Impatto negativo","Effetto avverso reale o potenziale sui diritti e le condizioni di lavoro dignitoso, che l’Organizzazione causa, a cui contribuisce o a cui è direttamente collegata (M5.2)."],["Fattore di rischio","Condizione, circostanza o pratica che aumenta la probabilità o la gravità di un impatto negativo (es. paese ad alto rischio, uso intensivo di lavoro temporaneo, pressione sui prezzi)."],["Gravità (Severity)","Misura dell’impatto negativo basata su: portata del danno, irrimediabilità e numero di persone colpite. Lo Standard richiede che la gravità sia pesata più della probabilità (M5.3)."],["Probabilità (Likelihood)","Verosimiglianza che un impatto potenziale si materializzi, considerando il contesto e i fattori di rischio."],["Causa radice (Root Cause)","Fattore fondamentale che, se eliminato, previene il ripetersi dell’impatto negativo. Può essere gestionale, operativa o esterna (M5.4)."],["Popolazione vulnerabile","Gruppi esposti a rischi specifici: migranti, minori, donne, persone con disabilità, lavoratori temporanei/interinali, apprendisti."],["Registro dei rischi","Documento strutturato che registra ogni rischio identificato con gravità, probabilità, priorità, evidenze, cause radice e azioni."],["Due Diligence","Processo continuo di identificazione, prevenzione, mitigazione e rendicontazione degli impatti negativi reali e potenziali."],["AD / Resp. SA / SPT","Alta Direzione / Responsabile SA8000 / Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR/H&S","Acquisti","Lav./OO.SS."],["Analisi del contesto (M5.1)","A","R","C","R","C"],["Identificazione impatti (M5.2)","I","R"],["Valutazione e prioritizzazione (M5.3)","A","R","C"],["Analisi cause radice (M5.4)","I","R","C"],["Approvazione registro rischi","A","R","C","I"],["Monitoraggio e aggiornamento","I","R","C"],["Comunicazione risultati a stakeholder","I","R","I"]]},{"k":"p","t":"Legenda: R = Responsabile (esegue), A = Accountable (approva/risponde), C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Analisi del contesto organizzativo (M5.1)"},{"k":"p","t":"L’Organizzazione identifica e comprende periodicamente il proprio contesto, documentandolo nel Rapporto di Contesto (MOD-05.01), che copre le seguenti dimensioni:"},{"k":"t","r":[["Rif.","Dimensione (M5.1)","Elementi da mappare / analizzare"],["a)","Operazioni proprie","Struttura organizzativa; sedi e stabilimenti; processi produttivi (mappe di processo, flowchart); composizione della forza lavoro (demografia, tipologie contrattuali, turni); modalità di impiego (diretto, interinale, stagionale, apprendistato)."],["b)","Relazioni commerciali dirette e indirette","Fornitori diretti (Tier 1); subappaltatori; agenzie interinali; fornitori di servizi; partner commerciali significativi indiretti (Tier 2+); catena di fornitura degli input e dei servizi."],["c)","Esigenze e aspettative di lavoratori e stakeholder","Esigenze dei lavoratori e dei loro rappresentanti (PRO-02); aspettative degli stakeholder rilevanti (PRO-03); risultati delle survey, dei reclami e dell’engagement."],["d)","Ambiente operativo interno ed esterno","Contesto normativo (leggi del lavoro, regolamenti H&S, normativa anti-corruzione); contesto di mercato (pressioni concorrenziali, stagionalità); contesto culturale e sociale (norme sociali, tradizioni, discriminazioni endemiche); contesto economico (livello salariale del territorio, costo della vita); fattori ambientali; situazioni di conflitto e sicurezza."]]},{"k":"p","t":"4.1.1 Fonti informative"},{"k":"p","t":"Dati interni: registri HR, registri infortuni, dati retributivi, presenze/straordinari, reclami, risultati di audit, report SPT."},{"k":"p","t":"Fonti esterne: report ILO, ricerche di ONG, pubblicazioni di associazioni di settore, advisory governativi, report di ispettorati del lavoro."},{"k":"p","t":"Consultazioni: lavoratori, sindacati, SPT, stakeholder esterni (PRO-02 / PRO-03)."},{"k":"p","t":"Registro delle leggi e dei requisiti applicabili (MOD-05.02)."},{"k":"p","t":"4.1.2 Frequenza e trigger di revisione"},{"k":"p","t":"Revisione completa almeno annuale, con sign-off dell’AD."},{"k":"p","t":"Aggiornamento ad hoc in caso di: cambio normativo significativo, espansione/contrazione operativa, nuovi mercati/fornitori, eventi eccezionali (pandemia, conflitto, disastro), feedback significativi da stakeholder, risultati critici di audit."},{"k":"p","t":"Il tempo medio tra un cambiamento nel contesto esterno e il suo recepimento nel sistema è monitorato come KPI."},{"k":"p","t":"4.2 Identificazione degli impatti negativi e dei fattori di rischio (M5.2)"},{"k":"p","t":"Sulla base dell’analisi del contesto, l’Organizzazione identifica periodicamente gli impatti negativi reali e potenziali rilevanti per lo Standard SA8000, documentandoli nel Registro degli Impatti e dei Rischi (MOD-05.03)."},{"k":"p","t":"4.2.1 Ambiti di identificazione (M5.2 a–d)"},{"k":"t","r":[["Rif.","Ambito","Attività di identificazione"],["a)","Impatti reali e potenziali che l’Organizzazione causa, a cui contribuisce o a cui è collegata","Mappatura di tutte le operazioni e relazioni commerciali contro i temi SA8000; analisi di circostanze normali e eccezionali; attenzione specifica alle popolazioni vulnerabili (migranti, minori, donne, disabili, temporanei)."],["b)","Fattori di rischio","Valutazione dei fattori: paesi/regioni di operazione e approvvigionamento; settore e prodotti; modalità di impiego; modelli di business e sourcing; uso di straordinari; deduzioni salariali; circostanze eccezionali."],["c)","Grado di contribuzione ai rischi dei BP","Analisi di come i modelli di acquisto (pressione sui prezzi, tempi stretti, modifiche dell’ultimo minuto) contribuiscano alle non conformità dei BP; valutazione di joint venture, licenziatari, franchisor."],["d)","Impatti da etica e integrità aziendale","Canali di segnalazione di corruzione, favoritismi, ritorsioni; revisione dei processi di acquisto, reclutamento e pagamento per vulnerabilità etiche; dichiarazioni annuali di conflitto di interessi; audit interfunzionali."]]},{"k":"p","t":"4.2.2 Fonti informative per l’identificazione"},{"k":"t","r":[["Fonte","Dettaglio"],["Consultazione lavoratori e stakeholder","Input diretto da diretti interessati (rightsholders); dialogo con gruppi vulnerabili; sessioni SPT."],["Ricerca documentale","Report ILO, ONG, advisory governativi, indici di rischio paese, studi settoriali."],["Meccanismi di reclamo","Dati dai canali di reclamo interni ed esterni (PRO-12/13); collegamento con il registro rischi."],["Canali di comunicazione interna","Cassette suggerimenti, survey, interviste, focus group (PRO-02)."],["Monitoraggio e audit","Risultati di audit interni, ispezioni, verifiche di routine, walkthroughs."],["Dashboard indicatori","Indicatori sentinella: ore straordinario eccessive, elevato uso di agenzia, personale senza contratto, deduzioni salariali, alto turnover."],["Case study e scenari","Simulazioni di scenari worst-case; analisi di incidenti nel settore."]]},{"k":"p","t":"4.2.3 Attenzione alle popolazioni vulnerabili"},{"k":"p","t":"L’identificazione degli impatti include un’analisi specifica per le popolazioni vulnerabili, attraverso:"},{"k":"p","t":"Dialogo diretto con lavoratori migranti, donne, giovani, lavoratori temporanei/interinali, persone con disabilità."},{"k":"p","t":"Valutazione dei rischi specifici per ogni gruppo vulnerabile identificato."},{"k":"p","t":"Escalation automatica dei rischi che colpiscono popolazioni vulnerabili."},{"k":"p","t":"4.3 Valutazione, prioritizzazione e documentazione dei rischi (M5.3)"},{"k":"p","t":"4.3.1 Sistema di scoring"},{"k":"p","t":"I rischi identificati sono valutati utilizzando un sistema di scoring standardizzato che pesa la gravità (severity) più della probabilità (likelihood), come richiesto dallo Standard:"},{"k":"h","t":"SCALA DI GRAVITÀ (SEVERITY) – peso dominante"},{"k":"t","r":[["Livello","Etichetta","Descrizione"],["1","Trascurabile","Impatto lieve su un numero limitato di persone; facilmente rimediabile; nessun danno duraturo."],["2","Bassa","Impatto moderato; limitato nel tempo; coinvolge un gruppo ristretto; rimediabile con azioni standard."],["3","Significativa","Impatto rilevante su un numero significativo di persone; richiede azioni dedicate; parzialmente rimediabile."],["4","Alta","Impatto grave; coinvolge molte persone o gruppi vulnerabili; difficilmente rimediabile; conseguenze durature."],["5","Critica","Impatto devastante; potenzialmente irrimediabile; coinvolge un grande numero di persone; violazione fondamentale dei diritti umani."]]},{"k":"h","t":"SCALA DI PROBABILITÀ (LIKELIHOOD)"},{"k":"t","r":[["Livello","Etichetta","Descrizione"],["1","Molto improbabile","Nessun precedente noto; condizioni estremamente improbabili."],["2","Improbabile","Raro; pochissimi precedenti nel settore/regione."],["3","Possibile","Si è verificato nel settore/regione; condizioni predisponenti presenti."],["4","Probabile","Si è verificato nell’Organizzazione o frequentemente nel settore; condizioni ricorrenti."],["5","Quasi certo","Attualmente in corso o altamente prevedibile sulla base delle condizioni attuali."]]},{"k":"p","t":"4.3.2 Classificazione e prioritizzazione"},{"k":"p","t":"Il punteggio combinato è calcolato con formula ponderata: Punteggio = (Gravità × 2) + Probabilità, che assegna peso dominante alla gravità."},{"k":"t","r":[["Classe","Punteggio","Azione richiesta","Escalation"],["CRITICO","13–15","Azione immediata; piano di rimedio urgente; reporting AD entro 24h; monitoraggio intensivo.","Immediata ad AD e stakeholder"],["ALTO","9–12","Piano d’azione prioritario entro 30 gg; monitoraggio mensile; revisione al prossimo riesame.","AD e SPT"],["MEDIO","5–8","Piano d’azione entro 90 gg; monitoraggio trimestrale; integrazione in obiettivi annuali.","Resp. SA e SPT"],["BASSO","3–4","Monitoraggio semestrale; azioni di miglioramento ordinarie; mantenimento controlli.","Resp. SA"]]},{"k":"p","t":"4.3.3 Validazione e documentazione"},{"k":"p","t":"La valutazione è condotta da panel interfunzionali (HR, H&S, Acquisti, Compliance, SPT, rappresentanti dei lavoratori) e, ove possibile, con esperti esterni (M5.3)."},{"k":"p","t":"Ogni rischio è registrato nel Registro dei Rischi (MOD-05.03) con: descrizione, tema SA8000, gravità, probabilità, punteggio, classe, evidenze, cause radice, azioni, responsabile, scadenza."},{"k":"p","t":"Le variazioni dei punteggi nel tempo sono documentate con rationale per ogni aumento/diminuzione."},{"k":"p","t":"I riepiloghi della prioritizzazione sono condivisi internamente con lavoratori/rappresentanti e, ove appropriato, con stakeholder esterni."},{"k":"p","t":"4.4 Analisi delle cause radice (M5.4)"},{"k":"p","t":"Per ogni rischio prioritizzato (classe Critico o Alto, e su richiesta per i Medi), l’Organizzazione conduce un’analisi delle cause radice strutturata, documentata nel Modulo di Analisi Cause Radice (MOD-05.04)."},{"k":"p","t":"4.4.1 Categorie di cause (M5.4 a–c)"},{"k":"t","r":[["Rif.","Categoria","Elementi da analizzare"],["a)","Cause gestionali (Management System)","Allocazione delle risorse; cultura organizzativa; adeguatezza di politiche e procedure; programmi di formazione e competenza; chiarezza di ruoli, responsabilità e incentivi; decisioni di top management su costi, priorità, investimenti."],["b)","Cause operative (incluso modello di business)","Modello di business e modello operativo; attrezzature, materiali, tecnologia; pratiche di acquisto (pressione sui prezzi, tempi stretti, modifiche dell’ultimo minuto); strutture di organico e reporting; retribuzione e benefit; servizi di supporto ai lavoratori; ambienti di lavoro; automazione; relazioni commerciali e subappalto; dipendenza da lavoro temporaneo; picchi stagionali; sourcing globale."],["c)","Cause esterne","Tradizioni sociali o culturali; condizioni legali o normative (gap tra legge locale e SA8000, scarsa applicazione); condizioni economiche o socioeconomiche; fattori ambientali; conflitto e sicurezza; report di ONG, advisory governativi, benchmark di settore."]]},{"k":"p","t":"4.4.2 Metodologia"},{"k":"p","t":"Tecnica dei “5 Perché” (5 Whys) per risalire dalla manifestazione alla causa fondamentale."},{"k":"p","t":"Diagramma causa-effetto (Ishikawa) con le tre categorie M5.4 come rami principali."},{"k":"p","t":"Cross-analisi delle non conformità o dei reclami ricorrenti per individuare debolezze sistemiche."},{"k":"p","t":"Coinvolgimento di lavoratori, sindacati, gruppi comunitari e fornitori nell’identificazione delle cause radice."},{"k":"p","t":"Per ogni rischio è documentata la ripartizione ponderata delle cause (es. 50% operativa, 30% gestionale, 20% esterna) per chiarire dove risiedono la responsabilità e la leva."},{"k":"p","t":"Dopo ogni incidente, è condotta un’indagine documentata sulle cause radice e le evidenze sono integrate nel registro rischi."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Analisi del contesto","Raccolta dati; mappatura operazioni, relazioni, ambiente; consultazione stakeholder; compilazione MOD-05.01.","Resp. SA / Funzioni","Annuale"],["2","Registro leggi e requisiti","Aggiornamento del registro delle leggi, regolamenti e requisiti applicabili (MOD-05.02).","Resp. SA / Legale","Annuale / trigger"],["3","Identificazione impatti","Analisi di impatti reali e potenziali per tema SA8000; fattori di rischio; contribuzione BP; etica; popolazioni vulnerabili.","Resp. SA / SPT / Funzioni","Annuale"],["4","Valutazione e scoring","Applicazione del sistema di scoring (Gravità × 2 + Probabilità); classificazione Critico/Alto/Medio/Basso.","Panel interfunzionale","+15 gg"],["5","Validazione e prioritizzazione","Revisione del panel con rappresentanti lavoratori e, ove possibile, esperti esterni; conferma delle priorità.","SPT / Esperti","+10 gg"],["6","Analisi cause radice","Per rischi Critici e Alti: analisi 5 Whys / Ishikawa; ripartizione ponderata cause; documentazione MOD-05.04.","Resp. SA / Panel","+20 gg"],["7","Compilazione registro rischi","Registrazione completa nel MOD-05.03: descrizione, scoring, classe, cause, azioni, responsabile, scadenza.","Resp. SA","+5 gg"],["8","Approvazione AD","Presentazione del registro rischi aggiornato all’AD per approvazione e sign-off.","AD","+5 gg"],["9","Definizione azioni","Per ogni rischio prioritizzato: definizione di azioni preventive/correttive, responsabili e scadenze (PRO-06/14).","Resp. SA / Funzioni","+15 gg"],["10","Comunicazione","Condivisione dei risultati con SPT, lavoratori, sindacati e stakeholder in formati accessibili.","Resp. SA / SPT","+10 gg"],["11","Monitoraggio e aggiornamento","Monitoraggio continuo; aggiornamento ad hoc per trigger; revisione completa annuale; input al RdD.","Resp. SA","Continuo"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori di contesto (M5.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["Frequenza della revisione del contesto","N. revisioni/anno","≥ 1","Annuale"],["% relazioni commerciali identificate e mappate","N. mappate / N. note × 100","≥ 90%","Annuale"],["% leggi e requisiti applicabili identificati nel registro","N. registrati / N. applicabili × 100","100%","Annuale"],["% funzioni (HR, Acquisti, H&S, Prod.) partecipanti alla revisione del contesto","N. partecipanti / N. funzioni chiave × 100","100%","Annuale"],["Tempo medio tra cambiamento contesto esterno e recepimento nel SG (mesi)","Media mesi","≤ 2","Annuale"]]},{"k":"p","t":"5.2 Indicatori di identificazione impatti e rischi (M5.2, M5.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["N. valutazioni di impatto condotte/anno","Conteggio","≥ 1","Annuale"],["% operazioni e relazioni mappate contro impatti potenziali","N. mappate / N. totali × 100","≥ 90%","Annuale"],["% valutazioni che considerano esplicitamente rischi per popolazioni vulnerabili","N. con focus vulnerabili / N. totali × 100","100%","Annuale"],["% rischi identificati formalmente valutati per gravità e probabilità","N. valutati / N. identificati × 100","100%","Annuale"],["% rischi registrati con gravità, probabilità, priorità e rationale completi","N. completi / N. totali × 100","100%","Annuale"],["% rischi ad alta gravità escalati all’AD entro i tempi definiti","N. escalati / N. da escalare × 100","100%","Annuale"],["% valutazioni con input da rappresentanti lavoratori o esperti esterni","N. con input / N. totali × 100","≥ 80%","Annuale"],["% rischi riesaminati entro il ciclo prescritto","N. riesaminati / N. dovuti × 100","100%","Annuale"]]},{"k":"p","t":"5.3 Indicatori di analisi cause radice (M5.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% rischi prioritizzati con cause radice identificate","N. con cause / N. prioritizzati × 100","100%","Annuale"],["Tempo medio tra prioritizzazione e completamento analisi cause radice","Media giorni","≤ 20 gg","Annuale"],["% analisi cause radice con input da lavoratori/sindacati/stakeholder","N. con input / N. totali × 100","≥ 70%","Annuale"],["% analisi che considerano le tre categorie di cause (gestionali, operative, esterne)","N. complete / N. totali × 100","100%","Annuale"],["% azioni correttive direttamente collegate a rischi/impatti identificati","N. collegate / N. totali AC × 100","≥ 90%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-05.01","Rapporto di Contesto Organizzativo","Documento strutturato: mappatura operazioni, relazioni commerciali, stakeholder, ambiente (M5.1 a–d)."],["MOD-05.02","Registro Leggi, Regolamenti e Requisiti","Log di leggi, regolamenti, standard applicabili con stato di conformità e aggiornamento."],["MOD-05.03","Registro degli Impatti e dei Rischi","Registro centrale: impatto, tema SA8000, gravità, probabilità, punteggio, classe, cause, azioni, stato."],["MOD-05.04","Modulo Analisi Cause Radice","Template per l’analisi strutturata: 5 Whys, categorie M5.4 a–c, ripartizione ponderata, evidenze."],["MOD-05.05","Dashboard Indicatori Sentinella","Cruscotto con indicatori di allerta: straordinari, turnover, reclami, infortuni, contratti, deduzioni."],["MOD-05.06","Report Annuale Rischi e Impatti","Valutazione annuale: sintesi contesto, mappa rischi, trend, analisi cause, raccomandazioni."]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"Il Registro dei Rischi, il Rapporto di Contesto e i Moduli di Analisi Cause Radice sono conservati per almeno 5 anni."},{"k":"p","t":"Le variazioni dei punteggi e delle classificazioni sono tracciate con storico completo."},{"k":"p","t":"L’accesso è garantito all’AD, al Resp. SA, allo SPT e alle terze parti autorizzate (auditor, SAI) ai sensi di M8.3."}]},"PRO-06":{"code":"PRO-06","blocks":[{"k":"t","r":[["PROCEDURA PRO-06"],["Codice:","PRO-06","Revisione:","01"],["Titolo:","OBIETTIVI, PIANIFICAZIONE E RISORSE"],["Criteri SA8000:","M6.1–6.4","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per la definizione degli obiettivi organizzativi, la pianificazione delle azioni per il raggiungimento degli stessi, l’assegnazione delle risorse necessarie e la gestione della collaborazione con i business partner e gli stakeholder per affrontare i rischi, in conformità ai criteri M6.1–6.4 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"Gli obiettivi siano progettati per soddisfare o superare i requisiti dello Standard, gli impegni di politica, i rischi prioritizzati, le questioni di etica e integrità, la preparazione alle emergenze, il dialogo sociale e il miglioramento continuo (M6.1 a–g)."},{"k":"p","t":"Per i rischi che l’Organizzazione causa o a cui contribuisce, siano pianificate azioni per porre fine, prevenire, mitigare gli impatti e garantire la riparazione, con debita considerazione delle conseguenze non intenzionali (M6.2 a–d)."},{"k":"p","t":"Per i rischi a cui l’Organizzazione è direttamente collegata, siano pianificate azioni di collaborazione e utilizzo della leva commerciale per influenzare i business partner (M6.3)."},{"k":"p","t":"Siano definite e pianificate le azioni e i processi necessari per raggiungere gli obiettivi, considerando sistemi di gestione, risorse e relazioni (M6.4 a–c)."},{"k":"p","t":"1.2 Campo di applicazione"},{"k":"p","t":"La procedura si applica a tutti gli obiettivi SA8000 dell’Organizzazione, alle relative azioni pianificate, alle risorse assegnate e alle attività di collaborazione con business partner e stakeholder per la gestione dei rischi."},{"k":"p","t":"1.3 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M6.1–6.4"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M6"},{"k":"p","t":"PRO-01 – Riesame della Direzione (obiettivi come output)"},{"k":"p","t":"PRO-02 – Coinvolgimento dei Lavoratori e SPT"},{"k":"p","t":"PRO-03 – Engagement degli Stakeholder"},{"k":"p","t":"PRO-04 – Gestione della Politica"},{"k":"p","t":"PRO-05 – Contesto, Impatti e Rischi (registro rischi come input)"},{"k":"p","t":"PRO-08 – Gestione dei Business Partner"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"PRO-15 – Miglioramento Continuo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Obiettivo SA8000","Risultato atteso, misurabile e con scadenza temporale, progettato per soddisfare i requisiti dello Standard, gli impegni di politica e affrontare i rischi identificati (M6.1)."],["Piano d’azione","Insieme strutturato di attività, responsabilità, risorse, scadenze e indicatori necessari per raggiungere un obiettivo (M6.4)."],["Leva commerciale (Leverage)","Capacità dell’Organizzazione di influenzare i comportamenti dei business partner attraverso volume d’acquisto, termini contrattuali, importanza di mercato, supporto tecnico (M6.3)."],["Rimedio (Remediation)","Riparazione per individui o gruppi colpiti da impatti negativi, proporzionata al danno subito e concordata con le parti interessate (M6.2d)."],["Conseguenze non intenzionali","Effetti negativi imprevisti derivanti dall’implementazione di azioni correttive o preventive, che devono essere valutati preventivamente (M6.2)."],["Dialogo sociale","Negoziazione, consultazione e scambio di informazioni tra rappresentanti dei lavoratori, dei datori di lavoro e del governo su questioni di lavoro (M6.1f)."],["Risorse","Finanziarie, materiali, di personale, di competenza, infrastrutturali, informative e di relazione necessarie per raggiungere gli obiettivi (M6.4b)."],["AD / Resp. SA / SPT","Alta Direzione / Responsabile SA8000 / Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","Funzioni","Acquisti","Lav./OO.SS."],["Definizione obiettivi (M6.1)","A","R","C"],["Mappatura obiettivi vs rischi/politica/legge","I","R","C","I"],["Pianificazione azioni per rischi propri (M6.2)","A","R","C"],["Pianificazione collaborazione BP (M6.3)","A","R","C","R","I"],["Pianificazione azioni e risorse (M6.4)","A","R","C","R","C"],["Allocazione risorse finanziarie","R","C","I","C","I"],["Monitoraggio avanzamento","I","R","C"],["Comunicazione obiettivi a lavoratori/stakeholder","I","R","C","I"],["Riesame e aggiornamento","A","R","C"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Definizione degli obiettivi organizzativi (M6.1)"},{"k":"p","t":"4.1.1 Input per la definizione degli obiettivi"},{"k":"p","t":"La definizione degli obiettivi utilizza come input obbligatori:"},{"k":"p","t":"Registro dei rischi prioritizzato (MOD-05.03 da PRO-05), dando priorità ai rischi ad alta gravità/probabilità."},{"k":"p","t":"Dichiarazione di Politica e impegni (PRO-04)."},{"k":"p","t":"Requisiti legali e dello Standard SA8000:2026 (MOD-05.02)."},{"k":"p","t":"Risultati del Riesame della Direzione (PRO-01)."},{"k":"p","t":"Feedback di lavoratori, sindacati e stakeholder (PRO-02/03)."},{"k":"p","t":"Performance dell’anno precedente e obiettivi di miglioramento continuo (PRO-15)."},{"k":"p","t":"Benchmark di settore e buone pratiche di pari."},{"k":"p","t":"4.1.2 Requisiti degli obiettivi (M6.1 a–g)"},{"k":"p","t":"Ogni obiettivo deve essere progettato per rispondere ad almeno uno dei seguenti requisiti:"},{"k":"t","r":[["Rif.","Requisito (M6.1)","Criteri di verifica"],["a)","Soddisfare o superare requisiti Standard, legali e altri","Matrice di mappatura: ogni criterio SA8000 e requisito legale collegato ad almeno un obiettivo."],["b)","Soddisfare gli impegni di politica","Matrice di mappatura: ogni impegno della Dichiarazione di Politica collegato ad almeno un obiettivo."],["c)","Affrontare i rischi dell’Organizzazione","Ogni rischio ad alta priorità (Critico/Alto) collegato ad almeno un obiettivo con azione preventiva/mitigativa."],["d)","Affrontare questioni di etica e integrità aziendale","Almeno un obiettivo collegato ad anti-corruzione, conflitti di interesse, etica aziendale."],["e)","Affrontare preparazione e risposta alle emergenze","Almeno un obiettivo su piano di emergenza, simulazioni, formazione."],["f)","Perseguire il dialogo sociale","Almeno un obiettivo su dialogo con sindacati, accordi tripartiti, contrattazione collettiva."],["g)","Migliorare continuamente performance e sistemi di gestione","Obiettivi costruiti sulle performance precedenti; target di miglioramento anno su anno documentati."]]},{"k":"p","t":"4.1.3 Formato degli obiettivi (SMART+)"},{"k":"p","t":"Ogni obiettivo è documentato nel Piano Obiettivi (MOD-06.01) con:"},{"k":"p","t":"Descrizione chiara e misurabile (Specifico, Misurabile, Raggiungibile, Rilevante, con Scadenza)."},{"k":"p","t":"Target quantitativo e/o qualitativo."},{"k":"p","t":"Scadenza temporale."},{"k":"p","t":"Responsabile (persona/ruolo accountable)."},{"k":"p","t":"Metodo di monitoraggio e indicatori."},{"k":"p","t":"Mappatura verso: criterio SA8000, impegno di politica, rischio collegato (MOD-05.03)."},{"k":"p","t":"Input documentato dei lavoratori/rappresentanti nella definizione."},{"k":"p","t":"Approvazione dell’AD con rationale documentato."},{"k":"p","t":"4.1.4 Coinvolgimento nella definizione"},{"k":"p","t":"L’AD partecipa attivamente alla definizione e alla revisione degli obiettivi."},{"k":"p","t":"I lavoratori, i rappresentanti e lo SPT sono consultati; i suggerimenti sono documentati e, se non integrati, la motivazione è registrata."},{"k":"p","t":"Gli stakeholder esterni sono consultati per gli obiettivi di rilevanza esterna (PRO-03)."},{"k":"p","t":"Gli obiettivi approvati sono comunicati in formato sintetico e accessibile a lavoratori, management e, ove appropriato, stakeholder esterni."},{"k":"p","t":"4.2 Pianificazione delle azioni per i rischi propri (M6.2)"},{"k":"p","t":"Per i rischi che l’Organizzazione causa o a cui contribuisce, sono pianificate azioni strutturate con debita considerazione delle conseguenze non intenzionali:"},{"k":"t","r":[["Rif.","Tipo di azione (M6.2)","Modalità operative"],["a)","Porre fine agli impatti negativi","Identificazione e arresto delle pratiche dannose una volta identificate; trigger di escalation per impatti che persistono o si ripresentano; utilizzo di team interfunzionali per supervisionare le azioni correttive."],["b)","Prevenire futuri impatti negativi","Almeno un obiettivo preventivo per ogni rischio critico; formazione mirata per manager, supervisori e lavoratori; richiesta di impegni preventivi e monitoraggio da parte di fornitori e partner; simulazioni per identificare gap nella pianificazione."],["c)","Mitigare i rischi","Analisi gravità/probabilità per determinare le azioni di mitigazione più efficaci; implementazione di controlli provvisori in attesa di soluzioni a lungo termine; monitoraggio degli indicatori sentinella (MOD-05.05)."],["d)","Garantire la riparazione","Collegamento dei meccanismi di reclamo (PRO-12/13) a processi strutturati di riparazione; riparazione collettiva per gruppi colpiti; monitoraggio dell’assenza di ritorsioni; verifica dell’equità e adeguatezza della riparazione con le persone colpite."]]},{"k":"p","t":"Prima dell’implementazione, ogni piano d’azione è sottoposto a valutazione delle conseguenze non intenzionali (MOD-06.03). I lavoratori, i sindacati e gli esperti esterni sono coinvolti nella revisione dei piani. I risultati del monitoraggio sono integrati nel registro rischi e nei cicli di pianificazione futuri."},{"k":"p","t":"4.3 Collaborazione e leva commerciale per i rischi collegati (M6.3)"},{"k":"p","t":"Per i rischi a cui l’Organizzazione è direttamente collegata tramite le sue relazioni commerciali, sono pianificate azioni di collaborazione:"},{"k":"p","t":"4.3.1 Mappatura della leva commerciale"},{"k":"p","t":"Per ogni BP collegato a rischi identificati, l’Organizzazione documenta il grado di leva (volume d’acquisto, termini contrattuali, importanza di mercato) e identifica opportunità per rafforzarla."},{"k":"p","t":"La gravità/probabilità dei rischi determina dove concentrare prioritariamente la collaborazione."},{"k":"p","t":"4.3.2 Strumenti di collaborazione"},{"k":"t","r":[["Strumento","Descrizione"],["Formazione e assistenza tecnica","Fornitura di formazione, supporto tecnico o finanziario ai BP per rispettare gli standard di lavoro."],["Clausole contrattuali","Inclusione di requisiti espliciti SA8000 nei contratti, con collegamento tra rinnovo/volume e progressi."],["Iniziative congiunte","Collaborazione con altre aziende che si approvvigionano dalla stessa regione/impianto per allineare aspettative e condividere risorse."],["Tavoli con sindacati, ONG, stakeholder","Tavole rotonde periodiche per allineare aspettative, condividere soluzioni, coordinare la riparazione."],["Supporto a riforme sistemiche","Supporto a riforme settoriali o governative quando i rischi sistemici non possono essere affrontati da un solo partner."],["Monitoraggio terze parti","Per rischi elevati, coinvolgimento di monitor o auditor terzi per valutare le azioni collaborative."],["Escalation e disengagement","Se collaborazione e leva falliscono: escalation tramite enforcement contrattuale, disclosure pubblica o, come ultima risorsa, disengagement responsabile con piano di uscita che minimizzi i danni ai lavoratori."]]},{"k":"p","t":"4.4 Pianificazione delle azioni e delle risorse (M6.4)"},{"k":"p","t":"Per ogni obiettivo, l’Organizzazione definisce e pianifica le azioni e i processi necessari, considerando tre dimensioni:"},{"k":"t","r":[["Rif.","Dimensione (M6.4)","Elementi da pianificare"],["a)","Sistemi di gestione","Politiche e procedure (verbali e scritte); ruoli e responsabilità; documentazione; incentivi e obiettivi del personale (integrazione nei sistemi di valutazione, bonus, promozione); formazione e sviluppo competenze; monitoraggio; sensibilizzazione lavoratori/stakeholder; indicatori e metriche (KPI quantitativi e qualitativi per ogni obiettivo)."],["b)","Risorse","Risorse finanziarie (budget annuale dedicato); materiali e infrastrutturali (impianti, IT, attrezzature); personale (organico, competenze interne); competenze esterne (consulenti, esperti); sistemi informativi (raccolta, analisi, reportistica dati). Gap analysis: confronto capacità attuali vs. obiettivi, con piano per colmare le lacune."],["c)","Relazioni","Dialogo sociale (coinvolgimento comitati, sindacati, strutture rappresentative); supporto ad accordi tripartiti e settoriali; relazioni con BP (coordinamento azioni su obiettivi condivisi); relazioni con governo e autorità (compliance, advocacy costruttiva); engagement stakeholder interni ed esterni (PRO-02/03). Canali di comunicazione con le autorità per garantire conformità."]]},{"k":"p","t":"L’Organizzazione mantiene un registro centralizzato delle azioni (MOD-06.02) collegato agli obiettivi, con scadenze, responsabilità e indicatori. Le sessioni di pianificazione interfunzionali (almeno semestrali) allineano obiettivi, sistemi, risorse e relazioni. I risultati del monitoraggio, degli audit e degli input dei lavoratori sono utilizzati per aggiornare i cicli di pianificazione."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Raccolta input","Registro rischi, risultati RdD, feedback lavoratori/stakeholder, performance anno prec., benchmark settore.","Resp. SA","Entro Q1"],["2","Sessione pianificazione","Workshop interfunzionale: AD, Resp. SA, SPT, HR, Acquisti, funzioni chiave. Definizione bozza obiettivi.","Resp. SA / AD","Entro Q1"],["3","Consultazione","SPT, sindacati, lavoratori, stakeholder: raccolta suggerimenti; documentazione integrazione/esclusione.","Resp. SA / SPT","+15 gg"],["4","Mappatura obiettivi","Verifica copertura: ogni rischio alto/critico, ogni criterio SA8000, ogni impegno di politica collegato a obiettivo.","Resp. SA","+5 gg"],["5","Piani d’azione M6.2","Per rischi propri: piani strutturati (fine impatti, prevenzione, mitigazione, riparazione); valutazione conseguenze non intenzionali.","Resp. SA / Funzioni","+15 gg"],["6","Piani collaborazione M6.3","Per rischi collegati: mappatura leva BP, strategie di collaborazione, iniziative congiunte, escalation.","Resp. SA / Acquisti","+15 gg"],["7","Allocazione risorse","Budget, personale, competenze, infrastrutture, relazioni. Gap analysis e piano per colmare lacune.","AD / Resp. SA","+10 gg"],["8","Approvazione AD","Presentazione piano completo; approvazione formale con rationale documentato.","AD","+5 gg"],["9","Comunicazione","Comunicazione obiettivi e piani a lavoratori, BP, stakeholder in formati accessibili.","Resp. SA / SPT","+15 gg"],["10","Monitoraggio","Monitoraggio trimestrale avanzamento; dashboard KPI; aggiornamento a fronte di audit, feedback, modifiche.","Resp. SA / Funzioni","Trimestrale"],["11","Riesame e aggiornamento","Revisione semestrale/annuale; input al RdD; adeguamento obiettivi e risorse. Ciclo di pianificazione continuo.","AD / Resp. SA","Semestrale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Definizione Obiettivi (M6.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% obiettivi mappati ad almeno un criterio SA8000, requisito legale o impegno di politica","N. mappati / N. tot. × 100","100%","Annuale"],["% rischi ad alta priorità (Critico/Alto) collegati ad almeno un obiettivo","N. con obiettivo / N. alti+critici × 100","100%","Annuale"],["% obiettivi documentati con target, scadenza, responsabile e metodo di monitoraggio","N. completi / N. tot. × 100","100%","Annuale"],["% obiettivi sviluppati con input documentato di lavoratori/rappresentanti","N. con input / N. tot. × 100","≥ 80%","Annuale"],["N. gruppi stakeholder diversi coinvolti nella definizione","Conteggio","≥ 3","Annuale"],["% suggerimenti stakeholder riconosciuti e integrati o giustificati se esclusi","N. gestiti / N. ricevuti × 100","100%","Annuale"],["% obiettivi che affrontano etica/integrità, emergenza, dialogo sociale","Verifica copertura M6.1 d–f","100% coperto","Annuale"],["% lavoratori che concordano che gli obiettivi riflettono le loro preoccupazioni","Survey","≥ 70%","Annuale"]]},{"k":"p","t":"5.2 Indicatori Azioni per Rischi Propri (M6.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["Tempo medio (gg) tra identificazione impatto e avvio azione correttiva","Media giorni","≤ 15 gg","Annuale"],["% impatti negativi con azioni completamente implementate e verificate","N. completate / N. tot. × 100","≥ 85%","Annuale"],["% impatti negativi che si ripresentano dopo essere stati risolti","N. ricorrenti / N. risolti × 100","≤ 10%","Annuale"],["% rischi ad alta priorità con almeno un’azione preventiva","N. con azione / N. alti+critici × 100","100%","Annuale"],["Variazione media gravità/probabilità dopo mitigazione vs. baseline","Differenza punteggi","Riduzione","Annuale"],["% piani d’azione con valutazione conseguenze non intenzionali","N. con valutazione / N. tot. × 100","100%","Annuale"],["% persone colpite che confermano la riparazione come equa e adeguata","Feedback/survey","≥ 80%","Per caso"]]},{"k":"p","t":"5.3 Indicatori Collaborazione BP (M6.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% BP con strategie di leva documentate","N. con strategia / N. a rischio × 100","100%","Annuale"],["% BP ad alto rischio che ricevono formazione/supporto tecnico/finanziario","N. supportati / N. alti × 100","≥ 80%","Annuale"],["% contratti con clausole esplicite SA8000","N. con clausole / N. tot. × 100","≥ 95%","Annuale"],["N. iniziative congiunte settoriali/multi-stakeholder attivate","Conteggio","≥ 1","Annuale"],["% azioni collaborative comunicate a lavoratori/stakeholder","N. comunicate / N. tot. × 100","100%","Annuale"]]},{"k":"p","t":"5.4 Indicatori Pianificazione e Risorse (M6.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% obiettivi con piani d’azione definiti","N. con piano / N. tot. × 100","100%","Annuale"],["% obiettivi con risorse finanziarie dedicate nel budget","N. con budget / N. tot. × 100","100%","Annuale"],["% fondi allocati effettivamente utilizzati","Fondi usati / Fondi allocati × 100","≥ 80%","Annuale"],["% fabbisogni di competenza identificati e soddisfatti","N. soddisfatti / N. identificati × 100","≥ 90%","Annuale"],["% obiettivi discussi con rappresentanti lavoratori/sindacati nella pianificazione","N. discussi / N. tot. × 100","100%","Annuale"],["% obiettivi che mostrano miglioramento misurabile anno su anno","N. migliorati / N. misurabili × 100","≥ 70%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-06.01","Piano Obiettivi SA8000","Registro degli obiettivi: descrizione, target, scadenza, responsabile, mappatura SA8000/politica/rischio, input lavoratori, KPI."],["MOD-06.02","Registro Azioni e Monitoraggio","Registro centralizzato delle azioni collegato a obiettivi: attività, responsabilità, risorse, scadenze, stato, indicatori."],["MOD-06.03","Valutazione Conseguenze Non Intenzionali","Template per valutazione preventiva degli effetti collaterali negativi di azioni correttive/preventive (M6.2)."],["MOD-06.04","Piano di Collaborazione BP (M6.3)","Strategie di leva per ogni BP a rischio: grado di leverage, strumenti, timeline, escalation, iniziative congiunte."],["MOD-06.05","Piano Allocazione Risorse","Budget, personale, competenze, infrastrutture per area SA8000: gap analysis, piano copertura."],["MOD-06.06","Report Semestrale Avanzamento Obiettivi","Dashboard avanzamento: stato per obiettivo, KPI attuali vs. target, azioni completate/in corso/ritardate."]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"I Piani Obiettivi, i Registri Azioni e i Piani di Collaborazione BP sono conservati per almeno 5 anni."},{"k":"p","t":"Le valutazioni di conseguenze non intenzionali sono archiviate con i relativi piani d’azione."},{"k":"p","t":"L’accesso è garantito all’AD, al Resp. SA, allo SPT e alle terze parti autorizzate (auditor, SAI) ai sensi di M8.3."}]},"PRO-07":{"code":"PRO-07","blocks":[{"k":"t","r":[["PROCEDURA PRO-07"],["Codice:","PRO-07","Revisione:","01"],["Titolo:","CONSAPEVOLEZZA, ATTUAZIONE E INFORMAZIONE DOCUMENTATA"],["Criteri SA8000:","M7.1–7.5","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per l’attuazione dei processi e delle azioni pianificate, la sensibilizzazione e informazione del personale, degli stakeholder e dei business partner, e il controllo dell’informazione documentata, in conformità ai criteri M7.1–7.5 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"I processi e le azioni pianificate siano attuati e le risorse allocate siano impiegate, con adeguamento periodico per garantire rilevanza ed efficacia (M7.1)."},{"k":"p","t":"Il personale abbia consapevolezza, comprensione, accesso alle informazioni e canali di comunicazione riguardo ai propri diritti, ai rischi, alle politiche, agli obiettivi, ai ruoli, ai meccanismi di coinvolgimento e ai canali di protezione dei diritti (M7.2 a–g)."},{"k":"p","t":"Gli stakeholder siano informati sui rischi rilevanti, sulle politiche, obiettivi, azioni e processi, e sui canali di coinvolgimento e protezione dei diritti (M7.3 a–c)."},{"k":"p","t":"Nelle interazioni con i business partner, l’Organizzazione garantisca consapevolezza, termini commerciali equi, supporto proporzionato, minimizzazione degli oneri amministrativi e disengagement responsabile (M7.4 a–e)."},{"k":"p","t":"L’informazione documentata sia disponibile, accurata, controllata e identificabile (M7.5 a–d)."},{"k":"p","t":"1.2 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M7.1–7.5"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M7"},{"k":"p","t":"PRO-02 – Coinvolgimento Lavoratori e SPT"},{"k":"p","t":"PRO-03 – Engagement degli Stakeholder"},{"k":"p","t":"PRO-04 – Gestione della Politica"},{"k":"p","t":"PRO-06 – Obiettivi, Pianificazione e Risorse"},{"k":"p","t":"PRO-08 – Gestione dei Business Partner"},{"k":"p","t":"PRO-09 – Formazione e Competenza"},{"k":"p","t":"PRO-12/13 – Meccanismi di Reclamo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Attuazione (Implementation)","Traduzione operativa dei processi e delle azioni pianificate (PRO-06), inclusi l’impiego delle risorse, il monitoraggio e gli adeguamenti periodici (M7.1)."],["Consapevolezza (Awareness)","Livello di conoscenza, comprensione e capacità del personale, degli stakeholder e dei BP di identificare diritti, rischi, politiche, obiettivi, canali di coinvolgimento e rimedio (M7.2–7.4)."],["Informazione documentata","Informazioni che l’Organizzazione deve controllare e mantenere: politiche, procedure, registrazioni, report, moduli. Deve essere disponibile, accurata, controllata, identificabile (M7.5)."],["Canale di comunicazione","Mezzo attraverso cui l’Organizzazione informa e interagisce con personale, stakeholder e BP: bacheche, intranet, newsletter, riunioni, piattaforme digitali, app, telefonate, cassette suggerimenti."],["Termini commerciali equi","Condizioni contrattuali (termini di pagamento, tempi di consegna, prezzi) che non minano la capacità dei BP di rispettare le aspettative reciproche (M7.4b)."],["Onere amministrativo","Carico di lavoro burocratico imposto ai BP per soddisfare i requisiti, che l’Organizzazione deve cercare di minimizzare (M7.4d)."],["AD / Resp. SA / SPT","Alta Direzione / Responsabile SA8000 / Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR","Acquisti","Funzioni","Lav./OO.SS."],["Attuazione processi pianificati (M7.1)","A","R","C","R","I"],["Monitoraggio e adeguamento (M7.1)","I","R","C"],["Sensibilizzazione personale (M7.2)","I","R","I","C","I"],["Informazione stakeholder (M7.3)","I","R","C","I","C","I"],["Interazioni con BP (M7.4)","A","R","I","C","R","C","I"],["Controllo informazione documentata (M7.5)","A","R","I","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Attuazione dei processi e delle azioni pianificate (M7.1)"},{"k":"p","t":"4.1.1 Traduzione operativa"},{"k":"p","t":"Le azioni pianificate (MOD-06.01 e MOD-06.02 da PRO-06) sono scomposte in task operativi con:"},{"k":"p","t":"Scadenze, responsabili e metodi di verifica per ogni task."},{"k":"p","t":"Riunioni di avvio (kick-off) per ogni processo o azione significativa, per chiarire ruoli, risultati attesi e formati di reporting."},{"k":"p","t":"Assegnazione documentata di personale/team con allocazione di tempo e obiettivi di performance."},{"k":"p","t":"Meccanismo di erogazione delle risorse (finanziarie, materiali, IT, infrastrutture) collegato a specifici processi o azioni, secondo il cronoprogramma (MOD-06.05)."},{"k":"p","t":"4.1.2 Monitoraggio dell’attuazione"},{"k":"p","t":"Dashboard o registro (MOD-07.01) dove ogni processo/azione è tracciato come: Non avviato / In corso / Completato / In ritardo."},{"k":"p","t":"Ispezioni di routine, interviste e revisioni documentali per confermare l’attuazione."},{"k":"p","t":"Opportunità per il personale di commentare l’efficacia (survey, meccanismi di reclamo, riunioni SPT)."},{"k":"p","t":"Report periodici sullo stato di avanzamento, con scadenze rispettate e criticità."},{"k":"p","t":"4.1.3 Adeguamento"},{"k":"p","t":"Se l’impiego iniziale delle risorse si rivela insufficiente o eccessivo, le azioni, i budget, l’organico o le tempistiche sono adeguati."},{"k":"p","t":"Ogni adeguamento comporta aggiornamento della documentazione, della formazione e delle comunicazioni."},{"k":"p","t":"Le lezioni apprese dall’attuazione sono riportate nel successivo ciclo di pianificazione (PRO-06) per rafforzare allineamento ed efficienza."},{"k":"p","t":"4.2 Consapevolezza e informazione del personale (M7.2)"},{"k":"p","t":"L’Organizzazione assicura che il personale abbia consapevolezza, comprensione, accesso alle informazioni e canali di comunicazione riguardo ai seguenti temi:"},{"k":"t","r":[["Rif.","Tema (M7.2)","Strumenti e metodi"],["a)","Diritti legali","Formazione all’induction e periodica; handbook multilingue semplificato sui diritti del lavoro; comunicazione tempestiva di cambiamenti normativi (bollettini, riunioni, alert digitali); poster/infografiche in aree comuni nelle lingue del personale."],["b)","Diritti definiti nello Standard SA8000","Versione semplificata dello Standard con visual e esempi; formazione partecipativa su come lo Standard si applica in scenari reali; condivisione dei contatti SPT, sindacati, organizzazioni di supporto, ispettorati."],["c)","Rischi relativi al loro impiego","Sessioni periodiche su H&S, rischi psicosociali, vulnerabilità dell’impiego; segnaletica visiva e acustica (etichettatura chimica, allarmi evacuazione, avvisi macchinari); condivisione di lezioni da incidenti/near miss; informazioni accessibili sui pericoli."],["d)","Politiche, obiettivi, azioni e processi","Aggiornamenti tramite bacheche, newsletter, town-hall, piattaforme digitali; piattaforma interna/app con accesso in qualsiasi momento; posting di aggiornamenti sugli obiettivi chiave."],["e)","Ruoli e responsabilità nel raggiungimento degli obiettivi","Integrazione degli obiettivi SA8000 nelle valutazioni delle performance; dialoghi periodici (trimestrali) tra management e rappresentanti dei lavoratori su obiettivi e processi."],["f)","Meccanismi e canali di coinvolgimento nel SG","Pubblicazione e spiegazione dei canali di partecipazione (SPT, comitati, survey, focus group); inviti attivi alla partecipazione."],["g)","Meccanismi di protezione dei diritti e rimedio","Canali di reclamo multilingue, confidenziali, multiformato (hotline, cassette, piattaforme terze); pubblicazione delle procedure per sollevare preoccupazioni e accedere al rimedio; counsellor confidenziali, helpline per stress/molestie/salute mentale."]]},{"k":"p","t":"4.2.1 Piano di sensibilizzazione"},{"k":"p","t":"L’Organizzazione mantiene un Piano Annuale di Sensibilizzazione (MOD-07.02) che include:"},{"k":"p","t":"Calendario delle sessioni informative e formative per neoassunti e personale in forza."},{"k":"p","t":"Materiali informativi (poster, handbook, infografiche) con versioni nelle lingue del personale e formati accessibili (visivi, audio, semplificati)."},{"k":"p","t":"Canali di comunicazione attivi (bacheche, intranet, app, newsletter, schermi digitali)."},{"k":"p","t":"Test periodici (survey, audit, quiz) per verificare il livello di consapevolezza del personale."},{"k":"p","t":"Adeguamento delle campagne sulla base dei risultati dei test, degli audit e dei reclami ricevuti."},{"k":"p","t":"4.3 Consapevolezza e informazione degli stakeholder (M7.3)"},{"k":"t","r":[["Rif.","Tema (M7.3)","Strumenti e metodi"],["a)","Rischi rilevanti","Pubblicazione periodica di sintesi dei rischi identificati, obiettivi e progressi; sessioni informative con comunità locali e ONG quando i rischi possono colpirli; opportunità per gli stakeholder di rispondere con feedback o informazioni supplementari."],["b)","Politiche, obiettivi, azioni e processi","Pubblicazione delle politiche adattate alla comprensione degli stakeholder; condivisione di metriche e indicatori in formati accessibili; esempi pratici di come funzionano i processi di reclamo, azioni correttive e engagement."],["c)","Canali di coinvolgimento e protezione dei diritti","Estensione dei canali di reclamo oltre i lavoratori; materiali nelle lingue locali con terminologia non tecnica; canali audio, visivi e digitali per diversi livelli di alfabetizzazione; sito web/hub digitale con politiche, obiettivi e opportunità di engagement aggiornati."]]},{"k":"p","t":"L’Organizzazione mantiene un registro degli stakeholder per tipo (MOD-03.01), analizza le informazioni necessarie per ogni gruppo, registra cosa è stato comunicato (quando, come, conferma di ricezione) e testa periodicamente se gli stakeholder comprendono effettivamente rischi, politiche e canali."},{"k":"p","t":"4.4 Interazioni con i business partner (M7.4)"},{"k":"t","r":[["Rif.","Requisito (M7.4)","Modalità operative"],["a)","Consapevolezza e informazione dei BP","Workshop di induction per nuovi BP; accesso online a politiche, obiettivi, requisiti in più lingue; contact point dedicati, hotline o portale BP; webinar/riunioni periodiche per rivedere obiettivi, rischi e aspettative."],["b)","Termini commerciali che non minano la compliance","Prima della finalizzazione dei contratti, revisione di termini di pagamento, tempi di consegna, prezzi, volumi per valutare se creano condizioni che minano la compliance; benchmarking delle pratiche di acquisto; opportunità per i BP di comunicare preoccupazioni quando i termini creano pressioni."],["c)","Supporto proporzionato alla contribuzione","Definizione di quando e come l’Organizzazione fornirà risorse (finanziarie, tecniche, formative) ai BP, proporzionalmente alla propria contribuzione al rischio; collaborazione su misure correttive; cost-sharing per i miglioramenti."],["d)","Minimizzazione degli oneri amministrativi","Accettazione di certificazioni credibili, report di audit o valutazioni di due diligence da organismi riconosciuti; differenziazione dei requisiti per profilo di rischio (BP piccoli/basso rischio non sovraccaricati); raccolta feedback dai BP sul carico amministrativo e adeguamento."],["e)","Disengagement responsabile","Non terminare le relazioni in risposta ai rischi, a meno che: (I) il BP non abbia ripetutamente fallito nel gestire il rischio dopo engagement e supporto appropriati, E (II) i rischi di terminare la relazione non siano maggiori del rischio originale. Soglie e sequenza di azioni prima del disengagement (avvisi, scadenze AC, supporto, escalation AD). Valutazione documentata se il disengagement creerebbe danni maggiori. Preavviso e collaborazione con stakeholder. Coordinamento con altri acquirenti."]]},{"k":"p","t":"4.5 Controllo dell’informazione documentata (M7.5)"},{"k":"t","r":[["Rif.","Requisito (M7.5)","Modalità operative"],["a)","Disponibile e adeguata","Sistema centralizzato e sicuro dove tutte le politiche, procedure e registrazioni sono conservate e accessibili al personale autorizzato; diritti di accesso definiti per ruolo; traduzione dei documenti chiave nelle lingue del personale e versioni accessibili (visive, audio, semplificate)."],["b)","Accurata e chiara","Revisione dei documenti a intervalli definiti per verificare accuratezza e rilevanza; revisione in linguaggio semplice (plain-language review) ove necessario; canali per lavoratori/stakeholder per segnalare documentazione poco chiara o inaccurata."],["c)","Efficacemente controllata","Approvazione formale (sign-off) prima dell’emissione di documenti nuovi o revisionati; rimozione dei documenti obsoleti dalla circolazione; protezione con password, permessi per ruolo e tutela della privacy per i documenti sensibili; piano di conservazione e archiviazione definito."],["d)","Identificabile","Identificatore univoco: titolo, numero di riferimento, versione, data, autore responsabile; per i sistemi digitali: metadata tag (oggetto, dipartimento, area di rischio, stato); collegamento di ogni documento a processi, date e personale responsabile specifici."]]},{"k":"p","t":"4.5.1 Sistema di codifica"},{"k":"p","t":"L’Organizzazione adotta il seguente sistema di codifica per l’informazione documentata:"},{"k":"t","r":[["Tipo documento","Formato codice","Esempio"],["Procedura","PRO-[NN] – [Titolo]","PRO-07"],["Modulo / Allegato","MOD-[NN].[MM] – [Titolo]","MOD-07.01"],["Istruzione operativa","IO-[NN] – [Titolo]","IO-07"],["Politica","POL-[NN] – [Titolo]","POL-01"],["Registrazione","REG-[NN]-[AAAA] – [Titolo]","REG-07-2026"]]},{"k":"p","t":"4.5.2 Ciclo di vita del documento"},{"k":"p","t":"Redazione: l’autore designato prepara la bozza, verificando accuratezza e chiarezza."},{"k":"p","t":"Revisione: revisione tecnica e plain-language review ove necessario."},{"k":"p","t":"Approvazione: sign-off formale da parte della funzione competente e/o AD."},{"k":"p","t":"Emissione e distribuzione: pubblicazione nel sistema centralizzato; rimozione della versione precedente."},{"k":"p","t":"Comunicazione: notifica al personale interessato dell’aggiornamento."},{"k":"p","t":"Revisione periodica: a intervalli definiti (almeno annuale) o su trigger (cambio normativo, audit, feedback)."},{"k":"p","t":"Archiviazione/eliminazione: secondo il piano di conservazione definito."},{"k":"p","t":"4.6 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Lancio attuazione","Scomposizione azioni in task; riunioni kick-off; assegnazione personale e risorse; avvio.","Resp. SA / Funzioni","Da PRO-06"],["2","Monitoraggio avanzamento","Dashboard MOD-07.01; ispezioni, interviste, revisioni documentali; report periodici.","Resp. SA / SPT","Trimestrale"],["3","Adeguamento piani/risorse","Se necessario: modifica azioni, budget, organico, tempistiche; aggiornamento documentazione.","Resp. SA / AD","Continuo"],["4","Piano sensibilizzazione personale","Preparazione MOD-07.02: calendario formazione, materiali, canali, test. Copertura M7.2 a–g.","Resp. SA / HR","Annuale"],["5","Erogazione informazione al personale","Induction neoassunti; sessioni periodiche; distribuzione materiali; aggiornamento canali.","HR / SPT","Continuo"],["6","Verifica consapevolezza","Survey, quiz, audit per verificare conoscenza diritti, rischi, politiche, canali di reclamo.","Resp. SA / HR","Annuale"],["7","Informazione stakeholder","Pubblicazione rischi, politiche, obiettivi; sessioni informative; test comprensione. MOD-07.03.","Resp. SA / SPT","Per PRO-03"],["8","Gestione BP awareness","Induction nuovi BP; accesso documentazione; webinar; revisione termini commerciali; supporto.","Acquisti / Resp. SA","Continuo"],["9","Controllo informazione documentata","Gestione ciclo di vita documenti; revisione periodica; eliminazione obsoleti; audit documentale.","Resp. SA","Continuo"],["10","Feedback e miglioramento","Lezioni apprese → prossimo ciclo pianificazione; adeguamento campagne; input al RdD.","Resp. SA","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Attuazione (M7.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% processi/azioni lanciati entro le tempistiche previste","N. lanciati in tempo / N. tot. × 100","≥ 90%","Trimestrale"],["% processi/azioni completati entro le tempistiche previste","N. completati in tempo / N. tot. × 100","≥ 85%","Semestrale"],["% fondi allocati effettivamente spesi sulle azioni pianificate","Fondi spesi / Fondi allocati × 100","≥ 80%","Annuale"],["% azioni implementate che raggiungono i risultati previsti","N. efficaci / N. completati × 100","≥ 80%","Annuale"],["N. e gravità delle NC relative ad attuazione incompleta o inefficace","Conteggio + classificazione","Riduzione YoY","Annuale"],["N. adeguamenti a piani/risorse per trimestre","Conteggio","Monitoraggio","Trimestrale"]]},{"k":"p","t":"5.2 Indicatori Consapevolezza del Personale (M7.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale formato in consapevolezza SA8000 negli ultimi 12 mesi","N. formati / N. totale × 100","≥ 95%","Annuale"],["% lavoratori che identificano correttamente specifici diritti del lavoro","Survey/quiz","≥ 80%","Annuale"],["% lavoratori che identificano i rischi rilevanti per il proprio ruolo","Survey/quiz","≥ 80%","Annuale"],["% lavoratori che sanno come presentare un reclamo","Survey","≥ 90%","Annuale"],["% lavoratori che identificano almeno un obiettivo SA8000 corrente","Survey/quiz","≥ 70%","Annuale"],["% aree di pericolo con segnaletica visiva e informazioni sui rischi","Ispezione","100%","Annuale"],["Tempo medio tra cambio normativo e comunicazione al personale","Media giorni","≤ 15 gg","Annuale"],["% lavoratori con conoscenza mantenuta 3 mesi dopo la formazione","Test retention","≥ 70%","Annuale"]]},{"k":"p","t":"5.3 Indicatori Consapevolezza Stakeholder (M7.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% rischi salienti divulgati pubblicamente rispetto a quelli nel registro","N. divulgati / N. registro × 100","≥ 80%","Annuale"],["% stakeholder che confermano di ricevere report di avanzamento","Survey","≥ 70%","Annuale"],["% stakeholder che sanno come accedere ai canali di reclamo/rimedio","Survey","≥ 70%","Annuale"],["N. gruppi stakeholder diversi coinvolti nelle attività di engagement","Conteggio","≥ 4","Annuale"],["N. comunicazioni in lingue locali rese disponibili","Conteggio","≥ nelle lingue necessarie","Annuale"]]},{"k":"p","t":"5.4 Indicatori Interazioni BP (M7.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% BP che hanno ricevuto formazione/induction su politiche e processi","N. formati / N. tot. BP × 100","≥ 90%","Annuale"],["% contratti/relazioni verificati per termini di pagamento, tempi, prezzi equi","N. verificati / N. tot. × 100","100%","Annuale"],["% fatture pagate entro i termini concordati","N. in tempo / N. tot. × 100","≥ 95%","Annuale"],["N. BP che ricevono supporto tecnico/finanziario/formativo","Conteggio","Tutti i BP ad alto rischio","Annuale"],["% disengagement con protocollo di escalation rispettato","N. con protocollo / N. tot. diseng. × 100","100%","Per evento"],["% disengagement con valutazione rischi documentata","N. con valutazione / N. tot. × 100","100%","Per evento"]]},{"k":"p","t":"5.5 Indicatori Informazione Documentata (M7.5)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% documenti chiave disponibili in tutte le lingue necessarie e formati accessibili","N. completi / N. chiave × 100","100%","Annuale"],["N. documenti obsoleti o non validi trovati durante gli audit","Conteggio","0","Per audit"],["% personale campione che localizza la documentazione entro il tempo definito","Test campionario","≥ 90%","Annuale"],["% inaccuratezze/documenti poco chiari corretti entro il tempo definito","N. corretti / N. segnalati × 100","100%","Annuale"],["% documenti digitali con metadata tag richiesti","N. taggati / N. digitali × 100","100%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-07.01","Dashboard Attuazione Processi e Azioni","Registro dello stato di ogni processo/azione: non avviato, in corso, completato, in ritardo; risorse impiegate; KPI."],["MOD-07.02","Piano Annuale di Sensibilizzazione del Personale","Calendario: temi M7.2 a–g, destinatari, canali, materiali, lingue, frequenza, responsabile, test verifica."],["MOD-07.03","Registro Comunicazioni agli Stakeholder","Log: stakeholder, tema comunicato, canale, data, lingua, conferma ricezione, feedback ricevuto."],["MOD-07.04","Checklist Consapevolezza BP (M7.4)","Verifica per ogni BP: induction, accesso documentazione, termini equi, supporto, oneri, escalation."],["MOD-07.05","Registro Master Informazione Documentata (M7.5)","Elenco di tutti i documenti: codice, titolo, versione, data, autore, stato, accessibilità, piano revisione."],["MOD-07.06","Report Annuale Consapevolezza e Attuazione","Valutazione annuale: KPI M7.1–7.5, analisi risultati test consapevolezza, gap, raccomandazioni."]]},{"k":"p","t":"Conservazione: tutti i registri per almeno 5 anni; storico delle versioni documentali per tutta la durata della certificazione."},{"k":"p","t":"Accesso garantito a AD, Resp. SA, SPT e terze parti autorizzate (auditor, SAI) ai sensi di M8.3."}]},"PRO-08":{"code":"PRO-08","blocks":[{"k":"t","r":[["PROCEDURA PRO-08"],["Codice:","PRO-08","Revisione:","01"],["Titolo:","INTEGRITÀ E TRASPARENZA"],["Criteri SA8000:","M8.1–8.3","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire che l’Organizzazione operi e comunichi con integrità, renda conto pubblicamente dei propri processi e risultati relativi allo Standard, e interagisca in modo trasparente e aperto con le terze parti autorizzate, in conformità ai criteri M8.1–8.3 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione operi e comunichi con integrità, prevenendo falsificazione, manipolazione, occultamento di registrazioni e interferenze negli audit, e garantendo meccanismi di segnalazione (whistleblowing) con protezione dalla ritorsione (M8.1)."},{"k":"p","t":"L’Organizzazione renda conto periodicamente e pubblicamente dei propri processi e risultati in modo trasparente, veritiero, chiaro, rispondente alle esigenze degli stakeholder, inclusivo della politica, delle operazioni, dei rischi, dei reclami, dei requisiti legali, e accessibile (M8.2 a–h)."},{"k":"p","t
