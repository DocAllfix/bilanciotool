<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema di gestione SA8000:2026</title>
<style>
:root{
  --pri:#2F5D7C;--pri-dk:#1E4258;--pri-lt:#E7EFF4;--pri-mid:#4F87A9;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

</style>
</head>

Library V1.0, Sezione M10"},{"k":"p","t":"Manuale del Sistema di Gestione SA8000:2026 dell’Organizzazione"},{"k":"p","t":"PRO-05 – Valutazione dei Rischi e Due Diligence"},{"k":"p","t":"PRO-06 – Pianificazione e Gestione Obiettivi"},{"k":"p","t":"PRO-11 – Monitoraggio e Audit Interno"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"PRO-15 – Miglioramento Continuo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["AD","Alta Direzione – Organo/i decisionale/i di più alto livello dell’Organizzazione."],["Resp. SA","Responsabile SA8000 – Rappresentante senior designato per il coordinamento del sistema di gestione."],["SPT","Social Performance Team – Team bilanciato di lavoratori e management per la gestione delle prestazioni sociali."],["RdD","Riesame della Direzione – Processo di analisi strategica e revisione periodica del sistema di gestione da parte dell’Alta Direzione."],["KPI","Key Performance Indicator – Indicatore chiave di prestazione."],["AC/AP/AR","Azione Correttiva / Azione Preventiva / Azione di Rimedio."],["CCNL","Contratto Collettivo Nazionale di Lavoro."],["NC","Non Conformità – Mancato soddisfacimento di un requisito."],["Living Wage","Salario dignitoso – Retribuzione sufficiente a garantire un tenore di vita dignitoso."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"p","t":"La seguente matrice RACI definisce le responsabilità per ciascuna fase del processo di Riesame della Direzione:"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","Manager","Lavoratori"],["Pianificazione del calendario RdD","A","R","C","I"],["Raccolta e preparazione dati di input","I","R","C"],["Preparazione del pacchetto informativo","I","R","C","I"],["Conduzione del Riesame","A/R","R","C","I"],["Valutazione dei progressi sugli obiettivi","A","R","C"],["Decisioni su azioni e risorse","A/R","R","C","I"],["Redazione verbale del Riesame","A","R","C","I"],["Firma e approvazione del verbale","A/R","R","I"],["Comunicazione degli esiti","A","R","I"],["Follow-up e verifica attuazione","I","A/R","R","C"]]},{"k":"p","t":"Legenda: R = Responsabile (esegue), A = Accountable (approva/risponde), C = Consultato, I = Informato"},{"k":"p","t":"3.1 Dettaglio delle responsabilità"},{"k":"p","t":"Alta Direzione (AD)"},{"k":"p","t":"Presiede e conduce il Riesame della Direzione."},{"k":"p","t":"Approva e firma il verbale del riesame."},{"k":"p","t":"Assume le decisioni su modifiche a politiche, risorse, obiettivi, processi e azioni."},{"k":"p","t":"Garantisce che gli output del riesame informino la strategia organizzativa."},{"k":"p","t":"Responsabile SA8000 (Resp. SA)"},{"k":"p","t":"Pianifica il calendario e convoca le riunioni di riesame."},{"k":"p","t":"Raccoglie, consolida e sintetizza tutti gli input richiesti da M10.2."},{"k":"p","t":"Prepara il pacchetto informativo (review pack) per i partecipanti."},{"k":"p","t":"Redige il verbale del riesame (MOD-01.01)."},{"k":"p","t":"Coordina il follow-up delle decisioni e monitora l’attuazione delle azioni deliberate."},{"k":"p","t":"Social Performance Team (SPT)"},{"k":"p","t":"Contribuisce alla raccolta dei dati sulle prestazioni sociali e sui meccanismi di reclamo."},{"k":"p","t":"Partecipa al riesame in qualità di consulente, portando la prospettiva dei lavoratori."},{"k":"p","t":"Supporta la comunicazione degli esiti del riesame al personale."},{"k":"p","t":"Responsabili di Funzione / Manager"},{"k":"p","t":"Forniscono i dati e le informazioni relativi alla propria area (HR, Produzione, Acquisti, H&S, ecc.)."},{"k":"p","t":"Attuano le azioni deliberate nel riesame per la propria area di competenza."},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Frequenza e pianificazione"},{"k":"p","t":"Il Riesame della Direzione è condotto con la seguente periodicità:"},{"k":"t","r":[["Tipo di Riesame","Frequenza","Periodo indicativo"],["Riesame completo (annuale)","Almeno 1 volta/anno","[Mese] di ogni anno"],["Riesame intermedio","Almeno 1 volta ogni 6 mesi","[Mese] e [Mese]"],["Riesame straordinario","Su necessità","Entro 15 gg dall’evento"]]},{"k":"p","t":"Il Riesame straordinario è convocato in caso di: incidenti gravi relativi ai diritti dei lavoratori; risultati critici di audit interni o esterni; cambiamenti significativi nel contesto organizzativo, normativo o di mercato; reclami gravi da parte di lavoratori o stakeholder; richieste dell’ente di certificazione."},{"k":"p","t":"Il Responsabile SA8000 predispone entro [Mese] di ogni anno il calendario annuale dei riesami (MOD-01.02), integrandolo con i cicli di pianificazione aziendale e i cicli di audit, e lo sottopone all’Alta Direzione per approvazione."},{"k":"p","t":"4.2 Elementi in ingresso (Input del Riesame) – M10.2"},{"k":"p","t":"In conformità al criterio M10.2, il riesame deve incorporare informazioni da molteplici fonti. Il Responsabile SA8000 raccoglie e consolida i seguenti input in un pacchetto informativo (Review Pack) da distribuire ai partecipanti almeno 7 giorni lavorativi prima della riunione:"},{"k":"t","r":[["#","Fonte informativa (M10.2)","Contenuto","Responsabile raccolta","Rif. doc."],["a)","Valutazione e prioritizzazione dei rischi","Registro rischi aggiornato; variazioni di priorità; nuovi rischi emersi; sviluppi settoriali e globali.","Resp. SA / SPT","PRO-05"],["b)","Processi di monitoraggio","Risultati M9.1–9.2: KPI, indicatori, metriche; stato implementazione azioni pianificate; aderenza allo Standard.","Resp. SA","PRO-11"],["c)","Meccanismi di reclamo interni ed esterni","Statistiche reclami: tipologia, frequenza, tassi di risoluzione, temi ricorrenti, casi di ritorsione.","SPT / Resp. SA","PRO-12/13"],["d)","Comunicazione e coinvolgimento dei lavoratori","Verbali SPT; risultati survey lavoratori; suggerimenti e feedback ricevuti; partecipazione alle iniziative.","SPT / HR","PRO-02"],["e)","Reclami e preoccupazioni degli stakeholder","Sintesi segnalazioni da ONG, clienti, comunità locali, investitori; risposte fornite; livello di fiducia.","Resp. SA","PRO-03"],["f)","Dialogo sociale e accordi vincolanti","Stato di conformità ai CCNL e accordi settoriali/tripartiti; esiti del dialogo con sindacati e RSL.","HR / Legale","PRO-17"],["g)","Fonti pubbliche di informazione","Notizie, report ONG, avvisi normativi su diritti umani, salute e sicurezza; benchmark di settore.","Resp. SA","N/A"],["h)","Audit interni ed esterni","Risultati audit interni (NC, osservazioni, raccomandazioni); risultati audit di certificazione; ispezioni.","Resp. SA / Auditor","PRO-11"],["i)","Esperti esterni","Raccomandazioni di consulenti, studi di terze parti (es. valutazioni salariali), ricerche accademiche.","Resp. SA","N/A"]]},{"k":"p","t":"4.3 Conduzione del Riesame – M10.1"},{"k":"p","t":"Il Riesame della Direzione è condotto dall’Alta Direzione con la partecipazione delle funzioni chiave. La riunione segue un ordine del giorno strutturato che copre almeno i seguenti punti di valutazione richiesti dal criterio M10.1:"},{"k":"p","t":"4.3.1 Progressi verso gli obiettivi (M10.1a)"},{"k":"p","t":"Confronto tra risultati effettivi e obiettivi pianificati (per ciascun obiettivo SA8000 e organizzativo)."},{"k":"p","t":"Analisi delle ragioni degli scostamenti (vincoli di risorse, debolezze procedurali, fattori esterni)."},{"k":"p","t":"Aggiornamento degli obiettivi quando consistentemente mancati o raggiunti anticipatamente."},{"k":"p","t":"Esame del tracker live degli obiettivi con indicazione dello stato di avanzamento."},{"k":"p","t":"4.3.2 Efficacia delle azioni e dei processi (M10.1b)"},{"k":"p","t":"Valutazione delle azioni correttive, preventive e di rimedio: hanno eliminato o ridotto gli impatti?"},{"k":"p","t":"Raccolta del feedback dei lavoratori e degli stakeholder sull’efficacia delle azioni intraprese."},{"k":"p","t":"Coinvolgimento delle funzioni HR, Acquisti, Produzione e dei comitati dei lavoratori nella valutazione."},{"k":"p","t":"4.3.3 Adeguatezza e appropriatezza di azioni, processi e risorse (M10.1c)"},{"k":"p","t":"Verifica dell’adeguatezza delle risorse finanziarie, umane, materiali e informative allocate."},{"k":"p","t":"Valutazione delle competenze del personale coinvolto nel sistema di gestione."},{"k":"p","t":"Verifica dell’allineamento delle capacità dei partner commerciali con le aspettative reciproche."},{"k":"p","t":"4.3.4 Efficacia del sistema di gestione (M10.1d)"},{"k":"p","t":"Esame dei risultati degli audit interni (M9.1): non conformità, problemi ricorrenti."},{"k":"p","t":"Valutazione dell’utilizzo, del livello di fiducia e dell’efficacia dei canali di reclamo."},{"k":"p","t":"Verifica dell’allineamento di politiche, processi, ruoli e documentazione con la struttura SA8000:2026."},{"k":"p","t":"Confronto con best practice esterne e benchmark di settore."},{"k":"p","t":"4.3.5 Opportunità di miglioramento (M10.1e)"},{"k":"p","t":"Analisi dei dati di lungo termine (reclami, audit, KPI) per identificare trend ricorrenti o positivi da consolidare."},{"k":"p","t":"Raccolta e registrazione delle opportunità di miglioramento nel registro dedicato."},{"k":"p","t":"Identificazione di iniziative per migliorare le condizioni di lavoro oltre i requisiti minimi dello Standard."},{"k":"p","t":"Proposte per aumentare il coinvolgimento di lavoratori e stakeholder nel sistema di gestione."},{"k":"p","t":"4.4 Elementi in uscita (Output del Riesame) – M10.3"},{"k":"p","t":"Gli output del riesame sono formalizzati nel verbale (MOD-01.01) e devono, come minimo:"},{"k":"p","t":"4.4.1 Informare la valutazione dei rischi e il monitoraggio (M10.3a)"},{"k":"p","t":"Aggiornamento del registro dei rischi con nuove evidenze, rischi emergenti e riclassificazione delle priorità."},{"k":"p","t":"Ricalcolo dei rating di rischio (gravità × probabilità) sulla base delle risultanze del riesame."},{"k":"p","t":"Adeguamento della frequenza, dell’ambito e degli indicatori di monitoraggio in funzione dei rischi rivisti."},{"k":"p","t":"4.4.2 Informare la strategia e i processi decisionali (M10.3b)"},{"k":"p","t":"Sessioni strutturate con la leadership, i rappresentanti dei lavoratori e le funzioni chiave per allineare i risultati del riesame con la strategia aziendale."},{"k":"p","t":"Integrazione delle risultanze nel ciclo di pianificazione strategica e di budget annuale."},{"k":"p","t":"Escalation dei rischi gravi per i diritti umani all’organo decisionale di più alto livello."},{"k":"p","t":"Utilizzo delle evidenze del riesame per rivalutare le relazioni con partner commerciali, settori o aree geografiche di approvvigionamento."},{"k":"p","t":"4.4.3 Portare a modifiche di politiche, risorse, obiettivi, processi e azioni (M10.3c)"},{"k":"p","t":"Aggiornamento delle politiche quando le risultanze rivelano disallineamenti o nuovi rischi."},{"k":"p","t":"Riallocazione di budget, personale o infrastrutture per le aree identificate come sottorisorsate."},{"k":"p","t":"Aggiornamento degli obiettivi organizzativi (M6.1) con nuove priorità, tempistiche e target misurabili."},{"k":"p","t":"Modifica dei flussi di lavoro e delle procedure sulla base delle evidenze del riesame."},{"k":"p","t":"Integrazione di tutte le azioni post-riesame nel sistema di tracciamento delle azioni correttive, preventive e di rimedio."},{"k":"p","t":"4.5 Flusso del processo di Riesame della Direzione"},{"k":"p","t":"Il processo si articola nelle seguenti fasi:"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Pianificazione","Definizione del calendario annuale; integrazione con cicli di audit e budget; approvazione AD.","Resp. SA / AD","Entro Gen."],["2","Convocazione","Invio convocazione con OdG e richiesta dati ai partecipanti almeno 15 gg prima.","Resp. SA","-15 gg"],["3","Raccolta input","Raccolta sistematica delle 9 fonti informative (M10.2 a–i); richiesta contributi alle funzioni.","Resp. SA / Funz.","-15 a -7 gg"],["4","Review Pack","Consolidamento dati nel pacchetto informativo; analisi preliminare; distribuzione ai partecipanti.","Resp. SA","-7 gg"],["5","Riunione RdD","Conduzione del riesame secondo OdG; valutazione dei 5 punti M10.1 (a–e); delibere.","AD / Resp. SA","Data RdD"],["6","Verbale","Redazione del verbale (MOD-01.01) con tutti gli output richiesti; firma AD.","Resp. SA / AD","+5 gg"],["7","Comunicazione","Diffusione degli esiti al personale tramite briefing, newsletter, bacheche, SPT; in formato accessibile.","Resp. SA / SPT","+10 gg"],["8","Attuazione","Implementazione delle azioni deliberate; aggiornamento registri rischi, obiettivi, politiche.","Manager / Resp.","Secondo piano"],["9","Follow-up","Verifica dello stato di attuazione delle delibere; report alla riunione successiva.","Resp. SA","Continuo"]]},{"k":"p","t":"4.6 Ordine del giorno tipo del Riesame della Direzione"},{"k":"p","t":"Il seguente schema rappresenta l’ordine del giorno standard per il Riesame completo annuale. Per i riesami intermedi, i punti possono essere selezionati in base alle priorità."},{"k":"t","r":[["#","Punto all’ordine del giorno","Rif. SA8000","Durata ind."],["1","Apertura e verifica del quorum","–","5 min"],["2","Verifica dello stato delle azioni deliberate nel riesame precedente","M10.1","15 min"],["3","Presentazione del contesto: evoluzione rischi, cambiamenti normativi, di mercato e organizzativi","M10.2a, g","15 min"],["4","Analisi dei risultati di monitoraggio e dei KPI per area D1–D7","M10.1a, M10.2b","20 min"],["5","Analisi dei risultati degli audit interni ed esterni","M10.1b,d, M10.2h","15 min"],["6","Analisi dei meccanismi di reclamo: statistiche, trend, efficacia","M10.1b, M10.2c","15 min"],["7","Coinvolgimento lavoratori e dialogo sociale: contributi SPT, sindacati, survey","M10.2d, f","15 min"],["8","Stakeholder engagement: feedback, preoccupazioni, report esperti esterni","M10.2e, i","10 min"],["9","Valutazione dell’adeguatezza delle risorse (finanziarie, umane, competenze)","M10.1c","10 min"],["10","Efficacia del sistema di gestione: coerenza, allineamento, benchmark","M10.1d","10 min"],["11","Opportunità di miglioramento e iniziative oltre la conformità","M10.1e","15 min"],["12","Delibere: aggiornamento politiche, obiettivi, risorse, processi, azioni","M10.3a,b,c","20 min"],["13","Chiusura: riepilogo decisioni, responsabilità, scadenze","–","10 min"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"I seguenti indicatori, derivati dall’Indicator Library SA8000:2026, misurano l’efficacia del processo di Riesame della Direzione:"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% riesami pianificati completati entro le scadenze previste","N. completati / N. pianificati × 100","100%","Annuale"],["% partecipanti richiesti presenti (AD, rappresentanti lavoratori, funzioni chiave)","N. presenti / N. convocati × 100","≥ 80%","Per riesame"],["% delle 9 fonti informative (a–i) incorporate nel riesame","N. fonti utilizzate / 9 × 100","≥ 90%","Per riesame"],["% azioni dal riesame precedente confermate come completate","N. completate / N. deliberate × 100","≥ 85%","Per riesame"],["% verbali che documentano tutti i punti richiesti (M10.1 a–e)","Verifica sezioni verbale","100%","Per riesame"],["% obiettivi SA8000 raggiunti o superati nel periodo","N. raggiunti / N. totali × 100","≥ 75%","Annuale"],["% obiettivi non raggiunti con analisi cause radice e AC assegnate","N. analizzati / N. non raggiunti × 100","100%","Annuale"],["% AC valutate come efficaci sulla base del feedback lavoratori/stakeholder","N. efficaci / N. valutate × 100","≥ 80%","Annuale"],["% problemi ricorrenti nelle successive riunioni di riesame","N. ricorrenti / N. totali × 100","≤ 15%","Annuale"],["N. nuove opportunità di miglioramento identificate per riesame","Conteggio dal verbale","≥ 3","Per riesame"],["% delibere del riesame che portano ad azioni concrete e tracciabili","N. con azioni / N. delibere × 100","≥ 90%","Per riesame"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-01.01","Verbale di Riesame della Direzione","Modulo per la registrazione delle risultanze, decisioni e azioni deliberate durante il riesame."],["MOD-01.02","Calendario Annuale dei Riesami","Pianificazione annuale delle date, dei partecipanti e degli argomenti principali dei riesami."],["MOD-01.03","Checklist Input Riesame (Review Pack)","Checklist per la raccolta sistematica delle 9 fonti informative M10.2 (a–i)."],["MOD-01.04","Registro Opportunità di Miglioramento","Log delle opportunità di miglioramento identificate, azioni intraprese e follow-up."],["MOD-01.05","Tracker Azioni Post-Riesame","Registro per il tracciamento delle azioni deliberate, responsabilità, scadenze e stato."],["MOD-01.06","Comunicazione Esiti Riesame","Template per la sintesi degli esiti da comunicare al personale in formato accessibile."]]},{"k":"p","t":"6.2 Conservazione e accesso"},{"k":"p","t":"I verbali del Riesame della Direzione sono conservati per almeno 5 anni (o secondo la politica di conservazione documentale dell’Organizzazione)."},{"k":"p","t":"I verbali originali firmati sono archiviati dal Responsabile SA8000 nel sistema documentale dell’Organizzazione."},{"k":"p","t":"L’accesso ai verbali è garantito all’Alta Direzione, al Responsabile SA8000, allo SPT e, su richiesta motivata, alle terze parti autorizzate (auditor, SAI) in conformità al criterio M8.3."},{"k":"p","t":"Le sintesi degli esiti sono rese accessibili a tutto il personale in formati e lingue comprensibili."}]},"PRO-02":{"code":"PRO-02","blocks":[{"k":"t","r":[["PROCEDURA PRO-02"],["Codice:","PRO-02","Revisione:","01"],["Titolo:","COINVOLGIMENTO DEI LAVORATORI E SOCIAL PERFORMANCE TEAM"],["Criteri SA8000:","M2.1–2.4","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire il coinvolgimento attivo e significativo dei lavoratori, dei sindacati e dei rappresentanti dei lavoratori nello sviluppo e nell’implementazione del Sistema di Gestione SA8000:2026, nonché per l’istituzione, il funzionamento e il monitoraggio dei Social Performance Team (SPT), in conformità ai criteri M2.1–2.4 dello Standard."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"I lavoratori siano coinvolti in modo significativo nella definizione delle politiche, nell’identificazione dei rischi, nella pianificazione degli obiettivi, nel monitoraggio delle prestazioni, nella progettazione dei meccanismi di reclamo e nella determinazione dei rimedi (M2.1)."},{"k":"p","t":"L’Organizzazione collabori con i sindacati presenti per garantire il coinvolgimento dei lavoratori (M2.2)."},{"k":"p","t":"I lavoratori abbiano accesso a canali di comunicazione e coinvolgimento efficaci, inclusivi, riservati e protetti da ritorsioni (M2.3)."},{"k":"p","t":"Siano istituiti Social Performance Team con rappresentanza bilanciata, elezione indipendente dei partecipanti lavoratori e integrazione nelle funzioni chiave del sistema di gestione (M2.4)."},{"k":"p","t":"1.2 Campo di applicazione"},{"k":"p","t":"La procedura si applica a tutto il personale dell’Organizzazione, inclusi lavoratori a tempo indeterminato, determinato, interinali, stagionali, apprendisti e tirocinanti, in tutti i siti operativi. Si estende alle interazioni con i sindacati presenti, le organizzazioni dei lavoratori e i rappresentanti eletti."},{"k":"p","t":"1.3 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M2.1–2.4"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M2"},{"k":"p","t":"Manuale del Sistema di Gestione SA8000:2026 dell’Organizzazione"},{"k":"p","t":"PRO-01 – Riesame della Direzione (input dal SPT)"},{"k":"p","t":"PRO-03 – Engagement degli Stakeholder"},{"k":"p","t":"PRO-04 – Gestione della Politica (coinvolgimento nella definizione)"},{"k":"p","t":"PRO-05 – Valutazione dei Rischi e Due Diligence (coinvolgimento lavoratori)"},{"k":"p","t":"PRO-12 – Meccanismo di Reclamo Interno"},{"k":"p","t":"PRO-17 – Libertà di Associazione e Contrattazione"},{"k":"p","t":"Convenzione OIL n. 87 (Libertà sindacale) e n. 98 (Diritto di contrattazione collettiva)"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["SPT","Social Performance Team – Team bilanciato di lavoratori e management istituito per supportare e facilitare il sistema di gestione SA8000 (M2.4)."],["RSL","Rappresentanti dei Lavoratori per la Sicurezza e/o Rappresentanza Sindacale."],["OO.SS.","Organizzazioni Sindacali presenti in azienda."],["Coinvolgimento significativo","Partecipazione attiva dei lavoratori che influenza concretamente i processi decisionali, con feedback documentato e risposte tracciate."],["Elezione paritaria","Processo elettorale indipendente in cui i lavoratori eleggono i propri rappresentanti nel SPT senza interferenze del management."],["Canale di coinvolgimento","Mezzo strutturato attraverso cui i lavoratori forniscono input, feedback e segnalazioni (cassette suggerimenti, survey, focus group, app digitali, riunioni, ecc.)."],["Non ritorsione","Garanzia che nessun lavoratore subirà conseguenze negative per aver partecipato ai processi di coinvolgimento o per aver espresso opinioni."],["AD","Alta Direzione."],["Resp. SA","Responsabile SA8000."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"p","t":"La seguente matrice RACI definisce le responsabilità per le attività principali della presente procedura:"},{"k":"t","r":[["Attività","AD","Resp. SA","HR","SPT","OO.SS.","Lavoratori"],["Istituzione del SPT","A","R","–","C","I"],["Organizzazione elezioni SPT","I","R","–","C","R"],["Definizione Statuto SPT","A","R","C","R","C","I"],["Riunioni periodiche SPT","I","R","C","R","C","I"],["Coinvolgimento nella definizione politiche","A","R","C","R","C"],["Coinvolgimento nella valutazione rischi","A","R","C","R","C"],["Coinvolgimento nel monitoraggio","I","R","C","R","C"],["Gestione canali di comunicazione","A","R","C","R"],["Survey e focus group periodici","I","R","C","R"],["Collaborazione con sindacati","A","R","C","R","I"],["Comunicazione esiti al personale","I","R","C","I"],["Valutazione efficacia coinvolgimento","A","R","C","R","C"]]},{"k":"p","t":"Legenda: R = Responsabile (esegue), A = Accountable (approva/risponde), C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Istituzione e composizione del Social Performance Team (M2.4)"},{"k":"p","t":"4.1.1 Composizione e requisiti"},{"k":"p","t":"L’Organizzazione istituisce uno o più Social Performance Team (SPT) che soddisfino i seguenti requisiti:"},{"k":"p","t":"Rappresentanza bilanciata di lavoratori e management (almeno 50% lavoratori)."},{"k":"p","t":"Rappresentatività delle diverse categorie demografiche del personale (genere, età, nazionalità, tipologia contrattuale, turno di lavoro, reparto)."},{"k":"p","t":"Rappresentanza delle funzioni organizzative chiave: HR, Produzione, Salute e Sicurezza, Acquisti, Compliance."},{"k":"p","t":"Inclusione dei sindacati e delle organizzazioni dei lavoratori presenti, se scelgono di aderire (invito formale obbligatorio)."},{"k":"p","t":"Designazione di un coordinatore (Resp. SA o altro membro senior) per la convocazione e la facilitazione delle riunioni."},{"k":"p","t":"Numero minimo di membri: [N] (da definire in base alla dimensione dell’Organizzazione), con composizione documentata nello Statuto SPT (MOD-02.01)."},{"k":"p","t":"4.1.2 Elezione dei rappresentanti dei lavoratori (M2.4c)"},{"k":"p","t":"L’elezione dei rappresentanti dei lavoratori nel SPT avviene con le seguenti garanzie:"},{"k":"p","t":"Comunicazione a tutto il personale dell’apertura delle candidature almeno 15 giorni prima dell’elezione, tramite bacheche, email e briefing di reparto."},{"k":"p","t":"Candidature libere e volontarie, aperte a tutti i lavoratori senza discriminazione."},{"k":"p","t":"Processo elettorale supervisionato da un soggetto neutrale (sindacato, ONG, consulente esterno o comitato indipendente)."},{"k":"p","t":"Voto a scrutinio segreto (scheda cartacea o piattaforma digitale sicura)."},{"k":"p","t":"Pubblicazione dei risultati in modo accessibile a tutti i lavoratori."},{"k":"p","t":"Mandato di durata [12/24] mesi con possibilità di rielezione e limiti di mandato per favorire la rotazione."},{"k":"p","t":"Documentazione del processo nel verbale di elezione (MOD-02.02)."},{"k":"p","t":"4.1.3 Statuto del SPT (MOD-02.01)"},{"k":"p","t":"Il SPT opera sulla base di uno Statuto formale che definisce:"},{"k":"p","t":"Mandato, autorità, ambito di competenza e protezioni per i rappresentanti."},{"k":"p","t":"Composizione, criteri di rappresentatività e processo di rotazione."},{"k":"p","t":"Frequenza minima delle riunioni (almeno mensile)."},{"k":"p","t":"Modalità di definizione dell’ordine del giorno (entrambe le parti possono proporre punti)."},{"k":"p","t":"Obblighi di documentazione (verbali, registro presenze, action log)."},{"k":"p","t":"Separazione chiara tra funzioni del sistema di gestione e materie di contrattazione collettiva (M2.4d)."},{"k":"p","t":"Protezione dei membri da ritorsioni e garanzia di tempo retribuito per le attività SPT."},{"k":"p","t":"4.2 Funzionamento del Social Performance Team"},{"k":"p","t":"4.2.1 Riunioni periodiche"},{"k":"p","t":"Il SPT si riunisce con la seguente periodicità minima:"},{"k":"t","r":[["Tipo riunione","Frequenza","Durata indicativa","Partecipanti"],["Riunione ordinaria","Mensile","1–2 ore","Tutti i membri SPT"],["Riunione straordinaria","Su necessità","Variabile","Membri + invitati"],["Sessione di lavoro tematica","Trimestrale","2–4 ore","Sottogruppo SPT + esperti"],["Riunione congiunta con AD","Semestrale","1–2 ore","SPT + Alta Direzione"]]},{"k":"p","t":"4.2.2 Ordine del giorno e verbali"},{"k":"p","t":"L’ordine del giorno è predisposto dal coordinatore con i contributi di tutti i membri (sia management sia lavoratori) almeno 5 giorni lavorativi prima."},{"k":"p","t":"Ogni riunione produce un verbale (MOD-02.03) che documenta: presenze, punti discussi, input dei lavoratori, decisioni prese, azioni assegnate con responsabile e scadenza."},{"k":"p","t":"I verbali sono resi disponibili a tutto il personale in formato accessibile (bacheca, intranet, newsletter) entro 5 giorni lavorativi."},{"k":"p","t":"Un action log pubblico (MOD-02.04) traccia lo stato delle azioni e dei follow-up."},{"k":"p","t":"4.2.3 Funzioni chiave del SPT nel sistema di gestione (M2.4e)"},{"k":"p","t":"Il SPT è coinvolto attivamente nelle seguenti funzioni del sistema di gestione:"},{"k":"t","r":[["Funzione","Attività del SPT","Rif. Procedura"],["Definizione delle politiche","Revisione bozze di politiche; sessioni focus group per testare chiarezza e rilevanza; raccolta feedback lavoratori.","PRO-04"],["Identificazione e valutazione rischi","Sessioni partecipative di risk mapping; survey anonimi; integrazione dei rischi segnalati dai lavoratori nel registro.","PRO-05"],["Pianificazione obiettivi","Partecipazione ai workshop di pianificazione; proposta di obiettivi dal punto di vista dei lavoratori; validazione dei target.","PRO-06"],["Monitoraggio prestazioni","Partecipazione ai team di monitoraggio (walkthroughs, interviste, spot check); revisione congiunta dei KPI.","PRO-11"],["Progettazione meccanismi di reclamo","Co-progettazione dei canali di reclamo; test di usabilità; valutazione del livello di fiducia; revisione delle procedure.","PRO-12/13"],["Determinazione rimedi","Partecipazione all’analisi delle cause radice; proposta di azioni correttive; valutazione se il danno è stato riparato.","PRO-14"]]},{"k":"p","t":"4.3 Coinvolgimento dei lavoratori nel sistema di gestione (M2.1)"},{"k":"p","t":"Oltre alla partecipazione attraverso il SPT, l’Organizzazione attiva i seguenti meccanismi di coinvolgimento diretto dei lavoratori nelle sei funzioni chiave richieste dal criterio M2.1:"},{"k":"p","t":"4.3.1 Strumenti di coinvolgimento"},{"k":"t","r":[["Strumento","Descrizione","Frequenza","Responsabile"],["Survey anonimi","Questionari strutturati su condizioni di lavoro, diritti, sicurezza, reclami, fiducia nei canali.","Annuale (min.)","Resp. SA / HR"],["Focus group","Sessioni con gruppi omogenei (turni, genere, contratto, nazionalità) per raccogliere input qualitativi.","Semestrale","SPT / HR"],["Cassetta suggerimenti","Cassette fisiche sigillate e/o portale digitale per suggerimenti anonimi.","Continuo","SPT"],["Town hall / Assemblee","Incontri aperti in cui la direzione presenta risultati e i lavoratori pongono domande e proposte.","Semestrale","AD / Resp. SA"],["Comitato congiunto lavoratori-management","Riunioni periodiche dove i lavoratori propongono punti all’ordine del giorno.","Mensile","SPT / HR"],["Canali digitali","App aziendali, SMS, piattaforme di messaggistica per feedback in tempo reale.","Continuo","IT / Resp. SA"],["Interviste individuali","Colloqui one-to-one per lavoratori che preferiscono la riservatezza, in luogo neutro.","Su richiesta","SPT / Consulente"]]},{"k":"p","t":"4.3.2 Garanzie per il coinvolgimento (M2.3)"},{"k":"p","t":"Tutti i canali e gli strumenti di coinvolgimento soddisfano i seguenti requisiti minimi:"},{"k":"p","t":"Ricerca attiva dell’input e del feedback dei lavoratori: l’Organizzazione non attende passivamente ma promuove attivamente la partecipazione."},{"k":"p","t":"Rappresentanza degli interessi: i lavoratori possono rappresentare i propri interessi presso il management."},{"k":"p","t":"Mezzi diversificati e convenienza: più canali (fisici, digitali, orali, scritti) programmati su turni diversi e orari accessibili."},{"k":"p","t":"Rappresentatività demografica: quote o target di rappresentanza per genere, nazionalità, tipologia contrattuale, reparto."},{"k":"p","t":"Accessibilità universale: materiali tradotti nelle lingue del personale, formati audio/visivi per diversi livelli di alfabetizzazione, sedi fisicamente accessibili."},{"k":"p","t":"Fiducia e utilizzo attivo: condivisione di casi studio su come l’input dei lavoratori ha migliorato le condizioni; facilitatori terzi per temi sensibili."},{"k":"p","t":"Riservatezza: hotline di terze parti, cassette sigillate, strumenti digitali criptati, colloqui individuali in luogo neutro."},{"k":"p","t":"Allineamento con interessi dei lavoratori: prioritizzazione dei temi sollevati dai lavoratori nei comitati e nelle riunioni."},{"k":"p","t":"Non ritorsione: politica di non ritorsione comunicata; supervisione congiunta con sindacati; canale di segnalazione di ritorsioni."},{"k":"p","t":"4.4 Collaborazione con i sindacati (M2.2)"},{"k":"p","t":"Dove sono presenti organizzazioni sindacali, l’Organizzazione attiva i seguenti processi di collaborazione:"},{"k":"p","t":"Istituzione di un consiglio consultivo congiunto management-sindacati con riunioni a cadenza almeno trimestrale per co-riesaminare politiche, rischi e obiettivi."},{"k":"p","t":"Condivisione preventiva delle bozze di politiche, valutazioni dei rischi e report sulle prestazioni ai sindacati con tempo sufficiente per la consultazione dei lavoratori."},{"k":"p","t":"Inclusione dei rappresentanti sindacali nelle sessioni di valutazione dei rischi e nella prioritizzazione delle problematiche."},{"k":"p","t":"Coinvolgimento dei sindacati nella progettazione e nel test dei canali di reclamo per garantirne usabilità e affidabilità."},{"k":"p","t":"Definizione di protocolli per l’escalation dei reclami tra gestione interna e processi guidati dai sindacati."},{"k":"p","t":"Partecipazione dei rappresentanti sindacali agli audit interni."},{"k":"p","t":"Dashboard condivise dove sindacati e management monitorano i KPI chiave."},{"k":"p","t":"Coinvolgimento dei sindacati nell’analisi delle cause radice e nella proposta di rimedi per le non conformità."},{"k":"p","t":"Raccolta del feedback dei lavoratori tramite i sindacati per valutare l’adeguatezza dei rimedi."},{"k":"p","t":"Formazione congiunta ai rappresentanti sindacali sullo Standard SA8000:2026 e sul sistema di gestione dell’Organizzazione."},{"k":"p","t":"4.4.1 Garanzia di non interferenza (M2.4d)"},{"k":"p","t":"Il SPT e i comitati consultivi dell’Organizzazione operano nel rispetto delle seguenti garanzie:"},{"k":"p","t":"La formazione dei manager e dei rappresentanti dei lavoratori chiarisce i limiti dell’autorità del SPT e la distinzione tra questioni del sistema di gestione e materie di contrattazione collettiva."},{"k":"p","t":"Le decisioni significative del SPT richiedono la consultazione preventiva dei sindacati."},{"k":"p","t":"Il SPT non sostituisce, non indebolisce e non interferisce con il ruolo dei sindacati nella contrattazione collettiva e nella rappresentanza dei lavoratori."},{"k":"p","t":"Un referente sindacale è designato per mantenere la comunicazione tra sindacati e SPT."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Istituzione SPT","Definizione composizione; invito formale ai sindacati; comunicazione apertura candidature.","Resp. SA / HR","Avvio sistema"],["2","Elezione","Campagna informativa; raccolta candidature; voto segreto; pubblicazione risultati; verbale.","Comitato elettorale","+30 gg"],["3","Statuto e formazione","Redazione Statuto SPT; formazione iniziale membri su SA8000, ruoli, strumenti.","Resp. SA / SPT","+15 gg"],["4","Attivazione canali","Mappatura dei canali esistenti; attivazione nuovi canali; comunicazione al personale.","Resp. SA / IT / SPT","+30 gg"],["5","Riunioni periodiche","Riunioni mensili SPT; verbali pubblicati; action log aggiornato.","SPT","Mensile"],["6","Coinvolgimento nelle funzioni chiave","Partecipazione del SPT e dei lavoratori a: politiche, rischi, obiettivi, monitoraggio, reclami, rimedi.","Resp. SA / SPT","Continuo"],["7","Survey e feedback","Survey annuale; focus group semestrali; raccolta continua suggerimenti; analisi e reporting.","Resp. SA / HR / SPT","Annuale/Sem."],["8","Collaborazione sindacale","Riunioni trimestrali congiunte; condivisione documenti; formazione congiunta; dashboard KPI.","Resp. SA / OO.SS.","Trimestrale"],["9","Comunicazione esiti","Diffusione risultati del coinvolgimento e delle decisioni prese al personale in formato accessibile.","SPT / HR","Post-riunione"],["10","Valutazione efficacia","Valutazione annuale dell’efficacia del SPT e dei canali; survey lavoratori e sindacati; report ad AD.","Resp. SA / SPT","Annuale"],["11","Rinnovo/rotazione","Nuove elezioni alla scadenza del mandato; aggiornamento composizione; bilancio del mandato.","Resp. SA / HR","Ogni [12/24] mesi"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"I seguenti indicatori, derivati dall’Indicator Library SA8000:2026, misurano l’efficacia del coinvolgimento dei lavoratori e del funzionamento del SPT:"},{"k":"p","t":"5.1 Indicatori SPT (M2.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% riunioni SPT pianificate effettivamente svolte","N. svolte / N. pianificate × 100","≥ 90%","Annuale"],["Tasso di partecipazione media dei membri SPT","Presenze medie / Membri totali × 100","≥ 80%","Per riunione"],["% azioni SPT completate entro le scadenze","N. completate / N. assegnate × 100","≥ 85%","Trimestrale"],["% decisioni/raccomandazioni SPT integrate nel sistema di gestione","N. integrate / N. totali × 100","≥ 70%","Annuale"],["Diversità del SPT vs. composizione del personale","Confronto demografico","Rappresentativo","Annuale"],["% rappresentanti lavoratori eletti con processo documentato","N. eletti / N. totali lavoratori SPT × 100","100%","Ad ogni elezione"],["Tasso di partecipazione alle elezioni SPT","N. votanti / N. aventi diritto × 100","≥ 60%","Ad ogni elezione"]]},{"k":"p","t":"5.2 Indicatori di coinvolgimento (M2.1, M2.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% personale coinvolto in attività strutturate di feedback","N. coinvolti / N. totale personale × 100","≥ 70%","Annuale"],["% politiche nuove/riviste revisionate dai lavoratori prima dell’approvazione","N. revisionate / N. totali × 100","≥ 90%","Annuale"],["% valutazioni dei rischi condotte con partecipazione lavoratori","N. con partecipazione / N. totali × 100","≥ 80%","Annuale"],["N. canali di partecipazione attivi","Conteggio canali","≥ 4","Annuale"],["% lavoratori che confermano di poter accedere a opportunità di partecipazione (survey)","Survey","≥ 80%","Annuale"],["Punteggio di fiducia dei lavoratori nei canali di comunicazione (survey)","Survey (scala 1–5)","≥ 3.5","Annuale"],["% materiali di comunicazione disponibili nelle lingue del personale","N. lingue coperte / N. lingue necessarie × 100","100%","Annuale"],["N. casi segnalati di ritorsione per utilizzo dei canali","Conteggio","0","Annuale"],["% lavoratori che dichiarano di sentirsi sicuri nell’utilizzo dei canali","Survey","≥ 80%","Annuale"]]},{"k":"p","t":"5.3 Indicatori collaborazione sindacale (M2.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["N. riunioni congiunte management-sindacati per anno","Conteggio","≥ 4","Annuale"],["% sindacati presenti formalmente invitati a partecipare al SPT","N. invitati / N. presenti × 100","100%","Ad ogni istituzione"],["Tempo medio di risposta del management al feedback sindacale","Giorni","≤ 15 gg","Annuale"],["% documenti chiave condivisi con i sindacati in formati accessibili","N. condivisi / N. chiave × 100","100%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-02.01","Statuto del Social Performance Team","Carta costitutiva del SPT: mandato, composizione, autorità, regole operative, protezioni."],["MOD-02.02","Verbale di Elezione dei Rappresentanti SPT","Documentazione del processo elettorale: candidati, votanti, risultati, supervisore neutrale."],["MOD-02.03","Verbale di Riunione SPT","Registro delle riunioni: presenze, OdG, discussioni, input lavoratori, decisioni, azioni."],["MOD-02.04","Action Log SPT","Registro pubblico delle azioni deliberate, responsabili, scadenze, stato di attuazione."],["MOD-02.05","Mappa dei Canali di Coinvolgimento","Mappatura di tutti i canali attivi: tipo, destinatari, lingue, accessibilità, responsabile, frequenza."],["MOD-02.06","Survey Coinvolgimento Lavoratori","Questionario annuale su percezione del coinvolgimento, fiducia nei canali, sicurezza, efficacia."],["MOD-02.07","Report Annuale SPT","Valutazione annuale dell’efficacia del SPT e del coinvolgimento: dati, analisi, raccomandazioni."],["MOD-02.08","Registro Collaborazione Sindacale","Log delle interazioni con i sindacati: riunioni, documenti condivisi, feedback, azioni."]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"I verbali delle riunioni SPT, i verbali elettorali e lo Statuto sono conservati per almeno 5 anni."},{"k":"p","t":"I risultati delle survey sono conservati in forma aggregata e anonima."},{"k":"p","t":"I registri di collaborazione sindacale sono accessibili all’AD, al Resp. SA, allo SPT e, su richiesta, alle terze parti autorizzate (M8.3)."},{"k":"p","t":"Le comunicazioni al personale sugli esiti del coinvolgimento sono archiviate con evidenza della distribuzione."}]},"PRO-03":{"code":"PRO-03","blocks":[{"k":"t","r":[["PROCEDURA PRO-03"],["Codice:","PRO-03","Revisione:","01"],["Titolo:","ENGAGEMENT DEGLI STAKEHOLDER"],["Criteri SA8000:","M3.1–3.4","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per l’identificazione, la prioritizzazione e il coinvolgimento significativo degli stakeholder nel Sistema di Gestione SA8000:2026, nonché per l’integrazione delle loro esigenze, aspettative, preoccupazioni e reclami nei processi decisionali dell’Organizzazione, in conformità ai criteri M3.1–3.4 dello Standard."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione identifichi e prioritizzi periodicamente gli stakeholder rilevanti, con priorità a quelli maggiormente impattati (M3.1)."},{"k":"p","t":"Il coinvolgimento sia significativo e avvenga nella definizione delle politiche, nella valutazione dei rischi, nel monitoraggio, nella progettazione dei meccanismi di reclamo, nella determinazione dei rimedi e nelle situazioni di carenza conoscitiva (M3.2)."},{"k":"p","t":"L’engagement sia accessibile, condotto in buona fede, rispondente alle preoccupazioni degli stakeholder e privo di ritorsioni (M3.3)."},{"k":"p","t":"Le esigenze, aspettative, preoccupazioni e reclami degli stakeholder siano considerati nei processi decisionali dell’Organizzazione (M3.4)."},{"k":"p","t":"1.2 Campo di applicazione"},{"k":"p","t":"La procedura si applica a tutti gli stakeholder interni (lavoratori, sindacati, rappresentanti dei lavoratori, SPT) ed esterni (comunità locali, ONG, acquirenti, enti governativi, fornitori, consulenti, organizzazioni della società civile) rilevanti per il Sistema di Gestione SA8000:2026. Il coinvolgimento dei lavoratori e del SPT è trattato in dettaglio nella PRO-02; la presente procedura si concentra sull’engagement degli stakeholder esterni e sulla governance complessiva del processo."},{"k":"p","t":"1.3 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M3.1–3.4"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M3"},{"k":"p","t":"Manuale del Sistema di Gestione SA8000:2026 dell’Organizzazione"},{"k":"p","t":"PRO-01 – Riesame della Direzione (input stakeholder come fonte M10.2e)"},{"k":"p","t":"PRO-02 – Coinvolgimento dei Lavoratori e SPT"},{"k":"p","t":"PRO-04 – Gestione della Politica (coinvolgimento stakeholder nella definizione)"},{"k":"p","t":"PRO-05 – Valutazione dei Rischi e Due Diligence"},{"k":"p","t":"PRO-13 – Meccanismo di Reclamo Esterno"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"Principi Guida ONU su Imprese e Diritti Umani (UNGPs), Pilastro III"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Stakeholder","Individuo, gruppo o organizzazione che può influenzare o essere influenzato dalle attività, decisioni o risultati dell’Organizzazione."],["Stakeholder rilevante","Stakeholder identificato come pertinente per il sistema di gestione SA8000, prioritizzato in base all’impatto che subisce dalle operazioni dell’Organizzazione (M3.1)."],["Engagement significativo","Coinvolgimento che cerca attivamente l’input degli stakeholder, è accessibile, condotto in buona fede, rispondente alle preoccupazioni e non comporta ritorsioni (M3.3)."],["Registro stakeholder","Documento strutturato che elenca le categorie di stakeholder, le loro esigenze/aspettative, il livello di priorità, le modalità di engagement e lo storico delle interazioni (M3.4)."],["Stakeholder impact statement","Dichiarazione allegata alle proposte organizzative che illustra gli effetti attesi su lavoratori, comunità, fornitori e altri stakeholder."],["Buona fede","Approccio all’engagement caratterizzato da trasparenza, rispetto reciproco, assenza di precondizioni, disponibilità all’ascolto e impegno a considerare autenticamente le posizioni espresse."],["Non ritorsione","Garanzia che nessuno stakeholder subirà conseguenze negative per aver partecipato all’engagement o espresso preoccupazioni."],["AD","Alta Direzione."],["Resp. SA","Responsabile SA8000."],["SPT","Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR / Funzioni","Stakeholder"],["Identificazione degli stakeholder","A","R","C","I"],["Prioritizzazione (scoring)","A","R","C","I"],["Pianificazione dell’engagement","A","R","C","I"],["Conduzione delle attività di engagement","I","R"],["Documentazione input e feedback","I","R","C"],["Integrazione nelle decisioni (M3.4)","A","R","C","R","I"],["Comunicazione risposte agli stakeholder","I","R","C","I"],["Monitoraggio e valutazione efficacia","A","R","C"],["Aggiornamento registro stakeholder","I","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile (esegue), A = Accountable (approva/risponde), C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Identificazione e prioritizzazione degli stakeholder (M3.1)"},{"k":"p","t":"4.1.1 Identificazione"},{"k":"p","t":"L’Organizzazione identifica periodicamente le categorie di stakeholder rilevanti per il sistema di gestione SA8000, considerando:"},{"k":"p","t":"Stakeholder interni: lavoratori (di ogni tipologia contrattuale e turno), rappresentanti dei lavoratori, SPT, sindacati, management."},{"k":"p","t":"Stakeholder esterni: comunità locali, organizzazioni della società civile (ONG, associazioni di lavoratori), acquirenti e committenti, enti governativi e regolatori, fornitori e business partner, organizzazioni internazionali, media, esperti e consulenti."},{"k":"p","t":"Le fonti informative per l’identificazione includono: audit, reclami, valutazioni dei rischi, fonti esterne (report ONG, studi di settore), segnalazioni interne e liste di stakeholder di benchmark settoriali."},{"k":"p","t":"La mappatura è documentata nel Registro Stakeholder (MOD-03.01) e validata con i rappresentanti dei lavoratori e i sindacati."},{"k":"p","t":"4.1.2 Prioritizzazione"},{"k":"p","t":"Gli stakeholder sono prioritizzati con un sistema di scoring basato su due dimensioni principali:"},{"k":"t","r":[["Dimensione","Descrizione","Scala"],["Impatto subito","Grado in cui lo stakeholder è direttamente impattato dalle operazioni dell’Organizzazione. Priorità massima a lavoratori e comunità più colpite (M3.1).","1 (basso) – 5 (molto alto)"],["Rilevanza per il SG","Capacità dello stakeholder di contribuire con informazioni, competenze o influenza rilevanti per il sistema di gestione SA8000.","1 (basso) – 5 (molto alto)"]]},{"k":"p","t":"Il punteggio combinato (Impatto × Rilevanza) determina la classe di priorità:"},{"k":"t","r":[["Classe","Punteggio","Frequenza engagement min.","Modalità prevalente"],["Alta priorità","15–25","Trimestrale","Consultazione diretta, riunioni, comitati"],["Media priorità","8–14","Semestrale","Workshop, survey, inviti a eventi"],["Bassa priorità","1–7","Annuale","Informativa, report pubblici, comunicazioni scritte"]]},{"k":"p","t":"La prioritizzazione è documentata nel Registro Stakeholder (MOD-03.01), con rationale per ogni classificazione, e revisionata almeno annualmente o in occasione di cambiamenti significativi nel contesto operativo."},{"k":"p","t":"4.1.3 Revisione periodica"},{"k":"p","t":"La mappatura e la prioritizzazione sono riesaminate:"},{"k":"p","t":"Almeno una volta all’anno, in concomitanza con l’aggiornamento del contesto (PRO-05)."},{"k":"p","t":"In occasione di eventi trigger: nuovi rischi, acquisizioni, cambi normativi, reclami significativi, espansione in nuovi mercati o territori."},{"k":"p","t":"La revisione è validata dal SPT e, ove possibile, confrontata con mappe di stakeholder di ONG o organizzazioni di settore."},{"k":"p","t":"4.2 Engagement significativo degli stakeholder (M3.2, M3.3)"},{"k":"p","t":"4.2.1 Ambiti di engagement obbligatorio (M3.2)"},{"k":"p","t":"L’Organizzazione conduce un engagement significativo degli stakeholder almeno nei seguenti ambiti:"},{"k":"t","r":[["Ambito (M3.2)","Attività di engagement","Stakeholder coinvolti","Rif. Procedura"],["a) Definizione delle politiche","Sessioni di consultazione; periodi di commento pubblico; invito di stakeholder prioritari alla redazione; raccolta e documentazione del feedback.","Lavoratori, sindacati, ONG, buyer","PRO-04"],["b) Valutazione dei rischi","Sessioni partecipative; ascolto delle comunità impattate; integrazione delle prospettive esterne nel registro rischi.","Comunità, ONG, esperti, lavoratori","PRO-05"],["c) Monitoraggio prestazioni e BP","Comitati congiunti di monitoraggio; condivisione KPI; valutazione stakeholder sulle prestazioni.","Sindacati, buyer, ONG","PRO-11"],["d) Progettazione meccanismi reclamo","Co-progettazione; test pilota con stakeholder/lavoratori; supervisione di terze parti; revisione canali.","Lavoratori, sindacati, ONG","PRO-12/13"],["e) Determinazione rimedi","Coinvolgimento nell’analisi cause radice; panel di stakeholder per raccomandazioni; feedback post-rimedio.","Impattati, sindacati, esperti","PRO-14"],["f) Carenza conoscitiva","Roster di esperti esterni; sessioni di ascolto nelle comunità; collaborazione con ONG e istituti di ricerca.","Esperti, ONG, accademia","–"]]},{"k":"p","t":"4.2.2 Requisiti qualitativi dell’engagement (M3.3)"},{"k":"p","t":"Ogni attività di engagement soddisfa i seguenti requisiti:"},{"k":"t","r":[["Rif.","Requisito M3.3","Modalità operative"],["a)","Ricerca attiva dell’input","Sollecitazione multi-formato: survey, focus group, workshop, interviste one-to-one. Registro di tutti gli input ricevuti (chi, cosa, come considerato)."],["b)","Accessibilità","Traduzione materiali nelle lingue degli stakeholder; interpreti; sedi fisicamente accessibili; piattaforme digitali; programmazione su fusi orari diversi."],["c)","Buona fede","Condivisione preventiva degli ordini del giorno; facilitatori terzi dove esistono squilibri di potere; pari tempo di parola; nessuna precondizione."],["d)","Rispondenza alle preoccupazioni","Risposte scritte entro tempi definiti; documentazione della motivazione per accoglimento, modifica o rigetto dell’input; log pubblico con stato."],["e)","Non ritorsione","Monitoraggio azioni disciplinari verso partecipanti; possibilità di partecipazione anonima; canali riservati; politica di non ritorsione comunicata."]]},{"k":"p","t":"4.2.3 Strumenti di engagement"},{"k":"t","r":[["Strumento","Descrizione","Stakeholder target","Frequenza"],["Riunioni consultive formali","Incontri strutturati con OdG condiviso in anticipo, verbali, follow-up.","Alta priorità","Trimestrale"],["Workshop partecipati","Sessioni di lavoro su temi specifici (rischi, politiche, rimedi) con stakeholder e SPT.","Alta/media","Semestrale"],["Survey strutturate","Questionari di soddisfazione, percezione, aspettative destinati a diverse categorie.","Tutti i livelli","Annuale"],["Sessioni di ascolto comunitario","Incontri nelle comunità locali impattate per raccogliere preoccupazioni e aspettative.","Comunità locali","Annuale / su necessità"],["Report e comunicazioni pubbliche","Pubblicazione di informazioni su performance, risultati dell’engagement, azioni intraprese.","Tutti","Annuale"],["Panel di esperti","Consultazione di ONG, accademici, consulenti su temi specifici dove l’Organizzazione manca di conoscenza.","Esperti esterni","Su necessità"],["Comitati congiunti di monitoraggio","Gruppi multi-stakeholder che partecipano alla revisione dei dati di performance e al monitoraggio dei business partner.","Sindacati, ONG, buyer","Trimestrale"]]},{"k":"p","t":"4.3 Integrazione nelle decisioni organizzative (M3.4)"},{"k":"p","t":"L’Organizzazione assicura che le esigenze, aspettative, preoccupazioni e reclami degli stakeholder siano sistematicamente considerati nei processi decisionali attraverso i seguenti meccanismi:"},{"k":"p","t":"4.3.1 Stakeholder Impact Statement"},{"k":"p","t":"Per ogni decisione strategica, proposta di policy o modifica organizzativa significativa, il proponente allega uno Stakeholder Impact Statement che illustra:"},{"k":"p","t":"Gli stakeholder impattati dalla decisione."},{"k":"p","t":"Gli effetti attesi (positivi e negativi) su lavoratori, comunità, fornitori e altri gruppi."},{"k":"p","t":"Le preoccupazioni o i reclami pertinenti ricevuti dagli stakeholder."},{"k":"p","t":"Come l’input degli stakeholder è stato considerato nella formulazione della proposta."},{"k":"p","t":"Le ragioni documentate per l’accoglimento, la modifica o il rigetto degli input ricevuti."},{"k":"p","t":"4.3.2 Integrazione nei processi decisionali"},{"k":"p","t":"Revisione delle politiche: ogni revisione include una consultazione con gli stakeholder prioritari; il template di revisione contiene una sezione dedicata al riepilogo degli input ricevuti e della loro considerazione."},{"k":"p","t":"Pianificazione strategica e obiettivi: le esigenze degli stakeholder sono considerate nella definizione degli obiettivi annuali (PRO-06); il SPT verifica l’allineamento."},{"k":"p","t":"Riesame della Direzione: i feedback, le preoccupazioni e i reclami degli stakeholder sono input obbligatorio del riesame (M10.2e, PRO-01); i verbali documentano come sono stati discussi e le decisioni conseguenti."},{"k":"p","t":"Comitati decisionali: i comitati operativi e strategici includono, ove possibile, rappresentanti dei lavoratori, del SPT o di stakeholder esterni."},{"k":"p","t":"Gestione dei reclami: i reclami degli stakeholder sono formalmente escalati ai decisori competenti (PRO-13); lo stato di risoluzione è tracciato e comunicato allo stakeholder."},{"k":"p","t":"Decision log: l’Organizzazione mantiene un registro delle decisioni (MOD-03.04) che include i riferimenti specifici agli input degli stakeholder considerati."},{"k":"p","t":"4.4 Comunicazione e trasparenza"},{"k":"p","t":"L’Organizzazione garantisce la trasparenza del processo di engagement attraverso:"},{"k":"p","t":"Risposte scritte agli stakeholder entro un tempo massimo definito (target: 15 giorni lavorativi per alta priorità, 30 per media) che spiegano come l’input sarà o è stato considerato."},{"k":"p","t":"Un log pubblico o semi-pubblico (MOD-03.03) che documenta le questioni sollevate dagli stakeholder, le azioni intraprese e lo stato di attuazione."},{"k":"p","t":"Il re-engagement degli stakeholder dopo l’implementazione delle decisioni o dei rimedi per verificare l’adeguatezza delle risposte."},{"k":"p","t":"Canali di appello per gli stakeholder non soddisfatti delle risposte ricevute."},{"k":"p","t":"Pubblicazione di documentazione che illustri cosa è stato condiviso, cosa accettato o rifiutato, e le motivazioni delle decisioni."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Mappatura","Identificazione di tutte le categorie di stakeholder interni ed esterni; censimento su MOD-03.01.","Resp. SA / SPT","Annuale"],["2","Prioritizzazione","Scoring impatto × rilevanza; classificazione Alta/Media/Bassa; validazione con SPT e sindacati.","Resp. SA / SPT","Annuale"],["3","Pianificazione","Predisposizione Piano Annuale di Engagement (MOD-03.02): attività, strumenti, tempistiche, budget, responsabili per ogni classe di stakeholder.","Resp. SA","Entro Q1"],["4","Preparazione","Predisposizione materiali (tradotti, accessibili); condivisione OdG; identificazione facilitatori; logistica.","Resp. SA / Funzioni","Pre-evento"],["5","Conduzione engagement","Svolgimento delle attività pianificate (riunioni, workshop, survey, sessioni comunitarie) nel rispetto dei requisiti M3.3.","Resp. SA / SPT","Da piano"],["6","Documentazione","Registrazione degli input ricevuti nel Log Stakeholder (MOD-03.03): chi, cosa, come considerato.","Resp. SA","+5 gg"],["7","Integrazione","Valutazione degli input; predisposizione Stakeholder Impact Statement; integrazione nei processi decisionali (M3.4).","Resp. SA / Funzioni","+15 gg"],["8","Risposta","Comunicazione scritta agli stakeholder su come l’input è stato considerato; motivazioni accoglimento/rigetto.","Resp. SA","15–30 gg"],["9","Follow-up e re-engagement","Verifica attuazione azioni; re-engagement per confermare adeguatezza; aggiornamento log.","Resp. SA / SPT","Continuo"],["10","Valutazione efficacia","Misurazione KPI; survey di soddisfazione stakeholder; report annuale; input al Riesame della Direzione.","Resp. SA","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori di mappatura e pianificazione (M3.1)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["Frequenza di revisione della mappatura stakeholder","N. revisioni/anno","≥ 1/anno","Annuale"],["% esercizi di identificazione completati nei tempi previsti","N. completati / N. pianificati × 100","100%","Annuale"],["% categorie di stakeholder conosciute rappresentate nel registro","N. rappresentate / N. totali × 100","≥ 90%","Annuale"],["% decisioni di prioritizzazione con rationale documentato","N. con rationale / N. totali × 100","100%","Annuale"],["% prioritizzazioni validate con SPT/sindacati","N. validate / N. totali × 100","100%","Annuale"]]},{"k":"p","t":"5.2 Indicatori di engagement (M3.2, M3.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% attività di engagement condotte nei tempi previsti","N. condotte / N. pianificate × 100","≥ 90%","Annuale"],["% gruppi stakeholder identificati contattati negli ultimi 12 mesi","N. contattati / N. identificati × 100","≥ 80%","Annuale"],["% stakeholder invitati che hanno fornito input","N. con input / N. invitati × 100","≥ 60%","Per attività"],["N. attività strutturate di engagement per anno","Conteggio","≥ 6","Annuale"],["% engagement con OdG condiviso, verbali e esiti pubblicati","N. con documentazione / N. totali × 100","100%","Per attività"],["% canali di engagement disponibili nelle lingue degli stakeholder","N. lingue coperte / N. necessarie × 100","100%","Annuale"],["Punteggio di soddisfazione degli stakeholder (survey)","Survey (scala 1–5)","≥ 3.5","Annuale"],["N. casi di ritorsione segnalati per periodo","Conteggio","0","Annuale"]]},{"k":"p","t":"5.3 Indicatori di integrazione nelle decisioni (M3.4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Frequenza"],["% decisioni rilevanti con revisione documentata degli input stakeholder","N. con revisione / N. decisioni × 100","≥ 80%","Annuale"],["% proposte/preoccupazioni stakeholder che hanno portato a modifiche","N. con impatto / N. totali × 100","≥ 50%","Annuale"],["% input rigettati con rationale documentato","N. con rationale / N. rigettati × 100","100%","Annuale"],["% stakeholder informati su come il loro input ha influenzato le decisioni","N. informati / N. che hanno fornito input × 100","≥ 90%","Annuale"],["Tempo medio di risposta alle preoccupazioni stakeholder","Media giorni","≤ 15 gg (alta)\n≤ 30 gg (media)","Annuale"],["% reclami stakeholder escalati ai decisori e risolti nei tempi","N. risolti / N. escalati × 100","≥ 80%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"p","t":"6.1 Moduli collegati"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-03.01","Registro e Mappa degli Stakeholder","Registro completo: categorie, esigenze/aspettative, scoring, priorità, storico interazioni."],["MOD-03.02","Piano Annuale di Engagement","Programmazione annuale delle attività di engagement per categoria, strumento, tempistica, budget."],["MOD-03.03","Log delle Interazioni con gli Stakeholder","Registro cronologico: data, stakeholder, input ricevuto, come considerato, risposta fornita, stato."],["MOD-03.04","Decision Log con Input Stakeholder","Registro delle decisioni organizzative con riferimento agli input stakeholder considerati."],["MOD-03.05","Template Stakeholder Impact Statement","Modulo per la valutazione dell’impatto sugli stakeholder allegato alle proposte decisionali."],["MOD-03.06","Survey di Soddisfazione Stakeholder","Questionario annuale di percezione sull’efficacia dell’engagement e sulla qualità della risposta."],["MOD-03.07","Report Annuale di Engagement","Valutazione annuale dell’efficacia dell’engagement: KPI, analisi, raccomandazioni."]]},{"k":"p","t":"6.2 Conservazione"},{"k":"p","t":"Il Registro Stakeholder e i log delle interazioni sono conservati per almeno 5 anni."},{"k":"p","t":"I verbali delle attività di engagement e gli Stakeholder Impact Statement sono archiviati con le decisioni di riferimento."},{"k":"p","t":"I risultati delle survey sono conservati in forma aggregata; i dati individuali sono trattati nel rispetto della privacy."},{"k":"p","t":"L’accesso ai documenti è garantito all’AD, al Resp. SA, allo SPT e, su richiesta, alle terze parti autorizzate (auditor, SAI) ai sensi del criterio M8.3."}]},"PRO-04":{"code":"PRO-04","blocks":[{"k":"t","r":[["PROCEDURA PRO-04"],["Codice:","PRO-04","Revisione:","01"],["Titolo:","GESTIONE DELLA POLITICA E COERENZA DEGLI IMPEGNI"],["Criteri SA8000:","M4.1–4.4","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"1.1 Scopo"},{"k":"p","t":"La presente procedura definisce le modalità operative per la redazione, l’approvazione, la comunicazione, il riesame periodico e l’aggiornamento della Politica per il Lavoro Dignitoso (Dichiarazione di Politica, M4.1), della Politica di Aspettative Reciproche per i Business Partner (M4.2), nonché per la verifica della coerenza tra le politiche, le pratiche, gli obiettivi e gli incentivi dell’Organizzazione e gli impegni assunti ai sensi dello Standard SA8000:2026 (M4.3, M4.4)."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"La Dichiarazione di Politica articoli gli impegni minimi richiesti dallo Standard (M4.1 a–h) e sia periodicamente aggiornata con il coinvolgimento di lavoratori e stakeholder."},{"k":"p","t":"La Politica per i Business Partner stabilisca aspettative chiare su rispetto dei principi SA8000, due diligence, responsabilità per gli impatti e criteri per la cessazione delle relazioni (M4.2 a–d)."},{"k":"p","t":"Le politiche, pratiche, obiettivi e incentivi non contraddicano gli impegni assunti (M4.3)."},{"k":"p","t":"Le attività di lobbying e le interazioni esterne non contraddicano gli impegni e gli obiettivi (M4.4)."},{"k":"p","t":"1.2 Campo di applicazione"},{"k":"p","t":"La procedura si applica alla Dichiarazione di Politica SA8000, alla Politica per i Business Partner, e a tutte le politiche, pratiche, obiettivi, incentivi, attività di lobbying e interazioni esterne dell’Organizzazione che possano avere un impatto sui diritti e le condizioni di lavoro dignitoso."},{"k":"p","t":"1.3 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri M4.1–4.4"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione M4"},{"k":"p","t":"Manuale del Sistema di Gestione SA8000:2026 dell’Organizzazione"},{"k":"p","t":"PRO-01 – Riesame della Direzione (politica come input e output)"},{"k":"p","t":"PRO-02 – Coinvolgimento dei Lavoratori e SPT"},{"k":"p","t":"PRO-03 – Engagement degli Stakeholder"},{"k":"p","t":"PRO-05 – Valutazione dei Rischi e Due Diligence"},{"k":"p","t":"PRO-06 – Pianificazione Obiettivi"},{"k":"p","t":"PRO-08 – Gestione dei Business Partner"},{"k":"p","t":"PRO-15 – Miglioramento Continuo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Dichiarazione di Politica","Documento formale che articola gli impegni dell’Organizzazione verso i principi dello Standard SA8000:2026 (M4.1)."],["Politica Business Partner","Documento che stabilisce le aspettative reciproche tra l’Organizzazione e i suoi partner commerciali in materia di lavoro dignitoso (M4.2)."],["Matrice di conformità","Strumento che mappa i criteri SA8000, i requisiti legali applicabili e altri standard sottoscritti, verificandone la copertura nella politica."],["Coerenza delle politiche","Assenza di contraddizioni tra le politiche, le pratiche, gli obiettivi e gli incentivi dell’Organizzazione e i suoi impegni SA8000 (M4.3)."],["Lobbying","Qualsiasi attività di advocacy, rappresentanza di interessi, partecipazione ad associazioni o iniziative esterne che possa influenzare questioni relative ai diritti dei lavoratori."],["Verifica di allineamento","Processo di revisione sistematica per accertare che politiche, obiettivi, incentivi e interazioni esterne siano coerenti con gli impegni SA8000."],["AD / Resp. SA / SPT","Alta Direzione / Responsabile SA8000 / Social Performance Team."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR / Legale","Funzioni","OO.SS. / Stk."],["Redazione / aggiornamento Dichiarazione di Politica","A","R","C"],["Redazione / aggiornamento Politica BP","A","R","C","R","C"],["Approvazione politiche","R","C","I","C","I"],["Consultazione lavoratori / stakeholder","I","R","C","I","R"],["Matrice di conformità legale e SA8000","I","R","C","R","C","I"],["Comunicazione e diffusione politiche","I","R","I"],["Formazione sul contenuto delle politiche","I","R","C","I"],["Verifica coerenza politiche/pratiche/obiettivi (M4.3)","A","R","C","R","C"],["Verifica coerenza lobbying/interazioni esterne (M4.4)","A","R","C","R","C","I"],["Riesame periodico e aggiornamento","A","R","C","I","C"]]},{"k":"p","t":"Legenda: R = Responsabile (esegue), A = Accountable (approva/risponde), C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Dichiarazione di Politica per il Lavoro Dignitoso (M4.1)"},{"k":"p","t":"4.1.1 Contenuto minimo obbligatorio"},{"k":"p","t":"La Dichiarazione di Politica articola gli impegni dell’Organizzazione verso i seguenti principi:"},{"k":"t","r":[["Rif.","Impegno (M4.1)","Elementi chiave nel testo della politica"],["a)","Soddisfare o superare i requisiti dello Standard, i requisiti legali e altri requisiti pertinenti","Riferimento esplicito a SA8000:2026; leggi nazionali/locali; CCNL; altri standard sottoscritti"],["b)","Affrontare i rischi che causa, a cui
