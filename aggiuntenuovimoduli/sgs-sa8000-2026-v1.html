itoraggio","Per selezione"]]},{"k":"p","t":"5.2 Condotta, Inclusione e Procedure mediche (D5.3–D5.5)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["Tasso turnover nel periodo","HR","Monitoraggio","Trimestrale"],["GG medi malattia/assenza per team vs. media aziendale","HR","Parità","Trimestrale"],["% richieste trasferimento per reparto","HR","Monitoraggio","Annuale"],["Tempo medio di risoluzione richieste accomodamento","GG","Monitoraggio","Per richiesta"],["% richieste accomodamento approvate/modificate vs. rifiutate","HR","Monitoraggio","Annuale"],["N. procedure mediche invasive richieste / con giustificazione legale / con consenso","Conteggio","Minimo","Annuale"],["Tasso azioni disciplinari per gruppo demografico","Confronto %","Parità","Annuale"]]},{"k":"p","t":"5.3 SG e BP (D5.6)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% BP valutati per conformità D5 (da MOD-20.02)","N. valutati / N. tot.","≥ 90%","Annuale"],["% personale formato su anti-discriminazione e bias inconscio","N. formati / N. tot.","≥ 95%","Annuale"],["N. reclami discriminazione ricevuti / indagati / risolti","Conteggio","Monitoraggio","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-20.01","Checklist Libertà dalla Discriminazione (D5.2–D5.5)","Verifica periodica tutti i requisiti D5 con 35+ punti di controllo."],["MOD-20.02","Checklist Verifica BP – Discriminazione (D5.6)","Valutazione BP su anti-discriminazione, inclusione, procedure mediche."],["MOD-20.03","Registro Accomodamenti e Inclusione","Log richieste accomodamento, esito, tempi, impact check."],["MOD-20.04","Report Annuale Libertà dalla Discriminazione","KPI D5, analisi demografica, trend, pay gap, reclami, raccomandazioni, input RdD."]]},{"k":"p","t":"Conservazione: registri per almeno 5 anni; dati sanitari secondo GDPR."},{"k":"p","t":"Riservatezza: dati discriminazione e accomodamento trattati come riservati; accesso ristretto."},{"k":"p","t":"Coordinamento: PRO-05 (rischi discriminazione), PRO-12 (reclami), PRO-18 (reclutamento equo), PRO-19 (parità retributiva)."}]},"PRO-21":{"code":"PRO-21","blocks":[{"k":"t","r":[["PROCEDURA PRO-21"],["Codice:","PRO-21","Revisione:","01"],["Titolo:","SALUTE E SICUREZZA"],["Criteri SA8000:","D6.1–D6.13","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire ambienti di lavoro sicuri e salubri, in conformità ai criteri D6.1–D6.13 dello Standard SA8000:2026, includendo benessere fisico, sociale e mentale."},{"k":"t","r":[["Criterio","Area"],["D6.2","Rappresentante della Direzione competente per H&S"],["D6.3","Identificazione periodica pericoli; valutazione e prioritizzazione rischi (effetti immediati e a lungo termine/cumulativi)"],["D6.4","Rischi da pericoli: materiali pericolosi (a), attrezzature/ambiente/utenze (b), ergonomia (c)"],["D6.5","Rischi da disastri naturali/antropici e emergenze: incendio/esplosione, terremoti, alluvioni, siccità, condizioni ambientali estreme, altre emergenze, patogeni, situazioni anomale (a–h)"],["D6.6","Altre condizioni pericolose: sicurezza strutturale edifici (a), condizioni igienico-sanitarie (b), sicurezza trasporti (c)"],["D6.7","Rischi psicosociali: scadenze irragionevoli (a), comportamento aggressivo/bullismo (b), privacy inadeguata (c), mancanza trasparenza (d), insicurezza occupazionale (e)"],["D6.8","Consapevolezza, informazione e comunicazione: pericoli e rischi del ruolo (a), politiche/procedure/ruoli (b), diritti H&S (c)"],["D6.9","Primo soccorso e assistenza medica post-infortunio"],["D6.10","DPI: fornitura, manutenzione e sostituzione a carico dell’Organizzazione"],["D6.11","Ambienti puliti, sicuri, con accesso a: servizi igienici, acqua potabile, mensa, spogliatoi, spazi allattamento"],["D6.12","Alloggi, trasporti, vitto e servizi forniti dall’Organizzazione conformi a standard nazionali/internazionali"],["D6.13","Sistema di gestione efficace nelle operazioni e relazioni commerciali"]]},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D6.1–D6.13"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D6"},{"k":"p","t":"D.Lgs. 81/2008 – Testo Unico Sicurezza sul Lavoro (e s.m.i.)"},{"k":"p","t":"Convenzione ILO n. 155 – Sicurezza e salute dei lavoratori"},{"k":"p","t":"Convenzione ILO n. 190 – Violenza e molestie nel mondo del lavoro"},{"k":"p","t":"ISO 45001:2018 – Sistemi di gestione per la salute e sicurezza sul lavoro"},{"k":"p","t":"ILO Guidelines on Decent Housing for Workers"},{"k":"p","t":"PRO-05 – Rischi; PRO-11 – Monitoraggio e Reclami; PRO-14 – Orari"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Pericolo (Hazard)","Fonte, situazione o atto con potenziale di causare lesioni, malattie o danni alla salute fisica o mentale."],["Rischio (Risk)","Combinazione della probabilità di esposizione al pericolo e della gravità delle conseguenze."],["DPI","Dispositivi di Protezione Individuale: equipaggiamento fornito, mantenuto e sostituito a carico dell’Organizzazione (D6.10)."],["Rischio psicosociale","Pericolo derivante da aspetti organizzativi/gestionali: carichi irragionevoli, bullismo, mancanza di privacy, insicurezza occupazionale (D6.7 a–e)."],["Near miss / Quasi-incidente","Evento che non ha causato lesioni o malattie ma aveva il potenziale per farlo."],["WBGT","Wet Bulb Globe Temperature – Misura di calore estremo; soglia ≥ 30°C WBGT o standard nazionale."],["Comitato H&S","Comitato salute e sicurezza con partecipazione lavoratori e management per supervisione delle attività D6."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Rapp. Dir. H&S","Resp. SA","SPT","RSPP/ MC","HR","Produz.","OO.SS."],["Rappresentante H&S (D6.2)","A","R","C","I","C","I","C"],["Valutazione rischi (D6.3)","A","R","C","R","I","C"],["Pericoli fisici/chimici/ergo (D6.4)","A","R","I","C","R","I","R","I"],["Emergenze e disastri (D6.5)","A","R","C","R","I","R","I"],["Strutture/igiene/trasporti (D6.6)","A","R","I","R","I","R","I"],["Rischi psicosociali (D6.7)","A","C","R","C","R","C"],["Informazione/formazione (D6.8)","A","R","C","I","R","C","R","I"],["Primo soccorso (D6.9)","A","R","I","R","C","R","I"],["DPI (D6.10)","A","R","I","R","I","R","I"],["Ambienti lavoro (D6.11–12)","A","R","I","R","I","R","I"],["SG e BP (D6.13)","A","C","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato. RSPP = Resp. Servizio Prevenzione Protezione; MC = Medico Competente."},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Rappresentante della Direzione per H&S (D6.2)"},{"k":"p","t":"Designazione di un rappresentante competente della Direzione: framework competenze (formazione, esperienza, comunicazione, conoscenza)."},{"k":"p","t":"Consultazione con i lavoratori sull’assegnazione; periodo di prova; formazione obbligatoria iniziale e aggiornamento continuo."},{"k":"p","t":"Tempo protetto per svolgere le funzioni senza penalizzazione sulle metriche di performance."},{"k":"p","t":"Protezione da ritorsioni; partecipazione obbligatoria a indagini incidenti, audit e valutazioni rischi."},{"k":"p","t":"Istituzione e mantenimento del Comitato H&S con rappresentanti lavoratori."},{"k":"p","t":"4.2 Identificazione pericoli e valutazione rischi (D6.3)"},{"k":"p","t":"Ispezioni periodiche del luogo di lavoro con mappe dei pericoli e diagrammi di piano."},{"k":"p","t":"Test sensoriali nelle ispezioni; sistema di segnalazione pericoli accessibile a tutto il personale."},{"k":"p","t":"Analisi delle attività (task analysis) e analisi dell’esposizione: chi è a rischio, natura del pericolo, come può causare danno."},{"k":"p","t":"Valutazione controlli esistenti; matrice di rischio (probabilità × gravità); analisi costi-benefici per fattibilità e proporzionalità."},{"k":"p","t":"Inclusione effetti immediati E a lungo termine/cumulativi (D6.3)."},{"k":"p","t":"Comitati di sicurezza guidati dai lavoratori; coinvolgimento personale nella valutazione."},{"k":"p","t":"4.3 Rischi da pericoli sul luogo di lavoro (D6.4)"},{"k":"t","r":[["Rif.","Pericolo D6.4","Modalità operative"],["a)","Materiali pericolosi","Inventario sostanze con SDS; etichettatura aree trattate e contenitori; protocolli compatibilità chimica; sostituzione con sostanze non pericolose; stazioni lavaggio occhi/chimiche; aree pasto separate da materiali pericolosi."],["b)","Attrezzature, ambiente, utenze","Manutenzione preventiva protezioni, arresti emergenza, interblocchi; controlli ingresso aree ad alto rischio; isolamento fonti energia prima di manutenzione (LOTO); certificazione operatori; intervalli pulizia/calibrazione/lubrificazione; check CO₂, polveri, vapori; mappatura decibel e lux; allarmi rilevazione gas; approvazione modifiche non-standard."],["c)","Ergonomia","Valutazioni ergonomiche postazioni; sedie regolabili, altezza monitor; rotazione compiti ad alto sforzo e pause obbligatorie; coinvolgimento personale nella scelta attrezzature."]]},{"k":"p","t":"4.4 Emergenze e disastri (D6.5)"},{"k":"p","t":"Piani di emergenza per ogni scenario (a–h): protocolli comunicazione, ruoli/responsabilità, attrezzature, percorsi evacuazione, punti di raccolta, test periodici."},{"k":"p","t":"Provviste emergenza: uscite di sicurezza, illuminazione batteria, cartellonistica, primo soccorso, attrezzature antincendio, punti raccolta manutenuti."},{"k":"p","t":"Mappatura rischi sito-specifici (geologici, climatici, industriali); rinforzo strutturale; backup energia/acqua/ventilazione."},{"k":"p","t":"Allarmi, sensori, sistemi rilevamento (incendio, gas, allagamento); abbonamento allerte meteo e protezione civile."},{"k":"p","t":"Esercitazioni evacuazione almeno annuali (idealmente trimestrali); formazione team emergenza (primo soccorso, antincendio, sversamento)."},{"k":"p","t":"Sistema buddy / floor warden per assistenza lavoratori vulnerabili; procedure spegnimento attrezzature e messa in sicurezza materiali pericolosi."},{"k":"p","t":"Piano di continuità operativa (BCP); accordi di mutuo soccorso con strutture vicine; coinvolgimento rappresentanti lavoratori nello sviluppo e test piani."},{"k":"p","t":"4.5 Sicurezza strutturale, igiene e trasporti (D6.6)"},{"k":"p","t":"Sicurezza edifici (a): ispezioni ingegneri certificati (struttura, resistenza fuoco, elettrico, uscite); riparazioni preventive; limiti massimi occupazione."},{"k":"p","t":"Condizioni igienico-sanitarie (b): pulizia giornaliera; test acqua potabile e scarichi; segregazione/smaltimento rifiuti; pest control; controllo infestanti."},{"k":"p","t":"Sicurezza trasporti (c): ispezione, manutenzione e certificazione veicoli; screening conducenti (patente, affaticamento, sostanze); valutazione rischi rotta; limiti carico/passeggeri."},{"k":"p","t":"4.6 Rischi psicosociali (D6.7)"},{"k":"p","t":"Limiti turni e straordinario con riposi garantiti; rotazione carichi e bilanciamento (coordinamento PRO-14) (a)."},{"k":"p","t":"Processi per segnalazione non verbale di sovraccarico (cartellini colorati, icone digitali); micro-pause legate a rischi psicosociali."},{"k":"p","t":"Peer observer rotanti per segnali precoci (bullismo, affaticamento, isolamento) (b)."},{"k":"p","t":"Stress drill per de-escalation; zone “No-surveillance” dove il monitoraggio è disattivato (c)."},{"k":"p","t":"Trasparenza su aspettative e obiettivi; comunicazione bidirezionale (d)."},{"k":"p","t":"Sicurezza occupazionale: contratti stabili, comunicazione tempestiva su cambiamenti organizzativi (e)."},{"k":"p","t":"4.7 Consapevolezza, informazione e comunicazione (D6.8)"},{"k":"p","t":"Onboarding H&S: pericoli del luogo di lavoro, misure protettive, procedure emergenza."},{"k":"p","t":"Briefing ruolo-specifici sui rischi di reparto, macchinario, processo."},{"k":"p","t":"H&S talk pre-turno; bollettini/allerte pubblicati fisicamente e digitalmente."},{"k":"p","t":"Stazioni informative H&S con poster, schede rapide, SDS, numeri emergenza."},{"k":"p","t":"Formazione continua: aggiornamento su pericoli nuovi/significativi; micro-learning; valutazioni competenza periodiche."},{"k":"p","t":"Comunicazione in tutte le lingue/livelli di alfabetizzazione del personale."},{"k":"p","t":"4.8 Primo soccorso e assistenza medica (D6.9)"},{"k":"p","t":"Protocolli risposta incidenti/near miss con ruoli, azioni, responsabilità."},{"k":"p","t":"Roster soccorritori certificati per turno/piano/sito; formazione CPR/primo soccorso."},{"k":"p","t":"Kit primo soccorso visibili, accessibili, completi, mantenuti; AED dove necessario."},{"k":"p","t":"Accordi con cliniche/ospedali vicini; veicoli dedicati o convenzione emergenza."},{"k":"p","t":"Modulistica e log centralizzati incidenti (trattamento, cause, referral medici)."},{"k":"p","t":"Follow-up: check-in con personale infortunato; piani di rientro graduali; mansioni modificate; programmi assistenza per trauma."},{"k":"p","t":"4.9 DPI (D6.10)"},{"k":"p","t":"Valutazione rischi per identificare DPI necessari per ruolo/compito/ambiente."},{"k":"p","t":"Coinvolgimento personale nella scelta per comfort, usabilità e appropriatezza culturale."},{"k":"p","t":"Tracciamento scorte, scadenze, punti riordino; stazioni DPI comuni marcate vicino alle aree di lavoro."},{"k":"p","t":"Sostituzione DPI danneggiati, usati o smarriti a costo zero per il personale."},{"k":"p","t":"Formazione periodica sull’uso corretto; ispezioni periodiche della condizione dei DPI."},{"k":"p","t":"Lavaggio/sterilizzazione DPI riutilizzabili; bidoni marcati per DPI contaminati o scaduti."},{"k":"p","t":"4.10 Ambienti di lavoro e servizi forniti (D6.11–12)"},{"k":"p","t":"Ambienti puliti e sicuri (D6.11): programmi pulizia; manutenzione attrezzature; controllo temperatura, ventilazione, illuminazione, umidità. Accesso a: servizi igienici puliti, acqua potabile, spazi mensa, spogliatoi, deposito sicuro, spazi allattamento."},{"k":"p","t":"Alloggi (D6.12): standard ILO housing; spazio minimo per lavoratore; letti separati max 2 livelli; servizi igienici separati uomo/donna; separazione da aree produzione/stoccaggio; manutenzione, emergenza, utilità continue."},{"k":"p","t":"Trasporti: veicoli ispezionati; conducenti certificati; limiti capacità; procedure emergenza."},{"k":"p","t":"Vitto: certificazione fornitori; protocolli igiene; ispezioni periodiche; adeguatezza nutrizionale; test acqua."},{"k":"p","t":"4.11 Sistema di gestione e BP (D6.13)"},{"k":"p","t":"Rischi H&S nel registro rischi (PRO-05); attenzione a subappaltatori e lavoratori temporanei."},{"k":"p","t":"Clausole contrattuali BP: conformità H&S, DVR, DPI, emergenze, igiene, trasporti."},{"k":"p","t":"Valutazione BP con checklist dedicata (MOD-21.02)."},{"k":"p","t":"Integrazione con sistema ISO 45001 ove presente."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Valutazione rischi e pericoli (D6.2–4)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["Ore aggiornamento continuo Rappresentante H&S / anno","Conteggio","Monitoraggio","Annuale"],["% reparti/turni/processi inclusi nelle ispezioni periodiche","N. inclusi / N. tot.","100%","Annuale"],["% pericoli riemergenti dopo chiusura","N. riemergenti / N. chiusi","0%","Semestrale"],["Tasso di manutenzione preventiva completata","% completata su programmata","≥ 95%","Mensile"],["% attività ad alto rischio con VR aggiornata","N. aggiornate / N. tot.","100%","Annuale"],["Tasso incidenti per tipo di pericolo","N. / periodo","Riduzione YoY","Mensile"],["GG/anno con WBGT ≥ 30°C o standard nazionale","Rilevamento","Monitoraggio","Annuale"]]},{"k":"p","t":"5.2 Emergenze, Strutture e Psicosociale (D6.5–7)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["Frequenza esercitazioni evacuazione","N. / anno","≥ 2","Annuale"],["Tempo medio evacuazione vs. tempo target","Min.","< target","Per drill"],["% strutture con VR emergenza aggiornata (<12 mesi)","N. aggiornate / N. tot.","100%","Annuale"],["% ispezioni strutturali/igieniche completate su programma","%","≥ 95%","Annuale"],["% veicoli che superano ispezione sicurezza","%","100%","Semestrale"],["GG persi per stress/salute mentale per X personale","Conteggio","Riduzione YoY","Annuale"],["% conflitti/molestie risolti con approvazione parti","%","Monitoraggio","Annuale"]]},{"k":"p","t":"5.3 Formazione, Primo soccorso, DPI, Ambienti (D6.8–12)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale con formazione H&S iniziale e aggiornamento nei tempi","N. formati / N. tot.","100%","Annuale"],["% turni/siti con almeno 1 soccorritore certificato","Conteggio","100%","Continuo"],["Tempo medio da infortunio a primo soccorso (minuti)","Media","Monitoraggio","Per evento"],["% personale con DPI assegnati e in uso corretto","Campione","100%","Trimestrale"],["% DPI in circolazione entro date validità/servizio","Inventario","100%","Trimestrale"],["% pulizie programmate completate on-time","%","≥ 95%","Mensile"],["% test acqua potabile conformi","N. conformi / N. tot.","100%","Semestrale"],["N. servizi igienici funzionanti per N. personale","Rapporto","Benchmark","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-21.01","Checklist Salute e Sicurezza (D6.2–D6.12)","Verifica periodica tutti i requisiti D6 con 60+ punti di controllo."],["MOD-21.02","Checklist Verifica BP – H&S (D6.13)","Valutazione BP su H&S, emergenze, DPI, igiene, trasporti."],["MOD-21.03","Registro Incidenti, Near Miss e Primo Soccorso","Log incidenti/near miss con trattamento, cause, follow-up, reintegro."],["MOD-21.04","Report Annuale Salute e Sicurezza","KPI D6, trend incidenti, VR, DPI, emergenze, psicosociale, raccomandazioni, input RdD."]]},{"k":"p","t":"Conservazione: registri H&S per almeno 10 anni; dati sanitari secondo D.Lgs. 81/2008 e GDPR."},{"k":"p","t":"Riservatezza: dati sanitari individuali ad accesso ristretto (MC, HR autorizzato)."},{"k":"p","t":"Coordinamento: PRO-05 (rischi H&S nel registro rischi), PRO-12 (reclami H&S), PRO-19 (orari/turni), D.Lgs. 81/2008 (DVR, nomine, sorveglianza sanitaria)."}]},"PRO-22":{"code":"PRO-22","blocks":[{"k":"t","r":[["PROCEDURA PRO-22"],["Codice:","PRO-22","Revisione:","01"],["Titolo:","PRIVACY"],["Criteri SA8000:","D7.1–D7.5","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire il diritto alla privacy del personale, in conformità ai criteri D7.1–D7.5 dello Standard SA8000:2026."},{"k":"p","t":"La procedura copre le seguenti aree:"},{"k":"t","r":[["Criterio","Area"],["D7.2","Raccolta, trattamento e utilizzo dei dati personali: solo per motivi rilevanti al lavoro (a), per le finalità originarie (b), nel rispetto dell’autonomia personale (c), in modo limitato nelle decisioni occupazionali (d), in modo non discriminatorio (e)"],["D7.3","Gestione dati: accurati, validi e affidabili (a); minimizzazione (b); sicurezza e riservatezza (c); conservazione limitata (d); proprietà intellettuale (e); rischi specifici per popolazioni vulnerabili (f)"],["D7.4","Consapevolezza, informazione e comunicazione: raccolta e uso dati (a), politiche/procedure/ruoli (b), diritti incluso il diritto di rifiutare o limitare la raccolta (c)"],["D7.5","Sistema di gestione efficace nelle operazioni e relazioni commerciali"]]},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D7.1–D7.5"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D7"},{"k":"p","t":"Regolamento UE 2016/679 (GDPR) – Protezione dei dati personali"},{"k":"p","t":"D.Lgs. 196/2003 (Codice Privacy) e D.Lgs. 101/2018 (adeguamento GDPR)"},{"k":"p","t":"Convenzione ILO n. 181 – Agenzie per il lavoro (dati raccolti da agenzie)"},{"k":"p","t":"PRO-05 – Rischi; PRO-11 – Monitoraggio e Reclami; PRO-18 – Reclutamento Equo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Dato personale","Qualsiasi informazione relativa a una persona fisica identificata o identificabile (nome, codice, dati biometrici, opinioni, affiliazioni ecc.)."],["Trattamento","Qualsiasi operazione su dati personali: raccolta, registrazione, organizzazione, conservazione, modifica, consultazione, comunicazione, cancellazione."],["Minimizzazione","Principio per cui i dati raccolti devono essere adeguati, pertinenti e limitati a quanto necessario rispetto alle finalità (D7.3b, GDPR Art. 5)."],["Registro dei trattamenti","Inventario dei tipi di dati personali raccolti, mappati alla finalità dichiarata, alla base giuridica, ai destinatari e ai tempi di conservazione."],["DPO","Data Protection Officer – Responsabile della protezione dei dati (ove previsto dal GDPR)."],["Popolazione vulnerabile","Gruppo di personale con rischi specifici in materia di privacy: migranti, minori, personale con disabilità, personale con status giuridico precario (D7.3f)."],["Proprietà intellettuale (PI)","Diritti del personale su materiali, opere, contributi creativi da essi prodotti. L’Organizzazione rispetta tali diritti (D7.3e)."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","DPO","HR","IT","Funzioni"],["Raccolta e uso dati (D7.2)","A","C","R","C","R"],["Gestione dati (D7.3)","A","C","R","C"],["Consapevolezza e comunicazione (D7.4)","A","C","R","C","I"],["SG e BP (D7.5)","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato. DPO = Data Protection Officer (ove previsto)."},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Raccolta, trattamento e utilizzo dei dati personali (D7.2)"},{"k":"t","r":[["Rif.","Requisito D7.2","Modalità operative"],["a)","Solo per motivi rilevanti al lavoro","Il management documenta la motivazione lavorativa specifica prima di raccogliere qualsiasi dato personale. Moduli di consenso specificano perché il dato è raccolto e come sarà utilizzato."],["b)","Solo per le finalità originarie","Registro dei trattamenti mappa ogni tipo di dato alla finalità dichiarata. Accesso limitato al personale che necessita del dato per tale finalità. Revisione periodica dell’allineamento uso-finalità."],["c)","Rispetto dell’autonomia personale","Meccanismo opt-out dove possibile. Possibilità per il personale di richiedere, consultare e aggiornare i propri dati. Comunicazione periodica al personale su quali dati sono conservati e perché."],["d)","Uso limitato per decisioni occupazionali","Definizione dei dati che possono essere utilizzati per assunzione, promozione, cessazione. Revisione da parte di più persone per decisioni che si basano su dati personali. Rimozione dati irrilevanti prima di sottoporre fascicoli ai decisori."],["e)","Uso non discriminatorio","Anonimizzazione dati personali nei processi di reclutamento e promozione (coordinamento PRO-20). No uso di dati sensibili (etnia, religione, salute, orientamento) per decisioni occupazionali salvo obblighi legali."]]},{"k":"p","t":"4.2 Gestione dei dati personali (D7.3)"},{"k":"t","r":[["Rif.","Requisito D7.3","Modalità operative"],["a)","Accuratezza, validità, affidabilità","Revisione annuale dei dati con conferma del personale. Validazione dati contro documenti ufficiali. Processo di correzione con tracciamento completamento."],["b)","Minimizzazione","Checklist pre-raccolta per giustificare ogni tipo di dato. Revisione periodica database per eliminare categorie non essenziali. Trend di riduzione delle categorie raccolte."],["c)","Sicurezza e riservatezza","Accesso role-based con login/password/permessi. Archivi fisici in armadi chiusi a chiave / locali ad accesso controllato. NDA per personale che tratta dati. Crittografia sistemi digitali."],["d)","Conservazione limitata","Tempi massimi di conservazione per tipo di dato. Protocolli di cancellazione/anonimizzazione automatici. Revisione periodica per eliminare file obsoleti. Metodi di distruzione sicura (shredding, wiping, vendor certificati)."],["e)","Proprietà intellettuale","Linee guida sulla titolarità dei materiali creati dal personale. Accordi scritti prima di utilizzare opere, immagini o contributi creativi. Riconoscimento o royalties dove applicabile."],["f)","Rischi popolazioni vulnerabili","Restrizione visibilità dati di gruppi vulnerabili (migranti, minori, disabilità) solo al top management. Valutazione d’impatto privacy (DPIA) per trattamenti ad alto rischio."]]},{"k":"p","t":"4.3 Consapevolezza, informazione e comunicazione (D7.4)"},{"k":"p","t":"Poster, infografiche e guide in linguaggio semplice nelle aree comuni: diritti del personale e obblighi privacy (a)."},{"k":"p","t":"Sessioni formazione privacy dedicate per nuovi assunti; workshop basati su scenari (b)."},{"k":"p","t":"Sistema self-service per consultare/correggere i propri dati personali."},{"k":"p","t":"Referente privacy (DPO o focal person) designato e comunicato a tutto il personale."},{"k":"p","t":"Materiali di sensibilizzazione in tutte le lingue rilevanti e formati accessibili per gruppi vulnerabili."},{"k":"p","t":"Diritto di rifiutare o limitare la raccolta e l’uso dei dati comunicato chiaramente (c)."},{"k":"p","t":"Privacy come punto fisso nell’ordine del giorno del Comitato H&S e del Riesame della Direzione."},{"k":"p","t":"4.4 Sistema di gestione e BP (D7.5)"},{"k":"p","t":"Rischi privacy nel registro rischi (PRO-05) con attenzione a migranti, minori, dati sanitari."},{"k":"p","t":"Clausole contrattuali BP: protezione dati personale BP, minimizzazione, sicurezza, tempi conservazione, diritti accesso/rettifica/cancellazione."},{"k":"p","t":"Valutazione BP con checklist dedicata (MOD-22.02)."},{"k":"p","t":"Audit trail dei sistemi dati; revoca accesso per personale cessato nei tempi definiti."},{"k":"p","t":"Coordinamento con PRO-18 (dati reclutamento), PRO-20 (dati sensibili anti-discriminazione), PRO-21 (dati sanitari H&S)."},{"k":"p","t":"4.5 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Pianificazione","Registro trattamenti; tempi conservazione; DPIA per trattamenti ad alto rischio; base giuridica per ogni dato.","DPO / HR","Annuale"],["2","Raccolta","Checklist pre-raccolta; consenso informato; minimizzazione; finalità documentata.","HR / Funzioni","Per evento"],["3","Trattamento","Accesso role-based; crittografia; NDA; uso limitato a finalità originaria; no discriminazione.","IT / HR","Continuo"],["4","Comunicazione","Formazione; poster; self-service; focal person; diritto opt-out; materiali multilingue.","DPO / HR","Continuo"],["5","Monitoraggio","Audit accessi; revisione allineamento uso-finalità; verifica accuratezza; audit trail.","DPO / IT","Semestrale"],["6","Conservazione e cancellazione","Verifica tempi; cancellazione/anonimizzazione automatica; distruzione sicura; certificati.","IT / DPO","Per scadenza"],["7","BP e catena","Clausole contrattuali; MOD-22.02; revoca accesso personale BP cessato.","Resp. SA / Acquisti","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Raccolta e uso dati (D7.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% categorie dati con giustificazione documentata","N. giustificate / N. tot.","100%","Annuale"],["% usi dati allineati alla finalità originaria","Audit","100%","Annuale"],["Tasso tentativi accesso non "MOD-01.06","titolo":"COMUNICAZIONE ESITI RIESAME DELLA DIREZIONE","pro":"PRO-01","blocks":[{"k":"t","r":[["Riesame di riferimento:","[Completo / Intermedio / Straordinario]","Data RdD:","[GG/MM/AAAA]"],["Data comunicazione:","[GG/MM/AAAA]","Redatto da:","[Resp. SA / SPT]"]]},{"k":"p","t":"Questa sintesi è destinata alla comunicazione degli esiti del Riesame della Direzione a tutto il personale, in conformità ai criteri M10.3 e M7.2 dello Standard SA8000:2026. Il formato deve essere accessibile, in linguaggio chiaro e, se necessario, tradotto nelle lingue del personale."},{"k":"h","t":"1. CONTESTO DEL RIESAME"},{"k":"t","r":[["Data del riesame:",""],["Presieduto da:",""],["Partecipanti chiave:",""],["Scopo principale:",""]]},{"k":"h","t":"2. PRINCIPALI RISULTANZE"},{"k":"t","r":[["Cosa va bene:",""],["Cosa possiamo migliorare:",""],["Obiettivi raggiunti:",""]]},{"k":"h","t":"3. DECISIONI E AZIONI PRINCIPALI"},{"k":"t","r":[["#","Cosa abbiamo deciso","Perché","Chi se ne occupa","Entro quando"]],"b":5},{"k":"h","t":"4. COSA CAMBIA PER VOI"},{"k":"t","r":[["Nuove iniziative per migliorare le condizioni di lavoro:",""],["Modifiche a politiche o procedure:",""],["Risorse aggiuntive assegnate:",""]]},{"k":"h","t":"5. COME POTETE PARTECIPARE"},{"k":"t","r":[["Per domande o chiarimenti:","Contattare [Resp. SA / SPT] – [canale di contatto]"],["Per suggerimenti di miglioramento:","[Cassetta suggerimenti / Email / Portale / SPT]"],["Per segnalazioni riservate:","[Canale reclami riservato] – Garanzia di riservatezza e non ritorsione"],["Prossimo riesame previsto:","[Data indicativa]"]]},{"k":"h","t":"6. MODALITÀ DI DISTRIBUZIONE"},{"k":"t","r":[["Canale di distribuzione","Destinatari","Data"],["□ Bacheca aziendale","Tutto il personale",""],["□ Email / Intranet","Personale con accesso digitale",""],["□ Briefing / Riunione reparto","Personale operativo",""],["□ Newsletter SPT","Tutto il personale",""],["□ Traduzione in lingua: ____________","Personale non italofono",""],["□ Formato audio/visivo","Personale con diverse esigenze di accessibilità",""]]},{"k":"p","t":"Data: _______________    Firma Resp. SA8000: _______________    Firma SPT: _______________"}]},"MOD-02.01":{"code":"MOD-02.01","titolo":"STATUTO DEL SOCIAL PERFORMANCE TEAM (SPT)","pro":"PRO-02","blocks":[{"k":"t","r":[["Organizzazione:","[Nome Organizzazione]","Data istituzione:","[GG/MM/AAAA]"],["Approvato da:","[Alta Direzione]","Rev.:","01"]]},{"k":"h","t":"ARTICOLO 1 – FINALITÀ E MANDATO"},{"k":"p","t":"Il Social Performance Team (SPT) è l’organismo istituito dall’Organizzazione ai sensi del criterio M2.4 dello Standard SA8000:2026 per supportare e facilitare il Sistema di Gestione per il Lavoro Dignitoso. Il SPT ha il mandato di:"},{"k":"p","t":"Facilitare il coinvolgimento attivo dei lavoratori nelle funzioni chiave del sistema di gestione."},{"k":"p","t":"Fungere da ponte tra lavoratori e management per garantire comunicazione bidirezionale efficace."},{"k":"p","t":"Contribuire alla definizione delle politiche, all’identificazione e valutazione dei rischi, alla pianificazione degli obiettivi, al monitoraggio delle prestazioni, alla progettazione dei meccanismi di reclamo e alla determinazione dei rimedi."},{"k":"p","t":"Promuovere il miglioramento continuo delle condizioni di lavoro dignitoso."},{"k":"h","t":"ARTICOLO 2 – COMPOSIZIONE"},{"k":"p","t":"Il SPT è composto da un minimo di [N] membri, così ripartiti:"},{"k":"t","r":[["Componente","N. membri","Modalità di selezione","Requisiti"],["Rappresentanti dei lavoratori","[N] (almeno 50%)","Elezione paritaria indipendente (art. 4)","Lavoratori attivi di qualsiasi livello e tipologia contrattuale"],["Rappresentanti del management","[N]","Designazione da parte dell’AD","Funzioni chiave: HR, Produzione, H&S, Acquisti, Compliance"],["Rappresentanti sindacali","[N] (se aderiscono)","Designazione da parte delle OO.SS.","Invito formale obbligatorio a tutte le OO.SS. presenti"],["Coordinatore","1","Designazione (Resp. SA o altro senior)","Competenza in SA8000 e facilitazione"]]},{"k":"p","t":"La composizione deve riflettere la diversità demografica del personale per genere, età, nazionalità, tipologia contrattuale, turno e reparto. Il confronto demografico è documentato annualmente (MOD-02.07)."},{"k":"h","t":"ARTICOLO 3 – AUTORITÀ E AMBITO"},{"k":"p","t":"Il SPT ha autorità consultiva e propositiva su tutti gli aspetti del Sistema di Gestione SA8000:2026."},{"k":"p","t":"Le raccomandazioni del SPT sono prese in considerazione dall’AD nelle decisioni strategiche; le motivazioni di eventuali mancate adozioni sono documentate e comunicate al SPT."},{"k":"p","t":"Il SPT non esercita funzioni di contrattazione collettiva e non sostituisce il ruolo dei sindacati (M2.4d)."},{"k":"p","t":"La distinzione tra materie del sistema di gestione e materie di contrattazione collettiva è chiarita nella formazione iniziale e richiamata all’inizio di ogni riunione."},{"k":"p","t":"Il SPT ha accesso ai dati e alle informazioni necessarie per lo svolgimento delle proprie funzioni, nel rispetto della riservatezza (D7)."},{"k":"h","t":"ARTICOLO 4 – ELEZIONE DEI RAPPRESENTANTI DEI LAVORATORI"},{"k":"p","t":"L’apertura delle candidature è comunicata almeno 15 giorni prima dell’elezione tramite bacheca, email, briefing di reparto e in tutte le lingue del personale."},{"k":"p","t":"Ogni lavoratore può candidarsi volontariamente; non sono ammesse discriminazioni di alcun tipo."},{"k":"p","t":"Il processo elettorale è supervisionato da un soggetto neutrale: sindacato, ONG, consulente esterno o comitato indipendente designato."},{"k":"p","t":"Il voto avviene a scrutinio segreto (scheda cartacea o piattaforma digitale sicura)."},{"k":"p","t":"I risultati sono pubblicati in modo accessibile a tutto il personale entro 3 giorni lavorativi."},{"k":"p","t":"Il processo è documentato nel Verbale di Elezione (MOD-02.02)."},{"k":"h","t":"ARTICOLO 5 – DURATA DEL MANDATO E ROTAZIONE"},{"k":"p","t":"Il mandato dei membri lavoratori ha durata di [12/24] mesi."},{"k":"p","t":"La rielezione è consentita per un massimo di [2] mandati consecutivi per favorire la rotazione."},{"k":"p","t":"I membri del management sono designati per la medesima durata e possono essere sostituiti dall’AD."},{"k":"p","t":"In caso di dimissioni, trasferimento o cessazione del rapporto di lavoro, il membro è sostituito secondo le stesse modalità di selezione (elezione per lavoratori, designazione per management)."},{"k":"p","t":"Al termine di ogni mandato, il SPT produce un bilancio del mandato (incluso nel MOD-02.07)."},{"k":"h","t":"ARTICOLO 6 – RIUNIONI E DOCUMENTAZIONE"},{"k":"p","t":"Riunioni ordinarie: almeno 1 volta al mese, con OdG predisposto almeno 5 gg prima."},{"k":"p","t":"Riunioni straordinarie: su richiesta di almeno 1/3 dei membri o su iniziativa del coordinatore."},{"k":"p","t":"Riunioni congiunte con l’AD: almeno semestrali."},{"k":"p","t":"Entrambe le componenti (lavoratori e management) possono proporre punti all’ordine del giorno."},{"k":"p","t":"Ogni riunione produce un verbale (MOD-02.03) distribuito a tutto il personale entro 5 gg."},{"k":"p","t":"Un action log pubblico (MOD-02.04) traccia le azioni, i responsabili, le scadenze e lo stato."},{"k":"p","t":"Le riunioni si svolgono durante l’orario di lavoro; il tempo dedicato è retribuito."},{"k":"h","t":"ARTICOLO 7 – PROTEZIONI E GARANZIE"},{"k":"p","t":"Nessun membro del SPT subirà ritorsioni, discriminazioni, azioni disciplinari o conseguenze negative per la propria partecipazione."},{"k":"p","t":"Il tempo dedicato alle attività SPT (riunioni, preparazione, formazione, monitoraggio) è considerato orario di lavoro regolare e retribuito."},{"k":"p","t":"I membri hanno diritto alla riservatezza sulle opinioni espresse durante le riunioni."},{"k":"p","t":"Qualsiasi segnalazione di ritorsione è gestita in via prioritaria tramite il meccanismo di reclamo (PRO-12)."},{"k":"p","t":"L’Organizzazione fornisce la formazione necessaria ai membri del SPT per lo svolgimento delle loro funzioni."},{"k":"h","t":"ARTICOLO 8 – MODIFICA DELLO STATUTO"},{"k":"p","t":"Lo Statuto può essere modificato su proposta del SPT o dell’AD, previa consultazione dei sindacati presenti. Le modifiche sono approvate dall’AD e comunicate a tutto il personale."},{"k":"t","r":[["Firma Alta Direzione:\nData: _______________","Firma Coordinatore SPT:\nData: _______________"]]},{"k":"p","t":"Firma Rappresentante Lavoratori SPT: _______________    Data: _______________"},{"k":"p","t":"Firma Rappresentante OO.SS. (se partecipante): _______________    Data: _______________"}]},"MOD-02.02":{"code":"MOD-02.02","titolo":"VERBALE DI ELEZIONE DEI RAPPRESENTANTI LAVORATORI NEL SPT","pro":"PRO-02","blocks":[{"k":"t","r":[["DATI GENERALI DELL’ELEZIONE"],["Data elezione:","","Orario:","Dalle _____ alle _____"],["Luogo:","","Seggi elettorali:","[N. seggi]"],["N. posti da eleggere:","","Durata mandato:","[12/24] mesi"],["Supervisore neutrale:","","Qualifica supervisore:","□ Sindacato\n□ ONG\n□ Consulente esterno\n□ Comitato indipendente"]]},{"k":"h","t":"COMUNICAZIONE E CANDIDATURE"},{"k":"t","r":[["Data comunicazione apertura candidature:",""],["Canali di comunicazione utilizzati:","□ Bacheca  □ Email  □ Briefing reparto  □ App  □ Altro: _______"],["Lingue di comunicazione:",""],["Data chiusura candidature:",""],["N. totale candidature ricevute:",""]]},{"k":"h","t":"ELENCO CANDIDATI"},{"k":"t","r":[["#","Nome e Cognome","Reparto / Funzione","Tipologia contrattuale","Turno"]],"b":6},{"k":"h","t":"DATI DI VOTO"},{"k":"t","r":[["N. totale lavoratori aventi diritto al voto:",""],["N. lavoratori che hanno votato:",""],["Tasso di partecipazione:","______ %"],["Modalità di voto:","□ Scheda cartacea segreta  □ Piattaforma digitale sicura"],["N. schede nulle / bianche:",""]]},{"k":"h","t":"RISULTATI"},{"k":"t","r":[["#","Candidato","Voti ricevuti","% voti","Posizione","Esito"],["1","","□ Eletto\n□ Non eletto"],["2",""],["3",""],["4",""],["5",""],["6",""]]},{"k":"h","t rget 100%)"]]}]},"MOD-04.04":{"code":"MOD-04.04","titolo":"TEMPLATE POLITICA DI ASPETTATIVE RECIPROCHE PER I BUSINESS PARTNER","pro":"PRO-04","blocks":[{"k":"p","t":"Il seguente template fornisce la struttura tipo della Politica di Aspettative Reciproche verso i Business Partner, conforme al criterio M4.2 (a–d). L’Organizzazione personalizza il contenuto in base al proprio contesto."},{"k":"h","t":"[NOME ORGANIZZAZIONE]\nPOLITICA DI ASPETTATIVE RECIPROCHE PER I BUSINESS PARTNER"},{"k":"h","t":"ARTICOLO 1 – PREMESSA E AMBITO"},{"k":"p","t":"[Nome Organizzazione] è impegnata nel rispetto dei principi del Lavoro Dignitoso, come definiti nello Standard SA8000:2026. La presente politica stabilisce le aspettative reciproche che regolano i rapporti con i nostri Business Partner (fornitori, subappaltatori, agenzie interinali, distributori e altri partner commerciali) in materia di diritti del lavoro, salute e sicurezza, etica e integrità."},{"k":"p","t":"La politica si applica a tutti i Business Partner, indipendentemente dalla posizione geografica, dal settore o dalla dimensione."},{"k":"h","t":"ARTICOLO 2 – RISPETTO DEI PRINCIPI (M4.2a)"},{"k":"p","t":"I Business Partner si impegnano a:"},{"k":"p","t":"Rispettare i principi dello Standard SA8000:2026, le leggi e i regolamenti nazionali e locali applicabili, e qualsiasi altro requisito pertinente."},{"k":"p","t":"Proibire il lavoro minorile, il lavoro forzato o obbligatorio, e ogni forma di discriminazione."},{"k":"p","t":"Garantire condizioni di lavoro sicure e salubri, orari di lavoro legali e retribuzioni eque."},{"k":"p","t":"Rispettare la libertà di associazione e il diritto alla contrattazione collettiva."},{"k":"p","t":"Vietare qualsiasi forma di ritorsione contro i lavoratori che segnalano violazioni."},{"k":"h","t":"ARTICOLO 3 – DUE DILIGENCE (M4.2b)"},{"k":"p","t":"[Nome Organizzazione] condurrà attività di due diligence sui propri Business Partner, che possono includere:"},{"k":"p","t":"Questionari di pre-qualifica e autovalutazione."},{"k":"p","t":"Audit e ispezioni, inclusi audit senza preavviso."},{"k":"p","t":"Monitoraggio continuo basato sul rischio."},{"k":"p","t":"Revisione di documentazione, registri e certificazioni."},{"k":"p","t":"I Business Partner si impegnano a cooperare pienamente con le attività di due diligence, garantendo accesso a documenti, siti e lavoratori."},{"k":"h","t":"ARTICOLO 4 – RESPONSABILITÀ E AZIONI CORRETTIVE (M4.2c)"},{"k":"p","t":"[Nome Organizzazione] riconosce le proprie responsabilità nei casi in cui le proprie pratiche (termini contrattuali, tempistiche, pressioni sui prezzi) possano causare o contribuire all’incapacità dei Business Partner di soddisfare le aspettative. In tali casi:"},{"k":"p","t":"L’Organizzazione adotterà misure per modificare le proprie pratiche."},{"k":"p","t":"Sarà fornito supporto tecnico e formativo ai Business Partner per il miglioramento."},{"k":"p","t":"Saranno concordati piani di miglioramento con scadenze e obiettivi misurabili."},{"k":"p","t":"L’approccio sarà graduale, privilegiando il miglioramento rispetto alla cessazione immediata."},{"k":"h","t":"ARTICOLO 5 – CESSAZIONE DELLE RELAZIONI (M4.2d)"},{"k":"p","t":"La cessazione di un rapporto con un Business Partner avverrà come ultima risorsa e sarà preceduta da:"},{"k":"p","t":"Engagement con il Business Partner per comprendere le cause della non conformità."},{"k":"p","t":"Offerta di supporto per il miglioramento con tempi definiti."},{"k":"p","t":"Valutazione documentata dei rischi per il personale del Business Partner derivanti dalla cessazione."},{"k":"p","t":"Definizione di un piano di disengagement responsabile che consideri l’impatto sui lavoratori."},{"k":"p","t":"I criteri specifici per la cessazione immediata includono: evidenza di lavoro minorile, lavoro forzato, abusi gravi o rifiuto sistematico di collaborare."},{"k":"h","t":"ARTICOLO 6 – CLAUSOLA CONTRATTUALE"},{"k":"p","t":"[Da inserire nei contratti e ordini di acquisto]"},{"k":"p","t":"\"Il Fornitore/Partner dichiara di aver ricevuto, compreso e accettato la Politica di Aspettative Reciproche di [Nome Organizzazione] (codice: MOD-04.04, Rev. [N.]) e si impegna a rispettarne integralmente i contenuti. Il Fornitore/Partner accetta le attività di due diligence, si impegna a comunicare tempestivamente eventuali criticità e a collaborare per il miglioramento delle condizioni di lavoro dignitoso nella propria catena del valore.\""},{"k":"t","r":[["Per [Nome Organizzazione]:\nNome: _______________\nFirma: _______________\nData: _______________","Per il Business Partner:\nNome: _______________\nFirma: _______________\nData: _______________"]]}]},"MOD-04.05":{"code":"MOD-04.05","titolo":"CHECKLIST DI COERENZA DELLE POLITICHE, OBIETTIVI E INCENTIVI (M4.3)","pro":"PRO-04","blocks":[{"k":"t","r":[["Data verifica:","[GG/MM/AAAA]","Periodo di riferimento:","[AAAA]"],["Verificato da:","[Resp. SA / Funzioni]","Approvato da:","[AD]"]]},{"k":"p","t":"Questa checklist supporta la verifica annuale della coerenza tra tutte le politiche, gli obiettivi, le pratiche e i sistemi di incentivazione dell’Organizzazione e gli impegni assunti ai sensi dello Standard SA8000:2026."},{"k":"h","t":"A. REVISIONE DELLE POLITICHE ORGANIZZATIVE"},{"k":"t","r":[["#","Politica / Documento","Funzione resp.","Ultima revisione","Coerente con SA8000?","Contraddizioni?","Azione correttiva"],["1","Politica HR / Personale","","□ Sì □ Parz. □ No","□ Sì □ No",""],["2","Politica Salute e Sicurezza",""],["3","Politica Qualità",""],["4","Politica Ambientale",""],["5","Codice Etico / Condotta",""],["6","Politica Acquisti / Fornitori",""],["7","Politica Anti-corruzione",""],["8","Politica Whistleblowing",""],["9","Regolamento interno",""]],"b":2},{"k":"h","t":"B. VERIFICA OBIETTIVI DIPARTIMENTALI"},{"k":"t","r":[["#","Dipartimento","Obiettivo / Target","Dichiarazione allineamento SA8000?","Contraddizione?","Azione"]],"b":5},{"k":"h","t":"C. VERIFICA SISTEMI DI INCENTIVAZIONE"},{"k":"t","r":[["#","Sc const KEY = "sgs_sa8000_v1";

  mode(){

      try {
        const r = await fetch(cfg.url, { headers: authHdr(cfg) });
        if (r.ok){ const o = await r.json(); if (o && o.orgs){ o.cfg = cfg; return o; } }
      } catch(e){ console.warn("rest load", e); }
    }
    try {
      const raw = localStorage.getItem(KEY);
      if (raw){ const o = JSON.parse(raw); if (cfg) o.cfg = cfg; return o; }
    } catch(e){}
    return cfg ? { orgs: [], current: null, cfg } : null;

        const r = await fetch(DB.cfg.url, { method: DB.cfg.metodo || "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, authHdr(DB.cfg)),
          body: JSON.stringify(payload) });
        if (!r.ok) toast("Endpoint: risposta " + r.status);
      } catch(e){ toast("Endpoint non raggiungibile — copia locale mantenuta"); }
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); return true; }
    catch(e){ toast("Spazio locale esaurito — esporta l'archivio"); return false; }
  }
};

   I documenti base contengono segnaposto tra parentesi quadre: vengono
   risolti dai dati dell'anagrafica; quelli non risolti restano evidenziati.
   ========================================================================= */
const TOKENS = [
  { re: /\[Nome Organizzazione\]|\[Ragione Sociale\]|\[Organizzazione\]/g, f: a => a.ragione },
  { re: /\[Resp\. SA8000\]|\[Responsabile SA8000\]|\[Resp\. SA\]/g,        f: a => a.respSA },
  { re: /\[Alta Direzione\]|\[Direzione\]|\[Legale Rappresentante\]/g,      f: a => a.direzione },
  { re: /\[CCNL\]|\[CCNL applicato\]/g,                                     f: a => a.ccnl },
  { re: /\[Sede\]|\[Sede legale\]|\[Indirizzo\]/g,                          f: a => a.sede },
  { re: /\[P\.IVA\]|\[Partita IVA\]/g,                                      f: a => a.piva },
  { re: /\[Settore\]/g,                                                     f: a => a.settore },
  { re: /\[Sito web\]|\[sito web\]/g,                                       f: a => a.sitoweb },
  { re: /\[email\]|\[Email\]/g,                                             f: a => a.email },
  { re: /\[telefono\]|\[Telefono\]/g,                                       f: a => a.tel },
  { re: /reclami\.sa8000@\[org\]\.it/g,                                     f: a => a.reclamiEmail },
  { re: /\[org\]/g,                                                         f: a => slug(a.ragione) },
  { re: /\[GG\/MM\/AAAA\]|\[Data\]|\[data\]/g,                              f: a => itDate(a.dataAdozione) },
  { re: /\[Rev\.\]|\[Revisione\]/g,                                         f: a => a.rev }
];
function slug(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/s\.?r\.?l\.?|s\.?p\.?a\.?|s\.?a\.?s\.?|s\.?n\.?c\.?/g, "").replace(/[^a-z0-9]+/g, "").slice(0, 22) || "azienda"; }

/* pers(testo) → testo personalizzato; i segnaposto irrisolti restano tali */
function pers(txt){
  const o = org(); if (!o) return txt;
  let s = String(txt == null ? "" : txt);
  TOKENS.forEach(t => { const v = t.f(o.ana); if (v) s = s.replace(t.re, v); });
  return s;
}
/* persH(testo) → HTML con i segnaposto residui evidenziati */
function persH(txt){
  return esc(pers(txt)).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="miss">' + m + "</span>");
}
function contaTokenAperti(txt){ const m = pers(txt).match(/\[[^\]\n]{1,60}\]/g); return m ? m.length : 0; }

const STATI_DOC = ["Da personalizzare", "In redazione", "Approvata", "Non applicabile"];
function statoPro(c){ const o = org(); return (o && o.pro[c] && o.pro[c].stato) || "Da personalizzare"; }
function statoMod(c){ const o = org(); return (o && o.mod[c] && o.mod[c].stato) || "Da personalizzare"; }
function tagStato(s){
  const m = { "Approvata":"t-grn", "In redazione":"t-amb", "Da personalizzare":"t-gry", "Non applicabile":"t-blu" };
  return '<span class="tag ' + (m[s] || "t-gry") + '">' + esc(s) + "</span>";
}
function proState(c){ const o = org(); if (!o.pro[c]) o.pro[c] = { stato:"Da personalizzare", rev:"01", data:"", ovr:{}, note:"" }; if (!o.pro[c].ovr) o.pro[c].ovr = {}; return o.pro[c]; }
function modState(c){ const o = org(); if (!o.mod[c]) o.mod[c] = { stato:"Da personalizzare", note:"" }; return o.mod[c]; }

function copertura(){
  const o = org(); if (!o) return { pro:0, mod:0, crit:0, reg:0, tot:0 };
  const appr = PROLIST.filter(c => statoPro(c) === "Approvata").length;
  const proN = PROLIST.filter(c => statoPro(c) !== "Non applicabile").length || 1;
  const modAppr = MODLIST.filter(c => statoMod(c) === "Approvata").length;
  const modN = MODLIST.filter(c => statoMod(c) !== "Non applicabile").length || 1;
  const cs = CRIT.crit.filter(k => { const s = (o.crit[k.c] || {}).stato; return s === "ok"; }).length;
  const cn = CRIT.crit.filter(k => (o.crit[k.c] || {}).stato !== "na").length || 1;
  const rec = REGDEF.reduce((a, r) => a + (o.reg[r.id] || []).length, 0);
  const regOk = REGDEF.filter(r => (o.reg[r.id] || []).length > 0).length;
  const ana = campiAnaCompilati();
  return {
    pro: Math.round(appr / proN * 100), mod: Math.round(modAppr / modN * 100),
    crit: Math.round(cs / cn * 100), reg: Math.round(regOk / REGDEF.length * 100),
    ana, rec, appr, modAppr, cs, cn,
    tot: Math.round((ana * .15 + appr / proN * 100 * .3 + modAppr / modN * 100 * .15 + cs / cn * 100 * .25 + regOk / REGDEF.length * 100 * .15))
  };
}
const ANA_OBB = ["ragione","forma","piva","sede","settore","addetti","ccnl","respSA","direzione","dataAdozione","reclamiEmail","scopo"];
function campiAnaCompilati(){ const o = org(); if (!o) return 0; const n = ANA_OBB.filter(k => String(o.ana[k] || "").trim()).length; return Math.round(n / ANA_OBB.length * 100); }

function aperture(){
  const o = org(), out = [];
  const chk = (id, nome, f) => { const n = (o.reg[id] || []).filter(f).length; if (n) out.push({ reg:id, nome, n, tag: tagg(id, n) }); };
  chk("reclint", "Reclami interni non chiusi", r => r.stato && r.stato !== "Chiuso");
  chk("reclext", "Reclami esterni non chiusi", r => r.stato && r.stato !== "Chiuso");
  chk("ac", "Azioni correttive aperte", r => r.stato && r.stato !== "Chiusa");
  chk("rischi", "Rischi non presidiati", r => r.stato === "Aperto" || r.stato === "In gestione");
  chk("obiettivi", "Obiettivi in corso", r => r.stato === "Pianificato" || r.stato === "In corso");
  chk("incidenti", "Eventi H&S aperti", r => r.stato && r.stato !== "Chiuso");
  chk("giovani", "Giovani lavoratori da verificare", r => r.stato !== "Conforme");

function scadenzario(){
  const o = org(), out = [];
  REGDEF.forEach(d => {
    const kScad = d.cols.find(c => c.t === "date" && /scad/i.test(c.k));
    if (!kScad) return;
    (o.reg[d.id] || []).forEach(r => {
      const chiuso = /chius|complet|raggiunt|conforme/i.test(r.stato || "");
      if (!r[kScad.k] || chiuso) return;
      const gg = Math.round((new Date(r[kScad.k]) - new Date()) / 86400000);
      const lab = d.cols.find(c => c.tab && c.t !== "date" && c.k !== "rif");
      out.push({ data: r[kScad.k], reg: d.nome, testo: (r.rif ? r.rif + " · " : "") + String(r[lab ? lab.k : "rif"] || "").slice(0, 70),
        tag: '<span class="tag ' + (gg < 0 ? "t-red" : gg < 15 ? "t-amb" : "t-gry") + '">' + (gg < 0 ? "scaduta" : gg + " gg") + "</span>" });
    });
  });
  return out.sort((a, b) => a.data.localeCompare(b.data));
}

function tokenReport(){

  return '<div class="scroll"><table><thead><tr><th>Documento</th><th>Titolo</th><th style="text-align:right">Segnaposto aperti</th><th></th></tr></thead><tbody>' +

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/, RE_MODH = /^(MOD-\d\d\.\d\d)\b/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";
  if (!edit) return inner;
  return '<div class="blk' + (modif ? " ovr" : "") + '" data-blk="' + i + '">' + inner +
    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 60);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 6);
  for (let i = 0; i < vuote; i++) h += "<tr>" + ('<td><span class="fill"></span></td>').repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}
function docHTML(blocks, ovr, edit){ return blocks.map((b, i) => blockHTML(b, i, ovr, edit)).join(""); }

VIEWS.kpi = () => {
  const o = org(); if (!o) return VIEWS.pf();
  const R = o.reg, n = a => (a || []).length;
  const pc = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  const ri = R.reclint || [], re = R.reclext || [], ac = R.ac || [], au = R.audit || [], ri_ch = ri.filter(x => x.stato === "Chiuso");
  const inTempo = ri_ch.filter(x => x.dataric && x.chius && (new Date(x.chius) - new Date(x.dataric)) / 86400000 <= (x.grav === "Alta" ? 15 : 30)).length;
  const conf5 = ri.filter(x => x.dataric && x.conf && (new Date(x.conf) - new Date(x.dataric)) / 86400000 <= 5).length;
  const rischi = R.rischi || [], alti = rischi.filter(x => (Number(x.grav) || 0) * (Number(x.prob) || 0) >= 15);
  const ob = R.obiettivi || [], obRagg = ob.filter(x => x.stato === "Raggiunto");
  const inc = R.incidenti || [], infort = inc.filter(x => x.tipo === "Infortunio");
  const gg = infort.reduce((a, x) => a + (Number(x.gg) || 0), 0);
  const cop = copertura();
  const box = (l, v, h) => '<div class="card kpi"><div class="l">' + l + '</div><div class="n">' + v + '</div><div class="h">' + esc(h) + "</div></div>";
  return "<h1>Indicatori</h1><p class=\"sub\">Calcolati sui registri operativi. I target sono quelli fissati nelle procedure del corpus.</p>" +
    '<div class="grid g4">' +
      box("Conformità criteri", cop.crit + "%", cop.cs + " criteri presidiati su " + cop.cn) +
      box("Reclami interni", n(ri), ri.filter(x => x.stato !== "Chiuso").length + " ancora aperti") +
      box("Chiusi nei tempi", pc(inTempo, ri_ch.length), "target ≥ 90% (PRO-12)") +
      box("Conferma entro 5 gg", pc(conf5, ri.length), "target 100% (PRO-12)") +
    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      box("Reclami esterni", n(re), re.filter(x => x.stato !== "Chiuso").length + " aperti") +
      box("Azioni correttive", n(ac), ac.filter(x => x.stato !== "Chiusa").length + " non chiuse") +
      box("AC chiuse", pc(ac.filter(x => x.stato === "Chiusa").length, ac.length), "efficacia da verificare in riesame") +
      box("Audit eseguiti", au.filter(x => x.stato !== "Pianificato").length + "/" + n(au), "PRO-11 · piano annuale") +
    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      box("Rischi in registro", n(rischi), alti.length + " ad alta priorità (≥15)") +
      box("Obiettivi raggiunti", pc(obRagg.length, ob.length), n(ob) + " obiettivi pianificati") +
      box("Infortuni", infort.length, gg + " giorni di assenza · " + inc.filter(x => x.tipo === "Near miss").length + " near miss") +
      box("Giovani lavoratori", n(R.giovani), (R.giovani || []).filter(x => x.stato !== "Conforme").length + " da verificare") +
    "</div>" +
    '<div class="card" style="margin-top:14px"><h2>Reclami per criterio SA8000</h2>' + distrib(ri.concat(re)) + "</div>" +
    '<div class="card"><h2>Rischi per priorità</h2>' + matriceRischi(rischi) + "</div>";
};
function distrib(rows){
  const m = {}; rows.forEach(r => { const k = (r.crit || "n.d.").split(".")[0]; m[k] = (m[k] || 0) + 1; });
  const ks = Object.keys(m).sort(); if (!ks.length) return '<div class="empty">Nessun reclamo registrato.</div>';
  const max = Math.max.apply(null, ks.map(k => m[k]));
  return ks.map(k => '<div class="row" style="margin-bottom:6px"><span class="code" style="width:52px">' + esc(k) + "</span>" +
    '<div class="track" style="flex:1"><i style="width:' + Math.round(m[k] / max * 100) + '%"></i></div>' +
    '<b class="num" style="width:30px">' + m[k] + "</b></div>").join("");
}
function matriceRischi(rows){
  if (!rows.length) return '<div class="empty">Nessun rischio registrato.</div>';
  const cell = {};
  rows.forEach(r => { const g = Number(r.grav) || 0, p = Number(r.prob) || 0; if (g && p) cell[g + "-" + p] = (cell[g + "-" + p] || 0) + 1; });
  let h = '<div class="scroll"><table><thead><tr><th>Gravità ↓ / Probabilità →</th>' + [1,2,3,4,5].map(p => "<th>" + p + "</th>").join("") + "</tr></thead><tbody>";
  for (let g = 5; g >= 1; g--){
    h += "<tr><th>" + g + "</th>";
    for (let p = 1; p <= 5; p++){
      const n = cell[g + "-" + p] || 0, s = g * p;
      const col = s >= 15 ? "var(--red-lt)" : s >= 8 ? "var(--amber-lt)" : "var(--green-lt)";
      h += '<td style="background:' + col + ';text-align:center;font-family:var(--mono)">' + (n || "") + "</td>";
    }
    h += "</tr>";
  }
  return h + "</tbody></table></div>";
}

  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + esc(titolo) + "</title><style>" +
    "@page{size:A4;margin:2cm}body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#16202A;line-height:1.45}" +
    "h1{font-size:16pt;margin:0 0 4pt}h2{font-size:13pt;margin:0 0 10pt;color:#2F5D7C}h4{font-size:11.5pt;color:#1E4258;margin:14pt 0 5pt}" +
    "table{border-collapse:collapse;width:100%;margin:6pt 0 10pt;font-size:9.5pt}th{background:#E7EFF4;text-align:left}" +
    "th,td{border:1px solid #B9C6CE;padding:4pt 6pt;vertical-align:top}" +
    ".sec{background:#E7EFF4;color:#1E4258;font-weight:bold;padding:5pt 8pt;margin:12pt 0 6pt}" +
    ".dhead{border-bottom:2px solid #2F5D7C;padding-bottom:8pt;margin-bottom:14pt}.k{font-size:8.5pt;color:#7C8992;letter-spacing:1px}" +
    ".code{font-size:8.5pt;color:#7C8992}.miss{color:#B3261E;font-style:italic}.fill{display:block;min-height:14pt;border-bottom:1px solid #B9C6CE}" +
    ".sig{margin-top:22pt}.sig div{display:inline-block;width:45%;margin-right:4%}.sig b{display:block;font-size:8.5pt;color:#7C8992;margin-bottom:24pt}" +
    ".noprint{display:none}</style></head><body>" + corpo + "</body></html>";
}
function esportaWord(tipo, id){
  const o = org(), rag = o.ana.ragione || o.nome;
  let titolo = "", corpo = "";
  if (tipo === "pro"){
    const st = proState(id);
    titolo = id + " " + PROMETA[id].titolo;
    corpo = '<div class="dhead"><div class="k">' + id + ' · SA8000:2026</div><h2>' + esc(PROMETA[id].titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + (st.data ? " · " + itDate(st.data) : "") + "</div></div>" +
      docHTML(PRO[id].blocks, st.ovr, false) + (st.add ? '<div class="sec">Integrazioni</div><p>' + nl2br(st.add) + "</p>" : "");
  } else if (tipo === "mod"){
    const d = MOD[id], reg = REGDEF.find(r => r.mod === id);
    titolo = id + " " + d.titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + d.pro + '</div><h2>' + esc(d.titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + "</div></div>" + (reg ? regStampa(reg) : "") + docHTML(d.blocks, null, false);
  } else if (tipo === "man"){
    titolo = "Manuale SA8000 " + rag; corpo = manuale().replace(/<div class="row between noprint[\s\S]*?<\/div><\/div>/, "");
  } else if (tipo === "corpus"){
    titolo = "Sistema di gestione SA8000 " + rag;
    corpo = manuale().replace(/<div class="row between noprint[\s\S]*?<\/div><\/div>/, "") +
      PROLIST.map(c => { const st = proState(c);
        return '<div style="page-break-before:always"></div><div class="dhead"><div class="k">' + c + '</div><h2>' + esc(PROMETA[c].titolo) + "</h2>" +
          '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[c].blocks, st.ovr, false); }).join("");
  }
  scarica(fileSlug(rag) + "_" + fileSlug(titolo) + ".doc", wordWrap(titolo, corpo), "application/msword");
  toast("Documento pronto per Word");
}
function csvReg(id){
  const d = REGBYID[id], rows = org().reg[id] || [];
  const head = d.cols.map(c => c.l);
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  return [head.map(q).join(";")].concat(rows.map(r => d.cols.map(c => q(r[c.k])).join(";"))).join("\r\n");
}

/* =========================================================================
   EVENTI
   ========================================================================= */
const ACT = {
  home(){ view = org() ? "home" : "pf"; render(); },
  newOrg(){
    const n = prompt("Nome dell'organizzazione");
    if (!n) return;
    const o = nuovaOrg(n.trim()); DB.orgs.push(o); DB.current = o.id; view = "ana"; touch(); render(); toast("Scheda creata con il corpus completo");
  },
  openOrg(el){ DB.current = el.dataset.id; view = "home"; sel = { sez:"M" }; queueSave(); render(); },
  dupOrg(el){
    const src = DB.orgs.find(a => a.id === el.dataset.id); if (!src) return;
    const c = JSON.parse(JSON.stringify(src)); c.id = uid(); c.nome = src.nome + " (copia)"; c.created = new Date().toISOString();
    DB.orgs.push(c); touch(); render(); toast("Scheda duplicata");
  },
  delOrg(el){
    const a = DB.orgs.find(x => x.id === el.dataset.id); if (!a) return;
    if (!confirm("Eliminare «" + a.nome + "» e tutte le sue registrazioni?")) return;
    DB.orgs = DB.orgs.filter(x => x.id !== a.id); if (DB.current === a.id) DB.current = null;
    dirty = true; queueSave(); render();
  },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  bulkPro(el){
    if (!confirm("Applicare lo stato «" + el.dataset.s + "» a tutte le 22 procedure?")) return;
    PROLIST.forEach(c => proState(c).stato = el.dataset.s); touch(); render();
  },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){
    const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value;
    const st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato");
  },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  goreg(el){ sel.reg = el.dataset.id; view = "reg"; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){
    const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const arr = org().reg[id];
    if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata");
  },
  delRec(el){
    if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render();
  },
  closeModal(){ closeModal(); },
  setCrit(el){
    const o = org(), c = el.dataset.id, s = el.dataset.s;
    o.crit[c] = o.crit[c] || {};
    o.crit[c].stato = o.crit[c].stato === s ? "" : s;
    touch(); render();
  },
  evidCrit(el){ modalEvidenza(el.dataset.id); },
  saveEvid(el){
    const o = org(), c = el.dataset.id;
    o.crit[c] = o.crit[c] || {};
    o.crit[c].evid = document.getElementById("evTxt").value;
    o.crit[c].note = document.getElementById("evNote").value;
    closeModal(); touch(); render();
  },
  sez(el){ sel.sez = el.dataset.id; render(); },
  openDoc(el){
    const id = el.dataset.id;
    if (id === "man"){ sel.man = 1; render(); return; }
    const html = id === "elenco" ? elencoDoc() : matriceConf();
    document.getElementById("view").innerHTML =
      '<div class="row between noprint" style="margin-bottom:14px"><button class="btn ghost sm" data-act="backDoc">← Manuale e stampe</button>' +
      '<button class="btn sm" data-act="stampa">Stampa</button></div>' + html;
  },
  backDoc(){ sel.man = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){
    const payload = { orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() };
    scarica("archivio-sa8000-" + oggi() + ".json", JSON.stringify(payload, null, 1), "application/json");
  },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){
    if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); }
  },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){
    if (!confirm("Svuotare l'archivio locale? Le schede non esportate andranno perse.")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){}
    view = "pf"; queueSave(); render();
  }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.man = null; sel.q = "";
    document.getElementById("side").classList.remove("open");
    render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione") { org().nome = t.value || org().nome; } touch(); return; }
  if (t.dataset.pro != null){ const st = proState(t.dataset.id); st[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ const st = modState(t.dataset.id); st[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (t.id === "pfq" || t.id === "sgsq" || t.id === "modq"){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const n = document.getElementById(id); if (n){ n.focus(); n.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "orgSel"){ DB.current = t.value; sel = { sez:"M" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", e => { if (dirty){ STORE.save(); } });
function resp(){
  const b = document.getElementById("menuBtn");
  if (b) b.style.display = window.innerWidth < 980 ? "" : "none";
}
window.addEventListener("resize", resp);
document.addEventListener("click", e => { if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open"); });

/* =========================================================================
   AVVIO
   ========================================================================= */
(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf";
  render(); resp();
})();

</script>
