e lo Standard”, coinvolgimento, trend, buone pratiche, input al RdD"]]}]},"PRO-16":{"code":"PRO-16","blocks":[{"k":"t","r":[["PROCEDURA PRO-16"],["Codice:","PRO-16","Revisione:","01"],["Titolo:","PROTEZIONE DEI MINORI E DEI GIOVANI LAVORATORI"],["Criteri SA8000:","D1.1–D1.5","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire la protezione dei diritti dei minori, inclusi i giovani lavoratori, in tutte le operazioni e relazioni commerciali dell’Organizzazione, in conformità ai criteri D1.1–D1.5 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione rispetti i diritti dei minori, inclusi i giovani lavoratori (D1.1)."},{"k":"p","t":"Non sia impiegato personale al di sotto dei 15 anni di età (o dell’età dell’obbligo scolastico, se superiore), salvo le eccezioni previste per i “Legally Working Children” (D1.2)."},{"k":"p","t":"L’impiego dei giovani lavoratori protegga lo sviluppo sociale, morale e fisico; non pregiudichi il percorso educativo; garantisca retribuzione e benefit commisurati agli adulti in posizioni simili; non superi i limiti orari (8h/giorno, 10h totali giorno con scuola e trasporto); non avvenga in orario notturno (D1.3 a–g)."},{"k":"p","t":"Dove minori non lavoratori siano presenti in ambienti di lavoro, sia garantita protezione da rischi, fornitura di bisogni primari, supervisione adulta adeguata e non interferenza con i processi (D1.4 a–d)."},{"k":"p","t":"L’Organizzazione sviluppi sistemi di gestione efficaci per rispettare o superare i requisiti in tutte le operazioni e relazioni commerciali (D1.5)."},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D1.1–D1.5"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D1"},{"k":"p","t":"Convenzione ILO n. 138 – Età minima per l’ammissione al lavoro"},{"k":"p","t":"Convenzione ILO n. 182 – Forme peggiori di lavoro minorile"},{"k":"p","t":"Convenzione ONU sui Diritti del Fanciullo (UNCRC)"},{"k":"p","t":"D.Lgs. 345/1999 e s.m.i. – Tutela del lavoro dei minori (normativa italiana)"},{"k":"p","t":"D.Lgs. 81/2008 – Tutela della salute e sicurezza (disposizioni per minori)"},{"k":"p","t":"PRO-05 – Contesto, Impatti e Rischi (rischi relativi ai minori)"},{"k":"p","t":"PRO-11 – Monitoraggio e Meccanismi di Reclamo"},{"k":"p","t":"PRO-14 – Azioni Correttive e Rimedio"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Minore (Child)","Qualsiasi persona al di sotto dei 15 anni di età (o al di sotto dell’età dell’obbligo scolastico, se superiore), salvo le eccezioni per i Legally Working Children."],["Giovane lavoratore (Young Worker)","Lavoratore di età superiore a quella del minore ma inferiore a 18 anni, soggetto a tutele specifiche per proteggere il proprio sviluppo."],["Legally Working Child","Minore il cui impiego è conforme alla definizione dello Standard SA8000:2026 e alle eccezioni previste dalla legislazione locale."],["Minore non lavoratore","Minore presente negli ambienti di lavoro ma non impiegato dall’Organizzazione (es. figli di dipendenti)."],["Lavoro notturno","Lavoro svolto nelle ore notturne come definite dalla legislazione applicabile (in Italia: dalle 22:00 alle 6:00 o dalle 23:00 alle 7:00 per i minori di 16 anni)."],["Impatto negativo (Adverse Impact)","Situazione di danno o rischio identificata relativamente all’impiego o alla presenza di minori, inclusi: lavoro in condizioni pericolose, orari eccessivi, esclusione da benefit, interferenza con l’istruzione."],["AD / Resp. SA / SPT / HR","Alta Direzione / Responsabile SA8000 / Social Performance Team / Risorse Umane."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR","Produz. / H&S","Lav./OO.SS."],["Verifica età all’assunzione (D1.2)","I","C","I","R","I"],["Tutele giovani lavoratori (D1.3)","A","R","C","R","I"],["Protezione minori non lavoratori (D1.4)","A","C","I","R","I"],["Monitoraggio e indagini (D1.5)","I","R","C"],["Rimedio e azioni correttive","A","R","C","R","C","I"],["Valutazione BP e catena di fornitura","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Divieto di impiego di minori (D1.2)"},{"k":"p","t":"4.1.1 Verifica dell’età all’assunzione"},{"k":"p","t":"L’Organizzazione implementa un processo rigoroso di verifica dell’età prima di qualsiasi rapporto di lavoro:"},{"k":"t","r":[["#","Metodo di verifica","Descrizione"],["1","Verifica documentale d’identità","Controllo del documento d’identità originale (carta d’identità, passaporto) con verifica della data di nascita; copia nel fascicolo personale."],["2","Verifica tramite database governativi","Ove disponibile, verifica attraverso banche dati pubbliche o sistemi governativi di verifica dell’identità."],["3","Documentazione scolastica","Acquisizione di certificati o attestati scolastici come evidenza integrativa dell’età."],["4","Servizi di verifica terze parti","Utilizzo di servizi di verifica indipendenti in caso di dubbi o dove la documentazione ufficiale non sia disponibile."],["5","Metodi alternativi","In assenza di documenti ufficiali: certificati medici, dichiarazioni di autorità locali, documentazione comunitaria con valutazione del rischio documentata."]]},{"k":"p","t":"4.1.2 Requisiti di età negli annunci"},{"k":"p","t":"Tutte le descrizioni delle mansioni, gli annunci di lavoro e le comunicazioni correlate indicano chiaramente i requisiti minimi di età. Le politiche includono: età minima per personale regolare, età minima per giovani lavoratori, età minima per Legally Working Children."},{"k":"p","t":"4.1.3 Verifica agenzie di reclutamento"},{"k":"p","t":"Le politiche e le performance delle agenzie di reclutamento terze sono verificate per la conformità ai requisiti di età minima. I contratti con le agenzie includono clausole specifiche sulla verifica dell’età."},{"k":"p","t":"4.1.4 Flagging e follow-up"},{"k":"p","t":"Qualsiasi documento d’identità mancante, incompleto o sospetto viene segnalato e seguito prima dell’assunzione. L’impiego è sospeso fino al completamento della verifica."},{"k":"p","t":"4.2 Tutela dei giovani lavoratori (D1.3)"},{"k":"t","r":[["Rif.","Requisito D1.3","Modalità operative"],["a)","Sviluppo sociale, morale e fisico; assenza di pericoli per salute/benessere","Assegnazione di compiti appropriati allo sviluppo fisico e cognitivo\nNon assegnazione di lavoro notturno\nAmbienti sicuri, puliti, ergonomici con illuminazione, ventilazione e DPI adeguati\nNon assegnazione a mansioni pericolose: manipolazione sostanze chimiche, sollevamento pesante, macchinari pericolosi\nFormazione H&S specifica per giovani lavoratori\nAffiancamento con mentori/supervisori esperti\nFormazione del personale sull’empatia e la comprensione dei giovani lavoratori\nServizi di consulenza o supporto psicologico\nCoinvolgimento dei genitori/tutori"],["b)","Non pregiudizio del percorso educativo","Orari flessibili che accomodano scuola o formazione professionale\nMonitoraggio della frequenza scolastica\nProgrammi di sviluppo competenze con tracciamento dei progressi\nVerifiche periodiche con il giovane lavoratore e i genitori/tutori"],["c)","Retribuzione e benefit commisurati agli adulti in posizioni simili","Parificazione salariale: retribuzione del giovane lavoratore non inferiore a quella di un adulto nella stessa posizione\nInclusione in tutte le tutele sociali: assicurazione sanitaria, copertura infortuni, ferie, permessi\nVerifica periodica dell’equità retributiva"],["d–g)","Limiti orari e divieto di lavoro notturno","Massimo 8 ore di lavoro al giorno (o il massimo legale se inferiore)\nMassimo 10 ore al giorno per scuola + lavoro + trasporto combinate (o il massimo legale se inferiore)\nDivieto assoluto di lavoro notturno (22:00–06:00 / 23:00–07:00 per < 16 anni)\nMonitoraggio automatizzato tramite sistema presenze con alert per sforamenti\nSupervisione dedicata per il rispetto dei limiti"]]},{"k":"p","t":"4.2.1 Opportunità di crescita"},{"k":"p","t":"L’Organizzazione fornisce ai giovani lavoratori opportunità di sviluppo professionale, esposizione a diversità di compiti, opportunità di partecipare ai processi organizzativi, riconoscimento dei risultati e feedback costruttivo sulle performance."},{"k":"p","t":"4.3 Protezione dei minori non lavoratori (D1.4)"},{"k":"t","r":[["Rif.","Requisito D1.4","Modalità operative"],["a)","Protezione da rischi e pericoli per la salute","Designazione di aree specifiche dove i minori non lavoratori possono sostare\nDivieto di accesso alle aree di produzione, stoccaggio e zone pericolose\nSegnaletica chiara sulle aree vietate\nControlli di accesso (badge, CCTV, registri visitatori)"],["b)","Fornitura di bisogni primari adeguati all’età","Accesso a cibo, acqua, servizi igienici adeguati all’età\nSpazi adeguati: no confinamento, no isolamento\nAsilo nido o childcare on-site ove necessario"],["c)","Supervisione adulta adeguata e continua","Personale designato per la supervisione dei minori non lavoratori\nRapporto supervisori/minori appropriato\nRegistro dei dipendenti con figli a carico per pianificazione"],["d)","Non interferenza con i processi organizzativi","Procedure chiare per i genitori/tutori sulla presenza dei figli\nModuli di consenso genitori/tutori\nFormazione del personale sui rischi per e dai minori non lavoratori"]]},{"k":"p","t":"4.4 Sistema di gestione per la protezione dei minori (D1.5)"},{"k":"p","t":"L’Organizzazione sviluppa e implementa sistemi di gestione efficaci per rispettare o superare i requisiti e i principi associati alla protezione dei minori e dei giovani lavoratori in tutte le operazioni e relazioni commerciali."},{"k":"p","t":"4.4.1 Integrazione nei processi"},{"k":"p","t":"Inclusione dei rischi relativi ai minori nel registro rischi (PRO-05/MOD-05.03)."},{"k":"p","t":"Obiettivi specifici per la protezione dei minori nel piano degli obiettivi (PRO-06/MOD-06.01)."},{"k":"p","t":"Formazione specifica per HR, supervisori e personale coinvolto nell’assunzione e nella gestione dei giovani lavoratori."},{"k":"p","t":"Procedure specifiche per la gestione dei reclami relativi a minori (PRO-12/MOD-12.01) con protocolli dedicati per GBVH e discriminazione."},{"k":"p","t":"4.4.2 Business Partner e catena di fornitura"},{"k":"p","t":"Inclusione di clausole sulla protezione dei minori nei contratti con i BP."},{"k":"p","t":"Valutazione dei BP per la conformità ai requisiti di età minima (MOD-16.03)."},{"k":"p","t":"Per i BP ad alto rischio: richiesta di report audit, certificazioni o valutazioni indipendenti."},{"k":"p","t":"Visite congiunte con fornitori, ONG o sindacati nelle catene di fornitura sensibili."},{"k":"p","t":"4.4.3 Riconoscimento degli impatti negativi (Adverse Impacts)"},{"k":"p","t":"L’Organizzazione forma il personale a riconoscere i segnali di impatto negativo:"},{"k":"t","r":[["Tipo di segnale","Esempi"],["Impatti negativi diretti","Minori al lavoro; giovani lavoratori sotto età minima; giovani in condizioni pericolose; giovani in orario notturno; giovani con orari eccessivi; giovani impossibilitati a frequentare la scuola; giovani con retribuzione inferiore."],["Segnali sensoriali e visivi","Personale apparentemente minorenne; personale che rifiuta di parlare o discutere; personale visto fuggire o lasciare in fretta ambienti di lavoro; personale giovane in ambienti pericolosi o mansioni rischiose; personale giovane identificato in turni multipli."],["Segnali verbali","Dichiarazioni come: “Mio figlio viene ad aiutare”, “Non lasciano fare lavori pesanti ai giovani”, “Ci dicono di non chiedere l’età”, “Vanno a casa presto per la scuola”, “Nessuno ha chiesto quanti anni ho”, “I piccoli entrano negli spazi stretti”."]]},{"k":"p","t":"4.5 Rimedio in caso di violazioni"},{"k":"p","t":"In caso di identificazione di lavoro minorile o violazioni delle tutele dei giovani lavoratori:"},{"k":"p","t":"Cessazione immediata della situazione di pericolo o violazione."},{"k":"p","t":"Valutazione del danno e dei bisogni del minore con il coinvolgimento di esperti (assistenti sociali, psicologi)."},{"k":"p","t":"Piano di rimedio individualizzato: reinserimento scolastico, supporto alla famiglia, compensazione economica ove appropriato."},{"k":"p","t":"Se il minore deve essere allontanato dal lavoro: garantire che il rimedio non peggiori la situazione del minore e della famiglia (es. perdita di reddito familiare senza sostituzione)."},{"k":"p","t":"Segnalazione alle autorità competenti secondo la legislazione applicabile."},{"k":"p","t":"Azione correttiva sulla causa radice (PRO-14)."},{"k":"p","t":"Se la violazione coinvolge un BP: richiesta di cessazione immediata, piano di rimedio congiunto, e valutazione di disimpegno responsabile se il BP non collabora."},{"k":"p","t":"Follow-up per verificare l’efficacia del rimedio e la non ricorrenza."},{"k":"p","t":"4.6 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Verifica età pre-assunzione","Controllo documenti d’identità; verifica in database; flagging documenti mancanti/sospetti; blocco assunzione fino a completamento.","HR","Pre-assunzione"],["2","Classificazione giovane lavoratore","Identificazione dei giovani lavoratori (15–17 anni); registro dedicato (MOD-16.01); comunicazione a supervisori e H&S.","HR","All’assunzione"],["3","Pianificazione tutele D1.3","Assegnazione compiti appropriati; verifica limiti orari; inserimento alert sistema presenze; affiancamento mentore; coinvolgimento genitori/tutori.","HR / Produz.","Entro 5 gg"],["4","Formazione specifica","Formazione H&S giovani lavoratori; formazione personale su tutele e riconoscimento impatti; formazione supervisori.","Resp. SA / HR","Entro 15 gg"],["5","Gestione minori non lavoratori","Designazione aree; supervisione; bisogni primari; segnaletica; registri; formazione personale.","HR / H&S","Continuo"],["6","Monitoraggio e audit","Spot check periodici; verifica sistema presenze; survey giovani lavoratori; audit interni D1; valutazione BP.","Resp. SA / SPT","Trimestrale / Annuale"],["7","Gestione impatti e rimedio","Identificazione impatti; cessazione immediata; valutazione danno; piano rimedio; segnalazione autorità; azione correttiva; follow-up.","Resp. SA / HR","Immediato"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Verifica Età e Prevenzione (D1.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% candidati con prova di età verificata","N. verificati / N. assunti × 100","100%","Continuo"],["% fascicoli personale con documentazione verificata data nascita","N. con doc. / N. tot. × 100","100%","Annuale"],["% annunci di lavoro con requisiti età minima indicati","N. con età / N. tot. × 100","100%","Continuo"],["% agenzie di reclutamento valutate per conformità età","N. valutate / N. tot. × 100","100%","Annuale"],["% documenti mancanti/incompleti segnalati e seguiti prima dell’assunzione","N. seguiti / N. flagged × 100","100%","Continuo"],["% BP con politiche e procedure di verifica età","N. con politiche / N. BP × 100","≥ 90%","Annuale"],["N. casi di impatti negativi identificati (lavoro minorile)","Conteggio","0","Annuale"]]},{"k":"p","t":"5.2 Indicatori Tutele Giovani Lavoratori (D1.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% mansioni valutate per rischi specifici ai giovani lavoratori","N. valutate / N. assegnate × 100","100%","Per assegnazione"],["Ore medie lavorate dai giovani lavoratori (giorno)","Media ore/giorno","≤ 8","Mensile"],["Ore medie scuola + lavoro + trasporto (giorno)","Media ore totali/giorno","≤ 10","Mensile"],["N. violazioni limiti orari giovani lavoratori","Conteggio","0","Mensile"],["N. casi di lavoro notturno giovani lavoratori","Conteggio","0","Mensile"],["Retribuzione attuale giovani lavoratori vs. adulti stessa posizione","Confronto","= Parità","Annuale"],["% giovani lavoratori inclusi in tutele sociali (assicurazione, ferie, ecc.)","N. inclusi / N. tot. × 100","100%","Annuale"],["% personale formato su politiche e processi per giovani lavoratori","N. formati / N. rilevanti × 100","≥ 95%","Annuale"],["% giovani lavoratori partecipanti a meccanismi di feedback/reclamo","N. partecipanti / N. tot. × 100","Monitoraggio","Annuale"]]},{"k":"p","t":"5.3 Indicatori Minori Non Lavoratori e Sistema (D1.4–D1.5)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["N. incidenti H&S coinvolgenti minori non lavoratori","Conteggio","0","Annuale"],["% ambienti ad alto rischio con controlli accesso minori","N. con controlli / N. tot. × 100","100%","Annuale"],["% BP valutati per conformità età minima nell’ultimo anno","N. valutati / N. tot. × 100","≥ 90%","Annuale"],["N. impatti negativi identificati (totale, per gravità)","Conteggio + classificazione","0","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-16.01","Registro Giovani Lavoratori e Verifica Età","Anagrafica giovani lavoratori: dati, età, documenti, tutele, limiti orari, mentor, verifiche."],["MOD-16.02","Checklist Tutele Giovani Lavoratori (D1.3)","Verifica periodica di tutte le tutele D1.3 a–g per ogni giovane lavoratore."],["MOD-16.03","Checklist Verifica BP – Lavoro Minorile (D1.5)","Verifica dei BP su politiche, processi e performance relativi alla protezione dei minori."],["MOD-16.04","Report Annuale Protezione Minori e Giovani Lavoratori","KPI D1.1–D1.5, impatti, rimedi, trend, raccomandazioni, input al RdD."]]},{"k":"p","t":"Conservazione: fascicoli personale e registri per almeno 5 anni oltre il compimento dei 18 anni del lavoratore."},{"k":"p","t":"Riservatezza: dati dei minori trattati con massima riservatezza; accesso ristretto a HR, Resp. SA e AD."},{"k":"p","t":"Coordinamento: PRO-05 (rischi), PRO-12 (reclami con protocollo specifico minori), PRO-14 (rimedio)."}]},"PRO-17":{"code":"PRO-17","blocks":[{"k":"t","r":[["PROCEDURA PRO-17"],["Codice:","PRO-17","Revisione:","01"],["Titolo:","LIBERTÀ DI ASSOCIAZIONE E DIRITTO ALLA CONTRATTAZIONE COLLETTIVA"],["Criteri SA8000:","D2.1–D2.9","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire la libertà di associazione e il diritto alla contrattazione collettiva del personale, in conformità ai criteri D2.1–D2.9 dello Standard SA8000:2026."},{"k":"p","t":"La procedura assicura che:"},{"k":"p","t":"L’Organizzazione rispetti e riconosca il diritto del personale di formare, aderire e partecipare liberamente a sindacati e altre organizzazioni dei lavoratori e di contrattare collettivamente (D2.1)."},{"k":"p","t":"Il personale sia informato dei propri diritti senza conseguenze negative o ritorsioni (D2.2)."},{"k":"p","t":"L’Organizzazione non interferisca, direttamente o tramite terzi, con la costituzione, il funzionamento o l’amministrazione dei sindacati (D2.3)."},{"k":"p","t":"Membri sindacali, rappresentanti dei lavoratori e organizzatori non subiscano discriminazione, molestie, intimidazione o ritorsione (D2.4)."},{"k":"p","t":"Sia garantito equo accesso ai membri negli ambienti di lavoro (D2.5)."},{"k":"p","t":"La contrattazione collettiva sia condotta in buona fede (D2.6)."},{"k":"p","t":"Gli obblighi derivanti da accordi collettivi settoriali siano rispettati, senza precludere negoziazioni migliorative a livello aziendale (D2.7)."},{"k":"p","t":"SPT, comitati consultivi e altri gruppi non interferiscano con i sindacati o la contrattazione collettiva (D2.8)."},{"k":"p","t":"Siano sviluppati sistemi di gestione efficaci in tutte le operazioni e relazioni commerciali (D2.9)."},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D2.1–D2.9"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D2"},{"k":"p","t":"Convenzione ILO n. 87 – Libertà sindacale e protezione del diritto sindacale"},{"k":"p","t":"Convenzione ILO n. 98 – Diritto di organizzazione e contrattazione collettiva"},{"k":"p","t":"Convenzione ILO n. 135 – Protezione dei rappresentanti dei lavoratori"},{"k":"p","t":"Statuto dei Lavoratori (L. 300/1970) – Titoli II e III (libertà sindacale)"},{"k":"p","t":"CCNL applicabile e accordi settoriali"},{"k":"p","t":"PRO-02 – Coinvolgimento Lavoratori e SPT"},{"k":"p","t":"PRO-11 – Monitoraggio e Meccanismi di Reclamo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Libertà di associazione (FOA)","Diritto del personale di formare, aderire e partecipare liberamente a sindacati e altre organizzazioni dei lavoratori di propria scelta, senza autorizzazione preventiva né conseguenze negative."],["Contrattazione collettiva","Processo negoziale tra l’Organizzazione e i rappresentanti dei lavoratori/sindacati per determinare termini e condizioni di lavoro, condotto in buona fede."],["Non-interferenza","Obbligo dell’Organizzazione di non interferire, direttamente o tramite terzi, con la costituzione, il funzionamento o l’amministrazione dei sindacati o delle organizzazioni dei lavoratori (D2.3)."],["Accordo collettivo settoriale (SBA)","Accordo collettivo stipulato a livello settoriale di cui l’Organizzazione deve rispettare e adempiere gli obblighi, salva la possibilità di negoziare condizioni più favorevoli a livello aziendale (D2.7)."],["Rappresentante dei lavoratori","Membro eletto o designato del personale che rappresenta gli interessi dei lavoratori nelle relazioni con l’Organizzazione."],["Ritorsione","Qualsiasi azione negativa – licenziamento, demansionamento, riduzione ore/turni, esclusione da benefit, molestie, intimidazione – posta in essere a causa dell’affiliazione o attività sindacale."],["OO.SS. / CBA / CCNL","Organizzazioni Sindacali / Collective Bargaining Agreement / Contratto Collettivo Nazionale di Lavoro."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR","Funzioni","OO.SS./Rapp."],["Informazione diritti FOA (D2.2)","A","R","C","R","I","C"],["Non-interferenza sindacale (D2.3)","A","R","I","R","I"],["Non-discriminazione sindacale (D2.4)","A","R","C","R","I"],["Accesso equo (D2.5)","A","C","I","R","C","I"],["Contrattazione in buona fede (D2.6)","R","C","I","R","I","R"],["Conformità SBA/CCNL (D2.7)","A","C","I","R","C"],["Non-interferenza SPT/comitati (D2.8)","I","R","C","I","C"],["SG e BP (D2.9)","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Informazione sui diritti (D2.2)"},{"k":"p","t":"L’Organizzazione assicura che il personale sia informato dei propri diritti di libertà di associazione senza conseguenze negative:"},{"k":"p","t":"Contratti di lavoro: clausola che conferma il diritto di formare e aderire al sindacato di propria scelta senza conseguenze negative."},{"k":"p","t":"Comunicazioni multicanale: materiali formativi, newsletter, poster, email, handbook, materiali di onboarding, sia in formato digitale che cartaceo."},{"k":"p","t":"Condivisione dei contatti sindacali dove i sindacati sono presenti."},{"k":"p","t":"Dichiarazioni esplicite che vietano le ritorsioni per la formazione, adesione o partecipazione a sindacati."},{"k":"p","t":"Comunicazione della neutralità e della posizione di non-interferenza dell’Organizzazione."},{"k":"p","t":"4.2 Non-interferenza (D2.3)"},{"k":"p","t":"L’Organizzazione garantisce la non-interferenza con la costituzione, il funzionamento e l’amministrazione dei sindacati:"},{"k":"p","t":"Facilitazione della comunicazione riservata tra lavoratori e rappresentanti sindacali."},{"k":"p","t":"Accesso dei rappresentanti sindacali per incontrare i lavoratori."},{"k":"p","t":"Partecipazione sindacale ai processi di reclamo, allo SPT e ai processi decisionali organizzativi."},{"k":"p","t":"Accordo formalizzato tra sindacato e direzione sulla non-interferenza."},{"k":"p","t":"Partecipazione sindacale alle azioni disciplinari."},{"k":"p","t":"Elezioni sindacali condotte a scrutinio segreto senza supervisione della direzione HR."},{"k":"p","t":"4.3 Non-discriminazione e non-ritorsione (D2.4)"},{"k":"p","t":"Membri sindacali, rappresentanti e organizzatori non sono soggetti a discriminazione, molestie, intimidazione o ritorsione:"},{"k":"p","t":"Contratti con clausola di non-discriminazione per affiliazione sindacale."},{"k":"p","t":"Valutazione di potenziali bias sindacali nelle assunzioni, azioni disciplinari, formazione, promozioni e licenziamenti."},{"k":"p","t":"Supervisione indipendente per azioni coinvolgenti membri sindacali."},{"k":"p","t":"Monitoraggio dei tassi di turnover, assunzione e promozione del personale affiliato al sindacato vs. non affiliato."},{"k":"p","t":"4.4 Accesso equo agli ambienti di lavoro (D2.5)"},{"k":"p","t":"Accesso dei rappresentanti sindacali per incontrare i lavoratori negli ambienti di lavoro."},{"k":"p","t":"Disponibilità di sale riunioni/uffici per incontri sindacali."},{"k":"p","t":"Permessi retribuiti per attività sindacali secondo la normativa e il CCNL applicabile."},{"k":"p","t":"Partecipazione sindacale a SPT, processi di reclamo, processi decisionali, azioni disciplinari."},{"k":"p","t":"Registrazione delle visite dei rappresentanti sindacali e delle riunioni tenute."},{"k":"p","t":"4.5 Contrattazione collettiva in buona fede (D2.6)"},{"k":"p","t":"L’Organizzazione conduce la contrattazione collettiva in buona fede su richiesta dei rappresentanti:"},{"k":"p","t":"Riconoscimento formale dei sindacati e dei rappresentanti dei lavoratori."},{"k":"p","t":"Procedure di negoziazione definite: tempistiche, partecipanti, metodi di comunicazione, condivisione informazioni, autorità decisionali."},{"k":"p","t":"Fornitura delle informazioni necessarie (dati finanziari, statistiche forza lavoro) ai sindacati e rappresentanti."},{"k":"p","t":"Verbalizzazione delle riunioni: partecipanti, argomenti discussi, decisioni prese."},{"k":"p","t":"Tempi medi di risposta alle richieste sindacali monitorati."},{"k":"p","t":"4.6 Conformità agli accordi collettivi settoriali (D2.7)"},{"k":"p","t":"Valutazione delle clausole dell’accordo settoriale: obbligatorie, migliorabili a livello aziendale, deroghe che richiedono approvazione sindacale o registrazione legale."},{"k":"p","t":"Allineamento dei requisiti dipartimentali, delle tabelle retributive e dei benefit con l’accordo settoriale/CCNL."},{"k":"p","t":"Team interfunzionali lavoratori-management per l’implementazione dei requisiti dell’accordo."},{"k":"p","t":"Possibilità di negoziare condizioni migliorative rispetto all’accordo settoriale a livello aziendale."},{"k":"p","t":"4.7 Non-interferenza dei comitati (D2.8)"},{"k":"p","t":"SPT, comitati consultivi e altri gruppi non interferiscono con i sindacati o la contrattazione:"},{"k":"p","t":"Limitazione dei ruoli e delle decisioni dei comitati dove potrebbero violare i diritti sindacali."},{"k":"p","t":"Inclusione di membri sindacali e rappresentanti dei lavoratori nelle strutture dei comitati."},{"k":"p","t":"Revisione sindacale degli output o delle decisioni dei comitati."},{"k":"p","t":"Inclusione dei framework legali e/o degli accordi sindacali nei termini di riferimento dei comitati."},{"k":"p","t":"Condivisione dei risultati delle riunioni dei comitati con il sindacato."},{"k":"p","t":"4.8 Riconoscimento degli impatti negativi"},{"k":"t","r":[["Tipo di segnale","Esempi dall’Indicator Library"],["Impatti negativi","Personale ignaro dei diritti FOA; mancata elezione di sindacati; rappresentanti sindacali impossibilitati ad accedere; discriminazione verso partecipanti ad attività sindacali; perdita di ruoli/reddito; mancata rappresentanza nella contrattazione; peggioramento condizioni lavorative."],["Segnali visivi","Segnaletica assente o rimossa; linguaggio corporeo durante interviste lavoratori/management; irregolarità vocali/verbali; management che fotografa riunioni sindacali."],["Segnali verbali","Dichiarazioni: “Non sapevo ci fosse un sindacato”, “Penso non sia permesso iscriversi”, “Ho sentito che ci si mette nei guai”, “Hanno provato in passato ma sono stati licenziati tutti”, “Non voglio perdere i turni”, “Mi hanno chiamato in ufficio dopo la visita sindacale”, “Da quando sono nel sindacato mi danno valutazioni negative”, “Il rappresentante non è stato fatto entrare”."]]},{"k":"p","t":"4.9 Sistema di gestione e Business Partner (D2.9)"},{"k":"p","t":"Inclusione dei rischi FOA nel registro rischi (PRO-05/MOD-05.03)."},{"k":"p","t":"Clausole contrattuali con i BP che garantiscono FOA e non-interferenza."},{"k":"p","t":"Valutazione dei BP per la conformità ai diritti FOA (MOD-17.02)."},{"k":"p","t":"Per BP ad alto rischio: richiesta di evidenze documentali, certificazioni o audit indipendenti."},{"k":"p","t":"Meccanismo di reclamo accessibile per segnalare violazioni FOA (PRO-12)."},{"k":"p","t":"4.10 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Informazione diritti","Clausole contrattuali; comunicazioni multicanale; onboarding; poster; contatti sindacali.","HR / Resp. SA","Continuo"],["2","Non-interferenza","Accesso sindacale; comunicazione riservata; accordo non-interferenza; elezioni a scrutinio segreto.","HR / AD","Continuo"],["3","Non-discriminazione","Monitoraggio bias; supervisione indipendente; analisi tassi turnover/promozione per affiliazione.","HR / Resp. SA","Continuo / Annuale"],["4","Accesso equo","Sale riunioni; permessi retribuiti; partecipazione SPT/reclami/decisioni; registro visite.","HR","Continuo"],["5","Contrattazione collettiva","Riconoscimento formale; procedure negoziali; fornitura informazioni; verbalizzazione.","AD / HR / OO.SS.","Per richiesta"],["6","Conformità SBA/CCNL","Analisi clausole; allineamento retributivo/benefit; team interfunzionali; negoziazioni migliorative.","HR / Funzioni","Annuale / Per rinnovo"],["7","Non-interferenza comitati","Revisione TdR comitati; inclusione sindacale; condivisione output.","Resp. SA / SPT","Continuo"],["8","Monitoraggio e audit","Survey FOA; audit interni D2; valutazione BP; analisi impatti negativi.","Resp. SA / SPT","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Indicatori Informazione e Non-interferenza (D2.2–D2.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale che dichiara di conoscere i propri diritti FOA/sindacali (survey)","N. consapevoli / N. tot. × 100","≥ 90%","Annuale"],["% comunicazioni al personale che coprono diritti FOA","N. con FOA / N. tot. × 100","Monitoraggio","Annuale"],["N. survey condotte con domande su FOA e diritti sindacali","Conteggio","≥ 1/anno","Annuale"],["N. impatti negativi FOA identificati","Conteggio","0","Annuale"]]},{"k":"p","t":"5.2 Indicatori Non-discriminazione e Accesso (D2.4–D2.5)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% lavoratori che partecipano a riunioni sindacali/rappresentanti","N. partecipanti / N. eleggibili × 100","Monitoraggio","Annuale"],["% lavoratori eleggibili che votano alle elezioni dei rappresentanti","N. votanti / N. eleggibili × 100","Monitoraggio","Per elezione"],["Tasso di turnover personale affiliato al sindacato vs. non affiliato","Confronto %","Parità","Annuale"],["Tasso di promozione personale affiliato vs. non affiliato","Confronto %","Parità","Annuale"],["N. sale riunioni prenotate dai rappresentanti sindacali","Conteggio","Monitoraggio","Annuale"],["N. visite di rappresentanti sindacali","Conteggio","Monitoraggio","Annuale"],["N. giorni di permesso retribuito per attività sindacali","Conteggio","Monitoraggio","Annuale"]]},{"k":"p","t":"5.3 Indicatori Contrattazione e SBA (D2.6–D2.7)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% lavoratori coperti da CBA valido","N. coperti / N. tot. × 100","Monitoraggio","Annuale"],["N. riunioni di negoziazione condotte","Conteggio","Monitoraggio","Per negoziazione"],["Tempo medio di risposta alle richieste sindacali (giorni)","Media GG","Monitoraggio","Per richiesta"],["% proposte risposte da sindacati/rappresentanti","N. risposte / N. ricevute × 100","100%","Per negoziazione"],["% ruoli classificati secondo le scale retributive SBA/CCNL","N. classificati / N. tot. × 100","100%","Annuale"],["% lavoratori che ricevono almeno il minimo SBA/CCNL","N. conformi / N. tot. × 100","100%","Annuale"],["N. reclami relativi a termini SBA archiviati/accolti/risolti","Conteggio","Monitoraggio","Annuale"]]},{"k":"p","t":"5.4 Indicatori Comitati e SG (D2.8–D2.9)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% riunioni comitati a cui il sindacato ha partecipato","N. con sind. / N. tot. × 100","Monitoraggio","Annuale"],["% risultati comitati condivisi con il sindacato","N. condivisi / N. tot. × 100","100%","Per riunione"],["% BP valutati per conformità FOA","N. valutati / N. tot. × 100","≥ 90%","Annuale"],["% personale che partecipa a sindacati/organizzazioni lavoratori","N. affiliati / N. tot. × 100","Monitoraggio","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-17.01","Checklist Conformità FOA e Contrattazione (D2.2–D2.8)","Verifica periodica di tutti i requisiti D2 con 30+ punti di controllo organizzati per criterio."],["MOD-17.02","Checklist Verifica BP – Libertà di Associazione (D2.9)","Verifica dei BP su politiche FOA, non-interferenza, non-discriminazione, CBA."],["MOD-17.03","Registro Contrattazione Collettiva e Accordi","Log delle negoziazioni, accordi, riunioni sindacali, richieste, risposte e risultati."],["MOD-17.04","Report Annuale FOA e Contrattazione Collettiva","KPI D2.1–D2.9, analisi impatti, trend, conformità SBA/CCNL, raccomandazioni, input RdD."]]},{"k":"p","t":"Conservazione: registri e verbali per almeno 5 anni."},{"k":"p","t":"Riservatezza: le affiliazioni sindacali individuali sono trattate come dati personali sensibili."},{"k":"p","t":"Coordinamento: PRO-02 (SPT/coinvolgimento), PRO-05 (rischi FOA), PRO-12 (reclami FOA)."}]},"PRO-18":{"code":"PRO-18","blocks":[{"k":"t","r":[["PROCEDURA PRO-18"],["Codice:","PRO-18","Revisione:","01"],["Titolo:","RECLUTAMENTO, IMPIEGO E CESSAZIONE LIBERI E EQUI"],["Criteri SA8000:","D3.1–D3.13","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire il diritto del personale e dei candidati a un reclutamento, impiego e cessazione liberi ed equi, in conformità ai criteri D3.1–D3.13 dello Standard SA8000:2026."},{"k":"p","t":"Le persone hanno diritto a: dignità e autonomia nel reclutamento, impiego e cessazione; libertà da inganno, coercizione, sfruttamento, intimidazione, minacce e violenza; trattamento dignitoso ed equo; libertà dalla schiavitù moderna, tratta e lavoro forzato."},{"k":"t","r":[["Criterio","Area"],["D3.2","Comprensione e accettazione volontaria delle condizioni: lettera d’offerta (a), lingua accessibile (b), descrizione mansione (c), contratto completo prima dell’inizio (d)"],["D3.3","Comunicazione anticipata dei cambiamenti alle condizioni di impiego"],["D3.4","Libertà di movimento: accesso ai documenti (a), straordinari volontari (b), libertà da minacce (c), autonomia fisica (d), trasferibilità competenze (e)"],["D3.5","Libertà da oneri finanziari: no servitù per debito/penali/depositi/ritenzione salari (a–h)"],["D3.6","Costi di reclutamento non a carico del personale; rimborso se già pagati"],["D3.7","Libertà da molestie, intimidazioni e violenza in tutte le fasi"],["D3.8","Procedure disciplinari chiare, coerenti e non punitive in modo sproporzionato"],["D3.9","Condizioni di lavoro che non isolano il personale né lo separano da figli e familiari"],["D3.10","Accesso a comunicazione esterna con familiari, amici, servizi"],["D3.11","Apprendistato e tirocinio: non sostitutivi, durata prestabilita, compenso ≥ minimo legale"],["D3.12","Cessazione equa e trasparente: non discriminatoria, pagamento tempestivo, licenziamento collettivo come ultima risorsa"],["D3.13","Sistema di gestione efficace nelle operazioni e relazioni commerciali"]]},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D3.1–D3.13"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D3"},{"k":"p","t":"ILO C29 e C105 – Lavoro forzato; ILO C181 – Agenzie per il lavoro"},{"k":"p","t":"ILO C97 e C143 – Lavoratori migranti"},{"k":"p","t":"ILO C190 – Violenza e molestie nel mondo del lavoro"},{"k":"p","t":"Protocollo di Palermo – Tratta di persone"},{"k":"p","t":"D.Lgs. 276/2003 – Somministrazione e intermediazione; D.Lgs. 81/2015 – Contratti"},{"k":"p","t":"D.Lgs. 286/1998 TU Immigrazione; D.Lgs. 24/2014 – Tratta"},{"k":"p","t":"L. 300/1970 Statuto dei Lavoratori; L. 604/1966 Licenziamenti individuali; L. 223/1991 Licenziamenti collettivi"},{"k":"p","t":"PRO-05 Rischi; PRO-09 Monitoraggio e Reclami; PRO-17 Libertà di Associazione; PRO-19 Ore, Retribuzioni e Benefit; PRO-20 Non Discriminazione"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Reclutamento equo","Processo di selezione e assunzione condotto nel rispetto della dignità, dell’autonomia e della libertà del candidato, senza inganno, coercizione o oneri finanziari impropri."],["Lavoro forzato","Qualsiasi lavoro o servizio estorto sotto minaccia di penale o per il quale la persona non si è offerta volontariamente (ILO C29). Include servitù per debito, ritenzione documenti, minacce, penali di cessazione."],["Libertà di movimento","Diritto del personale di accedere ai propri documenti d’identità, lasciare il lavoro volontariamente, muoversi senza restrizioni e non essere soggetto a coercizione fisica o psicologica (D3.4 a–e)."],["Onere finanziario improprio","Qualsiasi costo o commissione di reclutamento addebitato al personale, deposito cauzionale, penale di cessazione anticipata, ritenzione salariale o altra forma di vincolo economico (D3.5–3.6)."],["Cessazione equa","Risoluzione del rapporto di lavoro condotta in modo non discriminatorio, con preavviso adeguato, pagamento tempestivo e procedura trasparente (D3.12)."],["Apprendistato / Tirocinio","Programma formativo che non sostituisce posizioni regolari, ha durata prestabilita e compenso non inferiore al minimo legale (D3.11)."],["BP","Business Partner: fornitore, subappaltatore, agenzia di reclutamento, altro partner commerciale."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp.SA","SPT","HR","Legale","Prod.","OO.SS."],["Consenso e volontarietà (D3.2–3.3)","A","C","R","I","C"],["Libertà di movimento (D3.4)","A","R","C","R","C","R","C"],["Oneri finanziari e costi reclutamento (D3.5–3.6)","A","R","C","R","C","I","C"],["Anti-molestie e disciplina (D3.7–3.8)","A","C","R","C","R","C"],["Non isolamento e comunicazione (D3.9–3.10)","A","C","R","I","R","C"],["Apprendistato/Tirocinio (D3.11)","A","C","I","R","I"],["Cessazione equa (D3.12)","A","C","R","I","C"],["SG e BP (D3.13)","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato."},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Comprensione volontaria e comunicazione delle condizioni (D3.2–D3.3)"},{"k":"p","t":"4.1.1 Fase pre-assuntiva"},{"k":"p","t":"Lettera d’offerta che dettaglia: mansione, orario, retribuzione, benefit, durata contratto, periodo di prova, luogo di lavoro, condizioni di cessazione (D3.2a)."},{"k":"p","t":"Descrizione della mansione accurata e veritiera, inclusi rischi specifici del ruolo (D3.2c)."},{"k":"p","t":"Tutti i documenti in lingua comprensibile al candidato; traduzione certificata dove necessario (D3.2b)."},{"k":"p","t":"Tempo adeguato per leggere e comprendere prima della firma; possibilità di consulenza esterna."},{"k":"p","t":"4.1.2 Contratto di lavoro"},{"k":"p","t":"Contratto scritto firmato prima dell’inizio dell’attività lavorativa (D3.2d)."},{"k":"p","t":"Copia del contratto consegnata al lavoratore; copia conservata nel fascicolo personale."},{"k":"p","t":"Contenuto minimo: identità parti, data inizio, inquadramento, retribuzione, orario, sede, CCNL applicabile, periodo di prova, ferie, preavviso, benefit."},{"k":"p","t":"4.1.3 Comunicazione dei cambiamenti (D3.3)"},{"k":"p","t":"Cambiamenti nelle condizioni comunicati per iscritto con anticipo ragionevole."},{"k":"p","t":"Consultazione del personale e dei rappresentanti sindacali prima dell’implementazione."},{"k":"p","t":"Nessun cambiamento peggiorativo può essere imposto unilateralmente senza il consenso del lavoratore, salvo obblighi legali."},{"k":"p","t":"4.2 Libertà di movimento (D3.4)"},{"k":"t","r":[["Rif.","Requisito D3.4","Modalità operative"],["a)","Accesso ai documenti","Documenti d’identità e di viaggio sempre in possesso del lavoratore. Divieto assoluto di ritenzione. Se custoditi su richiesta volontaria: armadietto individuale con chiave personale, accesso libero 24h."],["b)","Straordinari volontari","Lo straordinario è sempre volontario (salvo CCNL). Nessuna penale, sanzione o discriminazione per chi rifiuta. Coordinamento PRO-19."],["c)","Libertà da minacce","Divieto di minacce di licenziamento, segnalazione alle autorità, violenza o altra coercizione per costringere al lavoro. Canale di segnalazione riservato (PRO-09)."],["d)","Autonomia fisica","Nessuna restrizione fisica alla libertà di movimento. Accesso libero a servizi igienici, acqua, pause. No sorveglianza coercitiva."],["e)","Trasferibilità competenze","Clausole di non concorrenza limitate e ragionevoli; nessun vincolo che impedisca al lavoratore di utilizzare le competenze acquisite dopo la cessazione."]]},{"k":"p","t":"4.3 Libertà da oneri finanziari (D3.5–D3.6)"},{"k":"t","r":[["Rif.","Requisito","Modalità operative"],["D3.5a","No servitù per debito","Divieto di vincolare il rapporto di lavoro a prestiti, anticipi o debiti contratti con l’Organizzazione o terzi."],["D3.5b","No penali di cessazione","Nessuna penale economica per cessazione anticipata o dimissioni volontarie, salvo obblighi legali proporzionati."],["D3.5c","No depositi cauzionali","Nessun deposito o garanzia richiesta al personale come condizione di impiego."],["D3.5d-h","No ritenzioni salariali improprie","Nessuna ritenzione salariale non autorizzata dalla legge. No commissioni di reclutamento a carico del personale. Verifica che intermediari non addebitino costi al personale."],["D3.6","Costi reclutamento a carico Org.","Tutti i costi di reclutamento sono sostenuti dall’Organizzazione. Se il personale ha già pagato commissioni a intermediari: rimborso integrale. Due diligence su agenzie di reclutamento per verificare assenza di addebiti al personale."]]},{"k":"p","t":"4.4 Libertà da molestie e procedure disciplinari (D3.7–D3.8)"},{"k":"p","t":"D3.7 – Molestie, intimidazioni e violenza"},{"k":"p","t":"Divieto di molestie sessuali, psicologiche, verbali e fisiche in tutte le fasi: reclutamento, impiego, cessazione."},{"k":"p","t":"Formazione obbligatoria anti-molestie per tutto il personale, con sessioni specifiche per manager/supervisori."},{"k":"p","t":"Canale di segnalazione riservato e protetto da ritorsioni (coordinamento PRO-09)."},{"k":"p","t":"Indagine tempestiva e imparziale su ogni segnalazione; misure cautelari immediate se necessario."},{"k":"p","t":"Coordinamento PRO-20 per aspetti anti-discriminazione."},{"k":"p","t":"D3.8 – Procedure disciplinari"},{"k":"p","t":"Procedura disciplinare scritta, comunicata a tutto il personale in fase di onboarding."},{"k":"p","t":"Principi: progressività, proporzionalità, contraddittorio, documentazione, non discriminazione."},{"k":"p","t":"Scala disciplinare: richiamo verbale → richiamo scritto → sospensione → licenziamento per giusta causa."},{"k":"p","t":"Diritto del lavoratore a essere ascoltato e assistito da un rappresentante sindacale."},{"k":"p","t":"Nessuna sanzione che comporti riduzione di retribuzione sotto il minimo legale o il living wage."},{"k":"p","t":"Divieto di sanzioni fisiche, psicologiche, umilianti."},{"k":"p","t":"4.5 Non isolamento e comunicazione (D3.9–D3.10)"},{"k":"p","t":"Le condizioni di lavoro non isolano il personale: alloggi forniti dall’organizzazione sono liberi, non vincolanti (D3.9)."},{"k":"p","t":"Il personale non è separato indebitamente da figli e familiari a carico: turni e trasferimenti pianificati considerando situazioni familiari."},{"k":"p","t":"Accesso libero e regolare a comunicazione esterna: telefono, internet, posta, visite familiari (D3.10)."},{"k":"p","t":"Nessuna restrizione all’uso di dispositivi personali di comunicazione durante pause e fuori orario."},{"k":"p","t":"Per lavoratori residenti in alloggi aziendali: orari di visita ragionevoli; libertà di uscire e rientrare fuori orario di lavoro."},{"k":"p","t":"4.6 Apprendistato e tirocinio (D3.11)"},{"k":"p","t":"I programmi di apprendistato e tirocinio non sostituiscono posizioni regolari."},{"k":"p","t":"Durata prestabilita e comunicata prima dell’inizio; piano formativo documentato."},{"k":"p","t":"Compenso non inferiore al minimo legale per la categoria e al CCNL applicabile."},{"k":"p","t":"Rapporto apprendisti/lavoratori regolari entro i limiti legali."},{"k":"p","t":"Tutela integrale: H&S, orari, ferie, anti-discriminazione, anti-molestie come per il personale regolare."},{"k":"p","t":"Monitoraggio progressi formativi; feedback periodico; registro ore formazione vs. lavoro produttivo."},{"k":"p","t":"4.7 Cessazione equa e trasparente (D3.12)"},{"k":"p","t":"Cessazione non discriminatoria: nessun licenziamento per motivi di genere, etnia, religione, attività sindacale, maternità, gravidanza, stato di salute, segnalazione (coordinamento PRO-20, PRO-17)."},{"k":"p","t":"Preavviso conforme a legge e CCNL; comunicazione scritta motivata."},{"k":"p","t":"Colloquio di uscita per raccogliere feedback e identificare eventuali violazioni."},{"k":"p","t":"Pagamento tempestivo di tutte le spettanze: retribuzione residua, TFR, ferie non godute, ratei."},{"k":"p","t":"Licenziamento collettivo solo come ultima risorsa dopo esame di alternative: cassa integrazione, riduzione orario, ricollocazione, outplacement. Consultazione sindacale obbligatoria (L. 223/1991)."},{"k":"p","t":"Supporto alla transizione: lettera di referenza, accesso a servizi di ricollocazione, informazione su diritti previdenziali."},{"k":"p","t":"4.8 Sistema di gestione e Business Partner (D3.13)"},{"k":"p","t":"Rischi D3 nel registro rischi (PRO-05): lavoro forzato, tratta, oneri finanziari, intermediari, reclutamento non etico."},{"k":"p","t":"Attenzione specifica a lavoratori migranti, lavoratori somministrati, lavoratori a domicilio, subappalto."},{"k":"p","t":"Clausole contrattuali BP: consenso volontario, no ritenzione documenti, no commissioni al personale, cessazione equa, anti-molestie, procedure disciplinari conformi."},{"k":"p","t":"Due diligence su agenzie di reclutamento: verifica licenze, audit commissioni, interviste con lavoratori reclutati."},{"k":"p","t":"Valutazione BP con checklist dedicata (MOD-18.02)."},{"k":"p","t":"Coordinamento: PRO-19 (retribuzioni), PRO-20 (discriminazione), PRO-21 (H&S), PRO-22 (privacy dati reclutamento)."},{"k":"p","t":"4.9 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Pre-reclutamento","Job description veritiera; verifica agenzie; checklist anti-lavoro forzato.","HR / Resp. SA","Pre-annuncio"],["2","Selezione","Colloqui trasparenti; nessun costo a carico candidato; informativa completa.","HR","Per selezione"],["3","Assunzione","Lettera offerta → Contratto in lingua accessibile → Firma → Copia al lavoratore.","HR / Legale","Pre-inizio"],["4","Onboarding","Informazione su diritti D3, canali reclamo, procedura disciplinare, anti-molestie.","HR / Resp. SA","1° giorno"],["5","Impiego","Monitoraggio continuo: libertà movimento, no oneri, no isolamento, disciplina equa.","HR / Produzione","Continuo"],["6","Cambiamenti","Comunicazione scritta anticipata; consultazione sindacale; consenso lavoratore.","HR / Legale","Per evento"],["7","Cessazione","Procedura equa; preavviso; colloquio uscita; pagamento tempestivo spettanze.","HR / Legale","Per evento"],["8","BP e catena","Clausole contrattuali; MOD-18.02; due diligence agenzie reclutamento.","Resp. SA / Acq.","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Consenso e volontarietà (D3.2–3.3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale con contratto firmato prima dell’inizio lavoro","N. / N. tot.","100%","Continuo"],["% contratti in lingua comprensibile al lavoratore","Campione","100%","Annuale"],["% cambiamenti condizioni comunicati per iscritto con anticipo","Registro","100%","Per evento"],["% assunzioni con job description completa e veritiera","Campione","100%","Annuale"]]},{"k":"p","t":"5.2 Libertà di movimento e oneri finanziari (D3.4–3.6)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["N. casi di ritenzione documenti d’identità","Audit / Survey","0","Annuale"],["N. casi di commissioni reclutamento addebitate al personale","Audit / Interviste","0","Annuale"],["% agenzie reclutamento con due diligence completata","N. / N. tot.","100%","Annuale"],["N. depositi cauzionali o penali di cessazione riscontrati","Audit","0","Annuale"],["% personale che conferma libertà di lasciare il lavoro (survey)","Survey","≥ 95%","Annuale"]]},{"k":"p","t":"5.3 Molestie, disciplina e non isolamento (D3.7–3.10)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["N. segnalazioni molestie/intimidazioni ricevute e indagate","Registro reclami","Monitoraggio","Annuale"],["% personale formato su anti-molestie e procedura disciplinare","N. / N. tot.","100%","Annuale"],["% sanzioni disciplinari con documentazione completa e contraddittorio","Campione","100%","Annuale"],["N. casi di isolamento forzato o separazione da familiari","Audit / Survey","0","Annuale"]]},{"k":"p","t":"5.4 Apprendistato, cessazione e BP (D3.11–3.13)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% apprendisti/tirocinanti con piano formativo documentato e compenso ≥ minimo","HR","100%","Annuale"],["% cessazioni con preavviso conforme e pagamento tempestivo spettanze","Registro","100%","Per evento"],["% colloqui di uscita condotti","N. / N. cessazioni","≥ 90%","Annuale"],["% BP valutati per conformità D3 (da MOD-18.02)","N. / N. tot.","≥ 90%","Annuale"],["N. NC identificate nei BP per lavoro forzato/oneri finanziari","MOD-18.02","Monitoraggio","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-18.01","Checklist Reclutamento, Impiego e Cessazione (D3.2–D3.12)","Verifica periodica tutti i requisiti D3 con 50+ punti di controllo."],["MOD-18.02","Checklist Verifica BP – D3 (D3.13)","Valutazione BP: lavoro forzato, oneri finanziari, agenzie, cessazione, segnali impatto negativo."],["MOD-18.03","Registro Assunzioni, Cessazioni e Apprendistato","Tracciamento contratti, documenti, colloqui uscita, apprendistato, commissioni."],["MOD-18.04","Report Annuale Reclutamento, Impiego e Cessazione","KPI D3, analisi cessazioni, lavoro forzato, BP, raccomandazioni, input RdD."]]},{"k":"p","t":"Conservazione: contratti e fascicoli personali almeno 10 anni dalla cessazione; registri assunzione/cessazione come da D.Lgs. 81/2015 e normativa fiscale."},{"k":"p","t":"Riservatezza: dati personali in fase di reclutamento trattati secondo PRO-22 Privacy; dati sensibili minimizzati."},{"k":"p","t":"Coordinamento: PRO-05 (rischi D3), PRO-09 (reclami anti-molestie), PRO-17 (FOA in cessazione), PRO-19 (retribuzioni cessazione), PRO-20 (discriminazione), PRO-21 (H&S), PRO-22 (privacy)."}]},"PRO-19":{"code":"PRO-19","blocks":[{"k":"t","r":[["PROCEDURA PRO-19"],["Codice:","PRO-19","Revisione:","01"],["Titolo:","ORARI, RETRIBUZIONI E BENEFIT DIGNITOSI"],["Criteri SA8000:","D4.1–D4.14","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire orari di lavoro dignitosi, retribuzioni eque e benefit adeguati, in conformità ai criteri D4.1–D4.14 dello Standard SA8000:2026."},{"k":"t","r":[["Criterio","Area"],["D4.2–3","Salario dignitoso (living wage) o minimo legale (se superiore); benefit legali; collaborazione con stakeholder per barriere contestuali (dialogo sociale, BP, governo)"],["D4.4–5","Ore ordinarie max 48h/settimana; straordinario max 12h/settimana; straordinario volontario, retribuito a tariffa maggiorata, calcolato per settimana, non regolare (a–e)"],["D4.6","Orari prevedibili e convenienti; pause e riposi adeguati; no media-orari; riposo 24h ogni 6 giorni; ferie, malattia, congedo; flessibilità; accesso benefit (a–i)"],["D4.7","Personale esente: compenso ≥ equivalente living wage con maggiorazioni; discrezionalità ragionevole sulle ore"],["D4.8","Pagamento regolare, puntuale e conveniente di salari e benefit"],["D4.9","Compenso per: tempo sul luogo di lavoro, infortunio/malattia professionale, formazione/SPT/reclami (a–c)"],["D4.10","Registri retributivi chiari, completi, accurati e regolari"],["D4.11","Priorità a TFR/salari in caso di interruzione continuità aziendale"],["D4.12","Deduzioni disciplinari: solo se permesse da legge/CBA, ragionevoli, non sotto living wage, con appello (a–d)"],["D4.13","Cottimo, part-time, stagionali, contratti a termine, homeworker, lavoro da remoto: misurati, conformi, dignitosi, sicuri, trasparenti (a–e)"],["D4.14","Sistema di gestione efficace nelle operazioni e relazioni commerciali"]]},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D4.1–D4.14"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D4"},{"k":"p","t":"SAI Wage Tool"},{"k":"p","t":"Convenzione ILO n. 131 – Fissazione salari minimi"},{"k":"p","t":"Convenzione ILO n. 1 – Ore di lavoro (industria)"},{"k":"p","t":"Convenzione ILO n. 132 – Ferie retribuite"},{"k":"p","t":"Global Living Wage Coalition / Anker Methodology"},{"k":"p","t":"CCNL applicabile e legislazione italiana su retribuzione, orario, benefit"},{"k":"p","t":"PRO-05 – Rischi; PRO-11 – Monitoraggio; PRO-12 – FOA/Contrattazione"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Living wage / Salario dignitoso","Retribuzione sufficiente a coprire i bisogni fondamentali del lavoratore e della sua famiglia: cibo, alloggio, salute, istruzione, trasporti, vestiario, risparmio, secondo benchmark riconosciuti (Anker, Global LW Coalition, SAI Wage Tool)."],["Ore ordinarie","Massimo 48 ore settimanali (o il massimo legale se inferiore) (D4.4a)."],["Straordinario","Ore oltre le ordinarie, max 12h/settimana (o il massimo legale se inferiore). Volontario, retribuito a tariffa maggiorata, non regolare (D4.4b, D4.5 a–e)."],["Tariffa maggiorata (Premium rate)","Tariffa retributiva superiore alla tariffa ordinaria per le ore di straordinario, secondo legge, CCNL o prevalenza settoriale (D4.5b)."],["Personale esente","Personale legalmente escluso dalla retribuzione per straordinario e/o dai limiti orari, ma cui deve essere garantito compenso ≥ equivalente living wage con maggiorazioni e ragionevole discrezionalità sulle ore (D4.7)."],["Continuità aziendale (Business continuity)","Interruzione operativa in cui l’Organizzazione deve prioritizzare TFR, salari e compensazioni al personale (D4.11)."],["SAI Wage Tool","Strumento di SAI per l’analisi e il confronto delle retribuzioni con benchmark di living wage."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR/Payroll","Produz.","OO.SS."],["Living wage e benefit (D4.2–3)","A","C","R","I","C"],["Limiti orari e straordinario (D4.4–5)","A","R","C","R","C"],["Programmazione orari e congedi (D4.6)","A","C","I","R","C"],["Personale esente (D4.7)","A","C","I","R","I"],["Pagamento e registri (D4.8–10)","A","I","R","I"],["Continuità aziendale (D4.11)","R","C","I","R","I","C"],["Deduzioni disciplinari (D4.12)","A","C","I","R","I","C"],["Forme di impiego atipiche (D4.13)","A","R","C","R","C"],["SG e BP (D4.14)","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Salario dignitoso e benefit (D4.2–D4.3)"},{"k":"p","t":"4.1.1 Analisi retributiva"},{"k":"p","t":"Integrazione dell’analisi salariale corrente nel sistema paghe: benefit, bonus, straordinario, demografia, indicatori LW."},{"k":"p","t":"Confronto con benchmark: soglie di povertà, benchmark LW (Anker/Global LW Coalition), valori di riferimento LW, salari prevalenti nel settore, minimi legali, reddito mediano nazionale."},{"k":"p","t":"Utilizzo del SAI Wage Tool per analisi strutturata."},{"k":"p","t":"Monitoraggio delle pressioni inflazionistiche locali: paniere alimentare, alloggio, sanità."},{"k":"p","t":"4.1.2 Piano di miglioramento retributivo"},{"k":"p","t":"Obiettivi temporizzati basati sui gap, rischi e risorse disponibili."},{"k":"p","t":"Aumenti salariali integrati nel budget annuale; investimento in formazione competenze; incentivi di performance."},{"k":"p","t":"Miglioramento processi per aumentare efficienza; coinvolgimento BP per aumento prezzi; fondi per benchmark LW."},{"k":"p","t":"Coinvolgimento sindacale e rappresentanti nella pianificazione e revisione retributiva."},{"k":"p","t":"Arretrati per sottopagamenti pregressi; incremento della retribuzione base per ridurre dipendenza dallo straordinario."},{"k":"p","t":"4.1.3 Barriere contestuali (D4.3)"},{"k":"p","t":"Negoziazione di prezzi più elevati con BP per coprire i gap; partecipazione a iniziative multi-stakeholder LW."},{"k":"p","t":"Dialogo sociale: supporto ad accordi tripartiti e settoriali; promozione LW con governo e associazioni di categoria."},{"k":"p","t":"4.2 Limiti orari e straordinario (D4.4–D4.5)"},{"k":"t","r":[["Rif.","Requisito","Modalità operative"],["D4.4a","Ore ordinarie ≤ 48h/settimana","Programmazione orari; sistema timekeeping digitale; previsione fabbisogno e capacità con BP; turni flessibili; piano di contingenza per picchi."],["D4.4b","Straordinario ≤ 12h/settimana","Pre-approvazione straordinario; roster rotativo; pool interfunzionale; target cottimo basati su capacità individuale; lead time minimi nei contratti BP."],["D4.5a","Straordinario volontario","Sistema di richiesta anticipata; nessuna penalizzazione per rifiuto; eccezione solo se legge/CBA lo consentono."],["D4.5b","Tariffa maggiorata","Maggiorazione secondo legge/CCNL; dove non definita: tariffe prevalenti nel paese."],["D4.5c–d","Calcolo per settimana; conformità","Straordinario calcolato per settimana lavorativa (eccezione: legge/CBA); conformità a tutti i requisiti applicabili."],["D4.5e","Non regolare","Straordinario non richiesto su base regolare; monitoraggio concentrazione: % ore straordinario del top 10% earners; analisi pianificato vs. non pianificato."]]},{"k":"p","t":"4.3 Programmazione orari e congedi (D4.6)"},{"k":"t","r":[["Rif.","Requisito D4.6","Modalità operative"],["a–b)","Standard dignitoso; prevedibilità","Orari pubblicati con min. 2 settimane di anticipo; diritto a rifiutare modifiche last-minute senza ritorsione; rotazione turni meno desiderabili tra categorie."],["c–d)","Sicurezza; pause e riposi","Riposo minimo 11h tra turni; pause adeguate; correlazione incidenti/turni irregolari; max giorni consecutivi notturni."],["e)","No media-orari per eludere maggiorazioni","Divieto di media-orari (hours averaging) che privino il personale delle maggiorazioni."],["f)","Riposo 24h ogni 6 giorni","Almeno 1 giorno di riposo consecutivo di 24 ore ogni 6 giorni lavorativi. Eccezioni solo se legge/CBA/ILO/richiesta personale."],["g)","Ferie, malattia, congedi","Congedi adeguati: malattia retribuita, congedo familiare, ferie, festività pubbliche."],["h–i)","Flessibilità; accesso benefit","Flessibilità per emergenze, visite mediche, scuola. No limitazione accesso a benefit aziendali/governativi. Benefit proporzionali per part-time."]]},{"k":"p","t":"4.4 Personale esente (D4.7)"},{"k":"p","t":"Compenso ≥ equivalente che guadagnerebbe lavorando le stesse ore al living wage con maggiorazioni straordinario."},{"k":"p","t":"Ragionevole discrezionalità sulle ore; benchmark settimanali; registrazione ore lavorate."},{"k":"p","t":"Tetti giornate consecutive; ferie aggiuntive; rotazione carichi di picco; rapporto salario/orario equivalente monitorato."},{"k":"p","t":"4.5 Pagamento e registri retributivi (D4.8–D4.10)"},{"k":"p","t":"Ciclo paghe fisso; calendario pubblicato; riserve di cassa di backup."},{"k":"p","t":"Modalità convenienti: bonifico, contanti, mobile transfer secondo preferenze; distribuzione in loco e in orario di lavoro."},{"k":"p","t":"Registri in lingua compresa; supporto a personale vulnerabile per apertura conti."},{"k":"p","t":"Cedolini chiari, completi e accurati: ore lavorate, composizione retribuzione, benefit, deduzioni; consegna entro il giorno paga (D4.10)."},{"k":"p","t":"Riconciliazione su richiesta del personale; revisione registri prima di ogni erogazione."},{"k":"p","t":"4.6 Continuità aziendale e priorità retributiva (D4.11)"},{"k":"p","t":"Conti separati per salari con fondi pre-depositati; accordi escrow o trust con terze parti."},{"k":"p","t":"Trigger finanziari che dirigono automaticamente fondi verso obblighi retributivi."},{"k":"p","t":"Assicurazione protezione salari o schemi di garanzia nazionali."},{"k":"p","t":"Fiduciari o comitati di supervisione per verificare i pagamenti; simulazioni periodiche."},{"k":"p","t":"4.7 Deduzioni disciplinari (D4.12)"},{"k":"p","t":"Solo se consentite da legge e CBA vincolante (D4.12a)."},{"k":"p","t":"Ragionevoli e per un periodo limitato (D4.12b)."},{"k":"p","t":"Non portano la retribuzione sotto il living wage o il minimo legale (D4.12c)."},{"k":"p","t":"Con opportunità di appello (D4.12d)."},{"k":"p","t":"Autorizzazione scritta HR; software paghe configurato per bloccare deduzioni sotto soglia; spiegazione scritta al lavoratore."},{"k":"p","t":"4.8 Forme di impiego atipiche (D4.13)"},{"k":"p","t":"Cottimo: target basati su studi tempo-metodo e input del personale; retribuzione ≥ living wage indipendentemente dalla produzione; valutazione impatti H&S."},{"k":"p","t":"Part-time: retribuzione, bonus e benefit proporzionali (pro-rata); N. minimo ore garantite; accesso formazione."},{"k":"p","t":"Stagionali / contratti a termine: limiti a rinnovi consecutivi; preavviso cessazione/non rinnovo; opportunità di transizione a tempo indeterminato."},{"k":"p","t":"Homeworker: registri (famiglie, quantità, pagamenti, previdenza, costi materiali, ore); pre-qualificazione intermediari."},{"k":"p","t":"Lavoro da remoto: equipaggiamento ergonomico; rimborso spese; accesso reclami e meccanismi gestionali."},{"k":"p","t":"4.9 Sistema di gestione e BP (D4.14)"},{"k":"p","t":"Rischi D4 nel registro rischi con focus su categorie vulnerabili (migranti, donne, caregiver)."},{"k":"p","t":"Clausole contrattuali BP: living wage, limiti orari, pagamento puntuale, no deduzioni illegittime."},{"k":"p","t":"Valutazione BP con checklist dedicata (MOD-19.02); schemi di condivisione costi per gap LW."},{"k":"p","t":"Coordinamento con PRO-17 (contrattazione) e PRO-12 (reclami retributivi/orari)."},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Retribuzioni e Living Wage (D4.2–3)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale che percepisce almeno il living wage","SAI Wage Tool","100%","Annuale"],["% personale al di sopra del minimo legale","Payroll / N. tot.","100%","Annuale"],["% reddito da straordinario","Retrib. OT / Retrib. totale","< 25%","Annuale"],["Gender pay gap / Migrant pay gap","Confronto","Riduzione YoY","Annuale"],["% aumento retributivo vs. aumento costo della vita","Confronto %","≥ inflazione","Annuale"]]},{"k":"p","t":"5.2 Orari e Straordinario (D4.4–6)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% personale che supera il limite giornaliero","Timekeeping","0%","Mensile"],["% personale che supera il limite settimanale","Timekeeping","0%","Mensile"],["Ore straordinario medie per lavoratore/mese","Media","≤ 48h/mese","Mensile"],["Concentrazione OT: % ore del top 10% earners","Analisi","Monitoraggio","Trimestrale"],["N. giorni consecutivi lavorati senza riposo","Max rilevato","≤ 6","Mensile"],["% turni con < 11h di riposo tra uno e l’altro","Timekeeping","0%","Mensile"],["% richieste di congedo approvate vs. negate","HR","Monitoraggio","Annuale"]]},{"k":"p","t":"5.3 Pagamento, Registri, Deduzioni e Atipici (D4.8–13)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["% cicli paga completati alla data programmata","Payroll","100%","Per ciclo"],["% personale che riceve cedolino scritto/digitale ogni ciclo","HR","100%","Per ciclo"],["% cedolini che dettagliano ore, composizione retribuzione, deduzioni","Campione","100%","Annuale"],["N. deduzioni disciplinari applicate (per tipo)","Conteggio","Monitoraggio","Annuale"],["% deduzioni con pre-autorizzazione HR documentata","N. autoriz. / N. tot.","100%","Per evento"],["% personale atipico con retribuzione ≥ LW e benefit pro-rata","Payroll","100%","Annuale"],["% contratti a termine rinnovati consecutivamente oltre il limite","HR","0%","Annuale"]]},{"k":"p","t":"6. DOCUMENTI E REGISTRAZIONI"},{"k":"t","r":[["Codice","Titolo","Descrizione"],["MOD-19.01","Checklist Orari, Retribuzioni e Benefit (D4.2–D4.13)","Verifica periodica dei requisiti D4 con 45+ punti di controllo."],["MOD-19.02","Checklist Verifica BP – Orari e Retribuzioni (D4.14)","Valutazione BP su LW, limiti orari, pagamenti, deduzioni."],["MOD-19.03","Registro Analisi Retributiva e Living Wage","Confronto retribuzioni vs. benchmark LW; gap analysis; piano miglioramento."],["MOD-19.04","Report Annuale Orari, Retribuzioni e Benefit","KPI D4, trend, gap LW, conformità orari, raccomandazioni, input RdD."]]},{"k":"p","t":"Conservazione: registri retributivi e presenze per almeno 5 anni."},{"k":"p","t":"Riservatezza: dati retributivi individuali trattati come riservati; accesso ristretto a HR, Payroll, Resp. SA."},{"k":"p","t":"Coordinamento: PRO-05 (rischi retributivi/orari), PRO-12 (reclami su salari/ore), PRO-17 (contrattazione collettiva)."}]},"PRO-20":{"code":"PRO-20","blocks":[{"k":"t","r":[["PROCEDURA PRO-20"],["Codice:","PRO-20","Revisione:","01"],["Titolo:","LIBERTÀ DALLA DISCRIMINAZIONE"],["Criteri SA8000:","D5.1–D5.6","Data:","[GG/MM/AAAA]"],["Redatto da:","[Responsabile SA8000]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"Registro delle Revisioni"},{"k":"t","r":[["Rev.","Data","Descrizione","Redatto da","Approvato da"],["01","[GG/MM/AAAA]","Prima emissione","[Resp. SA]","[Direzione]"]],"b":1},{"k":"p","t":"1. SCOPO E CAMPO DI APPLICAZIONE"},{"k":"p","t":"La presente procedura definisce le modalità operative per garantire la libertà dalla discriminazione del personale in tutte le interazioni con l’Organizzazione, in conformità ai criteri D5.1–D5.6 dello Standard SA8000:2026."},{"k":"p","t":"La procedura copre le seguenti aree:"},{"k":"p","t":"Parità di accesso e opportunità in: assunzione e reclutamento, condizioni di lavoro, collocamento, valutazione prestazioni, formazione, promozioni, reclami, retribuzioni e benefit, processi disciplinari, cessazione e pensionamento (D5.2 a–j)."},{"k":"p","t":"Libertà da condotta indesiderata: molestie, bullismo, intimidazione negli ambienti di lavoro e da parte di persone collegate al lavoro (D5.3)."},{"k":"p","t":"Inclusione delle differenze del personale: abilità, pratiche religiose/consuetudinarie, livelli di alfabetizzazione e lingua, esigenze igieniche, responsabilità di cura, altre esigenze (D5.4 a–f)."},{"k":"p","t":"Libertà da procedure mediche/corporee invasive: test di verginità, gravidanza, HIV/AIDS, altre procedure non pertinenti al ruolo. Eccezioni solo per prevenire impatti severi e con comunicazione/consenso preventivo (D5.5)."},{"k":"p","t":"Sistema di gestione efficace nelle operazioni e relazioni commerciali (D5.6)."},{"k":"p","t":"1.1 Riferimenti normativi"},{"k":"p","t":"SA8000:2026 – Standard for Decent Work, Criteri D5.1–D5.6"},{"k":"p","t":"SA8000:2026 – Indicator Library V1.0, Sezione D5"},{"k":"p","t":"Convenzione ILO n. 111 – Discriminazione (impiego e professione)"},{"k":"p","t":"Convenzione ILO n. 100 – Parità di retribuzione"},{"k":"p","t":"Convenzione ILO n. 190 – Violenza e molestie nel mondo del lavoro"},{"k":"p","t":"D.Lgs. 198/2006 – Codice delle pari opportunità"},{"k":"p","t":"D.Lgs. 216/2003 – Attuazione direttiva 2000/78/CE (parità trattamento)"},{"k":"p","t":"GDPR (Reg. UE 2016/679) – per dati sensibili e procedure mediche"},{"k":"p","t":"PRO-05 – Rischi; PRO-11 – Monitoraggio e Reclami; PRO-18 – Reclutamento Equo"},{"k":"p","t":"2. DEFINIZIONI E ABBREVIAZIONI"},{"k":"t","r":[["Termine / Sigla","Definizione"],["Discriminazione","Qualsiasi distinzione, esclusione o preferenza basata su razza, colore, sesso, genere, orientamento sessuale, religione, opinione politica, estrazione nazionale o sociale, disabilità, stato di salute, età, affiliazione sindacale, stato civile, gravidanza o qualsiasi altra condizione che annulli o comprometta la parità di opportunità o trattamento."],["Condotta indesiderata","Comportamento non gradito che include molestie, bullismo e intimidazione negli ambienti di lavoro o da parte di persone collegate al lavoro, indipendentemente dalla frequenza o dall’intenzionalità (D5.3)."],["Inclusione","Adozione di misure ragionevoli per accogliere le differenze del personale in termini di abilità, pratiche religiose, livelli di alfabetizzazione/lingua, esigenze igieniche, responsabilità di cura e altre esigenze che non impattino indebitamente la capacità di svolgere il ruolo (D5.4)."],["Procedura medica invasiva","Test o ispezione corporea non pertinente al ruolo specifico: test di verginità, gravidanza, HIV/AIDS o altre procedure. Eccezioni solo per prevenire impatti severi con comunicazione e consenso preventivo (D5.5)."],["Accomodamento ragionevole","Modifica o adattamento necessario e appropriato del luogo di lavoro, degli orari, degli strumenti o dei processi per consentire al personale di svolgere il proprio ruolo nonostante le differenze individuali."],["GBVH","Gender-Based Violence and Harassment – Violenza e molestie di genere."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","AD","Resp. SA","SPT","HR","Funzioni","OO.SS."],["Parità accesso e opportunità (D5.2)","A","C","R","C"],["Anti-molestie e condotta (D5.3)","A","R","C","R","C"],["Inclusione differenze (D5.4)","A","C","I","R","I"],["Procedure mediche invasive (D5.5)","A","R","I","R","C","I"],["SG e BP (D5.6)","A","R","C","I"]]},{"k":"p","t":"Legenda: R = Responsabile, A = Accountable, C = Consultato, I = Informato"},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Parità di accesso e opportunità (D5.2)"},{"k":"p","t":"L’Organizzazione garantisce l’assenza di discriminazione in tutte le 10 aree (D5.2 a–j):"},{"k":"t","r":[["Rif.","Area D5.2","Modalità operative"],["a–b)","Assunzione/reclutamento e condizioni","CV anonimizzati (nome, età, foto rimossi); annunci standardizzati; panel misti per colloqui; requisiti competenze documentati per ogni ruolo. Contratti e condizioni di lavoro uguali a parità di ruolo."],["c–d)","Collocamento e valutazione","Assegnazione incarichi basata su competenze; criteri di valutazione standardizzati e documentati; bias-check nei punti decisionali."],["e–f)","Formazione, mentoring e promozioni","Rotazione compiti ad alta visibilità e opportunità formative; pairing di gruppi sottorappresentati con leadership come mentor; tassi di promozione per gruppo demografico monitorati."],["g)","Reclami","Accesso equo ai meccanismi di reclamo per tutti; advisor esterno/ombudsperson indipendente per gestire reclami discriminazione in modo riservato (PRO-11)."],["h)","Retribuzioni e benefit","Fasce retributive anonimizzate pubblicate; SAI Wage Tool per analisi gap retributivo per genere, nazionalità, età; benefit inclusi alloggio, trasporti, pasti, famiglia."],["i–j)","Disciplina, cessazione, pensionamento","Panel misti per cessazioni; analisi tasso cessazione per gruppo demografico; comportamento discriminatorio incluso nel codice disciplinare. Exit interview con domande su discriminazione."]]},{"k":"p","t":"Ulteriori misure trasversali: obiettivi di diversità documentati; responsabilità anti-discriminazione assegnata al top management; team interfunzionali rappresentativi della demografia del personale."},{"k":"p","t":"4.2 Libertà da condotta indesiderata (D5.3)"},{"k":"p","t":"Counseling, supporto paritario o riassegnazione temporanea per chi subisce condotta indesiderata."},{"k":"p","t":"Peer allies designati in ogni reparto come punto di contatto informale."},{"k":"p","t":"Aspettative per intervento sicuro del personale testimone (bystander intervention)."},{"k":"p","t":"Rotazione staff/supervisori se i reclami si concentrano su determinati team."},{"k":"p","t":"Mediazione volontaria o dialogo riparativo oltre all’azione disciplinare."},{"k":"p","t":"Pubblicazione di sintesi anonimizzate dei casi trattati."},{"k":"p","t":"Adattamento turni, flussi di lavoro e linee di riporto per ridurre squilibri di potere e isolamento."},{"k":"p","t":"4.3 Inclusione delle differenze (D5.4)"},{"k":"t","r":[["Rif.","Differenza D5.4","Modalità operative"],["a)","Abilità","Workflow richieste ergonomiche/accomodamento; modulo “impact check” prima di negare accomodamento (motivi, alternative considerate). Postazioni adattabili."],["b)","Pratiche religiose/consuetudinarie","Quiet room / spazi benessere per preghiera, riposo, decompressione. Orari flessibili per festività religiose."],["c)","Alfabetizzazione e lingua","Revisione “plain language” delle politiche HR; materiali in lingue del personale; formazione non solo scritta ma visiva/pratica."],["d)","Esigenze igieniche","Accesso a servizi igienici adeguati; prodotti per l’igiene disponibili; privacy garantita."],["e)","Responsabilità di cura","Orari flessibili; congedi per caregiver; asilo nido/childcare; non penalizzazione per richieste di adattamento."],["f)","Altre esigenze","Processo riservato per comunicare necessità di accomodamento; tempo medio di risposta monitorato; tassi approvazione vs. rifiuto."]]},{"k":"p","t":"4.4 Procedure mediche/corporee invasive (D5.5)"},{"k":"p","t":"L’Organizzazione vieta le procedure mediche/corporee invasive non pertinenti al ruolo:"},{"k":"p","t":"Divieto assoluto di: test di verginità, test di gravidanza come condizione di impiego, test HIV/AIDS non giustificato."},{"k":"p","t":"Eccezioni solo per: prevenzione impatti severi su individuo o altri (D5.5a); comunicazione chiara e accordo preventivo con il personale (D5.5b)."},{"k":"p","t":"Consenso informato scritto prima di qualsiasi screening sanitario: scopo, ambito, utilizzo dei dati."},{"k":"p","t":"Giustificazione documentata dell’impossibilità di alternative meno intrusive."},{"k":"p","t":"Esecuzione da terze parti autorizzate, non da personale interno."},{"k":"p","t":"Conformità GDPR per trattamento dati sanitari; registri ad accesso ristretto."},{"k":"p","t":"4.5 Riconoscimento degli impatti negativi"},{"k":"t","r":[["Tipo di segnale","Esempi dall’Indicator Library"],["Impatti negativi","Stress emotivo/psicologico; mancato accesso a ruoli/promozioni/sviluppo professionale; retribuzione, bonus o benefit ridotti; mancata tutela per reclami; perdita ruolo/reddito."],["Segnali visivi","Demografia del personale per ruolo/autorità; segnaletica; linguaggio corporeo durante interviste; spazi dove il personale tace quando entra qualcuno; soprannomi, commenti su aspetto/accento; postazioni con adattamenti improvvisati."],["Segnali verbali","Dichiarazioni: “Certi ricevono sempre le opportunità per primi”, “Persone come me non restano a lungo”, “Non posso fare il supervisore, non credo sia permesso”, “Quel lavoro è da donna”, “Non saprei a chi rivolgermi se qualcosa non fosse giusto”, “Cerco di non farmi notare per non essere preso di mira”, “Ho firmato documenti che non capivo perché non c’era traduzione”."]]},{"k":"p","t":"4.6 Sistema di gestione e BP (D5.6)"},{"k":"p","t":"Rischi discriminazione nel registro rischi (PRO-05) con attenzione a genere, nazionalità, disabilità, età."},{"k":"p","t":"Clausole contrattuali BP: politica anti-discriminazione, parità retributiva, no procedure mediche invasive, inclusione."},{"k":"p","t":"Valutazione BP con checklist dedicata (MOD-20.02)."},{"k":"p","t":"Meccanismo reclamo discriminazione accessibile anche per personale dei BP (PRO-11)."},{"k":"p","t":"Formazione specifica per HR, supervisori e tutto il personale su anti-discriminazione, bias inconscio, inclusione."},{"k":"p","t":"4.7 Flusso del processo"},{"k":"t","r":[["Fase","Attività","Descrizione","Resp.","Tempi"],["1","Prevenzione","Politica anti-discriminazione; obiettivi diversità; formazione bias; CV anonimizzati; criteri standardizzati; peer allies.","AD / HR / Resp. SA","Continuo"],["2","Inclusione","Accomodamenti ragionevoli; quiet room; plain language; orari flessibili; workflow richieste; impact check.","HR / Funzioni","Continuo"],["3","Monitoraggio","Analisi pay gap; tassi promozione/turnover/disciplina per demografia; survey inclusione; audit interni D5.","Resp. SA / HR","Annuale"],["4","Segnalazione","Meccanismo reclamo riservato; advisor esterno/ombudsperson; peer allies; PRO-12.","Resp. SA / SPT","Continuo"],["5","Risposta","Indagine; azione disciplinare; mediazione/dialogo riparativo; supporto vittime; pubblicazione sintesi anonimizzate.","HR / Resp. SA","Per evento"],["6","BP e catena","Valutazione MOD-20.02; clausole contrattuali; audit; reclami accessibili anche per personale BP.","Resp. SA / Acquisti","Annuale"]]},{"k":"p","t":"5. INDICATORI DI PRESTAZIONE DEL PROCESSO"},{"k":"p","t":"5.1 Parità di accesso e opportunità (D5.2)"},{"k":"t","r":[["Indicatore","Formula / Metodo","Target","Freq."],["Pay gap retributivo per ruoli comparabili (genere, nazionalità)","Confronto","Riduzione YoY","Annuale"],["Tasso promozione per gruppo demografico vs. quota forza lavoro","Confronto %","Parità","Annuale"],["Tasso turnover per gruppo demografico","Confronto %","Parità","Annuale"],["Tasso partecipazione a formazione/sviluppo per gruppo","Confronto %","Parità","Annuale"],["% ruoli supervisione detenuti da gruppi sottorappresentati","N. / N. tot. × 100","Monitoraggio","Annuale"],["Proporzione candidati da diversi gruppi che raggiungono la shortlist","Confronto %","Mon
