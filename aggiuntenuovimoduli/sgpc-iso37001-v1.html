<script type="application/json" id="corpus">{"pro":{"PAC-01":{"code":"PAC-01","titolo":"CONTESTO, CAMPO DI APPLICAZIONE E VALUTAZIONE DEL RISCHIO DI CORRUZIONE","fase":"4 · Contesto","rif":"UNI ISO 37001 punti 4.1 ÷ 4.5","blocks":[{"k":"t","r":[["PROCEDURA PAC-01","","",""],["Codice:","PAC-01","Revisione:","[Rev.]"],["Titolo:","CONTESTO, CAMPO DI APPLICAZIONE E VALUTAZIONE DEL RISCHIO DI CORRUZIONE","",""],["Punti norma:","4 · Contesto","",""],["Riferimenti:","UNI ISO 37001 punti 4.1 ÷ 4.5","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità con cui [Nome Organizzazione] determina il contesto in cui opera, il campo di applicazione del sistema di gestione per la prevenzione della corruzione e il livello di rischio di corruzione a cui è esposta."},{"k":"p","t":"La valutazione del rischio è il documento che regge l'intero sistema: da essa discendono l'estensione della due diligence, l'intensità dei controlli e l'ambito degli audit interni. Un sistema costruito senza di essa non è proporzionato, e la proporzionalità è ciò che la norma richiede."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 4.1, 4.2, 4.3, 4.4, 4.5 e appendice A (punti A.2, A.3, A.4)"},{"k":"p","t":"D.Lgs. 231/2001 e reati presupposto contro la pubblica amministrazione"},{"k":"p","t":"Legge 190/2012 per i rapporti con le pubbliche amministrazioni"},{"k":"p","t":"PAC-07 Due diligence, PAC-08 Controlli, PAC-12 Audit interno"},{"k":"p","t":"2. DEFINIZIONI OPERATIVE"},{"k":"t","r":[["Termine","Uso nel presente sistema"],["Corruzione","Offerta, promessa, dazione, accettazione o richiesta di un vantaggio indebito, diretto o indiretto, come incentivo o ricompensa per un'azione o un'omissione connessa alle mansioni di una persona."],["Corruzione in uscita","Atto di corruzione commesso dall'Organizzazione, dal suo personale o da un socio in affari per suo conto o a suo vantaggio."],["Corruzione in entrata","Atto di corruzione subito dall'Organizzazione, ossia richiesta o accettazione di un vantaggio indebito da parte del proprio personale."],["Rischio non superiore al livello basso","Esito della valutazione che esclude l'applicazione dei controlli rafforzati previsti per soci in affari, transazioni e posizioni a rischio più elevato."],["Socio in affari","Parte esterna con cui l'Organizzazione ha o progetta di stabilire una relazione commerciale di qualsiasi forma."],["Pubblico ufficiale","Soggetto che esercita una funzione pubblica, secondo la definizione della norma e della legge applicabile."]]},{"k":"p","t":"3. RESPONSABILITÀ"},{"k":"t","r":[["Attività","Alta Dir.","Organo di governo","Funz. PC","Funzioni"],["Analisi del contesto","R","C","R","C"],["Determinazione del campo di applicazione","A","C","R","C"],["Conduzione della valutazione del rischio","A","I","R","R"],["Approvazione dei criteri di valutazione","A","C","R","I"],["Riesame periodico","A","C","R","C"]]},{"k":"p","t":"4. MODALITÀ OPERATIVE"},{"k":"p","t":"4.1 Analisi del contesto"},{"k":"p","t":"Sono determinati e registrati nel MOD-01.01 i fattori che incidono sull'esposizione al rischio: dimensione, struttura e autorità decisionale delegata; paesi e settori di operatività; natura ed entità delle attività; modello di business; organizzazioni controllate e controllanti; tipologie di soci in affari; natura e frequenza delle interazioni con pubblici ufficiali; obblighi di legge, contrattuali e professionali applicabili."},{"k":"p","t":"È valutato e motivato se il cambiamento climatico costituisca un fattore rilevante per l'Organizzazione."},{"k":"p","t":"Sono individuate le parti interessate rilevanti e i loro requisiti, distinguendo tra requisiti obbligatori, aspettative non obbligatorie e impegni volontari assunti."},{"k":"p","t":"4.2 Campo di applicazione"},{"k":"p","t":"Il campo di applicazione è determinato considerando il contesto, i requisiti delle parti interessate e gli esiti della valutazione del rischio, ed è documentato nel MOD-01.02 con indicazione di sedi, attività, processi e società incluse ed escluse, con motivazione delle esclusioni."},{"k":"p","t":"4.3 Criteri di valutazione"},{"k":"p","t":"I criteri sono definiti dall'Organizzazione e approvati dall'alta direzione (MOD-01.04). Il presente sistema adotta quattro livelli — basso, medio, alto, critico — e determina, per ciascuna posizione, se il rischio sia o non sia superiore al livello basso."},{"k":"p","t":"Questa distinzione non è formale: dalla sua determinazione dipende l'applicabilità della due diligence rafforzata, degli impegni anticorruzione, della formazione ai soci in affari e della comunicazione diretta della politica."},{"k":"p","t":"4.4 Conduzione della valutazione"},{"k":"p","t":"La valutazione è condotta per processo e per scenario, distinguendo la corruzione in uscita da quella in entrata, e per ciascuno scenario registra:"},{"k":"p","t":"processo o attività interessata e funzione coinvolta;"},{"k":"p","t":"descrizione dello scenario, con indicazione della controparte e del vantaggio perseguito;"},{"k":"p","t":"fattori di esposizione: paese, interazione con pubblici ufficiali, ricorso a intermediari, discrezionalità, valore della transazione, modalità di remunerazione;"},{"k":"p","t":"probabilità e conseguenza, con il livello di rischio inerente che ne deriva;"},{"k":"p","t":"controlli esistenti e valutazione della loro idoneità ed efficacia;"},{"k":"p","t":"rischio residuo ed esito della soglia (non superiore al basso, oppure superiore)."},{"k":"p","t":"4.5 Idoneità dei controlli esistenti"},{"k":"p","t":"Per ogni scenario è valutato se i controlli in essere siano idonei a contenere il rischio stimato. Dove non lo sono, la carenza genera un'azione registrata nel piano di cui alla PAC-04. La valutazione non si esaurisce nell'attribuzione di un punteggio: la parte che conta è il giudizio sull'efficacia dei controlli."},{"k":"p","t":"4.6 Riesame"},{"k":"p","t":"La valutazione è riesaminata almeno annualmente e comunque in caso di modifica significativa della struttura o delle attività, ingresso in nuovi mercati o linee di prodotto, novità normative, esito di un'indagine o di un audit. Le informazioni documentate che dimostrano lo svolgimento della valutazione e il suo utilizzo per progettare il sistema sono conservate."},{"k":"p","t":"5. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Processi coperti dalla valutazione","MOD-01.03","Annuale","100%"],["Scenari con controlli valutati non idonei e azione aperta","MOD-01.03","Semestrale","In riduzione"],["Riesame della valutazione nei termini","MOD-01.03","Annuale","Nei termini"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-01.01","Analisi del contesto e delle parti interessate","Fattori interni ed esterni, parti interessate e loro requisiti"],["MOD-01.02","Campo di applicazione del sistema","Confini, sedi, attività incluse ed escluse con motivazione"],["MOD-01.03","Registro della valutazione del rischio di corruzione","Scenari, fattori, rischio inerente, controlli, rischio residuo, soglia"],["MOD-01.04","Criteri di valutazione del rischio","Scale, pesi, soglie e regole di elevazione approvate dalla direzione"]]}]},"PAC-02":{"code":"PAC-02","titolo":"LEADERSHIP, POLITICA E CULTURA ANTI-CORRUZIONE","fase":"5 · Leadership","rif":"UNI ISO 37001 punti 5.1 e 5.2","blocks":[{"k":"t","r":[["PROCEDURA PAC-02","","",""],["Codice:","PAC-02","Revisione:","[Rev.]"],["Titolo:","LEADERSHIP, POLITICA E CULTURA ANTI-CORRUZIONE","",""],["Punti norma:","5 · Leadership","",""],["Riferimenti:","UNI ISO 37001 punti 5.1 e 5.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce gli impegni dell'organo di governo e dell'alta direzione, il contenuto e la diffusione della politica per la prevenzione della corruzione e le modalità con cui la cultura anti-corruzione è sviluppata e verificata."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 5.1.1, 5.1.2, 5.1.3, 5.2 e appendice A (punti A.5)"},{"k":"p","t":"PAC-03 Ruoli e funzione di conformità, PAC-06 Consapevolezza e comunicazione"},{"k":"p","t":"2. RESPONSABILITÀ"},{"k":"t","r":[["Attività","Organo di governo","Alta Dir.","Funz. PC","Dirigenti"],["Approvazione della politica","R","C","C","I"],["Allineamento tra strategia e politica","R","R","C","I"],["Sorveglianza sull'attuazione","R","C","R","I"],["Assegnazione delle risorse","A","R","C","I"],["Promozione della cultura anti-corruzione","R","R","C","R"],["Relazione periodica all'organo di governo","A","R","R","I"]]},{"k":"p","t":"3. MODALITÀ OPERATIVE"},{"k":"p","t":"3.1 Organo di governo"},{"k":"p","t":"Ove esista un organo di governo distinto, esso approva la politica, verifica la coerenza tra strategia e politica, riceve e riesamina a intervalli programmati le informazioni sul contenuto e sul funzionamento del sistema, richiede l'assegnazione di risorse adeguate ed esercita una sorveglianza ragionevole sull'attuazione da parte dell'alta direzione."},{"k":"p","t":"Dove l'organo di governo non è distinto dall'alta direzione, queste attività sono svolte da quest'ultima e la circostanza è dichiarata nel MOD-01.02."},{"k":"p","t":"3.2 Alta direzione"},{"k":"p","t":"L'alta direzione assicura che politica e obiettivi siano stabiliti e integrati nei processi di business, rende disponibili le risorse, comunica internamente ed esternamente la politica, guida il personale, promuove la cultura anti-corruzione e il miglioramento continuo, incoraggia l'uso dei canali di segnalazione e assicura l'assenza di ritorsioni."},{"k":"p","t":"Riferisce all'organo di governo, a intervalli programmati, sul funzionamento del sistema e su ogni accusa di corruzione grave o sistematica; per queste ultime la comunicazione è immediata e non attende la scadenza periodica."},{"k":"p","t":"3.3 Contenuto della politica"},{"k":"p","t":"La politica (MOD-02.01) vieta la corruzione, richiede la conformità alle leggi anticorruzione applicabili, è appropriata alle finalità dell'Organizzazione, fornisce il quadro di riferimento per gli obiettivi, comprende l'impegno a soddisfare i requisiti applicabili e al miglioramento continuo, incoraggia la segnalazione in buona fede senza timore di ritorsioni, spiega l'autorità e l'indipendenza della funzione per la prevenzione della corruzione e illustra le conseguenze della non conformità."},{"k":"p","t":"Il divieto copre espressamente sia la corruzione attiva sia la richiesta o l'accettazione di vantaggi indebiti da parte del personale, e i pagamenti agevolativi."},{"k":"p","t":"3.4 Diffusione"},{"k":"p","t":"La politica è disponibile come informazione documentata, comunicata all'interno dell'Organizzazione nelle lingue appropriate, resa disponibile alle parti interessate e comunicata direttamente ai soci in affari che pongono un rischio superiore al livello basso. La pubblicazione sul sito istituzionale è raccomandata: rende note le aspettative e riduce la probabilità che vengano proposte o richieste tangenti."},{"k":"p","t":"3.5 Cultura anti-corruzione"},{"k":"p","t":"La cultura non si dichiara, si osserva. Sono adottate e documentate misure concrete: coerenza visibile dei comportamenti della direzione, inserimento del tema nel programma di ingresso del personale, comunicazione continua, riconoscimento dei comportamenti virtuosi, e soprattutto uniformità nel trattamento delle violazioni indipendentemente dalla posizione ricoperta."},{"k":"p","t":"L'efficacia è misurata attraverso gli indicatori del MOD-02.03: percezione rilevata presso il personale, comprensione del proprio ruolo, uso effettivo dei canali di segnalazione, esiti dei provvedimenti adottati."},{"k":"p","t":"Un sistema in cui nessun dirigente è mai stato oggetto di provvedimento e nessuna segnalazione è mai pervenuta non è un sistema privo di problemi: è un sistema di cui va verificata la credibilità."},{"k":"p","t":"4. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Riesami dell'organo di governo svolti","MOD-02.02","Annuale","Secondo programma"],["Personale che dichiara di conoscere la politica","MOD-02.03","Annuale","≥ 95%"],["Provvedimenti adottati per violazioni, per livello gerarchico","MOD-02.03","Annuale","Monitoraggio"],["Soci in affari a rischio superiore al basso destinatari della politica","MOD-09.02","Semestrale","100%"]]},{"k":"p","t":"5. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-02.01","Politica per la prevenzione della corruzione","Modello di politica approvata dall'organo di governo"],["MOD-02.02","Verbale dell'organo di governo","Sorveglianza sull'attuazione, informazioni ricevute, decisioni"],["MOD-02.03","Indicatori della cultura anti-corruzione","Misure adottate ed evidenze della loro efficacia"]]}]},"PAC-03":{"code":"PAC-03","titolo":"RUOLI, FUNZIONE PER LA PREVENZIONE DELLA CORRUZIONE E DELEGHE DECISIONALI","fase":"5 · Leadership","rif":"UNI ISO 37001 punto 5.3","blocks":[{"k":"t","r":[["PROCEDURA PAC-03","","",""],["Codice:","PAC-03","Revisione:","[Rev.]"],["Titolo:","RUOLI, FUNZIONE PER LA PREVENZIONE DELLA CORRUZIONE E DELEGHE DECISIONALI","",""],["Punti norma:","5 · Leadership","",""],["Riferimenti:","UNI ISO 37001 punto 5.3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce l'attribuzione dei ruoli nel sistema, i requisiti e i poteri della funzione per la prevenzione della corruzione e i controlli sui processi decisionali delegati."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 5.3.1, 5.3.2, 5.3.3 e appendice A (punto A.6)"},{"k":"p","t":"D.Lgs. 231/2001 per il coordinamento con l'organismo di vigilanza"},{"k":"p","t":"PAC-02 Leadership, PAC-12 Audit interno"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Ripartizione delle responsabilità"},{"k":"p","t":"L'alta direzione conserva la responsabilità complessiva dell'attuazione e dell'osservanza del sistema; la delega non la trasferisce. I dirigenti a ogni livello rispondono dell'applicazione del sistema nella propria area. L'organo di governo, l'alta direzione e il personale rispondono ciascuno della comprensione e dell'osservanza per la parte che compete al proprio ruolo."},{"k":"p","t":"La ripartizione è formalizzata nel MOD-03.02."},{"k":"p","t":"2.2 Funzione per la prevenzione della corruzione"},{"k":"p","t":"La funzione è nominata con atto formale (MOD-03.01) e ha responsabilità e autorità per: assicurare la conformità del sistema ai requisiti della norma; relazionare sulla prestazione del sistema all'organo di governo e all'alta direzione; supervisionare progettazione e attuazione; fornire consulenza al personale e alle parti interessate."},{"k":"p","t":"Requisiti della persona o delle persone incaricate:"},{"k":"t","r":[["Requisito","Verifica in sede di nomina"],["Competenza","Istruzione, formazione o esperienza adeguate; capacità di apprendere il ruolo"],["Status","Autorevolezza sufficiente perché le sue posizioni siano ascoltate e rispettate"],["Autorità","Poteri conferiti dall'organo di governo e dall'alta direzione, sufficienti a operare"],["Indipendenza","Non coinvolgimento personale nelle attività esposte al rischio di corruzione"],["Risorse","Budget, tempo e strumenti proporzionati al rischio e al carico di lavoro"]]},{"k":"p","t":"2.3 Indipendenza nelle organizzazioni di piccole dimensioni"},{"k":"p","t":"Dove il ruolo è svolto a tempo parziale, non può essere assunto da chi, nella funzione primaria, è esposto al rischio di corruzione: sono incompatibili, in particolare, le funzioni commerciali e di acquisto sulle transazioni a rischio superiore al basso."},{"k":"p","t":"Nelle organizzazioni molto piccole in cui l'indipendenza piena non è raggiungibile, la circostanza è dichiarata, sono documentate le misure adottate per separare le responsabilità e l'imparzialità è presidiata attraverso il ricorso a una parte terza per le verifiche."},{"k":"p","t":"2.4 Accesso diretto"},{"k":"p","t":"La funzione ha accesso diretto e tempestivo all'organo di governo e all'alta direzione. Non riferisce attraverso una catena gerarchica intermedia per le questioni relative ad atti di corruzione o al sistema di gestione."},{"k":"p","t":"2.5 Esternalizzazione"},{"k":"p","t":"Tutta o parte della funzione può essere affidata a un soggetto esterno. In tal caso è individuato il dirigente interno che mantiene la responsabilità generale e l'autorità sulla funzione e che supervisiona i servizi resi dal terzo."},{"k":"p","t":"2.6 Coordinamento con altri organi"},{"k":"p","t":"Dove esiste un organismo di vigilanza ex D.Lgs. 231/2001, i flussi informativi reciproci sono definiti e registrati, evitando duplicazioni e assicurando che le segnalazioni rilevanti per entrambi siano trattate una sola volta e conosciute da entrambi."},{"k":"p","t":"2.7 Deleghe nel processo decisionale"},{"k":"p","t":"Dove l'alta direzione delega decisioni relative ad attività con rischio di corruzione superiore al livello basso, il processo decisionale è disciplinato in modo che il livello di autorità sia adeguato e che il decisore sia privo di conflitti di interessi effettivi o potenziali."},{"k":"p","t":"Le deleghe e i poteri di spesa sono registrati nel MOD-03.03 con soglie, doppia firma dove prevista e incompatibilità. La verifica di tali processi è svolta a intervalli programmati."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Deleghe verificate nel periodo","MOD-03.03","Annuale","100%"],["Decisioni a rischio assunte da soggetto in conflitto dichiarato","MOD-05.04","Semestrale","0"],["Comunicazioni dirette della funzione all'organo di governo","MOD-12.04","Annuale","Secondo programma"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-03.01","Nomina della funzione per la prevenzione della corruzione","Poteri, indipendenza, risorse, accesso diretto agli organi"],["MOD-03.02","Matrice dei ruoli e delle responsabilità","Attività del sistema e funzioni responsabili"],["MOD-03.03","Registro delle deleghe e dei poteri decisionali","Delegato, ambito, soglia, doppia firma, incompatibilità, verifica"]]}]},"PAC-04":{"code":"PAC-04","titolo":"PIANIFICAZIONE, OBIETTIVI E GESTIONE DELLE MODIFICHE","fase":"6 · Pianificazione","rif":"UNI ISO 37001 punti 6.1, 6.2, 6.3","blocks":[{"k":"t","r":[["PROCEDURA PAC-04","","",""],["Codice:","PAC-04","Revisione:","[Rev.]"],["Titolo:","PIANIFICAZIONE, OBIETTIVI E GESTIONE DELLE MODIFICHE","",""],["Punti norma:","6 · Pianificazione","",""],["Riferimenti:","UNI ISO 37001 punti 6.1, 6.2, 6.3","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di pianificazione del sistema, di fissazione degli obiettivi per la prevenzione della corruzione e di gestione delle modifiche."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 6.1, 6.2, 6.3 e appendice A (punto A.20)"},{"k":"p","t":"PAC-01 Valutazione del rischio, PAC-12 Riesame"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Rischi e opportunità del sistema"},{"k":"p","t":"A partire dal contesto e dai requisiti delle parti interessate sono determinati i rischi e le opportunità che possono compromettere o favorire il conseguimento dei risultati attesi, e sono pianificate le azioni per affrontarli, il modo di integrarle nel sistema e i criteri per valutarne l'efficacia (MOD-04.02)."},{"k":"p","t":"Questi rischi riguardano il funzionamento del sistema — competenze insufficienti, controlli non applicati, canali di segnalazione non credibili — e sono cosa distinta dagli scenari di corruzione valutati nella PAC-01."},{"k":"p","t":"2.2 Obiettivi"},{"k":"p","t":"Gli obiettivi sono fissati per le funzioni e i livelli pertinenti e sono coerenti con la politica, misurabili ove fattibile, realizzabili, monitorati, comunicati, aggiornati e disponibili come informazione documentata."},{"k":"p","t":"Per ciascun obiettivo il MOD-04.01 registra: cosa sarà fatto, quali risorse sono richieste, chi ne è responsabile, quando sarà conseguito, come saranno valutati i risultati e chi commina sanzioni e penalità in caso di inosservanza."},{"k":"p","t":"2.3 Formulazione degli obiettivi"},{"k":"p","t":"Gli obiettivi sono formulati in termini di risultato verificabile e non di attività svolta. «Erogare la formazione» non è un obiettivo; «portare al 100% la copertura formativa delle posizioni a rischio superiore al basso entro il 30 giugno» lo è."},{"k":"p","t":"Almeno un obiettivo annuale riguarda l'efficacia dei controlli e non la sola copertura documentale."},{"k":"p","t":"2.4 Pianificazione delle modifiche"},{"k":"p","t":"Le modifiche al sistema sono attuate in modo pianificato, considerando scopo e conseguenze potenziali, integrità del sistema, disponibilità di risorse, ridistribuzione di responsabilità e autorità, tempi di attuazione. La scheda MOD-04.03 documenta la valutazione preventiva, anche per le modifiche derivanti da azioni correttive."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Obiettivi raggiunti nell'esercizio","MOD-04.01","Annuale","≥ 80%"],["Obiettivi con indicatore misurabile associato","MOD-04.01","Annuale","100%"],["Modifiche attuate con valutazione preventiva","MOD-04.03","Annuale","100%"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-04.01","Piano degli obiettivi","Obiettivo, indicatore, risorse, responsabile, termine, sanzioni"],["MOD-04.02","Registro dei rischi e delle opportunità del sistema","Rischio, azione, integrazione, valutazione di efficacia"],["MOD-04.03","Scheda di pianificazione delle modifiche","Scopo, conseguenze, risorse, responsabilità, tempi"]]}]},"PAC-05":{"code":"PAC-05","titolo":"COMPETENZA, PROCESSO DI ASSUNZIONE E CONFLITTI DI INTERESSI","fase":"7 · Supporto","rif":"UNI ISO 37001 punti 7.1, 7.2 e 3.28","blocks":[{"k":"t","r":[["PROCEDURA PAC-05","","",""],["Codice:","PAC-05","Revisione:","[Rev.]"],["Titolo:","COMPETENZA, PROCESSO DI ASSUNZIONE E CONFLITTI DI INTERESSI","",""],["Punti norma:","7 · Supporto","",""],["Riferimenti:","UNI ISO 37001 punti 7.1, 7.2 e 3.28","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le risorse e le competenze necessarie al sistema, i controlli anticorruzione nel processo di assunzione e nella gestione del personale, e il trattamento dei conflitti di interessi."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 7.1, 7.2.1, 7.2.2.1, 7.2.2.2 e appendice A (punti A.7, A.8)"},{"k":"p","t":"Normativa sul trattamento dei dati personali per le verifiche sui candidati"},{"k":"p","t":"PAC-07 Due diligence, PAC-11 Segnalazioni"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Risorse"},{"k":"p","t":"Sono determinate e rese disponibili le risorse umane, fisiche e finanziarie necessarie all'istituzione, attuazione, mantenimento e miglioramento continuo del sistema. L'adeguatezza è valutata in sede di riesame."},{"k":"p","t":"2.2 Competenza"},{"k":"p","t":"Sono determinate le competenze necessarie per le persone che lavorano sotto il controllo dell'Organizzazione e che incidono sulla prestazione in materia di prevenzione della corruzione; ne è assicurata la sussistenza sulla base di istruzione, formazione o esperienza, con azioni per acquisirle dove mancanti e valutazione dell'efficacia di tali azioni. Le evidenze sono conservate."},{"k":"p","t":"2.3 Condizioni di assunzione applicabili a tutto il personale"},{"k":"p","t":"le condizioni di assunzione richiedono il rispetto della politica e del sistema, con diritto dell'Organizzazione di sanzionare le violazioni;"},{"k":"p","t":"entro un termine ragionevole dall'assunzione il personale riceve la politica, o l'accesso a essa, e la relativa formazione;"},{"k":"p","t":"sono disponibili procedure disciplinari applicabili in caso di violazione;"},{"k":"p","t":"nessun membro del personale subisce ritorsioni, discriminazioni o misure disciplinari per essersi rifiutato di prendere parte ad attività con rischio di corruzione superiore al basso non limitato, o per aver segnalato in buona fede;"},{"k":"p","t":"il personale è informato dell'obbligo di segnalare i conflitti di interessi potenziali ed effettivi."},{"k":"p","t":"2.4 Posizioni a rischio superiore al livello basso"},{"k":"p","t":"Per le posizioni esposte a rischio superiore al livello basso e per la funzione per la prevenzione della corruzione:"},{"k":"p","t":"è svolta la due diligence sulla persona prima dell'assunzione e prima del trasferimento o della promozione, secondo la PAC-07 e la checklist MOD-05.01;"},{"k":"p","t":"i bonus, gli obiettivi di prestazione e gli altri elementi incentivanti sono riesaminati a intervalli programmati per verificare che siano presenti salvaguardie sufficienti a evitare che favoriscano la corruzione (MOD-05.05);"},{"k":"p","t":"tali soggetti, l'alta direzione e l'organo di governo depositano a intervalli programmati una dichiarazione di conformità alla politica e al sistema (MOD-05.02)."},{"k":"p","t":"2.5 Retribuzione e incentivi"},{"k":"p","t":"Il riesame degli incentivi verifica in particolare: bonus legati all'aggiudicazione di commesse; obiettivi di vendita eccessivamente ambiziosi; pressione sulla prestazione tale da rendere razionale l'occultamento di criticità. Dove il rischio è rilevato, sono introdotte salvaguardie: tetti, differimenti, componenti qualitative, clausole di decadenza in caso di violazione."},{"k":"p","t":"2.6 Conflitti di interessi"},{"k":"p","t":"Il rischio di conflitti di interessi interni ed esterni è identificato, analizzato e valutato. Tutto il personale è informato in modo chiaro del dovere di dichiarare ogni conflitto potenziale ed effettivo — legami familiari, interessi economici, cariche e rapporti direttamente o indirettamente collegati alla propria linea di lavoro."},{"k":"p","t":"Le dichiarazioni (MOD-05.03) sono raccolte all'assunzione, al cambio di ruolo e comunque annualmente, e confluiscono nel registro MOD-05.04, che riporta per ogni caso le misure di limitazione adottate: astensione dalla decisione, riassegnazione dell'istruttoria, doppia firma, informativa all'organo di governo."},{"k":"p","t":"Il registro è riesaminato almeno una volta all'anno per verificare che le dichiarazioni siano pertinenti e aggiornate."},{"k":"p","t":"2.7 Staff e lavoratori temporanei"},{"k":"p","t":"Per lo staff e i lavoratori somministrati è determinato se il rischio sia affrontato trattandoli come personale proprio ai fini di formazione e controllo, oppure applicando i controlli attraverso il socio in affari che li fornisce. La scelta è motivata e registrata."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Posizioni a rischio superiore al basso con due diligence svolta","MOD-05.01","Semestrale","100%"],["Dichiarazioni di conformità raccolte nei termini","MOD-05.02","Annuale","100%"],["Dichiarazioni di conflitto di interessi aggiornate negli ultimi 12 mesi","MOD-05.04","Annuale","100%"],["Conflitti dichiarati con misura di limitazione attuata","MOD-05.04","Semestrale","100%"],["Riesame degli incentivi svolto","MOD-05.05","Annuale","Nei termini"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-05.01","Checklist di due diligence sul personale","Verifiche su qualifiche, referenze, precedenti, legami con pubblici ufficiali"],["MOD-05.02","Dichiarazione di conformità anticorruzione","Dichiarazione periodica di osservanza della politica e del sistema"],["MOD-05.03","Dichiarazione di conflitto di interessi","Modulo individuale di dichiarazione"],["MOD-05.04","Registro dei conflitti di interessi","Casi dichiarati, valutazione, misure di limitazione, riesame"],["MOD-05.05","Riesame degli incentivi retributivi","Elementi incentivanti esaminati, rischio rilevato, salvaguardie"]]}]},"PAC-06":{"code":"PAC-06","titolo":"CONSAPEVOLEZZA, FORMAZIONE, COMUNICAZIONE E INFORMAZIONI DOCUMENTATE","fase":"7 · Supporto","rif":"UNI ISO 37001 punti 7.3, 7.4, 7.5","blocks":[{"k":"t","r":[["PROCEDURA PAC-06","","",""],["Codice:","PAC-06","Revisione:","[Rev.]"],["Titolo:","CONSAPEVOLEZZA, FORMAZIONE, COMUNICAZIONE E INFORMAZIONI DOCUMENTATE","",""],["Punti norma:","7 · Supporto","",""],["Riferimenti:","UNI ISO 37001 punti 7.3, 7.4, 7.5","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce i programmi di consapevolezza e formazione per il personale e per i soci in affari, la comunicazione interna ed esterna e il controllo delle informazioni documentate."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 7.3.1 ÷ 7.3.4, 7.4.1, 7.4.2, 7.5.1 ÷ 7.5.3 e appendice A (punti A.9, A.17)"},{"k":"p","t":"PAC-02 Politica, PAC-09 Soci in affari"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Consapevolezza del personale"},{"k":"p","t":"Il personale è reso consapevole di: politica, procedure e formazione anticorruzione e dovere di conformarsi; proprio contributo all'efficacia del sistema e vantaggi della segnalazione; implicazioni della mancata conformità; modalità e destinatari delle segnalazioni."},{"k":"p","t":"Le informazioni documentate registrano il contenuto del programma, quando e a chi è stato erogato."},{"k":"p","t":"2.2 Formazione del personale"},{"k":"p","t":"La formazione è proporzionata ai risultati della valutazione del rischio e affronta: politiche e procedure applicabili; rischi di corruzione e danni che ne derivano per la persona e per l'Organizzazione; circostanze in cui la corruzione può verificarsi nelle proprie mansioni e come riconoscerle; come riconoscere e affrontare proposte e offerte di tangenti; come prevenirle e quali indicatori di rischio osservare; risorse disponibili."},{"k":"p","t":"Il contenuto è graduato: chi non è esposto a rischi significativi riceve una formazione essenziale sulla politica e su cosa fare in caso di sospetto; chi ricopre ruoli ad alto rischio riceve una formazione dettagliata, preferibilmente in aula, con casi tratti dagli scenari della PAC-01."},{"k":"p","t":"2.3 Periodicità"},{"k":"p","t":"La formazione è erogata dall'inizio del rapporto di lavoro e ripetuta a intervalli pianificati in base al ruolo, ai rischi cui la persona è esposta e alle circostanze mutevoli. I programmi sono aggiornati quando intervengono novità rilevanti."},{"k":"p","t":"2.4 Formazione dei soci in affari"},{"k":"p","t":"Tenuto conto dei rischi identificati, sono individuati i soci in affari che agiscono per conto o a vantaggio dell'Organizzazione e che pongono un rischio superiore al livello basso, i cui addetti devono ricevere formazione anticorruzione."},{"k":"p","t":"Sono definiti: quali soci in affari, quale contenuto minimo, con quali mezzi. L'erogazione può essere svolta dal socio in affari stesso, da terzi incaricati o dall'Organizzazione; l'obbligo è comunicato per via contrattuale. Le evidenze sono conservate."},{"k":"p","t":"2.5 Comunicazione"},{"k":"p","t":"Il piano di comunicazione (MOD-06.03) determina su cosa comunicare, quando, con chi, come, chi comunica e in quali lingue."},{"k":"p","t":"La politica è messa a disposizione nelle lingue appropriate a tutto il personale e ai soci in affari, comunicata direttamente al personale e ai soci in affari che pongono un rischio superiore al livello basso, e pubblicata attraverso i canali interni ed esterni."},{"k":"p","t":"2.6 Informazioni documentate"},{"k":"p","t":"Il sistema comprende le informazioni documentate richieste dalla norma e quelle ritenute necessarie per la sua efficacia. Nella creazione e nell'aggiornamento sono assicurati identificazione e descrizione, formato e supporto, riesame e approvazione."},{"k":"p","t":"Le informazioni documentate sono controllate quanto a disponibilità e idoneità all'uso e a protezione da perdita di riservatezza, uso improprio o perdita di integrità, con presidio di distribuzione e accesso, archiviazione e conservazione, controllo delle versioni, memorizzazione ed eliminazione. Quelle di origine esterna necessarie al sistema sono identificate e controllate."},{"k":"p","t":"2.7 Riservatezza dei documenti sensibili"},{"k":"p","t":"Segnalazioni, rapporti di indagine e dichiarazioni di conflitto sono conservati con accesso limitato ai soli soggetti autorizzati, separatamente dai fascicoli ordinari del personale."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Personale formato nei termini previsti dal piano","MOD-06.02","Semestrale","100%"],["Posizioni ad alto rischio con formazione dettagliata","MOD-06.02","Annuale","100%"],["Soci in affari individuati con formazione erogata e documentata","MOD-06.02","Annuale","≥ 90%"],["Verifica di apprendimento superata","MOD-06.02","Annuale","≥ 90%"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-06.01","Piano di formazione e sensibilizzazione","Destinatari, contenuti, modalità, periodicità per livello di rischio"],["MOD-06.02","Registro della formazione","Sessioni erogate a personale e soci in affari, verifica di apprendimento"],["MOD-06.03","Piano di comunicazione","Oggetto, tempi, destinatari, mezzi, responsabili, lingue"],["MOD-06.04","Elenco delle informazioni documentate","Documento, origine, responsabile, conservazione, riservatezza"]]}]},"PAC-07":{"code":"PAC-07","titolo":"DUE DILIGENCE SU TRANSAZIONI, PROGETTI, SOCI IN AFFARI E PERSONALE","fase":"8 · Attività operative","rif":"UNI ISO 37001 punti 8.1, 8.2 e 3.29","blocks":[{"k":"t","r":[["PROCEDURA PAC-07","","",""],["Codice:","PAC-07","Revisione:","[Rev.]"],["Titolo:","DUE DILIGENCE SU TRANSAZIONI, PROGETTI, SOCI IN AFFARI E PERSONALE","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","UNI ISO 37001 punti 8.1, 8.2 e 3.29","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il processo con cui l'Organizzazione approfondisce natura ed entità del rischio di corruzione relativo a transazioni, progetti, attività, soci in affari e posizioni del personale per cui la valutazione del rischio abbia rilevato un rischio superiore al livello basso."},{"k":"p","t":"La due diligence non è un adempimento documentale: è un controllo aggiuntivo e mirato, il cui esito informa la decisione di procedere, rinviare, modificare o interrompere."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 8.1, 8.2 e appendice A (punti A.10, A.8)"},{"k":"p","t":"PAC-01 Valutazione del rischio, PAC-09 Impegni e controlli dei soci in affari, PAC-11 Inadeguatezza dei controlli"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Ambito di applicazione"},{"k":"p","t":"La due diligence si applica dove la valutazione del rischio ha rilevato un rischio superiore al livello basso in relazione a: categorie di transazioni, progetti o attività; rapporti in essere o in previsione con categorie di soci in affari; categorie di personale in determinate posizioni."},{"k":"p","t":"Dove il rischio non è superiore al livello basso, la due diligence non è richiesta; la determinazione è però motivata e registrata, non presunta."},{"k":"p","t":"2.2 Livelli di approfondimento"},{"k":"t","r":[["Livello","Quando si applica","Contenuto minimo"],["1 · semplificato","Rischio superiore al basso ma contenuto","Questionario, verifica di esistenza e legittimità, ricerca in fonti aperte"],["2 · standard","Rischio medio-alto","Livello 1, più titolarità effettiva, verifica in liste di esclusione e fonti giudiziarie, riferimenti"],["3 · approfondito","Rischio alto o critico, intermediari e agenti","Livello 2, più verifica documentale estesa, incarico a soggetto specializzato, colloquio, riesame annuale"]]},{"k":"p","t":"2.3 Fattori esaminati per progetti e transazioni"},{"k":"p","t":"Struttura, natura e complessità dell'operazione, incluse le modalità di vendita diretta o indiretta e il livello di sconto; accordi su finanziamenti e pagamenti; grado di coinvolgimento e risorse dell'Organizzazione; livello di controllo e di visibilità; soci in affari e parti terze coinvolte, compresi i pubblici ufficiali; legami tra tali soggetti e pubblici ufficiali; competenza e qualifiche delle parti; reputazione del cliente; ubicazione; notizie di mercato e di stampa."},{"k":"p","t":"2.4 Fattori esaminati per i soci in affari"},{"k":"p","t":"legittimità del soggetto: iscrizione al registro delle imprese, bilanci depositati, partita IVA, eventuale quotazione;"},{"k":"p","t":"qualifiche, esperienza e risorse effettive per svolgere l'attività per cui è incaricato;"},{"k":"p","t":"esistenza e ampiezza di un proprio sistema di gestione o di controlli anticorruzione;"},{"k":"p","t":"precedenti: coinvolgimento in atti di corruzione, frodi o condotte scorrette, indagini, condanne, sanzioni, esclusioni da procedure;"},{"k":"p","t":"identità degli azionisti e dei titolari effettivi e dell'alta direzione, con verifica degli stessi elementi e dei legami diretti o indiretti con clienti, acquirenti o pubblici ufficiali;"},{"k":"p","t":"struttura degli accordi sulle transazioni e sui pagamenti, con attenzione a giurisdizioni di comodo, pagamenti a soggetti terzi e provvigioni a successo."},{"k":"p","t":"2.5 Gradazione secondo la natura del rapporto"},{"k":"p","t":"Il rischio è maggiore quando il socio in affari agisce per conto o a vantaggio dell'Organizzazione rispetto a quando le fornisce beni o servizi. Un agente incaricato di procurare una commessa può esporre l'Organizzazione alla responsabilità per il proprio atto di corruzione; un fornitore di materiali che non interagisce né con i clienti né con i pubblici ufficiali rilevanti è nella condizione opposta."},{"k":"p","t":"La coerenza è un requisito: a parità di livello di rischio corrisponde un livello di due diligence equivalente."},{"k":"p","t":"2.6 Limiti dell'influenza"},{"k":"p","t":"Dove l'Organizzazione non ha influenza sufficiente per ottenere informazioni — tipicamente verso clienti o acquirenti principali — la circostanza è registrata e valutata come fattore nella determinazione del rischio, anziché essere trattata come esito negativo della verifica."},{"k":"p","t":"2.7 Interpretazione degli esiti"},{"k":"p","t":"L'assenza di informazioni negative non dimostra l'assenza di rischio; la presenza di informazioni negative non dimostra l'esistenza di rischio. Gli esiti sono valutati e si conclude con un giudizio motivato sui fatti disponibili (MOD-07.02), che indica: livello di rischio determinato, controlli richiesti, condizioni poste, decisione di procedere o meno."},{"k":"p","t":"Dove emergono informazioni sfavorevoli sono richiesti chiarimenti al socio in affari prima della decisione."},{"k":"p","t":"2.8 Aggiornamento"},{"k":"p","t":"La due diligence è aggiornata a cadenze predefinite in ragione del livello di rischio — dodici mesi per il livello 3, ventiquattro per il livello 2, trentasei per il livello 1 — e comunque a fronte di variazioni della compagine, dell'attività, del contesto o di notizie rilevanti."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Soci in affari a rischio superiore al basso con due diligence valida","MOD-07.03","Trimestrale","100%"],["Transazioni sopra soglia con due diligence svolta prima della firma","MOD-07.04","Trimestrale","100%"],["Due diligence concluse con esito condizionato o negativo","MOD-07.03","Semestrale","Monitoraggio"],["Tempo medio di conclusione della due diligence","MOD-07.03","Semestrale","≤ 20 giorni"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-07.01","Questionario di due diligence per il socio in affari","Legittimità, compagine, titolarità effettiva, precedenti, controlli, legami"],["MOD-07.02","Rapporto di due diligence","Verifiche svolte, fonti, esiti, giudizio motivato, condizioni poste"],["MOD-07.03","Registro delle due diligence","Soggetto, livello, data, esito, validità, riesame"],["MOD-07.04","Scheda di due diligence su transazione o progetto","Struttura dell'operazione, parti coinvolte, pagamenti, esito"]]}]},"PAC-08":{"code":"PAC-08","titolo":"CONTROLLI FINANZIARI E NON FINANZIARI","fase":"8 · Attività operative","rif":"UNI ISO 37001 punti 8.1, 8.3, 8.4","blocks":[{"k":"t","r":[["PROCEDURA PAC-08","","",""],["Codice:","PAC-08","Revisione:","[Rev.]"],["Titolo:","CONTROLLI FINANZIARI E NON FINANZIARI","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","UNI ISO 37001 punti 8.1, 8.3, 8.4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce i controlli finanziari e non finanziari attuati per gestire il rischio di corruzione nelle transazioni e nei processi dell'Organizzazione."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 8.1, 8.3, 8.4 e appendice A (punti A.11, A.12)"},{"k":"p","t":"D.Lgs. 231/2001 quanto alla tracciabilità dei flussi finanziari"},{"k":"p","t":"PAC-01 Valutazione del rischio, PAC-12 Audit interno"},{"k":"p","t":"2. MODALITÀ OPERATIVE"},{"k":"p","t":"2.1 Impostazione"},{"k":"p","t":"I controlli sono progettati sugli scenari della valutazione del rischio: non esiste un elenco valido per tutte le organizzazioni. Il criterio è che ogni scenario a rischio superiore al livello basso trovi almeno un controllo che ne riduca l'occorrenza o ne aumenti la probabilità di rilevamento."},{"k":"p","t":"Le matrici MOD-08.01 e MOD-08.02 associano a ciascuno scenario il controllo, la funzione che lo esegue, l'evidenza prodotta e la periodicità della verifica di applicazione."},{"k":"p","t":"2.2 Controlli finanziari"},{"k":"t","r":[["#","Controllo","Presidio"],["1","Separazione dei compiti tra chi avvia e chi approva un pagamento","Configurazione del gestionale"],["2","Livelli gerarchici di autorizzazione crescenti per importo","Tabella poteri di spesa (MOD-03.03)"],["3","Verifica che il beneficiario e la prestazione siano stati approvati","Ciclo passivo"],["4","Doppia firma sulle approvazioni di pagamento oltre soglia","Mandato bancario"],["5","Documentazione di supporto allegata a ogni approvazione","Fascicolo contabile"],["6","Limitazione dell'uso del contante e controllo della piccola cassa","Regolamento di cassa"],["7","Classificazioni e descrizioni dei pagamenti accurate e chiare","Piano dei conti"],["8","Riesame direzionale periodico delle transazioni significative","Verbale di riesame"],["9","Audit finanziari indipendenti e rotazione del soggetto incaricato","Programma di audit"]]},{"k":"p","t":"2.3 Controlli non finanziari"},{"k":"t","r":[["#","Controllo","Presidio"],["1","Utilizzo di fornitori, appaltatori e consulenti pre-qualificati","Albo e due diligence (PAC-07)"],["2","Verifica di necessità, legittimità ed effettiva esecuzione dei servizi resi","Attestazione di conformità"],["3","Verifica di proporzionalità del corrispettivo rispetto al servizio reso","Analisi comparativa"],["4","Gara con almeno tre offerenti dove possibile e ragionevole","Fascicolo di gara"],["5","Valutazione delle offerte e approvazione dell'aggiudicazione da parte di almeno due persone","Verbale di aggiudicazione"],["6","Separazione tra chi richiede, chi approva e chi gestisce il contratto","Matrice delle incompatibilità"],["7","Doppia firma su contratti, varianti e attestazioni di lavoro svolto","Contratto"],["8","Supervisione rafforzata sulle transazioni a rischio potenzialmente alto","Riesame direzionale"],["9","Protezione dell'integrità delle offerte e delle informazioni sui prezzi","Controllo degli accessi"],["10","Strumenti operativi a supporto del personale: liste di controllo, moduli, flussi autorizzativi","MOD-08.02"]]},{"k":"p","t":"2.4 Attenzione alle provvigioni e agli intermediari"},{"k":"p","t":"Il pagamento di commissioni o provvigioni a intermediari è oggetto di verifica specifica di proporzionalità rispetto al servizio effettivamente reso, considerando il rischio assunto dall'intermediario. Una provvigione sproporzionata è il veicolo tipico attraverso cui una parte del corrispettivo viene destinata a fini illeciti. Può essere richiesta documentazione comprovante l'esecuzione delle attività."},{"k":"p","t":"2.5 Processi e forniture esterne"},{"k":"p","t":"È assicurato il controllo dei processi, prodotti e servizi forniti esternamente che sono rilevanti per il sistema. Il fornitore resta al di fuori del campo di applicazione, ma il processo esternalizzato vi rientra."},{"k":"p","t":"2.6 Deroghe"},{"k":"p","t":"Le deroghe ai controlli sono ammesse solo se autorizzate per iscritto dal livello competente, motivate e a termine, e sono registrate nel MOD-08.03. Non sono derogabili la separazione dei compiti sui pagamenti e la doppia firma sopra soglia."},{"k":"p","t":"3. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Scenari a rischio superiore al basso coperti da almeno un controllo","MOD-08.01/02","Semestrale","100%"],["Controlli verificati nel periodo rispetto ai programmati","MOD-08.01/02","Semestrale","≥ 90%"],["Deroghe attive oltre il termine autorizzato","MOD-08.03","Trimestrale","0"],["Pagamenti eseguiti in assenza di documentazione di supporto","Audit","Semestrale","0"]]},{"k":"p","t":"4. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-08.01","Matrice dei controlli finanziari","Scenario, controllo, funzione, evidenza, periodicità, esito della verifica"],["MOD-08.02","Matrice dei controlli non finanziari","Scenario, controllo, funzione, evidenza, periodicità, esito della verifica"],["MOD-08.03","Registro delle deroghe ai controlli","Controllo derogato, motivazione, autorizzazione, termine, chiusura"]]}]},"PAC-09":{"code":"PAC-09","titolo":"SOCI IN AFFARI E ORGANIZZAZIONI CONTROLLATE: CONTROLLI E IMPEGNI","fase":"8 · Attività operative","rif":"UNI ISO 37001 punti 8.5, 8.6","blocks":[{"k":"t","r":[["PROCEDURA PAC-09","","",""],["Codice:","PAC-09","Revisione:","[Rev.]"],["Titolo:","SOCI IN AFFARI E ORGANIZZAZIONI CONTROLLATE: CONTROLLI E IMPEGNI","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","UNI ISO 37001 punti 8.5, 8.6","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure con cui l'Organizzazione ottiene che le organizzazioni su cui detiene il controllo e i soci in affari a rischio superiore al livello basso attuino controlli anticorruzione e assumano impegni in materia."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 8.5.1, 8.5.2, 8.6 e appendice A (punti A.13, A.14)"},{"k":"p","t":"PAC-07 Due diligence, PAC-11 Inadeguatezza dei controlli"},{"k":"p","t":"2. DEFINIZIONE DI CONTROLLO"},{"k":"p","t":"Si detiene il controllo su un'altra organizzazione quando se ne controllano, direttamente o indirettamente, gli organi dirigenziali — per esempio tramite maggioranza dei voti in consiglio o maggioranza delle azioni. L'impiego di una quantità rilevante di lavoro presso un'altra organizzazione non costituisce controllo."},{"k":"p","t":"3. MODALITÀ OPERATIVE"},{"k":"p","t":"3.1 Organizzazioni controllate"},{"k":"p","t":"Alle organizzazioni controllate è richiesto di applicare il sistema di gestione dell'Organizzazione oppure propri controlli anticorruzione, nella misura ragionevole e proporzionata ai rischi cui esse sono sottoposte, tenendo conto della valutazione del rischio."},{"k":"p","t":"Il piano di adeguamento (MOD-09.04) registra per ciascuna controllata: soluzione adottata, controlli richiesti, termini, stato di attuazione, verifica."},{"k":"p","t":"3.2 Soci in affari non controllati: quando la misura non è richiesta"},{"k":"p","t":"Nessuna misura è richiesta quando il socio in affari non pone rischio o pone un rischio non superiore al livello basso, oppure quando pone un rischio superiore al basso ma i controlli che potrebbe applicare non contribuirebbero a limitarlo. In quest'ultimo caso la circostanza è considerata nella valutazione del rischio a supporto della decisione se e come proseguire il rapporto."},{"k":"p","t":"3.3 Soci in affari non controllati: sequenza operativa"},{"k":"t","r":[["Passo","Azione","Esito"],["1","Verificare se il socio in affari attui controlli adeguati sul rischio in questione, dopo la due diligence","Se sì, il requisito è soddisfatto"],["2","Se non li attua o non è possibile verificarlo, e se è fattibile, pretenderne l'attuazione in riferimento alla transazione","Controlli richiesti e verificati"],["3","Se non è fattibile pretenderli, considerare il fatto nella valutazione del rischio e nella gestione dei relativi controlli","Rischio rivalutato"],["4","Se il rischio resta inaccettabile e non riducibile altrimenti","Si applica la PAC-11 (inadeguatezza dei controlli)"]]},{"k":"p","t":"La verifica riguarda i controlli pertinenti alla transazione tra le parti; non è richiesto di verificare che il socio in affari presidi l'insieme dei propri rischi."},{"k":"p","t":"3.4 Fattibilità della richiesta"},{"k":"p","t":"La richiesta è normalmente fattibile quando l'Organizzazione ha influenza significativa: agenti nominati per agire per suo conto, subappaltatori con ampio campo di lavoro. Normalmente non lo è verso clienti, fornitori imposti dal cliente, fornitori con potere contrattuale nettamente superiore, o quando il socio in affari non dispone di risorse o competenze per attuarli."},{"k":"p","t":"La non fattibilità è registrata con la motivazione, non presunta."},{"k":"p","t":"3.5 Graduazione dei controlli richiesti"},{"k":"t","r":[["Profilo del socio in affari","Controlli tipicamente richiesti"],["Alto rischio, campo di lavoro ampio e complesso","Controlli equivalenti a quelli del presente sistema per i rischi che pone"],["Rischio medio, dimensioni intermedie","Politica anticorruzione, formazione degli addetti coinvolti, referente per la conformità sulla transazione, controlli sui pagamenti chiave, canale di segnalazione"],["Rischio contenuto, campo di lavoro specifico","Formazione degli addetti interessati e controlli su pagamenti, regali e ospitalità"]]},{"k":"p","t":"3.6 Impegni per la prevenzione della corruzione"},{"k":"p","t":"Verso i soci in affari a rischio superiore al livello basso sono ottenuti, per quanto fattibile e preferibilmente in forma scritta:"},{"k":"p","t":"l'impegno del socio in affari a prevenire atti di corruzione da parte sua, per suo conto o a suo vantaggio, in relazione alla transazione, al progetto, all'attività o alla relazione;"},{"k":"p","t":"la facoltà dell'Organizzazione di cessare il rapporto in caso di atti di corruzione commessi dal socio in affari, per suo conto o a suo vantaggio."},{"k":"p","t":"Gli impegni sono raccolti mediante clausola contrattuale o documento separato (MOD-09.01). Dove non sia fattibile ottenerli, la circostanza è valutata come fattore nella determinazione del rischio."},{"k":"p","t":"3.7 Tempi di adeguamento e verifica"},{"k":"p","t":"Poiché l'attuazione dei controlli richiede tempo, può essere concesso un termine ragionevole. Nel frattempo l'assenza dei controlli pesa nella valutazione del rischio. È valutata l'introduzione del diritto di risolvere il contratto in caso di mancata attuazione tempestiva."},{"k":"p","t":"Non è richiesto di verificare la conformità integrale del socio in affari, ma di adottare misure ragionevoli per accertarne l'osservanza: richiesta di copia dei documenti, dichiarazioni periodiche e, per i rischi elevati, monitoraggio, obblighi informativi o audit."},{"k":"p","t":"4. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Soci in affari a rischio superiore al basso con impegni acquisiti","MOD-09.02","Trimestrale","100% dei casi fattibili"],["Soci in affari con controlli verificati","MOD-09.03","Semestrale","≥ 90%"],["Organizzazioni controllate adeguate","MOD-09.04","Annuale","100%"],["Casi di non fattibilità registrati e motivati","MOD-09.02","Semestrale","100%"]]},{"k":"p","t":"5. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-09.01","Clausole anticorruzione e impegno del socio in affari","Articolato tipo e modulo di impegno sottoscritto"],["MOD-09.02","Registro dei soci in affari e degli impegni","Categoria, rischio, due diligence, impegni, clausole, formazione, riesame"],["MOD-09.03","Verifica dei controlli del socio in affari","Controlli richiesti, evidenze acquisite, esito, azioni"],["MOD-09.04","Piano di adeguamento delle organizzazioni controllate","Controllata, soluzione, controlli, termini, stato"]]}]},"PAC-10":{"code":"PAC-10","titolo":"REGALI, OSPITALITÀ, DONAZIONI E BENEFICI SIMILI","fase":"8 · Attività operative","rif":"UNI ISO 37001 punto 8.7","blocks":[{"k":"t","r":[["PROCEDURA PAC-10","","",""],["Codice:","PAC-10","Revisione:","[Rev.]"],["Titolo:","REGALI, OSPITALITÀ, DONAZIONI E BENEFICI SIMILI","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","UNI ISO 37001 punto 8.7","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le regole per prevenire che l'offerta, la fornitura o l'accettazione di regali, ospitalità, donazioni e benefici simili costituisca un atto di corruzione o possa ragionevolmente essere percepita come tale."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punto 8.7 e appendice A (punto A.15)"},{"k":"p","t":"Normativa applicabile ai rapporti con pubblici ufficiali e dipendenti pubblici"},{"k":"p","t":"PAC-08 Controlli, PAC-11 Segnalazioni"},{"k":"p","t":"2. AMBITO"},{"k":"p","t":"Rientrano nella presente procedura: regali, intrattenimento e ospitalità; donazioni a enti politici o benefici; viaggi per rappresentanti del cliente o pubblici ufficiali; spese promozionali; sponsorizzazioni; benefici per la comunità; formazione offerta a terzi; iscrizioni a circoli privati; favori personali; comunicazione di informazioni riservate o privilegiate."},{"k":"p","t":"La percezione di un terzo — un concorrente, la stampa, un'autorità — è il criterio di valutazione, indipendentemente dall'intenzione di chi offre e di chi riceve."},{"k":"p","t":"3. MODALITÀ OPERATIVE"},{"k":"p","t":"3.1 Divieti assoluti"},{"k":"p","t":"Sono vietati in ogni caso: qualsiasi beneficio offerto durante o in prossimità di una trattativa, di una gara o di un procedimento autorizzativo; denaro o equivalenti; il pagamento di vacanze o spese per svago; il pagamento di spese a familiari o amici del beneficiario; i benefici a soggetti in grado di aggiudicare appalti o approvare permessi, certificati o pagamenti, salvo quanto espressamente consentito e autorizzato."},{"k":"p","t":"3.2 Soglie e regole"},{"k":"p","t":"Le soglie sono fissate nel MOD-10.03 e riesaminate annualmente, tenendo conto di: valore massimo per singolo atto e cumulato annuo per beneficiario; frequenza, poiché atti di modesto valore ripetuti formano complessivamente un valore rilevante; tempistica; ragionevolezza rispetto a luogo, settore e posizione dei soggetti; identità del beneficiario; reciprocità; vincoli giuridici del contesto e dell'organizzazione di appartenenza del beneficiario."},{"k":"p","t":"3.3 Autorizzazione preventiva"},{"k":"p","t":"Al di sopra della soglia stabilita, o in caso di beneficiario che sia pubblico ufficiale, è richiesta autorizzazione preventiva del dirigente competente e, per gli importi maggiori, parere della funzione per la prevenzione della corruzione (MOD-10.01)."},{"k":"p","t":"3.4 Registrazione"},{"k":"p","t":"Ogni beneficio offerto o ricevuto al di sopra della soglia è registrato nel MOD-10.02 con data, tipologia, valore, controparte, qualifica del beneficiario, occasione, autorizzazione, esito. Il registro è oggetto di supervisione periodica e di campionamento in sede di audit interno."},{"k":"p","t":"3.5 Donazioni, sponsorizzazioni e benefici per la comunità"},{"k":"p","t":"Sono vietati i pagamenti volti a influenzare, o ragionevolmente percepibili come volti a influenzare, una gara o altra decisione a favore dell'Organizzazione. Per ciascuna erogazione: è svolta la due diligence sul beneficiario per accertarne la legittimità e l'assenza di collegamenti con progetti, clienti o pubblici ufficiali rilevanti; è richiesta l'approvazione del dirigente competente; è verificata la liceità secondo la normativa applicabile; è valutata la divulgazione pubblica; è evitata l'erogazione in prossimità di trattative contrattuali."},{"k":"p","t":"3.6 Viaggi e ospitalità di rappresentanti del cliente o pubblici ufficiali"},{"k":"p","t":"Sono ammessi solo i pagamenti consentiti dalle procedure dell'ente di appartenenza e dalla normativa vigente, per viaggi necessari al corretto svolgimento dei compiti del soggetto, previa approvazione di un dirigente competente e, ove possibile, previa informazione del superiore o del datore di lavoro del soggetto. Sono limitati a viaggio, alloggio e pasti indispensabili, direttamente collegati a un itinerario ragionevole; l'intrattenimento associato è contenuto entro i limiti della presente procedura."},{"k":"p","t":"4. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Benefici sopra soglia registrati con autorizzazione preventiva","MOD-10.02","Trimestrale","100%"],["Valore cumulato per beneficiario oltre il limite annuo","MOD-10.02","Semestrale","0"],["Donazioni ed erogazioni con due diligence sul beneficiario","MOD-10.02","Semestrale","100%"],["Casi rilevati in sede di audit non presenti a registro","MOD-12.02","Annuale","0"]]},{"k":"p","t":"5. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-10.01","Richiesta di autorizzazione preventiva","Tipologia, valore, beneficiario, occasione, valutazione, esito"],["MOD-10.02","Registro di regali, ospitalità, donazioni e benefici","Registrazione di quanto offerto e ricevuto, con autorizzazioni"],["MOD-10.03","Soglie e limiti","Valori per tipologia, cumulo annuo, casi vietati, riesame"]]}]},"PAC-11":{"code":"PAC-11","titolo":"SEGNALAZIONI, INDAGINI E GESTIONE DELLA CORRUZIONE","fase":"8 · Attività operative","rif":"UNI ISO 37001 punti 8.8, 8.9, 8.10","blocks":[{"k":"t","r":[["PROCEDURA PAC-11","","",""],["Codice:","PAC-11","Revisione:","[Rev.]"],["Titolo:","SEGNALAZIONI, INDAGINI E GESTIONE DELLA CORRUZIONE","",""],["Punti norma:","8 · Attività operative","",""],["Riferimenti:","UNI ISO 37001 punti 8.8, 8.9, 8.10","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il canale di segnalazione dei sospetti e la sua tutela, la conduzione delle indagini, le azioni conseguenti e la gestione dei casi in cui i controlli risultino inadeguati a fronteggiare il rischio."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 8.8, 8.9, 8.10 e appendice A (punti A.2.2, A.18)"},{"k":"p","t":"D.Lgs. 24/2023 sulla protezione delle persone che segnalano violazioni"},{"k":"p","t":"D.Lgs. 231/2001 quanto ai flussi verso l'organismo di vigilanza"},{"k":"p","t":"PAC-03 Funzione per la prevenzione della corruzione, PAC-12 Miglioramento"},{"k":"p","t":"2. SEGNALAZIONE DI SOSPETTI"},{"k":"p","t":"2.1 Requisiti del canale"},{"k":"p","t":"Il canale consente di segnalare in buona fede o sulla base di una ragionevole convinzione atti di corruzione tentati, presunti o effettivi, nonché violazioni o carenze del sistema. Le segnalazioni pervengono alla funzione per la prevenzione della corruzione o al personale preposto, direttamente o tramite una parte terza."},{"k":"p","t":"Il trattamento è confidenziale e protegge l'identità del segnalante e degli altri soggetti coinvolti o menzionati, salvo quanto necessario per procedere a un'indagine. È ammessa la segnalazione anonima."},{"k":"p","t":"Dove la normativa locale vieti la riservatezza o l'anonimato, l'impossibilità di conformarsi è documentata."},{"k":"p","t":"2.2 Divieto di ritorsione"},{"k":"p","t":"Sono vietate le ritorsioni verso chi segnala in buona fede o si rifiuta di prendere parte ad attività a rischio non limitato. Il divieto copre minacce, isolamento, demansionamento, mancata promozione, trasferimento, licenziamento, molestie e ogni altra forma di pregiudizio."},{"k":"p","t":"La condizione del segnalante è monitorata per almeno dodici mesi dalla segnalazione."},{"k":"p","t":"2.3 Consulenza"},{"k":"p","t":"Il personale può ricevere consulenza da un soggetto appropriato su come comportarsi di fronte a un sospetto o a una situazione che possa comprendere atti di corruzione, prima e indipendentemente da una segnalazione formale."},{"k":"p","t":"2.4 Conoscibilità"},{"k":"p","t":"Tutto il personale è informato delle procedure di segnalazione, è messo in condizione di utilizzarle ed è consapevole dei diritti e delle tutele che ne derivano. La verifica di questa consapevolezza è parte della PAC-06."},{"k":"p","t":"3. PAGAMENTI AGEVOLATIVI ED ESTORTI"},{"k":"p","t":"3.1 Trattamento"},{"k":"p","t":"I pagamenti agevolativi sono vietati e trattati come atti di corruzione. Al personale che ne riceva richiesta è prescritto di chiedere prova della legittimità del pagamento e ricevuta ufficiale e, in assenza di prova soddisfacente, di rifiutare."},{"k":"p","t":"Il pagamento estorto sotto minaccia effettiva o percepita alla salute, alla sicurezza o alla libertà propria o altrui non rientra nell'ambito della norma: la sicurezza della persona prevale. Chi si trovi in tale situazione può effettuare il pagamento."},{"k":"p","t":"3.2 Adempimenti successivi"},{"k":"p","t":"In entrambi i casi il personale redige verbale dell'accaduto (MOD-11.04) e lo riferisce a un dirigente appropriato o alla funzione per la prevenzione della corruzione. L'Organizzazione nomina un dirigente competente e indipendente perché accerti l'accaduto, registra correttamente il pagamento in contabilità e, ove previsto dalla legge o opportuno, lo segnala alle autorità."},{"k":"p","t":"4. INDAGINI"},{"k":"p","t":"4.1 Avvio"},{"k":"p","t":"L'alta direzione o la funzione per la prevenzione della corruzione valuta i fatti noti e la potenziale gravità della questione. Se i fatti disponibili non sono sufficienti a decidere, è avviata un'indagine."},{"k":"p","t":"4.2 Conduzione"},{"k":"p","t":"L'indagine è condotta da una persona estranea alla questione e non appartenente al ruolo o alla funzione oggetto di indagine — la funzione per la prevenzione della corruzione, l'auditor interno, altro dirigente competente o una parte terza — dotata di autorità, risorse e accesso adeguati e, preferibilmente, di formazione o esperienza nella conduzione di indagini."},{"k":"p","t":"Sono accertati tempestivamente i fatti e raccolte le prove: audizioni, documenti, testimonianze, con verbalizzazione scritta e sottoscritta dove possibile e ragionevole."},{"k":"p","t":"4.3 Fattori da ponderare"},{"k":"p","t":"Leggi applicabili e opportunità di consulenza legale; sicurezza del personale; rischio di diffamazione; tutela del segnalante e dei soggetti menzionati; potenziali responsabilità penali, civili e amministrative, perdite finanziarie e danno reputazionale; obblighi o interesse a segnalare alle autorità; riservatezza fino all'accertamento dei fatti; necessità di piena collaborazione del personale coinvolto."},{"k":"p","t":"4.4 Esiti e azioni conseguenti"},{"k":"p","t":"Gli esiti sono riferiti all'alta direzione e comunque alla funzione per la prevenzione della corruzione. Le azioni possibili comprendono: risoluzione, ritiro o modifica del coinvolgimento nel progetto, nella transazione o nel contratto; restituzione o richiesta di restituzione del beneficio improprio; provvedimenti disciplinari proporzionati, dal richiamo al licenziamento; denuncia alle autorità; azioni per prevenire o affrontare le violazioni giuridiche conseguenti, tra cui errori di bilancio, violazioni fiscali e riciclaggio."},{"k":"p","t":"4.5 Ritorno sul sistema"},{"k":"p","t":"Concluso il caso, le procedure sono riesaminate per stabilire se la questione sia derivata da un'inadeguatezza del sistema e, in tal caso, sono adottate misure immediate di miglioramento secondo la PAC-12."},{"k":"p","t":"5. INADEGUATEZZA DEI CONTROLLI"},{"k":"p","t":"Dove la due diligence su una transazione, un progetto, un'attività o un rapporto stabilisca che i rischi non possono essere affrontati dai controlli esistenti, e l'Organizzazione non possa o non voglia attuare controlli aggiuntivi né adottare altre misure idonee, come la modifica della natura dell'operazione:"},{"k":"p","t":"per rapporti e operazioni in essere, sono adottate misure adeguate per cessare, interrompere, sospendere o ritirarsi non appena possibile;"},{"k":"p","t":"per nuove proposte, il prosieguo è rinviato o declinato."},{"k":"p","t":"La decisione è deliberata dall'alta direzione su proposta della funzione per la prevenzione della corruzione ed è documentata con la motivazione e le misure adottate."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Segnalazioni ricevute per canale","MOD-11.02","Semestrale","Monitoraggio"],["Segnalazioni prese in carico entro 7 giorni","MOD-11.02","Trimestrale","100%"],["Indagini condotte da soggetto indipendente dalla funzione interessata","MOD-11.03","Annuale","100%"],["Casi di ritorsione accertati","MOD-11.02","Annuale","0"],["Casi conclusi con riesame delle procedure","MOD-11.05","Annuale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-11.01","Modulo di segnalazione","Canale, oggetto, riservatezza, anonimato, tutele"],["MOD-11.02","Registro delle segnalazioni","Ricezione, presa in carico, istruttoria, esito, tutela del segnalante"],["MOD-11.03","Rapporto di indagine","Incarico, indipendenza, attività svolte, prove, conclusioni"],["MOD-11.04","Verbale di pagamento agevolativo o estorto","Circostanze, soggetti, importo, accertamento, registrazione contabile"],["MOD-11.05","Provvedimento conseguente","Azioni adottate, provvedimenti disciplinari, riesame delle procedure"]]}]},"PAC-12":{"code":"PAC-12","titolo":"MONITORAGGIO, AUDIT INTERNO, RIESAMI E MIGLIORAMENTO","fase":"9-10 · Valutazione e miglioramento","rif":"UNI ISO 37001 punti 9.1 ÷ 9.4, 10.1, 10.2","blocks":[{"k":"t","r":[["PROCEDURA PAC-12","","",""],["Codice:","PAC-12","Revisione:","[Rev.]"],["Titolo:","MONITORAGGIO, AUDIT INTERNO, RIESAMI E MIGLIORAMENTO","",""],["Punti norma:","9-10 · Valutazione e miglioramento","",""],["Riferimenti:","UNI ISO 37001 punti 9.1 ÷ 9.4, 10.1, 10.2","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il monitoraggio delle prestazioni, il programma di audit interno, il riesame di direzione, il riesame della funzione per la prevenzione della corruzione e la gestione delle non conformità."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"UNI ISO 37001, punti 9.1, 9.2.1 ÷ 9.2.4, 9.3.1 ÷ 9.3.3, 9.4, 10.1, 10.2 e appendice A (punti A.16, A.19, A.20)"},{"k":"p","t":"UNI EN ISO 19011 per la conduzione degli audit"},{"k":"p","t":"Tutte le procedure PAC-01 ÷ PAC-11"},{"k":"p","t":"2. MONITORAGGIO"},{"k":"p","t":"Sono determinati oggetto e metodi del monitoraggio e della misurazione, i tempi di esecuzione e i tempi di analisi e valutazione dei risultati, con evidenze conservate."},{"k":"p","t":"Il monitoraggio comprende: efficacia della formazione; efficacia dei controlli, anche mediante prove a campione; efficacia della distribuzione delle responsabilità; efficacia nella risposta alle carenze già rilevate; casi in cui gli audit programmati non sono stati eseguiti; non conformità e quasi-eventi; casi di mancato rispetto dei requisiti; obiettivi non raggiunti; stato della cultura della conformità."},{"k":"p","t":"Sono possibili auto-valutazioni periodiche su tutta l'Organizzazione o su parti di essa."},{"k":"p","t":"3. AUDIT INTERNO"},{"k":"p","t":"3.1 Programma"},{"k":"p","t":"Il programma di audit (MOD-12.01) definisce frequenza, metodi, responsabilità, requisiti di pianificazione e rapporti, considerando l'importanza dei processi e gli esiti degli audit precedenti. Per ciascun audit sono definiti obiettivi, criteri e campo di applicazione."},{"k":"p","t":"Il campionamento è basato sul rischio: i progetti e i processi a elevato rischio di corruzione hanno precedenza su quelli a rischio basso."},{"k":"p","t":"3.2 Oggetto"},{"k":"p","t":"Gli audit sottopongono a verifica procedure, controlli e sistemi in relazione a: corruzione o presunta corruzione; violazioni della politica e del sistema; omessa osservanza da parte dei soci in affari dei requisiti applicabili; debolezze e possibilità di miglioramento."},{"k":"p","t":"Gli audit sono ragionevoli, proporzionati e commisurati al rischio."},{"k":"p","t":"3.3 Oggettività e imparzialità"},{"k":"p","t":"Gli audit sono condotti da una funzione o da un membro del personale indipendente e designato, dalla funzione per la prevenzione della corruzione salvo che l'audit riguardi il sistema stesso o attività di cui essa è responsabile, da personale di reparto o funzione diversa da quella auditata, da una parte terza appropriata, o da un gruppo composto da tali soggetti."},{"k":"p","t":"Nessun auditor verifica la propria sfera di lavoro."},{"k":"p","t":"3.4 Audit non annunciati"},{"k":"p","t":"Di norma gli audit sono programmati in anticipo. In casi motivati può essere svolto un audit non annunciato, quando l'effetto sorpresa è funzionale all'accertamento."},{"k":"p","t":"3.5 Comunicazione degli esiti"},{"k":"p","t":"I risultati sono riferiti ai dirigenti competenti, alla funzione per la prevenzione della corruzione, all'alta direzione e, quando opportuno, all'organo di governo. L'organo di governo può richiedere accesso a verbali e risultati e chiedere che gli audit su questioni a rischio più elevato gli siano riferiti a conclusione."},{"k":"p","t":"4. RIESAME DI DIREZIONE"},{"k":"p","t":"4.1 Elementi in ingresso"},{"k":"p","t":"Stato delle azioni derivanti dai riesami precedenti; modifiche del contesto esterno e interno; cambiamenti nelle esigenze e aspettative delle parti interessate; informazioni sulla prestazione del sistema con le relative tendenze in materia di non conformità e azioni correttive, monitoraggio e misurazione, esiti di audit, rapporti relativi alla corruzione, indagini, natura ed entità dei rischi affrontati; opportunità di miglioramento; efficacia delle azioni intraprese per affrontare i rischi."},{"k":"p","t":"4.2 Elementi in uscita"},{"k":"p","t":"Decisioni sulle opportunità di miglioramento e sulle esigenze di modifica del sistema, con evidenze conservate. Un compendio dei risultati è presentato all'organo di governo, che effettua a intervalli programmati la propria revisione dell'attuazione del sistema da parte dell'alta direzione."},{"k":"p","t":"5. RIESAME DELLA FUNZIONE PER LA PREVENZIONE DELLA CORRUZIONE"},{"k":"p","t":"La funzione valuta in modo continuativo se il sistema sia adeguato a gestire efficacemente i rischi cui l'Organizzazione è sottoposta e se sia attuato in modo efficace."},{"k":"p","t":"Riferisce a intervalli pianificati e in occasioni straordinarie all'organo di governo e all'alta direzione, o alla commissione competente, sull'adeguatezza e sull'attuazione del sistema, compresi i risultati delle indagini e degli audit (MOD-12.04)."},{"k":"p","t":"6. NON CONFORMITÀ E MIGLIORAMENTO"},{"k":"p","t":"A fronte di una non conformità sono intraprese azioni per tenerla sotto controllo e correggerla e per affrontarne le conseguenze; è valutata l'esigenza di eliminare le cause riesaminando la non conformità, determinandone le cause e verificando se ne esistano o possano verificarsi di simili altrove; sono attuate le azioni necessarie e ne è riesaminata l'efficacia; sono apportate le modifiche al sistema ove necessario."},{"k":"p","t":"Le azioni correttive sono appropriate agli effetti delle non conformità riscontrate. Sono conservate le evidenze della natura delle non conformità, delle azioni intraprese e dei relativi risultati."},{"k":"p","t":"6.1 Analisi delle cause"},{"k":"p","t":"L'analisi delle cause non si ferma all'errore individuale. È richiesto di verificare se la non conformità sia stata resa possibile o probabile da un controllo assente, da una delega inadeguata, da un incentivo mal costruito o da una prassi tollerata."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Audit eseguiti rispetto al programma","MOD-12.01","Semestrale","≥ 90%"],["Processi ad alto rischio auditati negli ultimi 24 mesi","MOD-12.01","Annuale","100%"],["Azioni correttive chiuse entro il termine","MOD-12.05","Trimestrale","≥ 85%"],["Azioni correttive con verifica di efficacia documentata","MOD-12.05","Semestrale","100%"],["Riesame di direzione e relazione all'organo di governo nei termini","MOD-12.03/04","Annuale","Nei termini"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-12.01","Programma di audit interno","Ambiti, criteri, auditor, indipendenza, periodo, stato"],["MOD-12.02","Rapporto di audit","Campo, evidenze esaminate, rilievi, conclusioni, destinatari"],["MOD-12.03","Verbale di riesame di direzione","Elementi in ingresso, valutazioni, decisioni, compendio all'organo di governo"],["MOD-12.04","Relazione della funzione all'organo di governo","Adeguatezza e attuazione del sistema, indagini, audit, criticità"],["MOD-12.05","Registro delle non conformità e delle azioni correttive","NC, cause, correzione, azione, verifica di efficacia"],["MOD-12.06","Cruscotto degli indicatori","Indicatori di processo ed esito con andamento pluriennale"]]}]}},"mod":{"MOD-01.01":{"code":"MOD-01.01","pro":"PAC-01","titolo":"Analisi del contesto e delle parti interessate","blo "k":"t","r":[["MODULO MOD-01.03","",""],["Codice:","MOD-01.03","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLA VALUTAZIONE DEL RISCHIO DI CORRUZIONE",""],["Procedura:","PAC-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Processo","Funzione","Scenario","Tipo (uscita/entrata)","Paese","Interazione con PU","Probabilità","Conseguenza","Rischio inerente","Controlli esistenti","Idoneità","Rischio residuo","Superiore al livello basso","Azione"]],"b":12},{"k":"sig"}]},"MOD-01.04":{"code":"MOD-01.04","pro":"PAC-01","titolo":"Criteri di valutazione del rischio","blocks":[{"k":"t","r":[["MODULO MOD-01.04","",""],["Codice:","MOD-01.04","Revisione: [Rev.]"],["Titolo:","CRITERI DI VALUTAZIONE DEL RISCHIO",""],["Procedura:","PAC-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"h","t":"SCALA DELLA PROBABILITÀ"},{"k":"t","r":[["Livello","Descrizione"],["1 · remota","Nessun precedente noto, controlli consolidati, contesto a bassa esposizione"],["2 · possibile","Circostanze che rendono lo scenario concepibile, controlli parziali"],["3 · probabile","Scenario ricorrente nel settore o nel contesto, controlli deboli"],["4 · attesa","Precedenti interni o richieste già ricevute, controlli assenti"]],"b":0},{"k":"h","t":"SCALA DELLA CONSEGUENZA"},{"k":"t","r":[["Livello","Descrizione"],["1 · lieve","Effetti circoscritti, nessuna rilevanza penale o reputazionale"],["2 · moderata","Sanzione amministrativa, contestazione contrattuale"],["3 · grave","Responsabilità penale individuale, esclusione da procedure, danno reputazionale"],["4 · molto grave","Responsabilità dell'ente, interdizione dall'attività, danno sistemico"]],"b":0},{"k":"h","t":"DETERMINAZIONE DEL LIVELLO"},{"k":"t","r":[["Punteggio (probabilità × conseguenza)","Livello","Soglia della norma"],["1 - 3","Basso","Non superiore al livello basso"],["4 - 7","Medio","Superiore al livello basso"],["8 - 11","Alto","Superiore al livello basso"],["12 - 16","Critico","Superiore al livello basso"]],"b":0},{"k":"h","t":"FATTORI DI ELEVAZIONE AUTOMATICA"},{"k":"p","t":"Indipendentemente dal punteggio, lo scenario o la posizione è classificata almeno di livello alto in presenza di: interazione diretta e discrezionale con pubblici ufficiali; ricorso ad agenti o intermediari remunerati a successo; operazione in paese a rischio elevato; precedenti di corruzione riferibili alla controparte; titolarità effettiva non ricostruibile."},{"k":"t","r":[["Voce","Compilazione"],["Approvato da",""],["Data",""],["Revisione",""]]},{"k":"sig"}]},"MOD-02.01":{"code":"MOD-02.01","pro":"PAC-02","titolo":"Politica per la prevenzione della corruzione","blocks":[{"k":"t","r":[["MODULO MOD-02.01","",""],["Codice:","MOD-02.01","Revisione: [Rev.]"],["Titolo:","POLITICA PER LA PREVENZIONE DELLA CORRUZIONE",""],["Procedura:","PAC-02","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Modello da adattare e approvare da parte dell'organo di governo o, in sua assenza, dell'alta direzione."},{"k":"h","t":"IMPEGNI"},{"k":"p","t":"[Nome Organizzazione] vieta la corruzione in ogni sua forma, attiva e passiva, diretta e indiretta, nel settore pubblico e in quello privato, in qualsiasi paese e in qualsiasi circostanza, senza eccezioni giustificate da consuetudini locali o da opportunità commerciali."},{"k":"p","t":"Il divieto comprende i pagamenti agevolativi, ossia i pagamenti di modesta entità effettuati per assicurarsi o velocizzare un atto dovuto: sono illeciti in molti ordinamenti e sono trattati come atti di corruzione dal presente sistema."},{"k":"p","t":"[Nome Organizzazione] richiede la conformità alle leggi anticorruzione applicabili e si impegna a soddisfare i requisiti applicabili al proprio sistema di gestione e a migliorarlo con continuità."},{"k":"p","t":"La presente politica costituisce il quadro di riferimento per la definizione degli obiettivi per la prevenzione della corruzione."},{"k":"p","t":"[Nome Organizzazione] incoraggia la segnalazione, in buona fede o sulla base di una ragionevole convinzione, di atti di corruzione tentati, presunti o effettivi e di ogni carenza del sistema, garantendo la riservatezza, ammettendo l'anonimato e vietando ogni ritorsione verso chi segnala o si rifiuta di prendere parte ad attività a rischio."},{"k":"p","t":"La funzione per la prevenzione della corruzione opera con autorità e indipendenza e ha accesso diretto all'organo di governo e all'alta direzione."},{"k":"p","t":"La violazione della presente politica comporta l'adozione di provvedimenti disciplinari proporzionati alla gravità, fino al licenziamento, e la risoluzione dei rapporti contrattuali con i soci in affari coinvolti, fatta salva ogni azione a tutela dell'Organizzazione."},{"k":"t","r":[["Voce","Compilazione"],["Campo di applicazione",""],["Data di approvazione",""],["Organo che ha approvato",""],["Modalità di comunicazione interna",""],["Modalità di comunicazione esterna",""],["Lingue disponibili",""],["Prossimo riesame",""]]},{"k":"sig"}]},"MOD-02.02":{"code":"MOD-02.02","pro":"PAC-02","titolo":"Verbale dell'organo di governo","blocks":[{"k":"t","r":[["MODULO MOD-02.02","",""],["Codice:","MOD-02.02","Revisione: [Rev.]"],["Titolo:","VERBALE DELL'ORGANO DI GOVERNO",""],["Procedura:","PAC-02","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Data e luogo",""],["Presenti",""],["Presiede",""],["Verbalizza",""],["Periodo di riferimento",""]]},{"k":"h","t":"INFORMAZIONI RICEVUTE"},{"k":"t","r":[["Elemento","Fonte","Sintesi","Valutazione"]],"b":6},{"k":"h","t":"DELIBERAZIONI"},{"k":"t","r":[["#","Oggetto","Deliberazione","Responsabile","Termine"]],"b":6},{"k":"p","t":"L'organo di governo dà atto di aver esercitato la sorveglianza sull'attuazione del sistema da parte dell'alta direzione e sull'adeguatezza delle risorse assegnate."},{"k":"sig"}]},"MOD-02.03":{"code":"MOD-02.03","pro":"PAC-02","titolo":"Indicatori della cultura anti-corruzione","blocks":[{"k":"t","r":[["MODULO MOD-02.03","",""],["Codice:","MOD-02.03","Revisione: [Rev.]"
