TÀ ANTICORRUZIONE",""],["Procedura:","PAC-05","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Da rendere a intervalli programmati dal personale in posizioni a rischio superiore al livello basso, dall'alta direzione e dall'organo di governo."},{"k":"t","r":[["Voce","Compilazione"],["Nominativo",""],["Funzione",""],["Periodo di riferimento",""],["Data",""]]},{"k":"p","t":"Il sottoscritto dichiara di conoscere la politica per la prevenzione della corruzione e il sistema di gestione di [Nome Organizzazione] e di averli osservati nel periodo di riferimento."},{"k":"p","t":"Dichiara di non aver offerto, promesso, dato, accettato o richiesto alcun vantaggio indebito, direttamente o per interposta persona, in relazione alle attività svolte."},{"k":"p","t":"Dichiara di aver segnalato ogni conflitto di interessi potenziale o effettivo e ogni sospetto di atto di corruzione di cui sia venuto a conoscenza."},{"k":"t","r":[["Eccezioni o precisazioni",""]],"b":3},{"k":"sig"}]},"MOD-05.03":{"code":"MOD-05.03","pro":"PAC-05","titolo":"Dichiarazione di conflitto di interessi","blocks":[{"k":"t","r":[["MODULO MOD-05.03","",""],["Codice:","MOD-05.03","Revisione: [Rev.]"],["Titolo:","DICHIARAZIONE DI CONFLITTO DI INTERESSI",""],["Procedura:","PAC-05","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Nominativo",""],["Funzione e ambito decisionale",""],["Data",""],["Tipo (iniziale / annuale / occasionale)",""]]},{"k":"t","r":[["Ambito","Situazione dichiarata","Soggetti coinvolti","Attuale o potenziale"],["Legami familiari o affettivi con controparti","","",""],["Interessi economici o finanziari in fornitori, clienti o concorrenti","","",""],["Cariche o incarichi in altre organizzazioni","","",""],["Rapporti con pubblici ufficiali","","",""],["Attività professionali esterne","","",""],["Altro","","",""]],"b":0},{"k":"p","t":"Il sottoscritto si impegna a comunicare senza ritardo ogni variazione e ad astenersi dalle decisioni interessate fino alla d :"p","t":"Art. 3 — Il Contraente dichiara di non aver corrisposto né promesso alcun vantaggio indebito per l'ottenimento del presente contratto e si impegna a non farlo per la sua esecuzione o rinnovo."},{"k":"p","t":"Art. 4 — Il Contraente attua e mantiene i controlli anticorruzione concordati e, su richiesta, ne fornisce evidenza a [Nome Organizzazione]."},{"k":"p","t":"Art. 5 — Il Contraente assicura che i propri addetti coinvolti ricevano formazione anticorruzione di contenuto non inferiore a quello indicato da [Nome Organizzazione] e rende noto ai medesimi il canale di segnalazione."},{"k":"p","t":"Art. 6 — Il Contraente comunica senza ritardo ogni indagine, procedimento o provvedimento in materia di corruzione che riguardi sé stesso, i propri titolari effettivi o la propria alta direzione, nonché ogni variazione della compagine e dei titolari effettivi."},{"k":"p","t":"Art. 7 — Il Contraente consente a [Nome Organizzazione], o a soggetti da essa incaricati, la verifica dell'osservanza degli obblighi assunti, con accesso alla documentazione pertinente."},{"k":"p","t":"Art. 8 — [Nome Organizzazione] ha facoltà di risolvere il presente contratto, con effetto immediato e senza oneri, in caso di atti di corruzione commessi dal Contraente, per suo conto o a suo vantaggio, in relazione alla presente transazione, al progetto, all'attività o alla relazione, nonché in caso di mancata attuazione dei controlli richiesti nei termini concordati."},{"k":"p","t":"Art. 9 — Il Contraente trasferisce gli obblighi di cui agli articoli precedenti ai propri subappaltatori e intermediari impiegati nell'esecuzione del presente contratto."},{"k":"h","t":"IMPEGNO SOTTOSCRITTO"},{"k":"t","r":[["Voce","Compilazione"],["Ragione sociale",""],["Legale rappresentante",""],["Contratto di riferimento",""],["Data",""]]},{"k":"sig"}]},"MOD-09.02":{"code":"MOD-09.02","pro":"PAC-09","titolo":"Registro dei soci in affari e degli impegni","blocks":[{"k":"t","r":[["MODULO MOD-09.02","",""],["Codice:" "PAC-07","PAC-08","PAC-09","PAC-10","PAC-11","PAC-12"],"ordMod":["MOD-01.01","MOD-01.02","MOD-01.03","MOD-01.04","MOD-02.01","MOD-02.02","MOD-02.03","MOD-03.01","MOD-03.02","MOD-03.03","MOD-04.01","MOD-04.02","MOD-04.03","MOD-05.01","MOD-05.02","MOD-05.03","MOD-05.04","MOD-05.05","MOD-06.01","MOD-06.02","MOD-06.03","MOD-06.04","MOD-07.01","MOD-07.02","MOD-07.03","MOD-07.04","MOD-08.01","MOD-08.02","MOD-08.03","MOD-09.01","MOD-09.02","MOD-09.03","MOD-09.04","MOD-10.01","MOD-10.02","MOD-10.03","MOD-11.01","MOD-11.02","MOD-11.03","MOD-11.04","MOD-11.05","MOD-12.01","MOD-12.02","MOD-12.03","MOD-12.04","MOD-12.05","MOD-12.06"],"capi":[{"id":"4","n":"Contesto","d":"Contesto, campo di applicazione e valutazione del rischio di corruzione."},{"id":"5","n":"Leadership","d":"Impegno degli organi, politica, cultura, ruoli e funzione per la prevenzione della corruzione."},{"id":"6","n":"Pianificazione","d":"Rischi e opportunità del sistema, obiettivi, pianificazione delle modifiche."},{"id":"7","n":"Supporto","d":"Risorse, competenza, assunzione, formazione, comunicazione, informazioni documentate."},{"id":"8","n":"Attività operative","d":"Due diligence, controlli, soci in affari, benefici, segnalazioni e indagini."},{"id":"9","n":"Valutazione","d":"Monitoraggio, audit interno, riesami di direzione e della funzione."},{"id":"10","n":"Miglioramento","d":"Non conformità, azioni correttive e miglioramento continuo."}],"req":[{"id":"4.1.01","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.1","pro":"PAC-01","t":"Sono determinati e documentati i fattori interni ed esterni rilevanti, compresi paesi e settori di operatività, modello di business, organizzazioni controllate e controllanti, tipologie di soci in affari e interazioni con pubblici ufficiali?"},{"id":"4.1.02","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.1","pro":"PAC-01","t":"È stato valutato e motivato se il cambiamento climatico costituisca un fattore rilevante?"},{"id":"4.2.03","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.2","pro":"PAC-01","t":"Sono individuate le parti interessate rilevanti, i loro requisiti e quali di essi si intende gestire attraverso il sistema?"},{"id":"4.3.04","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.3","pro":"PAC-01","t":"Il campo di applicazione è determinato considerando contesto, requisiti delle parti interessate ed esiti della valutazione del rischio, ed è disponibile come informazione documentata?"},{"id":"4.4.05","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.4","pro":"PAC-01","t":"Il sistema è stabilito, attuato, mantenuto e migliorato, con processi e interazioni definiti, ed è documentato?"},{"id":"4.4.06","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.4","pro":"PAC-08","t":"Le misure adottate sono proporzionate al rischio: né tanto onerose da bloccare l'attività, né tanto deboli da rendere agevole la corruzione?"},{"id":"4.5.07","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"La valutazione del rischio di corruzione è svolta a intervalli programmati e identifica i rischi ragionevolmente prevedibili in base ai fattori di contesto?"},{"id":"4.5.08","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"I rischi identificati sono analizzati, valutati e ordinati per priorità?"},{"id":"4.5.09","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"È valutata l'idoneità e l'efficacia dei controlli esistenti rispetto ai rischi stimati?"},{"id":"4.5.10","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"Sono stabiliti criteri per valutare il livello di rischio, coerenti con politica e obiettivi, e approvati?"},{"id":"4.5.11","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"La valutazione è riesaminata a intervalli programmati e in caso di cambiamento significativo della struttura o delle attività?"},{"id":"4.5.12","cap":"4","capn":"Contesto dell'organizzazione","rif":"4.5","pro":"PAC-01","t":"Sono conservate le informazioni documentate che dimostrano lo svolgimento della valutazione e il suo utilizzo per progettare o migliorare il sistema?"},{"id":"5.1.1.01","cap":"5","capn":"Leadership","rif":"5.1.1","pro":"PAC-02","t":"L'organo di governo, ove distinto, approva la politica e ne verifica l'allineamento con la strategia?"},{"id":"5.1.1.02","cap":"5","capn":"Leadership","rif":"5.1.1","pro":"PAC-02","t":"L'organo di governo riceve e riesamina a intervalli programmati le informazioni su contenuto e funzionamento del sistema?"},{"id":"5.1.1.03","cap":"5","capn":"Leadership","rif":"5.1.1","pro":"PAC-02","t":"L'organo di governo richiede l'assegnazione di risorse adeguate ed esercita sorveglianza ragionevole sull'attuazione da parte dell'alta direzione?"},{"id":"5.1.2.04","cap":"5","capn":"Leadership","rif":"5.1.2","pro":"PAC-02","t":"L'alta direzione assicura che politica e obiettivi siano stabiliti e integrati nei processi di business?"},{"id":"5.1.2.05","cap":"5","capn":"Leadership","rif":"5.1.2","pro":"PAC-02","t":"L'alta direzione comunica internamente ed esternamente la politica e l'importanza della conformità ai requisiti del sistema?"},{"id":"5.1.2.06","cap":"5","capn":"Leadership","rif":"5.1.2","pro":"PAC-02","t":"L'alta direzione incoraggia l'uso delle procedure di segnalazione e assicura l'assenza di ritorsioni verso chi segnala in buona fede o rifiuta di partecipare ad attività a rischio?"},{"id":"5.1.2.07","cap":"5","capn":"Leadership","rif":"5.1.2","pro":"PAC-02","t":"L'alta direzione relaziona a intervalli programmati all'organo di governo e riferisce ogni accusa di corruzione grave o sistematica?"},{"id":"5.1.3.08","cap":"5","capn":"Leadership","rif":"5.1.3","pro":"PAC-02","t":"La cultura anti-corruzione è sviluppata, mantenuta e promossa a tutti i livelli, con impegno visibile e coerente della dirigenza?"},{"id":"5.1.3.09","cap":"5","capn":"Leadership","rif":"5.1.3","pro":"PAC-02","t":"I comportamenti che compromettono il sistema sono trattati in modo uniforme indipendentemente dalla posizione ricoperta?"},{"id":"5.2.10","cap":"5","capn":"Leadership","rif":"5.2","pro":"PAC-02","t":"La politica vieta la corruzione, richiede la conformità alle leggi applicabili ed è appropriata alle finalità dell'organizzazione?"},{"id":"5.2.11","cap":"5","capn":"Leadership","rif":"5.2","pro":"PAC-02","t":"La politica fornisce il quadro per gli obiettivi, comprende l'impegno a soddisfare i requisiti applicabili e al miglioramento continuo?"},{"id":"5.2.12","cap":"5","capn":"Leadership","rif":"5.2","pro":"PAC-02","t":"La politica incoraggia la segnalazione senza timore di ritorsioni, spiega autorità e indipendenza della funzione e illustra le conseguenze della non conformità?"},{"id":"5.2.13","cap":"5","capn":"Leadership","rif":"5.2","pro":"PAC-06","t":"La politica è documentata, comunicata internamente, resa disponibile alle parti interessate e comunicata ai soci in affari a rischio superiore al livello basso?"},{"id":"5.3.1.14","cap":"5","capn":"Leadership","rif":"5.3.1","pro":"PAC-03","t":"L'alta direzione ha la responsabilità complessiva dell'attuazione, e responsabilità e autorità dei ruoli pertinenti sono assegnate e comunicate?"},{"id":"5.3.1.15","cap":"5","capn":"Leadership","rif":"5.3.1","pro":"PAC-03","t":"I dirigenti a ogni livello rispondono dell'applicazione del sistema nella propria area?"},{"id":"5.3.2.16","cap":"5","capn":"Leadership","rif":"5.3.2","pro":"PAC-03","t":"La funzione per la prevenzione della corruzione è individuata con atto formale e dispone di competenza, status, autorità e indipendenza appropriati?"},{"id":"5.3.2.17","cap":"5","capn":"Leadership","rif":"5.3.2","pro":"PAC-03","t":"La funzione è adeguatamente finanziata e ha accesso diretto e tempestivo all'organo di governo e all'alta direzione?"},{"id":"5.3.2.18","cap":"5","capn":"Leadership","rif":"5.3.2","pro":"PAC-03","t":"In caso di esternalizzazione, è individuato il dirigente interno che mantiene const PROLIST = CORPUS.ordPro, MODLIST = CORPUS.ordMod;
const APPVER = "1.0";
const MODOF = {}; PROLIST.forEach(c => MODOF[c] = MODLIST.filter(m => MOD[m].pro === c));
const REQOF = {}; CAPI.forEach(k => REQOF[k.id] = REQ.filter(r => r.cap === k.id));
const REQPRO = {}; PROLIST.forEach(c => REQPRO[c] = REQ.filter(r => r.pro === c));

/* =========================================================================
   MOTORE DI RISCHIO — SOCI IN AFFARI
   ========================================================================= */
const DIM = [
  { k:"d_paese", l:"Paese di operatività", d:"Contesto in cui il socio in affari opera per conto o nei confronti dell'Organizzazione.",
    s:["Contesto a bassa esposizione, applicazione effettiva della legge","Esposizione moderata","Esposizione elevata o applicazione debole","Contesto ad alta esposizione o assenza di tutela"] },
  { k:"d_pu", l:"Interazione con pubblici ufficiali", d:"Natura e frequenza dei contatti con pubblici ufficiali connessi all'attività affidata.",
    s:["Nessuna interazione","Interazione occasionale e non discrezionale","Interazione ricorrente su atti discrezionali","Interazione diretta su permessi, gare o autorizzazioni"] },
  { k:"d_nat", l:"Natura del rapporto", d:"Il rischio è maggiore quando il socio agisce per conto o a vantaggio dell'Organizzazione rispetto a quando le fornisce beni o servizi.",

  { k:"d_val", l:"Rilevanza economica e discrezionalità", d:"Valore, durata e margine di discrezionalità dell'operazione affidata.",
    s:["Valore modesto, prestazione standardizzata","Valore contenuto, discrezionalità limitata","Valore rilevante o prestazione discrezionale","Valore elevato o operazione complessa e non standardizzata"] }
];
const FLAGS = [
  { k:"f_succ", l:"Remunerazione a provvigione o a successo" },
  { k:"f_cli", l:"Nominato o imposto dal cliente o da un pubblico ufficiale" },
  { k:"f_te", l:"Titolarità effettiva non ricostruibile o giurisdizione opaca" },
  { k:"f_prec", l:"Indagini, condanne, sanzioni o esclusioni per corruzione o reati analoghi" },
  { k:"f_leg", l:"Legami con pubblici ufficiali, candidati a cariche pubbliche o loro familiari" },
  { k:"f_pag", l:"Richiesta di pagamenti a soggetti diversi dal contraente" }
];
const LIV = ["Basso", "Medio", "Alto", "Critico"];
const LIVCLS = { "Basso":"rk-b", "Medio":"rk-m", "Alto":"rk-a", "Critico":"rk-c" };

function punteggio(p){
  const v = DIM.map(d => n(p[d.k])).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
}
function livello(p){
  const s = punteggio(p); if (!s) return "";
  let l = s < 1.8 ? "Basso" : s < 2.6 ? "Medio" : s < 3.4 ? "Alto" : "Critico";
  if (FLAGS.some(f => p[f.k]) && (l === "Basso" || l === "Medio")) l = "Alto";
  if (p.f_prec && l !== "Critico") l = "Critico";
  return l;
}
/* la soglia su cui poggia l'intera norma */
function superiore(p){ const l = livello(p); return l && l !== "Basso"; }
function livelloDD(p){ const l = livello(p); return l === "Critico" ? 3 : l === "Alto" ? 3 : l === "Medio" ? 2 : 1; }
const FREQDD = { "Critico":12, "Alto":12, "Medio":24, "Basso":36 };

/* obblighi derivati dal livello di rischio: è il cuore del prodotto */
const OBB = [
  { k:"dd", l:"Due diligence svolta e valida", rif:"8.2 · PAC-07",
    app: p => superiore(p),
    ok: p => !!p.dd_data && !scaduta(p.dd_data, FREQDD[livello(p)] || 24),
    hint: p => "Livello " + livelloDD(p) + ", rinnovo ogni " + (FREQDD[livello(p)] || 24) + " mesi" },
  { k:"pol", l:"Politica comunicata direttamente", rif:"5.2 · 7.4.2",
    app: p => superiore(p), ok: p => p.pol_com === "Sì" },
  { k:"imp", l:"Impegni anticorruzione acquisiti", rif:"8.6 · PAC-09",
    app: p => superiore(p), ok: p => p.imp === "Sì" || p.imp === "Non fattibile, motivato",
    hint: p => p.imp === "Non fattibile, motivato" ? "Non fattibilità registrata: valutata nel rischio" : "" },
  { k:"clau", l:"Clausole contrattuali inserite", rif:"8.6 · PAC-09",
    app: p => superiore(p), ok: p => p.clausole === "Sì" },
  { k:"ctrl", l:"Controlli anticorruzione del socio verificati", rif:"8.5.2 · PAC-09",
    app: p => superiore(p), ok: p => ["Adeguati", "Richiesti e attuati", "Non fattibile, valutato nel rischio"].includes(p.ctrl) },
  { k:"form", l:"Formazione anticorruzione erogata agli addetti", rif:"7.3.3 · PAC-06",
    app: p => superiore(p) && n(p.d_nat) >= 3, ok: p => !!p.form_data,
    hint: () => "Dovuta perché il socio agisce per conto o a vantaggio dell'Organizzazione" },
  { k:"pag", l:"Verifica di proporzionalità del corrispettivo", rif:"8.4 · PAC-08",
    app: p => !!p.f_succ, ok: p => p.pag_ver === "Sì",
    hint: () => "Dovuta per la remunerazione a provvigione o a successo" },
  { k:"ctr", l:"Adeguamento dell'organizzazione controllata", rif:"8.5.1 · PAC-09",
    app: p => p.controllata === "Sì", ok: p => ["Applica il nostro sistema", "Applica controlli propri"].includes(p.adeg) }
];
function obblighi(p){ return OBB.filter(o => o.app(p)); }
function obbAperti(p){ return obblighi(p).filter(o => !o.ok(p)); }
function scaduta(data, mesi){ if (!data) return true; const d = new Date(data); d.setMonth(d.getMonth() + mesi); return d < new Date(); }

/* rischio degli scenari del registro 4.5 */
function livScenario(r){
  const s = lvl(r.prob) * lvl(r.cons);
  if (!s) return "";
  return s <= 3 ? "Basso" : s <= 7 ? "Medio" : s <= 11 ? "Alto" : "Critico";
}
function lvl(v){ const m = /^\s*(\d)/.exec(String(v == null ? "" : v)); return m ? Number(m[1]) : 0; }

const KEY = "sgpc_37001_v1";
const STORE = {

    if (DB.cfg && DB.cfg.url) return "rest";

  },
  async load(){
    if (window.SGPC_STORE && typeof window.SGPC_STORE.load === "function"){
      try { const o = await window.SGPC_STORE.load(); if (o) return o; } catch(e){ console.warn("host load", e); }
    }
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(KEY + "_cfg") || "null"); } catch(e){}
    if (cfg && cfg.url){
      try { const r = await fetch(cfg.url, { headers: authHdr(cfg) });
        if (r.ok){ const o = await r.json(); if (o && o.orgs){ o.cfg = cfg; return o; } } } catch(e){ console.warn("rest load", e); }
    }
    try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (cfg) o.cfg = cfg; return o; } } catch(e){}
    return cfg ? { orgs: [], current: null, cfg } : null;
  },
  async save(){
    const payload = { orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() };
    if (DB.cfg) { try { localStorage.setItem(KEY + "_cfg", JSON.stringify(DB.cfg)); } catch(e){} }
    if (window.SGPC_STORE && typeof window.SGPC_STORE.save === "function"){
      try { await window.SGPC_STORE.save(payload); return true; } catch(e){ toast("Salvataggio sulla piattaforma non riuscito"); }
    }
    if (DB.cfg && DB.cfg.url){
      try { const r = await fetch(DB.cfg.url, { method: DB.cfg.metodo || "PUT",
        headers: Object.assign({ "Content-Type":"application/json" }, authHdr(DB.cfg)), body: JSON.stringify(payload) });
        if (!r.ok) toast("Endpoint: risposta " + r.status);
      } catch(e){ toast("Endpoint non raggiungibile — copia locale mantenuta"); }
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); return true; }
    catch(e){ toast("Spazio locale esaurito — esporta l'archivio"); return false; }
  }
};
function authHdr(cfg){ return cfg && cfg.token ? { "Authorization": "Bearer " + cfg.token } : {}; }

  const o = org(); if (!o) return txt;
  let s = String(txt == null ? "" : txt);
  TOKENS.forEach(t => { const v = t.f(o.ana); if (v) s = s.replace(t.re, v); });
  return s;
}

const PESO = { "Conforme":100, "Parzialmente conforme":50, "Non conforme":0 };
function capStato(cap){
  const o = org(), v = REQOF[cap].map(r => (o.req[r.id] || {}).s).filter(s => s && s !== "Non applicabile");
  if (!v.length) return 0;
  return Math.round(v.reduce((a, s) => a + (PESO[s] || 0), 0) / v.length);
}
function capCoperti(cap){
  const o = org();
  return REQOF[cap].filter(r => (o.req[r.id] || {}).s).length;
}
function conformita(){
  const v = CAPI.map(k => capStato(k.id));
  return Math.round(v.reduce((a, b) => a + b, 0) / v.length);
}
function reqValutati(){ const o = org(); return REQ.filter(r => (o.req[r.id] || {}).s).length; }

function sociSup(){ return (org().soci || []).filter(p => superiore(p) && p.stato !== "Cessato"); }
function obbTotali(){
  let app = 0, ok = 0;
  (org().soci || []).filter(p => p.stato !== "Cessato").forEach(p =>
    obblighi(p).forEach(o => { app++; if (o.ok(p)) ok++; }));
  return { app, ok };
}

function navHTML(){
  const o = org();
  return NAV.map(i => {
    if (i.g) return '<div class="navgrp">' + i.g + "</div>";
    if (!o && !["pf", "guida", "set"].includes(i.v)) return "";
    let ct = "";
    if (o){
      if (i.v === "soci") ct = String((o.soci || []).length);
      if (i.v === "reg") ct = String(REGDEF.reduce((a, r) => a + (o.reg[r.id] || []).length, 0));
      if (i.v === "sgs") ct = PROLIST.filter(c => statoPro(c) === "Approvata").length + "/" + PROLIST.length;
      if (i.v === "conf") ct = reqValutati() + "/" + REQ.length;
      if (i.v === "home") ct = conformita() + "%";
    }
    return '<button class="nav' + (view === i.v ? " on" : "") + '" data-v="' + i.v + '">' +
      '<span class="st">' + i.s + "</span> " + i.n + (ct ? '<span class="ct">' + ct + "</span>" : "") + "</button>";
  }).join("");
}

function box(l, v, h){ return '<div class="card kpi"><div class="l">' + l + '</div><div class="n">' + v + '</div><div class="h">' + esc(h) + "</div></div>"; }
function urgenze(){
  const o = org(), out = [], R = o.reg;
  const add = (t, nn, cls, act, id) => { if (nn) out.push({ t, n:nn, cls, act, id }); };
  const soci = (o.soci || []).filter(p => p.stato !== "Cessato");
  add("Soci in affari senza livello di rischio determinato", soci.filter(p => !livello(p)).length, "t-amb", "gov", "soci");
  add("Soci sopra la soglia con obblighi non assolti", soci.filter(p => superiore(p) && obbAperti(p).length).length, "t-red", "gov", "soci");
  add("Due diligence scadute", soci.filter(p => superiore(p) && p.dd_data && scaduta(p.dd_data, FREQDD[livello(p)] || 24)).length, "t-red", "gov", "soci");
  add("Scenari con controlli non idonei", (R.rischi || []).filter(x => x.idon === "Non idonei" && x.stato !== "Presidiato").length, "t-red", "goreg", "rischi");
  add("Benefici sopra soglia senza autorizzazione preventiva", (R.benefici || []).filter(x => x.aut === "Non richiesta ma dovuta").length, "t-red", "goreg", "benefici");
  add("Benefici a pubblici ufficiali con trattative in corso", (R.benefici || []).filter(x => x.pu === "Sì" && x.tratt === "Sì").length, "t-red", "goreg", "benefici");
  add("Segnalazioni non chiuse", (R.segnalazioni || []).filter(x => x.stato !== "Chiusa").length, "t-amb", "goreg", "segnalazioni");
  add("Indagini condotte da soggetto non indipendente", (R.indagini || []).filter(x => x.indip === "No").length, "t-red", "goreg", "indagini");
  add("Casi accertati senza riesame delle procedure", (R.indagini || []).filter(x => x.esito === "Accertato" && x.riesame !== "Sì").length, "t-red", "goreg", "indagini");
  add("Azioni correttive oltre il termine", (R.nc || []).filter(x => x.scad && x.stato !== "Chiusa" && new Date(x.scad) < new Date()).length, "t-red", "goreg", "nc");
  add("Audit pianificati non eseguiti", (R.audit || []).filter(x => x.datap && !x.datae && new Date(x.datap) < new Date()).length, "t-amb", "goreg", "audit");
  add("Conflitti dichiarati senza misura di limitazione", (R.conflitti || []).filter(x => x.stato !== "Cessato" && !x.mis).length, "t-amb", "goreg", "conflitti");
  add("Requisiti non conformi", REQ.filter(r => (o.req[r.id] || {}).s === "Non conforme").length, "t-red", "gov", "conf");
  if (!out.length) return '<div class="empty">Nessuna posizione aperta.</div>';
  return "<table><tbody>" + out.map(r => '<tr><td><button class="linkbtn" data-act="' + r.act + '" data-id="' + r.id + '">' +
    esc(r.t) + '</button></td><td class="num"><b>' + r.n + '</b></td><td><span class="tag ' + r.cls + '">da presidiare</span></td></tr>').join("") + "</tbody></table>";
}
function distribSoci(){
  const P = (org().soci || []).filter(p => p.stato !== "Cessato");
  if (!P.length) return '<div class="empty">Nessun socio in affari registrato.</div>';
  const m = { Critico:0, Alto:0, Medio:0, Basso:0, "":0 };
  P.forEach(p => { const l = livello(p) || ""; m[l] = (m[l] || 0) + 1; });
  return ["Critico","Alto","Medio","Basso",""].map(k => {
    const v = m[k] || 0;
    return '<div class="row" style="margin-bottom:7px"><span style="width:100px"><span class="rk ' + (LIVCLS[k] || "t-gry") + '">' +
      (k || "non valutato") + '</span></span><div class="track" style="flex:1"><i class="' +
      (k === "Critico" || k === "Alto" ? "no" : k === "Medio" ? "mid" : "ok") + '" style="width:' + Math.round(v / P.length * 100) + '%"></i></div>' +
      '<b class="num" style="width:34px">' + v + "</b></div>";
  }).join("") + '<div class="hint">Tutto ciò che non è «Basso» è sopra la soglia: da lì discendono due diligence, impegni, clausole, verifica dei controlli e formazione.</div>';
}

function ordinaLiv(a, b){
  const ord = { Critico:0, Alto:1, Medio:2, Basso:3, "":4 };

}

function cellHTML(r, c){
  const v = fmtVal(r[c.k], c);

  if (c.k === "indip") return v === "No" ? '<span class="tag t-red">No</span>' : esc(v || "—");

  if (c.k === "res" || c.k === "rischio") return v ? '<span class="rk ' + (LIVCLS[v] || "t-gry") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "aut") return '<span class="tag ' + (v === "Richiesta e ottenuta" ? "t-grn" : v === "Non richiesta ma dovuta" ? "t-red" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "fond") return '<span class="tag ' + (v === "Sì" ? "t-red" : v === "No" ? "t-gry" : "t-amb") + '">' + esc(v || "—") + "</span>";
  return esc(v).slice(0, 150).replace(/\n/g, " ");
}
function fmtVal(v, c){ if (v == null || v === "") return ""; return c && c.t === "date" ? itDate(v) : String(v); }
function statoTag(s){
  if (!s) return "t-gry";
  if (/chius|raggiunt|presidiat|acquisita|conform|applicato$|eseguit|registrato/i.test(s)) return "t-grn";
  if (/apert|pianificat|non raggiunto|scaduta|attesa|non applicato|non conforme|rifiutato/i.test(s)) return "t-red";
  return "t-amb";
}

         : '<input type="' + (c.t === "num" ? "number" : c.t === "date" ? "date" : "text") + '" data-rec="' + c.k + '" value="' + esc(v) + '">') +

    '<button class="btn" data-act="saveRec" data-id="' + id + '" data-i="' + (nuovo ? "" : i) + '">Salva</button></div></div></div>';
}
function autoRec(d){
  const r = {}, rows = org().reg[d.id] || [];
  d.cols.forEach(c => {
    if (c.auto) r[c.k] = c.auto + String(rows.length + 1).padStart(3, "0");

    if (c.k === "stato" && c.o) r[c.k] = c.o[0];
  });
  return r;
}

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";
  if (!edit) return inner;
  return '<div class="blk' + (modif ? " ovr" : "") + '" data-blk="' + i + '">' + inner +
    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}
function docHTML(blocks, ovr, edit){ return blocks.map((b, i) => blockHTML(b, i, ovr, edit)).join(""); }
function txtOf(b){ return b.k === "t" ? b.r.map(r => r.join(" ")).join(" ") : (b.t || ""); }

VIEWS.kpi = () => {
  const o = org(); if (!o) return VIEWS.pf();
  const R = o.reg, soci = (o.soci || []).filter(p => p.stato !== "Cessato"), sup = sociSup();
  const ob = obbTotali();
  const dd = sup.filter(p => p.dd_data && !scaduta(p.dd_data, FREQDD[livello(p)] || 24));
  const ben = R.benefici || [], seg = R.segnalazioni || [], ind = R.indagini || [];
  const aud = R.audit || [], nc = R.nc || [], form = R.formazione || [];
  const ncChiuse = nc.filter(x => x.stato === "Chiusa");
  const ncInTempo = ncChiuse.filter(x => x.scad && x.chius && new Date(x.chius) <= new Date(x.scad));
  const seg7 = seg.filter(x => x.data && x.presa && (new Date(x.presa) - new Date(x.data)) / 86400000 <= 7);
  const B = (l, v, h) => '<div class="card kpi"><div class="l">' + l + '</div><div class="n">' + v + '</div><div class="h">' + esc(h) + "</div></div>";
  return "<h1>5 · Indicatori</h1>" +
    '<p class="sub">Gli indicatori di processo misurano ciò che è stato svolto; quelli di esito misurano se il sistema stia producendo effetti. Un sistema senza segnalazioni e senza provvedimenti va guardato con attenzione, non con soddisfazione.</p>' +
    '<h2 style="margin:18px 0 10px">Indicatori di processo</h2><div class="grid g4">' +
      B("Soci sopra la soglia con due diligence valida", pc(dd.length, sup.length || 1) + "%", sup.length + " posizioni sopra la soglia") +
      B("Obblighi assolti", pc(ob.ok, ob.app) + "%", ob.app + " obblighi applicabili in totale") +
      B("Impegni anticorruzione acquisiti", pc(sup.filter(p => p.imp === "Sì" || p.imp === "Non fattibile, motivato").length, sup.length || 1) + "%", "target 100% dei casi fattibili") +
      B("Clausole contrattuali", pc(sup.filter(p => p.clausole === "Sì" || p.clausole === "Non applicabile").length, sup.length || 1) + "%", "sulle posizioni sopra la soglia") +
    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      B("Scenari di rischio valutati", String((R.rischi || []).length), (R.rischi || []).filter(x => x.idon === "Non idonei").length + " con controlli non idonei") +
      B("Controlli verificati nel periodo", pc((R.controlli || []).filter(x => x.ultima).length, (R.controlli || []).length || 1) + "%", "target ≥ 90%") +
      B("Audit eseguiti", aud.filter(x => x.datae).length + "/" + aud.length, "sul programma annuale") +
      B("Sessioni formative erogate", String(form.length), form.reduce((a, x) => a + n(x.durata), 0) + " ore complessive") +
    "</div>" +
    '<h2 style="margin:22px 0 10px">Indicatori di esito</h2><div class="grid g4">' +
      B("Segnalazioni pervenute", String(seg.length), "un aumento indica di norma un canale più credibile") +
      B("Prese in carico entro 7 giorni", pc(seg7.length, seg.length || 1) + "%", "target 100%") +
      B("Casi accertati", String(ind.filter(x => x.esito === "Accertato").length), "su " + ind.length + " indagini") +
      B("Casi di ritorsione", String(seg.filter(x => x.rit === "Sì" && x.fond === "Sì").length), "target 0") +
    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      B("Azioni correttive chiuse nei termini", pc(ncInTempo.length, ncChiuse.length || 1) + "%", "target ≥ 85%") +
      B("Azioni con efficacia verificata", pc(ncChiuse.filter(x => x.eff).length, ncChiuse.length || 1) + "%", "target 100%") +
      B("Casi accertati con riesame delle procedure", pc(ind.filter(x => x.esito === "Accertato" && x.riesame === "Sì").length,
        ind.filter(x => x.esito === "Accertato").length || 1) + "%", "target 100%") +
      B("Benefici con autorizzazione preventiva", pc(ben.filter(x => x.aut === "Richiesta e ottenuta" || x.aut === "Non richiesta").length, ben.length || 1) + "%", "target 100%") +
    "</div>" +
    '<div class="grid g2" style="margin-top:16px">' +
      '<div class="card"><h2>Conformità per punto della norma</h2>' + confBar() + "</div>" +
      '<div class="card"><h2>Obblighi non assolti per tipo</h2>' + obbAperti2() + "</div>" +
    "</div>" +
    '<div class="card"><h2>Esposizione per paese</h2>' + perPaese(soci) + "</div>";
};
function confBar(){
  return CAPI.map(k => {
    const v = capStato(k.id);
    return '<div class="row" style="margin-bottom:7px"><span style="width:130px;font-size:12px">' + k.id + " · " + esc(k.n) +
      '</span><div class="track" style="flex:1"><i class="' + (v > 79 ? "ok" : v > 39 ? "mid" : "no") + '" style="width:' + v + '%"></i></div>' +
      '<b class="num" style="width:44px;text-align:right">' + v + "%</b></div>";
  }).join("");
}
function obbAperti2(){
  const soci = (org().soci || []).filter(p => p.stato !== "Cessato");
  const m = {};
  soci.forEach(p => obbAperti(p).forEach(o => m[o.l] = (m[o.l] || 0) + 1));
  const ks = Object.keys(m).sort((a, b) => m[b] - m[a]);
  if (!ks.length) return '<div class="empty">Nessun obbligo aperto.</div>';
  return "<table><tbody>" + ks.map(k => "<tr><td>" + esc(k) + '</td><td class="num"><b>' + m[k] + "</b></td></tr>").join("") + "</tbody></table>";
}
function perPaese(P){
  if (!P.length) return '<div class="empty">Nessun socio in affari registrato.</div>';
  const m = {};
  P.forEach(p => { const k = p.paese || "non indicato";
    m[k] = m[k] || { n:0, val:0, sup:0 };
    m[k].n++; m[k].val += n(p.valore); if (superiore(p)) m[k].sup++; });
  const ks = Object.keys(m).sort((a, b) => m[b].val - m[a].val);
  return '<div class="scroll"><table><thead><tr><th>Paese</th><th style="text-align:right">Posizioni</th><th style="text-align:right">Valore</th><th style="text-align:right">Sopra la soglia</th></tr></thead><tbody>' +
    ks.map(k => '<tr><td>' + esc(k) + '</td><td class="num">' + m[k].n + '</td><td class="num">' + fmtEur(m[k].val) +
      '</td><td class="num">' + (m[k].sup ? '<span class="tag t-amb">' + m[k].sup + "</span>" : "0") + "</td></tr>").join("") +
    "</tbody></table></div>";
}

      (st.add ? '<div class="sec">Integrazioni</div><p>' + nl2br(st.add) + "</p>" : "");

  } else if (tipo === "out"){

  delSoc(el){ if (!confirm("Eliminare la posizione?")) return;
    const o = org(); o.soci = o.soci.filter(p => p.id !== el.dataset.id); sel.soc = null; touch(); render(); },
  setDim(el){ const p = socById(sel.soc); p[el.dataset.k] = n(p[el.dataset.k]) === n(el.dataset.v) ? "" : n(el.dataset.v); touch(); render(); },
  schedaSoc(el){ esportaWord("soc", el.dataset.id); },
  expSoc(){ scarica("soci-in-affari-" + oggi() + ".csv", "\ufeff" + csvSoci(), "text/csv;charset=utf-8"); },
  expConf(){ scarica("mappa-conformita-" + oggi() + ".csv", "\ufeff" + csvConf(), "text/csv;charset=utf-8"); },
  goreg(el){ view = "reg"; sel.reg = el.dataset.id; sel.soc = null; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){ const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const arr = org().reg[id]; if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata"); },
  delRec(el){ if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render(); },
  closeModal(){ closeModal(); },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){ const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value, st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato"); },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  openOut(el){ sel.out = el.dataset.id; render(); },
  backOut(){ sel.out = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){ scarica("archivio-sgpc-" + oggi() + ".json",
    JSON.stringify({ orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() }, null, 1), "application/json"); },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){ if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); } },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){ if (!confirm("Svuotare l'archivio locale?")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){} view = "pf"; queueSave(); render(); }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.soc = null; sel.out = null; sel.q = "";
    document.getElementById("side").classList.remove("open"); render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
  if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.soc != null){ const p = socById(sel.soc); if (p){ p[t.dataset.soc] = t.value; touch(); } return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "socq", "sgsq", "modq", "confq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.flag != null){ const p = socById(sel.soc); if (p){ p[t.dataset.flag] = t.checked; touch(); render(); } return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "s"){ t.className = t.value === "Non conforme" ? "no" : ""; refreshConf(); } return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.soc != null || t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
</html>
