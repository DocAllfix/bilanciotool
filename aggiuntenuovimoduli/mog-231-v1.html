<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modello di organizzazione, gestione e controllo — D.Lgs. 231/2001</title>
<style>
:root{
  --pri:#3A6B57;--pri-dk:#274B3D;--pri-lt:#E9F2EE;--pri-mid:#6E9B87;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---- ciclo di due diligence ---- */
.fase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.fase:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.fase .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.fase .nm{font-weight:650;letter-spacing:-.2px;font-size:15px}
.fase .ds{font-size:12px;color:var(--ink-3);line-height:1.45;flex:1}
.fase .pc{font-family:var(--mono);font-size:20px;font-weight:650;letter-spacing:-.5px}
/* ---- rischio ---- */
.rk{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.02em}
.rk-b{background:var(--green-lt);color:var(--green)}
.rk-m{background:var(--blue-lt);color:var(--blue)}
.rk-a{background:var(--amber-lt);color:var(--amber)}
.rk-c{background:var(--red-lt);color:var(--red)}
.sev{display:flex;gap:2px;align-items:center}
.sev i{width:11px;height:11px;border-radius:2px;background:var(--line-2);display:block}
.sev i.on{background:var(--pri)}
.sev i.hi{background:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:56px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 4px;cursor:pointer;font-size:11.5px;text-align:center;color:var(--ink-2)}
.scale button:hover{border-color:var(--pri-mid)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.scale button b{display:block;font-family:var(--mono);font-size:14px}
.flagbox{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.flagbox:last-child{border-bottom:0}
.flagbox input{width:16px;height:16px;margin:2px 0 0;flex:0 0 16px}
.flagbox span{font-size:12.5px;line-height:1.45}
.panel{background:var(--pri-lt);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.panel .row{gap:22px}
.panel b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:-.4px}
.panel span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri-dk);border-bottom-color:var(--pri);font-weight:600}

select.no{border-color:var(--red);color:var(--red);font-weight:600}

</style>
</head>

  <main class="main">
    <div class="top noprint" id="topbar"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script type="application/json" id="corpus">{"pro":{"MOG-PG-01":{"code":"MOG-PG-01","titolo":"IL MODELLO DI ORGANIZZAZIONE, GESTIONE E CONTROLLO: QUADRO, DESTINATARI E STRUTTURA","fase":"Parte generale","rif":"D.Lgs. 231/2001, artt. 5, 6, 7 · Linee guida di categoria","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-01","","",""],["Codice:","MOG-PG-01","Revisione:","[Rev.]"],["Titolo:","IL MODELLO DI ORGANIZZAZIONE, GESTIONE E CONTROLLO: QUADRO, DESTINATARI E STRUTTURA","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 5, 6, 7 · Linee guida di categoria","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. FINALITÀ DEL MODELLO"},{"k":"p","t":"[Nome Organizzazione] adotta il presente modello di organizzazione, gestione e controllo per prevenire la commissione dei reati dai quali dipende la responsabilità amministrativa dell'ente e per costituire, ove il reato sia comunque commesso, la condizione esimente prevista dalla legge."},{"k":"p","t":"Il modello non è un documento da esibire: è l'insieme dei presidi effettivamente operanti. Un modello formalmente completo ma non attuato non esclude la responsabilità dell'ente, e la giurisprudenza lo ha ripetutamente affermato."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"D.Lgs. 8 giugno 2001, n. 231, in particolare artt. 5, 6, 7, 9, 13, 25 e seguenti"},{"k":"p","t":"D.Lgs. 10 marzo 2023, n. 24, in materia di segnalazione delle violazioni"},{"k":"p","t":"Linee guida delle associazioni di categoria rappresentative"},{"k":"p","t":"Codice etico e sistema disciplinare dell'ente"},{"k":"p","t":"2. LA RESPONSABILITÀ DELL'ENTE"},{"k":"t","r":[["Elemento","Contenuto"],["Presupposto soggettivo","Il reato è commesso da soggetti in posizione apicale o da soggetti sottoposti alla loro direzione o vigilanza."],["Presupposto oggettivo","Il reato è commesso nell'interesse o a vantaggio dell'ente. L'ente non risponde se il soggetto ha agito nell'interesse esclusivo proprio o di terzi."],["Esimente per gli apicali","Adozione ed efficace attuazione del modello prima della commissione del fatto, organismo di vigilanza dotato di autonomi poteri, elusione fraudolenta del modello, assenza di omessa o insufficiente vigilanza dell'organismo."],["Esimente per i sottoposti","Adozione ed efficace attuazione del modello idoneo a prevenire reati della specie di quello verificatosi."],["Sanzioni","Pecuniarie per quote, interdittive, confisca, pubblicazione della sentenza."]]},{"k":"p","t":"3. DESTINATARI"},{"k":"p","t":"Il modello si applica a: organo amministrativo e organi di controllo; dirigenti; dipendenti a ogni livello; collaboratori, agenti, procuratori e consulenti; fornitori, appaltatori e partner commerciali, nei limiti e con le modalità stabilite dai rapporti contrattuali (MOG-PG-09 e MOD-09.03)."},{"k":"p","t":"L'osservanza del modello costituisce obbligo contrattuale e la sua violazione è sanzionata secondo il sistema disciplinare (MOG-PG-07)."},{"k":"p","t":"4. STRUTTURA DEL MODELLO"},{"k":"t","r":[["Componente","Documento"],["Parte generale","MOG-PG-01 ÷ MOG-PG-09"],["Parte speciale — protocolli per famiglia di reato","MOG-PS-A ÷ MOG-PS-I"],["Codice etico","MOD-01.02"],["Sistema disciplinare","MOG-PG-07"],["Mappatura delle attività a rischio e valutazione","MOD-03.01 e MOD-03.02"],["Modulistica e registrazioni","MOD-01.01 ÷ MOD-09.04"]]},{"k":"p","t":"5. ADOZIONE E APPROVAZIONE"},{"k":"p","t":"Il modello è adottato con delibera dell'organo amministrativo, che ne è responsabile e ne cura l'aggiornamento. La delibera dà atto: della ricognizione delle attività a rischio, della nomina dell'organismo di vigilanza, dell'assegnazione delle risorse, dei tempi di attuazione."},{"k":"p","t":"Il verbale di adozione è conservato tra le informazioni documentate del sistema (MOD-01.01)."},{"k":"p","t":"6. RAPPORTO CON GLI ALTRI SISTEMI DI GESTIONE"},{"k":"p","t":"Dove l'ente adotti sistemi di gestione certificati, i presidi già in essere sono richiamati anziché duplicati. Le certificazioni non costituiscono di per sé prova di idoneità del modello: valgono nella misura in cui i controlli che documentano coprono i rischi-reato mappati."},{"k":"t","r":[["Sistema","Contributo al modello"],["UNI ISO 45001 · salute e sicurezza","Presidi rilevanti per l'art. 25-septies, integrati dal protocollo MOG-PS-C"],["UNI ISO 14001 · ambiente","Presidi rilevanti per l'art. 25-undecies, integrati dal protocollo MOG-PS-D"],["UNI ISO 37001 · prevenzione della corruzione","Presidi rilevanti per gli artt. 24, 25 e 25-ter"],["UNI ISO/IEC 27001 · sicurezza delle informazioni","Presidi rilevanti per l'art. 24-bis"]]},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Destinatari che hanno ricevuto il modello","MOD-08.02","Semestrale","100%"],["Attività a rischio mappate rispetto ai processi aziendali","MOD-03.01","Annuale","100%"],["Aggiornamento del modello nei termini","MOD-09.01","Annuale","Nei termini"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-01.01","Verbale di adozione del modello","Delibera dell'organo amministrativo, risorse assegnate, tempi di attuazione"],["MOD-01.02","Codice etico","Principi e regole di condotta vincolanti per tutti i destinatari"],["MOD-01.03","Dichiarazione di ricezione e impegno","Presa d'atto del modello e del codice etico da parte del destinatario"],["MOD-01.04","Elenco dei documenti del modello","Documento, revisione, data, stato di approvazione"]]}]},"MOG-PG-02":{"code":"MOG-PG-02","titolo":"ASSETTO ORGANIZZATIVO, DELEGHE, PROCURE E GESTIONE DELLE RISORSE FINANZIARIE","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 2 lett. b) e c)","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-02","","",""],["Codice:","MOG-PG-02","Revisione:","[Rev.]"],["Titolo:","ASSETTO ORGANIZZATIVO, DELEGHE, PROCURE E GESTIONE DELLE RISORSE FINANZIARIE","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 2 lett. b) e c)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce l'assetto delle responsabilità, il sistema di deleghe e procure e le modalità di gestione delle risorse finanziarie idonee a impedire la commissione dei reati."},{"k":"p","t":"La gestione delle risorse finanziarie è uno dei contenuti che la legge richiede espressamente: un modello che non se ne occupi è incompleto per definizione."},{"k":"p","t":"2. PRINCIPI DELL'ASSETTO"},{"k":"p","t":"ogni operazione deve essere verificabile, documentata, coerente e congrua;"},{"k":"p","t":"nessuno può gestire in autonomia un intero processo dall'avvio alla rendicontazione;"},{"k":"p","t":"i poteri autorizzativi e di firma sono coerenti con le responsabilità organizzative assegnate;"},{"k":"p","t":"le funzioni di controllo sono separate dalle funzioni operative controllate;"},{"k":"p","t":"ogni documento che attesta un'operazione è conservato secondo le regole di archiviazione stabilite."},{"k":"p","t":"3. DELEGHE E PROCURE"},{"k":"t","r":[["Requisito","Contenuto"],["Forma","Atto scritto, con data certa, accettato dal delegato"],["Contenuto","Ambito, poteri conferiti, limiti di spesa, durata, facoltà di subdelega"],["Idoneità del delegato","Competenza e professionalità adeguate all'ambito delegato"],["Autonomia di spesa","Risorse coerenti con i compiti attribuiti"],["Pubblicità","Comunicazione interna e, dove necessario, iscrizione presso il registro delle imprese"],["Vigilanza","La delega non esonera il delegante dall'obbligo di vigilanza sul corretto esercizio dei poteri"]]},{"k":"p","t":"Il registro delle deleghe e delle procure (MOD-02.01) è aggiornato a ogni variazione ed è riesaminato almeno annualmente dall'organismo di vigilanza."},{"k":"p","t":"4. GESTIONE DELLE RISORSE FINANZIARIE"},{"k":"p","t":"4.1 Presidi generali"},{"k":"p","t":"separazione tra chi dispone, chi autorizza e chi esegue il pagamento;"},{"k":"p","t":"doppia firma sopra le soglie stabilite nel MOD-02.02;"},{"k":"p","t":"tracciabilità integrale dei flussi: divieto di pagamenti in contanti oltre i limiti di legge e comunque oltre la soglia interna;"},{"k":"p","t":"divieto di aperture di conti non risultanti dalla contabilità;"},{"k":"p","t":"riconciliazioni periodiche dei conti e della cassa;"},{"k":"p","t":"verifica della corrispondenza tra beneficiario del pagamento e controparte contrattuale;"},{"k":"p","t":"motivazione documentata per ogni scostamento dalle condizioni contrattuali."},{"k":"p","t":"4.2 Aree di particolare attenzione"},{"k":"p","t":"Sono soggette a controllo rafforzato: cassa contanti e carte aziendali; note spese e rimborsi; omaggi, liberalità e sponsorizzazioni; consulenze e prestazioni immateriali; provvigioni e intermediazioni; anticipi e acconti; operazioni con parti correlate; pagamenti verso soggetti in giurisdizioni a fiscalità privilegiata."},{"k":"p","t":"5. RESPONSABILITÀ"},{"k":"t","r":[["Attività","Organo amm.","Direzione","Ammin. e finanza","OdV"],["Definizione dell'assetto delle deleghe","R","C","I","C"],["Aggiornamento del registro deleghe","A","R","I","C"],["Definizione delle soglie autorizzative","A","R","C","C"],["Esecuzione dei controlli sui flussi","I","A","R","I"],["Verifica periodica dell'assetto","I","C","C","R"]]},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Deleghe con atto scritto e accettazione","MOD-02.01","Annuale","100%"],["Pagamenti eseguiti in deroga alle soglie","MOD-02.03","Trimestrale","0"],["Riconciliazioni eseguite nei termini","Contabilità","Mensile","100%"],["Deroghe autorizzate e motivate","MOD-02.03","Semestrale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-02.01","Registro delle deleghe e delle procure","Delegato, ambito, poteri, limiti, durata, accettazione, verifica"],["MOD-02.02","Tabella dei poteri di spesa e delle soglie autorizzative","Soglie per tipologia di spesa e livelli di firma"],["MOD-02.03","Registro delle deroghe","Deroga, motivazione, autorizzazione, termine, chiusura"],["MOD-02.04","Organigramma e mansionario delle funzioni sensibili","Funzione, responsabilità, riporti, incompatibilità"]]}]},"MOG-PG-03":{"code":"MOG-PG-03","titolo":"METODOLOGIA DI IDENTIFICAZIONE E VALUTAZIONE DEI RISCHI-REATO","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 2 lett. a)","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-03","","",""],["Codice:","MOG-PG-03","Revisione:","[Rev.]"],["Titolo:","METODOLOGIA DI IDENTIFICAZIONE E VALUTAZIONE DEI RISCHI-REATO","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 2 lett. a)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il metodo con cui sono individuate le attività nel cui ambito possono essere commessi i reati presupposto e con cui ne è valutata l'esposizione al rischio."},{"k":"p","t":"La mappatura è il fondamento del modello: i protocolli che non nascono da essa sono adempimenti generici e come tali inidonei."},{"k":"p","t":"2. FASI DEL PROCESSO"},{"k":"t","r":[["Fase","Attività","Esito"],["1 · Ricognizione","Analisi dell'attività dell'ente, dell'organigramma, dei processi e dei rapporti con terzi","Elenco dei processi aziendali"],["2 · Applicabilità","Esame del catalogo dei reati presupposto e determinazione dei reati astrattamente configurabili","Catalogo di applicabilità motivato"],["3 · Individuazione","Associazione tra processi e reati configurabili, con descrizione delle modalità di possibile commissione","Matrice reati-processi"],["4 · Valutazione","Stima di probabilità e impatto per ciascuna coppia reato-processo","Rischio inerente"],["5 · Presidi","Rilevazione dei protocolli e dei controlli esistenti e valutazione della loro adeguatezza","Rischio residuo"],["6 · Trattamento","Definizione delle azioni sui rischi residui non accettabili","Piano di adeguamento"]]},{"k":"p","t":"3. CRITERI DI VALUTAZIONE"},{"k":"p","t":"3.1 Probabilità"},{"k":"t","r":[["Livello","Descrizione"],["1 · remota","Modalità di commissione astratta, nessun precedente, presidi consolidati"],["2 · possibile","Modalità concretamente ipotizzabile, presidi parziali"],["3 · probabile","Attività ricorrente con margini di discrezionalità, presidi deboli"],["4 · attesa","Precedenti interni o di settore, contatti frequenti con controparti a rischio, presidi assenti"]]},{"k":"p","t":"3.2 Impatto"},{"k":"t","r":[["Livello","Descrizione"],["1 · lieve","Sanzione pecuniaria contenuta, nessuna misura interdittiva prevista"],["2 · moderato","Sanzione pecuniaria significativa, danno reputazionale circoscritto"],["3 · grave","Misure interdittive previste, effetti sulla continuità di specifiche attività"],["4 · molto grave","Misure interdittive che incidono sulla capacità di contrarre o sull'esercizio dell'attività, danno reputazionale sistemico"]]},{"k":"p","t":"Nella determinazione dell'impatto si tiene conto della previsione di sanzioni interdittive per la fattispecie considerata: è l'elemento che distingue un rischio gestibile da un rischio potenzialmente esiziale per l'ente."},{"k":"p","t":"3.3 Rischio inerente"},{"k":"t","r":[["Punteggio (probabilità × impatto)","Livello"],["1 - 3","Basso"],["4 - 7","Medio"],["8 - 11","Alto"],["12 - 16","Critico"]]},{"k":"p","t":"3.4 Rischio residuo"},{"k":"p","t":"Il rischio inerente è modulato in ragione dell'adeguatezza dei presidi rilevati:"},{"k":"t","r":[["Presidi →","Assenti","Parziali","Adeguati"],["Inerente critico","Critico","Alto","Medio"],["Inerente alto","Critico","Alto","Medio"],["Inerente medio","Alto","Medio","Basso"],["Inerente basso","Medio","Basso","Basso"]]},{"k":"p","t":"4. SOGLIA DI ACCETTABILITÀ"},{"k":"p","t":"Il rischio residuo è accettabile quando la commissione del reato richiederebbe l'elusione fraudolenta dei protocolli, ossia una condotta consapevolmente diretta ad aggirare presidi effettivamente operanti."},{"k":"p","t":"Il rischio residuo alto o critico non è accettabile e genera un'azione di adeguamento con responsabile e termine, registrata nel MOD-03.03."},{"k":"p","t":"5. APPLICABILITÀ DEI REATI"},{"k":"p","t":"La determinazione di non applicabilità di una fattispecie è ammessa solo se motivata con riferimento all'attività concretamente svolta e alla struttura dell'ente, ed è riesaminata a ogni aggiornamento. La motivazione «non si ravvisano rischi» non è una motivazione."},{"k":"p","t":"6. AGGIORNAMENTO"},{"k":"p","t":"La valutazione è riesaminata almeno annualmente e comunque a fronte di: modifiche dell'attività, dell'assetto societario o dell'organigramma; apertura di nuove sedi o linee di business; novità legislative sul catalogo dei reati; segnalazioni, procedimenti o rilievi dell'organismo di vigilanza."},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-03.01","Catalogo di applicabilità dei reati presupposto","Fattispecie, applicabilità, motivazione, processi collegati"],["MOD-03.02","Matrice reati-processi e valutazione del rischio","Processo, reato, modalità, probabilità, impatto, presidi, rischio residuo"],["MOD-03.03","Piano di adeguamento","Rischio residuo non accettabile, azione, responsabile, termine, verifica"],["MOD-03.04","Scheda di processo sensibile","Descrizione, funzioni coinvolte, attività a rischio, controparti"]]}]},"MOG-PG-04":{"code":"MOG-PG-04","titolo":"ORGANISMO DI VIGILANZA: NOMINA, REQUISITI, POTERI E RISORSE","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 1 lett. b) e comma 4-bis","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-04","","",""],["Codice:","MOG-PG-04","Revisione:","[Rev.]"],["Titolo:","ORGANISMO DI VIGILANZA: NOMINA, REQUISITI, POTERI E RISORSE","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 1 lett. b) e comma 4-bis","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce composizione, requisiti, poteri, funzionamento e risorse dell'organismo di vigilanza, cui è affidato il compito di vigilare sul funzionamento e sull'osservanza del modello e di curarne l'aggiornamento."},{"k":"p","t":"2. COMPOSIZIONE"},{"k":"p","t":"La composizione è determinata dall'organo amministrativo in ragione della dimensione, della complessità e del profilo di rischio dell'ente."},{"k":"t","r":[["Configurazione","Quando è appropriata"],["Collegiale a tre membri","Enti di dimensione media o grande, attività a rischio articolate, presenza di rapporti frequenti con la pubblica amministrazione"],["Monocratico esterno","Enti di dimensione contenuta, purché il soggetto disponga di competenze giuridiche e di controllo adeguate"],["Collegio sindacale","Ammesso dalla legge per le società di capitali che se ne avvalgano, previa verifica dell'effettiva disponibilità di tempo e competenze"],["Amministratore o funzione interna operativa","Non ammessa: difetta il requisito di indipendenza"]]},{"k":"p","t":"3. REQUISITI"},{"k":"t","r":[["Requisito","Contenuto e verifica"],["Autonomia e indipendenza","Assenza di vincoli di subordinazione rispetto alle funzioni operative vigilate; riporto diretto all'organo amministrativo; assenza di conflitti di interessi"],["Professionalità","Competenze giuridiche, di organizzazione aziendale, di auditing e di controllo interno, proprie o acquisibili tramite consulenti"],["Continuità d'azione","Attività non episodica, con programma annuale e calendario di verifiche"],["Onorabilità","Assenza di condanne per i reati presupposto e di cause di incompatibilità; dichiarazione resa all'atto della nomina e rinnovata annualmente"]]},{"k":"p","t":"4. NOMINA, DURATA E CESSAZIONE"},{"k":"p","t":"La nomina avviene con delibera dell'organo amministrativo (MOD-04.01) che indica: composizione, durata dell'incarico, compenso, budget, cause di decadenza e revoca."},{"k":"p","t":"La revoca è ammessa solo per giusta causa, con delibera motivata: la revocabilità ad nutum priverebbe l'organismo dell'indipendenza richiesta. Costituiscono giusta causa l'inerzia, la perdita dei requisiti, la violazione degli obblighi di riservatezza, la sopravvenuta incompatibilità."},{"k":"p","t":"5. POTERI"},{"k":"p","t":"accesso senza limitazioni a documenti, archivi, sistemi informativi, sedi e cantieri;"},{"k":"p","t":"audizione di qualsiasi destinatario del modello, che è tenuto a collaborare;"},{"k":"p","t":"richiesta di informazioni a funzioni e a terzi contraenti nei limiti contrattuali;"},{"k":"p","t":"svolgimento di verifiche, anche non annunciate;"},{"k":"p","t":"ricorso a consulenti esterni a valere sul proprio budget;"},{"k":"p","t":"proposta di provvedimenti disciplinari all'organo competente;"},{"k":"p","t":"proposta di aggiornamento del modello."},{"k":"p","t":"L'organismo non ha poteri gestionali né di intervento sulle operazioni: la sua attività è di vigilanza e di impulso, e la commistione con compiti operativi ne comprometterebbe l'indipendenza."},{"k":"p","t":"6. RISORSE"},{"k":"p","t":"L'organo amministrativo assegna un budget annuo autonomo, di cui l'organismo dispone senza autorizzazioni preventive nei limiti stabiliti, dando conto dell'utilizzo nella relazione periodica. L'assenza di budget è, in sede di giudizio, un indice di inidoneità del modello."},{"k":"p","t":"7. FUNZIONAMENTO"},{"k":"p","t":"L'organismo si riunisce almeno trimestralmente e ogni volta che se ne ravvisi la necessità. Le sedute sono verbalizzate (MOD-04.03). Adotta un regolamento di funzionamento e un programma annuale di vigilanza (MOD-04.02) costruito sui rischi residui più elevati."},{"k":"p","t":"8. RISERVATEZZA"},{"k":"p","t":"I componenti sono tenuti alla riservatezza su quanto appreso nell'esercizio delle funzioni, salvi gli obblighi di riferire all'organo amministrativo e all'autorità. Il trattamento dei dati avviene nel rispetto della normativa applicabile."},{"k":"p","t":"9. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Sedute tenute rispetto a quelle programmate","MOD-04.03","Annuale","100%"],["Verifiche eseguite rispetto al programma","MOD-04.02","Semestrale","≥ 90%"],["Budget utilizzato e rendicontato","MOD-04.01","Annuale","Rendicontato"],["Dichiarazioni di onorabilità aggiornate","MOD-04.04","Annuale","100%"]]},{"k":"p","t":"10. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-04.01","Delibera di nomina dell'organismo di vigilanza","Composizione, durata, compenso, budget, poteri, cause di revoca"],["MOD-04.02","Programma annuale di vigilanza","Ambiti, criteri di priorità sul rischio, calendario, esiti"],["MOD-04.03","Verbale di seduta dell'organismo di vigilanza","Ordine del giorno, attività svolte, rilievi, decisioni"],["MOD-04.04","Dichiarazione di onorabilità e assenza di conflitti","Requisiti soggettivi dei componenti, rinnovo annuale"]]}]},"MOG-PG-05":{"code":"MOG-PG-05","titolo":"FLUSSI INFORMATIVI VERSO L'ORGANISMO DI VIGILANZA E RELAZIONI PERIODICHE","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 2 lett. d)","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-05","","",""],["Codice:","MOG-PG-05","Revisione:","[Rev.]"],["Titolo:","FLUSSI INFORMATIVI VERSO L'ORGANISMO DI VIGILANZA E RELAZIONI PERIODICHE","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 2 lett. d)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce gli obblighi di informazione nei confronti dell'organismo di vigilanza e le modalità con cui l'organismo riferisce all'organo amministrativo e all'organo di controllo."},{"k":"p","t":"Gli obblighi informativi sono un contenuto che la legge richiede espressamente. Un organismo che riceve informazioni solo su propria richiesta non è messo in condizione di vigilare."},{"k":"p","t":"2. FLUSSI PERIODICI"},{"k":"t","r":[["Funzione","Contenuto","Periodicità"],["Amministrazione e finanza","Operazioni sopra soglia, deroghe autorizzate, pagamenti a soggetti esteri, note spese della direzione, andamento della cassa contanti","Semestrale"],["Risorse umane","Assunzioni in posizioni sensibili, procedimenti disciplinari avviati e conclusi, contenzioso del lavoro, ricorso a somministrazione e appalti di manodopera","Semestrale"],["Acquisti e commerciale","Affidamenti in deroga, incarichi di consulenza e intermediazione, omaggi e liberalità sopra soglia, gare e rapporti con la pubblica amministrazione","Semestrale"],["Salute e sicurezza","Infortuni e mancati infortuni, esiti di verifiche degli organi di vigilanza, aggiornamento della valutazione dei rischi, formazione erogata","Semestrale"],["Ambiente","Autorizzazioni e scadenze, non conformità, esiti di controlli degli enti, gestione dei rifiuti e degli scarichi","Semestrale"],["Sistemi informativi","Incidenti di sicurezza, accessi anomali, licenze software, gestione dei profili autorizzativi","Semestrale"],["Legale e societario","Procedimenti giudiziari e amministrativi che coinvolgono l'ente o i suoi esponenti, ispezioni, rapporti con le autorità di vigilanza, operazioni straordinarie","Semestrale"]]},{"k":"p","t":"3. FLUSSI IMMEDIATI"},{"k":"p","t":"Sono comunicati senza ritardo, e comunque entro cinque giorni:"},{"k":"p","t":"avvio di procedimenti penali o amministrativi che coinvolgano l'ente o i suoi esponenti per fatti rilevanti ai sensi del decreto;"},{"k":"p","t":"ispezioni, accessi e richieste di autorità pubbliche;"},{"k":"p","t":"infortuni gravi o mortali e malattie professionali denunciate;"},{"k":"p","t":"incidenti ambientali e superamenti di limiti;"},{"k":"p","t":"incidenti di sicurezza informatica di impatto rilevante;"},{"k":"p","t":"provvedimenti disciplinari per violazioni del modello;"},{"k":"p","t":"anomalie nei flussi finanziari e operazioni non giustificate;"},{"k":"p","t":"modifiche dell'assetto societario, dell'organigramma o del sistema di deleghe;"},{"k":"p","t":"conferimento di incarichi a soggetti che intrattengono rapporti con la pubblica amministrazione."},{"k":"p","t":"4. MODALITÀ"},{"k":"p","t":"Le comunicazioni avvengono per iscritto all'indirizzo dedicato dell'organismo, sono protocollate nel MOD-05.01 e conservate per la durata stabilita. L'omissione o il ritardo ingiustificato costituiscono violazione del modello ai sensi del sistema disciplinare."},{"k":"p","t":"5. RELAZIONI DELL'ORGANISMO"},{"k":"t","r":[["Destinatario","Contenuto","Periodicità"],["Organo amministrativo","Attività svolta, verifiche eseguite ed esiti, criticità rilevate, proposte di aggiornamento del modello, utilizzo del budget","Semestrale"],["Organo di controllo","Medesimi contenuti, per quanto di competenza","Semestrale"],["Organo amministrativo — comunicazione straordinaria","Violazioni gravi, notizie di reato, situazioni che richiedono intervento immediato","Senza ritardo"]]},{"k":"p","t":"Se la criticità riguarda componenti dell'organo amministrativo, l'organismo riferisce all'organo di controllo e, ove istituito, al collegio sindacale."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Flussi periodici pervenuti nei termini","MOD-05.01","Semestrale","100%"],["Flussi immediati pervenuti entro 5 giorni","MOD-05.01","Trimestrale","100%"],["Relazioni dell'organismo rese nei termini","MOD-05.03","Annuale","100%"],["Richieste dell'organismo evase entro il termine assegnato","MOD-05.02","Semestrale","≥ 95%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-05.01","Registro dei flussi informativi","Mittente, contenuto, data attesa, data pervenuta, esito"],["MOD-05.02","Richiesta di informazioni dell'organismo","Destinatario, oggetto, termine, riscontro"],["MOD-05.03","Relazione periodica dell'organismo di vigilanza","Attività, verifiche, criticità, proposte, budget"],["MOD-05.04","Scheda di flusso informativo periodico","Modello di trasmissione per funzione con dati richiesti"]]}]},"MOG-PG-06":{"code":"MOG-PG-06","titolo":"SEGNALAZIONE DELLE VIOLAZIONI E TUTELA DEL SEGNALANTE","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 commi 2-bis ÷ 2-quater · D.Lgs. 24/2023","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-06","","",""],["Codice:","MOG-PG-06","Revisione:","[Rev.]"],["Titolo:","SEGNALAZIONE DELLE VIOLAZIONI E TUTELA DEL SEGNALANTE","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 commi 2-bis ÷ 2-quater · D.Lgs. 24/2023","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce i canali di segnalazione delle violazioni del modello e delle condotte illecite rilevanti, e le misure di tutela del segnalante."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"D.Lgs. 231/2001, art. 6, commi 2-bis, 2-ter e 2-quater"},{"k":"p","t":"D.Lgs. 10 marzo 2023, n. 24, e linee guida ANAC in materia"},{"k":"p","t":"Normativa sulla protezione dei dati personali"},{"k":"p","t":"2. AMBITO"},{"k":"p","t":"Possono essere segnalate: condotte illecite rilevanti ai sensi del decreto e fondate su elementi di fatto precisi e concordanti; violazioni del modello, del codice etico e dei protocolli; violazioni di disposizioni dell'Unione europea nelle materie individuate dalla normativa sul whistleblowing."},{"k":"p","t":"Non rientrano nell'ambito le contestazioni di carattere personale relative al rapporto di lavoro, per le quali sono disponibili gli ordinari canali."},{"k":"p","t":"3. SOGGETTI LEGITTIMATI"},{"k":"p","t":"Dipendenti, lavoratori autonomi e collaboratori, liberi professionisti e consulenti, volontari e tirocinanti, azionisti e persone con funzioni di amministrazione, direzione, controllo o vigilanza, lavoratori e collaboratori di fornitori e appaltatori dell'ente."},{"k":"p","t":"La tutela si estende ai periodi precedenti l'instaurazione del rapporto, durante il periodo di prova e successivamente allo scioglimento del rapporto."},{"k":"p","t":"4. CANALI"},{"k":"t","r":[["Canale","Modalità"],["Canale interno scritto","Piattaforma informatica o casella dedicata, che assicura la riservatezza dell'identità del segnalante, delle persone coinvolte e del contenuto"],["Canale interno orale","Linea telefonica dedicata o, su richiesta, incontro diretto entro termine ragionevole, con verbalizzazione previo consenso"],["Canale esterno","Ricorso al canale ANAC nei casi previsti dalla legge"],["Divulgazione pubblica","Ammessa alle condizioni stabilite dalla normativa"]]},{"k":"p","t":"La gestione del canale interno è affidata all'organismo di vigilanza o a soggetto autonomo dedicato, con personale specificamente formato."},{"k":"p","t":"5. TRATTAMENTO DELLA SEGNALAZIONE"},{"k":"t","r":[["Adempimento","Termine"],["Avviso di ricevimento al segnalante","7 giorni dalla ricezione"],["Interlocuzione e richiesta di integrazioni","Nel corso dell'istruttoria"],["Riscontro motivato al segnalante","3 mesi dall'avviso di ricevimento"]]},{"k":"p","t":"L'istruttoria accerta la fondatezza dei fatti; se fondata, l'organismo propone i provvedimenti conseguenti e ne verifica l'attuazione. Le segnalazioni manifestamente infondate sono archiviate con motivazione."},{"k":"p","t":"6. RISERVATEZZA"},{"k":"p","t":"L'identità del segnalante e ogni elemento che consenta di risalirvi non possono essere rivelati senza il suo consenso espresso a soggetti diversi da quelli competenti a ricevere e dare seguito alle segnalazioni."},{"k":"p","t":"Nel procedimento disciplinare l'identità non può essere rivelata ove la contestazione sia fondata su accertamenti distinti e ulteriori rispetto alla segnalazione. Se la contestazione si fonda in tutto o in parte sulla segnalazione, l'identità può essere rivelata solo con consenso espresso e previa comunicazione al segnalante delle ragioni."},{"k":"p","t":"Le segnalazioni sono conservate per il tempo necessario e comunque non oltre cinque anni dal riscontro, con accesso limitato ai soggetti autorizzati."},{"k":"p","t":"7. DIVIETO DI RITORSIONE"},{"k":"p","t":"È vietata ogni ritorsione: licenziamento, sospensione, retrocessione, mancata promozione, mutamento di mansioni, trasferimento, modifica dell'orario, sospensione della formazione, note di demerito, adozione di misure disciplinari, coercizione, molestia, discriminazione, mancata conversione del contratto, mancato rinnovo, danno reputazionale, segnalazione impropria alle autorità, revoca di licenze o risoluzione anticipata di contratti di fornitura."},{"k":"p","t":"Gli atti ritorsivi sono nulli. Grava sull'ente l'onere di dimostrare che la misura adottata è motivata da ragioni estranee alla segnalazione."},{"k":"p","t":"Le tutele si estendono a facilitatori, colleghi e parenti del segnalante e agli enti a lui riconducibili."},{"k":"p","t":"8. RESPONSABILITÀ DEL SEGNALANTE"},{"k":"p","t":"Le tutele non operano quando sia accertata, anche con sentenza di primo grado, la responsabilità penale del segnalante per diffamazione o calunnia, o la sua responsabilità civile per dolo o colpa grave. In tal caso è irrogata una sanzione disciplinare."},{"k":"p","t":"9. INFORMAZIONE"},{"k":"p","t":"Le informazioni sui canali, sulle procedure e sulle tutele sono esposte nei luoghi di lavoro e pubblicate nella sezione dedicata del sito, in forma accessibile anche ai soggetti esterni legittimati."},{"k":"p","t":"10. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Avvisi di ricevimento entro 7 giorni","MOD-06.02","Trimestrale","100%"],["Riscontri resi entro 3 mesi","MOD-06.02","Trimestrale","100%"],["Casi di ritorsione accertati","MOD-06.03","Annuale","0"],["Destinatari informati sui canali","MOD-08.02","Annuale","100%"]]},{"k":"p","t":"11. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-06.01","Modulo di segnalazione","Contenuto della segnalazione, riservatezza, tutele"],["MOD-06.02","Registro delle segnalazioni","Ricezione, avviso, istruttoria, riscontro, esito, conservazione"],["MOD-06.03","Registro delle misure di tutela","Soggetti tutelati, monitoraggio, misure ritorsive contestate"],["MOD-06.04","Informativa sui canali di segnalazione","Avviso da esporre e pubblicare, in forma accessibile"]]}]},"MOG-PG-07":{"code":"MOG-PG-07","titolo":"SISTEMA DISCIPLINARE","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 2 lett. e) e art. 7 comma 4 lett. b)","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-07","","",""],["Codice:","MOG-PG-07","Revisione:","[Rev.]"],["Titolo:","SISTEMA DISCIPLINARE","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 2 lett. e) e art. 7 comma 4 lett. b)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le sanzioni applicabili in caso di violazione del modello, del codice etico e dei protocolli. L'esistenza e l'effettiva applicazione di un sistema disciplinare idoneo a sanzionare il mancato rispetto delle misure è condizione di efficace attuazione del modello."},{"k":"p","t":"Un sistema disciplinare mai applicato in presenza di violazioni accertate è, in sede di giudizio, un elemento a carico dell'ente."},{"k":"p","t":"2. PRINCIPI"},{"k":"p","t":"la sanzione è irrogata indipendentemente dall'esito del procedimento penale eventualmente instaurato;"},{"k":"p","t":"la sanzione è proporzionata alla gravità della violazione, valutata in ragione di intenzionalità, rilevanza degli obblighi violati, livello di responsabilità del soggetto, prevedibilità e gravità delle conseguenze, concorso di più soggetti, recidiva;"},{"k":"p","t":"è garantito il contraddittorio: contestazione scritta e specifica, termine per le giustificazioni, decisione motivata;"},{"k":"p","t":"sono rispettati lo Statuto dei lavoratori, il contratto collettivo applicato e le procedure ivi previste."},{"k":"p","t":"3. LAVORATORI SUBORDINATI NON DIRIGENTI"},{"k":"t","r":[["Violazione","Sanzione tipica"],["Inosservanza lieve di procedure o obblighi informativi, senza esposizione a rischio","Richiamo verbale"],["Inosservanza reiterata o non lieve di procedure","Richiamo scritto"],["Violazione di protocolli con esposizione a rischio, o recidiva nel richiamo scritto","Multa entro i limiti del contratto collettivo"],["Violazione che espone concretamente l'ente a responsabilità, o recidiva nella multa","Sospensione dal servizio e dalla retribuzione"],["Condotta diretta in modo univoco alla commissione di un reato presupposto, elusione fraudolenta dei protocolli, ritorsione accertata verso un segnalante","Licenziamento"]]},{"k":"p","t":"4. DIRIGENTI"},{"k":"p","t":"Alla violazione dei protocolli da parte dei dirigenti si applicano, in ragione della gravità e del particolare vincolo fiduciario, le misure previste dal contratto collettivo applicabile, fino al licenziamento. È valutata la revoca di deleghe e procure conferite."},{"k":"p","t":"5. AMMINISTRATORI E ORGANO DI CONTROLLO"},{"k":"p","t":"La violazione da parte di componenti dell'organo amministrativo è comunicata senza ritardo dall'organismo di vigilanza all'organo amministrativo e all'organo di controllo, per l'adozione dei provvedimenti di competenza: revoca di deleghe e procure, convocazione dell'assemblea per i provvedimenti sulla carica, azione di responsabilità."},{"k":"p","t":"Analogamente si procede per i componenti dell'organo di controllo, con comunicazione all'assemblea."},{"k":"p","t":"6. COLLABORATORI, AGENTI, CONSULENTI E CONTROPARTI CONTRATTUALI"},{"k":"p","t":"La violazione comporta, secondo la gravità e secondo quanto pattuito: diffida ad adempiere, applicazione della penale, sospensione dell'esecuzione, risoluzione del contratto per clausola risolutiva espressa, richiesta di risarcimento."},{"k":"p","t":"Le clausole necessarie sono inserite nei contratti secondo il MOD-09.03."},{"k":"p","t":"7. PROCEDIMENTO"},{"k":"t","r":[["Fase","Contenuto","Termine indicativo"],["1","Segnalazione o rilievo trasmesso alla funzione competente","Senza ritardo"],["2","Istruttoria e raccolta degli elementi","10 giorni"],["3","Contestazione scritta e specifica dell'addebito","Tempestiva"],["4","Termine per le giustificazioni scritte o orali","Non inferiore a 5 giorni"],["5","Decisione motivata e comunicazione","Nei termini di legge e di contratto"],["6","Registrazione e comunicazione all'organismo di vigilanza","Immediata"]]},{"k":"p","t":"8. TUTELA DEL SEGNALANTE"},{"k":"p","t":"Non costituisce violazione la segnalazione effettuata in buona fede o sulla base di ragionevole convinzione. È invece sanzionata, oltre alla ritorsione, la violazione dell'obbligo di riservatezza sull'identità del segnalante."},{"k":"p","t":"9. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Violazioni accertate cui è seguito un provvedimento","MOD-07.02","Annuale","100%"],["Provvedimenti comunicati all'organismo di vigilanza","MOD-07.02","Trimestrale","100%"],["Contestazioni con contraddittorio documentato","MOD-07.01","Annuale","100%"]]},{"k":"p","t":"10. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-07.01","Contestazione di addebito","Fatto contestato, protocollo violato, termine per le giustificazioni"],["MOD-07.02","Registro dei provvedimenti disciplinari","Soggetto, violazione, istruttoria, sanzione, comunicazione all'OdV"],["MOD-07.03","Provvedimento verso controparti contrattuali","Diffida, penale, risoluzione, risarcimento"]]}]},"MOG-PG-08":{"code":"MOG-PG-08","titolo":"FORMAZIONE, COMUNICAZIONE E DIFFUSIONE DEL MODELLO","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 e art. 7 comma 4","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-08","","",""],["Codice:","MOG-PG-08","Revisione:","[Rev.]"],["Titolo:","FORMAZIONE, COMUNICAZIONE E DIFFUSIONE DEL MODELLO","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 e art. 7 comma 4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità con cui il modello è portato a conoscenza dei destinatari e le attività formative necessarie a renderlo operante."},{"k":"p","t":"La conoscenza del modello è presupposto della sua efficace attuazione e della stessa applicabilità del sistema disciplinare: non si può sanzionare la violazione di una regola che non è stata comunicata."},{"k":"p","t":"2. DIFFUSIONE"},{"k":"t","r":[["Destinatario","Modalità","Evidenza"],["Personale in servizio","Consegna o accesso al modello e al codice etico, con dichiarazione di ricezione","MOD-01.03"],["Nuovi assunti","Consegna in sede di assunzione, con richiamo nella lettera di assunzione","MOD-01.03"],["Organo amministrativo e di controllo","Trasmissione integrale e sessione dedicata","MOD-08.03"],["Collaboratori, agenti e consulenti","Trasmissione del codice etico e della sintesi del modello, con clausola contrattuale","MOD-09.03"],["Fornitori e appaltatori","Codice etico e clausole 231 nei contratti","MOD-09.03"],["Pubblico","Pubblicazione del codice etico e dell'informativa sui canali di segnalazione sul sito","MOD-06.04"]]},{"k":"p","t":"3. PIANO FORMATIVO"},{"k":"t","r":[["Destinatari","Contenuti","Durata indicativa","Periodicità"],["Tutto il personale","Quadro normativo, responsabilità dell'ente, modello e codice etico, canali di segnalazione, sistema disciplinare","2 ore","All'ingresso e ogni 3 anni"],["Funzioni esposte a rischio","Protocolli della parte speciale pertinenti, casi concreti, indicatori di anomalia, condotte da tenere","4 ore","All'ingresso e ogni 2 anni"],["Dirigenti e responsabili di funzione","Contenuti precedenti, obblighi di flusso verso l'organismo, responsabilità di vigilanza sui sottoposti","4 ore","All'ingresso e ogni 2 anni"],["Organo amministrativo e di controllo","Responsabilità degli organi, esimente, adeguati assetti organizzativi","2 ore","Ogni 2 anni"],["Organismo di vigilanza","Aggiornamento normativo e giurisprudenziale, tecniche di verifica","Secondo necessità","Annuale"]]},{"k":"p","t":"4. CONTENUTI E METODO"},{"k":"p","t":"La formazione delle funzioni esposte è condotta su casi tratti dalla matrice reati-processi dell'ente. La trattazione astratta del decreto non produce comportamenti diversi; la discussione di una gara, di un affidamento o di un cantiere concreti sì."},{"k":"p","t":"È erogata verifica di apprendimento, il cui esito è registrato. La mancata partecipazione ingiustificata costituisce violazione del modello."},{"k":"p","t":"5. AGGIORNAMENTO STRAORDINARIO"},{"k":"p","t":"Sessioni di aggiornamento sono erogate a fronte di: modifiche significative del modello, introduzione di nuove fattispecie rilevanti per l'ente, esiti di verifiche o di procedimenti che abbiano evidenziato carenze di consapevolezza."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Personale formato nei termini del piano","MOD-08.02","Semestrale","100%"],["Funzioni esposte con formazione specifica valida","MOD-08.02","Semestrale","100%"],["Verifiche di apprendimento superate","MOD-08.02","Annuale","≥ 90%"],["Dichiarazioni di ricezione acquisite","MOD-01.03","Annuale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-08.01","Piano di formazione","Destinatari, contenuti, durata, periodicità, docenti"],["MOD-08.02","Registro della formazione","Sessioni erogate, partecipanti, verifica di apprendimento"],["MOD-08.03","Verbale di sessione formativa","Contenuti trattati, casi discussi, presenze"]]}]},"MOG-PG-09":{"code":"MOG-PG-09","titolo":"AGGIORNAMENTO DEL MODELLO E RAPPORTI CON I TERZI","fase":"Parte generale","rif":"D.Lgs. 231/2001, art. 6 comma 1 lett. b) e art. 7 comma 4 lett. a)","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PG-09","","",""],["Codice:","MOG-PG-09","Revisione:","[Rev.]"],["Titolo:","AGGIORNAMENTO DEL MODELLO E RAPPORTI CON I TERZI","",""],["Parte:","Parte generale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 6 comma 1 lett. b) e art. 7 comma 4 lett. a)","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di verifica dell'efficacia del modello, di sua modifica e aggiornamento, e i presidi applicabili ai rapporti con i terzi."},{"k":"p","t":"La cura dell'aggiornamento è affidata dalla legge all'organismo di vigilanza quanto alla proposta, e all'organo amministrativo quanto alla decisione: la ripartizione va rispettata, perché l'organismo che modifica autonomamente il modello finisce per vigilare su sé stesso."},{"k":"p","t":"2. VERIFICA DELL'EFFICACIA"},{"k":"t","r":[["Livello","Contenuto","Frequenza"],["Verifiche di primo livello","Controlli svolti dalle funzioni operative nell'ambito dei protocolli","Continua"],["Verifiche dell'organismo","Verifiche documentali e sul campo secondo il programma annuale, anche non annunciate","Secondo programma"],["Riesame di efficacia","Valutazione complessiva dell'idoneità e dell'efficace attuazione, con esito riferito all'organo amministrativo","Annuale"]]},{"k":"p","t":"3. CASI DI AGGIORNAMENTO OBBLIGATORIO"},{"k":"p","t":"modifiche legislative che incidano sul catalogo dei reati presupposto o sulla disciplina;"},{"k":"p","t":"mutamenti dell'attività, dell'assetto societario, dell'organigramma o del sistema di deleghe;"},{"k":"p","t":"apertura di nuove sedi, unità produttive o linee di attività;"},{"k":"p","t":"operazioni straordinarie: fusioni, scissioni, cessioni e conferimenti di azienda;"},{"k":"p","t":"commissione di reati presupposto o accertamento di violazioni significative del modello;"},{"k":"p","t":"rilievi dell'organismo di vigilanza, dell'autorità giudiziaria o di organi di vigilanza;"},{"k":"p","t":"esiti di verifiche che evidenzino l'inidoneità di protocolli."},{"k":"p","t":"4. PROCEDIMENTO"},{"k":"t","r":[["Fase","Responsabile"],["Proposta motivata di aggiornamento","Organismo di vigilanza"],["Istruttoria tecnica e redazione","Funzione competente, con il supporto dell'organismo"],["Approvazione","Organo amministrativo, con delibera"],["Comunicazione e formazione sui contenuti modificati","Funzione competente"],["Verifica dell'attuazione","Organismo di vigilanza"]]},{"k":"p","t":"Le modifiche meramente formali o attuative — aggiornamento di nominativi, recapiti, modulistica — possono essere adottate dal soggetto individuato nella delibera di adozione, con informativa all'organismo. Le modifiche sostanziali richiedono in ogni caso la delibera dell'organo amministrativo."},{"k":"p","t":"5. RAPPORTI CON I TERZI"},{"k":"p","t":"5.1 Qualifica"},{"k":"p","t":"I terzi che operano per conto o nell'interesse dell'ente sono qualificati prima dell'affidamento, con verifica proporzionata al rischio: regolarità dell'iscrizione, requisiti di ordine generale, assenza di condanne rilevanti, titolarità effettiva per gli affidamenti significativi, congruità del corrispettivo rispetto alla prestazione."},{"k":"p","t":"Sono soggetti a verifica rafforzata: agenti e intermediari, consulenti che curano rapporti con la pubblica amministrazione, appaltatori che operano nei luoghi di lavoro dell'ente, soggetti remunerati a percentuale sull'esito."},{"k":"p","t":"5.2 Clausole contrattuali"},{"k":"p","t":"Nei contratti sono inserite le clausole di cui al MOD-09.03: presa d'atto del codice etico e del modello; impegno ad astenersi da condotte rilevanti ai sensi del decreto; obbligo di informativa su procedimenti che coinvolgano il contraente; facoltà di verifica; divieto di ritorsione verso i segnalanti; clausola risolutiva espressa e penale."},{"k":"p","t":"5.3 Operazioni straordinarie"},{"k":"p","t":"In caso di operazioni straordinarie sono svolte verifiche sull'esistenza e sull'adeguatezza del modello del soggetto coinvolto e sull'esistenza di procedimenti in corso, e il modello è adeguato entro il termine stabilito dalla delibera."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Aggiornamenti deliberati entro 90 giorni dalla proposta","MOD-09.01","Annuale","≥ 90%"],["Riesame annuale di efficacia svolto","MOD-09.02","Annuale","Nei termini"],["Contratti con clausole 231 sul totale dei terzi qualificati","MOD-09.04","Semestrale","100%"],["Terzi a rischio con qualifica valida","MOD-09.04","Semestrale","100%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-09.01","Registro degli aggiornamenti del modello","Proposta, motivazione, istruttoria, delibera, attuazione"],["MOD-09.02","Verbale di riesame di efficacia","Elementi considerati, valutazione, criticità, decisioni"],["MOD-09.03","Clausole contrattuali 231","Articolato tipo per contratti con terzi"],["MOD-09.04","Registro dei terzi qualificati","Controparte, tipologia, verifiche, clausole, riesame"]]}]},"MOG-PS-A":{"code":"MOG-PS-A","titolo":"RAPPORTI CON LA PUBBLICA AMMINISTRAZIONE E CORRUZIONE","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 24, 25, 25-decies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-A","","",""],["Codice:","MOG-PS-A","Revisione:","[Rev.]"],["Titolo:","RAPPORTI CON LA PUBBLICA AMMINISTRAZIONE E CORRUZIONE","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 24, 25, 25-decies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["24","Malversazione e indebita percezione di erogazioni pubbliche, truffa aggravata in danno dello Stato, truffa per il conseguimento di erogazioni, frode informatica in danno dello Stato, frode nelle pubbliche forniture, turbata libertà del procedimento di scelta del contraente"],["25","Peculato, concussione, corruzione per l'esercizio della funzione e per atto contrario ai doveri d'ufficio, corruzione in atti giudiziari, induzione indebita, istigazione alla corruzione, corruzione di pubblici ufficiali stranieri, traffico di influenze illecite"],["25-decies","Induzione a non rendere dichiarazioni o a rendere dichiarazioni mendaci all'autorità giudiziaria"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i rapporti con soggetti pubblici e con incaricati di pubblico servizio, in qualsiasi forma e a qualsiasi titolo. È il protocollo di applicazione più ampia: la nozione di pubblica amministrazione comprende enti pubblici, società a controllo pubblico che non operino su base commerciale, autorità di vigilanza, organi ispettivi, enti previdenziali, autorità sanitarie e ambientali, e i loro funzionari a ogni livello."},{"k":"p","t":"La responsabilità dell'ente sussiste anche quando il vantaggio perseguito non si realizza e anche quando la condotta è tenuta da un terzo che agisce per conto dell'ente."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Partecipazione a gare, procedure di affidamento e trattative con enti pubblici","Commerciale, tecnica, legale, direzione"],["2","Esecuzione di contratti pubblici, varianti, riserve, subappalti e rendicontazioni","Tecnica, amministrazione, direzione lavori"],["3","Richiesta e gestione di contributi, finanziamenti agevolati, crediti d'imposta e incentivi","Amministrazione e finanza, direzione"],["4","Richiesta di autorizzazioni, licenze, permessi, concessioni e certificazioni","Tecnica, HSE, legale"],["5","Verifiche e ispezioni di organi di vigilanza, enti previdenziali e autorità","Funzione ispezionata, legale, HSE"],["6","Contenzioso e procedimenti giudiziari e amministrativi","Legale, direzione"],["7","Conferimento di incarichi a consulenti e intermediari che curano rapporti con soggetti pubblici","Direzione, acquisti, legale"],["8","Assunzioni e stipula di rapporti con soggetti segnalati da esponenti pubblici","Risorse umane, direzione"],["9","Omaggi, ospitalità, sponsorizzazioni e liberalità verso soggetti pubblici","Direzione, marketing, amministrazione"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"offrire, promettere o dare denaro, beni o altre utilità, anche per interposta persona, a pubblici ufficiali o incaricati di pubblico servizio, a loro familiari o a soggetti da essi indicati"},{"k":"p","t":"accettare o sollecitare richieste di utilità provenienti da soggetti pubblici, o darvi corso in qualsiasi forma"},{"k":"p","t":"effettuare pagamenti agevolativi per accelerare o assicurare atti dovuti"},{"k":"p","t":"presentare dichiarazioni, documenti o dati non veritieri o incompleti per ottenere erogazioni, autorizzazioni o aggiudicazioni"},{"k":"p","t":"destinare somme ottenute a titolo di contributo o finanziamento a finalità diverse da quelle per cui sono state concesse"},{"k":"p","t":"alterare il funzionamento di sistemi informativi pubblici o intervenire senza titolo su dati in essi contenuti"},{"k":"p","t":"influenzare le determinazioni di funzionari pubblici mediante promesse di assunzione, incarichi o vantaggi a favore loro o di persone a loro vicine"},{"k":"p","t":"vantare relazioni con pubblici ufficiali per farsi dare denaro o altra utilità come prezzo della mediazione"},{"k":"p","t":"esercitare pressioni su dipendenti o terzi affinché non rendano dichiarazioni o rendano dichiarazioni mendaci all'autorità giudiziaria"},{"k":"p","t":"affidare incarichi a consulenti o intermediari privi di struttura e competenze adeguate, o remunerati in misura non proporzionata alla prestazione"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","Ogni rapporto con soggetti pubblici è gestito da personale espressamente incaricato, mai da un singolo in autonomia nelle fasi decisive","Nomina o delega scritta"],["2","Le riunioni e i sopralluoghi con funzionari pubblici sono verbalizzati e il verbale è conservato","MOD-PS-A.01"],["3","La documentazione trasmessa a soggetti pubblici è verificata quanto a completezza e veridicità da funzione diversa da quella che la predispone","Visto di verifica"],["4","Le dichiarazioni sostitutive rese all'esterno sono rilasciate solo da soggetti muniti dei relativi poteri","Registro deleghe MOD-02.01"],["5","I contributi e i finanziamenti ottenuti sono gestiti su contabilità separata, con rendicontazione documentata dell'impiego","Contabilità di progetto"],["6","Gli incarichi a consulenti e intermediari che curano rapporti con soggetti pubblici sono affidati previa qualifica e con contratto scritto che indichi prestazione, corrispettivo e divieto di condotte rilevanti","MOD-09.03, MOD-09.04"],["7","Il corrispettivo di intermediari è verificato quanto a proporzionalità rispetto alla prestazione resa e non è pattuito in percentuale sull'esito, salvo motivata eccezione autorizzata dalla direzione","Analisi di congruità"],["8","Omaggi, ospitalità e liberalità verso soggetti pubblici sono soggetti ad autorizzazione preventiva e a registrazione, con divieto assoluto in pendenza di procedure","MOD-PS-A.02"],["9","Le assunzioni di soggetti segnalati da esponenti pubblici seguono l'ordinario processo di selezione, con motivazione documentata della scelta","Fascicolo di selezione"],["10","Ispezioni e verifiche sono gestite con presenza di almeno due addetti e verbalizzazione, con informativa immediata alla direzione e all'organismo","MOD-PS-A.01"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"elenco delle gare e delle procedure cui l'ente ha partecipato, con esito"},{"k":"p","t":"contributi e finanziamenti pubblici richiesti e ottenuti, con stato di rendicontazione"},{"k":"p","t":"incarichi conferiti a consulenti e intermediari che curano rapporti con soggetti pubblici"},{"k":"p","t":"omaggi e liberalità verso soggetti pubblici sopra soglia"},{"k":"p","t":"ispezioni, accessi e richieste di autorità, senza ritardo"},{"k":"p","t":"procedimenti penali o amministrativi che coinvolgano l'ente o i suoi esponenti, senza ritardo"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-A.01","Verbale di incontro o ispezione con soggetti pubblici","Data, soggetti, oggetto, documenti consegnati, esito"],["MOD-PS-A.02","Registro omaggi, ospitalità e liberalità","Beneficiario, natura pubblica, valore, autorizzazione, occasione"],["MOD-PS-A.03","Scheda di gara e affidamento pubblico","Procedura, ruoli, documentazione, verifiche, esito"]]}]},"MOG-PS-B":{"code":"MOG-PS-B","titolo":"REATI SOCIETARI, CORRUZIONE TRA PRIVATI E ABUSI DI MERCATO","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 25-ter, 25-sexies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-B","","",""],["Codice:","MOG-PS-B","Revisione:","[Rev.]"],["Titolo:","REATI SOCIETARI, CORRUZIONE TRA PRIVATI E ABUSI DI MERCATO","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 25-ter, 25-sexies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-ter","False comunicazioni sociali, impedito controllo, indebita restituzione dei conferimenti, illegale ripartizione degli utili, operazioni in pregiudizio dei creditori, formazione fittizia del capitale, corruzione tra privati e istigazione alla corruzione tra privati, illecita influenza sull'assemblea, aggiotaggio, ostacolo alle funzioni delle autorità di vigilanza"],["25-sexies","Abuso di informazioni privilegiate e manipolazione del mercato, per gli enti che vi siano esposti"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina la formazione del bilancio e delle comunicazioni sociali, la tutela dell'integrità del capitale, i rapporti con l'organo di controllo e con il revisore, e i rapporti commerciali con esponenti di altre imprese private."},{"k":"p","t":"La corruzione tra privati è la fattispecie che più frequentemente sfugge all'attenzione degli enti che non hanno rapporti con la pubblica amministrazione: riguarda direttamente le funzioni acquisti e commerciale."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Formazione del bilancio, delle situazioni infrannuali e delle comunicazioni sociali","Amministrazione e finanza, direzione, organo amministrativo"],["2","Valutazioni di poste stimate: crediti, magazzino, lavori in corso, fondi, avviamento","Amministrazione e finanza, tecnica"],["3","Rapporti con l'organo di controllo, il revisore e le autorità di vigilanza","Amministrazione e finanza, direzione"],["4","Operazioni sul capitale, distribuzione di utili e riserve, operazioni straordinarie","Direzione, legale, organo amministrativo"],["5","Operazioni con parti correlate e infragruppo","Amministrazione e finanza, direzione"],["6","Negoziazione di contratti di acquisto e di vendita con imprese private","Acquisti, commerciale"],["7","Selezione dei fornitori e gestione degli sconti, premi e provvigioni","Acquisti, commerciale"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"esporre fatti materiali non rispondenti al vero od omettere fatti la cui comunicazione è imposta dalla legge, nelle comunicazioni sociali"},{"k":"p","t":"occultare o alterare documenti, o porre in essere condotte che impediscano o ostacolino il controllo dell'organo di controllo, del revisore o delle autorità di vigilanza"},{"k":"p","t":"restituire conferimenti, liberare dall'obbligo di eseguirli o ripartire utili non effettivamente conseguiti, fuori dai casi consentiti"},{"k":"p","t":"formare o aumentare fittiziamente il capitale sociale"},{"k":"p","t":"porre in essere operazioni che cagionino danno ai creditori, o compiere atti simulati o fraudolenti diretti a influenzare l'assemblea"},{"k":"p","t":"diffondere notizie false o compiere operazioni simulate idonee ad alterare il prezzo di strumenti finanziari"},{"k":"p","t":"dare o promettere denaro o altra utilità ad amministratori, dirigenti, responsabili o dipendenti di altre imprese perché compiano od omettano atti in violazione dei loro obblighi"},{"k":"p","t":"sollecitare o ricevere, per sé o per altri, denaro o altra utilità da fornitori, clienti o altre controparti private, in violazione dei propri obblighi"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","Il processo di formazione del bilancio è disciplinato con calendario, responsabilità e punti di verifica, e la documentazione a supporto delle poste stimate è conservata","Fascicolo di bilancio"],["2","Le valutazioni discrezionali sono motivate per iscritto da chi le propone e verificate da funzione diversa","MOD-PS-B.01"],["3","Le richieste dell'organo di controllo e del revisore ricevono riscontro completo e tempestivo; ogni difficoltà di reperimento è comunicata anziché omessa","Corrispondenza protocollata"],["4","Le operazioni con parti correlate sono preventivamente identificate, motivate quanto a interesse dell'ente e a congruità delle condizioni, e deliberate dall'organo competente","MOD-PS-B.02"],["5","Le operazioni sul capitale e sulle riserve sono precedute da parere tecnico e da verifica della sussistenza dei presupposti di legge","Verbale dell'organo amministrativo"],["6","Sconti, premi, provvigioni e contributi promozionali seguono un listino o una policy approvata; le deroghe sono autorizzate e motivate","MOD-02.03"],["7","È vietata ogni utilità personale a favore di esponenti di controparti private; omaggi e ospitalità seguono le soglie del MOD-PS-A.02","MOD-PS-A.02"],["8","La selezione dei fornitori avviene su base comparativa documentata; l'affidamento diretto è ammesso solo nei casi previsti e con motivazione","Fascicolo di acquisto"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"bozza di bilancio e relazione sulle poste stimate rilevanti, prima dell'approvazione"},{"k":"p","t":"rilievi dell'organo di controllo, del revisore o delle autorità di vigilanza"},{"k":"p","t":"operazioni con parti correlate e operazioni straordinarie deliberate"},{"k":"p","t":"deroghe alle condizioni commerciali standard sopra soglia"},{"k":"p","t":"segnalazioni relative a richieste di utilità da parte di controparti private"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-B.01","Scheda di motivazione delle poste stimate","Posta, criterio, elementi a supporto, proponente, verificatore"],["MOD-PS-B.02","Registro delle operazioni con parti correlate","Controparte, natura, condizioni, interesse dell'ente, delibera"]]}]},"MOG-PS-C":{"code":"MOG-PS-C","titolo":"SALUTE E SICUREZZA SUL LAVORO","fase":"Parte speciale","rif":"D.Lgs. 231/2001, art. 25-septies · D.Lgs. 81/2008, art. 30","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-C","","",""],["Codice:","MOG-PS-C","Revisione:","[Rev.]"],["Titolo:","SALUTE E SICUREZZA SUL LAVORO","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 25-septies · D.Lgs. 81/2008, art. 30","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-septies","Omicidio colposo commesso con violazione delle norme sulla tutela della salute e sicurezza sul lavoro"],["25-septies","Lesioni personali gravi o gravissime commesse con violazione delle medesime norme"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i presidi diretti a prevenire l'omicidio colposo e le lesioni gravi o gravissime commessi con violazione delle norme antinfortunistiche. È la fattispecie che espone qualunque ente, indipendentemente dal settore e dalla dimensione, e l'unica in cui il vantaggio per l'ente consiste tipicamente nel risparmio di spesa o nel guadagno di tempo."},{"k":"p","t":"Il modello, per questa parte, deve assicurare un sistema aziendale per l'adempimento degli obblighi giuridici indicati dall'art. 30 del D.Lgs. 81/2008."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Valutazione dei rischi e aggiornamento del documento","Datore di lavoro, RSPP, medico competente"],["2","Gestione degli appalti, dei subappalti e dei lavori in regime di interferenza","Committente, RSPP, tecnica, acquisti"],["3","Acquisto, manutenzione e verifica di attrezzature, macchine e impianti","Manutenzione, acquisti, produzione"],["4","Gestione dei dispositivi di protezione individuale e collettiva","RSPP, preposti, magazzino"],["5","Formazione, informazione e addestramento dei lavoratori","Risorse umane, RSPP, preposti"],["6","Sorveglianza sanitaria e gestione delle prescrizioni del medico competente","Medico competente, risorse umane"],["7","Gestione delle emergenze e delle prove di evacuazione","RSPP, addetti alle emergenze"],["8","Vigilanza dei preposti sull'osservanza delle disposizioni","Preposti, capireparto"],["9","Gestione di infortuni, mancati infortuni e non conformità","RSPP, direzione, medico competente"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"dare corso a lavorazioni in assenza della valutazione dei rischi o in difformità dalle misure ivi previste"},{"k":"p","t":"impartire o consentire l'esecuzione di attività in condizioni di pericolo grave e immediato"},{"k":"p","t":"utilizzare attrezzature prive di marcatura, di verifica periodica o con dispositivi di sicurezza manomessi o esclusi"},{"k":"p","t":"adibire lavoratori a mansioni senza la formazione, l'addestramento e l'idoneità sanitaria richiesti"},{"k":"p","t":"affidare lavori a imprese o lavoratori autonomi senza la verifica dell'idoneità tecnico-professionale"},{"k":"p","t":"omettere la cooperazione e il coordinamento nei casi di interferenza, o operare senza il documento previsto"},{"k":"p","t":"imporre ritmi, tempi o modalità di esecuzione incompatibili con il rispetto delle misure di sicurezza"},{"k":"p","t":"omettere o ritarda
