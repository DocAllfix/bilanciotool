re la segnalazione di infortuni, mancati infortuni e condizioni di rischio rilevate"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","La valutazione dei rischi è aggiornata nei casi previsti e comunque riesaminata annualmente; le misure ne discendono con responsabili e termini","DVR e piano di miglioramento"],["2","L'idoneità tecnico-professionale delle imprese affidatarie è verificata prima dell'affidamento, con documentazione conservata","MOD-PS-C.01"],["3","Nei casi di interferenza sono redatti e sottoscritti i documenti di coordinamento prima dell'inizio dei lavori","DUVRI o PSC"],["4","Le verifiche periodiche di attrezzature e impianti sono programmate con scadenzario e l'utilizzo è inibito in caso di scadenza","Scadenzario manutenzioni"],["5","La consegna dei dispositivi di protezione è registrata nominativamente e la vigilanza sull'uso è compito documentato dei preposti","Registro consegna DPI"],["6","La formazione è erogata prima dell'adibizione alla mansione; il lavoratore non formato non accede alla lavorazione","MOD-08.02"],["7","Le prescrizioni e le limitazioni del medico competente sono comunicate ai preposti e la loro attuazione è verificata","Fascicolo sanitario"],["8","Infortuni e mancati infortuni sono analizzati quanto alle cause, con azioni conseguenti e verifica di efficacia","MOD-PS-C.02"],["9","Le prove di emergenza sono eseguite con la periodicità prevista e verbalizzate","Verbale di prova"],["10","Il budget destinato alla sicurezza è definito e distinto, e il suo utilizzo è rendicontato","Bilancio di esercizio"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"infortuni e mancati infortuni, con analisi delle cause, senza ritardo per gli eventi gravi"},{"k":"p","t":"esiti di verifiche e prescrizioni degli organi di vigilanza"},{"k":"p","t":"aggiornamenti della valutazione dei rischi e stato del piano di miglioramento"},{"k":"p","t":"formazione erogata e posizioni scoperte"},{"k":"p","t":"elenco degli appalti in corso presso i luoghi di lavoro dell'ente e stato dei documenti di coordinamento"},{"k":"p","t":"spesa sostenuta per la sicurezza rispetto al budget"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-C.01","Verifica dell'idoneità tecnico-professionale dell'impresa","Documentazione richiesta, esito, validità"],["MOD-PS-C.02","Analisi di infortunio o mancato infortunio","Dinamica, cause, misure adottate, verifica di efficacia"]]}]},"MOG-PS-D":{"code":"MOG-PS-D","titolo":"REATI AMBIENTALI","fase":"Parte speciale","rif":"D.Lgs. 231/2001, art. 25-undecies · D.Lgs. 152/2006","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-D","","",""],["Codice:","MOG-PS-D","Revisione:","[Rev.]"],["Titolo:","REATI AMBIENTALI","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, art. 25-undecies · D.Lgs. 152/2006","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-undecies","Inquinamento ambientale e disastro ambientale, anche colposi"],["25-undecies","Attività organizzate per il traffico illecito di rifiuti, gestione non autorizzata di rifiuti, deposito incontrollato, miscelazione, falsità nella documentazione di trasporto"],["25-undecies","Scarichi di acque reflue industriali non autorizzati o in violazione dei limiti, superamento dei valori di emissione in atmosfera"],["25-undecies","Omessa bonifica di siti, uccisione o detenzione di esemplari di specie protette, inquinamento provocato da navi"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i presidi relativi alla gestione dei rifiuti, degli scarichi, delle emissioni, delle sostanze pericolose e degli adempimenti autorizzativi. Anche in questo caso il vantaggio per l'ente consiste tipicamente nel risparmio dei costi di corretto smaltimento o di adeguamento impiantistico."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Qualifica dei fornitori di servizi di gestione dei rifiuti e verifica delle autorizzazioni","HSE, acquisti, magazzino"],["2","Classificazione, deposito temporaneo e movimentazione dei rifiuti","Produzione, HSE, magazzino"],["3","Compilazione e conservazione della documentazione di trasporto e dei registri","HSE, amministrazione"],["4","Gestione degli scarichi idrici e degli impianti di trattamento","Manutenzione, HSE"],["5","Gestione delle emissioni in atmosfera e dei relativi controlli","Manutenzione, HSE"],["6","Gestione di serbatoi, sostanze pericolose e presidi antisversamento","Produzione, HSE"],["7","Mantenimento e rinnovo delle autorizzazioni ambientali","HSE, legale"],["8","Gestione di eventi accidentali con potenziale impatto ambientale","HSE, direzione"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"conferire rifiuti a soggetti privi delle autorizzazioni necessarie o per tipologie non ricomprese nell'autorizzazione"},{"k":"p","t":"attribuire ai rifiuti codici o caratteristiche di pericolo non corrispondenti alla loro effettiva natura"},{"k":"p","t":"miscelare rifiuti fuori dai casi consentiti o effettuare depositi in difformità dalle condizioni previste"},{"k":"p","t":"certificare dati non veritieri nella documentazione di trasporto o nei registri, o omettere registrazioni dovute"},{"k":"p","t":"effettuare scarichi in assenza di autorizzazione, in difformità da essa o superando i valori limite"},{"k":"p","t":"esercitare impianti con emissioni in atmosfera in assenza di titolo o oltre i limiti prescritti"},{"k":"p","t":"omettere gli interventi di bonifica prescritti o ritardarne l'avvio"},{"k":"p","t":"omettere o ritardare la comunicazione alle autorità di eventi con potenziale impatto ambientale"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","I fornitori di servizi ambientali sono qualificati previa verifica delle autorizzazioni, delle iscrizioni all'albo e della loro validità, con riverifica alle scadenze","MOD-PS-D.01"],["2","La classificazione dei rifiuti è effettuata da soggetto competente e supportata, dove necessario, da analisi di laboratorio conservate","Rapporti di prova"],["3","Il deposito temporaneo è organizzato per aree identificate, con controllo dei tempi e delle quantità","Planimetria e registro"],["4","La documentazione di trasporto è verificata prima del conferimento e la quarta copia è controllata al ritorno, con sollecito in caso di mancato rientro","Registro carico e scarico"],["5","Le scadenze autorizzative sono gestite con scadenzario e le istanze di rinnovo sono presentate nei termini di legge","MOD-PS-D.02"],["6","Gli autocontrolli su scarichi ed emissioni sono programmati e i superamenti generano azione immediata e comunicazione","Referti di analisi"],["7","Gli impianti di trattamento e abbattimento sono soggetti a manutenzione programmata registrata","Scadenzario manutenzioni"],["8","Gli eventi accidentali sono gestiti secondo procedura di emergenza, con comunicazione alle autorità nei termini","MOD-PS-D.03"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"scadenzario delle autorizzazioni ambientali e stato dei rinnovi"},{"k":"p","t":"non conformità rilevate negli autocontrolli e azioni adottate"},{"k":"p","t":"esiti di controlli e prescrizioni degli enti, senza ritardo"},{"k":"p","t":"eventi accidentali con potenziale impatto ambientale, senza ritardo"},{"k":"p","t":"elenco dei fornitori di servizi ambientali con stato della qualifica"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-D.01","Qualifica del fornitore di servizi ambientali","Autorizzazioni, iscrizioni, validità, riverifica"],["MOD-PS-D.02","Scadenzario delle autorizzazioni ambientali","Titolo, ente, scadenza, stato del rinnovo"],["MOD-PS-D.03","Rapporto su evento ambientale","Dinamica, misure immediate, comunicazioni, azioni"]]}]},"MOG-PS-E":{"code":"MOG-PS-E","titolo":"RICETTAZIONE, RICICLAGGIO, AUTORICICLAGGIO E STRUMENTI DI PAGAMENTO","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 25-octies, 25-octies.1","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-E","","",""],["Codice:","MOG-PS-E","Revisione:","[Rev.]"],["Titolo:","RICETTAZIONE, RICICLAGGIO, AUTORICICLAGGIO E STRUMENTI DI PAGAMENTO","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 25-octies, 25-octies.1","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-octies","Ricettazione, riciclaggio, impiego di denaro, beni o utilità di provenienza illecita, autoriciclaggio"],["25-octies.1","Indebito utilizzo e falsificazione di strumenti di pagamento diversi dai contanti, trasferimento fraudolento di valori"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i presidi relativi ai flussi finanziari, ai rapporti con controparti e all'impiego di proventi. L'autoriciclaggio rileva anche in assenza di rapporti con la criminalità organizzata: è sufficiente l'impiego in attività economiche di proventi di un delitto non colposo commesso dall'ente stesso, tipicamente un reato tributario."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Gestione degli incassi e dei pagamenti e scelta degli strumenti di regolamento","Amministrazione e finanza"],["2","Acquisto di beni, servizi e materiali, in particolare da controparti nuove o non tracciabili","Acquisti, magazzino"],["3","Gestione della cassa contanti, delle carte aziendali e delle note spese","Amministrazione e finanza"],["4","Operazioni infragruppo, finanziamenti soci e apporti di capitale","Direzione, amministrazione e finanza"],["5","Investimenti, acquisizioni immobiliari e operazioni straordinarie","Direzione, legale"],["6","Rapporti con controparti estere e con soggetti in giurisdizioni a fiscalità privilegiata","Commerciale, amministrazione"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"acquistare, ricevere od occultare beni provenienti da delitto, o intromettersi nel farli acquistare o ricevere"},{"k":"p","t":"sostituire o trasferire denaro, beni o altre utilità provenienti da delitto, o compiere operazioni idonee a ostacolarne l'identificazione della provenienza"},{"k":"p","t":"impiegare in attività economiche o finanziarie proventi di delitti commessi dall'ente o dai suoi esponenti"},{"k":"p","t":"eseguire o ricevere pagamenti in contanti oltre i limiti di legge o oltre la soglia interna stabilita"},{"k":"p","t":"eseguire pagamenti a soggetti diversi dalla controparte contrattuale o su conti in paesi estranei al rapporto"},{"k":"p","t":"accettare o utilizzare strumenti di pagamento di provenienza non verificata o intestati a soggetti terzi"},{"k":"p","t":"instaurare rapporti con controparti che rifiutino di fornire gli elementi identificativi richiesti"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","Ogni pagamento è tracciabile e riferito a un rapporto contrattuale documentato, con corrispondenza tra beneficiario e controparte","Ciclo passivo"],["2","È fissata e presidiata una soglia interna per l'uso del contante, comunque non superiore ai limiti di legge","MOD-02.02"],["3","Le controparti nuove sono identificate con acquisizione della visura, della titolarità effettiva per gli affidamenti significativi e dei dati bancari","MOD-09.04"],["4","Le richieste di pagamento su conti diversi da quelli comunicati sono verificate con la controparte attraverso un canale indipendente prima dell'esecuzione","MOD-PS-E.01"],["5","Sono presidiati gli indicatori di anomalia: pagamenti frazionati, sconti anomali, controparti prive di struttura, prestazioni non documentabili, giurisdizioni non coerenti con l'operazione","MOD-PS-E.01"],["6","Le operazioni infragruppo e i finanziamenti soci sono deliberati e documentati quanto a causa e condizioni","Verbali e contratti"],["7","Le note spese sono verificate con obbligo di giustificativo nominativo e divieto di rimborsi forfetari non previsti","Fascicolo note spese"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"operazioni sopra soglia e pagamenti verso l'estero"},{"k":"p","t":"anomalie rilevate nei flussi finanziari e operazioni sospese o rifiutate"},{"k":"p","t":"movimentazioni di cassa contanti e saldi periodici"},{"k":"p","t":"operazioni infragruppo, finanziamenti soci e operazioni straordinarie"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-E.01","Scheda di anomalia finanziaria","Operazione, indicatori rilevati, verifiche, decisione"],["MOD-PS-E.02","Verifica della controparte e della titolarità effettiva","Dati identificativi, titolari effettivi, coordinate bancarie, esito"]]}]},"MOG-PS-F":{"code":"MOG-PS-F","titolo":"DELITTI INFORMATICI, TRATTAMENTO ILLECITO DI DATI E DIRITTO D'AUTORE","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 24-bis, 25-novies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-F","","",""],["Codice:","MOG-PS-F","Revisione:","[Rev.]"],["Titolo:","DELITTI INFORMATICI, TRATTAMENTO ILLECITO DI DATI E DIRITTO D'AUTORE","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 24-bis, 25-novies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["24-bis","Accesso abusivo a sistema informatico o telematico, detenzione e diffusione abusiva di codici di accesso, intercettazione e interruzione illecita di comunicazioni, danneggiamento di dati, programmi e sistemi, falsità in documenti informatici, estorsione informatica"],["25-novies","Duplicazione e diffusione abusiva di programmi per elaboratore, banche dati e opere dell'ingegno, elusione di misure tecnologiche di protezione"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina l'utilizzo dei sistemi informativi, la gestione degli accessi e delle credenziali, l'impiego di software e contenuti protetti e la sicurezza dei dati. Il rischio non riguarda solo le funzioni tecniche: la maggior parte delle condotte rilevanti è tenuta da utenti ordinari."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Gestione delle utenze, delle credenziali e dei profili autorizzativi","Sistemi informativi, risorse umane"],["2","Accesso a sistemi e banche dati di terzi, clienti, fornitori e pubbliche amministrazioni","Tutte le funzioni operative"],["3","Acquisto, installazione e gestione delle licenze software","Sistemi informativi, acquisti"],["4","Utilizzo di materiali, immagini, testi e contenuti di terzi in prodotti e comunicazioni","Marketing, commerciale, tecnica"],["5","Sviluppo, manutenzione e amministrazione dei sistemi, anche da parte di terzi","Sistemi informativi, fornitori"],["6","Gestione degli incidenti di sicurezza e delle violazioni di dati","Sistemi informativi, legale, direzione"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"accedere a sistemi informatici o telematici altrui senza titolo, o mantenervisi contro la volontà del titolare"},{"k":"p","t":"utilizzare credenziali altrui, o cedere a terzi le proprie, o detenere e diffondere codici di accesso non propri"},{"k":"p","t":"installare o utilizzare strumenti diretti a intercettare comunicazioni o ad alterare il funzionamento di sistemi"},{"k":"p","t":"cancellare, alterare o rendere inservibili dati, informazioni o programmi altrui"},{"k":"p","t":"alterare documenti informatici o dati aventi efficacia probatoria"},{"k":"p","t":"installare o utilizzare software privo di licenza valida, o eccedere il numero di installazioni consentite"},{"k":"p","t":"duplicare, diffondere o utilizzare opere protette, immagini, testi, font e banche dati senza titolo"},{"k":"p","t":"eludere misure tecnologiche di protezione di opere o sistemi"},{"k":"p","t":"omettere o ritardare la segnalazione di incidenti di sicurezza e di accessi anomali rilevati"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","Le utenze sono nominative, i profili sono assegnati secondo il principio del minimo privilegio e sono revocati alla cessazione del rapporto entro il giorno lavorativo successivo","MOD-PS-F.01"],["2","Le utenze amministrative sono nominative, tracciate e riesaminate almeno semestralmente","Riesame degli accessi"],["3","Il registro delle licenze software è mantenuto e riconciliato periodicamente con le installazioni effettive","MOD-PS-F.02"],["4","L'installazione di software da parte degli utenti è tecnicamente inibita salvo autorizzazione","Configurazione dei sistemi"],["5","L'utilizzo di contenuti di terzi in prodotti e comunicazioni avviene previa verifica del titolo, con conservazione delle licenze","Fascicolo licenze"],["6","Gli accessi a sistemi di terzi avvengono solo nell'ambito e nei limiti autorizzati per iscritto dal titolare","Autorizzazioni scritte"],["7","I fornitori con accesso ai sistemi sono vincolati contrattualmente e i loro accessi sono tracciati e limitati nel tempo","MOD-09.03"],["8","Gli incidenti di sicurezza sono registrati, classificati e gestiti secondo procedura, con comunicazione ai soggetti competenti nei termini","MOD-PS-F.03"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"incidenti di sicurezza e accessi anomali rilevati, senza ritardo per quelli di impatto rilevante"},{"k":"p","t":"esiti del riesame periodico dei profili autorizzativi"},{"k":"p","t":"stato della riconciliazione delle licenze software"},{"k":"p","t":"contestazioni ricevute in materia di diritto d'autore o di utilizzo di contenuti"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-F.01","Registro delle utenze e dei profili","Utente, profilo, data di attivazione e revoca, riesame"],["MOD-PS-F.02","Registro delle licenze software","Prodotto, licenze possedute, installazioni rilevate, scostamento"],["MOD-PS-F.03","Rapporto su incidente di sicurezza","Evento, impatto, misure, comunicazioni, azioni"]]}]},"MOG-PS-G":{"code":"MOG-PS-G","titolo":"REATI TRIBUTARI E CONTRABBANDO","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 25-quinquiesdecies, 25-sexiesdecies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-G","","",""],["Codice:","MOG-PS-G","Revisione:","[Rev.]"],["Titolo:","REATI TRIBUTARI E CONTRABBANDO","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 25-quinquiesdecies, 25-sexiesdecies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-quinquiesdecies","Dichiarazione fraudolenta mediante uso di fatture o altri documenti per operazioni inesistenti, dichiarazione fraudolenta mediante altri artifici, emissione di fatture per operazioni inesistenti, occultamento o distruzione di documenti contabili, sottrazione fraudolenta al pagamento di imposte, e nei casi previsti dichiarazione infedele e omessa dichiarazione"],["25-sexiesdecies","Reati di contrabbando previsti dalla normativa doganale"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i presidi relativi alla fatturazione, alla tenuta delle scritture contabili, alle dichiarazioni fiscali e agli adempimenti doganali. Il collegamento con l'autoriciclaggio è diretto: il risparmio d'imposta impiegato nell'attività economica integra il presupposto dell'art. 25-octies."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Ciclo attivo: emissione delle fatture e riconoscimento dei ricavi","Commerciale, amministrazione"],["2","Ciclo passivo: ricezione, verifica e registrazione delle fatture di acquisto","Acquisti, amministrazione"],["3","Gestione delle prestazioni immateriali: consulenze, servizi infragruppo, royalties","Direzione, amministrazione"],["4","Predisposizione e presentazione delle dichiarazioni fiscali","Amministrazione e finanza, consulente fiscale"],["5","Tenuta e conservazione delle scritture contabili e dei documenti","Amministrazione e finanza"],["6","Operazioni con l'estero, importazioni ed esportazioni, classificazione doganale e origine","Logistica, amministrazione, spedizionieri"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"registrare o utilizzare fatture o documenti relativi a operazioni in tutto o in parte inesistenti"},{"k":"p","t":"emettere fatture o documenti per operazioni inesistenti al fine di consentire a terzi l'evasione"},{"k":"p","t":"indicare nelle dichiarazioni elementi attivi inferiori al reale o elementi passivi fittizi"},{"k":"p","t":"occultare o distruggere documenti contabili in modo da non consentire la ricostruzione dei redditi o del volume d'affari"},{"k":"p","t":"compiere atti simulati o fraudolenti sui propri o altrui beni al fine di sottrarsi al pagamento di imposte"},{"k":"p","t":"dichiarare in dogana qualità, quantità, origine o valore delle merci difformi dal reale"},{"k":"p","t":"corrispondere compensi per prestazioni non rese o non documentabili quanto a contenuto e utilità"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","Le fatture di acquisto sono verificate quanto a corrispondenza con ordine, contratto ed effettiva esecuzione della prestazione, con benestare della funzione richiedente","Ciclo passivo"],["2","Le prestazioni immateriali sono supportate da contratto scritto, da evidenza dell'attività svolta e da valutazione di congruità del corrispettivo","MOD-PS-G.01"],["3","Il riconoscimento dei ricavi segue criteri definiti e la documentazione di supporto è conservata","Fascicolo di bilancio"],["4","Le dichiarazioni fiscali sono predisposte con riconciliazione documentata rispetto alle scritture e riesaminate prima dell'invio","Fascicolo dichiarativo"],["5","Le scritture e i documenti sono conservati secondo i termini di legge, con presidi contro perdita e alterazione","Sistema di conservazione"],["6","La classificazione doganale, l'origine e il valore delle merci sono determinati con documentazione a supporto; il ricorso a spedizionieri non trasferisce la responsabilità dell'ente","MOD-PS-G.02"],["7","Gli avvisi, i questionari e le verifiche dell'amministrazione finanziaria sono gestiti dalla funzione competente con informativa alla direzione e all'organismo","MOD-05.01"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"esiti di verifiche fiscali e doganali, avvisi e questionari ricevuti, senza ritardo"},{"k":"p","t":"elenco delle prestazioni immateriali sopra soglia con evidenza dell'esecuzione"},{"k":"p","t":"riconciliazioni tra dichiarazioni e scritture"},{"k":"p","t":"contestazioni in materia doganale e di origine delle merci"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-G.01","Scheda di prestazione immateriale","Contratto, attività svolta, evidenze, congruità del corrispettivo"],["MOD-PS-G.02","Scheda di operazione doganale","Classificazione, origine, valore, documentazione, spedizioniere"]]}]},"MOG-PS-H":{"code":"MOG-PS-H","titolo":"TUTELA DELLA PERSONA E DEL LAVORO, CRIMINALITÀ ORGANIZZATA","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 25-quinquies, 25-duodecies, 24-ter, 25-terdecies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-H","","",""],["Codice:","MOG-PS-H","Revisione:","[Rev.]"],["Titolo:","TUTELA DELLA PERSONA E DEL LAVORO, CRIMINALITÀ ORGANIZZATA","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 25-quinquies, 25-duodecies, 24-ter, 25-terdecies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-quinquies","Riduzione o mantenimento in schiavitù, tratta di persone, intermediazione illecita e sfruttamento del lavoro"],["25-duodecies","Impiego di cittadini di paesi terzi il cui soggiorno è irregolare, favoreggiamento dell'immigrazione irregolare"],["24-ter","Associazione per delinquere e associazione di tipo mafioso"],["25-terdecies","Razzismo e xenofobia"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Disciplina i presidi relativi al reclutamento e all'impiego di manodopera, con particolare riguardo all'intermediazione illecita e allo sfruttamento del lavoro, all'impiego di cittadini di paesi terzi il cui soggiorno è irregolare e ai rapporti con soggetti riconducibili alla criminalità organizzata."},{"k":"p","t":"Gli appalti di manodopera e i servizi ad alta intensità di lavoro sono l'area di maggiore esposizione, e la responsabilità dell'ente committente non è esclusa dall'esistenza formale di un contratto d'appalto."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Selezione e assunzione del personale e verifica dei titoli di soggiorno","Risorse umane"],["2","Ricorso alla somministrazione, all'appalto e al distacco di manodopera","Risorse umane, acquisti, produzione"],["3","Gestione degli orari, delle retribuzioni e delle presenze","Risorse umane, preposti"],["4","Gestione di alloggi, trasporti e servizi forniti ai lavoratori","Risorse umane, servizi generali"],["5","Qualifica dei fornitori nei settori ad alta intensità di manodopera","Acquisti, HSE"],["6","Comunicazione istituzionale e commerciale","Marketing, direzione"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"reclutare manodopera mediante intermediari non autorizzati, o utilizzare lavoratori reclutati da terzi in condizioni di sfruttamento"},{"k":"p","t":"corrispondere retribuzioni palesemente difformi dai contratti collettivi o sproporzionate rispetto alle prestazioni"},{"k":"p","t":"violare in modo reiterato le norme su orario di lavoro, riposi, ferie e aspettativa"},{"k":"p","t":"sottoporre i lavoratori a condizioni di lavoro, metodi di sorveglianza o situazioni alloggiative degradanti"},{"k":"p","t":"impiegare cittadini di paesi terzi privi di permesso di soggiorno valido, o il cui permesso sia scaduto, revocato o annullato"},{"k":"p","t":"trattenere documenti di identità o di soggiorno dei lavoratori"},{"k":"p","t":"instaurare rapporti con soggetti per i quali emergano elementi di riconducibilità ad associazioni criminali"},{"k":"p","t":"diffondere in qualsiasi forma contenuti fondati sulla discriminazione razziale, etnica, nazionale o religiosa"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","La verifica del titolo di soggiorno è effettuata all'assunzione, registrata e ripetuta a ogni scadenza, con scadenzario che inibisce la prosecuzione senza rinnovo","MOD-PS-H.01"],["2","Il ricorso alla somministrazione avviene esclusivamente tramite agenzie autorizzate, con verifica dell'iscrizione all'albo","MOD-09.04"],["3","Negli appalti di servizi ad alta intensità di manodopera sono verificati periodicamente la regolarità contributiva, il contratto collettivo applicato e la corrispondenza tra personale impiegato e comunicazioni obbligatorie","MOD-PS-H.02"],["4","Le presenze sono rilevate con sistema oggettivo e le ore effettivamente lavorate sono confrontabili con quelle retribuite","Sistema di rilevazione"],["5","Gli alloggi eventualmente forniti sono conformi e verificati periodicamente, e la fruizione non è condizione del rapporto di lavoro","Verbale di verifica"],["6","Il canale di segnalazione è reso accessibile anche ai lavoratori delle imprese appaltatrici operanti presso l'ente","MOD-06.04"],["7","La qualifica dei fornitori nei settori esposti comprende la verifica di eventuali informazioni interdittive e la titolarità effettiva","MOD-09.04"],["8","I contenuti della comunicazione istituzionale e commerciale sono approvati dalla funzione competente prima della diffusione","Approvazione dei contenuti"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"elenco degli appalti di manodopera in corso e stato delle verifiche di regolarità"},{"k":"p","t":"lavoratori con titolo di soggiorno in scadenza e stato dei rinnovi"},{"k":"p","t":"segnalazioni provenienti da lavoratori di imprese appaltatrici"},{"k":"p","t":"esiti di ispezioni degli organi di vigilanza in materia di lavoro"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-H.01","Registro dei titoli di soggiorno","Lavoratore, titolo, scadenza, rinnovo, verifica"],["MOD-PS-H.02","Verifica periodica dell'appaltatore","Regolarità contributiva, contratto applicato, personale impiegato, esito"]]}]},"MOG-PS-I":{"code":"MOG-PS-I","titolo":"INDUSTRIA E COMMERCIO, PATRIMONIO CULTURALE E ALTRE FATTISPECIE","fase":"Parte speciale","rif":"D.Lgs. 231/2001, artt. 25-bis, 25-bis.1, 25-quaterdecies, 25-septiesdecies, 25-duodevicies","blocks":[{"k":"t","r":[["DOCUMENTO MOG-PS-I","","",""],["Codice:","MOG-PS-I","Revisione:","[Rev.]"],["Titolo:","INDUSTRIA E COMMERCIO, PATRIMONIO CULTURALE E ALTRE FATTISPECIE","",""],["Parte:","Parte speciale","",""],["Riferimenti:","D.Lgs. 231/2001, artt. 25-bis, 25-bis.1, 25-quaterdecies, 25-septiesdecies, 25-duodevicies","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. REATI RICHIAMATI"},{"k":"t","r":[["Art.","Fattispecie rilevanti per l'ente"],["25-bis","Falsità in monete, valori di bollo e strumenti o segni di riconoscimento, contraffazione di marchi"],["25-bis.1","Turbata libertà dell'industria o del commercio, frode nell'esercizio del commercio, vendita di prodotti industriali con segni mendaci, fabbricazione e commercio di beni realizzati usurpando titoli di proprietà industriale"],["25-quaterdecies","Frode in competizioni sportive ed esercizio abusivo di gioco o scommessa"],["25-septiesdecies e 25-duodevicies","Delitti contro il patrimonio culturale, riciclaggio di beni culturali, devastazione e saccheggio"]]},{"k":"p","t":"2. FINALITÀ E AMBITO"},{"k":"p","t":"Raccoglie i presidi relativi alle fattispecie che, pur non costituendo il nucleo di rischio dell'ente, sono astrattamente configurabili in ragione dell'attività svolta. Il protocollo si applica nella misura in cui il catalogo di applicabilità le abbia ritenute rilevanti."},{"k":"p","t":"3. ATTIVITÀ SENSIBILI"},{"k":"t","r":[["#","Attività","Funzioni tipicamente coinvolte"],["1","Progettazione, produzione ed etichettatura dei prodotti","Tecnica, produzione, qualità"],["2","Dichiarazioni su origine, composizione, qualità e conformità dei prodotti","Qualità, commerciale"],["3","Utilizzo di marchi, brevetti e titoli di proprietà industriale propri e altrui","Tecnica, legale, marketing"],["4","Approvvigionamento di componenti e materiali da controparti nuove o non tracciate","Acquisti"],["5","Interventi su immobili o aree soggetti a tutela e gestione di beni culturali","Tecnica, legale"]]},{"k":"p","t":"4. PRINCIPI DI COMPORTAMENTO"},{"k":"p","t":"Ai destinatari è fatto divieto di:"},{"k":"p","t":"consegnare beni diversi per origine, provenienza, qualità o quantità da quelli dichiarati o pattuiti"},{"k":"p","t":"apporre o utilizzare marchi, segni distintivi o indicazioni di origine non veritieri"},{"k":"p","t":"fabbricare o commercializzare beni realizzati usurpando titoli di proprietà industriale altrui"},{"k":"p","t":"porre in essere atti di concorrenza con violenza o minaccia, o condotte dirette a turbare l'esercizio dell'industria o del commercio"},{"k":"p","t":"acquisire, detenere o trasferire beni culturali di provenienza illecita o priva di documentazione"},{"k":"p","t":"eseguire interventi su beni tutelati in assenza delle autorizzazioni prescritte"},{"k":"p","t":"5. PROTOCOLLI DI CONTROLLO"},{"k":"t","r":[["#","Protocollo","Evidenza"],["1","L'etichettatura e le dichiarazioni di conformità sono verificate prima dell'immissione sul mercato dalla funzione qualità","Fascicolo tecnico di prodotto"],["2","L'indicazione di origine è supportata da documentazione sulla filiera produttiva conservata","Documentazione di filiera"],["3","L'utilizzo di marchi e titoli altrui avviene solo in forza di titolo scritto conservato","Contratti di licenza"],["4","Le controparti nuove nei settori esposti alla contraffazione sono qualificate con verifica documentale rafforzata","MOD-09.04"],["5","Gli interventi su beni o aree tutelati sono preceduti dalla verifica dei vincoli e dall'acquisizione delle autorizzazioni","Titoli autorizzativi"]]},{"k":"p","t":"6. FLUSSI VERSO L'ORGANISMO DI VIGILANZA"},{"k":"p","t":"contestazioni ricevute in materia di prodotti, marchi e origine"},{"k":"p","t":"provvedimenti di autorità di controllo sui prodotti"},{"k":"p","t":"interventi su beni o aree soggetti a tutela"},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-PS-I.01","Scheda di conformità di prodotto","Prodotto, dichiarazioni, verifiche, documentazione a supporto"]]}]}},"mod":{"MOD-01.01":{"code":"MOD-01.01","pro":"MOG-PG-01","titolo":"Verbale di adozione del modello","blocks":[{"k":"t","r":[["MODULO MOD-01.01","",""],["Codice:","MOD-01.01","Revisione: [Rev.]"],["Titolo:","VERBALE DI ADOZIONE DEL MODELLO",""],["Documento:","MOG-PG-01","Ente: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Ente",""],["Data della delibera",""],["Organo deliberante",""],["Presenti",""],["Presiede",""]]},{"k":"h","t":"DELIBERAZIONE"},{"k":"p","t":"L'organo amministrativo di [Nome Organizzazione], preso atto della ricognizione delle attività nel cui ambito possono essere commessi i reati presupposto e della relativa valutazione del rischio, delibera di adottare il modello di organizzazione, gestione e controllo ai sensi del D.Lgs. 231/2001 nella composizione risultante dall'elenco dei documenti allegato."},{"k":"p","t":"Delibera altresì l'adozione del codice etico e del sistema disciplinare, la nomina dell'organismo di vigilanza con separato atto, l'assegnazione delle risorse necessarie e il piano di attuazione e di formazione."},{"k":"h","t":"ELEMENTI DELLA DELIBERA"},{"k":"t","r":[["Elemento","Contenuto"],["Documenti approvati",""],["Data di entrata in vigore",""],["Organismo di vigilanza: composizione e durata",""],["Budget assegnato all'organismo",""],["Soggetto autorizzato alle modifiche meramente attuative",""],["Piano di attuazione e termini",""],["Piano di formazione",""]],"b":0},{"k":"sig"}]},"MOD-01.02":{"code":"MOD-01.02","pro":"MOG-PG-01","titolo":"Codice etico","blocks":[{"k":"t","r":[["MODULO MOD-01.02","",""],["Codice:","MOD-01.02","Revisione: [Rev.]"],["Titolo:","CODICE ETICO",""],["Documento:","MOG-PG-01","Ente: [Nome Organizzazione]"]]},{"k":"p","t":"Il codice etico esprime i principi cui l'ente conforma la propria attività. La sua violazione costituisce illecito disciplinare e, per i terzi, inadempimento contrattuale."},{"k":"h","t":"PRINCIPI GENERALI"},{"k":"p","t":"Legalità. [Nome Organizzazione] opera nel rispetto delle leggi e dei regolamenti applicabili. Nessun comportamento contrario alla legge può essere giustificato dall'interesse o dal vantaggio dell'ente, e nessun obiettivo economico può essere perseguito in violazione di norme imperative."},{"k":"p","t":"Onestà e correttezza. I destinatari operano con lealtà e buona fede, non si avvalgono di posizioni di vantaggio a danno di altri e non promettono né accettano utilità indebite in qualsiasi forma."},{"k":"p","t":"Trasparenza e tracciabilità. Ogni operazione è verificabile, documentata e coerente. Le registrazioni contabili rappresentano fedelmente i fatti di gestione e sono supportate da adeguata documentazione."},{"k":"p","t":"Imparzialità e conflitti di interessi. I destinatari evitano situazioni in cui interessi personali possano interferire con le decisioni assunte per conto dell'ente, e ne danno comunicazione quando si presentino."},{"k":"p","t":"Tutela della persona e del lavoro. L'ente rispetta la dignità dei lavoratori, ne tutela la salute e la sicurezza, non tollera discriminazioni, molestie né forme di sfruttamento, e verifica il rispetto dei medesimi principi presso i propri fornitori."},{"k":"p","t":"Tutela dell'ambiente. L'ente svolge la propria attività nel rispetto della normativa ambientale e adotta le misure necessarie a prevenire danni all'ambiente."},{"k":"p","t":"Riservatezza. Le informazioni acquisite nell'esercizio delle proprie funzioni sono trattate con riservatezza e utilizzate esclusivamente per le finalità connesse all'incarico."},{"k":"p","t":"Segnalazione delle violazioni. L'ente incoraggia la segnalazione delle violazioni, ne assicura la riservatezza e vieta ogni ritorsione verso chi segnala in buona fede."},{"k":"h","t":"RAPPORTI CON I TERZI"},{"k":"t","r":[["Ambito","Regola di condotta"],["Pubblica amministrazione","Divieto assoluto di offrire o accettare utilità; rapporti gestiti da soggetti incaricati e documentati"],["Controparti private","Divieto di dare o ricevere utilità a esponenti di altre imprese; selezione su base comparativa"],["Fornitori e appaltatori","Selezione su criteri oggettivi; verifica del rispetto delle norme su lavoro, sicurezza e ambiente"],["Clienti","Correttezza nelle informazioni su prodotti e servizi; divieto di dichiarazioni non veritiere"],["Autorità di vigilanza","Collaborazione piena e trasmissione di informazioni complete e veritiere"],["Comunità e mezzi di informazione","Comunicazione veritiera; contributi e sponsorizzazioni autorizzati e documentati"]],"b":0},{"k":"h","t":"ATTUAZIONE"},{"k":"t","r":[["Voce","Com i e loro regolarità","",""],["Segnalazioni pervenute e loro trattamento","",""],["Provvedimenti disciplinari adottati","",""],["Aggiornamento della mappatura e dei rischi residui","",""],["Stato del piano di adeguamento","",""],["Formazione erogata e copertura","",""],["Modifiche normative e giurisprudenziali","",""],["Procedimenti e ispezioni che hanno interessato l'ente","",""],["Adeguatezza delle risorse dell'organismo","",""]],"b":0},{"k":"h","t":"VALUTAZIONE COMPLESSIVA"},{"k":"t","r":[["Voce","Compilazione"],["Idoneità del modello",""],["Efficace attuazione",""],["Aree di intervento",""],["Decisioni assunte",""]]},{"k":"sig"}]},"MOD-09.03":{"code":"MOD-09.03","pro":"MOG-PG-09","titolo":"Clausole contrattuali 231","blocks":[{"k":"t","r":[["MODULO MOD-09.03","",""],["Codice:","MOD-09.03","Revisione: [Rev.]"],["Titolo:","CLAUSOLE CONTRATTUALI 231",""],["Documento:","MOG-PG-09","Ente: [Nome Organizzazione]"]]},{"k":"p","t":"Articolato tipo da inserire nei contratti con collaboratori, consulenti, agenti, fornitori e appaltatori."},{"k":"h","t":"ARTICOLATO"},{"k":"p","t":"Art. 1 — Il Contraente dichiara di aver ricevuto il codice etico e la sintesi del modello di organizzazione, gestione e controllo adottati da [Nome Organizzazione] ai sensi del D.Lgs. 231/2001, di conoscerne i contenuti e di impegnarsi a osservarli nell'esecuzione del presente contratto."},{"k":"p","t":"Art. 2 — Il Contraente si impegna ad astenersi da qualsiasi condotta che possa integrare una delle fattispecie di reato dalle quali dipende la responsabilità amministrativa dell'ente, o che possa comunque esporre [Nome Organizzazione] a tale responsabilità."},{"k":"p","t":"Art. 3 — Il Contraente dichiara che nei propri confronti e nei confronti dei propri esponenti non pendono procedimenti per i reati indicati dal decreto e si impegna a comunicare senza ritardo l'insorgere di tali procedimenti."},{"k":"p","t":"Art. 4 — Il Contraente consente a [Nome Organizzazione], anche per il tramite dell'organismo di vigilanza, di svolgere verifiche sull'osservanza degli impegni assunti, fornendo la documentazione richiesta."},{"k":"p","t":"Art. 5 — Il Contraente rende noto ai propri addetti impiegati nell'esecuzione del contratto il canale di segnalazione di [Nome Organizzazione] e si astiene da ogni ritorsione nei confronti di chi vi ricorra."},{"k":"p","t":"Art. 6 — Il Contraente trasferisce gli obblighi di cui ai precedenti articoli ai propri subappaltatori e collaboratori impiegati nell'esecuzione del contratto."},{"k":"p","t":"Art. 7 — L'inosservanza degli obblighi assunti costituisce grave inadempimento. [Nome Organizzazione] ha facoltà di risolvere il contratto ai sensi dell'art. 1456 c.c., fatto salvo il risarcimento del danno e l'applicazione della penale pattuita."},{"k":"h","t":"SOTTOSCRIZIONE"},{"k":"t","r":[["Voce","Compilazione"],["Controparte",""],["Contratto di riferimento",""],["Data",""]]},{"k":"sig"}]},"MOD-09.04":{"code":"MOD-09.04","pro":"MOG-PG-09","titolo":"Registro dei terzi qualificati","blocks":[{"k":"t","r":[["MODULO MOD-09.04","",""],["Codice:","MOD-09.04","Revisione: [Rev.]"],["Titolo:","REGISTRO DEI TERZI QUALIFICATI",""],["Documento:","MOG-PG-09","Ente: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Controparte","Tipologia","Area di rischio","Verifiche svolte","Titolarità effettiva","Esito","Clausole 231","Codice etico trasmesso","Data","Validità","Stato"]],"b":12},{"k":"sig"}]},"MOD-PS-A.01":{"code":"MOD-PS-A.01","pro":"MOG-PS-A","titolo":"Verbale di incontro o ispezione con soggetti pubblici","blocks":[{"k":"t","r":[["MODULO MOD-PS-A.01","",""],["Codice:","MOD-PS-A.01","Revisione: [Rev.]"],["Titolo:","VERBALE DI INCONTRO O ISPEZIONE CON SOGGETTI PUBBLICI",""],["Documento:","MOG-PS-A","Ente: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Data e luogo",""],["Ente pubblico",""],["Funzionari presenti",""],["Addetti dell'ente presenti",""],["Oggetto",""],["Procedura o pratica di riferimento",""]]},{"k":"h","t":"SVOLGIMENTO"},{ o, patrimonio culturale e altre fattispecie","t":"Riciclaggio di beni culturali e devastazione e saccheggio di beni culturali e paesaggistici","d":"Artt. 518-sexies e 518-terdecies c.p.","int":"Sì"},{"id":"L.146/2006 art. 10","fam":"ORG","famn":"Criminalità organizzata, terrorismo e transnazionali","t":"Reati transnazionali","d":"Associazione per delinquere, associazione di tipo mafioso, associazione finalizzata al traffico di stupefacenti, traffico di migranti, intralcio alla giustizia, quando ricorrano gli elementi di transnazionalità.","int":"Sì"}],"fam":[["PA","Pubblica amministrazione e patrimonio pubblico"],["SOC","Reati societari e abusi di mercato"],["SSL","Salute e sicurezza sul lavoro"],["AMB","Reati ambientali"],["RIC","Ricettazione, riciclaggio e strumenti di pagamento"],["INF","Delitti informatici e proprietà intellettuale"],["TRI","Reati tributari e doganali"],["PER","Tutela della persona e del lavoro"],["ORG","Criminalità organizzata, terrorismo e transnazionali"],["ALT","Industria e commercio, patrimonio culturale e altre fattispecie"]]}</script>
<script>
/* =========================================================================
   MODELLO DI ORGANIZZAZIONE, GESTIONE E CONTROLLO — D.Lgs. 231/2001
   Corpus proprio: 18 documenti, 54 moduli, 81 requisiti, catalogo dei reati.
   ========================================================================= */
const CORPUS = JSON.parse(document.getElementById("corpus").textContent);
const PRO = CORPUS.pro, MOD = CORPUS.mod, CAPI = CORPUS.capi, REQ = CORPUS.req;
const REATI = CORPUS.reati, FAM = CORPUS.fam;
const PROLIST = CORPUS.ordPro, MODLIST = CORPUS.ordMod;
const APPVER = "1.0";
const MODOF = {}; PROLIST.forEach(c => MODOF[c] = MODLIST.filter(m => MOD[m].pro === c));
const REQOF = {}; CAPI.forEach(k => REQOF[k.id] = REQ.filter(r => r.cap === k.id));
const REQPRO = {}; PROLIST.forEach(c => REQPRO[c] = REQ.filter(r => r.pro === c));
const REATOBY = {}; REATI.forEach(r => REATOBY[r.id] = r);
const PGLIST = PROLIST.filter(c => /PG/.test(c)), PSLIST = PROLIST.filter(c => /PS/.test(c));

/* =========================================================================
   MOTORE DI RISCHIO
   ========================================================================= */
const SPROB = ["1 · remota", "2 · possibile", "3 · probabile", "4 · attesa"];
const SIMP = ["1 · lieve", "2 · moderato", "3 · grave", "4 · molto grave"];
const SADEG = ["Assenti", "Parziali", "Adeguati"];
const LIV = ["Basso", "Medio", "Alto", "Critico"];
const LIVCLS = { "Basso":"rk-b", "Medio":"rk-m", "Alto":"rk-a", "Critico":"rk-c" };
function lvl(v){ const m = /^\s*(\d)/.exec(String(v == null ? "" : v)); return m ? Number(m[1]) : 0; }
function inerente(s){
  const p = lvl(s.prob) * lvl(s.imp); if (!p) return "";
  return p <= 3 ? "Basso" : p <= 7 ? "Medio" : p <= 11 ? "Alto" : "Critico";
}
const MATRICE = {
  "Critico": { "Assenti":"Critico", "Parziali":"Alto", "Adeguati":"Medio" },
  "Alto":    { "Assenti":"Critico", "Parziali":"Alto", "Adeguati":"Medio" },
  "Medio":   { "Assenti":"Alto", "Parziali":"Medio", "Adeguati":"Basso" },
  "Basso":   { "Assenti":"Medio", "Parziali":"Basso", "Adeguati":"Basso" }
};
function residuo(s){
  const i = inerente(s); if (!i) return "";
  if (!s.adeg) return MATRICE[i]["Assenti"];
  return MATRICE[i][s.adeg] || "";
}
function accettabile(s){ const r = residuo(s); return r === "Basso" || r === "Medio"; }

/* scenari: coppie processo × reato */
function scenari(){
  const out = [];
  (org().proc || []).forEach(p => {
    Object.keys(p.r || {}).forEach(a => {
      const s = p.r[a];
      out.push({ proc: p, art: a, s: s, in: inerente(s), res: residuo(s), ok: accettabile(s) });
    });
  });
  return out;
}
function scenariDi(p){
  return Object.keys(p.r || {}).map(a => ({ art: a, s: p.r[a], in: inerente(p.r[a]), res: residuo(p.r[a]) }))
    .sort((a, b) => LIV.indexOf(b.res) - LIV.indexOf(a.res));
}
function livProc(p){
  const s = scenariDi(p).map(x => x.res).filter(Boolean);
  if (!s.length) return "";
  return LIV[Math.max.apply(null, s.map(x => LIV.indexOf(x)))];
}
/* applicabilità del reato: default non determinata */
function catState(a){ const o = org(); if (!o.cat[a]) o.cat[a] = { app:"", mot:"" }; return o.cat[a]; }
function applicabile(a){ const o = org(); return (o.cat[a] || {}).app === "Sì"; }
function reatiApplicabili(){ return REATI.filter(r => applicabile(r.id)); }
function reatiCoperti(){
  const s = new Set(); (org().proc || []).forEach(p => Object.keys(p.r || {}).forEach(a => s.add(a)));
  return s;
}

/* =========================================================================
   PERSISTENZA
   ========================================================================= */
const KEY = "mog_231_v1";
const STORE = {
  mode(){
    if (window.MOG231_STORE && typeof window.MOG231_STORE.load === "function") return "host";
    if (DB.cfg && DB.cfg.url) return "rest";
    return "local";
  },
  async load(){
    if (window.MOG231_STORE && typeof window.MOG231_STORE.load === "function"){
      try { const o = await window.MOG231_STORE.load(); if (o) return o; } catch(e){ console.warn("host load", e); }
    }
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(KEY + "_cfg") || "null"); } catch(e){}
    if (cfg && cfg.url){
      try { const r = await fetch(cfg.url, { headers: authHdr(cfg) });
        if (r.ok){ const o = await r.json(); if (o && o.orgs){ o.cfg = cfg; return o; } } } catch(e){ console.warn("rest load", e); }
    }
    try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (cfg) o.cfg = cfg; return o; } } catch(e){}
    return cfg ? { orgs: [], current: null, cfg } : null;
  },
  async save(){
    const payload = { orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() };
    if (DB.cfg) { try { localStorage.setItem(KEY + "_cfg", JSON.stringify(DB.cfg)); } catch(e){} }
    if (window.MOG231_STORE && typeof window.MOG231_STORE.save === "function"){
      try { await window.MOG231_STORE.save(payload); return true; } catch(e){ toast("Salvataggio sulla piattaforma non riuscito"); }
    }
    if (DB.cfg && DB.cfg.url){
      try { const r = await fetch(DB.cfg.url, { method: DB.cfg.metodo || "PUT",
        headers: Object.assign({ "Content-Type":"application/json" }, authHdr(DB.cfg)), body: JSON.stringify(payload) });
        if (!r.ok) toast("Endpoint: risposta " + r.status);
      } catch(e){ toast("Endpoint non raggiungibile — copia locale mantenuta"); }
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); return true; }
    catch(e){ toast("Spazio locale esaurito — esporta l'archivio"); return false; }
  }
};
function authHdr(cfg){ return cfg && cfg.token ? { "Authorization": "Bearer " + cfg.token } : {}; }

/* =========================================================================
   REGISTRI
   ========================================================================= */

function org(){ return DB.orgs.find(o => o.id === DB.current) || null; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function oggi(){ return new Date().toISOString().slice(0, 10); }
function itDate(s){ if (!s) return ""; const p = String(s).slice(0,10).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function nl2br(s){ return esc(s).replace(/\n/g, "<br>"); }
function n(x){ return Number(x) || 0; }
function fmtEur(v){ return v ? new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0 }).format(v) + " €" : "—"; }
function pc(a, b){ return b ? Math.round(a / b * 100) : 0; }

function nuovaOrg(nome){
  return { id: uid(), nome: nome || "Nuovo ente", created: new Date().toISOString(), updated: new Date().toISOString(),

           organoAmm:"", organoCtrl:"", direzione:"", odvComp:"", odvTipo:"", odvNomina:"", odvScad:"", odvBudget:"",
           canaleUrl:"", canaleTel:"", canaleGest:"", pa:"", altriSg:"",
           dataAdozione: oggi(), rev:"01", scopo:"", esclusioni:"" },
    pro: {}, mod: {}, proc: [], cat: {}, req: {},
    reg: REGDEF.reduce((a, r) => (a[r.id] = [], a), {}) };
}
function normOrg(o){
  o.ana = o.ana || {}; o.pro = o.pro || {}; o.mod = o.mod || {}; o.reg = o.reg || {};
  o.cat = o.cat || {}; o.req = o.req || {};
  if (!Array.isArray(o.proc)) o.proc = [];
  o.proc.forEach(p => { if (!p.r) p.r = {}; });
  REGDEF.forEach(r => { if (!Array.isArray(o.reg[r.id])) o.reg[r.id] = []; });
  return o;
}
function touch(){ const o = org(); if (o) o.updated = new Date().toISOString(); dirty = true; queueSave(); }
function queueSave(){ clearTimeout(saveT); saveT = setTimeout(() => { STORE.save(); dirty = false; setSaveBadge(); }, 700); setSaveBadge(); }
function setSaveBadge(){ const el = document.getElementById("savest"); if (el) el.textContent = dirty ? "salvataggio…" : "salvato"; }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2400); }

const TOKENS = [
  { re: /\[Nome Organizzazione\]|\[Ragione Sociale\]|\[Ente\]/g, f: a => a.ragione },
  { re: /\[Organo amministrativo\]/g, f: a => a.organoAmm },
  { re: /\[Alta Direzione\]|\[Direzione\]|\[Legale Rappresentante\]/g, f: a => a.direzione },
  { re: /\[OdV\]|\[Organismo di Vigilanza\]/g, f: a => a.odvComp },
  { re: /\[Sede\]|\[Sede legale\]/g, f: a => a.sede },
  { re: /\[P\.IVA\]|\[Partita IVA\]/g, f: a => a.piva },
  { re: /\[Settore\]/g, f: a => a.settore },
  { re: /\[GG\/MM\/AAAA\]|\[Data\]/g, f: a => itDate(a.dataAdozione) },
  { re: /\[Rev\.\]/g, f: a => a.rev }
];
function pers(txt){
  const o = org(); if (!o) return txt;
  let s = String(txt == null ? "" : txt);
  TOKENS.forEach(t => { const v = t.f(o.ana); if (v) s = s.replace(t.re, v); });
  return s;
}
function persH(txt){ return esc(pers(txt)).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="miss">' + m + "</span>"); }
function contaToken(txt){ const m = pers(txt).match(/\[[^\]\n]{1,60}\]/g); return m ? m.length : 0; }

function statoPro(c){ const o = org(); return (o && o.pro[c] && o.pro[c].stato) || "Da personalizzare"; }
function statoMod(c){ const o = org(); return (o && o.mod[c] && o.mod[c].stato) || "Da personalizzare"; }

const PESO = { "Presente ed efficace":100, "Presente ma da rafforzare":50, "Assente":0 };
function capStato(cap){
  const o = org(), v = REQOF[cap].map(r => (o.req[r.id] || {}).s).filter(s => s && s !== "Non applicabile");
  if (!v.length) return 0;
  return Math.round(v.reduce((a, s) => a + (PESO[s] || 0), 0) / v.length);
}
function capCoperti(cap){ const o = org(); return REQOF[cap].filter(r => (o.req[r.id] || {}).s).length; }
function idoneita(){ const v = CAPI.map(k => capStato(k.id)); return Math.round(v.reduce((a, b) => a + b, 0) / v.length); }
function reqValutati(){ const o = org(); return REQ.filter(r => (o.req[r.id] || {}).s).length; }

function urgenze(){
  const o = org(), out = [], R = o.reg;
  const add = (t, nn, cls, act, id) => { if (nn) out.push({ t, n:nn, cls, act, id }); };
  const sc = scenari();
  add("Fattispecie non ancora esaminate nel catalogo", REATI.filter(r => !(o.cat[r.id] || {}).app).length, "t-amb", "gov", "cat");
  add("Fattispecie escluse senza motivazione", REATI.filter(r => (o.cat[r.id] || {}).app === "No" && !(o.cat[r.id] || {}).mot).length, "t-red", "gov", "cat");
  add("Rischi residui alti o critici", sc.filter(s => !s.ok).length, "t-red", "gov", "proc");
  add("Rischi non accettabili senza azione nel piano", sc.filter(s => !s.ok).length - (R.adeguamento || []).length > 0 ?
      sc.filter(s => !s.ok).length - (R.adeguamento || []).length : 0, "t-red", "goreg", "adeguamento");
  add("Azioni di adeguamento oltre il termine", (R.adeguamento || []).filter(x => x.scad && x.stato !== "Verificata" && new Date(x.scad) < new Date()).length, "t-red", "goreg", "adeguamento");
  add("Documenti del modello non approvati", PROLIST.filter(c => statoPro(c) !== "Approvato" && statoPro(c) !== "Non applicabile").length, "t-amb", "gov", "sgs");
  add("Organismo di vigilanza non nominato", o.ana.odvComp ? 0 : 1, "t-red", "gov", "ana");
  add("Budget dell'organismo non assegnato", o.ana.odvBudget ? 0 : 1, "t-amb", "gov", "ana");
  add("Verifiche dell'organismo programmate e non eseguite", (R.verifiche || []).filter(x => x.datap && !x.datae && new Date(x.datap) < new Date()).length, "t-amb", "goreg", "verifiche");
  add("Flussi informativi non pervenuti", (R.flussi || []).filter(x => x.stato === "Non pervenuto").length, "t-red", "goreg", "flussi");
  add("Segnalazioni senza avviso di ricevimento", (R.segnalazioni || []).filter(x => !x.avviso && x.anon !== "Sì").length, "t-red", "goreg", "segnalazioni");
  add("Segnalazioni fondate senza provvedimento", (R.segnalazioni || []).filter(x => x.fond === "Sì" && !x.prov).length, "t-red", "goreg", "segnalazioni");
  add("Provvedimenti disciplinari non comunicati all'organismo", (R.disciplinari || []).filter(x => x.stato === "Concluso" && x.odv !== "Sì").length, "t-amb", "goreg", "disciplinari");
  add("Deroghe non comunicate all'organismo", (R.deroghe || []).filter(x => x.odv !== "Sì").length, "t-amb", "goreg", "deroghe");
  add("Terzi senza clausole 231", (R.terzi || []).filter(x => x.stato === "Attivo" && x.clau === "No").length, "t-red", "goreg", "terzi");
  add("Omaggi sopra soglia senza autorizzazione preventiva", (R.omaggi || []).filter(x => x.aut === "Non richiesta ma dovuta").length, "t-red", "goreg", "omaggi");
  add("Omaggi a soggetti pubblici con procedure in corso", (R.omaggi || []).filter(x => x.pu === "Sì" && x.proc === "Sì").length, "t-red", "goreg", "omaggi");
  add("Requisiti valutati assenti", REQ.filter(r => (o.req[r.id] || {}).s === "Assente").length, "t-red", "gov", "idon");
  if (!out.length) return '<div class="empty">Nessuna posizione aperta.</div>';
  return "<table><tbody>" + out.map(r => '<tr><td><button class="linkbtn" data-act="' + r.act + '" data-id="' + r.id + '">' +
    esc(r.t) + '</button></td><td class="num"><b>' + r.n + '</b></td><td><span class="tag ' + r.cls + '">da presidiare</span></td></tr>').join("") + "</tbody></table>";
}
function distribRischio(sc){
  if (!sc.length) return '<div class="empty">Nessuno scenario valutato.</div>';

  sc.forEach(s => { m[s.res || ""] = (m[s.res || ""] || 0) + 1; });
  return ["Critico","Alto","Medio","Basso",""].map(k => {
    const v = m[k] || 0;
    return '<div class="row" style="margin-bottom:7px"><span style="width:100px"><span class="rk ' + (LIVCLS[k] || "t-gry") + '">' +
      (k || "non valutato") + '</span></span><div class="track" style="flex:1"><i class="' +
      (k === "Critico" || k === "Alto" ? "no" : k === "Medio" ? "mid" : "ok") + '" style="width:' + Math.round(v / sc.length * 100) + '%"></i></div>' +
      '<b class="num" style="width:34px">' + v + "</b></div>";
  }).join("") + '<div class="hint">Il rischio residuo è accettabile quando la commissione del reato richiederebbe l\'elusione fraudolenta di presidi effettivamente operanti.</div>';
}

function cellHTML(r, c){
  const v = fmtVal(r[c.k], c);
  if (c.k === "stato" || c.k === "esito" && /Applicato|Conforme/.test(v)) return '<span class="tag ' + statoTag(v) + '">' + esc(v || "—") + "</span>";
  if (["pu", "proc", "rit"].includes(c.k)) return v === "Sì" ? '<span class="tag t-amb">Sì</span>' : esc(v || "—");
  if (["odv", "acc", "clau", "cod"].includes(c.k)) return v === "No" ? '<span class="tag t-red">No</span>' : esc(v || "—");
  if (c.k === "res" || c.k === "rischio") return v ? '<span class="rk ' + (LIVCLS[v] || "t-gry") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "sanz") return '<span class="tag ' + (/Licenziamento|Risoluzione/.test(v) ? "t-red" : v === "Archiviazione" ? "t-gry" : "t-amb") + '">' + esc(v || "—") + "</span>";
  if (c.k === "aut") return '<span class="tag ' + (v === "Richiesta e ottenuta" ? "t-grn" : v === "Non richiesta ma dovuta" ? "t-red" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "fond") return '<span class="tag ' + (v === "Sì" ? "t-red" : v === "No" ? "t-gry" : "t-amb") + '">' + esc(v || "—") + "</span>";
  return esc(v).slice(0, 150).replace(/\n/g, " ");
}
function fmtVal(v, c){ if (v == null || v === "") return ""; return c && c.t === "date" ? itDate(v) : String(v); }
function statoTag(s){
  if (!s) return "t-gry";
  if (/chius|verificata|attuat|eseguit|registrato|pervenuto|vigente|concluso|deliberato|favorevole/i.test(s)) return "t-grn";
  if (/apert|non pervenuto|in ritardo|revocata|sfavorevole|rifiutato|programmata/i.test(s)) return "t-red";
  return "t-amb";
}

         : '<input type="' + (c.t === "num" ? "number" : c.t === "date" ? "date" : "text") + '" data-rec="' + c.k + '" value="' + esc(v) + '">') +

function autoRec(d){
  const r = {}, rows = org().reg[d.id] || [];
  d.cols.forEach(c => {

    if (c.k === "stato" && c.o) r[c.k] = c.o[0];
  });

}

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){

  if (b.k === "t") return tableHTML(b);

  const modif = ovr && ovr[i] != null;

    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"

    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}

    "Modalità di possibile commissione", "Presidi", "Probabilità", "Impatto", "Rischio inerente",
    "Adeguatezza", "Rischio residuo", "Accettabile"].map(qs).join(";");
  const rows = [];
  (org().proc || []).forEach(p => scenariDi(p).forEach(x => {
    const r = REATOBY[x.art] || {};
    rows.push([p.nome, p.funzione, p.attivita, x.art, r.t, r.famn, x.s.mod, x.s.pres,
      lvl(x.s.prob), lvl(x.s.imp), x.in, x.s.adeg, x.res, accettabile(x.s) ? "sì" : "no"].map(qs).join(";"));
  }));
  return [head].concat(rows).join("\r\n");
}
function csvCat(){
  const o = org();
  return [["Art.", "Famiglia", "Fattispecie", "Fattispecie rilevanti", "Sanzioni interdittive", "Applicabile", "Motivazione", "Processi collegati"].map(qs).join(";")]
    .concat(REATI.map(r => { const st = o.cat[r.id] || {};
      const nc = (o.proc || []).filter(p => (p.r || {})[r.id]).length;
      return [r.id, r.famn, r.t, r.d, r.int, st.app || "", st.mot || "", nc].map(qs).join(";"); })).join("\r\n");
}
function csvIdon(){
  const o = org();
  return [["Pilastro", "Rif.", "Domanda", "Documento", "Stato", "Evidenza", "Note"].map(qs).join(";")]
    .concat(REQ.map(r => { const st = o.req[r.id] || {};
      return [r.capn, r.rif, r.t, r.pro, st.s || "", st.e || "", st.n || ""].map(qs).join(";"); })).join("\r\n");
}

const ACT = {
  home(){ view = org() ? "home" : "pf"; render(); },
  gov(el){ view = el.dataset.id; sel.prc = null; sel.reg = null; sel.out = null; sel.q = ""; render(); },
  gocap(el){ view = "idon"; sel.cap = el.dataset.id; render(); },
  fcap(el){ sel.cap = el.dataset.id; render(); },
  ffam(el){ sel.ffam = el.dataset.id; render(); },
  flev(el){ sel.flev = el.dataset.id; render(); },
  newOrg(){ const nn = prompt("Denominazione dell'ente"); if (!nn) return;
    const o = nuovaOrg(nn.trim()); DB.orgs.push(o); DB.current = o.id; view = "ana"; touch(); render(); toast("Scheda creata con il corpus completo"); },
  openOrg(el){ DB.current = el.dataset.id; view = "home"; sel = { tab:"dati" }; queueSave(); render(); },
  dupOrg(el){ const s = DB.orgs.find(a => a.id === el.dataset.id); if (!s) return;
    const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.nome = s.nome + " (copia)"; DB.orgs.push(c); touch(); render(); toast("Scheda duplicata"); },
  delOrg(el){ const a = DB.orgs.find(x => x.id === el.dataset.id); if (!a) return;
    if (!confirm("Eliminare «" + a.nome + "» con la mappatura e tutti i registri?")) return;
    DB.orgs = DB.orgs.filter(x => x.id !== a.id); if (DB.current === a.id) DB.current = null; dirty = true; queueSave(); render(); },
  addPrc(){ const o = org(); const p = { id: uid(), nome: "Nuovo processo", stato:"In analisi", r:{} };
    o.proc.push(p); sel.prc = p.id; sel.tab = "dati"; touch(); render(); },
  openPrc(el){ sel.prc = el.dataset.id; sel.tab = "dati"; view = "proc"; render(); },
  backPrc(){ sel.prc = null; render(); },
  ptab(el){ sel.tab = el.dataset.id; render(); },
  delPrc(el){ if (!confirm("Eliminare il processo e la relativa valutazione?")) return;
    const o = org(); o.proc = o.proc.filter(p => p.id !== el.dataset.id); sel.prc = null; touch(); render(); },
  addReato(){ const s = document.getElementById("addReato"); if (!s || !s.value) return;
    const p = procById(sel.prc); p.r[s.value] = { mod:"", pres:"", prob:"", imp:"", adeg:"", az:"" };
    touch(); render(); modalScenario(s.value); },
  edScen(el){ modalScenario(el.dataset.id); },
  saveScen(el){ const p = procById(sel.prc), a = el.dataset.id;
    const s = p.r[a] || {}; document.querySelectorAll("#modal [data-sc]").forEach(f => s[f.dataset.sc] = f.value);
    p.r[a] = s; closeModal(); touch(); render(); toast("Valutazione aggiornata"); },
  delScen(el){ if (!confirm("Rimuovere la fattispecie da questo processo?")) return;
    const p = procById(sel.prc); delete p.r[el.dataset.id]; touch(); render(); },
  addAdeg(el){ const p = procById(sel.prc), a = el.dataset.id, s = p.r[a] || {}, r = REATOBY[a] || {};
    view = "reg"; sel.reg = "adeguamento"; render();
    openModal(recForm("adeguamento", null));
    const set = (k, v) => { const f = document.querySelector('#modal [data-rec="' + k + '"]'); if (f) f.value = v; };
    set("processo", p.nome); set("art", a + " · " + (r.t || "")); set("res", residuo(s)); set("az", s.az || "");
  },
  schedaPrc(el){ esportaWord("prc", el.dataset.id); },
  expMatrice(){ scarica("matrice-reati-processi-" + oggi() + ".csv", "\ufeff" + csvMatrice(), "text/csv;charset=utf-8"); },
  expCat(){ scarica("catalogo-applicabilita-" + oggi() + ".csv", "\ufeff" + csvCat(), "text/csv;charset=utf-8"); },
  expIdon(){ scarica("mappa-idoneita-" + oggi() + ".csv", "\ufeff" + csvIdon(), "text/csv;charset=utf-8"); },
  goreg(el){ view = "reg"; sel.reg = el.dataset.id; sel.prc = null; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){ const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const arr = org().reg[id]; if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata"); },
  delRec(el){ if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render(); },
  closeModal(){ closeModal(); },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){ const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value, st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato"); },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  openOut(el){ sel.out = el.dataset.id; render(); },
  backOut(){ sel.out = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){ scarica("archivio-mog231-" + oggi() + ".json",
    JSON.stringify({ orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() }, null, 1), "application/json"); },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){ if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); } },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){ if (!confirm("Svuotare l'archivio locale?")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){} view = "pf"; queueSave(); render(); }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.prc = null; sel.out = null; sel.q = "";
    document.getElementById("side").classList.remove("open"); render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
  if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.prc != null){ const p = procById(sel.prc); if (p){ p[t.dataset.prc] = t.value; touch(); } return; }
  if (t.dataset.cat != null){ catState(t.dataset.cat)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "prcq", "sgsq", "modq", "idonq", "catq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.scen != null){ const p = procById(sel.prc);
    if (p && p.r[t.dataset.scen]){ p.r[t.dataset.scen][t.dataset.f] = t.value; touch(); render(); } return; }
  if (t.dataset.cat != null){ catState(t.dataset.cat)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "app") refreshCat(); return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "s"){ t.className = t.value === "Assente" ? "no" : ""; refreshIdon(); } return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.prc != null || t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
function refreshCat(){
  const nv = document.querySelector('.nav[data-v="cat"] .ct');
  if (nv) nv.textContent = reatiApplicabili().length + "/" + REATI.length;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
