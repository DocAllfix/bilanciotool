<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifica del livello di conformità — D.Lgs. 138/2024 (NIS2)</title>
<style>
:root{
  --pri:#8A5A1E;--pri-dk:#5E3D12;--pri-lt:#F5EDE0;--pri-mid:#B98C4E;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---- ciclo di due diligence ---- */
.fase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.fase:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.fase .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.fase .nm{font-weight:650;letter-spacing:-.2px;font-size:15px}
.fase .ds{font-size:12px;color:var(--ink-3);line-height:1.45;flex:1}
.fase .pc{font-family:var(--mono);font-size:20px;font-weight:650;letter-spacing:-.5px}
/* ---- rischio ---- */
.rk{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.02em}
.rk-b{background:var(--green-lt);color:var(--green)}
.rk-m{background:var(--blue-lt);color:var(--blue)}
.rk-a{background:var(--amber-lt);color:var(--amber)}
.rk-c{background:var(--red-lt);color:var(--red)}
.sev{display:flex;gap:2px;align-items:center}
.sev i{width:11px;height:11px;border-radius:2px;background:var(--line-2);display:block}
.sev i.on{background:var(--pri)}
.sev i.hi{background:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:56px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 4px;cursor:pointer;font-size:11.5px;text-align:center;color:var(--ink-2)}
.scale button:hover{border-color:var(--pri-mid)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.scale button b{display:block;font-family:var(--mono);font-size:14px}
.flagbox{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.flagbox:last-child{border-bottom:0}
.flagbox input{width:16px;height:16px;margin:2px 0 0;flex:0 0 16px}
.flagbox span{font-size:12.5px;line-height:1.45}
.panel{background:var(--pri-lt);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.panel .row{gap:22px}
.panel b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:-.4px}
.panel span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri-dk);border-bottom-color:var(--pri);font-weight:600}

select.no{border-color:var(--red);color:var(--red);font-weight:600}

/* ---- cruscotto ---- */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font:10px var(--mono);fill:var(--muted)}
.chart .bar{fill:var(--pri-mid)}
.chart .b-ok{fill:var(--green)}
.chart .b-no{fill:var(--red)}
.chart .tg{stroke:var(--pri-dk);stroke-width:1.6}
.chart .sg{stroke:var(--amber);stroke-width:1.4;stroke-dasharray:5 4}
.chart .tgx{fill:var(--pri-dk)}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.spark{width:92px;height:26px;display:block}
.spark polyline{fill:none;stroke-width:1.8;stroke:var(--muted);stroke-linejoin:round;stroke-linecap:round}
.spark.ok polyline{stroke:var(--green)}
.spark.mid polyline{stroke:var(--amber)}
.spark.no polyline{stroke:var(--red)}
.spark.nd polyline{stroke:var(--line-2)}
table.ind td{vertical-align:middle}
.up{color:var(--green);font-weight:600}
.dn{color:var(--red);font-weight:600}
.nrm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font:600 10px/1 var(--mono);margin-right:3px;color:#fff}
.n-q{background:#2F6FA8}.n-a{background:#3E8B58}.n-s{background:#C2762B}
.norma{text-align:left;cursor:pointer;border:1px solid var(--line);transition:border-color .12s,transform .12s}
.norma:hover{border-color:var(--pri);transform:translateY(-1px)}

/* ---- avvisi ---- */
.card.warn{border-left:4px solid var(--red);background:linear-gradient(90deg,rgba(179,38,30,.05),transparent 60%)}
.card.warn h2{color:var(--red)}

</style>
</head>
