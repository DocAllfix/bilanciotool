<script type="application/json" id="corpus">{"pro":{"PNS-01":{"codice":"PNS-01","titolo":"Ambito di applicazione, governance e responsabilità degli organi","fase":"Governance","rif":"D.Lgs. 138/2024, artt. 3, 6, 7, 23 · Direttiva (UE) 2022/2555","blocks":[{"k":"t","h":["PROCEDURA PNS-01","","",""],"r":[["Codice:","PNS-01","Revisione:","[Rev.]"],["Titolo:","AMBITO DI APPLICAZIONE, GOVERNANCE E RESPONSABILITÀ DEGLI ORGANI","",""],["Ambito:","Governance","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, artt. 3, 6, 7, 23 · Direttiva (UE) 2022/2555","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce la determinazione dell'ambito soggettivo, l'assetto di governance della cybersicurezza e le responsabilità degli organi di amministrazione e direttivi di [Nome Organizzazione]."},{"k":"h","t":"1.2 Riferimenti"},{"k":"l","i":["D.Lgs. 4 settembre 2024, n. 138, di recepimento della Direttiva (UE) 2022/2555","Determinazioni e specifiche di base adottate dall'Agenzia per la Cybersicurezza Nazionale","D.Lgs. 65/2018 per quanto non abrogato, e normative settoriali applicabili"]},{"k":"h","t":"2. DETERMINAZIONE DELL'AMBITO"},{"k":"p","t":"L'appartenenza all'ambito di applicazione dipende dal settore di attività, dalla dimensione e dalla ricorrenza di criteri specifici che prescindono dalla dimensione."},{"k":"t","h":["Elemento","Contenuto"],"r":[["Settore","Appartenenza ai settori ad alta criticità dell'Allegato I o agli altri settori critici dell'Allegato II"],["Dimensione","Soglie del parametro dimensionale: media impresa a partire da 50 addetti o 10 milioni di fatturato e di bilancio; grande impresa a partire da 250 addetti o 50 milioni di fatturato o 43 milioni di bilancio"],["Criteri specifici","Soggetti che rientrano indipendentemente dalla dimensione: fornitori di reti pubbliche di comunicazione elettronica o di servizi di comunicazione accessibili al pubblico, prestatori di servizi fiduciari, gestori di registri dei nomi di dominio di primo livello, fornitori di servizi DNS, pubbliche amministrazioni individuate, soggetti unici fornitori di un servizio essenziale, soggetti la cui perturbazione avrebbe impatto significativo"],["Classificazione","Soggetto essenziale o soggetto importante, con conseguenze sul regime di vigilanza e sui massimali sanzionatori"]]},{"k":"p","t":"La classificazione operata dall'organizzazione è una valutazione preliminare: la qualificazione definitiva è quella risultante dall'elenco tenuto dall'Autorità, comunicata al soggetto."},{"k":"h","t":"3. CONSEGUENZE DELLA CLASSIFICAZIONE"},{"k":"t","h":["Profilo","Soggetto essenziale","Soggetto importante"],"r":[["Vigilanza","Preventiva e successiva, con ispezioni e audit anche periodici","Successiva, attivata a fronte di elementi che indichino inadempimenti"],["Massimale sanzionatorio","Fino a 10 milioni di euro o al 2% del fatturato mondiale annuo, se superiore","Fino a 7 milioni di euro o all'1,4% del fatturato mondiale annuo, se superiore"],["Obblighi sostanziali","Misure di gestione del rischio e notifica degli incidenti","Misure di gestione del rischio e notifica degli incidenti"]]},{"k":"p","t":"Gli obblighi sostanziali sono i medesimi: la differenza attiene al regime di vigilanza e all'entità delle sanzioni."},{"k":"h","t":"4. RESPONSABILITÀ DEGLI ORGANI"},{"k":"p","t":"Gli organi di amministrazione e gli organi direttivi:"},{"k":"l","i":["approvano le modalità di attuazione delle misure di gestione dei rischi per la sicurezza informatica;","sovrintendono alla loro attuazione;","sono responsabili delle violazioni degli obblighi previsti, nei limiti stabiliti dalla legge;","seguono una formazione specifica in materia di sicurezza informatica, con periodicità adeguata;","promuovono l'offerta di una formazione analoga ai dipendenti, con cadenza regolare."]},{"k":"p","t":"La responsabilità degli organi non è delegabile all'esterno: l'affidamento della gestione operativa a fornitori non trasferisce l'obbligo di approvazione e di sorveglianza."},{"k":"h","t":"4.1 Evidenza"},{"k":"p","t":"L'approvazione delle misure è documentata con delibera che indica: misure approvate, risorse assegnate, tempi di attuazione, responsabile designato, modalità di riferire agli organi."},{"k":"h","t":"5. ASSETTO ORGANIZZATIVO"},{"k":"t","h":["Ruolo","Responsabilità"],"r":[["Organo di amministrazione","Approvazione delle misure, sorveglianza sull'attuazione, assegnazione delle risorse, formazione propria"],["Punto di contatto verso l'Autorità","Interlocuzione con l'Agenzia, gestione delle comunicazioni e delle notifiche, aggiornamento dei dati di registrazione"],["Responsabile della sicurezza informatica","Attuazione delle misure, gestione del rischio, coordinamento della risposta agli incidenti"],["Responsabili di funzione","Attuazione delle misure di competenza, segnalazione degli eventi"],["Fornitori di servizi ICT","Obblighi definiti contrattualmente secondo la PNS-06"]]},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Delibera di approvazione delle misure aggiornata","MOD-01.02","Annuale","Vigente"],["Componenti degli organi con formazione in corso di validità","MOD-08.02","Annuale","100%"],["Riesame della classificazione svolto","MOD-01.01","Annuale","Nei termini"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-01.01","Scheda di determinazione dell'ambito","Settore, dimensione, criteri specifici, classificazione, motivazione"],["MOD-01.02","Delibera di approvazione delle misure","Misure, risorse, tempi, responsabile, modalità di reporting"],["MOD-01.03","Designazione dei ruoli","Punto di contatto, responsabile della sicurezza, sostituti, recapiti"],["MOD-01.04","Elenco dei documenti del sistema","Documento, revisione, data, stato di approvazione"]]}]},"PNS-02":{"codice":"PNS-02","titolo":"Registrazione, obblighi informativi e rapporti con l'Autorità","fase":"Governance","rif":"D.Lgs. 138/2024, artt. 7, 42 · Piattaforma ACN","blocks":[{"k":"t","h":["PROCEDURA PNS-02","","",""],"r":[["Codice:","PNS-02","Revisione:","[Rev.]"],["Titolo:","REGISTRAZIONE, OBBLIGHI INFORMATIVI E RAPPORTI CON L'AUTORITÀ","",""],["Ambito:","Governance","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, artt. 7, 42 · Piattaforma ACN","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce gli adempimenti di registrazione presso l'Agenzia per la Cybersicurezza Nazionale, l'aggiornamento dei dati e la gestione dei rapporti con l'Autorità."},{"k":"h","t":"2. REGISTRAZIONE"},{"k":"p","t":"La registrazione avviene sulla piattaforma dell'Agenzia nella finestra annuale stabilita dalla normativa, dal primo gennaio al ventotto febbraio di ciascun anno."},{"k":"t","h":["Dato","Contenuto"],"r":[["Denominazione e dati identificativi","Ragione sociale, codice fiscale, partita IVA, sede"],["Settore e attività","Settore di appartenenza secondo gli allegati e attività svolte"],["Servizi erogati","Elenco dei servizi rilevanti e degli Stati membri in cui sono forniti"],["Punto di contatto","Nominativo, ruolo, recapiti, sostituto"],["Indirizzi IP pubblici","Intervalli di indirizzi utilizzati, ove richiesto"],["Dati dimensionali","Addetti, fatturato, bilancio"]]},{"k":"h","t":"2.1 Aggiornamento"},{"k":"p","t":"Le variazioni dei dati sono comunicate nei termini stabiliti. L'omessa o tardiva registrazione, così come l'omesso aggiornamento, è autonomamente sanzionata anche in assenza di incidenti."},{"k":"h","t":"3. ELENCO DEI SOGGETTI"},{"k":"p","t":"L'Agenzia comunica al soggetto l'avvenuto inserimento nell'elenco e la classificazione attribuita. Dalla comunicazione decorrono i termini per l'adeguamento agli obblighi, secondo la scansione stabilita dalla normativa e dalle determinazioni dell'Autorità."},{"k":"p","t":"Il calendario di adeguamento e le specifiche di base sono oggetto di determinazioni dell'Agenzia soggette ad aggiornamento: la loro versione vigente va verificata a ogni riesame del sistema."},{"k":"h","t":"4. RAPPORTI CON L'AUTORITÀ"},{"k":"t","h":["Ambito","Modalità"],"r":[["Notifiche di incidente","Secondo la PNS-04, attraverso i canali indicati dall'Agenzia"],["Richieste di informazioni e ispezioni","Riscontro nei termini assegnati, con documentazione pertinente"],["Comunicazioni e allerta","Ricezione e trattamento delle segnalazioni dell'Agenzia, con registrazione degli esiti"],["Audit e verifiche disposti dall'Autorità","Collaborazione, messa a disposizione della documentazione, attuazione delle prescrizioni"]]},{"k":"p","t":"Le comunicazioni sono gestite dal punto di contatto, con registrazione nel MOD-02.02."},{"k":"h","t":"5. OBBLIGHI VERSO I DESTINATARI DEI SERVIZI"},{"k":"p","t":"Quando ricorrono i presupposti stabiliti dalla legge, l'organizzazione comunica senza ingiustificato ritardo ai destinatari dei propri servizi gli incidenti significativi suscettibili di ripercuotersi negativamente sulla fornitura, nonché le gravi minacce informatiche e le misure che i destinatari possono adottare."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Registrazione effettuata nella finestra annuale","MOD-02.01","Annuale","Nei termini"],["Variazioni comunicate nei termini","MOD-02.01","Trimestrale","100%"],["Richieste dell'Autorità riscontrate nei termini","MOD-02.02","Trimestrale","100%"],["Segnalazioni dell'Agenzia trattate","MOD-02.02","Mensile","100%"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-02.01","Scheda di registrazione e variazioni","Dati registrati, data, variazioni, comunicazioni"],["MOD-02.02","Registro delle comunicazioni con l'Autorità","Data, oggetto, termine, riscontro, esito"],["MOD-02.03","Comunicazione ai destinatari dei servizi","Evento, contenuto, destinatari, tempi, misure suggerite"]]}]},"PNS-03":{"codice":"PNS-03","titolo":"Analisi dei rischi e politica di sicurezza dei sistemi informativi","fase":"Misure · art. 24 c. 2 lett. a)","rif":"D.Lgs. 138/2024, art. 24 · UNI CEI EN ISO/IEC 27001","blocks":[{"k":"t","h":["PROCEDURA PNS-03","","",""],"r":[["Codice:","PNS-03","Revisione:","[Rev.]"],["Titolo:","ANALISI DEI RISCHI E POLITICA DI SICUREZZA DEI SISTEMI INFORMATIVI","",""],["Ambito:","Misure · art. 24 c. 2 lett. a)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24 · UNI CEI EN ISO/IEC 27001","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le politiche di analisi dei rischi e di sicurezza dei sistemi informativi e di rete, e le modalità di individuazione e trattamento dei rischi."},{"k":"h","t":"2. AMBITO"},{"k":"p","t":"L'analisi copre i sistemi informativi e di rete utilizzati per lo svolgimento delle attività e per la fornitura dei servizi, comprese le componenti gestite da terzi. L'ambito è definito nel MOD-03.01 e comprende: sedi e infrastrutture, reti e perimetri, sistemi e applicazioni, dati, servizi erogati, dipendenze da fornitori."},{"k":"h","t":"2.1 Inventario come presupposto"},{"k":"p","t":"L'analisi dei rischi presuppone l'inventario degli attivi e dei servizi (PNS-10). Una valutazione condotta su un perimetro non inventariato è una valutazione parziale per costruzione, e i sistemi dimenticati sono quelli che vengono compromessi."},{"k":"h","t":"3. METODOLOGIA"},{"k":"t","h":["Fase","Contenuto"],"r":[["1 · Identificazione","Attivi, servizi, processi di supporto, dipendenze, dati trattati"],["2 · Minacce","Minacce applicabili per categoria: attacchi mirati, ransomware, compromissione della catena di fornitura, errori, guasti, eventi naturali, minacce interne"],["3 · Vulnerabilità","Debolezze tecniche e organizzative rilevate, anche mediante le attività della PNS-07"],["4 · Valutazione","Probabilità e impatto secondo le scale definite"],["5 · Trattamento","Riduzione, trasferimento, accettazione motivata, elusione"],["6 · Rischio residuo","Rivalutazione dopo le misure, con accettazione formale"]]},{"k":"h","t":"3.1 Scale"},{"k":"t","h":["Probabilità","Descrizione"],"r":[["1 · improbabile","Nessun precedente noto, assenza di esposizione diretta"],["2 · possibile","Scenario documentato nel settore, esposizione limitata"],["3 · probabile","Esposizione diretta e tecniche di attacco diffuse"],["4 · molto probabile","Tentativi già rilevati o vulnerabilità nota non ancora sanata"]]},{"k":"t","h":["Impatto","Descrizione"],"r":[["1 · lieve","Disservizio contenuto, nessun effetto sui servizi rilevanti"],["2 · moderato","Degrado di un servizio rilevante, ripristino entro l'obiettivo"],["3 · grave","Interruzione di un servizio rilevante, possibile incidente significativo"],["4 · molto grave","Interruzione prolungata, effetti su altri soggetti, incidente significativo certo"]]},{"k":"p","t":"Il rischio è il prodotto: 1÷3 basso, 4÷7 medio, 8÷11 alto, 12÷16 critico."},{"k":"h","t":"3.2 Accettabilità"},{"k":"p","t":"Il rischio alto e critico non è accettabile e genera un'azione con responsabile, risorse e termine. L'accettazione di un rischio residuo alto è ammessa solo con decisione motivata dell'organo di amministrazione, registrata."},{"k":"h","t":"4. POLITICA DI SICUREZZA"},{"k":"p","t":"La politica (MOD-03.02) è approvata dall'organo di amministrazione, comunicata al personale e ai terzi interessati, e riesaminata almeno annualmente e a fronte di modifiche significative."},{"k":"p","t":"Definisce: obiettivi e principi; ambito; ruoli e responsabilità; regole generali di utilizzo dei sistemi; classificazione delle informazioni; requisiti minimi per gli accessi, la crittografia e la registrazione degli eventi; conseguenze delle violazioni."},{"k":"h","t":"5. AGGIORNAMENTO"},{"k":"p","t":"L'analisi è riesaminata almeno annualmente e comunque a fronte di: modifiche architetturali o di perimetro; introduzione di nuovi servizi, applicazioni o fornitori; incidenti significativi; vulnerabilità critiche rilevate; segnalazioni dell'Autorità; modifiche normative."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Attivi rilevanti coperti dall'analisi","MOD-03.01","Semestrale","100%"],["Rischi alti e critici con trattamento attuato nei termini","MOD-03.03","Trimestrale","100%"],["Riesame dell'analisi svolto","MOD-03.03","Annuale","Nei termini"],["Accettazioni di rischio residuo alto formalizzate","MOD-03.04","Semestrale","100%"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-03.01","Definizione dell'ambito e delle dipendenze","Sedi, reti, sistemi, servizi, fornitori, dati"],["MOD-03.02","Politica di sicurezza dei sistemi informativi","Obiettivi, principi, regole, responsabilità, approvazione"],["MOD-03.03","Registro dei rischi","Attivo, minaccia, vulnerabilità, probabilità, impatto, misure, rischio residuo"],["MOD-03.04","Accettazione del rischio residuo","Rischio, motivazione, alternative valutate, approvazione"]]}]},"PNS-04":{"codice":"PNS-04","titolo":"Gestione degli incidenti e obblighi di notifica","fase":"Misure · art. 24 c. 2 lett. b)","rif":"D.Lgs. 138/2024, artt. 24, 25","blocks":[{"k":"t","h":["PROCEDURA PNS-04","","",""],"r":[["Codice:","PNS-04","Revisione:","[Rev.]"],["Titolo:","GESTIONE DEGLI INCIDENTI E OBBLIGHI DI NOTIFICA","",""],["Ambito:","Misure · art. 24 c. 2 lett. b)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, artt. 24, 25","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di rilevazione, classificazione, gestione e notifica degli incidenti di sicurezza informatica, e gli obblighi di comunicazione verso l'Autorità e i destinatari dei servizi."},{"k":"h","t":"2. DEFINIZIONI OPERATIVE"},{"k":"t","h":["Termine","Uso"],"r":[["Evento","Occorrenza rilevata che può indicare una violazione delle politiche o un malfunzionamento"],["Incidente","Evento che compromette la disponibilità, l'autenticità, l'integrità o la riservatezza di dati conservati, trasmessi o elaborati, ovvero dei servizi offerti o accessibili tramite i sistemi"],["Incidente significativo","Incidente che ha causato o è in grado di causare una grave perturbazione operativa dei servizi o perdite finanziarie per il soggetto interessato, ovvero che si è ripercosso o è in grado di ripercuotersi su altre persone fisiche o giuridiche causando perdite materiali o immateriali considerevoli"],["Quasi incidente","Evento che avrebbe potuto compromettere la sicurezza ma la cui evoluzione è stata impedita o non si è verificata"],["Grave minaccia informatica","Minaccia che può ripercuotersi negativamente sui destinatari dei servizi"]]},{"k":"p","t":"La qualificazione di significatività è la determinazione più delicata del processo e va assunta con tempestività, perché da essa dipende la decorrenza di termini brevi e perentori."},{"k":"h","t":"3. TERMINI DI NOTIFICA"},{"k":"t","h":["Adempimento","Termine","Contenuto"],"r":[["Pre-notifica","Entro 24 ore dalla conoscenza dell'incidente significativo","Indicazione se l'incidente sia sospettato di essere causato da atti illegittimi o malevoli o possa avere impatto transfrontaliero"],["Notifica","Entro 72 ore dalla conoscenza","Aggiornamento delle informazioni della pre-notifica, valutazione iniziale di gravità e impatto, indicatori di compromissione ove disponibili"],["Relazione intermedia","Su richiesta dell'Autorità","Aggiornamenti sulla situazione e sullo stato della gestione"],["Relazione finale","Entro un mese dalla notifica","Descrizione dettagliata, tipologia di minaccia e cause, misure di attenuazione adottate e in corso, impatto transfrontaliero"],["Relazione di avanzamento","Se l'incidente è ancora in corso al termine del mese","Stato dell'incidente, con relazione finale entro un mese dalla sua gestione conclusiva"]]},{"k":"p","t":"Il termine decorre dalla conoscenza dell'incidente, non dalla sua conclusione. L'attesa di un quadro completo prima di pre-notificare è l'errore più frequente e comporta di per sé una violazione."},{"k":"h","t":"4. CRITERI DI SIGNIFICATIVITÀ"},{"k":"p","t":"La valutazione (MOD-04.02) considera:"},{"k":"l","i":["durata dell'interruzione o del degrado del servizio;","numero di utenti o destinatari interessati;","estensione geografica dell'area interessata;","perdite finanziarie subite o attese;","compromissione di dati, con riguardo a riservatezza, integrità e disponibilità;","effetti su altri soggetti, compresi quelli della catena di fornitura;","rilevanza per la sicurezza pubblica o per l'incolumità delle persone;","sospetto di atti illegittimi o malevoli;","possibile impatto transfrontaliero."]},{"k":"p","t":"Sono inoltre applicati i parametri quantitativi eventualmente stabiliti dalle determinazioni dell'Autorità e dalla normativa settoriale."},{"k":"h","t":"5. PROCESSO DI GESTIONE"},{"k":"t","h":["Fase","Attività","Termine indicativo"],"r":[["Rilevazione","Segnalazione da monitoraggio, utenti, fornitori o terzi; registrazione","Immediata"],["Triage","Verifica preliminare, classificazione, attivazione del gruppo di risposta","Entro 1 ora"],["Valutazione di significatività","Applicazione dei criteri; decisione sulla notifica","Entro 12 ore"],["Contenimento","Isolamento, blocco delle propagazioni, conservazione delle evidenze","Immediato e continuo"],["Eradicazione e ripristino","Rimozione della causa, ripristino dei servizi secondo la PNS-05","Secondo gli obiettivi definiti"],["Analisi delle cause","Ricostruzione della catena degli eventi e delle cause profonde","Entro 15 giorni"],["Azioni correttive","Definizione e attuazione, con verifica di efficacia","Secondo il piano"],["Chiusura","Relazione finale, aggiornamento dell'analisi dei rischi","Entro 1 mese"]]},{"k":"h","t":"5.1 Conservazione delle evidenze"},{"k":"p","t":"Le attività di contenimento sono condotte preservando le evidenze utili all'analisi e alle eventuali attività dell'autorità giudiziaria. La cancellazione o la reinstallazione immediata dei sistemi compromessi distrugge informazioni necessarie e va evitata salvo necessità di continuità documentata."},{"k":"h","t":"6. COMUNICAZIONI"},{"k":"t","h":["Destinatario","Quando"],"r":[["Autorità","Secondo i termini del punto 3"],["Destinatari dei servizi","Senza ingiustificato ritardo, quando l'incidente significativo può ripercuotersi negativamente sulla fornitura, ovvero in presenza di gravi minacce informatiche, con indicazione delle misure che possono adottare"],["Autorità giudiziaria","Quando ricorrano ipotesi di reato"],["Garante per la protezione dei dati","Quando l'incidente costituisca violazione di dati personali, secondo la disciplina applicabile"],["Fornitori e clienti interessati","Secondo gli obblighi contrattuali della PNS-06"]]},{"k":"p","t":"La notifica all'Autorità e quella al Garante rispondono a presupposti e termini distinti: l'una non assorbe l'altra."},{"k":"h","t":"7. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Pre-notifiche effettuate entro 24 ore","MOD-04.03","Trimestrale","100%"],["Notifiche effettuate entro 72 ore","MOD-04.03","Trimestrale","100%"],["Relazioni finali trasmesse entro un mese","MOD-04.03","Trimestrale","100%"],["Incidenti con analisi delle cause completata","MOD-04.04","Trimestrale","100%"],["Tempo medio di rilevazione e di contenimento","MOD-04.03","Trimestrale","In riduzione"]]},{"k":"h","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-04.01","Procedura operativa di risposta","Ruoli, contatti, escalation, azioni per tipologia di incidente"],["MOD-04.02","Scheda di valutazione della significatività","Criteri, valutazione, esito, decisione sulla notifica"],["MOD-04.03","Registro degli incidenti e delle notifiche","Evento, classificazione, termini, notifiche, esito"],["MOD-04.04","Rapporto di analisi dell'incidente","Cronologia, cause, impatto, misure, azioni correttive"],["MOD-04.05","Modello di notifica all'Autorità","Contenuti della pre-notifica, notifica e relazione finale"]]}]},"PNS-05":{"codice":"PNS-05","titolo":"Continuità operativa, backup e gestione delle crisi","fase":"Misure · art. 24 c. 2 lett. c)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-05","","",""],"r":[["Codice:","PNS-05","Revisione:","[Rev.]"],["Titolo:","CONTINUITÀ OPERATIVA, BACKUP E GESTIONE DELLE CRISI","",""],["Ambito:","Misure · art. 24 c. 2 lett. c)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure di continuità operativa, la gestione dei backup, il ripristino in caso di disastro e la gestione delle crisi."},{"k":"h","t":"2. ANALISI DI IMPATTO"},{"k":"p","t":"Per ciascun servizio rilevante sono determinati (MOD-05.01): criticità, tempo massimo tollerabile di interruzione, obiettivo di tempo di ripristino, obiettivo di punto di ripristino, risorse minime necessarie, dipendenze da terzi."},{"k":"p","t":"Gli obiettivi dichiarati devono essere dimostrabili: un obiettivo di ripristino mai verificato con un test è una dichiarazione di intenti, e in sede di ispezione viene trattato come tale."},{"k":"h","t":"3. BACKUP"},{"k":"t","h":["Requisito","Contenuto"],"r":[["Copertura","Tutti i dati e le configurazioni necessari al ripristino dei servizi rilevanti"],["Frequenza","Coerente con l'obiettivo di punto di ripristino definito per ciascun servizio"],["Separazione","Almeno una copia isolata dalla rete di produzione, non raggiungibile con le credenziali di dominio"],["Immutabilità","Copie non modificabili né cancellabili per il periodo di ritenzione stabilito"],["Cifratura","Applicata ai supporti e ai trasferimenti, con gestione delle chiavi secondo la PNS-09"],["Verifica di ripristino","Prove di ripristino effettivo con periodicità definita e registrazione degli esiti"],["Ritenzione","Definita per tipologia, coerente con gli obblighi applicabili"]]},{"k":"p","t":"La separazione della copia dalla rete di produzione è la misura che distingue un'organizzazione che sopravvive a un attacco ransomware da una che paga: i backup raggiungibili con credenziali privilegiate vengono cifrati insieme ai sistemi."},{"k":"h","t":"4. PIANO DI CONTINUITÀ"},{"k":"p","t":"Il piano (MOD-05.02) definisce per ciascuno scenario: modalità di attivazione e soglie; composizione e reperibilità del gruppo di gestione della crisi; procedure di ripristino per priorità di servizio; modalità operative alternative; canali di comunicazione alternativi, indipendenti dai sistemi potenzialmente compromessi; comunicazione interna, verso i clienti, verso l'Autorità e verso i mezzi di informazione."},{"k":"h","t":"4.1 Canali indipendenti"},{"k":"p","t":"I contatti di emergenza, le procedure e le credenziali di ripristino sono disponibili anche in forma non dipendente dai sistemi aziendali. Un piano di continuità conservato esclusivamente sul dominio compromesso non è utilizzabile proprio quando serve."},{"k":"h","t":"5. TEST ED ESERCITAZIONI"},{"k":"t","h":["Attività","Periodicità minima"],"r":[["Prova di ripristino da backup di un servizio rilevante","Semestrale"],["Prova di ripristino completo di un servizio critico","Annuale"],["Esercitazione di gestione della crisi, anche in forma simulata","Annuale"],["Verifica dei contatti e delle reperibilità","Semestrale"]]},{"k":"p","t":"Ogni prova è verbalizzata con tempi rilevati, scostamenti dagli obiettivi, criticità e azioni conseguenti."},{"k":"h","t":"6. GESTIONE DELLA CRISI"},{"k":"p","t":"Il gruppo di gestione della crisi è attivato secondo le soglie stabilite, opera secondo il piano e mantiene un registro delle decisioni. Il coordinamento con la gestione dell'incidente della PNS-04 è assicurato: la notifica all'Autorità non è sospesa dall'attivazione della crisi."},{"k":"h","t":"7. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Servizi rilevanti con obiettivi di ripristino definiti","MOD-05.01","Annuale","100%"],["Prove di ripristino eseguite secondo il piano","MOD-05.03","Semestrale","100%"],["Prove di ripristino con esito entro l'obiettivo","MOD-05.03","Semestrale","≥ 90%"],["Copie separate e immutabili verificate","MOD-05.03","Trimestrale","100%"],["Esercitazioni di crisi svolte","MOD-05.04","Annuale","Nei termini"]]},{"k":"h","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-05.01","Analisi di impatto sui servizi","Servizio, criticità, obiettivi di ripristino, risorse, dipendenze"],["MOD-05.02","Piano di continuità operativa","Scenari, attivazione, gruppo di crisi, procedure, comunicazioni"],["MOD-05.03","Registro dei backup e delle prove di ripristino","Ambito, frequenza, separazione, prova, esito"],["MOD-05.04","Verbale di esercitazione","Scenario, partecipanti, tempi, criticità, azioni"]]}]},"PNS-06":{"codice":"PNS-06","titolo":"Sicurezza della catena di approvvigionamento","fase":"Misure · art. 24 c. 2 lett. d)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-06","","",""],"r":[["Codice:","PNS-06","Revisione:","[Rev.]"],["Titolo:","SICUREZZA DELLA CATENA DI APPROVVIGIONAMENTO","",""],["Ambito:","Misure · art. 24 c. 2 lett. d)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure di sicurezza nei rapporti con i fornitori diretti e con i fornitori di servizi, comprese le misure relative alla qualità dei prodotti e delle pratiche di sicurezza dei fornitori."},{"k":"h","t":"2. CENSIMENTO E CLASSIFICAZIONE"},{"k":"p","t":"Tutti i fornitori che accedono ai sistemi, trattano dati o erogano servizi rilevanti sono censiti nel MOD-06.01 e classificati:"},{"k":"t","h":["Classe","Criterio","Regime"],"r":[["A · critica","Accesso privilegiato ai sistemi, gestione di servizi rilevanti, trattamento di dati critici, impossibilità di sostituzione rapida","Valutazione approfondita, clausole rafforzate, verifica periodica, piano di uscita"],["B · rilevante","Accesso limitato o servizio sostituibile con impatto contenuto","Valutazione documentale, clausole standard, riverifica periodica"],["C · ordinaria","Nessun accesso ai sistemi né trattamento di dati rilevanti","Verifica essenziale"]]},{"k":"h","t":"3. VALUTAZIONE DEI FORNITORI"},{"k":"p","t":"La valutazione (MOD-06.02) considera: pratiche di sicurezza documentate e certificazioni possedute; gestione delle vulnerabilità e tempi di rimedio dichiarati; modalità di accesso ai sistemi dell'organizzazione; localizzazione dei dati e dei sistemi; subfornitura e catena a valle; storico di incidenti e loro gestione; solidità e continuità del fornitore."},{"k":"h","t":"3.1 Subfornitura"},{"k":"p","t":"La catena non si esaurisce nel fornitore diretto. Per i fornitori di classe A è richiesta l'indicazione dei subfornitori rilevanti e l'obbligo di comunicazione preventiva delle variazioni: la maggior parte delle compromissioni della catena di fornitura passa da un soggetto con cui l'organizzazione non ha alcun rapporto contrattuale diretto."},{"k":"h","t":"4. CLAUSOLE CONTRATTUALI"},{"k":"p","t":"Nei contratti con fornitori di classe A e B sono inserite (MOD-06.03):"},{"k":"l","i":["obbligo di adottare misure di sicurezza adeguate e di mantenerle nel tempo;","obbligo di notifica degli incidenti che interessano i servizi resi, entro un termine compatibile con gli obblighi di notifica dell'organizzazione;","obbligo di collaborazione nella gestione dell'incidente e nella ricostruzione degli eventi;","facoltà di verifica e di audit, diretta o tramite terzi;","requisiti su accessi, credenziali, autenticazione a più fattori e tracciamento;","obblighi in materia di gestione delle vulnerabilità e di aggiornamento;","obblighi in materia di trattamento e localizzazione dei dati;","obbligo di comunicazione preventiva della subfornitura rilevante;","obblighi alla cessazione: restituzione o cancellazione dei dati, revoca degli accessi."]},{"k":"h","t":"4.1 Termine di notifica del fornitore"},{"k":"p","t":"Il termine contrattuale di notifica va fissato in modo che l'organizzazione possa rispettare le proprie ventiquattro ore. Un fornitore che notifichi entro settantadue ore rende impossibile l'adempimento e va rinegoziato."},{"k":"h","t":"5. GESTIONE DEGLI ACCESSI DEI FORNITORI"},{"k":"p","t":"Gli accessi sono nominativi, limitati nel tempo e nell'ambito, protetti da autenticazione a più fattori, tracciati e riesaminati almeno semestralmente. Gli accessi permanenti non giustificati sono revocati."},{"k":"h","t":"6. VERIFICA PERIODICA E USCITA"},{"k":"p","t":"I fornitori di classe A sono riverificati almeno annualmente. Per ciascuno è definito un piano di uscita che indica: modalità di recupero dei dati, tempi, soluzioni alternative, dipendenze tecniche da sciogliere."},{"k":"h","t":"7. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Fornitori censiti e classificati","MOD-06.01","Semestrale","100%"],["Fornitori di classe A con valutazione in corso di validità","MOD-06.02","Trimestrale","100%"],["Contratti con clausole di sicurezza","MOD-06.01","Semestrale","100%"],["Fornitori con obbligo di notifica entro termine compatibile","MOD-06.01","Semestrale","100%"],["Accessi dei fornitori riesaminati","MOD-10.03","Semestrale","100%"],["Fornitori di classe A con piano di uscita","MOD-06.04","Annuale","100%"]]},{"k":"h","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-06.01","Registro dei fornitori","Fornitore, servizio, classe, accessi, clausole, verifiche"],["MOD-06.02","Scheda di valutazione del fornitore","Pratiche di sicurezza, certificazioni, incidenti, esito"],["MOD-06.03","Clausole contrattuali di sicurezza","Articolato tipo per contratti con fornitori ICT"],["MOD-06.04","Piano di uscita dal fornitore","Dati, tempi, alternative, dipendenze, prove"]]}]},"PNS-07":{"codice":"PNS-07","titolo":"Sicurezza nell'acquisizione, sviluppo e manutenzione; gestione delle vulnerabilità","fase":"Misure · art. 24 c. 2 lett. e)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-07","","",""],"r":[["Codice:","PNS-07","Revisione:","[Rev.]"],["Titolo:","SICUREZZA NELL'ACQUISIZIONE, SVILUPPO E MANUTENZIONE; GESTIONE DELLE VULNERABILITÀ","",""],["Ambito:","Misure · art. 24 c. 2 lett. e)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce i requisiti di sicurezza per l'acquisizione, lo sviluppo e la manutenzione dei sistemi informativi e di rete, la gestione delle vulnerabilità e la loro divulgazione."},{"k":"h","t":"2. ACQUISIZIONE"},{"k":"p","t":"I requisiti di sicurezza sono definiti prima dell'acquisizione e costituiscono criterio di valutazione (MOD-07.01): autenticazione e gestione delle identità; cifratura dei dati in transito e a riposo; registrazione degli eventi e loro esportabilità; supporto e durata degli aggiornamenti di sicurezza; assenza di credenziali predefinite non modificabili; conformità a standard riconosciuti; possibilità di integrazione con i sistemi di monitoraggio."},{"k":"p","t":"Il termine di fine supporto dei prodotti acquisiti è registrato e presidiato: l'utilizzo di componenti fuori supporto è una vulnerabilità non sanabile con misure compensative permanenti."},{"k":"h","t":"3. SVILUPPO"},{"k":"t","h":["Requisito","Contenuto"],"r":[["Separazione degli ambienti","Sviluppo, collaudo e produzione separati; dati di produzione non utilizzati in collaudo senza anonimizzazione"],["Requisiti di sicurezza","Definiti in fase di analisi e verificati prima del rilascio"],["Analisi del codice","Analisi statica e delle dipendenze di terze parti, con verifica delle vulnerabilità note"],["Gestione dei segreti","Credenziali e chiavi non presenti nel codice né nei repository"],["Controllo delle versioni","Tracciabilità delle modifiche, revisione fra pari, approvazione del rilascio"],["Test di sicurezza","Verifiche prima del rilascio in produzione, proporzionate alla criticità"]]},{"k":"h","t":"4. GESTIONE DELLE MODIFICHE"},{"k":"p","t":"Ogni modifica ai sistemi in produzione è registrata, valutata quanto agli effetti sulla sicurezza, autorizzata e dotata di piano di ripristino. Le modifiche di emergenza sono ammesse con autorizzazione successiva entro un termine breve e con registrazione dedicata."},{"k":"h","t":"5. GESTIONE DELLE VULNERABILITÀ"},{"k":"t","h":["Attività","Contenuto","Periodicità"],"r":[["Fonti","Avvisi dell'Autorità e dei CSIRT, avvisi dei fornitori, basi di dati pubbliche di vulnerabilità","Continua"],["Scansione","Scansione delle vulnerabilità sui sistemi esposti e interni","Almeno mensile per gli esposti"],["Valutazione","Attribuzione della criticità in ragione della gravità, dell'esposizione e dello sfruttamento noto in rete","A ogni rilevazione"],["Rimedio","Applicazione degli aggiornamenti o misure compensative documentate","Secondo i termini"],["Verifica","Conferma dell'avvenuto rimedio","Successiva"]]},{"k":"h","t":"5.1 Termini di rimedio"},{"k":"t","h":["Criticità","Sistemi esposti","Sistemi interni"],"r":[["Critica, con sfruttamento noto in rete","48 ore","7 giorni"],["Critica","7 giorni","15 giorni"],["Alta","15 giorni","30 giorni"],["Media","30 giorni","90 giorni"],["Bassa","Al successivo ciclo di manutenzione","Al successivo ciclo di manutenzione"]]},{"k":"p","t":"Lo scostamento dai termini è ammesso con motivazione registrata, misura compensativa e nuova scadenza."},{"k":"h","t":"6. DIVULGAZIONE COORDINATA"},{"k":"p","t":"L'organizzazione mette a disposizione un canale per la segnalazione di vulnerabilità da parte di terzi, ne definisce le modalità di trattamento e i tempi di riscontro, e coopera con l'Autorità nei processi di divulgazione coordinata."},{"k":"h","t":"7. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Vulnerabilità critiche sanate nei termini","MOD-07.03","Mensile","100%"],["Vulnerabilità alte sanate nei termini","MOD-07.03","Mensile","≥ 95%"],["Scansioni eseguite secondo il piano","MOD-07.03","Mensile","100%"],["Sistemi fuori supporto in produzione","MOD-10.01","Trimestrale","0"],["Modifiche in produzione autorizzate","MOD-07.02","Mensile","100%"],["Tempo medio di rimedio delle vulnerabilità critiche","MOD-07.03","Trimestrale","In riduzione"]]},{"k":"h","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-07.01","Requisiti di sicurezza per l'acquisizione","Requisiti, verifica, esito, fine supporto"],["MOD-07.02","Registro delle modifiche","Modifica, valutazione, autorizzazione, ripristino, esito"],["MOD-07.03","Registro delle vulnerabilità","Vulnerabilità, criticità, esposizione, termine, rimedio, verifica"],["MOD-07.04","Canale di divulgazione delle vulnerabilità","Modalità, riscontro, trattamento, coordinamento"]]}]},"PNS-08":{"codice":"PNS-08","titolo":"Igiene informatica di base, formazione e consapevolezza","fase":"Misure · art. 24 c. 2 lett. g)","rif":"D.Lgs. 138/2024, artt. 23, 24","blocks":[{"k":"t","h":["PROCEDURA PNS-08","","",""],"r":[["Codice:","PNS-08","Revisione:","[Rev.]"],["Titolo:","IGIENE INFORMATICA DI BASE, FORMAZIONE E CONSAPEVOLEZZA","",""],["Ambito:","Misure · art. 24 c. 2 lett. g)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, artt. 23, 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le pratiche di igiene informatica di base e il programma di formazione e consapevolezza in materia di sicurezza informatica."},{"k":"h","t":"2. PRATICHE DI IGIENE DI BASE"},{"k":"t","h":["Pratica","Contenuto"],"r":[["Aggiornamento","Sistemi operativi, applicazioni e dispositivi mantenuti aggiornati secondo la PNS-07"],["Credenziali","Divieto di credenziali predefinite e condivise; requisiti di robustezza; gestore di credenziali messo a disposizione"],["Privilegi","Utenze ordinarie prive di privilegi amministrativi; utenze amministrative nominative e separate"],["Protezione degli endpoint","Soluzioni di protezione attive, aggiornate e monitorate su tutte le postazioni e sui server"],["Posta elettronica","Filtri antimalware e antiphishing, protocolli di autenticazione del dominio, marcatura dei messaggi esterni"],["Navigazione","Filtri sui contenuti e controllo delle destinazioni"],["Supporti rimovibili","Uso limitato e controllato, cifratura obbligatoria"],["Configurazioni","Configurazioni di riferimento definite e verificate, servizi non necessari disattivati"],["Segmentazione","Separazione delle reti per criticità, isolamento dei sistemi non aggiornabili"],["Registrazione degli eventi","Attiva sui sistemi rilevanti, con conservazione e protezione da alterazione"],["Dispositivi personali","Regole per l'utilizzo di dispositivi non aziendali, ove ammesso"]]},{"k":"h","t":"3. FORMAZIONE"},{"k":"t","h":["Destinatari","Contenuti","Periodicità"],"r":[["Organi di amministrazione e direttivi","Quadro normativo e responsabilità, scenari di rischio, governo della sicurezza, gestione della crisi, obblighi di notifica","All'insediamento e almeno annuale"],["Personale amministratore di sistema","Sicurezza delle configurazioni, gestione delle utenze privilegiate, registrazione, risposta agli incidenti","Annuale"],["Personale di sviluppo","Sviluppo sicuro, gestione delle dipendenze e dei segreti","Annuale"],["Tutto il personale","Riconoscimento del phishing, gestione delle credenziali, uso dei dispositivi, segnalazione degli eventi sospetti","All'ingresso e almeno annuale"],["Personale con accesso a sistemi critici","Contenuti specifici sul proprio ambito","Semestrale"]]},{"k":"p","t":"La formazione degli organi è un obbligo autonomo e la sua assenza è direttamente contestabile: va documentata con contenuti, durata e attestazione dei partecipanti."},{"k":"h","t":"4. CONSAPEVOLEZZA"},{"k":"p","t":"Sono condotte attività continuative: comunicazioni periodiche su minacce correnti; simulazioni di phishing con esito registrato e formazione mirata per chi cade nella simulazione, senza finalità sanzionatoria; promemoria operativi; verifica della conoscenza delle modalità di segnalazione."},{"k":"h","t":"4.1 Cultura della segnalazione"},{"k":"p","t":"Il personale deve poter segnalare un errore proprio — un allegato aperto, una credenziale inserita su un sito falso — senza timore di conseguenze. Un'organizzazione che sanziona chi segnala apprende della compromissione settimane dopo, dal riscatto."},{"k":"h","t":"5. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Personale formato nei termini","MOD-08.02","Trimestrale","100%"],["Componenti degli organi formati","MOD-08.02","Annuale","100%"],["Tasso di clic nelle simulazioni di phishing","MOD-08.03","Trimestrale","In riduzione"],["Tasso di segnalazione nelle simulazioni","MOD-08.03","Trimestrale","In crescita"],["Postazioni con protezione attiva e aggiornata","MOD-08.01","Mensile","100%"],["Utenze ordinarie con privilegi amministrativi","MOD-10.03","Mensile","0"]]},{"k":"h","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-08.01","Verifica delle pratiche di igiene di base","Pratica, stato di attuazione, copertura, evidenza"],["MOD-08.02","Registro della formazione","Sessione, destinatari, contenuti, durata, verifica, scadenza"],["MOD-08.03","Registro delle simulazioni","Campagna, destinatari, esiti, formazione mirata"]]}]},"PNS-09":{"codice":"PNS-09","titolo":"Crittografia e protezione dei dati","fase":"Misure · art. 24 c. 2 lett. h)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-09","","",""],"r":[["Codice:","PNS-09","Revisione:","[Rev.]"],["Titolo:","CRITTOGRAFIA E PROTEZIONE DEI DATI","",""],["Ambito:","Misure · art. 24 c. 2 lett. h)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le politiche e le procedure relative all'uso della crittografia e, se del caso, della cifratura, e le modalità di gestione delle chiavi."},{"k":"h","t":"2. CLASSIFICAZIONE DELLE INFORMAZIONI"},{"k":"p","t":"Le informazioni sono classificate (MOD-09.01) per livello di riservatezza e criticità. La classificazione determina i requisiti di cifratura, di conservazione, di trasmissione e di cancellazione."},{"k":"h","t":"3. REQUISITI DI CIFRATURA"},{"k":"t","h":["Ambito","Requisito"],"r":[["Dati in transito su reti pubbliche","Cifratura con protocolli aggiornati; disabilitazione di versioni e suite obsolete"],["Dati in transito su reti interne","Cifratura per i flussi che trasportano dati classificati o credenziali"],["Dati a riposo su server e archivi","Cifratura per i dati classificati, con gestione delle chiavi separata dai dati"],["Postazioni e dispositivi mobili","Cifratura integrale del supporto"],["Supporti rimovibili","Cifratura obbligatoria"],["Backup","Cifratura dei supporti e dei trasferimenti, secondo la PNS-05"],["Posta elettronica","Cifratura del trasporto; cifratura del contenuto per le informazioni classificate"],["Accessi remoti","Canali cifrati con autenticazione a più fattori"]]},{"k":"h","t":"3.1 Algoritmi"},{"k":"p","t":"Sono impiegati algoritmi e lunghezze di chiave riconosciuti come adeguati dagli standard e dalle raccomandazioni vigenti. L'elenco degli algoritmi ammessi e di quelli vietati è mantenuto nel MOD-09.02 e riesaminato almeno annualmente."},{"k":"h","t":"4. GESTIONE DELLE CHIAVI"},{"k":"t","h":["Fase","Requisito"],"r":[["Generazione","In ambiente sicuro, con generatori adeguati"],["Conservazione","Separata dai dati cifrati, con accesso limitato e tracciato; ove possibile in modulo dedicato"],["Distribuzione","Attraverso canali sicuri, senza trasmissione in chiaro"],["Rotazione","Con periodicità definita per tipologia e a fronte di sospetta compromissione"],["Revoca e distruzione","Procedura definita, con registrazione"],["Recupero","Procedura di deposito o recupero documentata, che eviti sia la perdita irreversibile sia l'indebolimento della protezione"]]},{"k":"p","t":"La perdita delle chiavi produce lo stesso effetto della cifratura da parte di un attaccante: i dati diventano inaccessibili. La procedura di recupero è parte integrante della misura, non un'eccezione."},{"k":"h","t":"5. CERTIFICATI"},{"k":"p","t":"I certificati impiegati sono censiti con emittente, ambito e scadenza, e il rinnovo è presidiato con anticipo adeguato. La scadenza non presidiata di un certificato è una causa ricorrente di interruzione di servizio."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Servizi esposti con cifratura conforme","MOD-09.03","Mensile","100%"],["Dispositivi con cifratura integrale attiva","MOD-09.03","Mensile","100%"],["Algoritmi obsoleti ancora in uso","MOD-09.02","Trimestrale","0"],["Certificati rinnovati prima della scadenza","MOD-09.04","Mensile","100%"],["Rotazioni delle chiavi eseguite secondo il piano","MOD-09.02","Semestrale","100%"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-09.01","Classificazione delle informazioni","Categoria, livello, requisiti di trattamento e cifratura"],["MOD-09.02","Registro delle chiavi e degli algoritmi","Chiave, ambito, algoritmo, generazione, rotazione, custodia"],["MOD-09.03","Verifica dell'applicazione della cifratura","Ambito, verifica, esito, scostamenti"],["MOD-09.04","Registro dei certificati","Certificato, emittente, ambito, scadenza, rinnovo"]]}]},"PNS-10":{"codice":"PNS-10","titolo":"Sicurezza delle risorse umane, controllo degli accessi e gestione degli attivi","fase":"Misure · art. 24 c. 2 lett. i)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-10","","",""],"r":[["Codice:","PNS-10","Revisione:","[Rev.]"],["Titolo:","SICUREZZA DELLE RISORSE UMANE, CONTROLLO DEGLI ACCESSI E GESTIONE DEGLI ATTIVI","",""],["Ambito:","Misure · art. 24 c. 2 lett. i)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure relative alla sicurezza del personale, alle politiche di controllo degli accessi e alla gestione degli attivi."},{"k":"h","t":"2. GESTIONE DEGLI ATTIVI"},{"k":"p","t":"L'inventario (MOD-10.01) è mantenuto aggiornato e comprende: server e sistemi virtuali; postazioni e dispositivi mobili; apparati di rete e di sicurezza; applicazioni e servizi, anche in cloud; basi di dati e archivi; account di servizio; certificati; licenze e contratti collegati."},{"k":"p","t":"Per ciascun attivo sono indicati: proprietario, criticità, servizio supportato, collocazione, stato di supporto, data di fine supporto."},{"k":"h","t":"2.1 Attivi non censiti"},{"k":"p","t":"La verifica periodica di coerenza tra inventario e rilevazione automatica dei sistemi presenti in rete è la misura che intercetta gli attivi non censiti. Sono questi, di norma, i sistemi privi di aggiornamenti e di monitoraggio."},{"k":"h","t":"3. SICUREZZA DELLE RISORSE UMANE"},{"k":"t","h":["Fase","Misure"],"r":[["Selezione","Verifiche proporzionate al ruolo, nei limiti consentiti dalla normativa"],["Assunzione","Sottoscrizione degli obblighi di riservatezza e delle regole di utilizzo dei sistemi; consegna delle credenziali con procedura tracciata"],["Durante il rapporto","Formazione secondo la PNS-08; aggiornamento dei profili a ogni cambio di ruolo"],["Cessazione o cambio di ruolo","Revoca degli accessi entro il giorno lavorativo successivo, restituzione dei dispositivi, disattivazione delle utenze, trasferimento dei dati"],["Personale esterno","Medesimi obblighi per contratto; accessi a termine"]]},{"k":"p","t":"La revoca tempestiva degli accessi alla cessazione è tra le carenze più frequenti e più facilmente accertabili in sede di verifica: un elenco di utenze attive intestate a persone non più in organico è un rilievo immediato."},{"k":"h","t":"4. CONTROLLO DEGLI ACCESSI"},{"k":"t","h":["Principio","Attuazione"],"r":[["Necessità","Accesso limitato a quanto necessario al ruolo; privilegio minimo"],["Nominatività","Utenze nominative; divieto di utenze condivise, salvo eccezioni registrate con misure compensative"],["Separazione","Utenze amministrative distinte da quelle ordinarie, non utilizzate per attività quotidiane"],["Utenze privilegiate","Elenco mantenuto, autenticazione a più fattori obbligatoria, sessioni tracciate, riesame trimestrale"],["Utenze di servizio","Censite, con credenziali gestite e rotate, prive di accesso interattivo"],["Accessi remoti","Canali cifrati, autenticazione a più fattori, limitazione delle origini ove possibile"],["Riesame","Riesame periodico dei diritti di accesso, almeno semestrale e trimestrale per i privilegi elevati"]]},{"k":"h","t":"5. REGISTRAZIONE E MONITORAGGIO"},{"k":"p","t":"Gli eventi rilevanti sono registrati e conservati per il periodo stabilito, protetti da alterazione e cancellazione. Sono monitorati almeno: autenticazioni fallite ripetute, accessi privilegiati, modifiche delle utenze e dei gruppi, disattivazione dei controlli di sicurezza, accessi fuori orario e da origini anomale."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Attivi censiti rispetto ai rilevati in rete","MOD-10.01","Mensile","100%"],["Accessi revocati entro il giorno successivo alla cessazione","MOD-10.02","Mensile","100%"],["Utenze privilegiate con autenticazione a più fattori","MOD-10.03","Mensile","100%"],["Riesame dei diritti di accesso eseguito","MOD-10.03","Semestrale","Nei termini"],["Utenze condivise senza misure compensative registrate","MOD-10.03","Trimestrale","0"],["Sistemi rilevanti con registrazione degli eventi attiva","MOD-10.04","Mensile","100%"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-10.01","Inventario degli attivi","Attivo, proprietario, criticità, servizio, supporto, fine supporto"],["MOD-10.02","Registro delle abilitazioni e revoche","Persona, ruolo, abilitazioni, attivazione, revoca, verifica"],["MOD-10.03","Riesame dei diritti di accesso","Utenza, profilo, privilegi, MFA, esito del riesame"],["MOD-10.04","Registro della raccolta degli eventi","Sistema, eventi raccolti, conservazione, protezione, monitoraggio"]]}]},"PNS-11":{"codice":"PNS-11","titolo":"Autenticazione a più fattori e comunicazioni protette","fase":"Misure · art. 24 c. 2 lett. j)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-11","","",""],"r":[["Codice:","PNS-11","Revisione:","[Rev.]"],["Titolo:","AUTENTICAZIONE A PIÙ FATTORI E COMUNICAZIONI PROTETTE","",""],["Ambito:","Misure · art. 24 c. 2 lett. j)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce l'impiego di soluzioni di autenticazione a più fattori o di autenticazione continua, di comunicazioni vocali, video e testuali protette e di sistemi di comunicazione di emergenza."},{"k":"h","t":"2. AUTENTICAZIONE A PIÙ FATTORI"},{"k":"t","h":["Ambito","Obbligatorietà"],"r":[["Accessi remoti a qualsiasi titolo","Obbligatoria"],["Utenze amministrative e privilegiate","Obbligatoria"],["Applicazioni e servizi cloud","Obbligatoria"],["Posta elettronica","Obbligatoria"],["Accessi dei fornitori","Obbligatoria"],["Accessi a sistemi che supportano servizi rilevanti","Obbligatoria"],["Postazioni interne","Raccomandata, obbligatoria per i profili con accesso a dati classificati"]]},{"k":"h","t":"2.1 Robustezza dei fattori"},{"k":"p","t":"I fattori basati su messaggi di testo offrono una protezione inferiore e sono ammessi solo in via transitoria, con piano di sostituzione. Sono preferite le soluzioni basate su applicazioni dedicate o su dispositivi fisici resistenti al phishing."},{"k":"p","t":"Le eccezioni sono registrate nel MOD-11.01 con motivazione, misura compensativa e termine."},{"k":"h","t":"3. GESTIONE DELLE ECCEZIONI E DEL RECUPERO"},{"k":"p","t":"Le procedure di recupero dell'accesso non devono costituire un aggiramento del secondo fattore. Il ripristino delle credenziali richiede verifica dell'identità con modalità documentata: le procedure di assistenza sono un obiettivo frequente di attacchi di ingegneria sociale."},{"k":"h","t":"4. COMUNICAZIONI PROTETTE"},{"k":"t","h":["Ambito","Requisito"],"r":[["Comunicazioni vocali e video interne su temi riservati","Strumenti che assicurino cifratura del canale e controllo degli accessi alle sessioni"],["Messaggistica","Strumenti aziendali con cifratura e conservazione controllata; divieto di strumenti personali per informazioni classificate"],["Scambio di file","Strumenti che assicurino cifratura, controllo degli accessi e tracciamento"],["Comunicazioni con l'esterno","Verifica dell'identità del corrispondente per le richieste che comportano pagamenti o modifiche di coordinate"]]},{"k":"h","t":"5. COMUNICAZIONI DI EMERGENZA"},{"k":"p","t":"È disponibile un sistema di comunicazione utilizzabile in caso di indisponibilità o compromissione dei sistemi ordinari, indipendente dall'infrastruttura aziendale e dal dominio, con: elenco dei contatti del gruppo di crisi, canale di conversazione preordinato, credenziali di accesso conservate fuori linea, prova di funzionamento periodica."},{"k":"p","t":"Il sistema è verificato con la periodicità stabilita: un canale di emergenza mai provato non è un canale di emergenza."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Utenze con autenticazione a più fattori sugli ambiti obbligatori","MOD-11.01","Mensile","100%"],["Eccezioni registrate con termine e misura compensativa","MOD-11.01","Trimestrale","100%"],["Fattori basati su messaggi di testo residui","MOD-11.01","Trimestrale","In riduzione"],["Prove del canale di emergenza eseguite","MOD-11.02","Semestrale","Nei termini"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-11.01","Registro dell'autenticazione a più fattori","Ambito, copertura, tipo di fattore, eccezioni, termine"],["MOD-11.02","Scheda del sistema di comunicazione di emergenza","Strumento, contatti, credenziali, prove, esito"]]}]},"PNS-12":{"codice":"PNS-12","titolo":"Valutazione dell'efficacia delle misure, audit e test","fase":"Misure · art. 24 c. 2 lett. f)","rif":"D.Lgs. 138/2024, art. 24","blocks":[{"k":"t","h":["PROCEDURA PNS-12","","",""],"r":[["Codice:","PNS-12","Revisione:","[Rev.]"],["Titolo:","VALUTAZIONE DELL'EFFICACIA DELLE MISURE, AUDIT E TEST","",""],["Ambito:","Misure · art. 24 c. 2 lett. f)","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, art. 24","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le politiche e le procedure per valutare l'efficacia delle misure di gestione dei rischi per la sicurezza informatica."},{"k":"h","t":"2. LIVELLI DI VERIFICA"},{"k":"t","h":["Livello","Contenuto","Periodicità"],"r":[["Controlli operativi","Verifiche svolte dalle funzioni tecniche nell'ambito delle attività ordinarie","Continua"],["Verifiche di attuazione","Riscontro documentale e tecnico dell'effettiva attuazione delle misure","Semestrale"],["Audit interno","Verifica indipendente sull'adeguatezza e sull'efficacia, per ambiti","Annuale, con copertura completa nel ciclo"],["Verifiche tecniche","Scansioni di vulnerabilità, test di intrusione, verifiche di configurazione","Secondo il piano"],["Audit di parte terza","Quando richiesto dall'Autorità o previsto da requisiti contrattuali","Secondo necessità"]]},{"k":"h","t":"3. VERIFICHE TECNICHE"},{"k":"t","h":["Attività","Ambito","Periodicità minima"],"r":[["Scansione delle vulnerabilità sui sistemi esposti","Perimetro esterno","Mensile"],["Scansione delle vulnerabilità sui sistemi interni","Reti interne","Trimestrale"],["Test di intrusione sul perimetro esterno","Servizi esposti","Annuale"],["Verifica delle configurazioni rispetto ai riferimenti","Sistemi rilevanti","Semestrale"],["Verifica dei backup mediante ripristino","Servizi rilevanti","Semestrale"],["Simulazione di phishing","Tutto il personale","Trimestrale"]]},{"k":"p","t":"Gli esiti confluiscono nel registro delle vulnerabilità della PNS-07 e alimentano l'aggiornamento dell'analisi dei rischi."},{"k":"h","t":"4. MISURAZIONE"},{"k":"p","t":"L'efficacia è misurata attraverso indicatori (MOD-12.02) definiti per ciascuna misura, con valore di riferimento, target e frequenza di rilevazione. Gli indicatori distinguono ciò che è stato fatto da ciò che ha funzionato: la percentuale di postazioni aggiornate misura l'attuazione, il tempo medio di rilevazione di un incidente misura l'efficacia."},{"k":"h","t":"5. AUDIT INTERNO"},{"k":"p","t":"Il programma (MOD-12.01) è costruito sulla criticità degli ambiti e sugli esiti precedenti. Gli auditor possiedono competenza adeguata e non verificano il proprio lavoro. I rilievi sono classificati e trattati con azioni, responsabili e termini."},{"k":"h","t":"6. TRATTAMENTO DEI RILIEVI"},{"k":"p","t":"Ogni rilievo genera un'azione con responsabile e termine. La chiusura richiede la verifica di efficacia con evidenza. I rilievi non chiusi nei termini sono portati al riesame di direzione della PNS-13."},{"k":"h","t":"7. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Audit eseguiti secondo il programma","MOD-12.01","Semestrale","100%"],["Verifiche tecniche eseguite secondo il piano","MOD-12.03","Trimestrale","100%"],["Rilievi chiusi nei termini","MOD-12.01","Trimestrale","≥ 85%"],["Rilievi chiusi con verifica di efficacia","MOD-12.01","Trimestrale","100%"],["Misure con indicatore di efficacia definito","MOD-12.02","Annuale","100%"]]},{"k":"h","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-12.01","Programma e rapporti di audit","Ambito, criteri, auditor, rilievi, azioni, chiusura"],["MOD-12.02","Cruscotto degli indicatori","Indicatore, misura collegata, formula, target, rilevazioni"],["MOD-12.03","Registro delle verifiche tecniche","Attività, ambito, esecutore, esito, rilievi, azioni"]]}]},"PNS-13":{"codice":"PNS-13","titolo":"Riesame di direzione, adeguamento e miglioramento","fase":"Governance","rif":"D.Lgs. 138/2024, artt. 23, 24, 38÷40","blocks":[{"k":"t","h":["PROCEDURA PNS-13","","",""],"r":[["Codice:","PNS-13","Revisione:","[Rev.]"],["Titolo:","RIESAME DI DIREZIONE, ADEGUAMENTO E MIGLIORAMENTO","",""],["Ambito:","Governance","Organizzazione:","[Nome Organizzazione]"],["Riferimenti:","D.Lgs. 138/2024, artt. 23, 24, 38÷40","",""]]},{"k":"h","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di riesame del sistema da parte degli organi di amministrazione, di gestione del piano di adeguamento e di miglioramento continuo."},{"k":"h","t":"2. RIESAME"},{"k":"p","t":"Il riesame è svolto almeno annualmente e comunque a fronte di incidenti significativi, modifiche rilevanti dell'organizzazione o dei servizi, aggiornamenti normativi o determinazioni dell'Autorità."},{"k":"h","t":"2.1 Elementi in ingresso"},{"k":"t","h":["#","Elemento"],"r":[["1","Stato delle azioni dei riesami precedenti"],["2","Esito della verifica del livello di conformità per ciascuna misura"],["3","Stato del piano di adeguamento e scostamenti dai termini"],["4","Incidenti verificatisi, notifiche effettuate e rispetto dei termini"],["5","Esiti degli audit interni e delle verifiche tecniche"],["6","Andamento degli indicatori di efficacia"],["7","Stato dell'analisi dei rischi e rischi residui non accettabili"],["8","Prestazioni e criticità della catena di fornitura"],["9","Esiti delle prove di continuità e di ripristino"],["10","Stato della formazione, compresa quella degli organi"],["11","Comunicazioni, richieste e prescrizioni dell'Autorità"],["12","Modifiche normative e determinazioni sopravvenute"],["13","Adeguatezza delle risorse assegnate"]]},{"k":"h","t":"2.2 Elementi in uscita"},{"k":"p","t":"Decisioni su: adeguatezza complessiva del livello di conformità; approvazione o aggiornamento delle misure; risorse necessarie; priorità del piano di adeguamento; azioni sui rischi non accettabili; necessità di modifiche organizzative."},{"k":"p","t":"Ogni decisione è associata a responsabile, risorse e termine, ed è ripresa nel riesame successivo."},{"k":"h","t":"3. PIANO DI ADEGUAMENTO"},{"k":"p","t":"Il piano (MOD-13.02) raccoglie gli scostamenti rilevati dalla verifica del livello di conformità e ne governa la chiusura."},{"k":"t","h":["Priorità","Criterio","Termine indicativo"],"r":[["1 · immediata","Misura assente su ambito critico, con esposizione diretta o obbligo di legge non presidiato","30 giorni"],["2 · alta","Misura assente o solo pianificata su ambito rilevante","90 giorni"],["3 · media","Misura attuata parzialmente su ambito rilevante","180 giorni"],["4 · programmata","Miglioramento del livello di attuazione su ambiti non critici","Entro il ciclo annuale"]]},{"k":"p","t":"Il piano indica per ciascuna azione: misura interessata, livello attuale e livello obiettivo, azione, responsabile, risorse, termine, stato, verifica."},{"k":"h","t":"4. RESPONSABILITÀ E SANZIONI"},{"k":"p","t":"L'inosservanza degli obblighi espone a sanzioni amministrative pecuniarie di importo rilevante, differenziate tra soggetti essenziali e importanti, e a misure quali diffide, prescrizioni vincolanti e, nei casi previsti, sospensione delle certificazioni o interdizione temporanea dall'esercizio di funzioni dirigenziali."},{"k":"p","t":"La responsabilità degli organi per la violazione degli obblighi è espressamente prevista: la delega operativa non la esclude, e l'assenza di evidenza dell'approvazione delle misure e della sorveglianza sulla loro attuazione è il primo elemento che viene contestato."},{"k":"h","t":"5. CONSERVAZIONE DELLE EVIDENZE"},{"k":"p","t":"Le evidenze dell'attuazione delle misure sono conservate e rese disponibili in caso di ispezione o richiesta dell'Autorità: verbali degli organi, analisi dei rischi, registri, esiti delle verifiche, rapporti di incidente, attestazioni di formazione."},{"k":"p","t":"Una misura attuata senza evidenza conservata, in sede di ispezione, equivale a una misura non attuata."},{"k":"h","t":"6. INDICATORI"},{"k":"t","h":["Indicatore","Fonte","Frequenza","Target"],"r":[["Livello di conformità complessivo","MOD-13.01","Trimestrale","In crescita fino al livello obiettivo"],["Misure al livello obiettivo","MOD-13.01","Trimestrale","100%"],["Azioni del piano chiuse nei termini","MOD-13.02","Mensile","≥ 90%"],["Riesame svolto nei termini","MOD-13.03","Annuale","Nei termini"],["Decisioni del riesame attuate","MOD-13.03","Semestrale","≥ 85%"]]},{"k":"h","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","h":["Codice","Modulo","Contenuto"],"r":[["MOD-13.01","Verifica del livello di conformità","Misura, requisito, livello attuale, obiettivo, evidenza, scostamento"],["MOD-13.02","Piano di adeguamento","Scostamento, azione, priorità, responsabile, risorse, termine, verifica"],["MOD-13.03","Verbale di riesame","Elementi in ingresso, valutazioni, decisioni, responsabili, termini"]]}]}},"mod":{"MOD-01.01":{"codice":"MOD-01.01","pro":"PNS-01","titolo":"Scheda di determinazione dell'ambito","blocks":[{"k":"t","h":["MODULO MOD-01.01","",""],"r":[["Codice:","MOD-01.01","Revisione: [Rev.]"],["Titolo:","SCHEDA DI DETERMINAZIONE DELL'AMBITO",""],["Procedura:","PNS-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","h":["Voce","Compilazione"],"r":[["Data della valutazione",""],["Redatta da",""],["Approvata da",""]]},{"k":"s","t":"SETTORE E DIMENSIONE"},{"k":"t","h":["Elemento","Contenuto"],"r":[["Attività svolte",""],["Settore secondo gli allegati",""],["Allegato di riferimento (I alta criticità / II altri settori critici)",""],["Numero di addetti",""],["Fatturato annuo",""],["Totale di bilancio",""],["Classe dimensionale",""]]},{"k":"s","t":"CRITERI SPECIFICI INDIPENDENTI DALLA DIMENSIONE"},{"k":"t","h":["#","Criterio","Ricorre","Note"],"r":[["1","Fornitore di reti pubbliche di comunicazione elettronica o di servizi accessibili al pubblico","",""],["2","Prestatore di servizi fiduciari","",""],["3","Gestore di registri dei nomi di dominio di primo livello o fornitore di servizi DNS","",""],[ isione: [Rev.]"],["Titolo:","POLITICA DI SICUREZZA DEI SISTEMI INFORMATIVI",""],["Procedura:","PNS-03","Organizzazione: [Nome Organizzazione]"]]},{"k":"s","t":"PRINCIPI"},{"k":"p","t":"[Nome Organizzazione] considera la sicurezza dei propri sistemi informativi e di rete una condizione di continuità dell'attività e di tutela dei destinatari dei propri servizi, e vi destina risorse adeguate."},{"k":"p","t":"L'organizzazione adotta un approccio basato sul rischio, proporzionato all'esposizione, alla dimensione e alla criticità dei servizi erogati, e ne verifica periodicamente l'efficacia."},{"k":"p","t":"L'organo di amministrazione approva le misure di gestione dei rischi, ne sovrintende l'attuazione e ne risponde. La delega delle attività operative a strutture interne o a fornitori non trasferisce tale responsabilità."},{"k":"p","t":"Ogni componente dell'organizzazione è tenuto all'osservanza delle regole di sicurezza e alla segnalazione tempestiva degli eventi sospetti. La segnalazione di un proprio errore non comporta conseguenze disciplinari: il ritardo nella segnalazione sì."},{"k":"s","t":"REGOLE GENERALI"},{"k":"t","h":["Ambito","Regola"],"r":[["Accessi","Utenze nominative, privilegio minimo, autenticazione a più fattori sugli ambiti previsti"],["Credenziali","Divieto di condivisione, requisiti di robustezza, gestore messo a disposizione"],["Dispositivi","Cifratura integrale, protezione attiva, aggiornamento, blocco automatico"],["Informazioni","Classificazione e trattamento secondo il livello attribuito"],["Posta e navigazione","Cautela sugli allegati e sui collegamenti, segnalazione dei messaggi sospetti"],["Software","Installazione soggetta ad autorizzazione, divieto di software privo di licenza"],["Supporti rimovibili","Uso limitato e cifratura obbligatoria"],["Lavoro da remoto","Canali cifrati, autenticazione a più fattori, protezione dell'ambiente di lavoro"],["Segnalazione","Obbligo di segnalare senza ritardo eventi, anomalie e sospetti"]]},{"k":"t","h":[ ti e modalità di gestione","",""],["9","Continuità operativa del fornitore e obiettivi di ripristino","",""],["10","Facoltà di audit riconosciuta","",""],["11","Modalità di restituzione o cancellazione dei dati alla cessazione","",""]]},{"k":"t","h":["Voce","Compilazione"],"r":[["Esito complessivo",""],["Condizioni poste",""],["Rischi residui",""],["Validità della qualifica",""],["Prossima verifica",""]]},{"k":"f"}]},"MOD-06.03":{"codice":"MOD-06.03","pro":"PNS-06","titolo":"Clausole contrattuali di sicurezza","blocks":[{"k":"t","h":["MODULO MOD-06.03","",""],"r":[["Codice:","MOD-06.03","Revisione: [Rev.]"],["Titolo:","CLAUSOLE CONTRATTUALI DI SICUREZZA",""],["Procedura:","PNS-06","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Articolato tipo da inserire nei contratti con fornitori di servizi ICT e con fornitori che accedono ai sistemi."},{"k":"s","t":"ARTICOLATO"},{"k":"p","t":"Art. 1 — Il Fornitore si obbliga ad adottare e mantenere misure tecniche e organizzative adeguate a garantire la sicurezza dei sistemi informativi e di rete impiegati per l'esecuzione del contratto, proporzionate ai rischi e allo stato dell'arte."},{"k":"p","t":"Art. 2 — Il Fornitore comunica a [Nome Organizzazione] ogni incidente di sicurezza che interessi i servizi resi, o che possa ripercuotersi su di essi, senza ritardo e comunque entro il termine di ore ___ dalla conoscenza, con le informazioni necessarie a consentire al Committente l'adempimento dei propri obblighi di notifica ai sensi del D.Lgs. 138/2024."},{"k":"p","t":"Art. 3 — Il Fornitore collabora nella gestione dell'incidente e nella ricostruzione degli eventi, mette a disposizione le registrazioni pertinenti e conserva le evidenze per il tempo necessario."},{"k":"p","t":"Art. 4 — Il Fornitore consente a [Nome Organizzazione], anche tramite terzi incaricati, di verificare l'osservanza degli obblighi assunti, con preavviso ragionevole e senza pregiudizio per l'operatività."},{"k":"p","t":"Art. 5 — Gli accessi ai sistemi del Committente avvengono con utenze nominative, protette da autenticazione a più fattori, limitate a quanto necessario e per il tempo necessario, e sono tracciati."},{"k":"p","t":"Art. 6 — Il Fornitore gestisce le vulnerabilità dei propri prodotti e servizi, rende disponibili gli aggiornamenti di sicurezza e comunica il termine di fine supporto con preavviso adeguato."},{"k":"p","t":"Art. 7 — Il Fornitore comunica preventivamente il ricorso a subfornitori che accedano ai sistemi o ai dati del Committente, e trasferisce loro i medesimi obblighi."},{"k":"p","t":"Art. 8 — Alla cessazione del rapporto il Fornitore restituisce o cancella i dati secondo le istruzioni del Committente, ne dà attestazione e revoca ogni accesso residuo."},{"k":"p","t":"Art. 9 — L'inosservanza degli obblighi di cui ai precedenti articoli costituisce grave inadempimento e legittima la risoluzione del contratto, fatto salvo il risarcimento del danno."},{"k":"t","h":["Voce","Compilazione"],"r":[["Contratto di riferimento",""],["Fornitore",""],["Termine di notifica pattuito",""],["Data",""]]},{"k":"f"}]},"MOD-06.04":{"codice":"MOD-06.04","pro":"PNS-06","titolo":"Piano di uscita dal fornitore","blocks":[{"k":"t","h":["MODULO MOD-06.04","",""],"r":[["Codice:","MOD-06.04","Revisione: [Rev.]"],["Titolo:","PIANO DI USCITA DAL FORNITORE",""],["Procedura:","PNS-06","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","h":["Voce","Compilazione"],"r":[["Fornitore",""],["Servizio",""],["Classe",""],["Data",""],["Riesame",""]]},{"k":"t","h":["Elemento","Contenuto"],"r":[["Dati e configurazioni da recuperare",""],["Formato e modalità di recupero",""],["Tempi stimati di migrazione",""],["Soluzioni alternative individuate",""],["Dipendenze tecniche da sciogliere",""],["Competenze necessarie",""],["Costi stimati",""],["Prova di recuperabilità effettuata il",""]]},{"k":"f"}]},"MOD-07.01":{"codice":"MOD-07.01","pro":"PNS-07","titolo":"Requisiti di sicurezza per l'acquisizione","blocks":[{"k":"t","h":["MODULO MOD- i rilevanti, con procedure di ripristino per priorità di servizio?"},{"id":"C.03","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"A","pro":"PNS-05","t":"I backup coprono tutti i dati e le configurazioni necessari al ripristino dei servizi rilevanti?"},{"id":"C.04","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"A","pro":"PNS-05","t":"Almeno una copia dei backup è isolata dalla rete di produzione e non raggiungibile con le credenziali di dominio?"},{"id":"C.05","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"A","pro":"PNS-05","t":"I backup sono immutabili per il periodo di ritenzione stabilito e cifrati?"},{"id":"C.06","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"A","pro":"PNS-05","t":"Sono eseguite prove di ripristino effettivo con periodicità definita, con registrazione dei tempi rilevati e degli scostamenti dagli obiettivi?"},{"id":"C.07","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"M","pro":"PNS-05","t":"È previsto un gruppo di gestione della crisi con soglie di attivazione, reperibilità e registro delle decisioni?"},{"id":"C.08","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"A","pro":"PNS-05","t":"Il piano, i contatti e le credenziali di emergenza sono disponibili anche in forma indipendente dai sistemi aziendali potenzialmente compromessi?"},{"id":"C.09","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"M","pro":"PNS-05","t":"Sono svolte esercitazioni di gestione della crisi con periodicità almeno annuale, verbalizzate, con azioni sulle criticità emerse?"},{"id":"C.10","cap":"C","capn":"Continuità operativa e gestione delle crisi","rif":"art. 24 c. 2 lett. c)","crit":"M","pro":"PNS-05","t":"I urezza della catena di approvvigionamento","rif":"art. 24 c. 2 lett. d)","crit":"M","pro":"PNS-06","t":"Per i fornitori critici è definito un piano di uscita che indichi recupero dei dati, tempi e alternative?"},{"id":"D.09","cap":"D","capn":"Sicurezza della catena di approvvigionamento","rif":"art. 24 c. 2 lett. d)","crit":"M","pro":"PNS-06","t":"È valutata la qualità complessiva dei prodotti e delle pratiche di sicurezza dei fornitori, compresa la gestione delle vulnerabilità dei loro prodotti?"},{"id":"D.10","cap":"D","capn":"Sicurezza della catena di approvvigionamento","rif":"art. 24 c. 2 lett. d)","crit":"M","pro":"PNS-06","t":"Alla cessazione del rapporto è verificata la restituzione o cancellazione dei dati e la revoca di ogni accesso residuo?"},{"id":"E.01","cap":"E","capn":"Acquisizione, sviluppo, manutenzione e vulnerabilità","rif":"art. 24 c. 2 lett. e)","crit":"M","pro":"PNS-07","t":"I requisiti di sicurezza sono definiti prima dell'acquisizione e costituiscono criterio di valutazione dell'offerta?"},{"id":"E.02","cap":"E","capn":"Acquisizione, sviluppo, manutenzione e vulnerabilità","rif":"art. 24 c. 2 lett. e)","crit":"A","pro":"PNS-07","t":"È registrata e presidiata la data di fine supporto dei prodotti in uso, ed è nullo il numero di componenti fuori supporto in produzione?"},{"id":"E.03","cap":"E","capn":"Acquisizione, sviluppo, manutenzione e vulnerabilità","rif":"art. 24 c. 2 lett. e)","crit":"M","pro":"PNS-07","t":"Gli ambienti di sviluppo, collaudo e produzione sono separati, e i dati di produzione non sono utilizzati in collaudo senza anonimizzazione?"},{"id":"E.04","cap":"E","capn":"Acquisizione, sviluppo, manutenzione e vulnerabilità","rif":"art. 24 c. 2 lett. e)","crit":"M","pro":"PNS-07","t":"Lo sviluppo prevede requisiti di sicurezza, revisione del codice, analisi delle dipendenze di terze parti e gestione dei segreti?"},{"id":"E.05","cap":"E","capn":"Acquisizione, sviluppo, manutenzione e vulnerabilità","rif":"art. 24 c. 2 lett. e)","cri function lv(x){ const m = /^\s*(\d)/.exec(String(x == null ? "" : x)); return m ? Number(m[1]) : null; }

function reqAttivi(lista){ return (lista || REQ).filter(r => !reqNA(r.id)); }

  const v = reqValutati(lista).map(r => reqL(r.id));
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null;
}

  const v = reqValutati(lista).map(r => LIVN[reqL(r.id)].p);

const H_PRE = 24, H_NOT = 72, M_REL = 1;
function dtv(s){ if (!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }
function addOre(s, h){ const d = dtv(s); if (!d) return ""; d.setHours(d.getHours() + h); return isoDT(d); }
function addMesiD(s, m){ const d = dtv(s); if (!d) return ""; d.setMonth(d.getMonth() + m); return isoDT(d); }
function isoDT(d){
  const p = n2 => String(n2).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function itDT(s){ const d = dtv(s); if (!d) return ""; return itDate(isoDT(d).slice(0, 10)) + " " + isoDT(d).slice(11, 16); }
function oreA(s){ const d = dtv(s); if (!d) return null; return Math.round((d - new Date()) / 3600000); }

}
function fatto(r, k){ return k === "pre" ? r.pre : k === "not" ? r.not : r.rel; }
function statoTermine(r, k){

  const h = oreA(t); if (h == null) return "na";
  if (h < 0) return "scaduto";
  return h <= (k === "pre" ? 6 : k === "not" ? 24 : 168) ? "scadenza" : "termini";
}

function org(){ return DB.orgs.find(o => o.id === DB.current) || null; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function oggi(){ return new Date().toISOString().slice(0, 10); }
function itDate(s){ if (!s) return ""; const p = String(s).slice(0,10).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function nl2br(s){ return esc(s).replace(/\n/g, "<br>"); }
function n(x){ return Number(x) || 0; }
function pc(a, b){ return b ? Math.round(a / b * 100) : 0; }
function ggA(s){ if (!s) return null; const d = new Date(String(s).slice(0,10)); if (isNaN(d)) return null;
  return Math.round((d - new Date(oggi())) / 86400000); }

function nuovaOrg(nome){
  return { id: uid(), nome: nome || "Nuova organizzazione", created: new Date().toISOString(), updated: new Date().toISOString(),
    ana: { ragione: nome || "", forma:"", piva:"", sede:"", settore:"", allegato:"", dim:"", addetti:"", fatturato:"", bilancio:"",
           servizi:"", classe:"", classeAcn:"", registrazione:"", comunicazione:"", obiettivo:"3 · Attuata",
           organo:"", contatto:"", contattoRec:"", responsabile:"", sostituto:"", delibera:"",
           dataAdozione: oggi(), rev:"01", note:"" },
    pro: {}, mod: {}, ver: {},
    reg: REGDEF.reduce((a, r) => (a[r.id] = [], a), {}) };
}
function normOrg(o){
  o.ana = o.ana || {}; o.pro = o.pro || {}; o.mod = o.mod || {}; o.reg = o.reg || {}; o.ver = o.ver || {};
  REGDEF.forEach(r => { if (!Array.isArray(o.reg[r.id])) o.reg[r.id] = []; });
  return o;
}
function touch(){ const o = org(); if (o) o.updated = new Date().toISOString(); dirty = true; queueSave(); }
function queueSave(){ clearTimeout(saveT); saveT = setTimeout(() => { STORE.save(); dirty = false; setSaveBadge(); }, 700); setSaveBadge(); }
function setSaveBadge(){ const el = document.getElementById("savest"); if (el) el.textContent = dirty ? "salvataggio…" : "salvato"; }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2400); }

const TOKENS = [
  { re: /\[Nome Organizzazione\]|\[Ragione Sociale\]/g, f: a => a.ragione },
  { re: /\[Organo di amministrazione\]|\[Direzione\]/g, f: a => a.organo },
  { re: /\[Responsabile\]|\[Responsabile sicurezza\]/g, f: a => a.responsabile },
  { re: /\[Punto di contatto\]/g, f: a => a.contatto },
  { re: /\[Sede\]|\[Sede legale\]/g, f: a => a.sede },
  { re: /\[P\.IVA\]|\[Partita IVA\]/g, f: a => a.piva },
  { re: /\[Settore\]/g, f: a => a.settore },
  { re: /\[GG\/MM\/AAAA\]|\[Data\]/g, f: a => itDate(a.dataAdozione) },
  { re: /\[Rev\.\]/g, f: a => a.rev }
];
function pers(txt){
  const o = org(); if (!o) return txt;
  let s = String(txt == null ? "" : txt);
  TOKENS.forEach(t => { const v = t.f(o.ana); if (v) s = s.replace(t.re, v); });
  return s;
}
function persH(txt){ return esc(pers(txt)).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="miss">' + m + "</span>"); }
function contaToken(txt){ const m = pers(txt).match(/\[[^\]\n]{1,60}\]/g); return m ? m.length : 0; }

function statoPro(c){ const o = org(); return (o && o.pro[c] && o.pro[c].stato) || "Da personalizzare"; }
function statoMod(c){ const o = org(); return (o && o.mod[c] && o.mod[c].stato) || "Da personalizzare"; }
function verState(id){ const o = org(); if (!o.ver[id]) o.ver[id] = { l:"", e:"", n:"", na:"" }; return o.ver[id]; }

  return '<label class="f"' + (wide ? ' style="grid-column:1/-1"' : "") + "><span>" + esc(l) + "</span>" +
    (t === "ta" ? '<textarea data-ana="' + k + '">' + esc(v) + "</textarea>"
     : t === "sel" ? '<select data-ana="' + k + '">' + (o[0] === "" ? o : [""].concat(o)).map(x => '<option' + (x === v ? " selected" : "") + ">" + esc(x) + "</option>").join("") + "</select>"
     : '<input type="' + (t === "date" ? "date" : "text") + '" data-ana="' + k + '" value="' + esc(v) + '">') +
    (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") + "</label>";
}

VIEWS.ver = () => {

  let lista = cap ? REQOF[cap] : REQ;
  const q = (sel.q || "").toLowerCase();
  if (q) lista = lista.filter(r => (r.t + " " + r.rif + " " + r.pro).toLowerCase().includes(q));
