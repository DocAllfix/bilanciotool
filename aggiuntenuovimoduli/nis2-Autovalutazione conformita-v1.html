    '<div class="card" style="margin:14px 0"><div class="row between" style="margin-bottom:8px">' +
      '<h2 style="margin:0">Scala di valutazione</h2><span class="code">Il livello attribuito determina la percentuale di conformità</span></div>' +
      '<div class="scroll"><table><thead><tr><th style="width:150px">Livello</th><th>Criterio di attribuzione</th><th style="width:70px">Peso</th></tr></thead><tbody>' +
      LIVELLI.map(l => "<tr><td><b>" + l.v + " · " + esc(l.n) + "</b></td><td>" + esc(l.d) + '</td><td class="num">' + l.p + "%</td></tr>").join("") +

      CAPI.map(k => '<button class="btn ' + (cap === k.id ? "" : "ghost ") + 'sm" data-act="fcap" data-id="' + k.id + '">' +

      '<button class="btn ghost sm" data-act="expVer" style="margin-left:auto">Esporta CSV</button></div>' +
    (cap ? '<div class="card"><div class="row between"><div><h2 style="margin:0 0 3px">' + cap + " · " + esc(CAPI.find(k => k.id === cap).n) + "</h2>" +

function refreshVer(){

          '<td class="code">' + r.cap + " · " + esc(CAPI.find(k => k.id === r.cap).n) + "</td>" +

    "<th>Priorità</th><th>Criterio</th><th>Termine indicativo</th></tr></thead><tbody>" +

    "<tr><td>2 · alta</td><td>Requisito a criticità alta sotto obiettivo, oppure criticità media con livello assente o pianificato, oppure scarto pari o superiore a due livelli</td><td>90 giorni</td></tr>" +

function generaPiano(){
  const o = org(), t = obiettivo(), P = o.reg.adeguamento;
  const coperti = new Set(P.map(x => x.reqid).filter(Boolean));
  let nn = 0;
  scostamenti().slice().sort((a, b) => String(priorita(a)).localeCompare(String(priorita(b)))).forEach(r => {
    if (coperti.has(r.id)) return;
    const l = reqL(r.id), p = priorita(r);
    P.push({ rif: "AD" + String(P.length + 1).padStart(3, "0"), reqid: r.id,
      area: r.cap + " · " + CAPI.find(k => k.id === r.cap).n, req: r.t,
      lat: l + " · " + LIVN[l].n, lob: t + " · " + LIVN[t].n, az: "", prio: p, resp: "",
      scad: new Date(Date.now() + PRIOG[p] * 86400000).toISOString().slice(0, 10), stato: "Aperta" });
    nn++;
  });
  touch(); render();
  toast(nn ? nn + " azioni generate — da completare con azione, responsabile e risorse" : "Nessuna azione da generare");
}

function notaIncidenti(){
  return '<div class="card"><h2>Termini di notifica</h2><p class="sub" style="margin:0">I termini decorrono dalla <b>conoscenza</b> dell\'incidente significativo, non dalla sua conclusione: ventiquattro ore per la pre-notifica, settantadue per la notifica, un mese dalla notifica per la relazione finale. ' +
    "L'attesa di un quadro completo prima di pre-notificare è l'errore più frequente e integra di per sé una violazione. Se al termine del mese l'incidente è ancora in corso si trasmette una relazione di avanzamento.</p></div>";
}
function notaVuln(){
  return '<div class="card"><h2>Termini di rimedio</h2><p class="sub" style="margin:0">I termini si differenziano per criticità ed esposizione: le vulnerabilità critiche con sfruttamento noto in rete sui sistemi esposti vanno sanate entro quarantotto ore. ' +
    "Lo scostamento è ammesso solo con motivazione registrata, misura compensativa e nuova scadenza. Un registro senza termini è un elenco, non una gestione.</p></div>";
}
function notaFornitori(){
  return '<div class="card"><h2>Termine di notifica del fornitore</h2><p class="sub" style="margin:0">Il termine contrattuale entro cui il fornitore deve segnalare un incidente va fissato in modo che l\'organizzazione possa rispettare le proprie ventiquattro ore. ' +
    "Un fornitore che notifichi entro settantadue ore rende impossibile l'adempimento. La catena non si esaurisce nel fornitore diretto: per i fornitori critici va richiesta l'indicazione dei subfornitori rilevanti.</p></div>";
}
function cellHTML(r, c){
  const v = fmtVal(r[c.k], c);
  if (c.k === "stato" || c.k === "esito" && /Applicato|Conforme/.test(v)) return '<span class="tag ' + statoTag(v) + '">' + esc(v || "—") + "</span>";
  if (c.k === "sign") return v === "Sì" ? '<span class="tag t-red">significativo</span>' : v === "No" ? '<span class="tag t-gry">non significativo</span>' : '<span class="tag t-amb">da valutare</span>';
  if (c.k === "crit" || c.k === "livello" || c.k === "rischio") return v ? '<span class="rk ' + (LIVCLS[v.replace(/^\d+\s*·\s*/, "")] || "t-gry") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "mfa" || c.k === "clau" || c.k === "sep" || c.k === "imm") return v === "No" ? '<span class="tag t-red">No</span>' : v === "Sì" ? '<span class="tag t-grn">Sì</span>' : esc(v || "—");
  if (c.k === "supp") return v === "No" ? '<span class="tag t-red">fuori supporto</span>' : v === "Sì" ? '<span class="tag t-grn">in supporto</span>' : esc(v || "—");
  if (c.k === "classe") return v ? '<span class="tag ' + (/^A/.test(v) ? "t-red" : /^B/.test(v) ? "t-amb" : "t-gry") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "prio") return v ? '<span class="tag ' + (/^1/.test(v) ? "t-red" : /^2/.test(v) ? "t-amb" : "t-blu") + '">' + esc(v) + "</span>" : "—";
  if (c.k === "sfrutt") return v === "Sì" ? '<span class="tag t-red">Sì</span>' : esc(v || "—");
  return esc(v).slice(0, 150).replace(/\n/g, " ");
}
function fmtVal(v, c){ if (v == null || v === "") return ""; if (c && c.t === "date") return itDate(v); if (c && c.t === "dt") return itDT(v); return String(v); }
function statoTag(s){
  if (!s) return "t-gry";
  if (/chius|risolt|sanat|attuat|verificata|conforme$|in supporto|attiva|superata|adeguato/i.test(s)) return "t-grn";
  if (/apert|scaduto|fuori supporto|non conforme|critica|revocata|sfavorevole|non superata|non sanata/i.test(s)) return "t-red";
  return "t-amb";
}
function recForm(id, i){
  const d = REGBYID[id], rows = org().reg[id], nuovo = i == null;
  const r = nuovo ? autoRec(d) : rows[i];
  return '<div class="modal" id="modal"><div class="box"><h2>' + (nuovo ? "Nuova registrazione" : "Registrazione " + (r.rif || i + 1)) + "</h2>" +
    '<p class="code" style="margin:0 0 14px">' + esc(d.nome) + " · " + d.mod + "</p>" +
    '<div class="grid g2">' + d.cols.map(c => {
      const v = r[c.k] == null ? "" : r[c.k];
      return '<label class="f"' + (c.t === "ta" ? ' style="grid-column:1/-1"' : "") + "><span>" + esc(c.l) + "</span>" +
        (c.t === "ta" ? '<textarea data-rec="' + c.k + '">' + esc(v) + "</textarea>"
         : c.t === "sel" ? '<select data-rec="' + c.k + '"><option value=""></option>' +
             c.o.map(x => '<option' + (x === v ? " selected" : "") + ">" + esc(x) + "</option>").join("") + "</select>"
         : '<input type="' + (c.t === "num" ? "number" : c.t === "date" ? "date" : c.t === "dt" ? "datetime-local" : "text") + '" data-rec="' + c.k + '" value="' + esc(v) + '">') +
        (c.hint ? '<span class="hint">' + esc(c.hint) + "</span>" : "") + "</label>";
    }).join("") + "</div>" +
    '<div class="mfoot">' + (nuovo ? "" : '<button class="btn danger sm" data-act="delRec" data-id="' + id + '" data-i="' + i + '">Elimina</button>') +
    '<button class="btn ghost" data-act="closeModal">Annulla</button>' +
    '<button class="btn" data-act="saveRec" data-id="' + id + '" data-i="' + (nuovo ? "" : i) + '">Salva</button></div></div></div>';
}
function autoRec(d){
  const r = {}, rows = org().reg[d.id] || [];
  d.cols.forEach(c => {
    if (c.auto) r[c.k] = c.auto + String(rows.length + 1).padStart(3, "0");
    if (c.t === "date" && /^(data|datap)$/.test(c.k)) r[c.k] = oggi();
    if (c.k === "stato" && c.o) r[c.k] = c.o[0];
  });
  return r;
}

/* =========================================================================
   RENDERER DOCUMENTALE
   ========================================================================= */
const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";
  if (!edit) return inner;
  return '<div class="blk' + (modif ? " ovr" : "") + '" data-blk="' + i + '">' + inner +
    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}

    openModal(recForm("adeguamento", null));
    const set = (k, v) => { const f = document.querySelector('#modal [data-rec="' + k + '"]'); if (f) f.value = v; };
    set("area", r.cap + " · " + CAPI.find(k => k.id === r.cap).n); set("req", r.t);
    set("lat", l + " · " + LIVN[l].n); set("lob", t + " · " + LIVN[t].n); set("prio", p);
    set("scad", new Date(Date.now() + PRIOG[p] * 86400000).toISOString().slice(0, 10));
    const box = document.querySelector("#modal .box");
    if (box) box.dataset.reqid = r.id;
  },
  newOrg(){ const nn = prompt("Nome dell'organizzazione"); if (!nn) return;
    const o = nuovaOrg(nn.trim()); DB.orgs.push(o); DB.current = o.id; view = "amb"; touch(); render(); toast("Valutazione creata"); },
  openOrg(el){ DB.current = el.dataset.id; view = "home"; sel = { tab:"dati" }; queueSave(); render(); },
  dupOrg(el){ const s = DB.orgs.find(a => a.id === el.dataset.id); if (!s) return;
    const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.nome = s.nome + " (copia)"; DB.orgs.push(c); touch(); render(); toast("Scheda duplicata"); },
  delOrg(el){ const a = DB.orgs.find(x => x.id === el.dataset.id); if (!a) return;
    if (!confirm("Eliminare «" + a.nome + "» con la verifica e tutti i registri?")) return;
    DB.orgs = DB.orgs.filter(x => x.id !== a.id); if (DB.current === a.id) DB.current = null; dirty = true; queueSave(); render(); },
  expVer(){ scarica("verifica-nis2-" + oggi() + ".csv", "\ufeff" + csvVer(), "text/csv;charset=utf-8"); },
  expGap(){ scarica("scostamenti-nis2-" + oggi() + ".csv", "\ufeff" + csvGap(), "text/csv;charset=utf-8"); },
  goreg(el){ view = "reg"; sel.reg = el.dataset.id; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){ const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const box = document.querySelector("#modal .box");
    if (box && box.dataset.reqid) r.reqid = box.dataset.reqid;
    const arr = org().reg[id]; if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata"); },
  delRec(el){ if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render(); },
  closeModal(){ closeModal(); },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){ const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value, st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato"); },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  openOut(el){ sel.out = el.dataset.id; render(); },
  backOut(){ sel.out = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){ scarica("archivio-nis2-" + oggi() + ".json",
    JSON.stringify({ orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() }, null, 1), "application/json"); },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){ if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); } },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){ if (!confirm("Svuotare l'archivio locale?")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){} view = "pf"; queueSave(); render(); }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.out = null; sel.q = "";
    document.getElementById("side").classList.remove("open"); render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
  if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.ver != null && t.dataset.f !== "na"){ verState(t.dataset.ver)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "verq", "sgsq", "modq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.ver != null){
    if (t.dataset.f === "na"){ verState(t.dataset.ver).na = t.checked ? "Sì" : ""; touch(); render(); return; }
    verState(t.dataset.ver)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "l"){ t.className = lv(t.value) != null && lv(t.value) <= 1 ? "no" : ""; refreshVer(); } return;
  }
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; touch(); render(); return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
</html>
