03","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"[Nome Organizzazione] affida la gestione del canale interno di segnalazione ai sensi del D.Lgs. 24/2023 al soggetto di seguito indicato, attribuendogli autonomia e i poteri necessari alla trattazione delle segnalazioni."},{"k":"t","r":[["Voce","Compilazione"],["Configurazione (persona interna / ufficio / OdV / soggetto esterno)",""],["Nominativo o denominazione",""],["Sostituto individuato",""],["Data di decorrenza",""],["Durata dell'incarico",""],["Recapito dedicato",""],["Riporto",""],["Ruolo nel trattamento dei dati personali",""]]},{"k":"h","t":"COMPITI ATTRIBUITI"},{"k":"t","r":[["#","Compito"],["1","Rilasciare l'avviso di ricevimento entro sette giorni"],["2","Mantenere le interlocuzioni e richiedere integrazioni"],["3","Dare seguito diligente alla segnalazione e svolgere l'istruttoria"],["4","Fornire riscontro motivato entro tre mesi"],["5","Assicurare la riservatezza e limitare gli accessi"],["6","Proporre agli organi competenti i provvedimenti conseguenti"],["7","Monitorare la posizione dei soggetti tutelati"],["8","Mettere a disposizione le informazioni sul canale esterno"],["9","Riferire periodicamente in forma aggregata e anonimizzata"]],"b":0},{"k":"h","t":"DICHIARAZIONE DEL GESTORE"},{"k":"p","t":"Il sottoscritto accetta l'incarico, dichiara di non trovarsi in situazioni di conflitto di interessi rispetto alle funzioni potenzialmente oggetto di segnalazione, si impegna alla riservatezza su quanto appreso nell'esercizio dell'incarico e a comunicare senza ritardo ogni situazione di incompatibilità sopravvenuta, anche riferita al singolo caso."},{"k":"sig"}]},"MOD-03.02":{"code":"MOD-03.02","pro":"PWB-03","titolo":"Elenco delle persone autorizzate","blocks":[{"k":"t","r":[["MODULO MOD-03.02","",""],["Codice:","MOD-03.02","Revisione: [Rev.]"],["Titolo:","ELENCO DELLE PERSONE AUTORIZZATE",""],["Procedura:","PWB-03","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Nominativo","Ruolo","Ambito di accesso","Designazione del","Istruzioni consegnate","Formazione","Ultimo riesame","Stato"]],"b":10},{"k":"p","t":"L'accesso al contenuto delle segnalazioni è limitato alle persone qui elencate, ciascuna per quanto di competenza. Ogni accesso è registrato nel MOD-07.03."},{"k":"sig"}]},"MOD-03.03":{"code":"MOD-03.03","pro":"PWB-03","titolo":"Registro delle astensioni","blocks":[{"k":"t","r":[["MODULO MOD-03.03","",""],["Codice:","MOD-03.03","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLE ASTENSIONI",""],["Procedura:","PWB-03","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Segnalazione","Data","Soggetto che si astiene","Motivo dell'astensione","Subentrante","Annotazioni"]],"b":8},{"k":"sig"}]},"MOD-04.01":{"code":"MOD-04.01","pro":"PWB-04","titolo":"Modulo di segnalazione","blocks":[{"k":"t","r":[["MODULO MOD-04.01","",""],["Codice:","MOD-04.01","Revisione: [Rev.]"],["Titolo:","MODULO DI SEGNALAZIONE",""],["Procedura:","PWB-04","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"La segnalazione può essere resa anche in forma anonima. L'identità del segnalante è protetta e non può essere rivelata senza il suo consenso espresso. È vietata ogni ritorsione: se subisci una misura pregiudizievole a causa della segnalazione, gli atti sono nulli e puoi rivolgerti anche direttamente ad ANAC."},{"k":"t","r":[["Voce","Compilazione"],["Data",""],["Canale utilizzato",""],["Segnalazione anonima (sì/no)",""],["Recapito per il riscontro (facoltativo)",""],["Codice assegnato",""],["Qualità del segnalante (dipendente, collaboratore, fornitore, candidato, ex dipendente, altro)",""]]},{"k":"h","t":"CONTENUTO DELLA SEGNALAZIONE"},{"k":"t","r":[["Elemento","Descrizione"],["Fatto o condotta segnalata",""],["Quando è avvenuto e se è ancora in corso",""],["Dove è avvenuto: sede, ufficio, reparto, cantiere",""],["Persone coinvolte e loro ruolo",""],["Come sei venuto a conoscenza del fatto",""],["Documenti o elementi a supporto disponibili",""],["Altre persone informate dei fatti",""],["Hai già segnalato ad altri soggetti interni o esterni",""],["Ritieni di essere esposto al rischio di ritorsione e perché",""]],"b":0},{"k":"h","t":"RICHIESTE"},{"k":"t","r":[["Voce","Compilazione"],["Chiedi un incontro diretto con il gestore (sì/no)",""],["Acconsenti alla registrazione della segnalazione orale (sì/no)",""],["Modalità con cui desideri ricevere il riscontro",""]]},{"k":"p","t":"I dati raccolti sono trattati ai sensi dell'informativa MOD-08.01. Non sono raccolti dati manifestamente non utili alla trattazione. La documentazione è conservata non oltre cinque anni dalla comunicazione dell'esito finale."},{"k":"sig"}]},"MOD-04.02":{"code":"MOD-04.02","pro":"PWB-04","titolo":"Scheda di valutazione preliminare","blocks":[{"k":"t","r":[["MODULO MOD-04.02","",""],["Codice:","MOD-04.02","Revisione: [Rev.]"],["Titolo:","SCHEDA DI VALUTAZIONE PRELIMINARE",""],["Procedura:","PWB-04","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Segnalazione n.",""],["Data di ricezione",""],["Valutata da",""],["Data della valutazione",""]]},{"k":"t","r":[["#","Verifica","Esito","Note"],["1","La violazione rientra nell'ambito oggettivo previsto dalla legge","",""],["2","Il segnalante rientra tra i soggetti legittimati","",""],["3","I fatti sono venuti a conoscenza nel contesto lavorativo","",""],["4","La segnalazione è fondata su elementi di fatto precisi e concordanti","",""],["5","Non si tratta di contestazione esclusivamente personale del rapporto di lavoro","",""],["6","Non ricorrono cause di incompatibilità del gestore per il caso","",""]],"b":0},{"k":"h","t":"ESITO"},{"k":"t","r":[["Voce","Compilazione"],["Ammissibile / Inammissibile / Da integrare",""],["Motivazione",""],["Canali alternativi indicati al segnalante",""],["Rischio di ritorsione valutato",""],["Monitoraggio aperto (sì/no)",""]]},{"k":"p","t":"L'archiviazione per manifesta infondatezza è motivata per iscritto e non può fondarsi sulla sola percezione di scarsa credibilità del segnalante."},{"k":"sig"}]},"MOD-04.03":{"code":"MOD-04.03","pro":"PWB-04","titolo":"Registro delle segnalazioni","blocks":[{"k":"t","r":[["MODULO MOD-04.03","",""],["Codice:","MOD-04.03","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLE SEGNALAZIONI",""],["Procedura:","PWB-04","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Il registro non contiene i dati identificativi del segnalante, conservati separatamente e collegati mediante codice."},{"k":"t","r":[["N.","Data ricezione","Canale","Anonima","Ambito","Oggetto sintetico","Avviso entro il","Avviso del","Riscontro entro il","Riscontro del","Ammissibile","Esito","Provvedimenti","Chiusura","Cancellazione entro il","Stato"]],"b":14},{"k":"sig"}]},"MOD-04.04":{"code":"MOD-04.04","pro":"PWB-04","titolo":"Verbale di segnalazione orale","blocks":[{"k":"t","r":[["MODULO MOD-04.04","",""],["Codice:","MOD-04.04","Revisione: [Rev.]"],["Titolo:","VERBALE DI SEGNALAZIONE ORALE",""],["Procedura:","PWB-04","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Data e ora",""],["Modalità (telefonica / vocale / incontro diretto)",""],["Presenti",""],["Consenso alla registrazione acquisito (sì/no)",""],["Codice assegnato",""]]},{"k":"h","t":"DICHIARAZIONE"},{"k":"t","r":[["Elemento","Dichiarazione resa"],["Fatto segnalato",""],["Tempo e luogo",""],["Persone coinvolte",""],["Modalità di conoscenza",""],["Elementi a supporto",""],["Timore di ritorsione",""]],"b":0},{"k":"h","t":"CONFERMA DEL SEGNALANTE"},{"k":"p","t":"Il segnalante ha facoltà di verificare, rettificare e confermare il presente verbale mediante sottoscrizione. Il verbale non confermato non costituisce rappresentazione fedele della dichiarazione resa."},{"k":"t","r":[["Voce","Compilazione"],["Rettifiche richieste",""],["Verbale confermato (sì/no)",""],["Data",""]]},{"k":"sig"}]},"MOD-04.05":{"code":"MOD-04.05","pro":"PWB-04","titolo":"Avviso di ricevimento","blocks":[{"k":"t","r":[["MODULO MOD-04.05","",""],["Codice:","MOD-04.05","Revisione: [Rev.]"],["Titolo:","AVVISO DI RICEVIMENTO",""],["Procedura:","PWB-04","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Segnalazione n. o codice",""],["Data di ricezione",""],["Data dell'avviso",""],["Destinatario",""]]},{"k":"p","t":"Le confermiamo di aver ricevuto la Sua segnalazione in data indicata. La segnalazione è stata presa in carico dal soggetto gestore del canale interno e sarà trattata secondo la procedura vigente."},{"k":"p","t":"Le sarà fornito riscontro motivato entro tre mesi dalla data del presente avviso. Qualora l'istruttoria non fosse conclusa entro tale termine, Le sarà comunque comunicato lo stato di avanzamento e i tempi previsti."},{"k":"p","t":"La Sua identità e il contenuto della segnalazione sono coperti da riservatezza e non possono essere rivelati a soggetti diversi da quelli competenti senza il Suo consenso espresso. È vietata ogni ritorsione nei Suoi confronti e nei confronti dei soggetti a Lei collegati."},{"k":"p","t":"Nei casi previsti dalla legge Lei può rivolgersi al canale esterno gestito dall'Autorità Nazionale Anticorruzione. Le condizioni e i recapiti sono indicati nell'informativa pubblicata."},{"k":"t","r":[["Voce","Compilazione"],["Recapito del gestore per le interlocuzioni",""],["Modalità di accesso al riscontro",""]]},{"k":"sig"}]},"MOD-05.01":{"code":"MOD-05.01","pro":"PWB-05","titolo":"Piano istruttorio","blocks":[{"k":"t","r":[["MODULO MOD-05.01","",""],["Codice:","MOD-05.01","Revisione: [Rev.]"],["Titolo:","PIANO ISTRUTTORIO",""],["Procedura:","PWB-05","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Segnalazione n.",""],["Data",""],["Gestore",""],["Termine di riscontro",""]]},{"k":"h","t":"OGGETTO DELL'ACCERTAMENTO"},{"k":"t","r":[["#","Fatto da accertare","Fonte di prova","Modalità","Termine"]],"b":6},{"k":"h","t":"MISURE PER LA RISERVATEZZA"},{"k":"t","r":[["Rischio di riconoscibilità","Misura adottata"]],"b":5},{"k":"p","t":"La riservatezza si perde di norma non per una rivelazione diretta, ma per il modo in cui l'istruttoria è condotta: una richiesta troppo circoscritta, una domanda posta a una sola persona, una verifica su un periodo che coincide con un turno."},{"k":"t","r":[["Voce","Compilazione"],["Persone da sentire",""],["Ordine delle attività",""],["Conclusione prevista",""]]},{"k":"sig"}]},"MOD-05.02":{"code":"MOD-05.02","pro":"PWB-05","titolo":"Verbale di audizione","blocks":[{"k":"t","r":[["MODULO MOD-05.02","",""],["Codice:","MOD-05.02","Revisione: [Rev.]"],["Titolo:","VERBALE DI AUDIZIONE",""],["Procedura:","PWB-05","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Segnalazione n.",""],["Data e luogo",""],["Soggetto sentito",""],["Qualità (persona informata / persona coinvolta)",""],["Presenti",""],["Assistenza richiesta",""]]},{"k":"h","t":"AVVERTIMENTI"},{"k":"p","t":"Il soggetto è informato che quanto appreso in occasione dell'audizione è coperto da riservatezza e che la divulgazione costituisce illecito disciplinare. Non è comunicata l'identità del segnalante né l'origine dell'accertamento."},{"k":"h","t":"DICHIARAZIONI"},{"k":"t","r":[["Domanda","Risposta"]],"b":8},{"k":"h","t":"PER LA PERSONA COINVOLTA"},{"k":"t","r":[["Voce","Compilazione"],["Fatti contestati",""],["Ragioni rappresentate",""],["Documenti prodotti",""],["Richieste istruttorie",""]]},{"k":"sig"}]},"MOD-05.03":{"code":"MOD-05.03","pro":"PWB-05","titolo":"Relazione istruttoria","blocks":[{"k":"t","r":[["MODULO MOD-05.03","",""],["Codice:","MOD-05.03","Revisione: [Rev.]"],["Titolo:","RELAZIONE ISTRUTTORIA",""],["Procedura:","PWB-05","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["Voce","Compilazione"],["Segnalazione n.",""],["Data di avvio",""],["Data di conclusione",""],["Gestore",""]]},{"k":"h","t":"ATTIVITÀ SVOLTA"},{"k":"t","r":[["#","Attività","Data","Esito"]],"b":6},{"k":"h","t":"EVIDENZE E VALUTAZIONE"},{"k":"t","r":[["Fatto","Evidenze acquisite è idonea a superare la presunzione di ritorsività."},{"k":"sig"}]},"MOD-10.01":{"code":"MOD-10.01","pro":"PWB-10","titolo":"Registro delle comunicazioni con le autorità","blocks":[{"k":"t","r":[["MODULO MOD-10.01","",""],["Codice:","MOD-10.01","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLE COMUNICAZIONI CON LE AUTORITÀ",""],["Procedura:","PWB-10","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Data","Autorità","Direzione","Oggetto","Segnalazione collegata","Termine assegnato","Riscontro del","Documentazione trasmessa","Esito","Stato"]],"b":10},{"k":"sig"}]},"MOD-11.01":{"code":"MOD-11.01","pro":"PWB-11","titolo":"Informativa pubblica sui canali di segnalazione","blocks":[{"k":"t","r":[["MODULO MOD-11.01","",""],["Codice:","MOD-11.01","Revisione: [Rev.]"],["Titolo:","INFORMATIVA PUBBLICA SUI CANALI DI SEGNALAZIONE",""],["Procedura:","PWB-11","Organizzazione: [Nome Organizzazione]"]]},{"k":"p","t":"Avviso da esporre nei luoghi di lavoro e pubblicare in una sezione dedicata e facilmente accessibile del sito."},{"k":"h","t":"TESTO"},{"k":"p","t":"Se nel tuo lavoro vieni a conoscenza di violazioni di legge che ledono l'interesse pubblico o l'integrità di [Nome Organizzazione], puoi segnalarle attraverso i canali indicati di seguito. Puoi farlo anche in forma anonima."},{"k":"p","t":"Puoi segnalare per iscritto attraverso la piattaforma dedicata, oralmente attraverso il recapito telefonico indicato, oppure chiedendo un incontro diretto con il soggetto gestore, che sarà fissato entro un termine ragionevole."},{"k":"p","t":"La tua identità è protetta. Non può essere rivelata senza il tuo consenso espresso a soggetti diversi da quelli competenti a trattare la segnalazione. Sono protetti anche il contenuto della segnalazione e l'identità delle persone coinvolte."},{"k":"p","t":"Riceverai un avviso di ricevimento entro sette giorni e un riscontro motivato entro tre mesi. Se hai segnalato in forma anonima, potrai accedere al riscontro attraverso il codice che ti viene assegnato."},{"k":"p","t":"Nessuno può licenziarti, sanzionarti, trasferirti, demansionarti, non rinnovarti il contratto o trattarti diversamente per aver segnalato. Gli atti ritorsivi sono nulli. La protezione si estende a chi ti assiste, ai colleghi e ai familiari nel medesimo contesto lavorativo."},{"k":"p","t":"Puoi rivolgerti al canale esterno gestito dall'Autorità Nazionale Anticorruzione quando: il canale interno non è attivo o non è conforme; hai già segnalato internamente senza che vi sia stato seguito; hai fondati motivi di ritenere che la segnalazione interna non avrebbe efficace seguito o che possa esporti a ritorsione; ritieni che la violazione costituisca un pericolo imminente o palese per il pubblico interesse."},{"k":"p","t":"Sono previste misure di sostegno, comprese informazioni e assistenza fornite dagli enti del terzo settore iscritti nell'elenco tenuto da ANAC."},{"k":"t","r":[["Voce","Compilazione"],["Piattaforma o indirizzo per le segnalazioni scritte",""],["Recapito per le segnalazioni orali",""],["Soggetto gestore",""],["Recapiti ANAC",""],["Lingue disponibili",""],["Data di pubblicazione",""]]},{"k":"h","t":"REGISTRO DELL'AFFISSIONE"},{"k":"t","r":[["Sede o unità","Luogo di affissione","Data","Verificato il"]],"b":6},{"k":"sig"}]},"MOD-11.02":{"code":"MOD-11.02","pro":"PWB-11","titolo":"Registro della diffusione","blocks":[{"k":"t","r":[["MODULO MOD-11.02","",""],["Codice:","MOD-11.02","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLA DIFFUSIONE",""],["Procedura:","PWB-11","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#","Data","Destinatari","Modalità","Contenuti","N. raggiunti","Evidenza","Note"]],"b":10},{"k":"sig"}]},"MOD-11.03":{"code":"MOD-11.03","pro":"PWB-11","titolo":"Registro della formazione","blocks":[{"k":"t","r":[["MODULO MOD-11.03","",""],["Codice:","MOD-11.03","Revisione: [Rev.]"],["Titolo:","REGISTRO DELLA FORMAZIONE",""],["Procedura:","PWB-11","Organizzazione: [Nome Organizzazione]"]]},{"k":"t","r":[["#"," const GG_AVVISO = 7;      /* art. 5 c. 1 lett. a) */
const MESI_RISCONTRO = 3; /* art. 5 c. 1 lett. d) */
const ANNI_CONSERV = 5;   /* art. 14 c. 1 */
function dt(s){ if (!s) return null; const d = new Date(String(s).slice(0, 10)); return isNaN(d) ? null : d; }
function addGG(s, g){ const d = dt(s); if (!d) return ""; d.setDate(d.getDate() + g); return d.toISOString().slice(0, 10); }
function addMesi(s, m){ const d = dt(s); if (!d) return ""; d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); }
function addAnni(s, a){ const d = dt(s); if (!d) return ""; d.setFullYear(d.getFullYear() + a); return d.toISOString().slice(0, 10); }
function ggA(s){ const d = dt(s); if (!d) return null; return Math.round((d - dt(oggi())) / 86400000); }

/* la segnalazione anonima priva di recapito non consente avviso né riscontro */
function contattabile(s){ return s.anon !== "Sì" ? s.recapito !== "No" : (!!s.codice || s.recapito === "Sì"); }
function avvisoEntro(s){ return s.data ? addGG(s.data, GG_AVVISO) : ""; }
function riscontroEntro(s){
  const base = s.avviso || (s.data ? addGG(s.data, GG_AVVISO) : "");
  return base ? addMesi(base, MESI_RISCONTRO) : "";
}
function cancellazioneEntro(s){ return s.chiusura ? addAnni(s.chiusura, ANNI_CONSERV) : ""; }
/* stato: fatto · nei termini · in scadenza · scaduto · na */
function statoTermine(s, k){
  if (!contattabile(s)) return "na";
  if (k === "avviso"){
    if (s.avviso) return dt(s.avviso) <= dt(avvisoEntro(s)) ? "fatto" : "tardivo";
    const g = ggA(avvisoEntro(s)); if (g == null) return "na";
    return g < 0 ? "scaduto" : g <= 2 ? "scadenza" : "termini";
  }
  if (s.riscontro) return dt(s.riscontro) <= dt(riscontroEntro(s)) ? "fatto" : "tardivo";
  const g = ggA(riscontroEntro(s)); if (g == null) return "na";
  return g < 0 ? "scaduto" : g <= 15 ? "scadenza" : "termini";
}
const TCLS = { fatto:"t-grn", termini:"t-blu", scadenza:"t-amb", scaduto:"t-red", tardivo:"t-amb", na:"t-gry" };
const TNOM = { fatto:"nei termini", termini:"in corso", scadenza:"in scadenza", scaduto:"scaduto",
               tardivo:"fuori termine", na:"non applicabile" };
function urgenzaSeg(s){
  if (s.stato === "Chiusa" || s.stato === "Archiviata") return 3;
  const a = statoTermine(s, "avviso"), r = statoTermine(s, "riscontro");
  if (a === "scaduto" || r === "scaduto") return 0;
  if (a === "scadenza" || r === "scadenza") return 1;
  return 2;
}

/* =========================================================================
   AMMISSIBILITÀ E RISCHIO DI RITORSIONE
   ========================================================================= */
const AMMV = [
  ["v1", "La violazione rientra nell'ambito oggettivo previsto dalla legge"],
  ["v2", "Il segnalante rientra tra i soggetti legittimati"],
  ["v3", "I fatti sono venuti a conoscenza nel contesto lavorativo"],
  ["v4", "La segnalazione è fondata su elementi di fatto precisi e concordanti"],
  ["v5", "Non si tratta di contestazione esclusivamente personale del rapporto di lavoro"]
];
function ammStato(s){
  const v = AMMV.map(x => (s[x[0]] || ""));
  if (v.some(x => !x)) return "";
  if (v.every(x => x === "Sì")) return "Ammissibile";
  if (s.v4 === "No" && AMMV.filter(x => x[0] !== "v4").every(x => s[x[0]] === "Sì")) return "Da integrare";
  return "Inammissibile";
}
const AMMCLS = { "Ammissibile":"t-grn", "Da integrare":"t-amb", "Inammissibile":"t-red" };
const RITF = [
  ["r1", "Identità del segnalante conoscibile all'interno", 2],
  ["r2", "Persona coinvolta gerarchicamente sovraordinata al segnalante", 2],
  ["r3", "Contesto ristretto, fatti riferibili a poche persone", 2],
  ["r4", "Precedenti di ritorsione nell'organizzazione", 3],
  ["r5", "Rapporto di lavoro precario o in scadenza", 2],
  ["r6", "Segnalante già esposto per segnalazioni precedenti", 2]
];
function puntRit(s){ return RITF.reduce((a, f) => a + (s[f[0]] === "Sì" ? f[2] : 0), 0); }
function livRit(s){
  if (!RITF.some(f => s[f[0]])) return "";
  if (s.anon === "Sì" && s.r1 !== "Sì") return puntRit(s) >= 6 ? "Medio" : "Basso";
  const p = puntRit(s);
  return p >= 8 ? "Alto" : p >= 4 ? "Medio" : "Basso";
}
const LIVCLS = { "Basso":"rk-b", "Medio":"rk-m", "Alto":"rk-a", "Critico":"rk-c" };
function monitoraggioDovuto(s){ return ["Medio", "Alto"].includes(livRit(s)); }

const KEY = "wb_24_2023_v1";
const STORE = {
  mode(){
    if (window.WB_STORE && typeof window.WB_STORE.load === "function") return "host";
    if (DB.cfg && DB.cfg.url) return "rest";
    return "local";
  },
  async load(){
    if (window.WB_STORE && typeof window.WB_STORE.load === "function"){
      try { const o = await window.WB_STORE.load(); if (o) return o; } catch(e){ console.warn("host load", e); }
    }
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(KEY + "_cfg") || "null"); } catch(e){}
    if (cfg && cfg.url){
      try { const r = await fetch(cfg.url, { headers: authHdr(cfg) });
        if (r.ok){ const o = await r.json(); if (o && o.orgs){ o.cfg = cfg; return o; } } } catch(e){ console.warn("rest load", e); }
    }
    try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); if (cfg) o.cfg = cfg; return o; } } catch(e){}
    return cfg ? { orgs: [], current: null, cfg } : null;
  },
  async save(){
    const payload = { orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() };
    if (DB.cfg) { try { localStorage.setItem(KEY + "_cfg", JSON.stringify(DB.cfg)); } catch(e){} }
    if (window.WB_STORE && typeof window.WB_STORE.save === "function"){
      try { await window.WB_STORE.save(payload); return true; } catch(e){ toast("Salvataggio sulla piattaforma non riuscito"); }
    }
    if (DB.cfg && DB.cfg.url){
      try { const r = await fetch(DB.cfg.url, { method: DB.cfg.metodo || "PUT",
        headers: Object.assign({ "Content-Type":"application/json" }, authHdr(DB.cfg)), body: JSON.stringify(payload) });
        if (!r.ok) toast("Endpoint: risposta " + r.status);
      } catch(e){ toast("Endpoint non raggiungibile — copia locale mantenuta"); }
    }
    try { localStorage.setItem(KEY, JSON.stringify(payload)); return true; }
    catch(e){ toast("Spazio locale esaurito — esporta l'archivio"); return false; }
  }
};
function authHdr(cfg){ return cfg && cfg.token ? { "Authorization": "Bearer " + cfg.token } : {}; }

function nl2br(s){ return esc(s).replace(/\n/g, "<br>"); }
function n(x){ return Number(x) || 0; }
function pc(a, b){ return b ? Math.round(a / b * 100) : 0; }

function nuovaOrg(nome){
  return { id: uid(), nome: nome || "Nuova organizzazione", created: new Date().toISOString(), updated: new Date().toISOString(),
    ana: { ragione: nome || "", forma:"", piva:"", sede:"", settore:"", addetti:"", obbligo:"",
           gestore:"", gestoreTipo:"", sostituto:"", nomina:"", organo:"", controllo:"", dpo:"",
           canaleUrl:"", canaleTel:"", canaleSede:"", piattaforma:"", crittografia:"", sindacale:"",
           mog:"", condiviso:"", dataAdozione: oggi(), rev:"01", note:"" },
    pro: {}, mod: {}, seg: [], req: {},
    reg: REGDEF.reduce((a, r) => (a[r.id] = [], a), {}) };
}
function normOrg(o){
  o.ana = o.ana || {}; o.pro = o.pro || {}; o.mod = o.mod || {}; o.reg = o.reg || {}; o.req = o.req || {};
  if (!Array.isArray(o.seg)) o.seg = [];
  REGDEF.forEach(r => { if (!Array.isArray(o.reg[r.id])) o.reg[r.id] = []; });
  return o;
}
function touch(){ const o = org(); if (o) o.updated = new Date().toISOString(); dirty = true; queueSave(); }
function queueSave(){ clearTimeout(saveT); saveT = setTimeout(() => { STORE.save(); dirty = false; setSaveBadge(); }, 700); setSaveBadge(); }
function setSaveBadge(){ const el = document.getElementById("savest"); if (el) el.textContent = dirty ? "salvataggio…" : "salvato"; }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2400); }

/* ---------- personalizzazione ---------- */
const TOKENS = [
  { re: /\[Nome Organizzazione\]|\[Ragione Sociale\]/g, f: a => a.ragione },
  { re: /\[Gestore\]|\[Soggetto Gestore\]/g, f: a => a.gestore },
  { re: /\[Organo di indirizzo\]|\[Direzione\]/g, f: a => a.organo },
  { re: /\[Sede\]|\[Sede legale\]/g, f: a => a.sede },
  { re: /\[P\.IVA\]|\[Partita IVA\]/g, f: a => a.piva },
  { re: /\[Settore\]/g, f: a => a.settore },
  { re: /\[GG\/MM\/AAAA\]|\[Data\]/g, f: a => itDate(a.dataAdozione) },
  { re: /\[Rev\.\]/g, f: a => a.rev }
];
function pers(txt){
  const o = org(); if (!o) return txt;
  let s = String(txt == null ? "" : txt);
  TOKENS.forEach(t => { const v = t.f(o.ana); if (v) s = s.replace(t.re, v); });
  return s;
}
function persH(txt){ return esc(pers(txt)).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="miss">' + m + "</span>"); }
function contaToken(txt){ const m = pers(txt).match(/\[[^\]\n]{1,60}\]/g); return m ? m.length : 0; }

const STATI_DOC = ["Da personalizzare", "In redazione", "Approvata", "Non applicabile"];
function proState(c){ const o = org(); if (!o.pro[c]) o.pro[c] = { stato:"Da personalizzare", rev:"01", data:"", ovr:{}, note:"" }; if (!o.pro[c].ovr) o.pro[c].ovr = {}; return o.pro[c]; }
function modState(c){ const o = org(); if (!o.mod[c]) o.mod[c] = { stato:"Da personalizzare", note:"" }; return o.mod[c]; }
function statoPro(c){ const o = org(); return (o && o.pro[c] && o.pro[c].stato) || "Da personalizzare"; }
function statoMod(c){ const o = org(); return (o && o.mod[c] && o.mod[c].stato) || "Da personalizzare"; }
function reqState(id){ const o = org(); if (!o.req[id]) o.req[id] = { s:"", e:"", n:"" }; return o.req[id]; }
function tagStato(s){
  const m = { "Approvata":"t-grn", "In redazione":"t-amb", "Da personalizzare":"t-gry", "Non applicabile":"t-blu" };
  return '<span class="tag ' + (m[s] || "t-gry") + '">' + esc(s) + "</span>";
}
function segById(id){ return (org().seg || []).find(p => p.id === id) || null; }
function nextNum(){
  const o = org(), a = new Date().getFullYear();
  const nn = (o.seg || []).filter(s => String(s.num || "").endsWith("/" + a)).length + 1;
  return String(nn).padStart(3, "0") + "/" + a;
}

/* =========================================================================
   CONFORMITÀ
   ========================================================================= */
const PESO = { "Conforme":100, "Parzialmente conforme":50, "Non conforme":0 };
function capStato(cap){
  const o = org(), v = REQOF[cap].map(r => (o.req[r.id] || {}).s).filter(s => s && s !== "Non applicabile");
  if (!v.length) return 0;
  return Math.round(v.reduce((a, s) => a + (PESO[s] || 0), 0) / v.length);
}
function capCoperti(cap){ const o = org(); return REQOF[cap].filter(r => (o.req[r.id] || {}).s).length; }
function conformita(){ const v = CAPI.map(k => capStato(k.id)); return Math.round(v.reduce((a, b) => a + b, 0) / v.length); }
function reqValutati(){ const o = org(); return REQ.filter(r => (o.req[r.id] || {}).s).length; }

function navHTML(){
  const o = org();
  return NAV.map(i => {
    if (i.g) return '<div class="navgrp">' + i.g + "</div>";
    if (!o && !["pf", "guida", "set"].includes(i.v)) return "";
    let ct = "";
    if (o){
      if (i.v === "seg"){ const ap = (o.seg || []).filter(s => s.stato !== "Chiusa" && s.stato !== "Archiviata").length;
        ct = ap + "/" + (o.seg || []).length; }
      if (i.v === "reg") ct = String(REGDEF.reduce((a, r) => a + (o.reg[r.id] || []).length, 0));
      if (i.v === "sgs") ct = PROLIST.filter(c => statoPro(c) === "Approvata").length + "/" + PROLIST.length;
      if (i.v === "conf") ct = reqValutati() + "/" + REQ.length;
      if (i.v === "home") ct = conformita() + "%";
    }
    return '<button class="nav' + (view === i.v ? " on" : "") + '" data-v="' + i.v + '">' +
      '<span class="st">' + i.s + "</span> " + i.n + (ct ? '<span class="ct">' + ct + "</span>" : "") + "</button>";
  }).join("");
}

    '<p class="sub" style="margin:0"><b>Non è il canale di ricezione.</b> Il D.Lgs. 24/2023 richiede che il canale garantisca la riservatezza dell\'identità con strumenti di crittografia e con accessi tecnicamente limitati. ' +
    "Il canale va quindi realizzato con una piattaforma dedicata, che assegni un codice al segnalante anonimo e gli consenta di accedere al riscontro. " +

function pfCard(a){
  const cur = DB.current; DB.current = a.id;
  const tot = conformita(), S = a.seg || [];
  const ap = S.filter(s => s.stato !== "Chiusa" && s.stato !== "Archiviata").length;
  const sc = S.filter(s => urgenzaSeg(s) === 0).length;
  DB.current = cur;
  const ini = (a.nome || "?").replace(/[^A-Za-zÀ-ÿ ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "—";
  return '<div class="pfc"><div class="hd" data-act="openOrg" data-id="' + a.id + '"><div class="logo">' + esc(ini) + "</div>" +
    '<div style="min-width:0"><div class="nm">' + esc(a.nome) + '</div><div class="mt">' +
    esc(a.ana.settore || "settore non indicato") + "</div></div></div>" +
    '<div class="stats"><div><b>' + tot + '%</b><span>conformità</span></div>' +
    "<div><b>" + ap + "</b><span>in trattazione</span></div>" +
    '<div><b style="color:' + (sc ? "var(--red)" : "inherit") + '">' + sc + "</b><span>termini scaduti</span></div></div>" +
    '<div class="ft"><button class="btn sm" data-act="openOrg" data-id="' + a.id + '">Apri</button>' +
    '<button class="btn ghost sm" data-act="dupOrg" data-id="' + a.id + '">Duplica impianto</button>' +
    '<button class="btn ghost sm" data-act="delOrg" data-id="' + a.id + '">Elimina</button></div></div>';
}

VIEWS.home = () => {
  const o = org(); if (!o) return VIEWS.pf();
  const S = o.seg || [], R = o.reg, tot = conformita();
  const aperte = S.filter(s => s.stato !== "Chiusa" && s.stato !== "Archiviata");
  const conAvviso = S.filter(s => contattabile(s));
  const avvisoOk = conAvviso.filter(s => statoTermine(s, "avviso") === "fatto").length;
  const riscOk = conAvviso.filter(s => statoTermine(s, "riscontro") === "fatto").length;
  const riscDov = conAvviso.filter(s => s.riscontro || statoTermine(s, "riscontro") === "scaduto").length;
  const rit = R.ritorsioni || [], ev = R.eventi || [];
  return "<h1>" + esc(o.nome) + "</h1>" +
    '<p class="sub">Stato del canale. I termini di sette giorni per l\'avviso e di tre mesi per il riscontro sono calcolati sulle date registrate.</p>' +
    '<div class="grid g4">' +
      box("Segnalazioni in trattazione", String(aperte.length), S.length + " complessive") +
      box("Avvisi resi nei 7 giorni", (conAvviso.length ? pc(avvisoOk, conAvviso.length) + "%" : "—"),
          conAvviso.filter(s => statoTermine(s, "avviso") === "scaduto").length + " termini scaduti") +
      box("Riscontri resi nei 3 mesi", (riscDov ? pc(riscOk, riscDov) + "%" : "—"),
          conAvviso.filter(s => statoTermine(s, "riscontro") === "scaduto").length + " termini scaduti") +
      box("Conformità valutata", tot + "%", reqValutati() + " requisiti su " + REQ.length) +
    "</div>" +
    '<div class="grid g4" style="margin-top:14px">' +
      box("Ritorsioni contestate", String(rit.length), rit.filter(x => x.esito === "Ritorsione accertata").length + " accertate") +
      box("Eventi di riservatezza", String(ev.length), ev.filter(x => x.ident === "Sì").length + " con identità conoscibile") +
      box("Monitoraggi attivi", String(S.filter(s => s.monAttivo === "Sì").length),
          S.filter(s => monitoraggioDovuto(s) && s.monAttivo !== "Sì").length + " dovuti e non aperti") +
      box("Fascicoli da cancellare", String(S.filter(s => s.chiusura && ggA(cancellazioneEntro(s)) != null && ggA(cancellazioneEntro(s)) <= 0 && s.cancellata !== "Sì").length),
          "oltre i cinque anni") +
    "</div>" +
    (S.length ? '<div class="card" style="margin-top:16px"><div class="row between" style="margin-bottom:12px">' +
      '<h2 style="margin:0">Scadenzario</h2><button class="btn ghost sm" data-act="gov" data-id="seg">Tutte le segnalazioni</button></div>' +
      scadenzario(S) + "</div>" : "") +
    '<div class="grid g2" style="margin-top:14px">' +
      '<div class="card"><h2>Posizioni che richiedono intervento</h2>' + urgenze() + "</div>" +
      '<div class="card"><h2>Conformità per ambito</h2>' + confBar() + "</div>" +
    "</div>" +
    '<div class="grid g2" style="margin-top:14px">' +
      '<div class="card"><h2>Esiti delle segnalazioni</h2>' + distribEsiti(S) + "</div>" +
      '<div class="card"><h2>Canali di ricezione</h2>' + distribCanali(S) + "</div>" +
    "</div>";
};
function box(l, v, h){ return '<div class="card kpi"><div class="l">' + l + '</div><div class="n">' + v + '</div><div class="h">' + esc(h) + "</div></div>"; }
function scadenzario(S){
  const att = S.filter(s => s.stato !== "Chiusa" && s.stato !== "Archiviata")
    .sort((a, b) => urgenzaSeg(a) - urgenzaSeg(b));
  if (!att.length) return '<div class="empty">Nessuna segnalazione in trattazione.</div>';
  return '<div class="scroll"><table><thead><tr><th style="width:90px">N.</th><th>Oggetto</th>' +
    '<th style="width:110px">Ricezione</th><th style="width:150px">Avviso entro</th><th style="width:170px">Riscontro entro</th>' +
    '<th style="width:120px">Ammissibilità</th><th style="width:110px">Ritorsione</th><th></th></tr></thead><tbody>' +
    att.slice(0, 20).map(s => {
      const a = statoTermine(s, "avviso"), r = statoTermine(s, "riscontro");
      const ga = ggA(avvisoEntro(s)), gr = ggA(riscontroEntro(s));
      return '<tr><td class="code"><b>' + esc(s.num || "") + "</b>" + (s.anon === "Sì" ? '<div class="tag t-gry">anonima</div>' : "") + "</td>" +
        "<td>" + esc(String(s.ogg || "senza oggetto").slice(0, 80)) + (s.amb ? '<div class="code">' + esc(s.amb) + "</div>" : "") + "</td>" +
        '<td class="code">' + itDate(s.data) + "</td>" +
        "<td>" + termCell(s, "avviso", a, ga) + "</td><td>" + termCell(s, "riscontro", r, gr) + "</td>" +
        "<td>" + (ammStato(s) ? '<span class="tag ' + AMMCLS[ammStato(s)] + '">' + ammStato(s) + "</span>" : '<span class="code">da valutare</span>') + "</td>" +
        "<td>" + (livRit(s) ? '<span class="rk ' + LIVCLS[livRit(s)] + '">' + livRit(s) + "</span>" : "—") + "</td>" +
        '<td style="text-align:right"><button class="btn ghost sm" data-act="openSeg" data-id="' + s.id + '">Apri</button></td></tr>';
    }).join("") + "</tbody></table></div>";
}
function termCell(s, k, st, g){
  const done = k === "avviso" ? s.avviso : s.riscontro;
  const entro = k === "avviso" ? avvisoEntro(s) : riscontroEntro(s);
  if (st === "na") return '<span class="code">non applicabile</span>';
  if (done) return '<span class="tag ' + TCLS[st] + '">' + itDate(done) + "</span>";
  return '<span class="tag ' + TCLS[st] + '">' + itDate(entro) + "</span>" +
    (g == null ? "" : '<div class="code">' + (g < 0 ? Math.abs(g) + " gg di ritardo" : g + " gg") + "</div>");
}
function urgenze(){
  const o = org(), out = [], S = o.seg || [], R = o.reg;
  const add = (t, nn, cls, act, id) => { if (nn) out.push({ t, n:nn, cls, act, id }); };
  add("Avvisi di ricevimento oltre i 7 giorni", S.filter(s => statoTermine(s, "avviso") === "scaduto").length, "t-red", "gov", "seg");
  add("Avvisi in scadenza entro 2 giorni", S.filter(s => statoTermine(s, "avviso") === "scadenza").length, "t-amb", "gov", "seg");
  add("Riscontri oltre i 3 mesi", S.filter(s => statoTermine(s, "riscontro") === "scaduto").length, "t-red", "gov", "seg");
  add("Riscontri in scadenza entro 15 giorni", S.filter(s => statoTermine(s, "riscontro") === "scadenza").length, "t-amb", "gov", "seg");
  add("Segnalazioni senza valutazione di ammissibilità", S.filter(s => !ammStato(s) && s.stato !== "Archiviata").length, "t-amb", "gov", "seg");
  add("Segnalazioni ammissibili senza piano istruttorio", S.filter(s => ammStato(s) === "Ammissibile" && !s.piano && s.stato !== "Chiusa").length, "t-amb", "gov", "seg");
  add("Archiviazioni senza motivazione", S.filter(s => (s.esito === "Non fondata" || s.esito === "Manifestamente infondata") && !s.mot).length, "t-red", "gov", "seg");
  add("Monitoraggi dovuti e non aperti", S.filter(s => monitoraggioDovuto(s) && s.monAttivo !== "Sì").length, "t-red", "gov", "seg");
  add("Segnalazioni fondate senza provvedimento registrato", S.filter(s => (s.esito === "Fondata" || s.esito === "Parzialmente fondata") &&
      !(R.provvedimenti || []).some(p => p.seg === s.num)).length, "t-red", "goreg", "provvedimenti");
  add("Persone coinvolte non sentite prima delle conclusioni", S.filter(s => s.esito && s.esito !== "Manifestamente infondata" && s.sentita !== "Sì").length, "t-amb", "gov", "seg");
  add("Rivelazioni di identità senza consenso acquisito", S.filter(s => s.rivelata === "Sì" && s.consenso !== "Sì").length, "t-red", "gov", "seg");
  add("Eventi di riservatezza con identità conoscibile", (R.eventi || []).filter(x => x.ident === "Sì").length, "t-red", "goreg", "eventi");
  add("Eventi di riservatezza aperti", (R.eventi || []).filter(x => x.stato === "Aperto").length, "t-amb", "goreg", "eventi");
  add("Ritorsioni contestate in istruttoria", (R.ritorsioni || []).filter(x => x.stato !== "Chiusa").length, "t-red", "goreg", "ritorsioni");
  add("Ritorsioni con motivazione non antecedente o non documentata", (R.ritorsioni || []).filter(x => x.ant === "No").length, "t-red", "goreg", "ritorsioni");
  add("Provvedimenti verso tutelati senza documentazione antecedente", (R.preventiva || []).filter(x => x.tut === "Sì" && x.doc === "No").length, "t-red", "goreg", "preventiva");
  add("Fascicoli oltre i 5 anni non cancellati", S.filter(s => s.chiusura && ggA(cancellazioneEntro(s)) != null && ggA(cancellazioneEntro(s)) <= 0 && s.cancellata !== "Sì").length, "t-red", "gov", "seg");
  add("Persone autorizzate senza istruzioni scritte", (R.autorizzati || []).filter(x => x.stato !== "Revocata" && x.istr !== "Sì").length, "t-red", "goreg", "autorizzati");
  add("Richieste degli interessati senza riscontro", (R.interessati || []).filter(x => !x.risc).length, "t-amb", "goreg", "interessati");
  add("Richieste delle autorità oltre il termine", (R.autorita || []).filter(x => x.term && !x.risc && ggA(x.term) < 0).length, "t-red", "goreg", "autorita");
  add("Verifiche sul canale con esito non conforme e azione aperta", (R.verifiche || []).filter(x => x.esito === "Non conforme" && !x.chius).length, "t-red", "goreg", "verifiche");
  add("Requisiti non conformi", REQ.filter(r => (o.req[r.id] || {}).s === "Non conforme").length, "t-red", "gov", "conf");
  if (!out.length) return '<div class="empty">Nessuna posizione aperta.</div>';
  return "<table><tbody>" + out.map(r => '<tr><td><button class="linkbtn" data-act="' + r.act + '" data-id="' + r.id + '">' +
    esc(r.t) + '</button></td><td class="num"><b>' + r.n + '</b></td><td><span class="tag ' + r.cls + '">da presidiare</span></td></tr>').join("") + "</tbody></table>";

function notaRitorsioni(){
  return '<div class="card"><h2>Inversione dell\'onere della prova</h2><p class="sub" style="margin:0">Quando il soggetto tutelato dimostra di aver segnalato e di aver subito una misura pregiudizievole, si presume che essa sia ritorsiva. ' +

function cellHTML(r, c){
  const v = fmtVal(r[c.k], c);
  if (c.k === "stato" || c.k === "esito" && /Applicato|Conforme/.test(v)) return '<span class="tag ' + statoTag(v) + '">' + esc(v || "—") + "</span>";
  if (["anac", "ident"].includes(c.k)) return v === "Sì" ? '<span class="tag t-red">Sì</span>' : v ? '<span class="tag t-amb">' + esc(v) + "</span>" : "—";
  if (["ant", "doc", "istr", "tut"].includes(c.k)) return v === "No" ? '<span class="tag t-red">No</span>' :
    v === "Da verificare" ? '<span class="tag t-amb">Da verificare</span>' : esc(v || "—");
  if (c.k === "esito") return '<span class="tag ' + (/accertata|Non conforme/i.test(v) ? "t-red" : /esclusa|Conforme/i.test(v) ? "t-grn" : v ? "t-amb" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "lim") return v && v !== "No" ? '<span class="tag t-amb">' + esc(v) + "</span>" : esc(v || "—");
  if (c.k === "parere") return '<span class="tag ' + (/Sfavorevole/.test(v) ? "t-red" : /condizioni/.test(v) ? "t-amb" : v ? "t-grn" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "garante" || c.k === "disc") return v && /valutare/i.test(v) ? '<span class="tag t-amb">' + esc(v) + "</span>" : esc(v || "—");
  if (c.k === "aut") return '<span class="tag ' + (v === "Richiesta e ottenuta" ? "t-grn" : v === "Non richiesta ma dovuta" ? "t-red" : "t-gry") + '">' + esc(v || "—") + "</span>";
  if (c.k === "fond") return '<span class="tag ' + (v === "Sì" ? "t-red" : v === "No" ? "t-gry" : "t-amb") + '">' + esc(v || "—") + "</span>";
  return esc(v).slice(0, 150).replace(/\n/g, " ");
}
function fmtVal(v, c){ if (v == null || v === "") return ""; return c && c.t === "date" ? itDate(v) : String(v); }
function statoTag(s){
  if (!s) return "t-gry";
  if (/chius|riscontrata|attuat|adottato|conforme$|ritorsione esclusa|attiva|superata/i.test(s)) return "t-grn";
  if (/apert|ritorsione accertata|non conforme|revocata|sfavorevole|non adottato|non superata/i.test(s)) return "t-red";
  return "t-amb";
}
function recForm(id, i){
  const d = REGBYID[id], rows = org().reg[id], nuovo = i == null;
  const r = nuovo ? autoRec(d) : rows[i];
  return '<div class="modal" id="modal"><div class="box"><h2>' + (nuovo ? "Nuova registrazione" : "Registrazione " + (r.rif || i + 1)) + "</h2>" +

    '<div class="grid g2">' + d.cols.map(c => {
      const v = r[c.k] == null ? "" : r[c.k];
      return '<label class="f"' + (c.t === "ta" ? ' style="grid-column:1/-1"' : "") + "><span>" + esc(c.l) + "</span>" +
        (c.t === "ta" ? '<textarea data-rec="' + c.k + '">' + esc(v) + "</textarea>"
         : c.t === "sel" ? '<select data-rec="' + c.k + '"><option value=""></option>' +
             c.o.map(x => '<option' + (x === v ? " selected" : "") + ">" + esc(x) + "</option>").join("") + "</select>"
         : '<input type="' + (c.t === "num" ? "number" : c.t === "date" ? "date" : "text") + '" data-rec="' + c.k + '" value="' + esc(v) + '">') +
        (c.hint ? '<span class="hint">' + esc(c.hint) + "</span>" : "") + "</label>";
    }).join("") + "</div>" +
    '<div class="mfoot">' + (nuovo ? "" : '<button class="btn danger sm" data-act="delRec" data-id="' + id + '" data-i="' + i + '">Elimina</button>') +
    '<button class="btn ghost" data-act="closeModal">Annulla</button>' +
    '<button class="btn" data-act="saveRec" data-id="' + id + '" data-i="' + (nuovo ? "" : i) + '">Salva</button></div></div></div>';
}
function autoRec(d){
  const r = {}, rows = org().reg[d.id] || [];
  d.cols.forEach(c => {
    if (c.auto) r[c.k] = c.auto + String(rows.length + 1).padStart(3, "0");
    if (c.t === "date" && /^(data|datap)$/.test(c.k)) r[c.k] = oggi();
    if (c.k === "stato" && c.o) r[c.k] = c.o[0];
  });
  return r;
}

  document.querySelectorAll('[data-act="fcap"]').forEach(b => {
    const id = b.dataset.id; if (!id) return;

const RE_H1 = /^(\d+)\.\s+[A-ZÀ-Ü]/, RE_H2 = /^(\d+\.\d+)\s+/;
function isHead(t){ return RE_H1.test(t) || RE_H2.test(t); }
function blockHTML(b, i, ovr, edit){
  if (b.k === "sig") return '<div class="sig"><div><b>Data · Funzione · Firma</b><span class="fill"></span></div><div><b>Data · Funzione · Firma</b><span class="fill"></span></div></div>';
  if (b.k === "t") return tableHTML(b);
  const testo = (ovr && ovr[i] != null) ? ovr[i] : b.t;
  const modif = ovr && ovr[i] != null;
  const inner = b.k === "h" ? '<div class="sec">' + persH(testo) + "</div>"
    : isHead(testo) ? "<h4>" + persH(testo) + "</h4>"
    : "<p>" + persH(testo).replace(/\n/g, "<br>") + "</p>";
  if (!edit) return inner;
  return '<div class="blk' + (modif ? " ovr" : "") + '" data-blk="' + i + '">' + inner +
    '<div class="edbar noprint"><button class="btn ghost sm" data-act="edBlk" data-i="' + i + '">' + (modif ? "Modifica testo" : "Personalizza") + "</button>" +
    (modif ? '<button class="btn ghost sm" data-act="rstBlk" data-i="' + i + '">Ripristina base</button><span class="code">testo personalizzato</span>' : "") + "</div></div>";
}
function tableHTML(b){
  const r = b.r; if (!r.length) return "";
  const head = r[0], body = r.slice(1);
  const isHdr = head.length > 1 && head.every(c => c && c.length < 70);
  const cols = Math.max.apply(null, r.map(x => x.length));
  let h = '<div class="scroll"><table>';
  if (isHdr) h += "<thead><tr>" + head.map(c => "<th>" + persH(c) + "</th>").join("") + "</tr></thead>";
  h += "<tbody>";
  (isHdr ? body : r).forEach(row => {
    h += "<tr>" + row.map(c => "<td>" + (c ? persH(c).replace(/\n/g, "<br>") : '<span class="fill"></span>') + "</td>").join("") +
      (row.length < cols ? "<td></td>".repeat(cols - row.length) : "") + "</tr>";
  });
  const vuote = Math.min(b.b || 0, 8);
  for (let i = 0; i < vuote; i++) h += "<tr>" + '<td><span class="fill"></span></td>'.repeat(cols) + "</tr>";
  return h + "</tbody></table></div>";
}
function docHTML(blocks, ovr, edit){ return blocks.map((b, i) => blockHTML(b, i, ovr, edit)).join(""); }
function txtOf(b){ return b.k === "t" ? b.r.map(r => r.join(" ")).join(" ") : (b.t || ""); }

function scarica(nome, contenuto, tipo){

function esportaWord(tipo, id){
  const o = org(), rag = o.ana.ragione || o.nome;
  let titolo = "", corpo = "";
  if (tipo === "pro"){
    const st = proState(id); titolo = id + " " + PRO[id].titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + esc(PRO[id].fase) + '</div><h2>' + esc(PRO[id].titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[id].blocks, st.ovr, false) +
      (st.add ? '<div class="sec">Integrazioni</div><p>' + nl2br(st.add) + "</p>" : "");
  } else if (tipo === "mod"){
    const d = MOD[id], reg = REGDEF.find(r => r.mod === id); titolo = id + " " + d.titolo;
    corpo = '<div class="dhead"><div class="k">' + id + " · " + d.pro + '</div><h2>' + esc(d.titolo) + "</h2>" +
      '<div class="code">' + esc(rag) + "</div></div>" + (reg ? regStampa(reg) : "") + docHTML(d.blocks, null, false);
  } else if (tipo === "out"){
    titolo = { rel:"Relazione periodica", registro:"Registro delle segnalazioni", scad:"Scadenzario dei termini",
               conf:"Mappa di conformita", riesame:"Verbale di riesame", elenco:"Elenco documenti" }[id] || "Documento";
    corpo = id === "rel" ? relazione() : id === "registro" ? registro() : id === "scad" ? scadStampa()
      : id === "conf" ? mappaConf() : id === "riesame" ? riesame() : elencoDoc();
  } else if (tipo === "seg"){
    const s = segById(id); titolo = "Fascicolo segnalazione " + (s ? s.num : "");
    corpo = fascicolo(s);
  } else if (tipo === "corpus"){
    titolo = "Procedura per le segnalazioni " + rag;
    corpo = PROLIST.map(c => { const st = proState(c);
      return '<div style="page-break-before:always"></div><div class="dhead"><div class="k">' + c + " · " + esc(PRO[c].fase) + '</div><h2>' + esc(PRO[c].titolo) + "</h2>" +
        '<div class="code">' + esc(rag) + " · rev. " + esc(st.rev || "01") + "</div></div>" + docHTML(PRO[c].blocks, st.ovr, false); }).join("");
  }
  scarica(fileSlug(rag) + "_" + fileSlug(titolo) + ".doc", wordWrap(titolo, corpo), "application/msword");
  toast("Documento pronto per Word");
}

  openOrg(el){ DB.current = el.dataset.id; view = "home"; sel = { tab:"dati" }; queueSave(); render(); },
  dupOrg(el){ const s = DB.orgs.find(a => a.id === el.dataset.id); if (!s) return;
    const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.nome = s.nome + " (copia)";
    c.seg = []; REGDEF.forEach(r => c.reg[r.id] = []);
    DB.orgs.push(c); touch(); render(); toast("Impianto duplicato senza i fascicoli"); },
  delOrg(el){ const a = DB.orgs.find(x => x.id === el.dataset.id); if (!a) return;
    if (!confirm("Eliminare «" + a.nome + "» con tutti i fascicoli e i registri? L'operazione non è reversibile.")) return;
    DB.orgs = DB.orgs.filter(x => x.id !== a.id); if (DB.current === a.id) DB.current = null; dirty = true; queueSave(); render(); },
  addSeg(){ const o = org();
    const s = { id: uid(), num: nextNum(), data: oggi(), stato: "Ricevuta", anon: "No", recapito: "Sì" };
    o.seg.push(s); sel.seg = s.id; sel.tab = "dati"; touch(); render(); toast("Fascicolo aperto — avviso dovuto entro il " + itDate(avvisoEntro(s))); },
  openSeg(el){ sel.seg = el.dataset.id; sel.tab = "dati"; view = "seg"; render(); },
  backSeg(){ sel.seg = null; render(); },
  stab(el){ sel.tab = el.dataset.id; render(); },
  delSeg(el){ if (!confirm("Eliminare il fascicolo? L'eliminazione va distinta dalla cancellazione per decorso del termine, che si registra nella scheda Conservazione.")) return;
    const o = org(); o.seg = o.seg.filter(p => p.id !== el.dataset.id); sel.seg = null; touch(); render(); },
  fascicolo(el){ esportaWord("seg", el.dataset.id); },
  addAccesso(el){ const s = segById(el.dataset.id);
    openModal(recForm("accessi", null));
    const set = (k, v) => { const f = document.querySelector('#modal [data-rec="' + k + '"]'); if (f) f.value = v; };
    set("data", new Date().toLocaleString("it-IT")); set("seg", s ? s.num : ""); },
  expSeg(){ scarica("registro-segnalazioni-" + oggi() + ".csv", "\ufeff" + csvSeg(), "text/csv;charset=utf-8"); },
  expConf(){ scarica("mappa-conformita-wb-" + oggi() + ".csv", "\ufeff" + csvConf(), "text/csv;charset=utf-8"); },
  goreg(el){ view = "reg"; sel.reg = el.dataset.id; sel.seg = null; render(); },
  backReg(){ sel.reg = null; render(); },
  addRec(el){ openModal(recForm(el.dataset.id, null)); },
  edRec(el){ openModal(recForm(el.dataset.id, Number(el.dataset.i))); },
  saveRec(el){ const id = el.dataset.id, i = el.dataset.i === "" ? null : Number(el.dataset.i);
    const r = {}; document.querySelectorAll("#modal [data-rec]").forEach(f => r[f.dataset.rec] = f.value);
    const arr = org().reg[id]; if (i == null) arr.push(r); else arr[i] = Object.assign(arr[i], r);
    closeModal(); touch(); render(); toast("Registrazione salvata"); },
  delRec(el){ if (!confirm("Eliminare la registrazione?")) return;
    org().reg[el.dataset.id].splice(Number(el.dataset.i), 1); closeModal(); touch(); render(); },
  closeModal(){ closeModal(); },
  openPro(el){ sel.pro = el.dataset.id; view = "sgs"; render(); },
  backPro(){ sel.pro = null; render(); },
  prevPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i - 1 + PROLIST.length) % PROLIST.length]; render(); },
  nextPro(){ const i = PROLIST.indexOf(sel.pro); sel.pro = PROLIST[(i + 1) % PROLIST.length]; render(); },
  togEdit(){ sel.edit = !sel.edit; render(); },
  edBlk(el){ modalBlocco(Number(el.dataset.i)); },
  saveBlk(el){ const i = Number(el.dataset.i), t = document.getElementById("blkTxt").value, st = proState(sel.pro);
    if (t.trim() === (PRO[sel.pro].blocks[i].t || "").trim()) delete st.ovr[i]; else st.ovr[i] = t;
    closeModal(); touch(); render(); toast("Testo aggiornato"); },
  rstBlk(el){ delete proState(sel.pro).ovr[Number(el.dataset.i)]; touch(); render(); toast("Testo base ripristinato"); },
  openMod(el){ sel.mod = el.dataset.id; view = "mod"; render(); },
  backMod(){ sel.mod = null; render(); },
  openOut(el){ sel.out = el.dataset.id; render(); },
  backOut(){ sel.out = null; render(); },
  stampa(){ window.print(); },
  expDoc(el){ esportaWord(el.dataset.tipo, el.dataset.id); },
  expCsv(el){ scarica(fileSlug(REGBYID[el.dataset.id].nome) + ".csv", "\ufeff" + csvReg(el.dataset.id), "text/csv;charset=utf-8"); },
  expAllCsv(){ REGDEF.forEach(d => { if ((org().reg[d.id] || []).length) scarica(fileSlug(d.nome) + ".csv", "\ufeff" + csvReg(d.id), "text/csv;charset=utf-8"); }); },
  exp(){ scarica("archivio-segnalazioni-" + oggi() + ".json",
    JSON.stringify({ orgs: DB.orgs, current: DB.current, ver: APPVER, saved: new Date().toISOString() }, null, 1), "application/json"); },
  impBtn(){ document.getElementById("impFile").click(); },
  async testCfg(){ if (!DB.cfg || !DB.cfg.url) return toast("Indica prima l'URL");
    try { const r = await fetch(DB.cfg.url, { headers: authHdr(DB.cfg) }); toast("Risposta " + r.status + (r.ok ? " — endpoint raggiungibile" : "")); }
    catch(e){ toast("Endpoint non raggiungibile"); } },
  clearCfg(){ DB.cfg = null; try { localStorage.removeItem(KEY + "_cfg"); } catch(e){} render(); toast("Configurazione rimossa"); },
  wipe(){ if (!confirm("Svuotare l'archivio locale?")) return;
    DB.orgs = []; DB.current = null; try { localStorage.removeItem(KEY); } catch(e){} view = "pf"; queueSave(); render(); }
};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav && !e.target.closest("[data-act]")){
    view = nav.dataset.v; sel.pro = null; sel.mod = null; sel.reg = null; sel.seg = null; sel.out = null; sel.q = "";
    document.getElementById("side").classList.remove("open"); render(); return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a); return; }
  if (e.target.id === "modal") closeModal();
  if (e.target.id === "menuBtn") document.getElementById("side").classList.toggle("open");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ana != null){ org().ana[t.dataset.ana] = t.value; if (t.dataset.ana === "ragione" && t.value) org().nome = t.value; touch(); return; }
  if (t.dataset.seg != null){ const s = segById(sel.seg); if (s){ s[t.dataset.seg] = t.value; touch(); } return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch(); return; }
  if (t.dataset.pro != null){ proState(t.dataset.id)[t.dataset.pro] = t.value; touch(); return; }
  if (t.dataset.mod != null){ modState(t.dataset.id)[t.dataset.mod] = t.value; touch(); return; }
  if (t.dataset.cfg != null){ DB.cfg = DB.cfg || {}; DB.cfg[t.dataset.cfg] = t.value; queueSave(); return; }
  if (["pfq", "segq", "sgsq", "modq", "confq"].includes(t.id)){
    sel.q = t.value; const p = t.selectionStart, id = t.id;
    render(); const nn = document.getElementById(id); if (nn){ nn.focus(); nn.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.seg != null){ const s = segById(sel.seg); if (s){ s[t.dataset.seg] = t.value; touch(); render(); } return; }
  if (t.dataset.req != null){ reqState(t.dataset.req)[t.dataset.f] = t.value; touch();
    if (t.dataset.f === "s"){ t.className = t.value === "Non conforme" ? "no" : ""; refreshConf(); } return; }
  if (t.id === "orgSel"){ DB.current = t.value; sel = { tab:"dati" }; queueSave(); render(); }
  if (t.id === "modf"){ sel.fpro = t.value; render(); }
  if (t.dataset.pro === "stato" || t.dataset.mod === "stato"){ render(); }
  if (t.id === "impFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.orgs) throw 0;
        o.orgs.forEach(normOrg);
        if (DB.orgs.length && !confirm("Sostituire le " + DB.orgs.length + " schede presenti con le " + o.orgs.length + " del file?")) return;
        DB.orgs = o.orgs; DB.current = null; view = "pf"; queueSave(); render(); toast("Archivio importato");
      } catch(err){ toast("File non riconosciuto"); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("beforeunload", () => { if (dirty) STORE.save(); });
function resp(){ const b = document.getElementById("menuBtn"); if (b) b.style.display = window.innerWidth < 980 ? "" : "none"; }
window.addEventListener("resize", resp);

(async function boot(){
  const d = await STORE.load();
  if (d && d.orgs){ DB.orgs = d.orgs.map(normOrg); DB.current = null; if (d.cfg) DB.cfg = d.cfg; }
  view = "pf"; render(); resp();
})();

</script>
</body>
</html>
