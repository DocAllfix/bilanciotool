<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione delle segnalazioni — D.Lgs. 24/2023</title>
<style>
:root{
  --pri:#7A3E52;--pri-dk:#572A39;--pri-lt:#F5EAEE;--pri-mid:#A87487;
  --ink:#16202A;--ink-2:#48565F;--ink-3:#7C8992;
  --bg:#FAFAF8;--card:#fff;--line:#E3E4E0;--line-2:#F0F0EC;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#B06E00;--amber-lt:#FDF2DF;
  --green:#2E7D32;--green-lt:#E8F3E9;--violet:#5B4B9E;--violet-lt:#EEEBF7;
  --blue:#1F5F8B;--blue-lt:#E7F0F6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:16px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.navgrp{padding:14px 12px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 16px);text-align:left;background:none;border:0;padding:8px 10px;margin:1px 8px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri);color:#fff;font-weight:600}
.nav .st{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-3)}
.nav.on .st{border-color:rgba(255,255,255,.5);color:#fff}
.nav .st.ok{background:var(--green);border-color:var(--green);color:#fff}
.nav .st.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.nav.on .ct{color:rgba(255,255,255,.75)}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.wrap{padding:26px 26px 70px;max-width:1240px;width:100%}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 22px;max-width:78ch}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri-dk)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#8E1C16}
.btn:focus-visible,.nav:focus-visible,a:focus-visible{outline:2px solid var(--pri-mid);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-mid);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.num{font-family:var(--mono);text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.t-red{background:var(--red-lt);color:var(--red)}.t-amb{background:var(--amber-lt);color:var(--amber)}
.t-grn{background:var(--green-lt);color:var(--green)}.t-pri{background:var(--pri-lt);color:var(--pri-dk)}
.t-vio{background:var(--violet-lt);color:var(--violet)}.t-blu{background:var(--blue-lt);color:var(--blue)}
.t-gry{background:var(--line-2);color:var(--ink-3)}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.8px;line-height:1.1;font-family:var(--mono)}
.kpi .h{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.track{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.track i{display:block;height:100%;border-radius:20px;background:var(--pri)}
.track i.ok{background:var(--green)}.track i.mid{background:var(--amber)}.track i.no{background:var(--red)}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.miss{color:var(--red);background:var(--red-lt);border-radius:4px;padding:0 4px;font-style:italic}
.ok-token{background:var(--pri-lt);border-radius:4px;padding:0 3px}
/* elenco procedure */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ti{font-weight:650;letter-spacing:-.2px;line-height:1.3;font-size:13.5px}
.pcard .mt{font-size:11.5px;color:var(--ink-3)}
/* portafoglio */
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfc:hover{border-color:var(--pri-mid);box-shadow:0 2px 14px rgba(22,32,42,.07)}
.pfc .hd{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pfc .logo{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background:var(--pri-lt);color:var(--pri-dk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pfc .nm{font-weight:650;letter-spacing:-.2px;line-height:1.25}
.pfc .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pfc .stats{display:flex;gap:14px;margin:0 16px 12px;padding-top:12px;border-top:1px solid var(--line-2)}
.pfc .stats div{flex:1}
.pfc .stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.3px}
.pfc .stats span{font-size:10.5px;color:var(--ink-3)}
.pfc .ft{margin-top:auto;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-2);display:flex;gap:6px}
.pfnew{border:1.5px dashed var(--line);background:transparent;border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-3)}
.pfnew:hover{border-color:var(--pri);color:var(--pri-dk);background:var(--pri-lt)}
.pfnew b{font-size:22px;font-weight:400}
/* documento */
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 42px 44px}
.doc .dhead{border-bottom:2px solid var(--pri);padding-bottom:14px;margin-bottom:22px}
.doc .dhead .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc .dhead h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.4px}
.doc h4{font-size:14.5px;margin:24px 0 8px;color:var(--pri-dk);letter-spacing:-.2px}
.doc p{margin:0 0 9px;line-height:1.62}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:3px;line-height:1.55}
.doc table{margin:8px 0 14px;font-size:12.5px}
.doc th{background:var(--line-2);border-bottom:1px solid var(--line)}
.doc td{border-bottom:1px solid var(--line-2)}
.doc .fill{border-bottom:1px solid var(--line);min-height:20px;display:block}
.doc .sig{display:flex;gap:40px;margin-top:26px;font-size:12.5px;color:var(--ink-2)}
.doc .sig div{flex:1}
.doc .sig b{display:block;font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.doc .sec{background:var(--pri-lt);color:var(--pri-dk);font-weight:650;padding:7px 12px;border-radius:6px;margin:20px 0 10px;font-size:12.5px}
/* editor override */
.blk.ovr{border-left:3px solid var(--amber);padding-left:10px;background:var(--amber-lt);border-radius:0 6px 6px 0}
.edbar{display:none;gap:6px;align-items:center;margin:4px 0 10px}
.doc.ed .edbar{display:flex}
.doc.ed .blk{border-radius:6px;padding:2px 6px;margin-left:-6px}
.doc.ed .blk:hover{background:var(--pri-lt)}
/* criteri */
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.crow:last-child{border-bottom:0}
.crow .cc{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 52px;color:var(--pri-dk)}
.crow .ct{flex:1;min-width:0;font-size:12.5px}
.crow .cs{flex:0 0 auto;display:flex;gap:3px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--ink-3)}
.sbtn:hover{border-color:var(--pri-mid)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on[data-s="ok"]{background:var(--green);border-color:var(--green)}
.sbtn.on[data-s="parz"]{background:var(--amber);border-color:var(--amber)}
.sbtn.on[data-s="no"]{background:var(--red);border-color:var(--red)}
.sbtn.on[data-s="na"]{background:var(--ink-3);border-color:var(--ink-3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,32,42,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 12px 44px rgba(0,0,0,.2)}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--line-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;font-weight:600;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .side{position:fixed;left:-256px;z-index:60;transition:left .2s}.side.open{left:0}
  .wrap{padding:18px 16px 60px}.top{padding:10px 16px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:100%}
  .doc{border:0;padding:0}
  .card{border:0;padding:0}
  .doc h4,.doc .sec{page-break-after:avoid}
  table,.doc .sig{page-break-inside:avoid}
  body{background:#fff;font-size:11.5px}
}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---- ciclo di due diligence ---- */
.fase{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.fase:hover{border-color:var(--pri-mid);box-shadow:0 2px 12px rgba(22,32,42,.06)}
.fase .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.fase .nm{font-weight:650;letter-spacing:-.2px;font-size:15px}
.fase .ds{font-size:12px;color:var(--ink-3);line-height:1.45;flex:1}
.fase .pc{font-family:var(--mono);font-size:20px;font-weight:650;letter-spacing:-.5px}
/* ---- rischio ---- */
.rk{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.02em}
.rk-b{background:var(--green-lt);color:var(--green)}
.rk-m{background:var(--blue-lt);color:var(--blue)}
.rk-a{background:var(--amber-lt);color:var(--amber)}
.rk-c{background:var(--red-lt);color:var(--red)}
.sev{display:flex;gap:2px;align-items:center}
.sev i{width:11px;height:11px;border-radius:2px;background:var(--line-2);display:block}
.sev i.on{background:var(--pri)}
.sev i.hi{background:var(--red)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{flex:1;min-width:56px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 4px;cursor:pointer;font-size:11.5px;text-align:center;color:var(--ink-2)}
.scale button:hover{border-color:var(--pri-mid)}
.scale button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.scale button b{display:block;font-family:var(--mono);font-size:14px}
.flagbox{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.flagbox:last-child{border-bottom:0}
.flagbox input{width:16px;height:16px;margin:2px 0 0;flex:0 0 16px}
.flagbox span{font-size:12.5px;line-height:1.45}
.panel{background:var(--pri-lt);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.panel .row{gap:22px}
.panel b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:-.4px}
.panel span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--pri-dk);border-bottom-color:var(--pri);font-weight:600}

select.no{border-color:var(--red);color:var(--red);font-weight:600}

/* ---- cruscotto ---- */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font:10px var(--mono);fill:var(--muted)}
.chart .bar{fill:var(--pri-mid)}
.chart .b-ok{fill:var(--green)}
.chart .b-no{fill:var(--red)}
.chart .tg{stroke:var(--pri-dk);stroke-width:1.6}
.chart .sg{stroke:var(--amber);stroke-width:1.4;stroke-dasharray:5 4}
.chart .tgx{fill:var(--pri-dk)}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.spark{width:92px;height:26px;display:block}
.spark polyline{fill:none;stroke-width:1.8;stroke:var(--muted);stroke-linejoin:round;stroke-linecap:round}
.spark.ok polyline{stroke:var(--green)}
.spark.mid polyline{stroke:var(--amber)}
.spark.no polyline{stroke:var(--red)}
.spark.nd polyline{stroke:var(--line-2)}
table.ind td{vertical-align:middle}
.up{color:var(--green);font-weight:600}
.dn{color:var(--red);font-weight:600}
.nrm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  font:600 10px/1 var(--mono);margin-right:3px;color:#fff}
.n-q{background:#2F6FA8}.n-a{background:#3E8B58}.n-s{background:#C2762B}
.norma{text-align:left;cursor:pointer;border:1px solid var(--line);transition:border-color .12s,transform .12s}
.norma:hover{border-color:var(--pri);transform:translateY(-1px)}

/* ---- avvisi ---- */
.card.warn{border-left:4px solid var(--amber);background:linear-gradient(90deg,rgba(224,160,42,.06),transparent 60%)}
.card.warn h2{color:var(--amber-dk,#8A5A15)}

</style>
</head>

  </main>
</div>

<script type="application/json" id="corpus">{"pro":{"PWB-01":{"code":"PWB-01","titolo":"AMBITO, DESTINATARI E PRINCIPI DEL SISTEMA DI SEGNALAZIONE","fase":"Impianto","rif":"D.Lgs. 24/2023, artt. 1÷3 · Direttiva UE 2019/1937 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-01","","",""],["Codice:","PWB-01","Revisione:","[Rev.]"],["Titolo:","AMBITO, DESTINATARI E PRINCIPI DEL SISTEMA DI SEGNALAZIONE","",""],["Riferimenti:","Impianto","",""],["Riferimenti:","D.Lgs. 24/2023, artt. 1÷3 · Direttiva UE 2019/1937 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce l'ambito oggettivo e soggettivo del sistema di segnalazione delle violazioni adottato da [Nome Organizzazione], i principi che lo governano e i documenti che lo compongono."},{"k":"p","t":"1.2 Riferimenti"},{"k":"p","t":"D.Lgs. 10 marzo 2023, n. 24, di recepimento della Direttiva (UE) 2019/1937"},{"k":"p","t":"Linee guida ANAC in materia di protezione delle persone che segnalano violazioni"},{"k":"p","t":"D.Lgs. 231/2001, art. 6, commi 2-bis, 2-ter e 2-quater, per gli enti che adottano il modello"},{"k":"p","t":"Regolamento (UE) 2016/679 e D.Lgs. 196/2003"},{"k":"p","t":"2. AMBITO OGGETTIVO"},{"k":"p","t":"Possono essere segnalate le violazioni di disposizioni normative nazionali o dell'Unione europea che ledono l'interesse pubblico o l'integrità dell'organizzazione, di cui il segnalante sia venuto a conoscenza nel contesto lavorativo."},{"k":"t","r":[["Categoria","Contenuto"],["Illeciti rilevanti ai sensi del D.Lgs. 231/2001","Condotte che integrano i reati presupposto o violazioni del modello di organizzazione, gestione e controllo, per gli enti che lo abbiano adottato"],["Violazioni della normativa dell'Unione","Appalti pubblici, servizi e mercati finanziari, prevenzione del riciclaggio e del finanziamento del terrorismo, sicurezza dei prodotti, sicurezza dei trasporti, tutela dell'ambiente, radioprotezione, sicurezza alimentare, salute pubblica, tutela dei consumatori, protezione della vita privata e dei dati personali, sicurezza delle reti"],["Atti od omissioni lesivi degli interessi finanziari dell'Unione","Frodi e irregolarità nell'utilizzo di fondi europei"],["Atti od omissioni riguardanti il mercato interno","Violazioni delle norme in materia di concorrenza, aiuti di Stato e imposta sulle società"],["Atti o comportamenti che vanificano l'oggetto o la finalità delle disposizioni dell'Unione","Condotte formalmente lecite ma dirette a eludere le finalità delle norme"]]},{"k":"p","t":"2.1 Esclusioni"},{"k":"p","t":"Non rientrano nell'ambito: le contestazioni, rivendicazioni o richieste legate a un interesse di carattere personale del segnalante che attengono esclusivamente ai propri rapporti individuali di lavoro o con le figure gerarchicamente sovraordinate; le segnalazioni di violazioni già disciplinate in via obbligatoria da atti dell'Unione o nazionali indicati dalla legge; le segnalazioni in materia di sicurezza nazionale, appalti relativi ad aspetti di difesa o sicurezza nazionale."},{"k":"p","t":"La distinzione tra segnalazione e rivendicazione personale è la valutazione più delicata dell'intero processo. Un conflitto interpersonale che porti alla luce anche una condotta illecita resta una segnalazione per la parte che riguarda l'illecito, e va trattata come tale."},{"k":"p","t":"3. AMBITO SOGGETTIVO"},{"k":"t","r":[["Soggetto","Tutela"],["Lavoratori subordinati, anche a termine, somministrati, intermittenti","Piena"],["Lavoratori autonomi, collaboratori, liberi professionisti e consulenti","Piena"],["Volontari e tirocinanti, retribuiti e non","Piena"],["Azionisti e persone con funzioni di amministrazione, direzione, controllo, vigilanza o rappresentanza","Piena"],["Lavoratori e collaboratori di fornitori, subfornitori e appaltatori","Piena"],["Facilitatori, colleghi, parenti e affetti stabili del segnalante","Estesa ai sensi dell'art. 3, comma 5"],["Enti di proprietà del segnalante o per i quali lavora, ed enti che operano nel medesimo contesto","Estesa"]]},{"k":"p","t":"3.1 Estensione temporale"},{"k":"p","t":"Le tutele si applicano quando il rapporto giuridico non è ancora iniziato, se le informazioni sono state acquisite durante il processo di selezione o in altre fasi precontrattuali; durante il periodo di prova; successivamente allo scioglimento del rapporto, se le informazioni sono state acquisite nel corso del rapporto."},{"k":"p","t":"4. PRINCIPI"},{"k":"p","t":"riservatezza dell'identità del segnalante, delle persone coinvolte e del contenuto, assicurata con misure tecniche e organizzative;"},{"k":"p","t":"divieto assoluto di ritorsione, con nullità degli atti ritorsivi e inversione dell'onere della prova;"},{"k":"p","t":"autonomia e imparzialità del soggetto gestore;"},{"k":"p","t":"tempestività: sette giorni per l'avviso di ricevimento, tre mesi per il riscontro;"},{"k":"p","t":"accessibilità del canale a tutti i soggetti legittimati, compresi quelli esterni all'organizzazione;"},{"k":"p","t":"tracciabilità di ogni passaggio dell'istruttoria, con accesso limitato ai soggetti autorizzati;"},{"k":"p","t":"minimizzazione: sono trattati i soli dati necessari, e quelli manifestamente non utili non sono raccolti o sono immediatamente cancellati."},{"k":"p","t":"5. STRUTTURA DEL SISTEMA"},{"k":"t","r":[["Componente","Documento"],["Procedure","PWB-01 ÷ PWB-12"],["Informativa pubblica sui canali","MOD-11.01"],["Modulo di segnalazione","MOD-04.01"],["Atto di nomina del gestore","MOD-03.01"],["Registro delle segnalazioni","MOD-04.03"],["Informativa sul trattamento dei dati","MOD-08.01"]]},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Destinatari raggiunti dall'informazione sui canali","MOD-11.02","Annuale","100%"],["Segnalazioni ricevute","MOD-04.03","Trimestrale","Monitoraggio"],["Riesame del sistema svolto","MOD-12.01","Annuale","Nei termini"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-01.01","Politica sulle segnalazioni","Impegni dell'organo di indirizzo, divieto di ritorsione, ambito"],["MOD-01.02","Elenco dei documenti del sistema","Documento, revisione, data, stato di approvazione"]]}]},"PWB-02":{"code":"PWB-02","titolo":"CANALI DI SEGNALAZIONE: ISTITUZIONE, CONSULTAZIONE E REQUISITI","fase":"Impianto","rif":"D.Lgs. 24/2023, art. 4 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-02","","",""],["Codice:","PWB-02","Revisione:","[Rev.]"],["Titolo:","CANALI DI SEGNALAZIONE: ISTITUZIONE, CONSULTAZIONE E REQUISITI","",""],["Riferimenti:","Impianto","",""],["Riferimenti:","D.Lgs. 24/2023, art. 4 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce l'istituzione dei canali interni di segnalazione, i requisiti tecnici che devono possedere e le modalità di consultazione delle rappresentanze sindacali che ne precede l'attivazione."},{"k":"p","t":"2. OBBLIGO DI ISTITUZIONE"},{"k":"p","t":"L'obbligo grava sui soggetti del settore privato che: hanno impiegato nell'ultimo anno la media di almeno cinquanta lavoratori subordinati; ovvero, indipendentemente dal numero, operano nei settori indicati dalla legge in materia di servizi, prodotti e mercati finanziari, prevenzione del riciclaggio e del finanziamento del terrorismo, sicurezza dei trasporti e tutela dell'ambiente; ovvero, indipendentemente dal numero, adottano un modello di organizzazione e gestione ai sensi del D.Lgs. 231/2001."},{"k":"p","t":"Gli enti con media compresa tra cinquanta e duecentoquarantanove lavoratori possono condividere il canale e le relative risorse."},{"k":"p","t":"3. CONSULTAZIONE PREVENTIVA"},{"k":"p","t":"L'attivazione del canale è preceduta dalla consultazione delle rappresentanze o delle organizzazioni sindacali. La consultazione è documentata nel MOD-02.02 con oggetto, soggetti coinvolti, contributi ricevuti e loro trattamento."},{"k":"p","t":"La consultazione non è un passaggio formale: la sua omissione è contestabile e incide sulla legittimità della procedura adottata."},{"k":"p","t":"4. REQUISITI DEI CANALI"},{"k":"t","r":[["Requisito","Contenuto"],["Modalità scritta","In forma analogica o informatica, con garanzia di riservatezza dell'identità del segnalante, delle persone coinvolte e del contenuto e della relativa documentazione"],["Modalità orale","Linee telefoniche o sistemi di messaggistica vocale, con registrazione o verbalizzazione previo consenso"],["Incontro diretto","Su richiesta del segnalante, fissato entro un termine ragionevole"],["Strumenti di crittografia","Impiegati per il canale informatico, a protezione del contenuto e della documentazione allegata"],["Accessibilità","Il canale è utilizzabile anche dai soggetti esterni legittimati: fornitori, appaltatori, candidati, ex lavoratori"],["Segnalazione anonima","Ammessa; se successivamente il segnalante è identificato e subisce ritorsione, si applicano le tutele"]]},{"k":"p","t":"4.1 Nota sulle soluzioni tecniche"},{"k":"p","t":"La riservatezza dell'identità va assicurata con misure tecniche, non con una mera regola organizzativa. Una casella di posta elettronica ordinaria, un modulo cartaceo depositato in portineria o un foglio condiviso non soddisfano il requisito, perché l'identità è visibile a soggetti non autorizzati già in fase di ricezione."},{"k":"p","t":"Il canale informatico deve consentire al segnalante anonimo di accedere a un riscontro senza rivelare l'identità, tipicamente attraverso un codice univoco."},{"k":"p","t":"5. GESTIONE DEL CANALE"},{"k":"p","t":"La gestione è affidata a: una persona interna dedicata, un ufficio interno autonomo con personale specificamente formato, ovvero un soggetto esterno autonomo con personale specificamente formato. Per gli enti che adottano il modello 231 la gestione può essere attribuita all'organismo di vigilanza."},{"k":"p","t":"L'affidamento a soggetto esterno è disciplinato da contratto che indica compiti, misure di riservatezza, ruolo nel trattamento dei dati personali e durata."},{"k":"p","t":"6. INFORMAZIONE"},{"k":"p","t":"Le informazioni sull'uso del canale interno e sulle condizioni di ricorso al canale esterno sono esposte nei luoghi di lavoro e pubblicate in una sezione dedicata e facilmente accessibile del sito, secondo la PWB-11."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Consultazione sindacale documentata","MOD-02.02","A ogni modifica","Effettuata"],["Canali attivi e funzionanti","MOD-02.01","Semestrale","Tutti"],["Prove di funzionamento del canale eseguite","MOD-02.03","Semestrale","Nei termini"],["Segnalazioni pervenute da soggetti esterni all'organizzazione","MOD-04.03","Annuale","Monitoraggio"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-02.01","Scheda dei canali attivati","Canale, modalità, gestore, misure tecniche, accessibilità"],["MOD-02.02","Verbale di consultazione sindacale","Oggetto, soggetti, contributi, trattamento, esito"],["MOD-02.03","Verifica di funzionamento del canale","Prova eseguita, esito, anomalie, azioni"]]}]},"PWB-03":{"code":"PWB-03","titolo":"IL SOGGETTO GESTORE: NOMINA, REQUISITI, AUTONOMIA E INCOMPATIBILITÀ","fase":"Impianto","rif":"D.Lgs. 24/2023, art. 4 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-03","","",""],["Codice:","PWB-03","Revisione:","[Rev.]"],["Titolo:","IL SOGGETTO GESTORE: NOMINA, REQUISITI, AUTONOMIA E INCOMPATIBILITÀ","",""],["Riferimenti:","Impianto","",""],["Riferimenti:","D.Lgs. 24/2023, art. 4 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce i requisiti, la nomina, i compiti e le cause di incompatibilità del soggetto cui è affidata la gestione del canale interno e delle persone autorizzate al trattamento."},{"k":"p","t":"2. CONFIGURAZIONI AMMESSE"},{"k":"t","r":[["Configurazione","Quando è appropriata"],["Persona interna dedicata","Organizzazioni di dimensione contenuta, purché la persona sia autonoma rispetto alle funzioni potenzialmente coinvolte"],["Ufficio interno autonomo","Organizzazioni strutturate, con personale specificamente formato e separato dalle funzioni operative"],["Organismo di vigilanza","Enti che adottano il modello 231, valutata l'effettiva disponibilità di tempo e competenze"],["Soggetto esterno autonomo","Quando l'organizzazione non dispone di una funzione sufficientemente indipendente, o quando la dimensione non giustifica una struttura dedicata"],["Funzione operativa esposta alle segnalazioni","Non ammessa: difetta l'imparzialità"]]},{"k":"p","t":"3. REQUISITI"},{"k":"t","r":[["Requisito","Verifica"],["Autonomia","Assenza di vincoli di subordinazione rispetto alle funzioni potenzialmente oggetto di segnalazione; riporto diretto all'organo di indirizzo"],["Imparzialità","Assenza di conflitti di interessi rispetto ai fatti segnalati, dichiarata all'atto della nomina e verificata per ciascun caso"],["Competenza","Formazione specifica sulla disciplina, sulla gestione delle segnalazioni, sulla protezione dei dati e sulle tecniche di accertamento"],["Riservatezza","Vincolo espresso, la cui violazione è sanzionata dal sistema disciplinare e rilevante ai sensi della normativa sui dati personali"],["Continuità","Presenza di un sostituto individuato per i casi di assenza o di conflitto"]]},{"k":"p","t":"4. COMPITI"},{"k":"p","t":"rilasciare al segnalante l'avviso di ricevimento entro sette giorni;"},{"k":"p","t":"mantenere le interlocuzioni e richiedere integrazioni;"},{"k":"p","t":"dare seguito diligente alla segnalazione, svolgendo l'istruttoria;"},{"k":"p","t":"fornire riscontro motivato entro tre mesi;"},{"k":"p","t":"assicurare la riservatezza dell'identità e la limitazione degli accessi;"},{"k":"p","t":"proporre agli organi competenti i provvedimenti conseguenti e verificarne l'attuazione;"},{"k":"p","t":"monitorare la posizione del segnalante e dei soggetti tutelati;"},{"k":"p","t":"mettere a disposizione le informazioni sul canale esterno;"},{"k":"p","t":"riferire periodicamente all'organo di indirizzo in forma aggregata e anonimizzata."},{"k":"p","t":"5. INCOMPATIBILITÀ PER IL SINGOLO CASO"},{"k":"p","t":"Il gestore che si trovi in conflitto di interessi rispetto a una specifica segnalazione — perché coinvolto nei fatti, perché in rapporto gerarchico o personale con la persona coinvolta, o per qualsiasi altra ragione che possa comprometterne l'imparzialità — si astiene e la trattazione è affidata al sostituto. L'astensione è registrata nel MOD-03.03."},{"k":"p","t":"Se la segnalazione riguarda componenti dell'organo di indirizzo, il gestore riferisce all'organo di controllo."},{"k":"p","t":"6. PERSONE AUTORIZZATE"},{"k":"p","t":"L'accesso al contenuto delle segnalazioni è limitato alle persone espressamente autorizzate al trattamento, designate per iscritto con istruzioni specifiche. L'elenco è mantenuto aggiornato nel MOD-03.02 e riesaminato almeno annualmente."},{"k":"p","t":"Ogni accesso al fascicolo è registrato con data, soggetto e motivo (MOD-07.03)."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Dichiarazioni di assenza di conflitti aggiornate","MOD-03.01","Annuale","100%"],["Persone autorizzate con designazione scritta e istruzioni","MOD-03.02","Semestrale","100%"],["Formazione specifica del gestore in corso di validità","MOD-11.03","Annuale","Valida"],["Casi di astensione gestiti dal sostituto","MOD-03.03","Annuale","100%"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-03.01","Atto di nomina del soggetto gestore","Compiti, autonomia, durata, sostituto, dichiarazione di assenza di conflitti"],["MOD-03.02","Elenco delle persone autorizzate","Nominativo, ruolo, designazione, istruzioni, riesame"],["MOD-03.03","Registro delle astensioni","Segnalazione, motivo dell'astensione, soggetto subentrante"]]}]},"PWB-04":{"code":"PWB-04","titolo":"RICEZIONE, REGISTRAZIONE E VALUTAZIONE PRELIMINARE","fase":"Processo","rif":"D.Lgs. 24/2023, artt. 4, 5, 14 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-04","","",""],["Codice:","PWB-04","Revisione:","[Rev.]"],["Titolo:","RICEZIONE, REGISTRAZIONE E VALUTAZIONE PRELIMINARE","",""],["Riferimenti:","Processo","",""],["Riferimenti:","D.Lgs. 24/2023, artt. 4, 5, 14 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di ricezione della segnalazione, la sua registrazione, il rilascio dell'avviso di ricevimento e la valutazione preliminare di ammissibilità."},{"k":"p","t":"2. RICEZIONE"},{"k":"t","r":[["Modalità","Adempimenti"],["Scritta informatica","Acquisizione tramite piattaforma; assegnazione di codice univoco al segnalante per l'accesso al riscontro"],["Scritta analogica","Ricezione in busta chiusa; apertura riservata al gestore; protocollazione separata dal protocollo ordinario"],["Orale telefonica o vocale","Registrazione su supporto durevole e riascoltabile previo consenso, ovvero verbalizzazione integrale"],["Incontro diretto","Fissato entro termine ragionevole dalla richiesta; documentato mediante registrazione previo consenso o verbale"]]},{"k":"p","t":"2.1 Verbalizzazione"},{"k":"p","t":"Nei casi di segnalazione orale il segnalante ha facoltà di verificare, rettificare e confermare il verbale mediante sottoscrizione. Il verbale non confermato non è utilizzabile come rappresentazione fedele della dichiarazione."},{"k":"p","t":"3. AVVISO DI RICEVIMENTO"},{"k":"p","t":"Il gestore rilascia avviso di ricevimento entro sette giorni dalla data di ricezione. Il termine è perentorio e la sua decorrenza è registrata."},{"k":"p","t":"Per le segnalazioni anonime prive di recapito l'avviso non è materialmente possibile: la circostanza è annotata e la segnalazione è comunque presa in carico e registrata."},{"k":"p","t":"4. REGISTRAZIONE"},{"k":"p","t":"Ogni segnalazione è iscritta nel registro (MOD-04.03) con numero progressivo, data di ricezione, canale, natura anonima o meno, oggetto sintetico e stato. Il registro non contiene i dati identificativi del segnalante, che sono conservati separatamente secondo la PWB-07."},{"k":"p","t":"5. VALUTAZIONE PRELIMINARE DI AMMISSIBILITÀ"},{"k":"p","t":"La valutazione (MOD-04.02) accerta:"},{"k":"t","r":[["#","Verifica","Effetto se negativa"],["1","La violazione segnalata rientra nell'ambito oggettivo","Inammissibile per materia, con indicazione dei canali alternativi disponibili"],["2","Il segnalante rientra tra i soggetti legittimati","Inammissibile per difetto di legittimazione; la segnalazione può comunque essere trattata secondo altre procedure interne"],["3","I fatti sono venuti a conoscenza nel contesto lavorativo","Valutazione caso per caso"],["4","La segnalazione è fondata su elementi di fatto precisi e concordanti","Richiesta di integrazione prima di ogni determinazione"],["5","Non si tratta di contestazione esclusivamente personale del rapporto di lavoro","Inammissibile, con indirizzamento ai canali competenti"]]},{"k":"p","t":"5.1 Manifesta infondatezza"},{"k":"p","t":"L'archiviazione per manifesta infondatezza è ammessa, ma è motivata per iscritto e non può fondarsi sulla sola percezione di scarsa credibilità del segnalante. Il dubbio sull'attendibilità si risolve con l'istruttoria, non con l'archiviazione."},{"k":"p","t":"6. INTEGRAZIONE"},{"k":"p","t":"Quando gli elementi sono insufficienti, il gestore richiede integrazioni al segnalante, ove raggiungibile, indicando un termine. La richiesta e il riscontro sono registrati. Il termine per il riscontro finale non è sospeso dalla richiesta di integrazione."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Avvisi di ricevimento rilasciati entro 7 giorni","MOD-04.03","Trimestrale","100%"],["Segnalazioni valutate quanto all'ammissibilità entro 15 giorni","MOD-04.02","Trimestrale","100%"],["Archiviazioni per manifesta infondatezza motivate","MOD-04.02","Semestrale","100%"],["Segnalazioni orali con verbale confermato dal segnalante","MOD-04.04","Semestrale","100%"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-04.01","Modulo di segnalazione","Contenuto della segnalazione, riservatezza, tutele, recapito"],["MOD-04.02","Scheda di valutazione preliminare","Verifiche di ammissibilità, esito, motivazione"],["MOD-04.03","Registro delle segnalazioni","Numero, data, canale, oggetto, termini, stato, conservazione"],["MOD-04.04","Verbale di segnalazione orale","Dichiarazione, consenso alla registrazione, conferma del segnalante"],["MOD-04.05","Avviso di ricevimento","Comunicazione al segnalante, termine di riscontro, tutele"]]}]},"PWB-05":{"code":"PWB-05","titolo":"ISTRUTTORIA E ACCERTAMENTO","fase":"Processo","rif":"D.Lgs. 24/2023, art. 5 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-05","","",""],["Codice:","PWB-05","Revisione:","[Rev.]"],["Titolo:","ISTRUTTORIA E ACCERTAMENTO","",""],["Riferimenti:","Processo","",""],["Riferimenti:","D.Lgs. 24/2023, art. 5 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità con cui il gestore dà seguito diligente alla segnalazione ammissibile, accerta i fatti e formula le conclusioni."},{"k":"p","t":"2. PIANO ISTRUTTORIO"},{"k":"p","t":"Il gestore definisce un piano (MOD-05.01) che indica: fatti da accertare; documenti e dati da acquisire; persone da sentire; ordine delle attività; misure per la tutela della riservatezza; tempi, compatibili con il termine di tre mesi."},{"k":"p","t":"3. ACQUISIZIONE DELLE EVIDENZE"},{"k":"t","r":[["Fonte","Modalità e cautele"],["Documenti e registrazioni","Richiesta mirata, evitando richieste ampie che rendano riconoscibile l'oggetto della verifica e, di riflesso, il segnalante"],["Dati e sistemi informativi","Accesso nei limiti del necessario, tracciato, nel rispetto della disciplina sui controlli a distanza e sui dati dei lavoratori"],["Audizione di persone informate","Convocazione senza rivelare l'origine della verifica; verbalizzazione; avvertimento sull'obbligo di riservatezza"],["Audizione della persona coinvolta","Successiva all'acquisizione degli elementi, con contestazione dei fatti e non della segnalazione"],["Sopralluoghi e verifiche operative","Condotti in modo da non risultare riconducibili alla segnalazione"]]},{"k":"p","t":"3.1 Cautela sulla riconoscibilità"},{"k":"p","t":"La riservatezza dell'identità si perde quasi sempre non per una rivelazione diretta, ma per il modo in cui l'istruttoria è condotta: una richiesta troppo circoscritta, una domanda posta a una sola persona, una verifica su un periodo che coincide con un turno. Il piano istruttorio deve considerare espressamente questo rischio."},{"k":"p","t":"4. TUTELA DELLA PERSONA COINVOLTA"},{"k":"p","t":"La persona coinvolta è tutelata quanto alla riservatezza della propria identità. Ha diritto di essere sentita, anche mediante procedimento cartolare, e di rappresentare le proprie ragioni. L'audizione non comporta la comunicazione dell'identità del segnalante."},{"k":"p","t":"Fino all'accertamento la persona coinvolta non subisce pregiudizi: la segnalazione non è, di per sé, prova del fatto."},{"k":"p","t":"5. CONCLUSIONI"},{"k":"p","t":"La relazione istruttoria (MOD-05.03) espone: fatti accertati; evidenze acquisite e loro valutazione; fatti non accertati e ragioni; conclusioni sulla fondatezza; proposte di provvedimento e di azione correttiva."},{"k":"t","r":[["Esito","Contenuto"],["Fondata","Fatti accertati; proposta di provvedimenti disciplinari e di azioni correttive; eventuale denuncia all'autorità"],["Parzialmente fondata","Accertamento di alcuni fatti; proposte limitate a essi"],["Non fondata","Elementi insufficienti o smentiti; archiviazione motivata"],["Manifestamente infondata","Archiviazione motivata; valutazione della responsabilità del segnalante solo in caso di dolo o colpa grave accertata"]]},{"k":"p","t":"6. SEGNALAZIONI CHE COINVOLGONO L'ORGANO DI INDIRIZZO"},{"k":"p","t":"Se i fatti riguardano componenti dell'organo di indirizzo, le conclusioni sono trasmesse all'organo di controllo e, ove istituito, all'organismo di vigilanza, e non all'organo di indirizzo."},{"k":"p","t":"7. RAPPORTI CON L'AUTORITÀ"},{"k":"p","t":"Quando i fatti presentano rilevanza penale, il gestore rappresenta all'organo competente la valutazione sull'obbligo o sull'opportunità di denuncia, dandone conto nella relazione. La trasmissione all'autorità non fa venir meno gli obblighi di riservatezza sull'identità del segnalante nei rapporti interni."},{"k":"p","t":"8. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Istruttorie con piano documentato","MOD-05.01","Trimestrale","100%"],["Persone coinvolte sentite prima delle conclusioni","MOD-05.02","Semestrale","100%"],["Istruttorie concluse entro 75 giorni dall'avviso","MOD-05.03","Trimestrale","≥ 90%"],["Casi in cui l'identità del segnalante è divenuta riconoscibile","MOD-07.02","Trimestrale","0"]]},{"k":"p","t":"9. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-05.01","Piano istruttorio","Fatti da accertare, fonti, tempi, misure di riservatezza"],["MOD-05.02","Verbale di audizione","Soggetto sentito, dichiarazioni, avvertimenti, sottoscrizione"],["MOD-05.03","Relazione istruttoria","Evidenze, valutazione, conclusioni, proposte"]]}]},"PWB-06":{"code":"PWB-06","titolo":"RISCONTRO, PROVVEDIMENTI CONSEGUENTI E ARCHIVIAZIONE","fase":"Processo","rif":"D.Lgs. 24/2023, art. 5 · art. 6 comma 2-quater D.Lgs. 231/2001","blocks":[{"k":"t","r":[["PROCEDURA PWB-06","","",""],["Codice:","PWB-06","Revisione:","[Rev.]"],["Titolo:","RISCONTRO, PROVVEDIMENTI CONSEGUENTI E ARCHIVIAZIONE","",""],["Riferimenti:","Processo","",""],["Riferimenti:","D.Lgs. 24/2023, art. 5 · art. 6 comma 2-quater D.Lgs. 231/2001","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di riscontro al segnalante, di adozione dei provvedimenti conseguenti e di archiviazione del fascicolo."},{"k":"p","t":"2. RISCONTRO"},{"k":"p","t":"Il riscontro è fornito entro tre mesi dalla data dell'avviso di ricevimento o, in mancanza di avviso, entro tre mesi dalla scadenza dei sette giorni dalla ricezione."},{"k":"t","r":[["Contenuto ammesso","Contenuto non ammesso"],["Esito dell'istruttoria in termini di fondatezza","Identità delle persone sentite"],["Archiviazione con indicazione della motivazione","Contenuto delle dichiarazioni acquisite"],["Avvio di procedimento disciplinare o di accertamento interno","Esito nominativo dei provvedimenti disciplinari"],["Trasmissione all'autorità competente","Documentazione del fascicolo istruttorio"],["Indicazione delle azioni correttive adottate","Dati personali di terzi non necessari"]]},{"k":"p","t":"Il riscontro è comunicato con la modalità che il segnalante ha indicato, ovvero, per il segnalante anonimo, resa disponibile sul canale attraverso il codice univoco."},{"k":"p","t":"2.1 Istruttoria non conclusa"},{"k":"p","t":"Se al termine dei tre mesi l'istruttoria non è conclusa, il gestore comunica comunque lo stato di avanzamento e i tempi previsti. Il silenzio non è ammesso, e legittima il ricorso al canale esterno."},{"k":"p","t":"3. PROVVEDIMENTI CONSEGUENTI"},{"k":"t","r":[["Ambito","Provvedimenti"],["Disciplinare","Attivazione del procedimento nei confronti dei responsabili, secondo il sistema disciplinare vigente"],["Organizzativo","Azioni correttive su procedure, controlli, deleghe e assetti che hanno reso possibile la condotta"],["Contrattuale","Provvedimenti verso fornitori e appaltatori, secondo le clausole applicabili"],["Giudiziario","Denuncia all'autorità competente, azione di responsabilità, costituzione di parte civile"],["Segnalazione a autorità di vigilanza","Nei casi previsti dalla normativa di settore"]]},{"k":"p","t":"Il gestore verifica l'effettiva attuazione dei provvedimenti proposti e ne dà conto nella relazione periodica."},{"k":"p","t":"3.1 Riservatezza nel procedimento disciplinare"},{"k":"p","t":"Nell'ambito del procedimento disciplinare l'identità del segnalante non può essere rivelata quando la contestazione è fondata su accertamenti distinti e ulteriori rispetto alla segnalazione, anche se conseguenti alla stessa. Quando la contestazione è fondata, in tutto o in parte, sulla segnalazione e la conoscenza dell'identità è indispensabile alla difesa dell'incolpato, la segnalazione è utilizzabile solo previo consenso espresso del segnalante alla rivelazione della sua identità."},{"k":"p","t":"Il gestore comunica per iscritto al segnalante le ragioni della rivelazione e ne acquisisce il consenso o il diniego (MOD-07.01). Il diniego comporta l'inutilizzabilità della segnalazione ai fini disciplinari, non l'archiviazione dell'accertamento condotto per altra via."},{"k":"p","t":"4. RESPONSABILITÀ DEL SEGNALANTE"},{"k":"p","t":"Le tutele non sono garantite quando è accertata, anche con sentenza di primo grado, la responsabilità penale del segnalante per diffamazione o calunnia, ovvero la sua responsabilità civile per dolo o colpa grave. In tali casi è irrogata una sanzione disciplinare."},{"k":"p","t":"La valutazione presuppone un accertamento: la sola infondatezza della segnalazione non integra dolo né colpa grave, e sanzionare il segnalante per una segnalazione infondata resa in buona fede costituisce essa stessa ritorsione."},{"k":"p","t":"5. ARCHIVIAZIONE"},{"k":"p","t":"Il fascicolo è archiviato con: relazione istruttoria, riscontro fornito, provvedimenti adottati e loro attuazione, data di decorrenza del termine di conservazione secondo la PWB-08."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Riscontri forniti entro 3 mesi","MOD-04.03","Trimestrale","100%"],["Comunicazioni di stato per istruttorie non concluse","MOD-06.01","Trimestrale","100%"],["Segnalazioni fondate con provvedimento adottato","MOD-06.02","Semestrale","100%"],["Azioni correttive attuate nei termini","MOD-06.02","Trimestrale","≥ 90%"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-06.01","Comunicazione di riscontro","Esito, motivazione, azioni, informazioni sul canale esterno"],["MOD-06.02","Registro dei provvedimenti conseguenti","Segnalazione, provvedimento, responsabile, attuazione, verifica"]]}]},"PWB-07":{"code":"PWB-07","titolo":"RISERVATEZZA E GESTIONE DELL'IDENTITÀ","fase":"Tutele","rif":"D.Lgs. 24/2023, art. 12 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-07","","",""],["Codice:","PWB-07","Revisione:","[Rev.]"],["Titolo:","RISERVATEZZA E GESTIONE DELL'IDENTITÀ","",""],["Riferimenti:","Tutele","",""],["Riferimenti:","D.Lgs. 24/2023, art. 12 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure a tutela della riservatezza dell'identità del segnalante, delle persone coinvolte e del contenuto della segnalazione."},{"k":"p","t":"2. OGGETTO DELLA TUTELA"},{"k":"p","t":"Sono coperti dalla riservatezza: l'identità del segnalante e ogni elemento da cui essa possa desumersi, anche indirettamente; l'identità della persona coinvolta e di quella menzionata; il contenuto della segnalazione e la relativa documentazione."},{"k":"p","t":"La tutela riguarda anche gli elementi indiretti: ruolo, sede, turno, area di attività, riferimenti temporali che rendano la persona riconoscibile in un contesto ristretto."},{"k":"p","t":"3. MISURE ORGANIZZATIVE"},{"k":"t","r":[["Misura","Attuazione"],["Separazione dei dati identificativi","I dati identificativi del segnalante sono conservati separatamente dal contenuto e collegati mediante codice; il registro generale non li contiene"],["Accesso limitato","Solo il gestore e le persone espressamente autorizzate accedono al fascicolo, ciascuna per quanto di competenza"],["Tracciamento degli accessi","Ogni accesso è registrato con data, soggetto e motivo (MOD-07.03)"],["Riservatezza nelle comunicazioni interne","Le richieste istruttorie sono formulate in modo da non rendere riconoscibile l'origine della verifica"],["Divieto di comunicazione","Nessuna comunicazione a soggetti non autorizzati, compresi superiori gerarchici del segnalante e funzioni del personale"],["Documentazione fisica","Conservazione in armadio o locale ad accesso controllato, con registro delle consultazioni"]]},{"k":"p","t":"4. MISURE TECNICHE"},{"k":"p","t":"Il canale informatico impiega strumenti di crittografia per il contenuto e per la documentazione allegata. Gli accessi sono autenticati e tracciati. I supporti sono protetti da accessi non autorizzati e da perdita di integrità."},{"k":"p","t":"4.1 Limiti degli strumenti generalisti"},{"k":"p","t":"Gli strumenti di uso generale — posta elettronica, archivi condivisi, applicativi di produttività, fogli di calcolo — non assicurano di per sé la riservatezza richiesta, perché prevedono ruoli di amministrazione che possono accedere al contenuto. Il loro utilizzo va valutato e, se adottato, accompagnato da misure compensative documentate."},{"k":"p","t":"5. RIVELAZIONE DELL'IDENTITÀ"},{"k":"p","t":"L'identità non può essere rivelata senza il consenso espresso del segnalante a soggetti diversi da quelli competenti a ricevere e dare seguito alle segnalazioni."},{"k":"t","r":[["Situazione","Regime"],["Procedimento disciplinare fondato su accertamenti distinti e ulteriori","L'identità non è rivelata"],["Procedimento disciplinare fondato in tutto o in parte sulla segnalazione","L'identità è rivelabile solo con consenso espresso, previa comunicazione scritta delle ragioni"],["Procedimento penale","Si applicano le regole del codice di procedura penale"],["Procedimento contabile","Si applicano le regole proprie del giudizio"],["Richiesta dell'autorità","Riscontro nei limiti dell'obbligo, con annotazione nel registro delle comunicazioni"]]},{"k":"p","t":"6. TRATTAMENTO DELLE VIOLAZIONI DELLA RISERVATEZZA"},{"k":"p","t":"Ogni evento che abbia comportato o possa aver comportato la conoscibilità dell'identità da parte di soggetti non autorizzati è registrato nel MOD-07.02, analizzato quanto alle cause, valutato quanto alla necessità di notifica ai sensi della normativa sui dati personali e trattato come violazione disciplinare a carico del responsabile."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Eventi di conoscibilità dell'identità","MOD-07.02","Trimestrale","0"],["Accessi al fascicolo tracciati","MOD-07.03","Trimestrale","100%"],["Rivelazioni con consenso espresso acquisito","MOD-07.01","Semestrale","100%"],["Riesame delle abilitazioni di accesso","MOD-03.02","Annuale","Nei termini"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-07.01","Comunicazione e consenso alla rivelazione dell'identità","Ragioni, consenso o diniego, effetti"],["MOD-07.02","Registro degli eventi di riservatezza","Evento, cause, valutazione, notifiche, azioni"],["MOD-07.03","Registro degli accessi al fascicolo","Data, soggetto, fascicolo, motivo dell'accesso"]]}]},"PWB-08":{"code":"PWB-08","titolo":"PROTEZIONE DEI DATI PERSONALI E CONSERVAZIONE","fase":"Tutele","rif":"D.Lgs. 24/2023, artt. 13, 14 · Regolamento (UE) 2016/679","blocks":[{"k":"t","r":[["PROCEDURA PWB-08","","",""],["Codice:","PWB-08","Revisione:","[Rev.]"],["Titolo:","PROTEZIONE DEI DATI PERSONALI E CONSERVAZIONE","",""],["Riferimenti:","Tutele","",""],["Riferimenti:","D.Lgs. 24/2023, artt. 13, 14 · Regolamento (UE) 2016/679","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce il regime di trattamento dei dati personali connesso alla gestione delle segnalazioni e i tempi di conservazione della documentazione."},{"k":"p","t":"2. RUOLI"},{"k":"t","r":[["Soggetto","Ruolo"],["[Nome Organizzazione]","Titolare del trattamento"],["Soggetto gestore esterno","Responsabile del trattamento, designato con atto ai sensi dell'art. 28 del Regolamento"],["Gestore interno e ufficio dedicato","Persone autorizzate al trattamento, designate per iscritto con istruzioni specifiche"],["Fornitore della piattaforma","Responsabile del trattamento, con misure tecniche verificate"]]},{"k":"p","t":"3. ADEMPIMENTI"},{"k":"t","r":[["Adempimento","Contenuto"],["Base giuridica","Adempimento di un obbligo legale cui è soggetto il titolare"],["Informativa","Fornita ai segnalanti e, con le modalità e nei tempi compatibili con l'istruttoria, alle persone coinvolte"],["Registro dei trattamenti","Annotazione del trattamento con finalità, categorie di dati e di interessati, tempi di conservazione, misure"],["Valutazione d'impatto","Effettuata in ragione della natura dei dati trattati e dei rischi per i diritti degli interessati"],["Misure di sicurezza","Crittografia, controllo degli accessi, tracciamento, separazione dei dati identificativi, formazione degli autorizzati"],["Violazioni dei dati","Gestione secondo la procedura applicabile, con valutazione della notifica all'autorità e della comunicazione agli interessati"]]},{"k":"p","t":"3.1 Minimizzazione"},{"k":"p","t":"I dati manifestamente non utili alla trattazione non sono raccolti; se raccolti, sono cancellati immediatamente. La cancellazione è annotata."},{"k":"p","t":"3.2 Limitazione dei diritti dell'interessato"},{"k":"p","t":"L'esercizio dei diritti dell'interessato può essere limitato quando ne possa derivare un pregiudizio effettivo e concreto alla tutela della riservatezza dell'identità del segnalante. La persona coinvolta non può, attraverso l'accesso ai propri dati, ottenere l'identità del segnalante."},{"k":"p","t":"Ogni richiesta è registrata nel MOD-08.03 con la valutazione svolta e la motivazione della limitazione eventualmente applicata."},{"k":"p","t":"4. CONSERVAZIONE"},{"k":"t","r":[["Documentazione","Termine"],["Segnalazione e documentazione connessa","Per il tempo necessario al trattamento e comunque non oltre cinque anni dalla data della comunicazione dell'esito finale"],["Registrazioni orali e verbali","Medesimo termine; le registrazioni sono cancellate alla scadenza"],["Registro delle segnalazioni","Medesimo termine per i dati riferibili al singolo caso; i dati aggregati e anonimizzati possono essere conservati oltre"],["Documentazione relativa a ritorsioni","Fino alla definizione del procedimento e comunque nei termini di prescrizione applicabili"],["Registro degli accessi","Cinque anni"]]},{"k":"p","t":"4.1 Cancellazione"},{"k":"p","t":"Alla scadenza la documentazione è cancellata o distrutta, con annotazione nel registro (MOD-08.04). La conservazione oltre il termine è ammessa solo in presenza di un obbligo o di un contenzioso in corso, con motivazione registrata."},{"k":"p","t":"La conservazione indefinita, comune nella pratica, è essa stessa una violazione: un fascicolo che resti accessibile anni dopo la chiusura è un rischio per il segnalante e per l'organizzazione."},{"k":"p","t":"5. REGISTRAZIONI ORALI"},{"k":"p","t":"La segnalazione orale è documentata, previo consenso del segnalante, mediante registrazione su dispositivo idoneo alla conservazione e all'ascolto, ovvero mediante verbale. In caso di verbale il segnalante può verificarlo, rettificarlo e confermarlo con la propria sottoscrizione."},{"k":"p","t":"6. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Fascicoli cancellati alla scadenza dei 5 anni","MOD-08.04","Semestrale","100%"],["Richieste degli interessati riscontrate nei termini","MOD-08.03","Trimestrale","100%"],["Valutazione d'impatto aggiornata","MOD-08.02","Annuale","Nei termini"],["Violazioni di dati connesse al canale","MOD-07.02","Trimestrale","0"]]},{"k":"p","t":"7. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-08.01","Informativa sul trattamento dei dati","Titolare, finalità, base giuridica, conservazione, diritti e limiti"],["MOD-08.02","Scheda di valutazione d'impatto","Trattamento, rischi, misure, esito, riesame"],["MOD-08.03","Registro delle richieste degli interessati","Richiesta, valutazione, limitazione applicata, riscontro"],["MOD-08.04","Registro delle cancellazioni","Fascicolo, termine, data di cancellazione, modalità, responsabile"]]}]},"PWB-09":{"code":"PWB-09","titolo":"MISURE DI PROTEZIONE E GESTIONE DELLE RITORSIONI","fase":"Tutele","rif":"D.Lgs. 24/2023, artt. 16÷19 · Linee guida ANAC","blocks":[{"k":"t","r":[["PROCEDURA PWB-09","","",""],["Codice:","PWB-09","Revisione:","[Rev.]"],["Titolo:","MISURE DI PROTEZIONE E GESTIONE DELLE RITORSIONI","",""],["Riferimenti:","Tutele","",""],["Riferimenti:","D.Lgs. 24/2023, artt. 16÷19 · Linee guida ANAC","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le misure di protezione dei soggetti tutelati, il monitoraggio della loro posizione e la gestione delle ritorsioni."},{"k":"p","t":"2. CONDIZIONI PER LA PROTEZIONE"},{"k":"p","t":"Le tutele si applicano quando: al momento della segnalazione il segnalante aveva fondato motivo di ritenere che le informazioni fossero vere e rientrassero nell'ambito oggettivo; la segnalazione è stata effettuata secondo le modalità previste."},{"k":"p","t":"Il motivo della segnalazione è irrilevante ai fini della protezione. Anche una segnalazione mossa da risentimento personale, se fondata su elementi veri, dà diritto alle tutele: subordinarle alla nobiltà delle intenzioni significa svuotarle."},{"k":"p","t":"3. SOGGETTI TUTELATI"},{"k":"p","t":"Oltre al segnalante: i facilitatori che lo assistono nel processo; le persone del medesimo contesto lavorativo legate da stabile legame affettivo o di parentela entro il quarto grado; i colleghi che abbiano un rapporto abituale e corrente; gli enti di proprietà del segnalante o per i quali lavora, e quelli che operano nel medesimo contesto lavorativo."},{"k":"p","t":"4. RITORSIONI VIETATE"},{"k":"t","r":[["Ambito","Condotte"],["Rapporto di lavoro","Licenziamento, sospensione, retrocessione o mancata promozione, mutamento di mansioni, trasferimento di sede, riduzione dello stipendio, modifica dell'orario"],["Formazione e carriera","Sospensione della formazione, note di merito negative, referenze negative"],["Disciplinare","Adozione di misure disciplinari o altra sanzione, anche pecuniaria"],["Relazionale","Coercizione, intimidazione, molestia, ostracismo"],["Contrattuale","Mancata conversione del contratto a termine, mancato rinnovo o risoluzione anticipata, risoluzione di contratti di fornitura"],["Reputazionale e patrimoniale","Danno all'immagine, pregiudizio economico, segnalazione impropria ad autorità, iscrizione in elenchi settoriali"],["Amministrativo","Revoca di licenze o permessi, richiesta di accertamenti psichiatrici o medici"]]},{"k":"p","t":"5. INVERSIONE DELL'ONERE DELLA PROVA"},{"k":"p","t":"Quando il soggetto tutelato dimostra di aver effettuato una segnalazione e di aver subito una misura pregiudizievole, si presume che essa sia ritorsiva. Grava sull'organizzazione l'onere di dimostrare che la misura è motivata da ragioni estranee alla segnalazione."},{"k":"p","t":"La conseguenza operativa è che ogni provvedimento adottato nei confronti di un soggetto tutelato deve essere documentato con motivazione autonoma, costituita e datata prima o indipendentemente dalla segnalazione. Una motivazione ricostruita a posteriori non regge la presunzione."},{"k":"p","t":"6. MONITORAGGIO"},{"k":"p","t":"Aperta una segnalazione, il gestore apre il monitoraggio della posizione dei soggetti tutelati (MOD-09.01), con periodicità stabilita e comunque semestrale, per la durata determinata in ragione del rischio."},{"k":"p","t":"6.1 Valutazione del rischio di ritorsione"},{"k":"t","r":[["Fattore","Effetto"],["Identità del segnalante conoscibile all'interno","Aumenta"],["Persona coinvolta in posizione gerarchicamente sovraordinata al segnalante","Aumenta"],["Contesto ristretto, dove i fatti sono riferibili a poche persone","Aumenta"],["Precedenti di ritorsione nell'organizzazione","Aumenta"],["Rapporto di lavoro precario o in scadenza","Aumenta"],["Segnalazione anonima con identità non ricostruibile","Riduce"]]},{"k":"p","t":"Il livello determina l'intensità del monitoraggio e le misure preventive: informazione mirata ai responsabili sugli obblighi, sottoposizione al gestore dei provvedimenti che riguardano i soggetti tutelati, canale diretto per la segnalazione di ritorsioni."},{"k":"p","t":"7. GESTIONE DELLA RITORSIONE CONTESTATA"},{"k":"t","r":[["Fase","Contenuto"],["Ricezione","Registrazione nel MOD-09.02; la contestazione può essere rivolta anche direttamente ad ANAC"],["Istruttoria","Accertamento della misura, della sua motivazione e della sua data; acquisizione della documentazione a supporto"],["Valutazione","Verifica dell'idoneità della motivazione a superare la presunzione"],["Esito","Rimozione della misura, reintegrazione, risarcimento; provvedimento disciplinare a carico del responsabile"],["Comunicazione","Al soggetto tutelato e, ove investita, ad ANAC"]]},{"k":"p","t":"Gli atti ritorsivi sono nulli."},{"k":"p","t":"8. MISURE DI SOSTEGNO"},{"k":"p","t":"Sono rese note ai soggetti tutelati le misure di sostegno previste dalla legge, comprese le informazioni e l'assistenza fornite dagli enti del terzo settore iscritti nell'elenco tenuto da ANAC."},{"k":"p","t":"9. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Segnalazioni con monitoraggio attivo","MOD-09.01","Trimestrale","100%"],["Ritorsioni contestate","MOD-09.02","Trimestrale","0"],["Ritorsioni accertate","MOD-09.02","Semestrale","0"],["Provvedimenti su soggetti tutelati sottoposti al gestore","MOD-09.03","Trimestrale","100%"],["Provvedimenti su soggetti tutelati con motivazione autonoma documentata","MOD-09.03","Trimestrale","100%"]]},{"k":"p","t":"10. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-09.01","Scheda di monitoraggio dei soggetti tutelati","Soggetti, rischio, periodicità, rilevazioni, esito"],["MOD-09.02","Registro delle ritorsioni contestate","Misura, data, motivazione addotta, istruttoria, esito"],["MOD-09.03","Verifica preventiva sui provvedimenti","Provvedimento, soggetto tutelato, motivazione autonoma, data, parere"]]}]},"PWB-10":{"code":"PWB-10","titolo":"CANALE ESTERNO, DIVULGAZIONE PUBBLICA E DENUNCIA","fase":"Processo","rif":"D.Lgs. 24/2023, artt. 6÷15","blocks":[{"k":"t","r":[["PROCEDURA PWB-10","","",""],["Codice:","PWB-10","Revisione:","[Rev.]"],["Titolo:","CANALE ESTERNO, DIVULGAZIONE PUBBLICA E DENUNCIA","",""],["Riferimenti:","Processo","",""],["Riferimenti:","D.Lgs. 24/2023, artt. 6÷15","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le condizioni di ricorso al canale esterno gestito da ANAC, alla divulgazione pubblica e alla denuncia all'autorità giudiziaria o contabile, e gli obblighi informativi dell'organizzazione al riguardo."},{"k":"p","t":"2. CANALE ESTERNO"},{"k":"p","t":"Il segnalante può ricorrere al canale esterno quando ricorre una delle condizioni seguenti:"},{"k":"p","t":"il canale interno non è attivo, ovvero non è conforme a quanto previsto dalla legge;"},{"k":"p","t":"il segnalante ha già effettuato una segnalazione interna e questa non ha avuto seguito;"},{"k":"p","t":"il segnalante ha fondati motivi di ritenere che la segnalazione interna non avrebbe efficace seguito, ovvero che possa determinare il rischio di ritorsione;"},{"k":"p","t":"il segnalante ha fondato motivo di ritenere che la violazione possa costituire un pericolo imminente o palese per il pubblico interesse."},{"k":"p","t":"Il ricorso al canale esterno non richiede l'esaurimento del canale interno quando ricorra una di tali condizioni. L'organizzazione non può ostacolarlo né trattarlo come inadempimento."},{"k":"p","t":"3. OBBLIGO INFORMATIVO"},{"k":"p","t":"L'organizzazione mette a disposizione informazioni chiare sul canale esterno e sulle condizioni per ricorrervi, nella medesima sezione in cui pubblica le informazioni sul canale interno. L'omissione è sanzionata."},{"k":"p","t":"4. DIVULGAZIONE PUBBLICA"},{"k":"p","t":"Il segnalante che effettua una divulgazione pubblica beneficia delle tutele quando: ha previamente effettuato una segnalazione interna ed esterna, o direttamente esterna, senza ricevere riscontro nei termini; ha fondato motivo di ritenere che la violazione possa costituire un pericolo imminente o palese per il pubblico interesse; ha fondato motivo di ritenere che la segnalazione esterna possa comportare rischio di ritorsione o non avere efficace seguito per il concreto pericolo di occultamento o distruzione di prove, o di collusione con l'autore."},{"k":"p","t":"5. DENUNCIA"},{"k":"p","t":"Restano ferme le facoltà e gli obblighi di denuncia all'autorità giudiziaria o contabile. La denuncia non è alternativa alla segnalazione e non fa venir meno le tutele."},{"k":"p","t":"6. RAPPORTI CON ANAC"},{"k":"p","t":"Le richieste di ANAC nell'ambito di procedimenti su segnalazioni o su comunicazioni di ritorsione sono riscontrate nei termini assegnati, con annotazione nel MOD-10.01. La documentazione trasmessa è pertinente e limitata a quanto richiesto."},{"k":"p","t":"Le comunicazioni sono gestite dal soggetto gestore in raccordo con la funzione legale, e la corrispondenza è conservata nel fascicolo."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Informazioni sul canale esterno pubblicate e aggiornate","MOD-11.01","Semestrale","Presenti"],["Richieste ANAC riscontrate nei termini","MOD-10.01","Trimestrale","100%"],["Procedimenti ANAC su ritorsioni","MOD-10.01","Semestrale","0"],["Segnalazioni pervenute per il tramite del canale esterno","MOD-10.01","Annuale","Monitoraggio"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-10.01","Registro delle comunicazioni con le autorità","Autorità, oggetto, termine, riscontro, documentazione trasmessa"]]}]},"PWB-11":{"code":"PWB-11","titolo":"INFORMAZIONE, FORMAZIONE E ACCESSIBILITÀ","fase":"Impianto","rif":"D.Lgs. 24/2023, art. 5 comma 1 lett. e) e art. 4","blocks":[{"k":"t","r":[["PROCEDURA PWB-11","","",""],["Codice:","PWB-11","Revisione:","[Rev.]"],["Titolo:","INFORMAZIONE, FORMAZIONE E ACCESSIBILITÀ","",""],["Riferimenti:","Impianto","",""],["Riferimenti:","D.Lgs. 24/2023, art. 5 comma 1 lett. e) e art. 4","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità con cui l'organizzazione rende note le informazioni sull'uso del canale e forma i soggetti coinvolti."},{"k":"p","t":"2. INFORMAZIONI DA RENDERE NOTE"},{"k":"t","r":[["Contenuto","Obbligatorio"],["Modalità di accesso al canale interno, scritto e orale","Sì"],["Diritto di chiedere un incontro diretto","Sì"],["Soggetto gestore e suoi recapiti","Sì"],["Condizioni per ricorrere al canale esterno ANAC e relativi recapiti","Sì"],["Condizioni per la divulgazione pubblica","Sì"],["Misure di riservatezza applicate","Sì"],["Divieto di ritorsione e misure di protezione","Sì"],["Misure di sostegno e enti del terzo settore iscritti presso ANAC","Sì"],["Trattamento dei dati personali e diritti dell'interessato","Sì"],["Ammissibilità della segnalazione anonima","Sì"]]},{"k":"p","t":"3. MODALITÀ DI DIFFUSIONE"},{"k":"t","r":[["Destinatari","Modalità"],["Personale in servizio","Comunicazione individuale ed esposizione nei luoghi di lavoro, in punti visibili e accessibili"],["Nuovi assunti","Consegna in sede di assunzione, con evidenza della ricezione"],["Lavoratori di appaltatori e fornitori","Clausola contrattuale che obbliga il contraente a rendere noto il canale ai propri addetti impiegati presso l'organizzazione"],["Candidati e soggetti in fase precontrattuale","Informazione nella documentazione di selezione"],["Pubblico e soggetti esterni","Sezione dedicata del sito, facilmente individuabile dalla pagina iniziale"]]},{"k":"p","t":"3.1 Accessibilità effettiva"},{"k":"p","t":"L'informazione va resa in forma comprensibile e, dove il contesto lo richieda, in lingua diversa dall'italiano. Un avviso pubblicato in una sezione raggiungibile solo attraverso più passaggi non soddisfa il requisito di facile accessibilità."},{"k":"p","t":"4. FORMAZIONE"},{"k":"t","r":[["Destinatari","Contenuti","Periodicità"],["Soggetto gestore e persone autorizzate","Disciplina, gestione del caso, tecniche di accertamento, riservatezza, protezione dei dati, gestione delle ritorsioni","All'incarico e annuale"],["Organo di indirizzo e organo di controllo","Obblighi dell'ente, responsabilità, divieto di ritorsione, sanzioni","All'insediamento e ogni 2 anni"],["Responsabili di funzione e preposti","Divieto di ritorsione, obblighi di riservatezza, condotte da tenere in presenza di una segnalazione","All'ingresso e ogni 2 anni"],["Tutto il personale","Ambito, canali, tutele, modalità di accesso","All'ingresso e ogni 3 anni"]]},{"k":"p","t":"5. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Informativa pubblicata e aggiornata","MOD-11.01","Semestrale","Presente"],["Personale informato sui canali","MOD-11.02","Annuale","100%"],["Formazione del gestore in corso di validità","MOD-11.03","Annuale","Valida"],["Contratti con clausola di informazione agli addetti dell'appaltatore","MOD-11.02","Semestrale","100%"]]},{"k":"p","t":"6. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-11.01","Informativa pubblica sui canali di segnalazione","Avviso da esporre e pubblicare, in forma accessibile"],["MOD-11.02","Registro della diffusione","Destinatari, modalità, data, evidenza"],["MOD-11.03","Registro della formazione","Sessione, destinatari, contenuti, durata, verifica, scadenza"]]}]},"PWB-12":{"code":"PWB-12","titolo":"MONITORAGGIO, RIESAME E RELAZIONE PERIODICA","fase":"Governo","rif":"D.Lgs. 24/2023 · Linee guida ANAC · D.Lgs. 231/2001 art. 6","blocks":[{"k":"t","r":[["PROCEDURA PWB-12","","",""],["Codice:","PWB-12","Revisione:","[Rev.]"],["Titolo:","MONITORAGGIO, RIESAME E RELAZIONE PERIODICA","",""],["Riferimenti:","Governo","",""],["Riferimenti:","D.Lgs. 24/2023 · Linee guida ANAC · D.Lgs. 231/2001 art. 6","",""],["Redatto da:","[Resp. Due Diligence]","Approvato da:","[Alta Direzione]"]]},{"k":"p","t":"1. SCOPO"},{"k":"p","t":"Definisce le modalità di monitoraggio del funzionamento del sistema, di rendicontazione all'organo di indirizzo e di riesame periodico."},{"k":"p","t":"2. MONITORAGGIO"},{"k":"p","t":"Il gestore mantiene aggiornati i dati sul funzionamento del canale: segnalazioni ricevute per canale e per ambito; rispetto dei termini di sette giorni e di tre mesi; esiti; provvedimenti adottati e loro attuazione; ritorsioni contestate e accertate; eventi di riservatezza; stato della conservazione."},{"k":"p","t":"3. RELAZIONE PERIODICA"},{"k":"p","t":"La relazione (MOD-12.02) è resa all'organo di indirizzo almeno annualmente, e all'organo di controllo e all'organismo di vigilanza ove istituiti."},{"k":"p","t":"3.1 Forma aggregata"},{"k":"p","t":"La relazione è redatta in forma aggregata e anonimizzata: non contiene identità di segnalanti, persone coinvolte o testimoni, né elementi da cui esse siano desumibili. Quando il numero di casi è ridotto, anche il dato aggregato può rendere riconoscibili le persone: in tal caso il livello di dettaglio è ulteriormente ridotto."},{"k":"p","t":"3.2 Segnalazioni che riguardano l'organo di indirizzo"},{"k":"p","t":"Se le segnalazioni riguardano componenti dell'organo di indirizzo, la relazione per la parte pertinente è resa all'organo di controllo."},{"k":"p","t":"4. LETTURA DEI DATI"},{"k":"p","t":"Un numero di segnalazioni pari a zero non è, di per sé, un buon risultato: è più spesso l'indice di un canale non conosciuto, non ritenuto affidabile o non accessibile. In tal caso il riesame verifica diffusione dell'informazione, accessibilità del canale, percezione di riservatezza e presenza di precedenti che abbiano scoraggiato l'uso."},{"k":"p","t":"Analogamente, una quota elevata di segnalazioni inammissibili per materia indica che l'informazione sull'ambito non è chiara, non che i lavoratori usino male il canale."},{"k":"p","t":"5. RIESAME"},{"k":"p","t":"Il riesame è svolto almeno annualmente e considera: esiti del monitoraggio; modifiche normative e delle linee guida; esiti di verifiche e di procedimenti ANAC; segnalazioni di malfunzionamento del canale; modifiche organizzative; adeguatezza delle risorse e della formazione; esiti delle prove di funzionamento."},{"k":"p","t":"Il riesame produce decisioni con responsabile e termine, riprese nel riesame successivo."},{"k":"p","t":"6. VERIFICHE SUL CANALE"},{"k":"p","t":"Sono svolte verifiche periodiche su: funzionamento tecnico del canale e delle sue modalità; effettiva limitazione degli accessi; tracciamento; rispetto dei termini di conservazione e avvenuta cancellazione; aggiornamento delle informazioni pubblicate."},{"k":"p","t":"7. INDICATORI"},{"k":"t","r":[["Indicatore","Fonte","Frequenza","Target"],["Relazione periodica resa nei termini","MOD-12.02","Annuale","Nei termini"],["Riesame svolto","MOD-12.01","Annuale","Nei termini"],["Decisioni del riesame attuate","MOD-12.01","Semestrale","≥ 85%"],["Verifiche sul canale eseguite","MOD-02.03","Semestrale","100%"],["Termini di legge rispettati","MOD-04.03","Trimestrale","100%"]]},{"k":"p","t":"8. DOCUMENTI COLLEGATI"},{"k":"t","r":[["Codice","Titolo","Contenuto"],["MOD-12.01","Verbale di riesame del sistema","Elementi considerati, valutazioni, decisioni, responsabili, termini"],["MOD-12.02","Relazione periodica sul funzionamento del canale","Dati aggregati, esiti, criticità, proposte"]]}]}},"mod":{"MOD-01.01":{"code":"MOD-01.01","pro":"PWB-01","titolo":"Politica sulle segnalazioni","blocks":[{"k":"t","r":[["MODULO MOD-01.01","",""],["Codice:","MOD-01.01","Revisione: [Rev.]"],["Titolo:","POLITICA SULLE SEGNALAZIONI",""],["Procedura:","PWB-01","Organizzazione: [Nome Organizzazione]"]]},{"k":"h","t":"IMPEGNI"},{"k":"p","t":"[Nome Organizzazione] considera la segnalazione delle violazioni uno strumento di tutela dell'integrità dell'organizzazione e dell'interesse pubblico, e non un atto di slealtà. Chi segnala contribuisce a far emergere condotte che l'organizzazione ha interesse a conoscere."},{"k":"p","t":"L'organizzazione assicura la riservatezza dell'identità del segnalante, delle persone coinvolte e del contenuto della segnalazione, con misure tecniche e organizzative adeguate, e limita l'accesso ai soli soggetti espressamente autorizzati."},{"k":"p","t":"L'organizzazione vieta ogni forma di ritorsione nei confronti di chi segnala, dei facilitatori e dei soggetti a essi collegati. Gli atti ritorsivi sono nulli e sono sanzionati sul piano disciplinare a carico di chi li adotta."},{"k":"p","t":"L'organizzazione garantisce la trattazione di ogni segnalazione ammissibile con diligenza e nei termini di legge, e fornisce riscontro motivato al segnalante."},{"k":"p","t":"Il ricorso al canale esterno gestito dall'Autorità Nazionale Anticorruzione, nei casi previsti dalla legge, non costituisce inadempimento e non è in alcun modo ostacolato."},{"k":"p","t":"L'organizzazione non tollera la violazione dell'obbligo di riservatezza sull'identità del segnalante, che costituisce di per sé illecito disciplinare indipendentemente dall'esito della segnalazione."},{"k":"t","r":[["Voce","Compilazione"],["Approvata da",""],["Data",""],["Modalità di diffusione",""],["Prossimo riesame",""]]},{"k":"sig"}]},"MOD-01.02":{"code":"MOD-01.02","pro":"PWB-01
