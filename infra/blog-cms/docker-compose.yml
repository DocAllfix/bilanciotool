# WordPress headless per Evalis Academy. Gira su una VPS Hetzner (CAX11 ARM va bene: qui
# WordPress serve JSON a Next.js, non pagine a migliaia di visitatori).
#
# ⚠️ PREDISPOSTO PER IL SECONDO SITO. Aggiungere bilanciotool significa: copiare il blocco
# `wp-evalis` cambiando nome, database e volume, aggiungere lo schema in `db-init/`, e
# aggiungere un blocco host nel Caddyfile. NIENTE di questo file va riprogettato.
# Gli schemi sono separati fin da ora proprio per questo: un database condiviso costringerebbe
# a una migrazione il giorno in cui si aggiunge il secondo sito.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # la password davanti a /wp-admin: la genera installa.sh, qui dentro non c'e' in chiaro
      ADMIN_UTENTE: ${ADMIN_UTENTE:?serve ADMIN_UTENTE}
      ADMIN_HASH: ${ADMIN_HASH:?serve ADMIN_HASH}
      ADMIN_UTENTE_EVALISDECK: ${ADMIN_UTENTE_EVALISDECK:?serve ADMIN_UTENTE_EVALISDECK}
      ADMIN_HASH_EVALISDECK: ${ADMIN_HASH_EVALISDECK:?serve ADMIN_HASH_EVALISDECK}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificati TLS: perderli significa rifare tutti i rilasci
      - caddy-config:/config
    depends_on:
      - wp-evalis
      - wp-evalisdeck
    networks: [rete-evalis, rete-evalisdeck]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?serve DB_ROOT_PASSWORD}
      MARIADB_DATABASE: wp_evalis
      MARIADB_USER: wpuser   # fisso: db-init/01-schemi.sql concede i permessi a questo nome
      MARIADB_PASSWORD: ${DB_PASSWORD:?serve DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      # ogni sito ha il SUO schema: il secondo blog aggiunge un file qui, non tocca il primo
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # il database sta su TUTTE le reti dei siti: e' l'unico servizio condiviso, e i permessi
    # per schema fanno il resto
    networks: [rete-evalis, rete-evalisdeck]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wp-evalis:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp_evalis
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      # il frontend a cui questo CMS parla: lo legge il mu-plugin per il webhook e l'anteprima
      WORDPRESS_CONFIG_EXTRA: |
        define('EVALIS_SITO_PUBBLICO', '${SITO_PUBBLICO:?serve SITO_PUBBLICO}');
        define('EVALIS_REVALIDATE_TOKEN', '${BLOG_WEBHOOK_TOKEN:?serve BLOG_WEBHOOK_TOKEN}');
        define('EVALIS_PREVIEW_TOKEN', '${BLOG_PREVIEW_TOKEN:?serve BLOG_PREVIEW_TOKEN}');
        /* dietro Caddy: senza questo WordPress genera URL in http e i redirect si avvitano */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('DISALLOW_FILE_EDIT', true);   /* niente editor di temi/plugin dalla dashboard */
        define('WP_AUTO_UPDATE_CORE', 'minor');
    volumes:
      - wp-evalis-data:/var/www/html
      # i nostri innesti: caricati sempre, non disattivabili per sbaglio dalla dashboard
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    networks: [rete-evalis]

# UNA RETE PER SITO. Con una rete sola, un WordPress compromesso vedrebbe l'altro WordPress e
# potrebbe bussare alla sua porta 80 dall'interno, dove non c'e' ne' Caddy ne' password. Con
# reti separate quel percorso non esiste proprio: restano raggiungibili solo il database (che
# gli serve, e dove i permessi sono per schema) e Caddy.
#
# Il secondo sito aggiunge `rete-bilancio` qui sotto, e la mette anche su `db` e su `caddy`.
  # --- SECONDO SITO: EvalisDeck --------------------------------------------------------------
  # Stesso mu-plugin montato, database suo, utente di database suo, rete sua.
  wp-evalisdeck:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp_evalisdeck
      WORDPRESS_DB_USER: wpuser_evalisdeck
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD_EVALISDECK:?serve DB_PASSWORD_EVALISDECK}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('EVALIS_SITO_PUBBLICO', '${SITO_PUBBLICO_EVALISDECK:?serve SITO_PUBBLICO_EVALISDECK}');
        define('EVALIS_REVALIDATE_TOKEN', '${BLOG_WEBHOOK_TOKEN_EVALISDECK:?serve BLOG_WEBHOOK_TOKEN_EVALISDECK}');
        define('EVALIS_PREVIEW_TOKEN', '${BLOG_PREVIEW_TOKEN_EVALISDECK:?serve BLOG_PREVIEW_TOKEN_EVALISDECK}');
        /* dietro Caddy: senza questo WordPress genera URL in http e i redirect si avvitano */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
    volumes:
      - wp-evalisdeck-data:/var/www/html
      # LO STESSO file dell'altro sito: le costanti arrivano dall'ambiente, quindi una
      # correzione al mu-plugin vale per entrambi i blog.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    networks: [rete-evalisdeck]


networks:
  rete-evalis:
    driver: bridge
  rete-evalisdeck:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  db-data:
  wp-evalis-data:
  wp-evalisdeck-data:
